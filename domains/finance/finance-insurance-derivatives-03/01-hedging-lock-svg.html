<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：农场主套保锁价器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌾 农场主套保锁价器：现货盈亏 + 期货对冲 = 利润纹丝不动（SVG）</h1><p>误区：做期货套保如果在期货账户上亏钱了，说明套保失败。真相：期货亏的时候现货正大赚！两者相加刚好把总利润死死锁住！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>半年后玉米市场价格</span><span id="vP">2600 元/吨</span></label><input id="p" type="range" min="1800" max="3400" step="100" value="2600" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">玉米现货收入</div><div class="k-val" id="kSpot">—</div></div>
      <div class="kpi"><div class="k-lbl">期货空单盈亏</div><div class="k-val" id="kFut">—</div></div>
      <div class="kpi"><div class="k-lbl">锁定到手总价</div><div class="k-val" style="color:#10b981;">2,600 元/吨</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const p=+document.getElementById('p').value;
      document.getElementById('vP').textContent=p+' 元/吨';
      const fut=2600-p;
      document.getElementById('svg').innerHTML=`
        <text x="20" y="50" font-size="12" font-weight="750" fill="var(--tax-text)">现货卖粮收入</text>
        <rect x="140" y="33" width="${(p/3600*360).toFixed(1)}" height="24" rx="5" fill="#2563eb"/>
        <text x="${(148+p/3600*360).toFixed(1)}" y="50" font-size="12" font-weight="750" fill="#2563eb">${p} 元</text>
        <text x="20" y="100" font-size="12" font-weight="750" fill="var(--tax-text)">期货空单对冲</text>
        <rect x="140" y="83" width="${(Math.abs(fut)/3600*360).toFixed(1)}" height="24" rx="5" fill="${fut>=0?'#10b981':'#ef4444'}"/>
        <text x="${(148+Math.abs(fut)/3600*360).toFixed(1)}" y="100" font-size="12" font-weight="750" fill="${fut>=0?'#10b981':'#ef4444'}">${fut>=0?'+':''}${fut} 元</text>
        <text x="20" y="150" font-size="12" font-weight="800" fill="#10b981">合计数锁死</text>
        <rect x="140" y="133" width="${(2600/3600*360).toFixed(1)}" height="24" rx="5" fill="#10b981"/>
        <text x="${(148+2600/3600*360).toFixed(1)}" y="150" font-size="12" font-weight="800" fill="#10b981">2600 元（纹丝不动）</text>
      `;
      document.getElementById('kSpot').textContent=p+' 元';
      document.getElementById('kFut').textContent=(fut>=0?'+':'')+fut+' 元';
      document.getElementById('kFut').style.color=fut>=0?'#10b981':'#ef4444';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>现货 (${p}) + 期货 (${fut>=0?'+':''}${fut}) = <strong>2600 元</strong>！不要因为期货账户亏钱就平掉套保，因为那正是现货大赚的时候。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
