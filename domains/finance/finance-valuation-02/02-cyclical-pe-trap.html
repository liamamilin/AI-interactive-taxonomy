<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：周期股低 PE 陷阱</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📉 周期股低 PE 陷阱：为什么周期顶峰 PE 最低反而是卖点？</h1><p>误区：看到煤炭/航运股 PE 只有 3 倍，觉得捡到大便宜赶紧满仓。真相：周期股顶峰利润虚高才把 PE 压到 3 倍，利润一跌回去 PE 瞬间变 50 倍！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>拖动观察周期阶段</span><span id="vPh">景气顶峰</span></label><input id="ph" type="range" min="0" max="5" step="1" value="2" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">当下每股利润</div><div class="k-val" id="kE">—</div></div>
      <div class="kpi"><div class="k-lbl">账面市盈率 PE</div><div class="k-val" id="kPE">—</div></div>
      <div class="kpi"><div class="k-lbl">操作陷阱提示</div><div class="k-val" id="kTip">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>const STAGES=[
      {lbl:'寒冬谷底', e:0.2, p:12, tip:'PE=60倍（极佳潜伏区）', col:'#10b981'},
      {lbl:'复苏初期', e:1.0, p:18, tip:'PE=18倍（盈利改善）', col:'#2563eb'},
      {lbl:'景气顶峰', e:8.0, p:24, tip:'PE=3倍（极度危险诱多！）', col:'#ef4444'},
      {lbl:'需求回落', e:3.0, p:17, tip:'PE=5.7倍（杀估值中）', col:'#f59e0b'},
      {lbl:'行业亏损', e:0.3, p:11, tip:'PE=36倍（泡沫出清）', col:'#94a3b8'},
      {lbl:'新一轮复苏', e:1.5, p:19, tip:'PE=12.7倍（重回增长）', col:'#10b981'}
    ];
    function draw(mark){
      const idx=+document.getElementById('ph').value;
      const s=STAGES[idx];
      document.getElementById('vPh').textContent=s.lbl;
      const x=i=>65+i*95, yE=v=>165-(v/8.5)*130;
      const path=STAGES.map((d,i)=>`${i?'L':'M'}${x(i)},${yE(d.e).toFixed(1)}`).join(' ');
      document.getElementById('svg').innerHTML=`
        <path d="${path}" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
        ${STAGES.map((d,i)=>`<circle cx="${x(i)}" cy="${yE(d.e).toFixed(1)}" r="${i===idx?8:4.5}" fill="${i===idx?s.col:'#94a3b8'}"/><text x="${x(i)}" y="184" text-anchor="middle" font-size="10.5" fill="${i===idx?s.col:'var(--tax-muted)'}">${d.lbl}</text>`).join('')}
        <text x="${x(idx)}" y="${Math.max(18,yE(s.e)-14).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="${s.col}">PE=${(s.p/s.e).toFixed(1)}倍</text>
      `;
      document.getElementById('kE').textContent=s.e.toFixed(1)+' 元';
      document.getElementById('kPE').textContent=(s.p/s.e).toFixed(1)+' 倍';
      document.getElementById('kPE').style.color=s.col;
      document.getElementById('kTip').textContent=s.tip;
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>记住反直觉铁律：<strong>周期股要在高 PE（利润寒冬）时买，在低 PE（利润顶峰）时卖！</strong>`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
