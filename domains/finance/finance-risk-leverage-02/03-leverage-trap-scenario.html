<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：金融杠杆审计台</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔍 金融杠杆审计台：哪些资产能借钱，哪些绝不能加杠杆？</h1><p>误区：杠杆只看利率低不低。真相：高波动资产+短期借贷=自杀组合；只有低波动+长期不抽贷的负债才相对可控！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn active" onclick="window.__userActed=true;pick(0,this)">30 年低息自住房贷（稳健）</button>
      <button class="btn" onclick="window.__userActed=true;pick(1,this)">券商两融满仓股票（中危）</button>
      <button class="btn" onclick="window.__userActed=true;pick(2,this)">网贷/信用卡炒加密货币（绝命）</button>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">资产波动率</div><div class="k-val" id="kVol">—</div></div>
      <div class="kpi"><div class="k-lbl">强制平仓压力</div><div class="k-val" id="kCall">—</div></div>
      <div class="kpi"><div class="k-lbl">风险评级</div><div class="k-val" id="kRisk">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>const DATA=[
      {vol:15, call:10, rate:20, lbl:'低波动 + 30年长期不抽贷', risk:'可控', col:'#10b981', tip:'30 年固定/低息房贷只要现金流覆盖月供，银行不会因为房价短暂跌 20% 而明天强平你！'},
      {vol:65, call:80, rate:50, lbl:'高波动 + 券商盯市强平', risk:'高危', col:'#f59e0b', tip:'股票可能连续跌停触发维持担保比例不足，券商随时强行平仓！'},
      {vol:95, call:98, rate:95, lbl:'极高波动 + 高息短债催收', risk:'绝命陷阱', col:'#ef4444', tip:'高息短债加上 80% 暴跌概率，一旦亏损不仅爆仓还背上高利贷，彻底毁掉财务人生！'}
    ];
    function pick(i,btn){
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      const d=DATA[i];
      document.getElementById('svg').innerHTML=`
        <text x="20" y="45" font-size="12" font-weight="750" fill="var(--tax-ink)">资产价格波动</text>
        <rect x="140" y="28" width="${(d.vol*3.8).toFixed(1)}" height="22" rx="5" fill="${d.col}"/>
        <text x="${(148+d.vol*3.8).toFixed(1)}" y="44" font-size="11.5" font-weight="750" fill="${d.col}">${d.vol}/100</text>
        <text x="20" y="95" font-size="12" font-weight="750" fill="var(--tax-ink)">中途强平压力</text>
        <rect x="140" y="78" width="${(d.call*3.8).toFixed(1)}" height="22" rx="5" fill="${d.col}"/>
        <text x="${(148+d.call*3.8).toFixed(1)}" y="94" font-size="11.5" font-weight="750" fill="${d.col}">${d.call}/100</text>
        <text x="20" y="145" font-size="12" font-weight="750" fill="var(--tax-ink)">资金利息成本</text>
        <rect x="140" y="128" width="${(d.rate*3.8).toFixed(1)}" height="22" rx="5" fill="${d.col}"/>
        <text x="${(148+d.rate*3.8).toFixed(1)}" y="144" font-size="11.5" font-weight="750" fill="${d.col}">${d.rate}/100</text>
      `;
      document.getElementById('kVol').textContent=d.vol+'/100';
      document.getElementById('kCall').textContent=d.call+'/100';
      document.getElementById('kRisk').textContent=d.risk;
      document.getElementById('kRisk').style.color=d.col;
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>${d.tip}`;
      if(window.__userActed && window.ToySDK) window.ToySDK.markCompleted();
    }
    pick(0, document.querySelector('.btn.active'));</script>
</body>
</html>
