<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：DCF 估值体检台</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧪 DCF 估值体检台：改 1% 永续增长率就能把估值吹翻倍？</h1><p>误区：看到投行一份精密的 DCF 估值报告就深信不疑。真相：终值公式 CF/(r-g) 对假设极度敏感，微调 g 就能人为操纵翻倍估值！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>永续增长率 g</span><span id="vG">3.0%</span></label><input id="g" type="range" min="1" max="6" step="0.5" value="3" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>折现率 WACC (r)</span><span id="vR">8.0%</span></label><input id="r" type="range" min="7" max="12" step="0.5" value="8" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">r - g 剪刀差</div><div class="k-val" id="kSp" style="color:#f59e0b;">—</div></div>
      <div class="kpi"><div class="k-lbl">终值估值倍数</div><div class="k-val" id="kMult" style="color:#2563eb;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const g=+document.getElementById('g').value;
      const r=+document.getElementById('r').value;
      document.getElementById('vG').textContent=g.toFixed(1)+'%';
      document.getElementById('vR').textContent=r.toFixed(1)+'%';
      const spread=Math.max(1, r-g);
      const mult=100/spread;
      const bars=[1,2,3,4,5,6].map(gi=>{
        const sp=Math.max(1, r-gi);
        const m=100/sp;
        const isCur=Math.abs(gi-g)<0.3;
        return {gi, m, isCur};
      });
      document.getElementById('svg').innerHTML=bars.map((b,i)=>{
        const h=Math.min(140, b.m*1.4);
        const x=65+i*85;
        return `<rect x="${x}" y="${(162-h).toFixed(1)}" width="44" height="${h.toFixed(1)}" rx="5" fill="${b.isCur?'#2563eb':'#94a3b8'}" opacity="${b.isCur?0.95:0.45}"/>
        <text x="${x+22}" y="${(156-h).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="750" fill="${b.isCur?'#2563eb':'var(--tax-muted)'}">${b.m.toFixed(0)}x</text>
        <text x="${x+22}" y="178" text-anchor="middle" font-size="11" fill="var(--tax-muted)">g=${b.gi}%</text>`;
      }).join('');
      document.getElementById('kSp').textContent=spread.toFixed(1)+'%';
      document.getElementById('kMult').textContent=mult.toFixed(1)+' 倍';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>“垃圾进，垃圾出”！当前 WACC=${r}%、永续增长 g=${g}% 时，估值为 <strong>${mult.toFixed(1)} 倍</strong>现金流；只要分析师偷偷把 g 调高 2%，估值就能翻倍！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
