<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：科技成长股 vs 传统收息股</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎢 科技成长股 vs 传统收息股：为什么加息专杀远期概念股？</h1><p>误区：加息对所有股票的打击都一样大。真相：现金流集中在 10 年后的高成长股“久期”极长，对利率变动极度敏感！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>市场折现率变化</span><span id="vR">6%</span></label><input id="r" type="range" min="2" max="14" step="0.5" value="6" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">现金奶牛股（近端分红）估值</div><div class="k-val" id="kVal" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">远期梦想股（10年后爆发）估值</div><div class="k-val" id="kGro" style="color:#ef4444;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const r=+document.getElementById('r').value/100;
      document.getElementById('vR').textContent=(r*100).toFixed(1)+'%';
      const valCF=[100,100,100,100,100,100,100,100,100,100];
      const groCF=[0,0,0,0,0,20,50,150,350,700];
      const pv=arr=>arr.reduce((s,c,i)=>s+c/Math.pow(1+r,i+1),0);
      const v0=pv(valCF), g0=pv(groCF);
      const ptsV=[], ptsG=[];
      for(let rt=2;rt<=14;rt+=1){
        const rv=rt/100;
        const x=55+(rt-2)*42;
        ptsV.push(`${rt===2?'M':'L'}${x},${(175-(pv(valCF)/1000)*140).toFixed(1)}`);
        ptsG.push(`${rt===2?'M':'L'}${x},${(175-(pv(groCF)/1000)*140).toFixed(1)}`);
      }
      const cx=55+((r*100)-2)*42;
      document.getElementById('svg').innerHTML=`
        <line x1="55" y1="175" x2="565" y2="175" stroke="var(--tax-border)"/>
        <path d="${ptsV.join(' ')}" fill="none" stroke="#10b981" stroke-width="3"/>
        <path d="${ptsG.join(' ')}" fill="none" stroke="#ef4444" stroke-width="3"/>
        <line x1="${cx.toFixed(1)}" y1="20" x2="${cx.toFixed(1)}" y2="175" stroke="var(--tax-muted)" stroke-dasharray="4,4"/>
        <circle cx="${cx.toFixed(1)}" cy="${(175-(v0/1000)*140).toFixed(1)}" r="5" fill="#10b981"/>
        <circle cx="${cx.toFixed(1)}" cy="${(175-(g0/1000)*140).toFixed(1)}" r="5" fill="#ef4444"/>
      `;
      document.getElementById('kVal').textContent=v0.toFixed(0)+' 万';
      document.getElementById('kGro').textContent=g0.toFixed(0)+' 万';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>红线（远期梦想股）斜率陡峭得多！当折现率从 2% 升到 12%，近端现金牛只跌去约 35%，而远期画饼股估值直接暴跌超过 65%！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
