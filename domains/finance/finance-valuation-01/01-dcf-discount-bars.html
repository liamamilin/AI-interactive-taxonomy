<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：现金流折现压缩机</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🗜️ 现金流折现压缩机：利率一高，远期画的大饼瞬间缩水！</h1><p>误区：未来 10 年每年赚 100 万，公司就值 1000 万。真相：未来的钱必须按折现率打折，利率越高，远期现金流被压得越扁！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>折现率（无风险利率+风险溢价）</span><span id="vR">8%</span></label><input id="r" type="range" min="2" max="18" step="0.5" value="8" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>每年自由现金流</span><span id="vC">100 万</span></label><input id="cf" type="range" min="50" max="200" step="10" value="100" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">10 年名义现金流总和</div><div class="k-val" id="kNom">—</div></div>
      <div class="kpi"><div class="k-lbl">折现到今天的真实估值</div><div class="k-val" id="kPv" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">第 10 年那笔钱折现值</div><div class="k-val" id="kY10" style="color:#ef4444;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const r=+document.getElementById('r').value/100;
      const cf=+document.getElementById('cf').value;
      document.getElementById('vR').textContent=(r*100).toFixed(1)+'%';
      document.getElementById('vC').textContent=cf+' 万';
      let totPv=0, bars='';
      for(let t=1;t<=10;t++){
        const pv=cf/Math.pow(1+r,t);
        totPv+=pv;
        const x=48+(t-1)*52, hNom=145, hPv=(pv/cf)*145;
        bars+=`<rect x="${x}" y="${175-hNom}" width="32" height="${hNom}" rx="4" fill="var(--tax-border)" opacity="0.45"/>
        <rect x="${x}" y="${(175-hPv).toFixed(1)}" width="32" height="${hPv.toFixed(1)}" rx="4" fill="#2563eb"/>
        <text x="${x+16}" y="${(170-hPv).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="750" fill="#2563eb">${pv.toFixed(0)}</text>
        <text x="${x+16}" y="192" text-anchor="middle" font-size="10.5" fill="var(--tax-muted)">Y${t}</text>`;
      }
      const y10=cf/Math.pow(1+r,10);
      document.getElementById('svg').innerHTML=bars;
      document.getElementById('kNom').textContent=(cf*10)+' 万';
      document.getElementById('kPv').textContent=totPv.toFixed(1)+' 万';
      document.getElementById('kY10').textContent=y10.toFixed(1)+' 万';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>折现率设在 <strong>${(r*100).toFixed(1)}%</strong> 时，第 10 年的 ${cf} 万现金流折到今天只值 <strong>${y10.toFixed(1)} 万</strong>！这就是为什么美联储一加息，远期科技股估值立刻腰斩。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
