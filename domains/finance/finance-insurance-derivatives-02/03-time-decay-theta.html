<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：期权时间价值衰减</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⏳ 时间价值（Theta）流失赛：为什么买末日期权十赌九输？</h1><p>误区：买个离到期还有 1 个月的虚值期权慢慢等大涨。真相：期权时间价值按剩余时间的平方根 √T 衰减，最后两周会断崖式融化归零！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn active" onclick="setMode('atm',this)">平值期权（时间价值最大）</button>
      <button class="btn" onclick="setMode('otm',this)">虚值彩票期权（归零最快）</button>
    </div>
    <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>距离到期剩余天数</span><span id="vD">45 天</span></label><input id="days" type="range" min="1" max="90" step="1" value="45" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">剩余时间价值</div><div class="k-val" id="kVal" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">每日融化速度 (Theta)</div><div class="k-val" id="kTheta" style="color:#ef4444;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>let mode='atm';
    function setMode(m,btn){
      mode=m;
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      draw(true);
    }
    function valAt(d){
      const base=Math.sqrt(d/90)*100;
      return mode==='atm' ? base : base*(d/90);
    }
    function draw(mark){
      const d=+document.getElementById('days').value;
      document.getElementById('vD').textContent=d+' 天';
      const pts=[];
      for(let t=90;t>=0;t-=3){
        const v=valAt(t);
        pts.push(`${t===90?'M':'L'}${(50+(90-t)*5.5).toFixed(1)},${(170-v*1.35).toFixed(1)}`);
      }
      const curV=valAt(d), prevV=valAt(Math.min(90,d+1));
      const theta=prevV-curV;
      const cx=50+(90-d)*5.5, cy=170-curV*1.35;
      document.getElementById('svg').innerHTML=`
        <rect x="${50+70*5.5}" y="20" width="${20*5.5}" height="150" fill="#ef4444" opacity="0.1"/>
        <text x="${50+80*5.5}" y="36" text-anchor="middle" font-size="10.5" fill="#ef4444">末日加速融化区</text>
        <line x1="50" y1="170" x2="545" y2="170" stroke="var(--tax-border)"/>
        <path d="${pts.join(' ')}" fill="none" stroke="#ef4444" stroke-width="3.5"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="#2563eb"/>
        <text x="295" y="188" text-anchor="middle" font-size="11" fill="var(--tax-muted)">剩余 90 天 → 0 天</text>
      `;
      document.getElementById('kVal').textContent=curV.toFixed(1)+'%';
      document.getElementById('kTheta').textContent='-'+theta.toFixed(2)+'% /天';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>记住公式里的 √T！离到期越近（当前剩 <strong>${d} 天</strong>），时间价值每天融化 <strong>-${theta.toFixed(2)}%</strong>，买末日期权就像抱着融化的冰块赛跑！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
