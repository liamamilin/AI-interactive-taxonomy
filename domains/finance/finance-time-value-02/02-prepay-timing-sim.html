<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：提前还贷黄金窗口计算器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; transition:.15s; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⏳ 提前还贷黄金窗口计算器：第几年还最省钱？</h1><p>误区：什么时候提前还房贷都省一样多利息。真相：等额本息超过 1/3 周期后，利息大部分已经交完了，提前还贷性价比暴跌！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>选择提前还清时间</span><span id="vT">第 5 年</span></label><input id="t" type="range" min="1" max="29" step="1" value="5" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>贷款年利率</span><span id="vR">3.8%</span></label><input id="r" type="range" min="2.5" max="6" step="0.1" value="3.8" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>贷款总额（30年期）</span><span id="vP">100 万</span></label><input id="p" type="range" min="50" max="300" step="10" value="100" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">已累计缴纳利息</div><div class="k-val" id="kPaid" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">提前还清节省利息</div><div class="k-val" id="kSave" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">剩余未还本金</div><div class="k-val" id="kRem">—</div></div>
      <div class="kpi"><div class="k-lbl">性价比评级</div><div class="k-val" id="kGrade" style="color:#2563eb;">—</div></div>
    </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    function draw(mark){
      const T=+document.getElementById('t').value;
      const r=(+document.getElementById('r').value/100)/12;
      const P=+document.getElementById('p').value*10000;
      const N=360;
      document.getElementById('vT').textContent='第 '+T+' 年';
      document.getElementById('vR').textContent=document.getElementById('r').value+'%';
      document.getElementById('vP').textContent=(P/10000).toFixed(0)+' 万';
      const emi=P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1);
      let rem=P, totInt=0, paidAtT=0, remAtT=0;
      const saveArr=[];
      for(let m=1;m<=N;m++){
        const intr=rem*r;
        const pr=emi-intr;
        rem=Math.max(0,rem-pr);
        totInt+=intr;
        if(m===T*12){ paidAtT=totInt; remAtT=rem; }
        if(m%12===0) saveArr.push(totInt);
      }
      const saved=totInt-paidAtT;
      const pct=saved/totInt*100;
      const pts=saveArr.map((v,i)=>`${i?'L':'M'}${(48+i*(520/29)).toFixed(1)},${(180-(1-v/totInt)*145).toFixed(1)}`).join(' ');
      const cx=48+(T-1)*(520/29), cy=180-(saved/totInt)*145;
      document.getElementById('svg').innerHTML=`
        <rect x="48" y="25" width="${(10*(520/29)).toFixed(1)}" height="155" fill="#10b981" opacity="0.1"/>
        <text x="120" y="42" font-size="11" font-weight="700" fill="#10b981">黄金省息窗口（前10年）</text>
        <line x1="48" y1="180" x2="570" y2="180" stroke="var(--tax-border)"/>
        <path d="${pts}" fill="none" stroke="#2563eb" stroke-width="3"/>
        <line x1="${cx.toFixed(1)}" y1="25" x2="${cx.toFixed(1)}" y2="180" stroke="#f59e0b" stroke-dasharray="4,4"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="#f59e0b"/>
        <text x="${Math.min(540,cx+8).toFixed(1)}" y="${Math.max(38,cy-8).toFixed(1)}" font-size="11.5" font-weight="800" fill="#f59e0b">省 ${(saved/10000).toFixed(1)}万 (${pct.toFixed(0)}%)</text>
      `;
      document.getElementById('kPaid').textContent=(paidAtT/10000).toFixed(1)+' 万';
      document.getElementById('kSave').textContent=(saved/10000).toFixed(1)+' 万';
      document.getElementById('kRem').textContent=(remAtT/10000).toFixed(1)+' 万';
      document.getElementById('kGrade').textContent=T<=10?'极高（黄金期）':T<=18?'中等':'偏低（尾期）';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>在第 <strong>${T}</strong> 年提前还清，可省下 <strong>${(saved/10000).toFixed(1)} 万</strong> 利息（占总利息 ${pct.toFixed(0)}%）。如果已还满 15 年以上，手中现金拿去稳健理财往往比提前还贷更划算！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);
  </script>
</body>
</html>
