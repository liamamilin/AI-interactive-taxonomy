<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：定投微笑曲线 vs 哭脸曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>😊 定投微笑曲线 vs 倒霉哭脸曲线</h1><p>误区：定投只要坚持就一定赚钱，跌了最稳。真相：定投最怕先涨后跌（倒V哭脸），最爱先跌后涨（微笑曲线）！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn active" onclick="window.__userActed=true;setShape('smile',this)">😊 微笑曲线（先跌后涨）</button>
      <button class="btn" onclick="window.__userActed=true;setShape('frown',this)">😭 哭脸曲线（先涨后跌）</button>
      <button class="btn" onclick="window.__userActed=true;setShape('up',this)">📈 单边慢牛</button>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">累计投入本金</div><div class="k-val">10.0 万</div></div>
      <div class="kpi"><div class="k-lbl">期末平均持仓成本</div><div class="k-val" id="kAvg">—</div></div>
      <div class="kpi"><div class="k-lbl">最终总收益率</div><div class="k-val" id="kRet">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function setShape(sh,btn){
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      const prices = sh==='smile' ? [1.0,0.8,0.6,0.5,0.55,0.65,0.75,0.85,0.95,1.0]
        : sh==='frown' ? [1.0,1.25,1.45,1.6,1.5,1.35,1.2,1.1,1.02,1.0]
        : [1.0,1.05,1.1,1.15,1.2,1.25,1.3,1.35,1.4,1.45];
      let shares=0;
      prices.forEach(p=>shares+=1/p);
      const avg=10/shares;
      const val=shares*prices[9];
      const ret=(val-10)/10*100;
      const x=i=>55+i*54, y=v=>180-(v/1.7)*145;
      const p=prices.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v).toFixed(1)}`).join(' ');
      document.getElementById('svg').innerHTML=`
        <line x1="55" y1="${y(avg).toFixed(1)}" x2="545" y2="${y(avg).toFixed(1)}" stroke="#f59e0b" stroke-dasharray="5,4" stroke-width="2"/>
        <text x="545" y="${y(avg)-5}" text-anchor="end" font-size="11" font-weight="750" fill="#f59e0b">定投平均成本 ${avg.toFixed(2)}</text>
        <path d="${p}" fill="none" stroke="${ret>=0?'#10b981':'#ef4444'}" stroke-width="3.5"/>
        ${prices.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v).toFixed(1)}" r="4" fill="#2563eb"/>`).join('')}
      `;
      document.getElementById('kAvg').textContent=avg.toFixed(2)+' 元';
      document.getElementById('kRet').textContent=(ret>=0?'+':'')+ret.toFixed(1)+'%';
      document.getElementById('kRet').style.color=ret>=0?'#10b981':'#ef4444';
      document.getElementById('ahaBox').innerHTML=sh==='smile'
        ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>净值最后只回到原点 1.00，但因为你在底部 0.5~0.6 攒了大量便宜筹码，平均成本拉低到 <strong>${avg.toFixed(2)}</strong>，最终大赚 <strong>+${ret.toFixed(1)}%</strong>！`
        : sh==='frown'
        ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>同样回到起点 1.00，先涨后跌让你在山顶买了一堆高价筹码，平均成本高达 <strong>${avg.toFixed(2)}</strong>，最终反亏 <strong>${ret.toFixed(1)}%</strong>！`
        : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>单边慢牛虽然赚钱，但成本一路被抬高到 ${avg.toFixed(2)}，不如微笑曲线在底部吸筹效率高！`;
      if(window.__userActed && window.ToySDK) window.ToySDK.markCompleted();
    }
    setShape('smile', document.querySelector('.btn.active'));</script>
</body>
</html>
