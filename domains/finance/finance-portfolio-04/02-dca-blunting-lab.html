<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：定投钝化探测器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚖️ 定投钝化探测器：为什么第 10 年的定投几乎摊不动成本？</h1><p>误区：只要一直定投，暴跌时随时都能快速拉低持仓成本。真相：当存量账户滚到 100 万，每月新投 5000 元连 0.5% 的波动都拉不动！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>当前已有定投年数</span><span id="vY">8 年</span></label><input id="yrs" type="range" min="1" max="20" step="1" value="8" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>市场突然暴跌</span><span id="vD">-30%</span></label><input id="dip" type="range" min="10" max="50" step="5" value="30" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">暴跌前存量市值</div><div class="k-val" id="kStock">—</div></div>
      <div class="kpi"><div class="k-lbl">新增 1 期定投占比</div><div class="k-val" id="kShare" style="color:#f59e0b;">—</div></div>
      <div class="kpi"><div class="k-lbl">新定投拉低成本幅度</div><div class="k-val" id="kImp" style="color:#2563eb;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const Y=+document.getElementById('yrs').value;
      const dip=+document.getElementById('dip').value;
      document.getElementById('vY').textContent=Y+' 年';
      document.getElementById('vD').textContent='-'+dip+'%';
      const stock=Y*12*0.5;
      const afterDip=stock*(1-dip/100);
      const add=0.5;
      const pct=add/(afterDip+add)*100;
      const imp=pct*(dip/100);
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">存量市值（跌后）</text>
        <rect x="160" y="36" width="${Math.min(360, afterDip*3.5).toFixed(1)}" height="28" rx="6" fill="#2563eb"/>
        <text x="${(168+Math.min(360, afterDip*3.5)).toFixed(1)}" y="55" font-size="12" font-weight="750" fill="#2563eb">${afterDip.toFixed(1)} 万</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-ink)">本月新投 0.5 万</text>
        <rect x="160" y="96" width="${Math.max(4, 0.5*3.5).toFixed(1)}" height="28" rx="3" fill="#10b981"/>
        <text x="172" y="115" font-size="12" font-weight="750" fill="#10b981">仅占 ${pct.toFixed(2)}%</text>
      `;
      document.getElementById('kStock').textContent=stock.toFixed(1)+' 万';
      document.getElementById('kShare').textContent=pct.toFixed(2)+'%';
      document.getElementById('kImp').textContent='-'+imp.toFixed(2)+'%';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>定投第 <strong>${Y}</strong> 年时，存量资金已达 ${stock.toFixed(0)} 万，单月新投只能占 <strong>${pct.toFixed(2)}%</strong>，这就是“定投钝化”——后期必须靠资产再平衡与止盈控制风险！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
