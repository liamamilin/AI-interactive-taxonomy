<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：货币乘数造币机</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏦 货币乘数造币机：100 元存进银行如何滚出 1000 元？</h1><p>误区：社会上的货币全靠央行印钞机印出来。真相：商业银行通过“部分准备金+循环放贷”，可以把 100 元基础货币放大成 1000 元广义货币 M2！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>法定存款准备金率 r</span><span id="vR">10%</span></label><input id="r" type="range" min="5" max="30" step="1" value="10" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">理论货币乘数 (1/r)</div><div class="k-val" id="kMult" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">100 元基础货币最终派生 M2</div><div class="k-val" id="kM2" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const r=+document.getElementById('r').value/100;
      document.getElementById('vR').textContent=(r*100).toFixed(0)+'%';
      const mult=1/r;
      let bars='', cur=100;
      for(let i=0;i<8;i++){
        const h=(cur/100)*135;
        const x=50+i*64;
        bars+=`<rect x="${x}" y="${(165-h).toFixed(1)}" width="42" height="${h.toFixed(1)}" rx="5" fill="#2563eb" opacity="${(1-i*0.09).toFixed(2)}"/>
        <text x="${x+21}" y="${(158-h).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="750" fill="var(--tax-ink)">${cur.toFixed(0)}</text>
        <text x="${x+21}" y="182" text-anchor="middle" font-size="10" fill="var(--tax-muted)">第${i+1}轮</text>`;
        cur=cur*(1-r);
      }
      document.getElementById('svg').innerHTML=bars;
      document.getElementById('kMult').textContent=mult.toFixed(1)+' 倍';
      document.getElementById('kM2').textContent=(100*mult).toFixed(0)+' 元';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>当准备金率为 ${(r*100).toFixed(0)}%，商业银行每收到 100 元存款就放贷 ${(100*(1-r)).toFixed(0)} 元，循环往复把货币总量放大了 <strong>${mult.toFixed(1)} 倍</strong>（达 ${(100*mult).toFixed(0)} 元）！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
