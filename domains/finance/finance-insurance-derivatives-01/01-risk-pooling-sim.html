<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：风险池大数聚合器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🛟 风险池大数聚合器：10 人保单会破产，10 万人稳赚（SVG）</h1><p>误区：保险公司赌的是个人运气。真相：当参保人数 N 足够大，大数定律让赔付率方差按 √N 缩小，不确定的风险变成了确定的算术！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn primary" onclick="sim(true)">🎲 重新抽样赔付</button>
    </div>
    <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>风险池参保人数 N</span><span id="vN">100 人</span></label><input id="nExp" type="range" min="1" max="5" step="0.5" value="2" oninput="sim(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">精算预期赔付率</div><div class="k-val" style="color:#2563eb;">1.00%</div></div>
      <div class="kpi"><div class="k-lbl">本次模拟真实赔付率</div><div class="k-val" id="kReal">—</div></div>
      <div class="kpi"><div class="k-lbl">保险公司破产波动风险</div><div class="k-val" id="kRisk">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function sim(mark){
      const exp=+document.getElementById('nExp').value;
      const N=Math.round(Math.pow(10,exp));
      document.getElementById('vN').textContent=N.toLocaleString()+' 人';
      const p=0.01;
      const sd=Math.sqrt(p*(1-p)/N)*100;
      const noise=(Math.random()+Math.random()+Math.random()-1.5)*1.2;
      const real=Math.max(0, p*100 + noise*sd);
      const pts=[];
      for(let k=1;k<=5;k+=0.2){
        const nk=Math.pow(10,k);
        const sdk=Math.sqrt(p*(1-p)/nk)*100;
        const x=55+((k-1)/4)*495;
        const yU=92-Math.min(75,sdk*8), yL=92+Math.min(75,sdk*8);
        pts.push({x,yU,yL});
      }
      const upper=pts.map((d,i)=>`${i?'L':'M'}${d.x.toFixed(1)},${d.yU.toFixed(1)}`).join(' ');
      const lower=pts.slice().reverse().map(d=>`L${d.x.toFixed(1)},${d.yL.toFixed(1)}`).join(' ');
      const cx=55+((exp-1)/4)*495;
      document.getElementById('svg').innerHTML=`
        <path d="${upper} ${lower} Z" fill="#2563eb" opacity="0.18"/>
        <line x1="55" y1="92" x2="550" y2="92" stroke="#10b981" stroke-dasharray="5,4" stroke-width="2"/>
        <line x1="${cx.toFixed(1)}" y1="15" x2="${cx.toFixed(1)}" cy="170" y2="170" stroke="#f59e0b" stroke-width="2.5"/>
        <circle cx="${cx.toFixed(1)}" cy="92" r="6" fill="#f59e0b"/>
        <text x="545" y="86" text-anchor="end" font-size="11" fill="#10b981">预期赔付线 1.00%</text>
      `;
      document.getElementById('kReal').textContent=real.toFixed(2)+'%';
      document.getElementById('kRisk').textContent=N<100?'极高（随时赔穿）':N<2000?'中等':'极低（稳如泰山）';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>当参保人数扩大到 <strong>${N.toLocaleString()} 人</strong>，赔付率标准差收窄至 <strong>±${sd.toFixed(2)}%</strong>，原本随机的生病车祸变成了极度稳定的精算现金流！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    sim(false);</script>
</body>
</html>
