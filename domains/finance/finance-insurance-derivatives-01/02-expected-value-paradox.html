<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：负期望却必买的效用悖论</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>💡 负期望却必买？理解“边际效用递减”与灾备保险</h1><p>误区：所有保险的数学期望都是负的，所以精明人不该买保险。真相：我们买的是“灾难发生时不至于破产”的边际效用底线！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn" onclick="pick(0,this)">手机碎屏险（保额 1500 元 / 赔不起吗？）</button>
      <button class="btn active" onclick="pick(1,this)">百万医疗险（保额 200 万 / 倾家荡产级风险）</button>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">出险损失 vs 家庭积蓄</div><div class="k-val" id="kHit">—</div></div>
      <div class="kpi"><div class="k-lbl">精算结论</div><div class="k-val" id="kRec">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function pick(i,btn){
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      const pts=[];
      for(let w=5;w<=100;w+=5){
        const u=Math.log(w)/Math.log(100)*140;
        pts.push(`${w===5?'M':'L'}${(50+(w/100)*490).toFixed(1)},${(165-u).toFixed(1)}`);
      }
      const hitX = i===0 ? 480 : 95;
      const hitU = Math.log(i===0?90:12)/Math.log(100)*140;
      document.getElementById('svg').innerHTML=`
        <path d="${pts.join(' ')}" fill="none" stroke="#2563eb" stroke-width="3.5"/>
        <circle cx="${hitX}" cy="${(165-hitU).toFixed(1)}" r="7" fill="${i===0?'#10b981':'#ef4444'}"/>
        <text x="${hitX}" y="${(152-hitU).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="800" fill="${i===0?'#10b981':'#ef4444'}">${i===0?'轻微擦伤（效用几乎不变）':'家庭破产悬崖（效用断崖！）'}</text>
      `;
      document.getElementById('kHit').textContent=i===0?'1500元（可自行承担）':'100万+（无法承受）';
      document.getElementById('kRec').textContent=i===0?'不建议买（自留风险）':'必买！（转移灾难）';
      document.getElementById('kRec').style.color=i===0?'#f59e0b':'#10b981';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>买保险的黄金原则：<strong>只保“赔不起的大概率破产风险”，不保“赔得起的小额高频风险”</strong>！`;
      if(window.ToySDK) window.ToySDK.markCompleted();
    }
    pick(1, document.querySelector('.btn.active'));</script>
</body>
</html>
