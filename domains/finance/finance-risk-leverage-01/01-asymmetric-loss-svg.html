<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：涨跌不对称曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📉 涨跌不对称曲线：跌 50% 为什么必须涨 100% 才能回本？（SVG）</h1><p>误区：今天跌 20%，明天涨 20% 就打平了。真相：本金基数变小后，回本所需的涨幅呈双曲线暴增！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn" onclick="setD(20,this)">轻度回撤 -20%</button>
      <button class="btn active" onclick="setD(50,this)">腰斩 -50%</button>
      <button class="btn" onclick="setD(80,this)">深熊 -80%</button>
      <button class="btn" onclick="setD(90,this)">脚踝斩 -90%</button>
    </div>
    <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>当前亏损幅度</span><span id="vD">-50%</span></label><input id="d" type="range" min="5" max="90" step="1" value="50" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">剩余本金</div><div class="k-val" id="kRem" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">回本所需涨幅</div><div class="k-val" id="kNeed" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">按年化 10% 回本耗时</div><div class="k-val" id="kYrs">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function setD(v,btn){
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      document.getElementById('d').value=v;
      draw(true);
    }
    function draw(mark){
      const d=+document.getElementById('d').value;
      const rem=100-d;
      const need=(100/rem-1)*100;
      const yrs=Math.log(100/rem)/Math.log(1.1);
      document.getElementById('vD').textContent='-'+d+'%';
      let pts=[];
      for(let i=5;i<=90;i+=2){
        const nd=(100/(100-i)-1)*100;
        const x=48+((i-5)/85)*520;
        const y=180-Math.min(155,(nd/900)*155);
        pts.push(`${i===5?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`);
      }
      const cx=48+((d-5)/85)*520, cy=180-Math.min(155,(need/900)*155);
      document.getElementById('svg').innerHTML=`
        <line x1="48" y1="180" x2="570" y2="180" stroke="var(--tax-border)"/>
        <path d="${pts.join(' ')}" fill="none" stroke="#ef4444" stroke-width="3"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="#2563eb"/>
        <text x="${Math.min(550,cx+8).toFixed(1)}" y="${Math.max(20,cy-8).toFixed(1)}" font-size="12" font-weight="800" fill="#2563eb">跌${d}% → 需涨${need.toFixed(0)}%</text>
        <text x="300" y="198" text-anchor="middle" font-size="11" fill="var(--tax-muted)">亏损幅度 5% → 90%（回本难度指数级飙升）</text>
      `;
      document.getElementById('kRem').textContent=rem.toFixed(0)+' 元';
      document.getElementById('kNeed').textContent='+'+need.toFixed(1)+'%';
      document.getElementById('kYrs').textContent=yrs.toFixed(1)+' 年';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>跌去 <strong>${d}%</strong> 后只剩 ${rem} 元，想回到 100 元必须暴涨 <strong>+${need.toFixed(1)}%</strong>（按年化 10% 要熬 ${yrs.toFixed(1)} 年）！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
