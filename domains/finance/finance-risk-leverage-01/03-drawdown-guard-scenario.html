<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：大回撤风控抉择台</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🛡️ 大回撤风控抉择台：保本止损比盲目追高重要十倍</h1><p>误区：牛市能赚 100% 就够了，止损太保守。真相：一次 70% 的大回撤可以直接清零前 3 年的全部利润！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn active" onclick="pick(15,this)">严格风控：最大回撤锁在 -15%</button>
      <button class="btn" onclick="pick(35,this)">中等波动：最大回撤 -35%</button>
      <button class="btn" onclick="pick(70,this)">死扛不卖：遭遇一次 -70% 暴跌</button>
    </div>
    <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>单次极端回撤幅度</span><span id="vD">-15%</span></label><input id="d" type="range" min="5" max="80" step="5" value="15" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>牛市年度涨幅</span><span id="vU">+30%</span></label><input id="u" type="range" min="15" max="60" step="5" value="30" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 190"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">连续 2 年牛市后净值</div><div class="k-val" id="kBull" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">遭遇 1 次大回撤后</div><div class="k-val" id="kHit" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">再跑 2 年牛市最终净值</div><div class="k-val" id="kFin" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function pick(d,btn){
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      document.getElementById('d').value=d;
      draw(true);
    }
    function draw(mark){
      const d=+document.getElementById('d').value/100;
      const u=+document.getElementById('u').value/100;
      document.getElementById('vD').textContent='-'+(d*100).toFixed(0)+'%';
      document.getElementById('vU').textContent='+'+(u*100).toFixed(0)+'%';
      const arr=[100, 100*(1+u), 100*(1+u)*(1+u)];
      arr.push(arr[2]*(1-d));
      arr.push(arr[3]*(1+u));
      arr.push(arr[4]*(1+u));
      const maxV=Math.max(200, ...arr);
      const x=i=>55+i*98, y=v=>168-(v/maxV)*135;
      const p=arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      const labels=['起点','牛市1','牛市2','暴跌','恢复1','恢复2'];
      let dots='';
      arr.forEach((v,i)=>{
        dots+=`<circle cx="${x(i)}" cy="${y(v).toFixed(1)}" r="5" fill="${i===3?'#ef4444':'#2563eb'}"/>
        <text x="${x(i)}" y="${(y(v)-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="750" fill="var(--tax-ink)">${v.toFixed(0)}</text>
        <text x="${x(i)}" y="184" text-anchor="middle" font-size="10.5" fill="var(--tax-muted)">${labels[i]}</text>`;
      });
      document.getElementById('svg').innerHTML=`<line x1="40" y1="${y(100).toFixed(1)}" x2="570" y2="${y(100).toFixed(1)}" stroke="var(--tax-muted)" stroke-dasharray="4,4"/><path d="${p}" fill="none" stroke="#2563eb" stroke-width="3"/>${dots}`;
      document.getElementById('kBull').textContent=arr[2].toFixed(1);
      document.getElementById('kHit').textContent=arr[3].toFixed(1);
      document.getElementById('kFin').textContent=arr[5].toFixed(1);
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>前两年牛市赚到 <strong>${arr[2].toFixed(0)}</strong>，只要第 3 年吃一次 <strong>-${(d*100).toFixed(0)}%</strong> 回撤，净值瞬间砸到 <strong>${arr[3].toFixed(1)}</strong>！控住回撤比多抓一个涨停板重要得多。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
