<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：复利曲线 vs 通胀侵蚀</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; transition:.15s; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🚀 复利曲线 vs 通胀侵蚀赛跑（SVG）</h1><p>误区：只要账面金额每年变多就是赚钱。真相：不跑赢通胀的复利，真实购买力其实在缩水！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="btn-row">
      <button class="btn active" onclick="preset(8,3,30,this)">稳健指数 (8% vs 3%)</button>
      <button class="btn" onclick="preset(2,3.5,30,this)">定期存款 (2% vs 3.5%)</button>
      <button class="btn" onclick="preset(12,3,30,this)">高回报成长 (12% vs 3%)</button>
    </div>
    <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>年化名义收益率</span><span id="vR">8%</span></label><input id="r" type="range" min="0" max="15" step="0.5" value="8" oninput="draw()"></div>
      <div class="ctrl-box"><label><span>年均通胀率</span><span id="vI">3%</span></label><input id="inf" type="range" min="0" max="8" step="0.5" value="3" oninput="draw()"></div>
      <div class="ctrl-box"><label><span>投资年限</span><span id="vY">30 年</span></label><input id="yrs" type="range" min="5" max="40" step="1" value="30" oninput="draw()"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 220"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">初始本金</div><div class="k-val">10.0 万</div></div>
      <div class="kpi"><div class="k-lbl">期末名义财富</div><div class="k-val" id="kNom" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">期末真实购买力</div><div class="k-val" id="kReal" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">被通胀吃掉的购买力</div><div class="k-val" id="kLoss" style="color:#ef4444;">—</div></div>
    </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let touched=false;
    function preset(r,i,y,btn){
      document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      document.getElementById('r').value=r;
      document.getElementById('inf').value=i;
      document.getElementById('yrs').value=y;
      draw(true);
    }
    function draw(mark){
      const r=+document.getElementById('r').value/100;
      const inf=+document.getElementById('inf').value/100;
      const Y=+document.getElementById('yrs').value;
      document.getElementById('vR').textContent=(r*100).toFixed(1)+'%';
      document.getElementById('vI').textContent=(inf*100).toFixed(1)+'%';
      document.getElementById('vY').textContent=Y+' 年';
      const nomArr=[], realArr=[], cashArr=[];
      for(let t=0;t<=Y;t++){
        nomArr.push(10*Math.pow(1+r,t));
        realArr.push(10*Math.pow((1+r)/(1+inf),t));
        cashArr.push(10/Math.pow(1+inf,t));
      }
      const maxV=Math.max(25, ...nomArr);
      const x=t=>48+(t/Y)*525;
      const y=v=>188-(v/maxV)*158;
      const path=arr=>arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      document.getElementById('svg').innerHTML=`
        <line x1="48" y1="188" x2="573" y2="188" stroke="var(--tax-border)" stroke-width="1.5"/>
        <line x1="48" y1="${y(10).toFixed(1)}" x2="573" y2="${y(10).toFixed(1)}" stroke="var(--tax-muted)" stroke-dasharray="4,4" stroke-width="1"/>
        <text x="52" y="${(y(10)-4).toFixed(1)}" font-size="10.5" fill="var(--tax-muted)">10万购买力基准线</text>
        <path d="${path(nomArr)}" fill="none" stroke="#2563eb" stroke-width="3"/>
        <path d="${path(realArr)}" fill="none" stroke="#10b981" stroke-width="3"/>
        <path d="${path(cashArr)}" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
        <text x="568" y="${Math.max(18,y(nomArr[Y])-6).toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="700" fill="#2563eb">名义 ${nomArr[Y].toFixed(1)}万</text>
        <text x="568" y="${Math.max(30,y(realArr[Y])+14).toFixed(1)}" text-anchor="end" font-size="11.5" font-weight="700" fill="#10b981">真实 ${realArr[Y].toFixed(1)}万</text>
        <text x="568" y="${Math.min(183,y(cashArr[Y])-5).toFixed(1)}" text-anchor="end" font-size="11" fill="#ef4444">躺平现金 ${cashArr[Y].toFixed(1)}万</text>
      `;
      document.getElementById('kNom').textContent=nomArr[Y].toFixed(1)+' 万';
      document.getElementById('kReal').textContent=realArr[Y].toFixed(1)+' 万';
      document.getElementById('kLoss').textContent=(nomArr[Y]-realArr[Y]).toFixed(1)+' 万';
      const spread=(r-inf)*100;
      document.getElementById('ahaBox').innerHTML = spread<=0
        ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>当前实际收益率仅 <strong>${spread.toFixed(1)}%</strong>，名义数字虽然涨到 ${nomArr[Y].toFixed(1)} 万，真实购买力却只剩 ${realArr[Y].toFixed(1)} 万——不跑赢通胀就是隐形亏损！`
        : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>实际复利 ${spread.toFixed(1)}% 在第 ${Y} 年形成巨大剪刀差！但注意：高通胀把 ${nomArr[Y].toFixed(1)} 万名义财富悄悄削成了 ${realArr[Y].toFixed(1)} 万购买力。`;
      if(mark||touched){ touched=true; if(window.ToySDK) window.ToySDK.markCompleted(); }
    }
    draw(false);
  </script>
</body>
</html>
