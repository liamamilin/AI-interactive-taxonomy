<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⛓️ 习惯叠加链：把新习惯挂在旧习惯尾巴上</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⛓️ 习惯叠加链：把新习惯挂在旧习惯尾巴上</h1><p>“我要每天冥想” 90% 会忘；改成“每天早上倒完第一杯咖啡后，立刻闭眼深呼吸 2 分钟”，成功率瞬间翻倍！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>旧锚点习惯（如刷牙/泡咖啡）稳定度</span><span id="vAnc">90%</span></label><input type="range" id="sAnc" min="20" max="100" value="90" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>新习惯起步微缩时长（2 分钟法则）</span><span id="vMin">3 分钟</span></label><input type="range" id="sMin" min="1" max="30" value="3" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">21 天连续打卡存活率</div><div class="k-val" id="kSur">—</div></div>
        <div class="kpi"><div class="k-lbl">设计评估</div><div class="k-val" id="kEv">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const anc=+document.getElementById('sAnc').value, mins=+document.getElementById('sMin').value;
  document.getElementById('vAnc').textContent=anc+'%';
  document.getElementById('vMin').textContent=mins+' 分钟';
  const sur=Math.max(10, Math.min(96, Math.round(anc*0.88 - Math.max(0, mins-2)*2.1 + 10)));
  document.getElementById('kSur').textContent=sur+'%';
  document.getElementById('kSur').style.color=sur>=70?'#059669':'#f59e0b';
  document.getElementById('kEv').textContent=mins<=5?'✅ 完美符合 2 分钟起步法则':'⚠️ 门槛过高易弃坑';
  const w=Math.max(15, sur*4.4);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="32" font-size="13" font-weight="800" fill="var(--tax-text)">执行意图公式：当我做完 [稳定旧习惯] 后，立刻做 [${mins} 分钟新习惯]</text>
    <rect x="30" y="65" width="440" height="38" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="65" width="${Math.min(440,w).toFixed(0)}" height="38" rx="8" fill="${sur>=70?'#059669':'#f59e0b'}"/>
    <text x="${Math.min(480, 38+w).toFixed(0)}" y="90" font-size="14" font-weight="850" fill="${sur>=70?'#059669':'#d97706'}">${sur}%</text>
    <text x="30" y="148" font-size="12" fill="var(--tax-muted)">先让行为“每天稳定发生”（哪怕只读 1 页书、做 2 个俯卧撑），等神经通路固化后再慢慢加量！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>养成习惯最难的是“开始那 10 秒”，而不是坚持 30 分钟。把起步缩小到不可能失败的 2 分钟，就是最稳的破局点。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
