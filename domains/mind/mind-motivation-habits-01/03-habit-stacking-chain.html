<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>习惯叠加链：把新习惯挂在旧习惯尾巴上</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .builder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 600px) { .builder-grid { grid-template-columns: 1fr; } }
    .col-box { padding: 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .chip-btn {
      display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px;
      border-radius: 8px; border: 1px solid var(--tax-border); background: var(--tax-surface);
      color: var(--tax-ink); font-size: 13px; cursor: pointer;
    }
    .chip-btn.sel { border-color: var(--tax-primary); background: var(--tax-primary-soft); font-weight: 700; }
    .chain-list { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .chain-item {
      padding: 10px 12px; border-radius: 10px; background: var(--tax-green-soft); border: 1px solid var(--tax-green);
      display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⛓️ 习惯叠加链：把新习惯挂在旧习惯尾巴上（构建器）</h1>
      <p>BJ Fogg 与《原子习惯》的经典公式：<strong>“在我【完成旧习惯】之后，我立刻【执行 2 分钟微习惯】。”</strong>先选一个你每天雷打不动的旧锚点，再挂上一个想养成的新微习惯，拼出你的专属习惯链！</p>
    </header>

    <section class="toy-card">
      <div class="builder-grid">
        <div class="col-box">
          <div style="font-size:12px;font-weight:700;color:var(--tax-muted);margin-bottom:8px;">① 选择一个高稳定旧锚点（触发率 98%）</div>
          <div id="anchorList"></div>
        </div>
        <div class="col-box">
          <div style="font-size:12px;font-weight:700;color:var(--tax-muted);margin-bottom:8px;">② 选择要挂载的新微习惯（≤2 分钟）</div>
          <div id="newList"></div>
        </div>
      </div>

      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <button class="toy-btn" id="linkBtn">🔗 焊接到我的习惯链</button>
        <button class="toy-btn secondary" id="clearBtn">↺ 清空链条</button>
        <span id="rateBadge" style="font-size:13px;color:var(--tax-muted);">对比：空想“有空就做”执行率仅 24%</span>
      </div>

      <div class="chain-list" id="chainList"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>神经挂载原理：</strong>旧习惯的突触通路已经修成了高速公路。点击左右两列并「焊接」，借旧习惯的尾流直接拉动新习惯启动！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const ANCHORS = ['早上刷完牙放回牙刷后', '按下咖啡机/倒完第一杯水后', '下班合上笔记本电脑后', '晚上拉上窗帘躺上床前'];
    const NEW_HABITS = ['立刻做 5 个深蹲或拉伸', '顺手背 3 个英语例句', '把明天最重要的 1 件事写进便签', '在床头翻开纸质书读 2 页'];

    let selA = 0, selN = 0;
    let chains = [];
    let done = false;

    const anchorList = document.getElementById('anchorList');
    const newList = document.getElementById('newList');
    const chainList = document.getElementById('chainList');
    const rateBadge = document.getElementById('rateBadge');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      anchorList.innerHTML = '';
      ANCHORS.forEach((a, i) => {
        const b = document.createElement('button');
        b.className = 'chip-btn' + (i === selA ? ' sel' : '');
        b.textContent = '⚓ ' + a;
        b.onclick = () => { selA = i; render(); };
        anchorList.appendChild(b);
      });

      newList.innerHTML = '';
      NEW_HABITS.forEach((n, i) => {
        const b = document.createElement('button');
        b.className = 'chip-btn' + (i === selN ? ' sel' : '');
        b.textContent = '🌱 ' + n;
        b.onclick = () => { selN = i; render(); };
        newList.appendChild(b);
      });

      chainList.innerHTML = '';
      chains.forEach((ch, idx) => {
        const div = document.createElement('div');
        div.className = 'chain-item';
        div.innerHTML = `<span><strong>链条 #${idx + 1}：</strong>在我【${ch.a}】，我立刻【${ch.n}】</span><strong style="color:var(--tax-green);">预计执行率 82%</strong>`;
        chainList.appendChild(div);
      });

      if (chains.length === 0) {
        rateBadge.textContent = '对比：空想“有空就做”执行率仅 24%';
      } else {
        rateBadge.innerHTML = `已构建 <strong>${chains.length}</strong> 条习惯叠加链 · 预计执行率从 24% 跃升至 <strong style="color:var(--tax-green);">82%</strong>`;
      }
    }

    document.getElementById('linkBtn').onclick = () => {
      const a = ANCHORS[selA], n = NEW_HABITS[selN];
      if (!chains.some(c => c.a === a && c.n === n)) {
        chains.push({ a, n });
      }
      markDone('构建了习惯叠加链');
      ahaBox.innerHTML = `<strong>执行意图锁定（Implementation Intention）！</strong>心理学研究表明，把模糊愿望（“我要多运动”）改写成精确的“如果 A 发生，就立刻做 B”，行动达成率能直接翻 2–3 倍——因为你不再需要耗费意志力决定“什么时候做”。`;
      render();
    };

    document.getElementById('clearBtn').onclick = () => { chains = []; render(); };
    render();
  </script>
</body>
</html>
