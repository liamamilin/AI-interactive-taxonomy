<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>四步习惯飞轮：从刻意到自动化</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .m-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .m-val { font-size: 20px; font-weight: 800; color: var(--tax-ink); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔁 四步习惯飞轮：从刻意到自动化</h1>
      <p>任何习惯都由<strong>提示（Cue）→ 渴求（Craving）→ 反应（Response）→ 奖赏（Reward）</strong>闭环驱动。连续点击「执行一次循环」模拟 66 天养成，观察大脑控制权如何从费电的前额叶移交给省电的基底神经节！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="stepBtn">⚡ 执行一次习惯循环（+6 天）</button>
        <button class="toy-btn secondary" id="jumpBtn">⏩ 直接跳到第 66 天（自动化）</button>
        <button class="toy-btn secondary" id="resetBtn">↺ 重置回第 1 天</button>
      </div>

      <svg id="loopSvg" viewBox="0 0 680 230" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="四步习惯飞轮模型"></svg>

      <div class="metrics">
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">坚持天数</div><div class="m-val" id="dayVal">第 1 天</div></div>
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">前额叶意志力消耗</div><div class="m-val" id="willVal" style="color:var(--tax-red);">92%</div></div>
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">基底神经节自动化度</div><div class="m-val" id="autoVal" style="color:var(--tax-green);">6%</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>第 1 天（高耗能启动）：</strong>刚养成新习惯时，每一步都要靠前额叶硬推，极易放弃。多点几次「执行一次习惯循环」，观察多巴胺峰值如何从“奖赏”前移到“提示”！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let days = 1;
    let activeStage = 0;
    let done = false;

    const svg = document.getElementById('loopSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function draw() {
      // Lally et al. (2010) asymptotic automaticity curve (median ~66 days)
      const autoPct = Math.min(95, Math.round(95 * (1 - Math.exp(-days / 24))));
      const willPct = Math.max(8, 100 - autoPct);

      document.getElementById('dayVal').textContent = `第 ${days} 天`;
      document.getElementById('willVal').textContent = willPct + '%';
      document.getElementById('autoVal').textContent = autoPct + '%';

      const nodes = [
        { x: 180, y: 55, title: '1. 提示 Cue', sub: '看到跑鞋 / 闹钟响', col: 'var(--tax-primary)' },
        { x: 500, y: 55, title: '2. 渴求 Craving', sub: '期待清爽多巴胺', col: 'var(--tax-amber)' },
        { x: 500, y: 175, title: '3. 反应 Response', sub: '出门慢跑 15 分钟', col: 'var(--tax-green)' },
        { x: 180, y: 175, title: '4. 奖赏 Reward', sub: '内啡肽 + 打卡爽感', col: 'var(--tax-primary)' }
      ];

      let html = '';
      // Connecting arrows forming loop
      const strokeW = 2 + (autoPct / 25);
      html += `<path d="M265 55 L415 55" stroke="var(--tax-primary)" stroke-width="${strokeW}" fill="none"/>`;
      html += `<path d="M500 85 L500 145" stroke="var(--tax-amber)" stroke-width="${strokeW}" fill="none"/>`;
      html += `<path d="M415 175 L265 175" stroke="var(--tax-green)" stroke-width="${strokeW}" fill="none"/>`;
      html += `<path d="M180 145 L180 85" stroke="var(--tax-primary)" stroke-width="${strokeW}" fill="none"/>`;

      // Center flywheel badge
      html += `<circle cx="340" cy="115" r="46" fill="${autoPct >= 70 ? 'rgba(16,185,129,0.18)' : 'rgba(59,130,246,0.12)'}" stroke="${autoPct >= 70 ? 'var(--tax-green)' : 'var(--tax-primary)'}" stroke-width="2"/>`;
      html += `<text x="340" y="110" text-anchor="middle" fill="var(--tax-ink)" font-size="13" font-weight="800">${autoPct >= 70 ? '自动驾驶' : (autoPct >= 35 ? '飞轮加速' : '手动硬推')}</text>`;
      html += `<text x="340" y="130" text-anchor="middle" fill="var(--tax-muted)" font-size="11">自动化 ${autoPct}%</text>`;

      // Dopamine badge shifts from Reward (early) to Cue (habitual)
      const dopaX = days >= 25 ? 180 : 180;
      const dopaY = days >= 25 ? 20 : 216;
      html += `<text x="${dopaX}" y="${dopaY}" text-anchor="middle" fill="var(--tax-amber)" font-size="11" font-weight="700">⚡ 多巴胺峰值：${days >= 25 ? '已前移至「提示」阶段！' : '仍在「奖赏」阶段'}</text>`;

      nodes.forEach((n, i) => {
        const hi = i === activeStage;
        html += `<rect x="${n.x - 85}" y="${n.y - 26}" width="170" height="52" rx="10" fill="${hi ? 'rgba(59,130,246,0.22)' : 'var(--tax-surface)'}" stroke="${n.col}" stroke-width="${hi ? '2.5' : '1.5'}"/>`;
        html += `<text x="${n.x}" y="${n.y - 4}" text-anchor="middle" fill="var(--tax-ink)" font-size="13" font-weight="700">${n.title}</text>`;
        html += `<text x="${n.x}" y="${n.y + 15}" text-anchor="middle" fill="var(--tax-muted)" font-size="11">${n.sub}</text>`;
      });

      svg.innerHTML = html;

      if (days >= 60) {
        ahaBox.innerHTML = '<strong>飞轮进入自动驾驶（66 天阈值）：</strong>此时看到跑鞋（提示）就会立刻触发期待（多巴胺前移），前额叶意志力消耗跌至 10% 以下——不做反而觉得浑身难受，习惯真正长成了！';
      } else if (days >= 20) {
        ahaBox.innerHTML = `<strong>第 ${days} 天（多巴胺前移拐点）：</strong>神经科学发现，重复 3 周后多巴胺不再等吃完/跑完才分泌，而是在看到「提示」的一瞬间就提前分泌，驱动你自动起身行动！`;
      } else {
        ahaBox.innerHTML = `<strong>第 ${days} 天（手动摩擦期）：</strong>前额叶消耗高达 ${willPct}%，此时最容易半途而废。继续点击「执行一次循环」，熬过前 21 天的摩擦坡！`;
      }
    }

    document.getElementById('stepBtn').onclick = () => {
      days = Math.min(90, days + 6);
      activeStage = (activeStage + 1) % 4;
      markDone('模拟了习惯飞轮从刻意到自动化的神经演化');
      draw();
    };
    document.getElementById('jumpBtn').onclick = () => {
      days = 66;
      activeStage = 0;
      markDone('观察了66天习惯自动化的多巴胺前移');
      draw();
    };
    document.getElementById('resetBtn').onclick = () => {
      days = 1;
      activeStage = 0;
      draw();
    };

    draw();
  </script>
</body>
</html>
