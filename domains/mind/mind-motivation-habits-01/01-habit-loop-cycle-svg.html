<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔁 四步习惯飞轮：从刻意到自动化（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔁 四步习惯飞轮：从刻意到自动化（SVG）</h1><p>《原子习惯》四定律：让提示显而易见、让渴求有吸引力、让反应简便易行、让奖赏即刻满足——四个齿轮咬合得越紧，习惯飞轮转得越快！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>触发提示显眼度 + 动作简易度</span><span id="vCue">75%</span></label><input type="range" id="sCue" min="10" max="100" value="75" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>完成后的即时正反馈奖赏</span><span id="vRew">70%</span></label><input type="range" id="sRew" min="10" max="100" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 210"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">飞轮闭环强度</div><div class="k-val" id="kPow">—</div></div>
        <div class="kpi"><div class="k-lbl">预计自动化成型周期</div><div class="k-val" id="kDay">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const cue=+document.getElementById('sCue').value, rew=+document.getElementById('sRew').value;
  document.getElementById('vCue').textContent=cue+'%';
  document.getElementById('vRew').textContent=rew+'%';
  const pow=Math.round(Math.sqrt(cue*rew));
  const days=Math.max(18, Math.round(145 - pow*1.15));
  document.getElementById('kPow').textContent=pow+' 分';
  document.getElementById('kPow').style.color=pow>=65?'#059669':'#f59e0b';
  document.getElementById('kDay').textContent='约 '+days+' 天';
  const col=pow>=65?'#059669':'#3b82f6';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="26" font-size="13" font-weight="800" fill="var(--tax-text)">四步习惯神经回路（短板效应：任意一环断裂，飞轮停转）</text>
    <rect x="40" y="55" width="115" height="52" rx="10" fill="#3b82f6" opacity="0.16" stroke="#3b82f6" stroke-width="2"/>
    <text x="97" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">1. 提示 Cue</text>
    <text x="97" y="97" text-anchor="middle" font-size="11" fill="var(--tax-muted)">显眼度 ${cue}%</text>
    <text x="167" y="86" font-size="18" fill="${col}">→</text>
    <rect x="190" y="55" width="115" height="52" rx="10" fill="#8b5cf6" opacity="0.16" stroke="#8b5cf6" stroke-width="2"/>
    <text x="247" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">2. 渴求 Craving</text>
    <text x="247" y="97" text-anchor="middle" font-size="11" fill="var(--tax-muted)">预期多巴胺</text>
    <text x="317" y="86" font-size="18" fill="${col}">→</text>
    <rect x="340" y="55" width="115" height="52" rx="10" fill="#f59e0b" opacity="0.16" stroke="#f59e0b" stroke-width="2"/>
    <text x="397" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#d97706">3. 反应 Action</text>
    <text x="397" y="97" text-anchor="middle" font-size="11" fill="var(--tax-muted)">低门槛执行</text>
    <text x="467" y="86" font-size="18" fill="${col}">→</text>
    <rect x="490" y="55" width="90" height="52" rx="10" fill="#059669" opacity="0.18" stroke="#059669" stroke-width="2"/>
    <text x="535" y="79" text-anchor="middle" font-size="12" font-weight="800" fill="#059669">4. 奖赏</text>
    <text x="535" y="97" text-anchor="middle" font-size="11" fill="var(--tax-muted)">即时 ${rew}%</text>
    <path d="M 535 112 L 535 150 L 97 150 L 97 114" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="5,3"/>
    <text x="316" y="144" text-anchor="middle" font-size="11.5" font-weight="800" fill="${col}">正反馈强化神经髓鞘，形成“无需思考的自动巡航”（强度 ${pow}%）</text>
    <text x="40" y="186" font-size="11.5" fill="var(--tax-muted)">养成好习惯 = 增强这 4 步；戒掉坏习惯 = 反向破坏任意 1 步（藏起提示、增加阻力）！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>好习惯为什么难养成？因为它的奖赏往往延迟在 3 个月后，而坏习惯的奖赏在 3 秒内到账。给好习惯加一个小而即时的庆祝奖赏，能立刻加速闭环！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
