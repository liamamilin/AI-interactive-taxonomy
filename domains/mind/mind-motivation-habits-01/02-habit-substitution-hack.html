<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>戒除坏习惯密码：保留提示与奖赏，替换反应</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .loop-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .loop-box { padding: 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); text-align: center; }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .opt-grid { grid-template-columns: 1fr; } }
    .opt-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); cursor: pointer;
    }
    .opt-btn:hover { border-color: var(--tax-primary); }
    .opt-btn.good { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .opt-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔧 戒除坏习惯密码：黄金替换法则（情景改写）</h1>
      <p>杜希格《习惯的力量》指出：坏习惯的神经回路<strong>永远无法彻底删除</strong>，只能改写！保留原来的「提示」和真实「奖赏」，只替换中间的「反应动作」，看看 30 天戒断成功率相差多少！</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong id="caseTitle" style="font-size:15px;">案例 1 / 3</strong>
        <span id="scoreBadge" style="font-size:13px;color:var(--tax-muted);">成功改写：0 / 3</span>
      </div>

      <div class="loop-bar">
        <div class="loop-box"><div style="font-size:11px;color:var(--tax-muted);">触发提示（Cue）</div><strong id="cueTxt" style="font-size:13px;"></strong></div>
        <div class="loop-box" style="border-color:var(--tax-red);"><div style="font-size:11px;color:var(--tax-red);">旧反应（坏习惯）</div><strong id="oldTxt" style="font-size:13px;"></strong></div>
        <div class="loop-box"><div style="font-size:11px;color:var(--tax-muted);">真实奖赏（Reward）</div><strong id="rewTxt" style="font-size:13px;"></strong></div>
      </div>

      <div style="font-size:13px;color:var(--tax-muted);margin-bottom:8px;">选择你的干预方案：</div>
      <div class="opt-grid" id="optGrid"></div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
        <span id="resLine" style="font-size:13px;color:var(--tax-muted);">点击方案查看 30 天留存率</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一个坏习惯 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>改写原则：</strong>先看清你真正渴求的“奖赏”是什么（解闷？换气？减压？），再用健康动作精准兑现同一份奖赏！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CASES = [
      {
        title: '案例 1/3 · 下午 3 点必点高糖奶茶',
        cue: '下午 3 点大脑发懵、倦怠',
        old: '外卖点一杯全糖珍珠奶茶',
        rew: '短暂起身社交 + 恢复清醒',
        options: [
          { title: '😤 硬靠意志力忍着不动', sub: '发誓“再喝剁手”，死盯电脑干扛', ok: false, rate: '14%', fb: '30 天成功率仅 14%！下午 3 点的困倦提示和社交渴求都没被满足，第 4 天必然报复性连点两杯。' },
          { title: '🔄 替换为：去茶水间泡冰气泡水 + 聊 3 分钟', sub: '同样 3 点触发，同样获得起身换气与清醒', ok: true, rate: '78%', fb: '30 天成功率 78%！你精准识别了真实奖赏不是“糖”，而是“起身休息+微刺激”，替换后回路无缝接管！' }
        ]
      },
      {
        title: '案例 2/3 · 睡前躺床刷短视频到凌晨 2 点',
        cue: '关灯躺平，一天压力涌上心头',
        old: '打开短视频无限下滑',
        rew: '逃离焦虑 + 低脑力放松',
        options: [
          { title: '🔄 替换为：手机放客厅 + 听 15 分钟有声书/白噪音', sub: '保留“低脑力转移焦虑”的奖赏，切断蓝光与算法流', ok: true, rate: '74%', fb: '30 天成功率 74%！同样兑现了“不费脑放松”的奖赏，同时用定时关闭避免了无限下滑。' },
          { title: '😤 硬扛干躺着数羊', sub: '要求自己 10 点一闭眼就立刻睡着', ok: false, rate: '18%', fb: '30 天成功率仅 18%！压力和焦虑没出口，越躺越烦躁，最终还是爬起来摸手机。' }
        ]
      },
      {
        title: '案例 3/3 · 写难任务卡壳时忍不住切回聊天软件',
        cue: '遇到棘手问题产生轻微挫败感',
        old: '切屏刷群聊 / 逛热搜逃避',
        rew: '立刻获得微小掌控感与多巴胺',
        options: [
          { title: '😤 责怪自己不自律，发誓绝不切屏', sub: '卡壳时死磕屏幕发呆', ok: false, rate: '16%', fb: '30 天成功率仅 16%！大脑遇到挫败会自动寻找逃生阀，纯压抑只会越憋越焦躁。' },
          { title: '🔄 替换为：草稿纸写下“卡点 1 句话”+ 喝一口水', sub: '用 30 秒微动作兑现“掌控感”，再切回主线', ok: true, rate: '81%', fb: '30 天成功率 81%！把“刷群聊”替换成“纸上写卡点”，既释放了挫败张力又保住了专注流！' }
        ]
      }
    ];

    let idx = 0, wins = 0, locked = false, done = false;
    const optGrid = document.getElementById('optGrid');
    const resLine = document.getElementById('resLine');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const c = CASES[idx];
      locked = false;
      nextBtn.style.display = 'none';
      document.getElementById('caseTitle').textContent = c.title;
      document.getElementById('cueTxt').textContent = c.cue;
      document.getElementById('oldTxt').textContent = c.old;
      document.getElementById('rewTxt').textContent = c.rew;
      resLine.textContent = '请选择一种干预策略';
      optGrid.innerHTML = '';

      c.options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.innerHTML = `<div style="font-weight:700;font-size:14px;">${o.title}</div><div style="font-size:12px;color:var(--tax-muted);margin-top:4px;">${o.sub}</div>`;
        b.onclick = () => {
          if (locked) return;
          locked = true;
          b.classList.add(o.ok ? 'good' : 'bad');
          if (o.ok) wins++;
          document.getElementById('scoreBadge').textContent = `成功改写：${wins} / 3`;
          resLine.innerHTML = `<strong>30 天成功率：${o.rate}</strong>`;
          ahaBox.innerHTML = `<strong>${o.ok ? '✓ 黄金替换生效' : '⚠️ 硬戒复发警告'}：</strong>${o.fb}`;
          if (idx === CASES.length - 1) {
            markDone(`完成坏习惯替换情景挑战（${wins}/3）`);
            nextBtn.textContent = '↺ 重新挑战';
          } else {
            nextBtn.textContent = '下一个坏习惯 →';
          }
          nextBtn.style.display = 'inline-block';
        };
        optGrid.appendChild(b);
      });
    }

    nextBtn.onclick = () => {
      if (idx === CASES.length - 1) { idx = 0; wins = 0; document.getElementById('scoreBadge').textContent = '成功改写：0 / 3'; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
