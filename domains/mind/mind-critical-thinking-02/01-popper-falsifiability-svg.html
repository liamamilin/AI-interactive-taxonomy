<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔭 波普尔可证伪性雷达：科学 vs 算命（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔭 波普尔可证伪性雷达：科学 vs 算命（SVG）</h1><p>卡尔·波普尔提出：科学的核心标准不是“能找到多少支持的例子”，而是你敢不敢说出“如果发生什么现象，我就承认自己错了”！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>预言具体精确度（敢不敢冒被打脸风险）</span><span id="vPre">80%</span></label><input type="range" id="sPre" min="5" max="100" value="80" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>失败后“事后打补丁圆谎”倾向</span><span id="vAdh">20%</span></label><input type="range" id="sAdh" min="0" max="100" value="20" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">科学可证伪性评分</div><div class="k-val" id="kSci">—</div></div>
        <div class="kpi"><div class="k-lbl">理论属性判定</div><div class="k-val" id="kTyp">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const pre=+document.getElementById('sPre').value, adh=+document.getElementById('sAdh').value;
  document.getElementById('vPre').textContent=pre+'%';
  document.getElementById('vAdh').textContent=adh+'%';
  const sci=Math.max(5, Math.min(99, Math.round(pre*0.85 - adh*0.55 + 20)));
  const typ=sci>=65?'🔬 严谨可检验科学假说':(sci>=35?'⚠️ 模糊擦边理论':'🔮 不可证伪伪科学/算命');
  document.getElementById('kSci').textContent=sci+' 分';
  document.getElementById('kSci').style.color=sci>=65?'#059669':'#ef4444';
  document.getElementById('kTyp').textContent=typ;
  const w=Math.max(15, sci*4.4);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">理论含金量与可证伪性标尺（敢于禁止某些事情发生，才有信息量）</text>
    <rect x="30" y="68" width="440" height="40" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="68" width="${w.toFixed(0)}" height="40" rx="8" fill="${sci>=65?'#059669':(sci>=35?'#f59e0b':'#ef4444')}"/>
    <text x="${Math.min(480, 38+w).toFixed(0)}" y="94" font-size="14" font-weight="850" fill="${sci>=65?'#059669':'#ef4444'}">${sci} 分</text>
    <text x="30" y="144" font-size="11.5" fill="var(--tax-muted)">爱因斯坦敢预言“星光精确偏折 1.75 角秒，不符就认错”；</text>
    <text x="30" y="166" font-size="11.5" fill="var(--tax-muted)">而星座运势说“近期有波动”，永远不会错，所以毫无信息量！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>衡量一个观点有没有价值，先问一句：“什么证据出现时，你会承认它是错的？”如果回答“没有”，那它只是信仰而非知识。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
