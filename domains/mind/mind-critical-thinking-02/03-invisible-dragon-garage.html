<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>萨根“车库里的喷火龙”检验器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .test-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    @media (max-width: 600px) { .test-grid { grid-template-columns: 1fr; } }
    .t-btn {
      text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 13px; cursor: pointer;
    }
    .t-btn.used { border-color: var(--tax-amber); background: var(--tax-amber-soft); }
    .log-box { padding: 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); min-height: 92px; font-size: 13px; line-height: 1.65; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🐉 萨根“车库里的喷火龙”检验器（特设补丁拆解）</h1>
      <p>有人神秘地告诉你：“我家车库里住着一条喷火龙！”你带上 4 件科学检验工具去现场核实——依次点击测试，看看对方如何层层叠加<strong>“特设假设（Ad-hoc Hypotheses）”</strong>把一条龙圆场成一团空气！</p>
    </header>

    <section class="toy-card">
      <div class="test-grid" id="testGrid"></div>

      <div class="log-box" id="logBox">
        🕵️ <strong>当前状态：</strong>你站在空荡荡的车库门口。点击上方 4 种科学检验手段，向对方发起质询！
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>检验进度（0/4）：</strong>试完所有 4 项物理检测，听听卡尔·萨根留下的灵魂拷问！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const TESTS = [
      { id: 'eye',   btn: '🔦 检验 1：打开强光手电照车库', reply: '对方：“啊，忘了告诉你，这是一条【完全隐形】的龙！”', patch: '隐形' },
      { id: 'flour', btn: '🌾 检验 2：地上撒面粉测脚印', reply: '对方：“没用的，它一直【悬浮在半空】从不落地！”', patch: '悬浮' },
      { id: 'ir',    btn: '🌡️ 检验 3：用红外热像仪测喷火', reply: '对方：“哦，它喷的是【没有温度的无热火】！”', patch: '无热火' },
      { id: 'paint', btn: '🎨 检验 4：朝空中喷油漆显形', reply: '对方：“它是非物质的【纯灵体】，油漆穿过去根本粘不住！”', patch: '非物质' }
    ];

    const used = new Set();
    let done = false;
    const testGrid = document.getElementById('testGrid');
    const logBox = document.getElementById('logBox');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render(lastReply) {
      testGrid.innerHTML = '';
      TESTS.forEach(t => {
        const b = document.createElement('button');
        b.className = 't-btn' + (used.has(t.id) ? ' used' : '');
        b.textContent = (used.has(t.id) ? '✓ ' : '') + t.btn;
        b.onclick = () => {
          used.add(t.id);
          if (used.size >= 2) markDone('完成了萨根车库里的喷火龙检验');
          render(t.reply);
        };
        testGrid.appendChild(b);
      });

      const patches = TESTS.filter(t => used.has(t.id)).map(t => t.patch);
      if (lastReply) {
        logBox.innerHTML = `<div>${lastReply}</div><div style="margin-top:8px;color:var(--tax-amber);font-weight:700;">🩹 对方已叠上的特设补丁（${patches.length}/4）：${patches.join(' + ')}</div>`;
      }

      if (used.size === 4) {
        ahaBox.innerHTML = '<strong>卡尔·萨根的终极拷问：</strong>“一条<strong>隐形、悬浮、无热、非物质</strong>、且无法被任何仪器探测的喷火龙，和<strong>车库里根本没有龙</strong>，究竟有什么区别？”每当你发现一个理论必须不断打新补丁来逃避检验，奥卡姆剃刀就该挥下去了！';
      } else if (used.size > 0) {
        ahaBox.innerHTML = `<strong>检验进度（${used.size}/4）：</strong>对方刚刚用“特设补丁”躲过了一劫！继续使用剩下的 ${4 - used.size} 件检测工具追问到底！`;
      }
    }

    render(null);
  </script>
</body>
</html>
