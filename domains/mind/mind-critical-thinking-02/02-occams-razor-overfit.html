<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪒 奥卡姆剃刀：假设越多，翻车越惨</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🪒 奥卡姆剃刀：假设越多，翻车越惨</h1><p>“如无必要，勿增实体”。每多加一条未经证实的额外假设（比如“需要 10 个部门联合隐瞒且永不泄密”），整个理论为真的联合概率就会断崖式下跌！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>理论额外堆叠的“特设假设”条数</span><span id="vHyp">4 条</span></label><input type="range" id="sHyp" min="1" max="10" value="4" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>单条假设各自成立的概率</span><span id="vPrb">65%</span></label><input type="range" id="sPrb" min="30" max="95" value="65" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">整套理论同时成立概率</div><div class="k-val" id="kJnt">—</div></div>
        <div class="kpi"><div class="k-lbl">相对单假设的衰减倍数</div><div class="k-val" id="kDec">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const hyp=+document.getElementById('sHyp').value, prb=+document.getElementById('sPrb').value;
  document.getElementById('vHyp').textContent=hyp+' 条';
  document.getElementById('vPrb').textContent=prb+'%';
  const jnt=Math.pow(prb/100, hyp)*100;
  const dec=(prb/Math.max(0.01, jnt)).toFixed(1);
  document.getElementById('kJnt').textContent=jnt.toFixed(1)+'%';
  document.getElementById('kJnt').style.color=jnt<20?'#ef4444':'#059669';
  document.getElementById('kDec').textContent='仅剩 1/'+dec;
  let bars='';
  for(let i=1;i<=10;i++){
    const p=Math.pow(prb/100, i)*100;
    const h=Math.max(4, p*1.2);
    const x=45+(i-1)*50, y=168-h;
    const act=i===hyp;
    bars+=`<rect x="${x}" y="${y.toFixed(1)}" width="34" height="${h.toFixed(1)}" rx="4" fill="${act?'#ef4444':'#3b82f6'}" opacity="${act?'1':'0.45'}"/>
      <text x="${x+17}" y="185" text-anchor="middle" font-size="11" font-weight="${act?'850':'600'}" fill="${act?'#ef4444':'var(--tax-muted)'}">${i}条</text>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="45" y="26" font-size="13" font-weight="800" fill="var(--tax-text)">奥卡姆剃刀的数学本质：独立假设越多，联合概率指数级崩塌</text>
    <line x1="40" y1="168" x2="555" y2="168" stroke="var(--tax-border)" stroke-width="1.5"/>
    ${bars}`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>机器学习里的“正则化防过拟合”和哲学里的“奥卡姆剃刀”是同一件事——同样能解释现象，越简单的模型越接近真相！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
