<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧭 知识四象限：已知未知 vs 未知的未知</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧭 知识四象限：已知未知 vs 未知的未知</h1><p>最危险的不是“我知道我不会”（你可以查资料或请外援），而是“我压根不知道这里还有个坑”（未知的未知）！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>主动请教异见专家/红队挑刺频率</span><span id="vRed">60%</span></label><input type="range" id="sRed" min="0" max="100" value="60" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>跨学科广度探索投入</span><span id="vBrd">55%</span></label><input type="range" id="sBrd" min="0" max="100" value="55" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">致命黑天鹅盲区占比</div><div class="k-val" id="kUnk">—</div></div>
        <div class="kpi"><div class="k-lbl">转化为可控“已知未知”</div><div class="k-val" id="kKnw">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const red=+document.getElementById('sRed').value, brd=+document.getElementById('sBrd').value;
  document.getElementById('vRed').textContent=red+'%';
  document.getElementById('vBrd').textContent=brd+'%';
  const unk=Math.max(8, Math.round(62 - red*0.32 - brd*0.22));
  const knw=Math.min(70, 78 - unk);
  const mastered=22;
  document.getElementById('kUnk').textContent=unk+'%';
  document.getElementById('kUnk').style.color=unk>35?'#ef4444':'#059669';
  document.getElementById('kKnw').textContent=knw+'%';
  const w1=mastered*5.2, w2=knw*5.2, w3=unk*5.2;
  document.getElementById('svg').innerHTML=`
    <text x="40" y="32" font-size="13" font-weight="800" fill="var(--tax-text)">你的认知地图构成（把红色暗礁变成黄色可见清单）</text>
    <rect x="40" y="65" width="${w1.toFixed(0)}" height="46" rx="4" fill="#059669"/>
    <rect x="${(40+w1).toFixed(0)}" y="65" width="${w2.toFixed(0)}" height="46" fill="#f59e0b"/>
    <rect x="${(40+w1+w2).toFixed(0)}" y="65" width="${w3.toFixed(0)}" height="46" rx="4" fill="#ef4444"/>
    <text x="40" y="138" font-size="12" font-weight="800" fill="#059669">已知的已知 ${mastered}%</text>
    <text x="190" y="138" font-size="12" font-weight="800" fill="#d97706">已知的未知 ${knw}% (可控)</text>
    <text x="380" y="138" font-size="12" font-weight="800" fill="#ef4444">未知的未知 ${unk}% (暗礁)</text>
    <text x="40" y="176" font-size="11.5" fill="var(--tax-muted)">多问一句“这件事里有什么是我连问都没想到该问的？”能把隐形暗礁拉出水面！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>真正的智慧不是记住所有答案，而是清楚地画出自己的“能力圈边界”——知道哪里该自己上，哪里该求助。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
