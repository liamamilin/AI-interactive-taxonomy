<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>知识四象限：已知未知 vs 未知的未知</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .probe-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .probe-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--tax-border); background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; cursor: pointer; }
    .probe-btn.on { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); font-weight: 700; }
    svg .quad-cell { cursor: pointer; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🧭 知识四象限：缩小“未知的未知”空间雷达</h1>
      <p>点击下方 2×2 知识矩阵的任意象限查看定义与案例，再开启顶部 <strong>3 个元认知雷达探针</strong>，亲眼看它们如何把最危险的红色“未知的未知”黑区压缩、转化为可攻克的“已知的未知”！</p>
    </header>

    <section class="toy-card">
      <div class="probe-row" id="probeRow"></div>

      <svg id="quadSvg" viewBox="0 0 680 250" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="知识四象限空间地图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>空间探索：</strong>最可怕的不是“知道自己不会”（已知的未知），而是“根本不知道存在这个盲区”（未知的未知）。点击上方雷达探针压缩红区！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const PROBES = [
      { id: 'peer', name: '👥 探针 1：跨领域同行盲审', shrink: 18, on: false },
      { id: 'pre',  name: '🩺 探针 2：上线前做事前验尸', shrink: 18, on: false },
      { id: 'test', name: '🧪 探针 3：小步快跑真实用户灰度', shrink: 20, on: false }
    ];

    const QUADS = {
      kk: { title: '已知的已知（明知识）', desc: '你知道自己掌握的技能：如写常规代码、骑自行车。舒适但容易陷入路径依赖。' },
      ku: { title: '已知的未知（学习清单）', desc: '你知道自己还不懂的问题：如“我不熟悉分布式锁”。这是最安全的成长区，查资料就能补齐！' },
      uk: { title: '未知的已知（隐性直觉）', desc: '你其实会但说不出来的默会经验：如老司机凭听声音判断故障，需要通过费曼输出显性化。' },
      uu: { title: '未知的未知（黑天鹅盲区）', desc: '你连自己漏掉了什么都不知道！历史上绝大多数灾难性翻车都源自这里，只能靠外部反馈探针暴露。' }
    };

    let selected = 'uu';
    let done = false;

    const probeRow = document.getElementById('probeRow');
    const svg = document.getElementById('quadSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      probeRow.innerHTML = '';
      PROBES.forEach(p => {
        const b = document.createElement('button');
        b.className = 'probe-btn' + (p.on ? ' on' : '');
        b.textContent = (p.on ? '✓ ' : '+ ') + p.name;
        b.onclick = () => { p.on = !p.on; markDone(`开启了知识盲区探针：${p.name}`); render(); };
        probeRow.appendChild(b);
      });

      const shrink = PROBES.filter(p => p.on).reduce((s, p) => s + p.shrink, 0);
      // Split line shifts rightward & downward as unknown-unknowns shrink
      const splitX = 330 + shrink * 2.2;
      const splitY = 128 + shrink * 0.9;
      const uuPct = Math.max(8, 35 - Math.round(shrink * 0.48));

      const x0 = 56, x1 = 650, y0 = 30, y1 = 224;
      const wL = splitX - x0, wR = x1 - splitX;
      const hT = splitY - y0, hB = y1 - splitY;

      let html = '';
      // Top-left: Known Knowns
      html += `<g class="quad-cell" data-k="kk"><rect x="${x0}" y="${y0}" width="${wL}" height="${hT}" fill="rgba(16,185,129,0.16)" stroke="${selected === 'kk' ? 'var(--tax-green)' : 'var(--tax-border)'}" stroke-width="${selected === 'kk' ? 3 : 1.2}"/>`;
      html += `<text x="${x0 + wL/2}" y="${y0 + hT/2}" text-anchor="middle" fill="var(--tax-green)" font-size="13" font-weight="800">✅ 已知的已知</text></g>`;

      // Top-right: Known Unknowns
      html += `<g class="quad-cell" data-k="ku"><rect x="${splitX}" y="${y0}" width="${wR}" height="${hT}" fill="rgba(59,130,246,0.16)" stroke="${selected === 'ku' ? 'var(--tax-primary)' : 'var(--tax-border)'}" stroke-width="${selected === 'ku' ? 3 : 1.2}"/>`;
      html += `<text x="${splitX + wR/2}" y="${y0 + hT/2}" text-anchor="middle" fill="var(--tax-primary)" font-size="13" font-weight="800">📘 已知的未知</text></g>`;

      // Bottom-left: Unknown Knowns
      html += `<g class="quad-cell" data-k="uk"><rect x="${x0}" y="${splitY}" width="${wL}" height="${hB}" fill="rgba(245,158,11,0.15)" stroke="${selected === 'uk' ? 'var(--tax-amber)' : 'var(--tax-border)'}" stroke-width="${selected === 'uk' ? 3 : 1.2}"/>`;
      html += `<text x="${x0 + wL/2}" y="${splitY + hB/2 + 4}" text-anchor="middle" fill="var(--tax-amber)" font-size="13" font-weight="800">💡 未知的已知</text></g>`;

      // Bottom-right: Unknown Unknowns
      html += `<g class="quad-cell" data-k="uu"><rect x="${splitX}" y="${splitY}" width="${wR}" height="${hB}" fill="rgba(239,68,68,0.20)" stroke="${selected === 'uu' ? 'var(--tax-red)' : 'var(--tax-border)'}" stroke-width="${selected === 'uu' ? 3 : 1.2}"/>`;
      html += `<text x="${splitX + wR/2}" y="${splitY + hB/2 + 4}" text-anchor="middle" fill="var(--tax-red)" font-size="13" font-weight="800">🕳️ 未知的未知 (${uuPct}%)</text></g>`;

      // Axis labels
      html += `<text x="353" y="20" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5">← 我掌握的技能 | 我尚未掌握的领域 →</text>`;
      html += `<text x="24" y="130" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5" transform="rotate(-90 24 130)">未察觉 ← | → 已察觉</text>`;

      svg.innerHTML = html;
      svg.querySelectorAll('.quad-cell').forEach(g => {
        g.onclick = () => { selected = g.dataset.k; markDone('点击探索了知识四象限'); render(); };
      });

      const q = QUADS[selected];
      const activeProbes = PROBES.filter(p => p.on).length;
      ahaBox.innerHTML = activeProbes === 3
        ? `<strong>盲区已压缩至 ${uuPct}%！</strong>靠自己闭门冥想永远看不见“未知的未知”，只有引入外部视角（同行盲审+事前验尸+真实灰度），才能把暗礁提前翻成“已知的未知”！`
        : `<strong>${q.title}：</strong>${q.desc}`;
    }

    render();
  </script>
</body>
</html>
