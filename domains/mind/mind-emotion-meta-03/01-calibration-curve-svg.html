<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔭 信心校准曲线：你说 80% 把握时真的对 80% 吗？（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔭 信心校准曲线：你说 80% 把握时真的对 80% 吗？（SVG）</h1><p>元认知最硬核的指标叫“校准度”：当你声称有 90% 把握时，历史统计下来你真的答对了 90% 吗？普通人往往只有 65%！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>人类默认过度自信偏差</span><span id="vOvr">25%</span></label><input type="range" id="sOvr" min="0" max="40" value="25" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>坚持写“决策预测日志”并复盘的月数</span><span id="vLog">6 个月</span></label><input type="range" id="sLog" min="0" max="24" value="6" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">声称 90% 把握时真实命中</div><div class="k-val" id="kHit">—</div></div>
        <div class="kpi"><div class="k-lbl">校准评级</div><div class="k-val" id="kGrd">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const ovr=+document.getElementById('sOvr').value, log=+document.getElementById('sLog').value;
  document.getElementById('vOvr').textContent=ovr+'%';
  document.getElementById('vLog').textContent=log+' 个月';
  const effOvr=ovr*Math.exp(-log/12);
  function realAt(conf){ return Math.max(50, Math.min(99, conf - effOvr*(conf-50)/40)); }
  const hit90=Math.round(realAt(90));
  const err=90 - hit90;
  document.getElementById('kHit').textContent=hit90+'%';
  document.getElementById('kHit').style.color=err<=6?'#059669':'#ef4444';
  document.getElementById('kGrd').textContent=err<=6?'🏆 超级预测者级校准':(err<=14?'📈 良好校准中':'⚠️ 严重过度自信');
  let pts=[];
  for(let c=50;c<=100;c+=5){
    const x=80+(c-50)*8.8, y=180-(realAt(c)-50)*2.8;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  document.getElementById('svg').innerHTML=`
    <text x="80" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">主观信心 (50%~100%) vs 实际准确率（灰虚线 = 完美校准线）</text>
    <line x1="80" y1="180" x2="520" y2="180" stroke="var(--tax-border)" stroke-width="1.5"/>
    <line x1="80" y1="40" x2="80" y2="180" stroke="var(--tax-border)" stroke-width="1.5"/>
    <line x1="80" y1="180" x2="520" y2="40" stroke="#94a3b8" stroke-dasharray="5,4" stroke-width="2"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${err<=6?'#059669':'#ef4444'}" stroke-width="3.5"/>
    <text x="80" y="198" font-size="11" fill="var(--tax-muted)">信心 50%</text>
    <text x="485" y="198" font-size="11" fill="var(--tax-muted)">信心 100%</text>
    <text x="355" y="150" font-size="11.5" font-weight="750" fill="${err<=6?'#059669':'#ef4444'}">当前 90% 信心实测命中 ${hit90}%</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>气象预报员和扑克高手之所以校准度极高，是因为他们每天都写下明确概率并立刻接受现实打脸——给重要判断标个百分比，你也会迅速变准！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
