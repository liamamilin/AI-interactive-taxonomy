<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔄 元认知三问刹车：计划 → 监控 → 复盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔄 元认知三问刹车：计划 → 监控 → 复盘</h1><p>数学家舍恩菲尔德研究发现：普通学生读完题立刻埋头狂算一条死路 20 分钟；专家每 3 分钟就抬头问一次“我现在的方向靠谱吗？”，发现不对立刻换路！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>每隔多久抬头做一次元认知方向检查</span><span id="vChk">5 分钟</span></label><input type="range" id="sChk" min="2" max="30" value="5" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>初始思路踩中死胡同的概率</span><span id="vDed">65%</span></label><input type="range" id="sDed" min="10" max="90" value="65" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">在死胡同里白耗时间</div><div class="k-val" id="kWst">—</div></div>
        <div class="kpi"><div class="k-lbl">规定时间内通关概率</div><div class="k-val" id="kSuc">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const chk=+document.getElementById('sChk').value, ded=+document.getElementById('sDed').value;
  document.getElementById('vChk').textContent=chk+' 分钟';
  document.getElementById('vDed').textContent=ded+'%';
  const wst=Math.round(chk*(ded/100)*1.3);
  const suc=Math.max(15, Math.min(96, Math.round(98 - wst*2.4 - (chk<3?8:0))));
  document.getElementById('kWst').textContent=wst+' 分钟';
  document.getElementById('kWst').style.color=wst>12?'#ef4444':'#059669';
  document.getElementById('kSuc').textContent=suc+'%';
  const wS=Math.max(15, suc*4.4);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">复杂问题按时攻克率（每 ${chk} 分钟抬头校准一次方向）</text>
    <rect x="30" y="68" width="440" height="40" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="68" width="${wS.toFixed(0)}" height="40" rx="8" fill="${suc>=70?'#059669':'#f59e0b'}"/>
    <text x="${Math.min(480, 38+wS).toFixed(0)}" y="94" font-size="14" font-weight="850" fill="${suc>=70?'#059669':'#d97706'}">${suc}%</text>
    <text x="30" y="150" font-size="12" fill="var(--tax-muted)">定时停顿 15 秒问三句话：① 我现在在干嘛？② 它离目标更近了吗？③ 有没有更省力的路？</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>“战术上的勤奋掩盖不了战略上的盲奔”。定期把自己从任务里拔出来看一眼全局，就是最高级的元认知能力。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
