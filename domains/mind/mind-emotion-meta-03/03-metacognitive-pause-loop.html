<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>元认知三问刹车：计划 → 监控 → 复盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .check-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
    .chk-btn {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      text-align: left; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .chk-btn.on { border-color: var(--tax-primary); background: var(--tax-primary-soft); }
    .tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--tax-surface); border: 1px solid var(--tax-border); white-space: nowrap; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔄 元认知三问刹车：计划 → 监控 → 复盘（流程构建器）</h1>
      <p>同样花 10 小时攻克一个新项目：低元认知者埋头狂写 10 小时结果跑偏返工；高元认知者只花 <strong>20 分钟</strong>在三个节点踩下刹车发问，反而提前完工！勾选装配你的元认知飞轮：</p>
    </header>

    <section class="toy-card">
      <div class="check-grid" id="checkGrid"></div>

      <svg id="loopSvg" viewBox="0 0 680 145" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="元认知三问节省返工工时对比"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>埋头盲干基准：</strong>0 个元认知刹车时，10 小时里有 <strong>6.5 小时</strong>会浪费在走错方向、假性忙碌和重复踩坑上！点击上方 3 个刹车节点装配元认知闭环。
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CHECKS = [
      { id: 'plan', title: '🧭 阶段 1 · 计划刹车（开工前 5 分钟）', sub: '“这个任务的验收标准是什么？我最容易在哪一步跑偏？”', save: 2.2, on: false },
      { id: 'mon',  title: '⏱️ 阶段 2 · 监控刹车（进行中每 45 分钟）', sub: '“我现在做的细节真能推进主目标，还是在用‘假忙’逃避难点？”', save: 2.3, on: false },
      { id: 'eval', title: '📝 阶段 3 · 复盘刹车（结束后 5 分钟）', sub: '“刚才哪一步效率最高？下次遇到同类任务我该保留哪条模板？”', save: 1.5, on: false }
    ];

    let done = false;
    const checkGrid = document.getElementById('checkGrid');
    const svg = document.getElementById('loopSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      checkGrid.innerHTML = '';
      CHECKS.forEach(c => {
        const b = document.createElement('button');
        b.className = 'chk-btn' + (c.on ? ' on' : '');
        b.innerHTML = `<div><div style="font-weight:700;font-size:13.5px;">${c.title}</div><div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">${c.sub}</div></div><span class="tag">${c.on ? '✓ 已装配' : '省 ' + c.save + 'h 返工'}</span>`;
        b.onclick = () => { c.on = !c.on; markDone('装配了元认知三问刹车闭环'); render(); };
        checkGrid.appendChild(b);
      });

      const saved = CHECKS.filter(c => c.on).reduce((s, c) => s + c.save, 0);
      const waste = Math.max(0.5, Number((6.5 - saved).toFixed(1)));
      const effective = Number((10 - waste).toFixed(1));
      const cnt = CHECKS.filter(c => c.on).length;

      let html = '';
      html += `<text x="24" y="32" fill="var(--tax-ink)" font-size="14" font-weight="700">10 小时项目投入产出切分：有效推进 ${effective}h · 返工内耗 ${waste}h</text>`;
      const barW = 632;
      const effW = (effective / 10) * barW;
      html += `<rect x="24" y="48" width="${effW}" height="32" rx="8" fill="rgba(16,185,129,0.82)"/>`;
      html += `<rect x="${24 + effW}" y="48" width="${barW - effW}" height="32" rx="8" fill="rgba(239,68,68,0.65)"/>`;
      html += `<text x="${24 + effW / 2}" y="69" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">有效推进 ${effective}h</text>`;
      if (barW - effW > 70) {
        html += `<text x="${24 + effW + (barW - effW) / 2}" y="69" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">返工 ${waste}h</text>`;
      }
      html += `<text x="24" y="114" fill="var(--tax-muted)" font-size="12">${cnt === 3 ? '🏆 元认知三问闭环已满配！只花 15 分钟抬头看路，直接抢回 6 小时返工时间！' : '提示：元认知就是从低头拉车的视角里跳出来 2 分钟，站在屋顶俯瞰路线有没有走偏。'}</text>`;
      svg.innerHTML = html;

      if (cnt === 3) {
        ahaBox.innerHTML = '<strong>元认知闭环满配（有效产出 9.5h / 10h）！</strong>区分新手与高手的往往不是敲键盘的手速，而是高手会在开工前、卡壳时、收尾后刻意停顿 2 分钟，用“计划→监控→复盘”三问持续校准方向。';
      } else if (cnt > 0) {
        ahaBox.innerHTML = `<strong>已抢回 ${saved.toFixed(1)} 小时返工：</strong>继续点亮剩下的 ${3 - cnt} 个阶段，把完整元认知飞轮闭合！`;
      }
    }

    render();
  </script>
</body>
</html>
