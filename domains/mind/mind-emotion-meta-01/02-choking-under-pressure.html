<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏀 关键时刻“掉链子”：监控过载机制</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏀 关键时刻“掉链子”：监控过载机制</h1><p>平时闭着眼进 90% 的罚球，到了总决赛最后 1 秒却投出三不沾——因为压力逼着你用慢吞吞的意识去“逐帧微操”本该自动化的肌肉记忆！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>比赛赌注/观众注视压力</span><span id="vPrs">80%</span></label><input type="range" id="sPrs" min="10" max="100" value="80" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>固定赛前仪式（阻断过度微操）</span><span id="vRit">40%</span></label><input type="range" id="sRit" min="0" max="100" value="40" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">前额叶过度微操干扰</div><div class="k-val" id="kInt">—</div></div>
        <div class="kpi"><div class="k-lbl">关键球实际命中率</div><div class="k-val" id="kHit">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const prs=+document.getElementById('sPrs').value, rit=+document.getElementById('sRit').value;
  document.getElementById('vPrs').textContent=prs+'%';
  document.getElementById('vRit').textContent=rit+'%';
  const intr=Math.max(5, Math.round(prs*(1 - rit*0.0065)));
  const hit=Math.max(35, Math.min(92, Math.round(92 - intr*0.52)));
  document.getElementById('kInt').textContent=intr+'%';
  document.getElementById('kInt').style.color=intr>50?'#ef4444':'#059669';
  document.getElementById('kHit').textContent=hit+'% (平时 90%)';
  const wI=Math.max(12, intr*3.6), wH=Math.max(12, hit*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">显性监控理论：压力下“想太多”如何毁掉肌肉记忆</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">意识微操干扰</text>
    <rect x="145" y="64" width="${wI.toFixed(0)}" height="28" rx="6" fill="#ef4444"/>
    <text x="${(153+wI).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#ef4444">${intr}%</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">临场发挥命中</text>
    <rect x="145" y="120" width="${wH.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(153+wH).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${hit}%</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">顶级运动员都有固定赛前小仪式（拍球 3 下、深呼吸），用来把意识锚定在节奏上，别去瞎指挥手腕！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>关键时刻怕出错，越提醒自己“手腕别抖”，越容易把流畅动作拆碎。信任训练好的小脑，专注一个外部目标点即可！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
