<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔔 压力-表现倒 U 曲线与任务难度偏移（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔔 压力-表现倒 U 曲线与任务难度偏移（SVG）</h1><p>零压力时大脑昏昏欲睡，适度压力激发肾上腺素达到巅峰，过高压力则让前额叶宕机——且任务越复杂，最佳压力峰值越靠左！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前生理唤醒/紧张压力</span><span id="vAr">55 分</span></label><input type="range" id="sAr" min="5" max="100" value="55" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>任务认知复杂度（低=搬砖，高=解题/创意）</span><span id="vCmp">65%</span></label><input type="range" id="sCmp" min="10" max="100" value="65" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 210"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">该任务最佳压力峰值</div><div class="k-val" id="kOpt">—</div></div>
        <div class="kpi"><div class="k-lbl">当前临场表现得分</div><div class="k-val" id="kPrf">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const ar=+document.getElementById('sAr').value, cmp=+document.getElementById('sCmp').value;
  document.getElementById('vAr').textContent=ar+' 分';
  document.getElementById('vCmp').textContent=cmp+'%';
  const opt=Math.round(80 - cmp*0.42);
  const spread=36 - cmp*0.14;
  function perfAt(x){ return Math.max(10, Math.round(96*Math.exp(-Math.pow((x-opt)/spread, 2)))); }
  const prf=perfAt(ar);
  document.getElementById('kOpt').textContent=opt+' 分';
  document.getElementById('kPrf').textContent=prf+' 分';
  document.getElementById('kPrf').style.color=prf>=75?'#059669':(ar>opt?'#ef4444':'#f59e0b');
  let pts=[];
  for(let x=5;x<=100;x+=2) pts.push(`${(45+x*5.1).toFixed(1)},${(175-perfAt(x)*1.32).toFixed(1)}`);
  const cx=45+ar*5.1, cy=175-prf*1.32;
  document.getElementById('svg').innerHTML=`
    <text x="45" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">耶克斯-多德森倒 U 曲线（复杂度越高，耐压上限越低）</text>
    <line x1="45" y1="175" x2="555" y2="175" stroke="var(--tax-border)" stroke-width="1.5"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <line x1="${(45+opt*5.1).toFixed(1)}" y1="40" x2="${(45+opt*5.1).toFixed(1)}" y2="175" stroke="#059669" stroke-dasharray="4,3"/>
    <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="8" fill="${ar>opt+15?'#ef4444':'#f59e0b'}" stroke="#fff" stroke-width="2"/>
    <text x="45" y="194" font-size="11" fill="var(--tax-muted)">松懈犯困</text>
    <text x="${(45+opt*5.1).toFixed(1)}" y="194" text-anchor="middle" font-size="11" font-weight="800" fill="#059669">最佳峰值 ${opt}</text>
    <text x="510" y="194" font-size="11" fill="#ef4444">高压崩盘</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>重赏和严厉催逼只对简单重复劳动有效；面对创意、编程和精密决策，高压反而把人推下右侧悬崖！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
