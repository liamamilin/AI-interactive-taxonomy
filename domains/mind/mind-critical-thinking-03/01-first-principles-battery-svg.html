<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>电池成本拆解：类比报价 vs 第一性原理</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .layer-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 600px) { .layer-grid { grid-template-columns: 1fr; } }
    .layer-btn {
      text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; cursor: pointer;
    }
    .layer-btn.peeled { border-color: var(--tax-green); background: var(--tax-green-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔋 电池成本拆解：类比报价 vs 第一性原理（构建器）</h1>
      <p>早期行业共识认为：“电池组历来卖 <strong>$600/kWh</strong>，未来最多降到 $500。”第一性原理拒绝按历史报价类比，而是直接拆到物理原子层：<strong>“伦敦金属交易所买钴、镍、铝、碳和隔膜到底多少钱？”</strong>点击下方按钮逐层剥掉行业溢价包袱！</p>
    </header>

    <section class="toy-card">
      <div class="layer-grid" id="layerGrid"></div>

      <svg id="costSvg" viewBox="0 0 680 190" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="电池成本第一性原理拆解条形图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>类比报价起点（$600/kWh）：</strong>如果只看“别人一直卖多少钱”，你永远走不出 10% 的微调。逐个点击上方拆解项，直抵 $82/kWh 的物理原材料底价！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const LAYERS = [
      { id: 'l1', name: '✂️ 剥离 1：砍掉多级传统供应链与小批量溢价', cut: 180, peeled: false },
      { id: 'l2', name: '✂️ 剥离 2：重构电芯封装（去掉冗余模组外壳）', cut: 135, peeled: false },
      { id: 'l3', name: '✂️ 剥离 3：超级工厂垂直整合规模制造', cut: 125, peeled: false },
      { id: 'l4', name: '⚛️ 核对底层：纯原材料（镍+铝+碳+锂+聚合物）现货价', cut: 78, peeled: false }
    ];

    let done = false;
    const layerGrid = document.getElementById('layerGrid');
    const svg = document.getElementById('costSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      layerGrid.innerHTML = '';
      LAYERS.forEach(l => {
        const b = document.createElement('button');
        b.className = 'layer-btn' + (l.peeled ? ' peeled' : '');
        b.innerHTML = `<strong>${l.peeled ? '✓ 已拆解：' : ''}${l.name}</strong><div style="font-size:11.5px;color:var(--tax-muted);margin-top:3px;">释放降本空间：−$${l.cut}/kWh</div>`;
        b.onclick = () => {
          l.peeled = !l.peeled;
          markDone('使用第一性原理拆解了电池组成本结构');
          render();
        };
        layerGrid.appendChild(b);
      });

      const saved = LAYERS.filter(l => l.peeled).reduce((s, l) => s + l.cut, 0);
      const curCost = 600 - saved;
      const pct = Math.round((curCost / 600) * 100);
      const peeledCnt = LAYERS.filter(l => l.peeled).length;

      let html = '';
      // Reference analogy bar
      html += `<text x="24" y="34" fill="var(--tax-muted)" font-size="12">行业类比历史报价（$600/kWh）</text>`;
      html += `<rect x="24" y="42" width="600" height="26" rx="8" fill="rgba(239,68,68,0.22)" stroke="var(--tax-red)"/>`;
      html += `<text x="614" y="60" text-anchor="end" fill="var(--tax-red)" font-size="12" font-weight="800">$600 / kWh</text>`;

      // Current first-principles bar
      const col = curCost <= 120 ? 'var(--tax-green)' : (curCost <= 320 ? 'var(--tax-primary)' : 'var(--tax-amber)');
      html += `<text x="24" y="100" fill="var(--tax-ink)" font-size="13" font-weight="700">当前第一性原理拆解成本（已剥离 ${peeledCnt}/4 层）</text>`;
      html += `<rect x="24" y="110" width="600" height="32" rx="8" fill="rgba(148,163,184,0.14)"/>`;
      html += `<rect x="24" y="110" width="${Math.max(82, curCost)}" height="32" rx="8" fill="${col}"/>`;
      html += `<text x="${Math.max(94, curCost + 10)}" y="131" fill="${col}" font-size="14" font-weight="800">$${curCost} / kWh（原价的 ${pct}%）</text>`;

      // Physics floor line at $82
      html += `<line x1="${24 + 82}" y1="92" x2="${24 + 82}" y2="156" stroke="var(--tax-green)" stroke-dasharray="4 3" stroke-width="2"/>`;
      html += `<text x="${24 + 82}" y="174" text-anchor="middle" fill="var(--tax-green)" font-size="11" font-weight="700">$82 物理原料底价</text>`;
      svg.innerHTML = html;

      if (peeledCnt === 4) {
        ahaBox.innerHTML = '<strong>直抵物理底价（$82/kWh，狂降 86%）！</strong>电池本身根本不贵，贵的是传统制造路径的历史包袱。第一性原理就是把问题一路拆到<strong>不可再分的物理/数学基本事实</strong>，然后从零重新组装出十倍级优势！';
      } else if (peeledCnt > 0) {
        ahaBox.innerHTML = `<strong>已压缩至 $${curCost}/kWh（省下 $${saved}）：</strong>继续拆解剩下的 ${4 - peeledCnt} 层，看看距离物理原材料底价还有多大鸿沟！`;
      }
    }

    render();
  </script>
</body>
</html>
