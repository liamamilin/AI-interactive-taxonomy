<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔋 电池成本拆解：类比报价 vs 第一性原理（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔋 电池成本拆解：类比报价 vs 第一性原理（SVG）</h1><p>类比思维说：“历史上电池一向卖 600 美元/度，我们努力优化也就降到 500”。第一性原理问：“电池里到底有哪些元素？碳、镍、铝、聚合物在伦敦金属交易所一共才值 80 美元！”</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>第一性原理拆解重构制造效率</span><span id="vEff">75%</span></label><input type="range" id="sEff" min="10" max="95" value="75" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>传统供应链层层加价/历史惯例</span><span id="vMrk">520 美元</span></label><input type="range" id="sMrk" min="150" max="600" step="30" value="520" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">类比微调报价</div><div class="k-val" id="kAna">—</div></div>
        <div class="kpi"><div class="k-lbl">第一性原理重构成本</div><div class="k-val" id="kFp">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const eff=+document.getElementById('sEff').value, mrk=+document.getElementById('sMrk').value;
  document.getElementById('vEff').textContent=eff+'%';
  document.getElementById('vMrk').textContent=mrk+' 美元';
  const raw=82;
  const ana=Math.round((raw + mrk)*0.88);
  const fp=Math.round(raw + mrk*(1 - eff/100)*0.45);
  document.getElementById('kAna').textContent='$'+ana+' / kWh';
  document.getElementById('kFp').textContent='$'+fp+' / kWh (降幅 '+Math.round((1-fp/ana)*100)+'%)';
  document.getElementById('kFp').style.color='#059669';
  const sc=350/700;
  const wA=Math.max(15, ana*sc), wF=Math.max(15, fp*sc), wR=Math.max(15, raw*sc);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">三种成本标尺对比（单位：美元 / kWh）</text>
    <text x="20" y="72" font-size="12" font-weight="750" fill="var(--tax-text)">类比微调报价</text>
    <rect x="145" y="55" width="${wA.toFixed(0)}" height="24" rx="5" fill="#94a3b8"/>
    <text x="${(153+wA).toFixed(0)}" y="72" font-size="12" font-weight="800" fill="var(--tax-muted)">$${ana}</text>
    <text x="20" y="116" font-size="12" font-weight="750" fill="var(--tax-text)">第一性重构价</text>
    <rect x="145" y="99" width="${wF.toFixed(0)}" height="24" rx="5" fill="#059669"/>
    <text x="${(153+wF).toFixed(0)}" y="116" font-size="12" font-weight="800" fill="#059669">$${fp}</text>
    <text x="20" y="160" font-size="12" font-weight="750" fill="var(--tax-text)">原子原料底价</text>
    <rect x="145" y="143" width="${wR.toFixed(0)}" height="24" rx="5" fill="#3b82f6"/>
    <text x="${(153+wR).toFixed(0)}" y="160" font-size="12" font-weight="800" fill="#2563eb">$${raw} (物理下限)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>类比思维只能带来 10% 的渐进改良，唯有剥掉历史惯例、直达物理与数学底线，才能看到 10 倍级重构空间！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
