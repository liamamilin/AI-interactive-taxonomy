<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>何时用类比？何时用第一性原理？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .case-box { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
    .opt-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); cursor: pointer;
    }
    .opt-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .opt-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚖️ 何时用类比？何时用第一性原理？（认知算力分配）</h1>
      <p>第一性原理并不是随时都要用——从零推导极其消耗脑力和时间！为下面 3 个真实决策合理分配<strong>「⚡ 类比迁移（省电 10 倍）」</strong>或<strong>「⚛️ 第一性原理（打破 10 倍瓶颈）」</strong>：</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--tax-muted);">
        <span id="stepTag">决策情境 1 / 3</span>
        <span id="scoreTag" style="color:var(--tax-primary);font-weight:700;">精准分配：0 / 3</span>
      </div>

      <div class="case-box">
        <div style="font-size:16px;font-weight:800;line-height:1.5;" id="caseTitle"></div>
        <div style="font-size:12.5px;color:var(--tax-muted);margin-top:6px;" id="caseDesc"></div>
        <div class="pair">
          <button class="opt-btn" id="btnAnalogy">
            <div style="font-weight:700;font-size:14px;">⚡ 用类比迁移（借鉴成熟最佳实践）</div>
            <div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">耗时短、算力消耗极低、稳妥可控</div>
          </button>
          <button class="opt-btn" id="btnFirst">
            <div style="font-weight:700;font-size:14px;">⚛️ 用第一性原理（推翻重算底层逻辑）</div>
            <div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">极耗脑力与资源，但能撕开 10 倍级突破</div>
          </button>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="fbLine" style="font-size:13px;color:var(--tax-muted);">根据任务回报与时间约束做选择</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一个情境 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>元策略：</strong>生活中 95% 的常规决策靠<strong>类比迁移</strong>就能高效搞定；把珍贵的第一性原理算力，精准留给那 5% 决定成败的核心瓶颈！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CASES = [
      {
        title: '🍽️ 情境 1：团队 6 个人中午 12 点出去吃工作餐，10 分钟内必须定好餐厅',
        desc: '高频率、低风险、时间紧迫的常规日常决策',
        best: 'analogy',
        fb: '必须用类比迁移！直接看高评分榜单或去上次好吃的店，30 秒搞定。如果为了吃午饭去从营养分子学第一性原理设计食谱，下午直接饿晕！'
      },
      {
        title: '🚀 情境 2：传统运载火箭每次发射烧掉 6000 万美元，行业断言太空运输永远不可能便宜',
        desc: '决定公司生死与行业格局的 10 倍级结构性瓶颈',
        best: 'first',
        fb: '典型第一性原理战场！传统类比把“一次性火箭”当成铁律；第一性原理算出燃料仅占成本 0.4%，其余 99.6% 都是扔掉的箭体——从而催生可回收火箭革命！'
      },
      {
        title: '💻 情境 3：给公司内部 50 人用的考勤报销后台选型数据库与前端框架',
        desc: '非核心差异化模块，稳定、好招人、快上线最重要',
        best: 'analogy',
        fb: '坚决用类比迁移（直接选 Postgres + 主流成熟框架）！把第一性原理浪费在造内部后台轮子上，是工程师最常见的“过度设计”陷阱。'
      }
    ];

    let idx = 0, score = 0, locked = false, done = false;
    const btnA = document.getElementById('btnAnalogy');
    const btnF = document.getElementById('btnFirst');
    const fbLine = document.getElementById('fbLine');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const c = CASES[idx];
      locked = false;
      nextBtn.style.display = 'none';
      btnA.className = 'opt-btn';
      btnF.className = 'opt-btn';
      document.getElementById('stepTag').textContent = `决策情境 ${idx + 1} / ${CASES.length}`;
      document.getElementById('caseTitle').textContent = c.title;
      document.getElementById('caseDesc').textContent = c.desc;
      fbLine.textContent = '请选择更划算的思维武器';
    }

    function pick(mode) {
      if (locked) return;
      locked = true;
      const c = CASES[idx];
      const ok = mode === c.best;
      (mode === 'analogy' ? btnA : btnF).classList.add(ok ? 'ok' : 'bad');
      if (ok) score++;
      document.getElementById('scoreTag').textContent = `精准分配：${score} / ${CASES.length}`;
      fbLine.textContent = ok ? '✓ 算力分配极佳！' : '⚠️ 思维工具错配，看下方解析';
      ahaBox.innerHTML = `<strong>${ok ? '✓ 正确权衡' : '⚖️ 算力权衡解析'}：</strong>${c.fb}`;
      if (idx === CASES.length - 1) {
        markDone(`完成类比与第一性原理权衡决策（${score}/3）`);
        nextBtn.textContent = '↺ 重新挑战';
      } else {
        nextBtn.textContent = '下一个情境 →';
      }
      nextBtn.style.display = 'inline-block';
    }

    btnA.onclick = () => pick('analogy');
    btnF.onclick = () => pick('first');
    nextBtn.onclick = () => {
      if (idx === CASES.length - 1) { idx = 0; score = 0; document.getElementById('scoreTag').textContent = '精准分配：0 / 3'; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
