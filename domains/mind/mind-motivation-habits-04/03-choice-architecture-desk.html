<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>书桌选择架构：把好习惯放到伸手可及处</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .item-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .item-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--tax-border); background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 13px; cursor: pointer; }
    .item-btn:hover { border-color: var(--tax-primary); }
    svg .desk-item { cursor: pointer; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🖥️ 书桌选择架构：空间布局改造师</h1>
      <p>点击下方房间平面图里的任意物品（或顶部按钮），把它在<strong>「书桌黄金伸手区（2 秒摩擦）」</strong>和<strong>「客厅高摩擦柜子（25 秒摩擦）」</strong>之间来回挪动，打造一套无需意志力的自动驾驶书桌！</p>
    </header>

    <section class="toy-card">
      <div class="item-bar" id="itemBar"></div>

      <svg id="roomSvg" viewBox="0 0 680 245" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="书桌与客厅空间选择架构"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>改造任务（当前环境分：25 / 100）：</strong>现在手机和薯片正霸占着你的书桌黄金区，而纸质书和水杯却被塞在客厅！点击物品把它们挪到正确的位置！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const ITEMS = [
      { id: 'phone', name: '📱 智能手机', good: false, onDesk: true, deskPos: [110, 120], farPos: [470, 110] },
      { id: 'snack', name: '🍟 高糖零食盒', good: false, onDesk: true, deskPos: [235, 165], farPos: [580, 110] },
      { id: 'book',  name: '📖 待读纸质书', good: true,  onDesk: false, deskPos: [110, 175], farPos: [470, 175] },
      { id: 'water', name: '💧 大容量水壶', good: true,  onDesk: false, deskPos: [235, 110], farPos: [580, 175] }
    ];

    let done = false;
    const itemBar = document.getElementById('itemBar');
    const svg = document.getElementById('roomSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function toggleItem(id) {
      const it = ITEMS.find(x => x.id === id);
      it.onDesk = !it.onDesk;
      markDone('调整了书桌与客厅空间选择架构');
      render();
    }

    function render() {
      itemBar.innerHTML = '';
      ITEMS.forEach(it => {
        const b = document.createElement('button');
        b.className = 'item-btn';
        b.textContent = `${it.name}：${it.onDesk ? '在书桌 → 挪去客厅' : '在客厅 → 放回书桌'}`;
        b.onclick = () => toggleItem(it.id);
        itemBar.appendChild(b);
      });

      const rightCount = ITEMS.filter(it => (it.good && it.onDesk) || (!it.good && !it.onDesk)).length;
      const score = Math.round((rightCount / ITEMS.length) * 100);

      let html = '';
      // Left Zone: Study Desk (Low Friction 2s)
      html += `<rect x="24" y="42" width="300" height="180" rx="14" fill="rgba(59,130,246,0.10)" stroke="var(--tax-primary)" stroke-width="2"/>`;
      html += `<text x="174" y="68" text-anchor="middle" fill="var(--tax-primary)" font-size="13" font-weight="800">🖥️ 书桌黄金伸手区（摩擦 2 秒）</text>`;

      // Right Zone: Living Room Cabinet (High Friction 25s)
      html += `<rect x="372" y="42" width="284" height="180" rx="14" fill="rgba(148,163,184,0.10)" stroke="var(--tax-border)" stroke-width="2" stroke-dasharray="6 4"/>`;
      html += `<text x="514" y="68" text-anchor="middle" fill="var(--tax-muted)" font-size="13" font-weight="800">🚪 客厅高摩擦柜子（摩擦 25 秒）</text>`;

      // Top score bar
      html += `<text x="340" y="25" text-anchor="middle" fill="${score === 100 ? 'var(--tax-green)' : 'var(--tax-ink)'}" font-size="14" font-weight="800">环境选择架构得分：${score} / 100（${rightCount}/4 归位正确）</text>`;

      ITEMS.forEach(it => {
        const [x, y] = it.onDesk ? it.deskPos : it.farPos;
        const ok = (it.good && it.onDesk) || (!it.good && !it.onDesk);
        const fill = ok ? 'rgba(16,185,129,0.22)' : 'rgba(239,68,68,0.20)';
        const stroke = ok ? 'var(--tax-green)' : 'var(--tax-red)';
        html += `<g class="desk-item" data-id="${it.id}">`;
        html += `<rect x="${x - 62}" y="${y - 22}" width="124" height="44" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
        html += `<text x="${x}" y="${y + 4}" text-anchor="middle" fill="var(--tax-ink)" font-size="12.5" font-weight="700">${it.name}</text>`;
        html += `</g>`;
      });

      svg.innerHTML = html;
      svg.querySelectorAll('.desk-item').forEach(g => {
        g.onclick = () => toggleItem(g.dataset.id);
      });

      if (score === 100) {
        ahaBox.innerHTML = '<strong>完美选择架构（100 分）！</strong>你把书和水壶放在 2 秒伸手区，把手机和零食放逐到 25 秒客厅区。塞勒《助推》的核心就是：<strong>重新设计默认环境</strong>，让最省力的动作恰好就是对你最好的动作！';
      } else {
        ahaBox.innerHTML = `<strong>当前得分 ${score} / 100：</strong>还有 ${4 - rightCount} 件物品亮着红框！点击红框物品把它们挪到能放大或阻断对应习惯的空间里。`;
      }
    }

    render();
  </script>
</body>
</html>
