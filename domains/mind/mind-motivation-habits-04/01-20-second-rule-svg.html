<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏱️ 20 秒法则：环境摩擦如何决定行为（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⏱️ 20 秒法则：环境摩擦如何决定行为（SVG）</h1><p>肖恩·埃科尔的 20 秒法则：把吉他放进柜子里需要 25 秒拿出，你一个月都懒得弹；把它架在客厅正中央 3 秒拿到，你每天都会弹！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>好习惯启动阻力（如拿书/换跑鞋）</span><span id="vGood">10 秒</span></label><input type="range" id="sGood" min="2" max="90" value="10" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>坏习惯启动阻力（如手机锁客厅/拔电视）</span><span id="vBad">45 秒</span></label><input type="range" id="sBad" min="2" max="90" value="45" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">好习惯日常执行率</div><div class="k-val" id="kG">—</div></div>
        <div class="kpi"><div class="k-lbl">坏习惯日常发作率</div><div class="k-val" id="kB">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const g=+document.getElementById('sGood').value, b=+document.getElementById('sBad').value;
  document.getElementById('vGood').textContent=g+' 秒';
  document.getElementById('vBad').textContent=b+' 秒';
  const rG=Math.max(8, Math.min(96, Math.round(98*Math.exp(-g/32))));
  const rB=Math.max(8, Math.min(96, Math.round(98*Math.exp(-b/38))));
  document.getElementById('kG').textContent=rG+'%';
  document.getElementById('kG').style.color=rG>=60?'#059669':'#f59e0b';
  document.getElementById('kB').textContent=rB+'%';
  document.getElementById('kB').style.color=rB<=35?'#059669':'#ef4444';
  const wG=Math.max(12, rG*3.6), wB=Math.max(12, rB*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">阻力决定概率：大脑永远像水流一样走向“最小阻力路径”</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">好习惯执行率</text>
    <rect x="145" y="64" width="${wG.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(153+wG).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#059669">${rG}% (启动 ${g}s)</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">坏习惯发作率</text>
    <rect x="145" y="120" width="${wB.toFixed(0)}" height="28" rx="6" fill="#ef4444"/>
    <text x="${(153+wB).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#ef4444">${rB}% (启动 ${b}s)</text>
    <text x="20" y="182" font-size="11.5" fill="var(--tax-muted)">只要给坏习惯人为加上 20~30 秒摩擦（退登录、放另一个房间），大多数冲动在走到一半就熄火了！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>不要高估自己的自控力，也不要低估 20 秒物理摩擦的威力——好习惯减 20 秒，坏习惯加 20 秒！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
