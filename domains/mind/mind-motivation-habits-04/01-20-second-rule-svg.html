<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>20 秒法则：环境摩擦如何决定行为</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 600px) { .ctrl-grid { grid-template-columns: 1fr; } }
    .ctrl-box { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⏱️ 20 秒法则：环境摩擦激活能模拟器</h1>
      <p>积极心理学家肖恩·埃科尔发现：大脑天生遵循“最小阻力路径”。只要把一个行为的启动耗时<strong>减少或增加短短 20 秒</strong>（活化能），它的每周发生率就会发生断崖式反转！</p>
    </header>

    <section class="toy-card">
      <div class="preset-row">
        <button class="toy-btn secondary" id="pBad">📱 默认摆烂环境（手机 2 秒 vs 吉他 35 秒）</button>
        <button class="toy-btn secondary" id="pGood">🎸 20 秒法则改造（吉他 3 秒 vs 手机 30 秒）</button>
      </div>

      <div class="ctrl-grid">
        <div class="ctrl-box">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
            <span>🎸 好习惯（练吉他/看书）启动摩擦</span>
            <strong id="gVal" style="color:var(--tax-green);">35 秒</strong>
          </div>
          <input type="range" id="gRange" min="2" max="60" value="35" style="width:100%;" />
          <div style="font-size:11.5px;color:var(--tax-muted);margin-top:4px;" id="gHint">收在衣柜琴盒里，拿出来装好要 35 秒</div>
        </div>
        <div class="ctrl-box">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
            <span>📱 坏习惯（躺刷手机/看剧）启动摩擦</span>
            <strong id="bVal" style="color:var(--tax-red);">2 秒</strong>
          </div>
          <input type="range" id="bRange" min="2" max="60" value="2" style="width:100%;" />
          <div style="font-size:11.5px;color:var(--tax-muted);margin-top:4px;" id="bHint">就在沙发手边，解锁即刷只要 2 秒</div>
        </div>
      </div>

      <svg id="fricSvg" viewBox="0 0 680 190" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="20秒法则激活能曲线"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>动手调校：</strong>把好习惯摩擦拉到 <strong>5 秒以内</strong>（放客厅支架伸手可拿），同时把坏习惯摩擦拉到 <strong>25 秒以上</strong>（放隔壁房间/扣电池），看看两条概率曲线如何彻底互换！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const gRange = document.getElementById('gRange');
    const bRange = document.getElementById('bRange');
    const svg = document.getElementById('fricSvg');
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    // Logistic drop centered around 20s
    function prob(sec) {
      return Math.round(100 / (1 + Math.exp((sec - 20) / 5.5)));
    }

    function desc(sec, isGood) {
      if (sec <= 8) return isGood ? '放在书桌/客厅支架上，伸手 3 秒就能开始' : '就在手边，无意识一伸手就点开了';
      if (sec <= 22) return isGood ? '在抽屉或书包里，要起身找一下' : '调成黑白屏或藏进二级文件夹';
      return isGood ? '锁在衣柜/盒子里，启动太麻烦大脑直接放弃' : '放进隔壁房间或锁进定时盒，必须起身走过去';
    }

    function render() {
      const gs = Number(gRange.value);
      const bs = Number(bRange.value);
      const gp = prob(gs), bp = prob(bs);

      document.getElementById('gVal').textContent = `${gs} 秒（执行率 ${gp}%）`;
      document.getElementById('bVal').textContent = `${bs} 秒（触发率 ${bp}%）`;
      document.getElementById('gHint').textContent = desc(gs, true);
      document.getElementById('bHint').textContent = desc(bs, false);

      const xOf = s => 50 + (s / 60) * 580;
      const yOf = p => 155 - (p / 100) * 120;

      let pts = [];
      for (let s = 0; s <= 60; s += 2) {
        pts.push(`${xOf(s).toFixed(1)},${yOf(prob(s)).toFixed(1)}`);
      }

      let html = '';
      // 20-second cliff line
      const x20 = xOf(20);
      html += `<line x1="${x20}" y1="24" x2="${x20}" y2="155" stroke="var(--tax-amber)" stroke-dasharray="5 4" stroke-width="2"/>`;
      html += `<text x="${x20}" y="18" text-anchor="middle" fill="var(--tax-amber)" font-size="11" font-weight="700">⏱️ 20 秒心理阻力悬崖</text>`;

      html += `<line x1="50" y1="155" x2="630" y2="155" stroke="var(--tax-border)"/>`;
      [0, 10, 20, 30, 40, 50, 60].forEach(s => {
        html += `<text x="${xOf(s)}" y="174" text-anchor="middle" fill="var(--tax-muted)" font-size="11">${s}秒</text>`;
      });

      html += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3"/>`;

      // Good habit marker
      html += `<circle cx="${xOf(gs)}" cy="${yOf(gp)}" r="7" fill="var(--tax-green)" stroke="#fff" stroke-width="2"/>`;
      html += `<text x="${xOf(gs)}" y="${yOf(gp) - 12}" text-anchor="middle" fill="var(--tax-green)" font-size="11" font-weight="700">🎸 好习惯 ${gp}%</text>`;

      // Bad habit marker
      html += `<circle cx="${xOf(bs)}" cy="${yOf(bp)}" r="7" fill="var(--tax-red)" stroke="#fff" stroke-width="2"/>`;
      html += `<text x="${xOf(bs)}" y="${yOf(bp) + 20}" text-anchor="middle" fill="var(--tax-red)" font-size="11" font-weight="700">📱 坏习惯 ${bp}%</text>`;

      svg.innerHTML = html;

      if (gp >= 75 && bp <= 30) {
        ahaBox.innerHTML = `<strong>环境设计大胜（好习惯 ${gp}% vs 坏习惯 ${bp}%）！</strong>你没花一分意志力，仅仅是把好习惯挪到 20 秒悬崖左侧、把坏习惯推到悬崖右侧，大脑的懒惰天性就开始为你打工了！`;
      } else if (bp >= 75 && gp <= 30) {
        ahaBox.innerHTML = `<strong>最小阻力陷阱（坏习惯 ${bp}% vs 好习惯 ${gp}%）：</strong>不是你不够自律，而是你的房间默认把坏习惯设成了 2 秒直达、把好习惯设成了 35 秒障碍赛！点击上方「20 秒法则改造」看看变化。`;
      } else {
        ahaBox.innerHTML = `<strong>实时对比（好习惯 ${gp}% vs 坏习惯 ${bp}%）：</strong>继续拉大两者的启动秒数差距，跨越 20 秒激活能悬崖！`;
      }
    }

    gRange.oninput = () => { markDone('调节了好习惯启动摩擦秒数'); render(); };
    bRange.oninput = () => { markDone('调节了坏习惯启动摩擦秒数'); render(); };
    document.getElementById('pBad').onclick = () => { gRange.value = 35; bRange.value = 2; markDone('对比了默认环境摩擦'); render(); };
    document.getElementById('pGood').onclick = () => { gRange.value = 3; bRange.value = 30; markDone('应用了20秒法则环境改造'); render(); };
    render();
  </script>
</body>
</html>
