<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏷️ 情绪命名刹车：说出感受即可降温杏仁核</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏷️ 情绪命名刹车：说出感受即可降温杏仁核</h1><p>脑成像研究（Lieberman）发现：仅仅是用精准的词汇把此刻的感受说出来或写下来（如“我此刻感到挫败和尴尬”），就能直接激活右腹外侧前额叶，让杏仁核立刻降温！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>原始杏仁核情绪警报强度</span><span id="vAmy">85 分</span></label><input type="range" id="sAmy" min="20" max="100" value="85" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>情绪命名颗粒度（1=好烦，5=精准拆解）</span><span id="vGrn">4 级</span></label><input type="range" id="sGrn" min="1" max="5" value="4" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">命名后杏仁核残余热度</div><div class="k-val" id="kRem">—</div></div>
        <div class="kpi"><div class="k-lbl">当前表达示例</div><div class="k-val" id="kEx">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const amy=+document.getElementById('sAmy').value, grn=+document.getElementById('sGrn').value;
  document.getElementById('vAmy').textContent=amy+' 分';
  document.getElementById('vGrn').textContent=grn+' 级';
  const drop=grn*9;
  const rem=Math.max(12, amy - drop);
  const exs=['“气死了/好烦”','“我很焦虑”','“我有点委屈和担心”','“感到付出未被看见后的失落”','“精准拆分：担忧失控 + 渴望被认可”'];
  document.getElementById('kRem').textContent=rem+' 分 (降温 -'+drop+')';
  document.getElementById('kRem').style.color=rem<55?'#059669':'#f59e0b';
  document.getElementById('kEx').textContent=exs[grn-1];
  const wA=Math.max(12, amy*3.6), wR=Math.max(12, rem*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">Name It to Tame It：把抽象风暴贴上精准标签后的降温效果</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">命名之前杏仁核</text>
    <rect x="155" y="64" width="${wA.toFixed(0)}" height="28" rx="6" fill="#ef4444"/>
    <text x="${(163+wA).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#ef4444">${amy} 分</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">精准命名之后</text>
    <rect x="155" y="120" width="${wR.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(163+wR).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${rem} 分</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">从“我很愤怒”改成“我注意到自己正在经历愤怒”，能瞬间把你从情绪里抽离成冷静观察者！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>情绪粒度越高（能区分委屈、嫉妒、疲惫与恐惧），前额叶的刹车力越强——能准确命名的怪兽，就不再可怕。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
