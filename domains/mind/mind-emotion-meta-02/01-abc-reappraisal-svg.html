<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌈 情绪 ABC 模型：事件 → 解释 → 情绪（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌈 情绪 ABC 模型：事件 → 解释 → 情绪（SVG）</h1><p>阿尔伯特·艾利斯 ABC 理论：让你崩溃的从来不是事件本身（A），而是你脑子里自动弹出的信念解释（B）！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>客观事件 A 挫折度（如方案被打回）</span><span id="vA">55 分</span></label><input type="range" id="sA" min="10" max="100" value="55" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>信念 B：灾难化/人身攻击解读比例</span><span id="vB">70%</span></label><input type="range" id="sB" min="0" max="100" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">最终情绪痛苦 C</div><div class="k-val" id="kC">—</div></div>
        <div class="kpi"><div class="k-lbl">后续行动模式</div><div class="k-val" id="kAct">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const a=+document.getElementById('sA').value, b=+document.getElementById('sB').value;
  document.getElementById('vA').textContent=a+' 分';
  document.getElementById('vB').textContent=b+'%';
  const c=Math.min(100, Math.round(a*0.35 + b*0.68));
  const act=c>=65?'🔥 情绪内耗/防御反击':'🛠️ 冷静复盘改方案';
  document.getElementById('kC').textContent=c+' 分';
  document.getElementById('kC').style.color=c>=65?'#ef4444':'#059669';
  document.getElementById('kAct').textContent=act;
  document.getElementById('svg').innerHTML=`
    <text x="20" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">认知重评介入点：在 B 处改写剧本，直接改写情绪结局 C</text>
    <rect x="25" y="60" width="145" height="72" rx="10" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
    <text x="97" y="88" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2563eb">A 客观事件</text>
    <text x="97" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="var(--tax-text)">挫折 ${a} 分</text>
    <text x="182" y="102" font-size="20" fill="var(--tax-muted)">→</text>
    <rect x="210" y="60" width="165" height="72" rx="10" fill="#8b5cf6" opacity="0.16" stroke="#8b5cf6" stroke-width="2"/>
    <text x="292" y="88" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7c3aed">B 认知滤镜</text>
    <text x="292" y="112" text-anchor="middle" font-size="12" font-weight="750" fill="var(--tax-text)">${b>50?'“他针对我，我完了”':'“数据不够，正好改好”'}</text>
    <text x="387" y="102" font-size="20" fill="var(--tax-muted)">→</text>
    <rect x="415" y="60" width="160" height="72" rx="10" fill="${c>=65?'#ef4444':'#059669'}" opacity="0.16" stroke="${c>=65?'#ef4444':'#059669'}" stroke-width="2"/>
    <text x="495" y="88" text-anchor="middle" font-size="12.5" font-weight="800" fill="${c>=65?'#ef4444':'#059669'}">C 情绪后果</text>
    <text x="495" y="112" text-anchor="middle" font-size="16" font-weight="900" fill="${c>=65?'#ef4444':'#059669'}">痛苦 ${c} 分</text>
    <text x="25" y="172" font-size="11.5" fill="var(--tax-muted)">试着把 B 调低：同一个挫折，把“全盘否定我”重评为“具体事可改进”，情绪立刻回落安全区！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>事件 A 已经发生无法倒流，但解释 B 的遥控器始终握在你自己手里。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
