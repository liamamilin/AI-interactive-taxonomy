<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🫀 认知重评 vs 情绪压抑：身体暗伤对比</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🫀 认知重评 vs 情绪压抑：身体暗伤对比</h1><p>詹姆斯·格罗斯（Gross）研究发现：把怒火死命憋在脸上装没事（表达抑制），不仅没消气，还会让交感神经和血压飙升，并消耗大量记忆力！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>情绪冲击烈度</span><span id="vStm">75 分</span></label><input type="range" id="sStm" min="20" max="100" value="75" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>提前采用“认知重评”占比</span><span id="vRea">65%</span></label><input type="range" id="sRea" min="0" max="100" value="65" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">心血管交感负荷</div><div class="k-val" id="kCvd">—</div></div>
        <div class="kpi"><div class="k-lbl">当下专注/记忆保留</div><div class="k-val" id="kMem">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const stm=+document.getElementById('sStm').value, rea=+document.getElementById('sRea').value;
  document.getElementById('vStm').textContent=stm+' 分';
  document.getElementById('vRea').textContent=rea+'%';
  const cvd=Math.max(12, Math.round(stm*(1.05 - rea*0.0072)));
  const mem=Math.max(25, Math.min(96, Math.round(45 + rea*0.48 - stm*0.15)));
  document.getElementById('kCvd').textContent=cvd+' 分';
  document.getElementById('kCvd').style.color=cvd>=60?'#ef4444':'#059669';
  document.getElementById('kMem').textContent=mem+'%';
  const wC=Math.max(12, cvd*3.6), wM=Math.max(12, mem*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">早期重评（改写意义）vs 晚期硬憋（死压表情）的生理代价</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">心血管暗伤负荷</text>
    <rect x="155" y="64" width="${wC.toFixed(0)}" height="28" rx="6" fill="${cvd>=60?'#ef4444':'#f59e0b'}"/>
    <text x="${(163+wC).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="${cvd>=60?'#ef4444':'#d97706'}">${cvd} 分</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">剩余认知带宽</text>
    <rect x="155" y="120" width="${wM.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(163+wM).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${mem}%</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">硬憋就像用手堵住沸腾的高压锅气阀，表面风平浪静，内部压力爆表；重评是直接关小炉火！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>真正高情商的情绪调节不是“忍气吞声”，而是在情绪刚冒头时就用新视角关掉它的燃料开关。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
