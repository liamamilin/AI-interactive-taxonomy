<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>认知重评 vs 情绪压抑：身体暗伤对比</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .s-card { padding: 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🫀 认知重评 vs 情绪压抑：30 分钟身心代价对决</h1>
      <p>斯坦福情绪学家 James Gross 发现：同样遭遇一次气人的冲突，<strong>情绪压抑（强装微笑憋在心里）</strong>虽然外表看不出来，却会让血压飙升、工作记忆暴跌；而<strong>认知重评（提前改写解读）</strong>能从源头卸压！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="playBtn">▶ 播放冲突后 30 分钟身心指标赛</button>
        <button class="toy-btn secondary" id="jumpBtn">⏩ 直接看第 30 分钟结局</button>
        <button class="toy-btn secondary" id="resetBtn">↺ 重置</button>
      </div>

      <svg id="raceSvg" viewBox="0 0 680 215" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="认知重评与情绪压抑身心代价对比"></svg>

      <div class="cards">
        <div class="s-card">
          <div style="font-size:12px;color:var(--tax-muted);">😶 情绪压抑组（面无表情硬憋）</div>
          <div style="font-size:16px;font-weight:800;color:var(--tax-red);margin-top:4px;" id="supVal">交感神经负荷：55% · 剩余脑力：90%</div>
        </div>
        <div class="s-card">
          <div style="font-size:12px;color:var(--tax-muted);">🌈 认知重评组（源头换框解读）</div>
          <div style="font-size:16px;font-weight:800;color:var(--tax-green);margin-top:4px;" id="reaVal">交感神经负荷：55% · 剩余脑力：90%</div>
        </div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>对决预告：</strong>按下播放键，观察冲突发生后 30 分钟内，两组人的<strong>血压/交感负荷</strong>与<strong>工作记忆剩余脑力</strong>如何彻底分道扬镳！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let min = 0, playing = false, timer = null, done = false;
    const svg = document.getElementById('raceSvg');
    const playBtn = document.getElementById('playBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function supLoad(m) { return Math.min(92, Math.round(55 + 37 * (1 - Math.exp(-m / 10)))); }
    function reaLoad(m) { return Math.max(18, Math.round(55 - 37 * (1 - Math.exp(-m / 9)))); }

    function draw() {
      const sl = supLoad(min), rl = reaLoad(min);
      const sBrain = Math.max(32, 100 - Math.round(sl * 0.72));
      const rBrain = Math.min(95, 100 - Math.round(rl * 0.45));

      document.getElementById('supVal').textContent = `血压/交感负荷：${sl}% · 剩余脑力：${sBrain}%`;
      document.getElementById('reaVal').textContent = `血压/交感负荷：${rl}% · 剩余脑力：${rBrain}%`;

      const xOf = m => 50 + (m / 30) * 580;
      const yOf = v => 180 - (v / 100) * 135;

      let sPts = [], rPts = [];
      for (let m = 0; m <= min; m++) {
        sPts.push(`${xOf(m).toFixed(1)},${yOf(supLoad(m)).toFixed(1)}`);
        rPts.push(`${xOf(m).toFixed(1)},${yOf(reaLoad(m)).toFixed(1)}`);
      }

      let html = '';
      [25, 50, 75, 100].forEach(v => {
        const y = yOf(v);
        html += `<line x1="50" y1="${y}" x2="630" y2="${y}" stroke="var(--tax-border)" stroke-dasharray="3 3"/>`;
        html += `<text x="42" y="${y + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="11">${v}%</text>`;
      });
      [0, 5, 10, 15, 20, 25, 30].forEach(m => {
        html += `<text x="${xOf(m)}" y="200" text-anchor="middle" fill="var(--tax-muted)" font-size="11">${m}m</text>`;
      });

      html += `<text x="340" y="24" text-anchor="middle" fill="var(--tax-ink)" font-size="13" font-weight="700">冲突后第 ${min} 分钟 · 交感神经/心血管暗伤曲线（越低越健康）</text>`;

      if (sPts.length > 1) {
        html += `<polyline points="${sPts.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3.5"/>`;
        html += `<polyline points="${rPts.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3.5"/>`;
      }
      html += `<circle cx="${xOf(min)}" cy="${yOf(sl)}" r="6" fill="var(--tax-red)"/>`;
      html += `<circle cx="${xOf(min)}" cy="${yOf(rl)}" r="6" fill="var(--tax-green)"/>`;
      svg.innerHTML = html;

      if (min >= 28) {
        ahaBox.innerHTML = `<strong>30 分钟身心分水岭（暗伤 ${sl}% vs ${rl}%）：</strong>强行把委屈和愤怒“憋在表情下面”，就像一边踩油门一边拉手刹——不仅让交感神经持续高压、甚至会传染给对话对象导致对方血压也升高，还霸占了大量工作记忆！提前重评才是真正的省电卸载。`;
      } else if (min >= 10) {
        ahaBox.innerHTML = `<strong>第 ${min} 分钟：</strong>压抑组外表风平浪静，但体内交感负荷已经冲上 ${sl}%；重评组在源头改写解读后，心率与皮质醇正在快速回落！`;
      }
    }

    function stop() { playing = false; clearInterval(timer); playBtn.textContent = '▶ 播放冲突后 30 分钟身心指标赛'; }

    playBtn.onclick = () => {
      markDone('播放了认知重评与情绪压抑30分钟对比');
      if (playing) { stop(); return; }
      if (min >= 30) min = 0;
      playing = true;
      playBtn.textContent = '⏸ 暂停';
      timer = setInterval(() => {
        min++;
        draw();
        if (min >= 30) stop();
      }, 150);
    };
    document.getElementById('jumpBtn').onclick = () => { stop(); min = 30; markDone('查看了情绪压抑暗伤结局'); draw(); };
    document.getElementById('resetBtn').onclick = () => { stop(); min = 0; draw(); };
    draw();
  </script>
</body>
</html>
