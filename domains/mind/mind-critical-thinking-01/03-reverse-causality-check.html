<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>因果箭头反转：是鸡生蛋还是蛋生鸡？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .news-card { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .choice-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    @media (max-width: 640px) { .choice-grid { grid-template-columns: 1fr; } }
    .opt-btn {
      padding: 10px; border-radius: 9px; border: 1px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .opt-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .opt-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); color: var(--tax-red); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>↔️ 因果箭头反转：3 条爆款标题事实核查</h1>
      <p>看到一条耸人听闻的“研究发现 A 与 B 强相关”时，千万别急着转发！为下面 3 条爆款标题画出<strong>真正的因果箭头方向</strong>：是正向（A→B）、反向（B→A），还是幕后混杂（Z→A&amp;B）？</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span id="roundTag" style="font-size:12.5px;color:var(--tax-muted);">头条核查 1 / 3</span>
        <span id="scoreTag" style="font-size:13px;font-weight:700;color:var(--tax-primary);">识破：0 / 3</span>
      </div>

      <div class="news-card">
        <div style="font-size:16px;font-weight:800;line-height:1.5;" id="headlineTxt"></div>
        <div style="font-size:12.5px;color:var(--tax-muted);margin-top:6px;" id="subTxt"></div>
        <div class="choice-grid" id="choiceGrid"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="fbLine" style="font-size:13px;color:var(--tax-muted);">点击判断真实因果结构</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一条新闻 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>核查工具箱：</strong>面对任何相关报道，立刻反问两句：① 箭头会不会其实是反的（B 导致了 A）？② 有没有同时影响两者的隐藏因素 Z？
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CASES = [
      {
        headline: '📰 “震惊！数据显示：频繁去医院看病的人，死亡率比不去医院的高 5 倍！”',
        sub: 'A = 频繁去医院，B = 死亡率高',
        ans: 1,
        labels: ['A → B（去医院导致死亡）', 'B → A（反向因果：生重病才去医院）', 'Z → A & B（纯巧合）'],
        fb: '典型反向因果（B → A）！不是医院把人看死了，而是“已经身患重病”导致他们必须频繁去医院！'
      },
      {
        headline: '📰 “警力越多越危险？统计发现：派驻警察最多的街区，犯罪率也最高！”',
        sub: 'A = 警察数量多，B = 犯罪率高',
        ans: 1,
        labels: ['A → B（警察招来了罪犯）', 'B → A（反向因果：高发案区才增派警力）', '无任何关系'],
        fb: '精准识破反向因果（B → A）！警方正是因为该区域原本犯罪率高，才把更多巡警调配过去！'
      },
      {
        headline: '📰 “家里藏书超过 500 本的孩子，高考分数平均高出 65 分，快去买书摆满客厅！”',
        sub: 'A = 家里藏书多，B = 孩子成绩高',
        ans: 2,
        labels: ['A → B（书架散发神秘辐射）', 'B → A（考高分后买书）', 'Z → A & B（混杂：家庭教育重视度与经济条件）'],
        fb: '经典混杂变量（Z → A & B）！买 500 本书摆着并不能自动提分，真正起作用的是背后“爱读书、重教育、有资源”的家庭环境 Z！'
      }
    ];

    let idx = 0, score = 0, locked = false, done = false;
    const choiceGrid = document.getElementById('choiceGrid');
    const fbLine = document.getElementById('fbLine');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const c = CASES[idx];
      locked = false;
      nextBtn.style.display = 'none';
      document.getElementById('roundTag').textContent = `头条核查 ${idx + 1} / ${CASES.length}`;
      document.getElementById('headlineTxt').textContent = c.headline;
      document.getElementById('subTxt').textContent = c.sub;
      fbLine.textContent = '选择你认为最合理的真实因果方向';
      choiceGrid.innerHTML = '';

      c.labels.forEach((lbl, i) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = lbl;
        b.onclick = () => {
          if (locked) return;
          locked = true;
          const ok = i === c.ans;
          b.classList.add(ok ? 'ok' : 'bad');
          if (ok) score++;
          document.getElementById('scoreTag').textContent = `识破：${score} / ${CASES.length}`;
          fbLine.textContent = ok ? '✓ 核查准确！' : '⚠️ 被标题党带偏了，看下方解析';
          ahaBox.innerHTML = `<strong>${ok ? '✓ 因果侦探命中' : '🔍 因果反转解析'}：</strong>${c.fb}`;
          if (idx === CASES.length - 1) {
            markDone(`完成因果箭头反转事实核查（${score}/3）`);
            nextBtn.textContent = '↺ 重新核查';
          } else {
            nextBtn.textContent = '下一条新闻 →';
          }
          nextBtn.style.display = 'inline-block';
        };
        choiceGrid.appendChild(b);
      });
    }

    nextBtn.onclick = () => {
      if (idx === CASES.length - 1) { idx = 0; score = 0; document.getElementById('scoreTag').textContent = '识破：0 / 3'; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
