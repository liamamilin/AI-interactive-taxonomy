<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧮 万人自然频率方块阵：贝叶斯直觉</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧮 万人自然频率方块阵：贝叶斯直觉</h1>
        <p>误区：大脑看到“检测准确率 95%”就下意识以为“查出阳性 = 95% 确定”。真相：心理学家吉仁泽发现，只要把抽象百分比换成<strong>“100 个人里数人头（自然频率）”</strong>，连小学生都能瞬间破解基础比率谬误！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setCase(1,5,this)">🔍 极罕见事件 (基础率 1% · 误报 5%)</button>
        <button class="pill" onclick="setCase(5,5,this)">🟡 中等基础率 (基础率 5% · 误报 5%)</button>
        <button class="pill" onclick="setCase(20,5,this)">🔥 高发人群 (基础率 20% · 误报 5%)</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">100 人中：真阳性 vs 假阳性</div><div class="k-val" id="kFreq" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">后验概率 P(真 | 阳性)</div><div class="k-val" id="kPost">—</div></div>
        <div class="kpi"><div class="k-lbl">直觉常见错估 vs 真相</div><div class="k-val" id="kGap" style="color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let base = 1, fpRate = 5;
    function setCase(b, f, btn){
      base = b; fpRate = f;
      document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      // Out of 100 people: base are truly positive (95% detected -> tp), (100-base) are negative (fpRate% false alarm -> fp)
      const tp = Math.max(1, Math.round(base * 0.95));
      const fp = Math.max(1, Math.round((100 - base) * (fpRate / 100)));
      const post = Math.round((tp / (tp + fp)) * 100);
      const col = post < 30 ? 'var(--tax-red)' : (post < 70 ? 'var(--tax-amber)' : 'var(--tax-green)');

      // 20 x 5 = 100 squares
      let cells = '';
      for(let i=0; i<100; i++){
        const c = i % 20, r = Math.floor(i / 20);
        const x = 32 + c * 29, y = 38 + r * 28;
        let fill = 'var(--tax-surface-alt)', stroke = 'var(--tax-border)';
        if(i < tp){ fill = 'var(--tax-red)'; stroke = 'var(--tax-red)'; }
        else if(i < tp + fp){ fill = 'var(--tax-amber)'; stroke = 'var(--tax-amber)'; }
        cells += `<rect x="${x}" y="${y}" width="22" height="22" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>`;
      }

      document.getElementById('svg').innerHTML = `
        <text x="32" y="24" font-size="12" font-weight="850" fill="var(--tax-ink)">100 人自然频率矩阵：🔴 真阳性 ${tp} 人 · 🟠 假阳性误报 ${fp} 人 · ⬜ 阴性健康 ${100-tp-fp} 人</text>
        ${cells}
        <text x="32" y="198" font-size="12.5" font-weight="900" fill="${col}">直接数红+橙方块：全部 ${tp+fp} 个报警者中，只有 ${tp} 个是真的 → 真实概率 = ${tp} / ${tp+fp} = ${post}%！</text>
      `;

      document.getElementById('kFreq').textContent = `🔴 ${tp} 人 vs 🟠 ${fp} 人`;
      const kP = document.getElementById('kPost'); kP.textContent = post + '%'; kP.style.color = col;
      document.getElementById('kGap').textContent = `直觉 95% vs 真相 ${post}%`;

      document.getElementById('ahaBox').innerHTML = post < 30
        ? `💡 <strong>顿悟时刻：</strong>一目了然！当基础比率只有 <strong>${base}%</strong> 时，哪怕检测准确率高达 95%，99 个好人里 5% 的误报（<strong>${fp} 个橙方块</strong>）也直接把唯一的 <strong>${tp} 个红方块</strong>淹没了——真实概率只有 <strong>${post}%</strong>！`
        : `💡 <strong>顿悟时刻：</strong>基础比率升到 <strong>${base}%</strong> 后，红色真阳性大军（${tp} 人）迅速反超橙色误报（${fp} 人），后验概率跃升到 <strong>${post}%</strong>——永远先看“池子里的先验基数”！`;
    }

    draw();
  </script>
</body>
</html>
