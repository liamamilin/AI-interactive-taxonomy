<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📚 性格画像 vs 职业人数基数陷阱</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📚 性格画像 vs 职业人数基数陷阱</h1>
        <p>情景：“史蒂夫腼腆、细心、爱整洁、痴迷于把事物分类整理。”他是<strong>图书管理员</strong>还是<strong>农民</strong>？大脑的“代表性启发式”让你秒选图书管理员——却忘了社会上农民人数是图书管理员的 <strong>20 倍</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setRatio(20,this)">🌾 真实社会基数（农民 : 馆员 = 20 : 1）</button>
        <button class="pill" onclick="setRatio(5,this)">🏙️ 大学城社区（5 : 1）</button>
        <button class="pill" onclick="setRatio(1,this)">🏛️ 图书馆年会现场（1 : 1）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">符合画像的图书管理员</div><div class="k-val" id="kLib" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">符合画像的农民人数</div><div class="k-val" id="kFrm" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">史蒂夫真是农民的概率</div><div class="k-val" id="kProb" style="color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    // Assume 40% of librarians fit stereotype, only 10% of farmers fit stereotype (4x more typical!)
    let ratio = 20;
    function setRatio(r, btn){
      ratio = r;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const nLib = 100, nFrm = 100 * ratio;
      const fitLib = Math.round(nLib * 0.40); // 40
      const fitFrm = Math.round(nFrm * 0.10); // 10 * ratio
      const pFrm = Math.round((fitFrm / (fitLib + fitFrm)) * 100);
      const maxFit = Math.max(fitLib, fitFrm);

      const wLib = Math.max(18, Math.round((fitLib / maxFit) * 380));
      const wFrm = Math.max(18, Math.round((fitFrm / maxFit) * 380));

      document.getElementById('svg').innerHTML = `
        <text x="24" y="28" font-size="12.5" font-weight="800" fill="var(--tax-muted)">设定：图书管理员 40% 符合“腼腆爱整理” · 农民仅 10% 符合（画像典型度差 4 倍！）</text>
        <text x="24" y="68" font-size="13" font-weight="850" fill="var(--tax-primary)">📚 符合画像的图书管理员（基数 ${nLib} × 40% = ${fitLib} 人）</text>
        <rect x="24" y="78" width="${wLib}" height="28" rx="6" fill="var(--tax-primary)"/>
        <text x="${24+wLib+10}" y="97" font-size="13" font-weight="900" fill="var(--tax-primary)">${fitLib} 人 (${100-pFrm}%)</text>

        <text x="24" y="138" font-size="13" font-weight="850" fill="var(--tax-green)">🌾 符合画像的农民（基数 ${nFrm} × 10% = ${fitFrm} 人）</text>
        <rect x="24" y="148" width="${wFrm}" height="28" rx="6" fill="var(--tax-green)"/>
        <text x="${24+wFrm+10}" y="167" font-size="13" font-weight="900" fill="var(--tax-green)">${fitFrm} 人 (${pFrm}%)</text>
      `;

      document.getElementById('kLib').textContent = fitLib + ' 人';
      document.getElementById('kFrm').textContent = fitFrm + ' 人';
      document.getElementById('kProb').textContent = pFrm + '% 概率是农民';

      document.getElementById('ahaBox').innerHTML = pFrm > 55
        ? `💡 <strong>顿悟时刻：</strong>尽管“腼腆爱整理”听起来像极了图书管理员（典型度高 4 倍），但因为农民总数是馆员的 <strong>${ratio} 倍</strong>，绝对人数上符合该性格的农民（<strong>${fitFrm} 人</strong>）依然碾压图书管理员（${fitLib} 人）——他有 <strong>${pFrm}%</strong> 的概率其实是农民！`
        : `💡 <strong>顿悟时刻：</strong>只有当你身处 <strong>1:1 人数相当</strong> 的场合（如大学城或年会），性格刻板印象才能占上风（此时馆员概率升至 <strong>${100-pFrm}%</strong>）。永远别让生动画像盖过庞大的先验基数！`;
    }

    draw();
  </script>
</body>
</html>
