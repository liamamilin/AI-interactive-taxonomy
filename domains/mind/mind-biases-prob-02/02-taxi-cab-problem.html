<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚕 卡尼曼蓝绿出租车难题</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🚕 卡尼曼蓝绿出租车难题</h1><p>城市里 85% 是绿车、15% 是蓝车。夜间目击者指认肇事车是蓝车，其夜间辨色准确率 80%——肇事车真是蓝车的概率其实不到一半！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>全城蓝车占比（基础比率）</span><span id="vBlu">15%</span></label><input type="range" id="sBlu" min="5" max="80" value="15" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>目击者夜间辨色准确率</span><span id="vAcc">80%</span></label><input type="range" id="sAcc" min="55" max="98" value="80" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">直觉误猜概率</div><div class="k-val" id="kInt">—</div></div>
        <div class="kpi"><div class="k-lbl">贝叶斯真实概率</div><div class="k-val" id="kBay">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const blu=+document.getElementById('sBlu').value, acc=+document.getElementById('sAcc').value;
  document.getElementById('vBlu').textContent=blu+'%';
  document.getElementById('vAcc').textContent=acc+'%';
  const grn=100 - blu;
  const trueBlue=blu*acc;
  const falseBlue=grn*(100 - acc);
  const bay=Math.round(trueBlue/(trueBlue+falseBlue)*100);
  document.getElementById('kInt').textContent=acc+'% (直接信目击者)';
  document.getElementById('kBay').textContent=bay+'%';
  document.getElementById('kBay').style.color=bay<50?'#ef4444':'#3b82f6';
  const w1=Math.max(12, acc*3.6), w2=Math.max(12, bay*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">目击者说“是蓝车”时：直觉 vs 贝叶斯真相</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">直觉（忽略基数）</text>
    <rect x="160" y="64" width="${w1.toFixed(0)}" height="28" rx="6" fill="#94a3b8"/>
    <text x="${(168+w1).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="var(--tax-muted)">${acc}%</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">贝叶斯后验概率</text>
    <rect x="160" y="120" width="${w2.toFixed(0)}" height="28" rx="6" fill="#3b82f6"/>
    <text x="${(168+w2).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#2563eb">${bay}%</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">每 100 起事故：真蓝车被认对 ${(trueBlue/100).toFixed(1)} 次，绿车被错认成蓝车 ${(falseBlue/100).toFixed(1)} 次。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>人类大脑酷爱生动的具体故事（目击者证词），天生讨厌枯燥的统计底数（全城车辆比例）——这就是基础比率谬误的根源。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
