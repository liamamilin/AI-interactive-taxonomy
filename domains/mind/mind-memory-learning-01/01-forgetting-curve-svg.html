<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📈 间隔重复锯齿曲线（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📈 间隔重复锯齿曲线（SVG）</h1><p>每次在记忆即将跌破阈值时成功提取，记忆稳定性（半衰期 S）都会翻倍增长，曲线从陡峭悬崖变成平缓高原。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>30 天内复习次数</span><span id="vRev">4 次</span></label><input type="range" id="sRev" min="0" max="5" value="4" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>每次成功提取稳定性增幅</span><span id="vMul">2.2x</span></label><input type="range" id="sMul" min="1.2" max="3.0" step="0.2" value="2.2" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">第 30 天记忆留存率</div><div class="k-val" id="kRet">—</div></div>
        <div class="kpi"><div class="k-lbl">最终记忆稳定性</div><div class="k-val" id="kStb">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const rev=+document.getElementById('sRev').value, mul=+document.getElementById('sMul').value;
  document.getElementById('vRev').textContent=rev+' 次';
  document.getElementById('vMul').textContent=mul.toFixed(1)+'x';
  const schedule=[1, 3, 7, 15, 24].slice(0, rev);
  let stab=1.6, lastDay=0, pts=[];
  let ret30=0;
  for(let d=0;d<=30;d+=0.5){
    if(schedule.includes(d)){ stab=stab*mul; lastDay=d; }
    const r=100*Math.exp(-(d-lastDay)/stab);
    if(d===30) ret30=Math.round(r);
    const x=40+d*17.5, y=175-r*1.3;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  document.getElementById('kRet').textContent=ret30+'%';
  document.getElementById('kRet').style.color=ret30>=65?'#059669':(ret30>=35?'#f59e0b':'#ef4444');
  document.getElementById('kStb').textContent=stab.toFixed(1)+' 天半衰';
  const markers=schedule.map(d=>`<line x1="${(40+d*17.5).toFixed(1)}" y1="40" x2="${(40+d*17.5).toFixed(1)}" y2="175" stroke="#059669" stroke-dasharray="3,3" opacity="0.6"/>`).join('');
  document.getElementById('svg').innerHTML=`
    <text x="40" y="26" font-size="13" font-weight="800" fill="var(--tax-text)">30 天记忆留存锯齿曲线（绿虚线 = 复习节点）</text>
    <line x1="40" y1="175" x2="568" y2="175" stroke="var(--tax-border)" stroke-width="1.5"/>
    ${markers}
    <polyline points="${pts.join(' ')}" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <text x="40" y="195" font-size="11" fill="var(--tax-muted)">第 0 天</text>
    <text x="295" y="195" font-size="11" fill="var(--tax-muted)">第 15 天</text>
    <text x="530" y="195" font-size="11" fill="var(--tax-muted)">第 30 天 (${ret30}%)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>遗忘不是记忆的敌人，而是间隔重复的触发器——每次“拉回”都在向海马体发信号：这条知识还会被用到，赶紧转存长期硬盘！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
