<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>考前突击 vs 间隔复习：30 天留存对决</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .score-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .racer-card { padding: 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .racer-val { font-size: 24px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚔️ 考前突击 vs 间隔复习：30 天留存对决</h1>
      <p>两位学习者投入<strong>完全相同的 6 小时</strong>：突击党把 6 小时全砸在第 1 天通宵；间隔党拆成 6 次 × 1 小时（第 1, 3, 7, 12, 18, 25 天）。按下播放键，看谁赢了第 2 天，谁赢了第 30 天！</p>
    </header>

    <section class="toy-card">
      <div class="controls">
        <button class="toy-btn" id="playBtn">▶ 播放 30 天对决</button>
        <button class="toy-btn secondary" id="jump2Btn">跳到第 2 天（突击考场）</button>
        <button class="toy-btn secondary" id="jump30Btn">跳到第 30 天（期末大考）</button>
        <span style="font-size:13px;color:var(--tax-muted);">当前进度：<strong id="dayLabel">第 1 天</strong></span>
      </div>

      <svg id="raceSvg" viewBox="0 0 680 215" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="突击与间隔复习30天留存竞速"></svg>

      <div class="score-pair">
        <div class="racer-card">
          <div style="font-size:12px;color:var(--tax-muted);">🔥 考前突击党（D1 连学 6 小时）</div>
          <div class="racer-val" id="cramVal" style="color:var(--tax-red);">98%</div>
        </div>
        <div class="racer-card">
          <div style="font-size:12px;color:var(--tax-muted);">🌱 间隔复习党（6 次 × 1 小时）</div>
          <div class="racer-val" id="spaceVal" style="color:var(--tax-green);">78%</div>
        </div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>对决说明：</strong>点击「播放 30 天对决」或直接跳转第 2 天与第 30 天，看清“短期考分假象”与“长期真掌握”的交叉反转点！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const SPACE_DAYS = [1, 3, 7, 12, 18, 25];
    let curDay = 1;
    let playing = false;
    let timer = null;
    let done = false;

    const svg = document.getElementById('raceSvg');
    const playBtn = document.getElementById('playBtn');
    const dayLabel = document.getElementById('dayLabel');
    const cramVal = document.getElementById('cramVal');
    const spaceVal = document.getElementById('spaceVal');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function cramAt(d) {
      if (d <= 1) return 98;
      return Math.max(8, Math.round(98 * Math.exp(-(d - 1) / 4.2)));
    }

    function spaceAt(d) {
      let stab = 2.4;
      let last = 1;
      let peak = 78;
      for (const sd of SPACE_DAYS) {
        if (sd > 1 && sd <= d) {
          stab *= 1.85;
          last = sd;
          peak = Math.min(97, peak + 4);
        }
      }
      const r = peak * Math.exp(-(d - last) / stab);
      return Math.max(12, Math.round(r));
    }

    function draw() {
      const c = cramAt(curDay);
      const s = spaceAt(curDay);
      dayLabel.textContent = `第 ${curDay} 天`;
      cramVal.textContent = `${c}%`;
      spaceVal.textContent = `${s}%`;

      const xOf = d => 44 + ((d - 1) / 29) * 604;
      const yOf = v => 185 - (v / 100) * 145;

      let cPts = [], sPts = [];
      for (let d = 1; d <= curDay; d++) {
        cPts.push(`${xOf(d).toFixed(1)},${yOf(cramAt(d)).toFixed(1)}`);
        sPts.push(`${xOf(d).toFixed(1)},${yOf(spaceAt(d)).toFixed(1)}`);
      }

      let html = '';
      [25, 50, 75, 100].forEach(v => {
        const y = yOf(v);
        html += `<line x1="44" y1="${y}" x2="648" y2="${y}" stroke="var(--tax-border)" stroke-dasharray="3 3"/>`;
        html += `<text x="36" y="${y + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="11">${v}%</text>`;
      });
      [1, 5, 10, 15, 20, 25, 30].forEach(d => {
        html += `<text x="${xOf(d)}" y="204" text-anchor="middle" fill="var(--tax-muted)" font-size="11">D${d}</text>`;
      });

      if (cPts.length > 1) {
        html += `<polyline points="${cPts.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3"/>`;
        html += `<polyline points="${sPts.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3"/>`;
      }

      html += `<circle cx="${xOf(curDay)}" cy="${yOf(c)}" r="5.5" fill="var(--tax-red)"/>`;
      html += `<circle cx="${xOf(curDay)}" cy="${yOf(s)}" r="5.5" fill="var(--tax-green)"/>`;
      svg.innerHTML = html;

      if (curDay <= 3) {
        ahaBox.innerHTML = `<strong>第 ${curDay} 天（突击领先 ${c}% vs ${s}%）：</strong>这就是为什么大家迷信考前通宵——如果明天就考、考完就忘，突击党确实分数更高。但接着往第 30 天看！`;
      } else if (curDay < 15) {
        ahaBox.innerHTML = `<strong>第 ${curDay} 天（交叉反超！${s}% vs ${c}%）：</strong>突击党的短期记忆像雪崩一样塌方，而间隔党每次复习都在加固突触连接，已经彻底反超。`;
      } else {
        ahaBox.innerHTML = `<strong>第 ${curDay} 天（长期碾压：${s}% vs ${c}%）：</strong>总投入同样是 6 小时，间隔党在第 30 天依然留存 <strong>${s}%</strong>，突击党只剩 <strong>${c}%</strong>。时间切分方式决定了你是在“租借知识”还是“拥有知识”。`;
      }
    }

    function stop() {
      playing = false;
      clearInterval(timer);
      playBtn.textContent = '▶ 播放 30 天对决';
    }

    playBtn.onclick = () => {
      markDone('播放了考前突击与间隔复习30天对决');
      if (playing) { stop(); return; }
      if (curDay >= 30) curDay = 1;
      playing = true;
      playBtn.textContent = '⏸ 暂停';
      timer = setInterval(() => {
        curDay++;
        draw();
        if (curDay >= 30) stop();
      }, 170);
    };

    document.getElementById('jump2Btn').onclick = () => { stop(); curDay = 2; markDone('对比了第2天突击优势'); draw(); };
    document.getElementById('jump30Btn').onclick = () => { stop(); curDay = 30; markDone('对比了第30天间隔碾压'); draw(); };

    draw();
  </script>
</body>
</html>
