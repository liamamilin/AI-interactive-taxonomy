<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>习得性无助形成与“小胜破冰”器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .s-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .s-val { font-size: 20px; font-weight: 800; color: var(--tax-ink); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🕊️ 习得性无助形成与“小胜破冰”模拟器</h1>
      <p>塞利格曼（Seligman）发现：当个体反复经历“无论怎么努力都没用”的不可控挫败后，即使后来<strong>出口已经敞开</strong>，大脑也会彻底放弃尝试。但只要连续制造 <strong>3 次极小、百分百可控的微胜利</strong>，就能重新点亮掌控感！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn secondary" id="failBtn">⚡ 经历 1 次不可控挫败（逃生门锁死）</button>
        <button class="toy-btn" id="winBtn">🪜 制造 1 次可控小胜（整理桌角 / 跑 5 分钟）</button>
        <button class="toy-btn secondary" id="resetBtn">↺ 重置状态</button>
      </div>

      <svg id="helpSvg" viewBox="0 0 680 190" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="习得性无助与小胜破冰模拟"></svg>

      <div class="stats">
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">主观掌控感（Agency）</div><div class="s-val" id="agVal">70%</div></div>
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">行动尝试意愿</div><div class="s-val" id="tryVal" style="font-size:16px;">主动探索</div></div>
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">累计小胜破冰</div><div class="s-val" id="winVal">0 次</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>动手体验：</strong>先连点 3 次「不可控挫败」，看看主观掌控感跌破 20% 后即使新出口已打开为什么也动弹不得；再连点「制造可控小胜」完成破冰！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let agency = 70;
    let fails = 0, wins = 0;
    let doorOpen = false;
    let done = false;

    const svg = document.getElementById('helpSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function draw() {
      const helpless = agency <= 25;
      document.getElementById('agVal').textContent = agency + '%';
      document.getElementById('agVal').style.color = helpless ? 'var(--tax-red)' : (agency >= 65 ? 'var(--tax-green)' : 'var(--tax-amber)');
      document.getElementById('tryVal').textContent = helpless ? '🧊 习得性无助（放弃尝试）' : (agency >= 65 ? '🚀 主动破局' : '🌱 正在复苏');
      document.getElementById('winVal').textContent = wins + ' 次';

      let html = '';
      // Left: Cage / Environment box
      html += `<rect x="34" y="34" width="260" height="122" rx="12" fill="rgba(148,163,184,0.10)" stroke="${helpless ? 'var(--tax-red)' : 'var(--tax-primary)'}" stroke-width="2"/>`;
      // Door on right wall of cage
      if (doorOpen) {
        html += `<line x1="294" y1="62" x2="294" y2="128" stroke="var(--tax-surface-alt)" stroke-width="5"/>`;
        html += `<text x="312" y="99" fill="var(--tax-green)" font-size="12" font-weight="800">🚪 出口已敞开 →</text>`;
      } else {
        html += `<text x="312" y="99" fill="var(--tax-muted)" font-size="12">🔒 当前通道</text>`;
      }

      // Agent dot inside cage
      const ax = helpless ? 90 : (doorOpen ? 255 : 164);
      html += `<circle cx="${ax}" cy="95" r="22" fill="${helpless ? 'var(--tax-red)' : 'var(--tax-green)'}" opacity="0.22"/>`;
      html += `<circle cx="${ax}" cy="95" r="12" fill="${helpless ? 'var(--tax-red)' : 'var(--tax-green)'}"/>`;
      html += `<text x="164" y="144" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5">${helpless ? '已习得“努力无用”，明明门开了也不愿起身' : '感受到行为与结果的因果连接'}</text>`;

      // Right: Agency Meter
      html += `<text x="440" y="54" fill="var(--tax-ink)" font-size="13" font-weight="700">内部掌控感能量槽：${agency}%</text>`;
      html += `<rect x="440" y="68" width="210" height="22" rx="11" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="440" y="68" width="${(agency / 100) * 210}" height="22" rx="11" fill="${helpless ? 'var(--tax-red)' : (agency >= 65 ? 'var(--tax-green)' : 'var(--tax-amber)')}"/>`;
      html += `<text x="440" y="114" fill="var(--tax-muted)" font-size="11.5">不可控挫败：${fails} 次 · 可控小胜：${wins} 次</text>`;
      html += `<text x="440" y="138" fill="var(--tax-muted)" font-size="11.5">${helpless ? '⚠️ 破冰处方：别立大目标，立刻做一件 5 分钟必成小事！' : '✓ 大脑相信“我的行动能改变结果”'}</text>`;
      svg.innerHTML = html;

      if (helpless) {
        ahaBox.innerHTML = '<strong>进入习得性无助态（掌控感 ≤25%）：</strong>注意看右侧的门其实已经打开了，但大脑记住了“努力=白费”，于是彻底冻僵！现在点击「🪜 制造 1 次可控小胜」，用微小确定的正反馈重启引擎！';
      } else if (wins >= 2 && fails >= 2) {
        ahaBox.innerHTML = '<strong>小胜破冰成功！</strong>神经科学发现，重新激活掌控感靠的不是鸡血口号，而是让大脑亲眼见证“我做一个小动作 → 世界真的变了一点点”。连续 3 次微小胜利，就能彻底打破习得性无助！';
      }
    }

    document.getElementById('failBtn').onclick = () => {
      fails++;
      agency = Math.max(8, agency - 22);
      if (fails >= 3) doorOpen = true; // Door opens right after helplessness forms!
      markDone('模拟了习得性无助的形成过程');
      draw();
    };
    document.getElementById('winBtn').onclick = () => {
      wins++;
      doorOpen = true;
      agency = Math.min(95, agency + 24);
      markDone('使用可控小胜打破了习得性无助');
      draw();
    };
    document.getElementById('resetBtn').onclick = () => {
      agency = 70; fails = 0; wins = 0; doorOpen = false;
      draw();
    };
    draw();
  </script>
</body>
</html>
