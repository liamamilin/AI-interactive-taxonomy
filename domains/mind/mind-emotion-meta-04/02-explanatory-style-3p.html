<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>归因风格 3P 诊断仪：悲观 vs 韧性</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .p-card { padding: 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 10px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
    .opt {
      text-align: left; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); font-size: 12.5px; cursor: pointer;
    }
    .opt.pess { border-color: var(--tax-red); background: var(--tax-red-soft); font-weight: 700; }
    .opt.resi { border-color: var(--tax-green); background: var(--tax-green-soft); font-weight: 700; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🧭 归因风格 3P 诊断仪：悲观 vs 心理韧性（情景诊断）</h1>
      <p>同样遭遇一次<strong>“核心项目答辩被否决”</strong>，塞利格曼发现决定你一蹶不振还是快速反弹的关键，在于解释挫折时的 <strong>3P 维度</strong>：个人化（Personal）、永久性（Permanent）、普遍性（Pervasive）。</p>
    </header>

    <section class="toy-card">
      <div id="pList"></div>

      <svg id="meterSvg" viewBox="0 0 680 120" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="心理韧性恢复力仪表盘"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>3P 调校实验：</strong>当前 3 个维度全落在红色“悲观归因”，极易滑向习得性无助！逐一点击右侧绿色“韧性归因”，观察心理恢复力如何瞬间飙升！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const DIMS = [
      {
        title: '1. 个人化（Personalization）：责任全归自己 vs 客观分担',
        pess: '🔴 都是我太笨、能力不行才搞砸的',
        resi: '🟢 我有准备不足的地方，同时预算收紧和需求变动也有客观影响'
      },
      {
        title: '2. 永久性（Permanence）：一辈子完蛋 vs 暂时性问题',
        pess: '🔴 我永远都做不好公开汇报了',
        resi: '🟢 这次只是数据论证不够充分，下一版补齐就能过关'
      },
      {
        title: '3. 普遍性（Pervasiveness）：人生全盘皆输 vs 局部止损',
        pess: '🔴 连这都做不好，我整个职业生涯都没希望了',
        resi: '🟢 只是这一个方案没过，我的工程交付和团队协作依然很稳'
      }
    ];

    const state = [0, 0, 0]; // 0 = pessimistic, 1 = resilient
    let done = false;

    const pList = document.getElementById('pList');
    const svg = document.getElementById('meterSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      pList.innerHTML = '';
      DIMS.forEach((d, i) => {
        const card = document.createElement('div');
        card.className = 'p-card';
        card.innerHTML = `<div style="font-size:13px;font-weight:700;">${d.title}</div>`;
        const pair = document.createElement('div');
        pair.className = 'pair';

        const b0 = document.createElement('button');
        b0.className = 'opt' + (state[i] === 0 ? ' pess' : '');
        b0.textContent = d.pess;
        b0.onclick = () => { state[i] = 0; markDone('测试了3P归因诊断仪'); render(); };

        const b1 = document.createElement('button');
        b1.className = 'opt' + (state[i] === 1 ? ' resi' : '');
        b1.textContent = d.resi;
        b1.onclick = () => { state[i] = 1; markDone('切换了3P韧性归因模式'); render(); };

        pair.appendChild(b0);
        pair.appendChild(b1);
        card.appendChild(pair);
        pList.appendChild(card);
      });

      const resiCnt = state.reduce((a, b) => a + b, 0);
      const score = 16 + resiCnt * 26; // 16, 42, 68, 94
      const col = score >= 85 ? 'var(--tax-green)' : (score >= 40 ? 'var(--tax-amber)' : 'var(--tax-red)');

      let html = '';
      html += `<text x="24" y="34" fill="var(--tax-ink)" font-size="14" font-weight="700">🛡️ 挫折后 48 小时反弹韧性指数：${score}%（已重塑 ${resiCnt}/3 个 P 维度）</text>`;
      html += `<rect x="24" y="50" width="632" height="22" rx="11" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="24" y="50" width="${(score / 100) * 632}" height="22" rx="11" fill="${col}"/>`;
      html += `<text x="24" y="98" fill="var(--tax-muted)" font-size="12">${resiCnt === 3 ? '🎉 韧性归因达成！你把挫折精准锁死在“暂时、局部、可改进”的盒子里，绝不蔓延成自我否定！' : '提示：悲观归因最致命的杀伤力是把“一次失败”放大成“我这个人永远不行”。'}</text>`;
      svg.innerHTML = html;

      if (resiCnt === 3) {
        ahaBox.innerHTML = '<strong>心理韧性拉满（94%）：</strong>高韧性者并非盲目乐观，而是严格遵守 3P 边界——对挫折坚持<strong>“外部因素 + 暂时性 + 局部性”</strong>，只修问题、不毁自我！';
      } else {
        ahaBox.innerHTML = `<strong>当前韧性 ${score}%：</strong>还有 ${3 - resiCnt} 个维度停留在悲观归因（全责/永久/泛化），试着全部切换为绿色韧性归因！`;
      }
    }

    render();
  </script>
</body>
</html>
