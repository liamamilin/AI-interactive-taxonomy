<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>控制圈 vs 关注圈：把精力收回可控处</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .item-chip {
      padding: 7px 12px; border-radius: 999px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; cursor: pointer;
    }
    .item-chip.in-ctrl { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); font-weight: 700; }
    .item-chip.in-conc { border-color: var(--tax-amber); background: var(--tax-amber-soft); color: var(--tax-amber); font-weight: 700; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⭕ 控制圈 vs 关注圈：精力同心圆空间分拣器</h1>
      <p>史蒂芬·柯维在《高效能人士的七个习惯》中提出：把精力砸在<strong>外圈“关注但不可控”</strong>的事上，控制圈会越来越萎缩；把精力收回<strong>内圈“直接可控”</strong>的事上，你的影响力反而会向外扩张！点击下方事项切换归属圈：</p>
    </header>

    <section class="toy-card">
      <div class="chip-row" id="chipRow"></div>

      <svg id="circleSvg" viewBox="0 0 680 245" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="控制圈与关注圈同心圆空间图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>分拣挑战：</strong>点击上方 6 张焦虑卡片，把真正可控的 3 项放进绿色【核心控制圈】，把不可控的 3 项果断放手到外围【关注圈】！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const ITEMS = [
      { id: 'i1', label: '🌧️ 明天户外活动下不下雨', controllable: false, placed: 'control' },
      { id: 'i2', label: '📉 竞争对手突然降价', controllable: false, placed: 'control' },
      { id: 'i3', label: '😠 同事今天莫名其妙摆臭脸', controllable: false, placed: 'control' },
      { id: 'i4', label: '🛌 我今晚 11 点放下手机睡觉', controllable: true, placed: 'concern' },
      { id: 'i5', label: '📑 我把答辩方案再打磨两遍', controllable: true, placed: 'concern' },
      { id: 'i6', label: '🧘 面对批评先深呼吸 3 秒再回', controllable: true, placed: 'concern' }
    ];

    let done = false;
    const chipRow = document.getElementById('chipRow');
    const svg = document.getElementById('circleSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      chipRow.innerHTML = '';
      ITEMS.forEach(it => {
        const b = document.createElement('button');
        b.className = 'item-chip ' + (it.placed === 'control' ? 'in-ctrl' : 'in-conc');
        b.textContent = `${it.label} [${it.placed === 'control' ? '内·控制圈' : '外·关注圈'}]`;
        b.onclick = () => {
          it.placed = it.placed === 'control' ? 'concern' : 'control';
          markDone('在控制圈与关注圈间分拣了精力事项');
          render();
        };
        chipRow.appendChild(b);
      });

      const correct = ITEMS.filter(it => (it.controllable && it.placed === 'control') || (!it.controllable && it.placed === 'concern')).length;
      const pct = Math.round((correct / ITEMS.length) * 100);
      const innerR = 44 + correct * 7; // Inner circle expands as you focus on controllables!

      let html = '';
      // Outer Circle of Concern
      html += `<circle cx="215" cy="126" r="102" fill="rgba(245,158,11,0.12)" stroke="var(--tax-amber)" stroke-width="2" stroke-dasharray="6 4"/>`;
      html += `<text x="215" y="42" text-anchor="middle" fill="var(--tax-amber)" font-size="11.5" font-weight="700">外围关注圈（果断放手）</text>`;

      // Inner Circle of Control (expands!)
      html += `<circle cx="215" cy="126" r="${innerR}" fill="rgba(16,185,129,0.22)" stroke="var(--tax-green)" stroke-width="2.5"/>`;
      html += `<text x="215" y="122" text-anchor="middle" fill="var(--tax-green)" font-size="13" font-weight="800">核心控制圈</text>`;
      html += `<text x="215" y="142" text-anchor="middle" fill="var(--tax-ink)" font-size="12" font-weight="700">精力精准度 ${pct}%</text>`;

      // Right side list breakdown
      const inCtrl = ITEMS.filter(i => i.placed === 'control');
      const inConc = ITEMS.filter(i => i.placed === 'concern');

      html += `<text x="370" y="34" fill="var(--tax-green)" font-size="13" font-weight="800">🟢 你正在投入精力的控制圈（${inCtrl.length}项）</text>`;
      inCtrl.forEach((it, idx) => {
        const ok = it.controllable;
        html += `<text x="370" y="${58 + idx * 20}" fill="${ok ? 'var(--tax-ink)' : 'var(--tax-red)'}" font-size="12">${ok ? '✓' : '⚠️ 内耗！'} ${it.label}</text>`;
      });

      html += `<text x="370" y="152" fill="var(--tax-amber)" font-size="13" font-weight="800">🟡 你选择放手的关注圈（${inConc.length}项）</text>`;
      inConc.forEach((it, idx) => {
        const ok = !it.controllable;
        html += `<text x="370" y="${176 + idx * 20}" fill="${ok ? 'var(--tax-muted)' : 'var(--tax-red)'}" font-size="12">${ok ? '✓ 已放手' : '⚠️ 别放弃！'} ${it.label}</text>`;
      });

      svg.innerHTML = html;

      if (correct === ITEMS.length) {
        ahaBox.innerHTML = '<strong>控制圈扩张至最大（100% 精准聚焦）！</strong>斯多葛哲学家爱比克泰德说过：“困扰我们的不是无法控制的外界，而是妄图控制它们的执念。”把 100% 精力收回睡眠、方案与情绪回应上，焦虑自然消散！';
      } else {
        ahaBox.innerHTML = `<strong>当前精准度 ${pct}%（${correct}/6 归位正确）：</strong>右侧亮起红色 ⚠️ 的条目正在偷走你的能量！点击上方对应卡片把它们切换回正确圈层。`;
      }
    }

    render();
  </script>
</body>
</html>
