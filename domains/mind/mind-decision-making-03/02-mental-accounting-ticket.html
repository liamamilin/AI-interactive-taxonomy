<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎟️ 心理账户：丢电影票 vs 丢现金悖论</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .scen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:14px; }
    .s-btn { padding:12px 14px; border-radius:12px; border:1.8px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .s-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .s-btn .t { font-size:13.5px; font-weight:900; }
    .s-btn .s { font-size:12px; color:var(--tax-muted); margin-top:4px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🎟️ 心理账户：丢电影票 vs 丢现金悖论</h1>
        <p>诺贝尔经济学奖得主理查德·塞勒经典实验：两个情景在数学上 <strong>100% 完全等价（你都损失了 100 元，且都还没看到电影）</strong>，为什么人们重买电影票的意愿却暴跌了一半？</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="scen-grid">
        <button class="s-btn active" id="bA" onclick="pick('ticket')">
          <div class="t">🎟️ 情景 A：把提前买好的 100 元电影票弄丢了</div>
          <div class="s">到了影院门口发现票不见了。你会再掏 100 元重买一张吗？</div>
        </button>
        <button class="s-btn" id="bB" onclick="pick('cash')">
          <div class="t">💵 情景 B：到了影院门口发现丢了一张 100 元钞票</div>
          <div class="s">你还没买票，但路上丢了 100 元现金。你会照常掏 100 元买票看吗？</div>
        </button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let cur = 'ticket';
    function pick(c){
      cur = c;
      document.getElementById('bA').classList.toggle('active', c==='ticket');
      document.getElementById('bB').classList.toggle('active', c==='cash');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const isT = cur === 'ticket';
      const wA = Math.round(0.46 * 360), wB = Math.round(0.88 * 360);

      document.getElementById('svg').innerHTML = `
        <text x="24" y="26" font-size="13" font-weight="850" fill="var(--tax-ink)">真实心理学实验结果对比（两情景客观总财富减少完全相同 = -200 元）：</text>
        <text x="24" y="62" font-size="12.5" font-weight="800" fill="${isT?'var(--tax-red)':'var(--tax-muted)'}">🎟️ 情景 A（丢电影票）：愿意重买的人仅占 46%</text>
        <rect x="24" y="72" width="360" height="24" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="24" y="72" width="${wA}" height="24" rx="6" fill="var(--tax-red)" opacity="${isT?1:0.4}"/>
        <text x="396" y="89" font-size="12" font-weight="900" fill="var(--tax-red)">46% 愿意看</text>

        <text x="24" y="128" font-size="12.5" font-weight="800" fill="${!isT?'var(--tax-green)':'var(--tax-muted)'}">💵 情景 B（丢 100 元钞票）：照常买票的人高达 88%！</text>
        <rect x="24" y="138" width="360" height="24" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="24" y="138" width="${wB}" height="24" rx="6" fill="var(--tax-green)" opacity="${!isT?1:0.4}"/>
        <text x="396" y="155" font-size="12" font-weight="900" fill="var(--tax-green)">88% 照常看</text>

        <text x="24" y="190" font-size="12" font-weight="800" fill="var(--tax-primary)">
          ${isT ? '🧠 大脑记账方式：把两笔 100 元都记进了【电影娱乐抽屉】→ “花 200 元看场破电影太亏了！”' : '🧠 大脑记账方式：丢钞票记进【一般杂项抽屉】，买票记进【电影抽屉 100 元】→ “票价没贵，照看！”'}
        </text>
      `;

      document.getElementById('ahaBox').innerHTML = isT
        ? `💡 <strong>顿悟时刻：</strong>你心里把钱分装在了不同的<strong>“心理抽屉”</strong>里！丢电影票让你觉得“这场电影成本变成了 200 元”而心痛放弃；但其实从总资产角度看，<strong>钱是完全可替代的（Fungible）</strong>——丢票和丢钞票没有任何财务区别！`
        : `💡 <strong>顿悟时刻：</strong>因为丢掉的 100 元现金被大脑归进了“倒霉杂费账户”，没有污染“看电影账户”，88% 的人爽快买票进场！商家最爱利用心理账户：买 30 万的车时顺手让你加 8000 元脚垫毫不心疼，单卖 8000 元脚垫你却绝不会买！`;
    }

    draw();
  </script>
</body>
</html>
