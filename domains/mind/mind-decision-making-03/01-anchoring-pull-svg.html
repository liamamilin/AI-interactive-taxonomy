<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚓ 数字锚点引力场</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⚓ 数字锚点引力场</h1>
        <p>特沃斯基与卡尼曼 1974 年经典实验：让受试者当面转动一个<strong>完全随机的幸运大转盘</strong>（暗箱只停在 10 或 65），再请他们猜测“联合国中非洲国家占比是多少”。结果一个毫无关联的随机数，竟然把两群人的估价硬生生拉偏了 <strong>20 个百分点</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setAnchor('low',this)">🎡 转盘停在：低锚 10</button>
        <button class="pill" onclick="setAnchor('high',this)">🎡 转盘停在：高锚 65</button>
        <button class="pill" onclick="setAnchor('price',this)">🏷️ 商场实战：原价 9999 划掉卖 3999</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">抛出的初始锚点</div><div class="k-val" id="kAnc" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">受试者最终估价中位数</div><div class="k-val" id="kEst" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">锚定引力偏移量</div><div class="k-val" id="kPull" style="color:var(--tax-red);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const CASES = {
      low: { anc:'10（纯随机转盘）', ancV:10, estV:25, trueV:28, max:80, unit:'%',
        title:'实验组 A：转盘随机停在 10 → 估测非洲国家占联合国比例',
        aha:'💡 <strong>顿悟时刻：</strong>即便受试者亲眼看着大转盘随机转出 <strong>10</strong>、明知它毫无意义，大脑在做“锚定与调整”时依然调整不足，把估价死死拉低在 <strong>25%</strong>！' },
      high: { anc:'65（纯随机转盘）', ancV:65, estV:45, trueV:28, max:80, unit:'%',
        title:'实验组 B：转盘随机停在 65 → 估测非洲国家占联合国比例',
        aha:'💡 <strong>顿悟时刻：</strong>仅仅换了一个毫无关系的随机数 <strong>65</strong>，人群估价中位数就瞬间被拽高到 <strong>45%</strong>（比低锚组高出整整 <strong>+20%</strong>）！连资深法官量刑前掷一次骰子，都会被点数拉偏判刑月数！' },
      price: { anc:'9,999 元（虚高原价）', ancV:9999, estV:4600, trueV:2200, max:11000, unit:'元',
        title:'商场/直播间实战：真实成本价值 2200 元的商品，先标 9999 再划掉卖 3999',
        aha:'💡 <strong>顿悟时刻：</strong>面对高价锚点，最好的防御不是“在它基础上打折还价”，而是<strong>彻底掀翻桌子、重新从零建立自己的独立锚点</strong>（如去查同款底价或重置预算底线）！' }
    };
    let cur = 'high';

    function setAnchor(c, btn){
      cur = c;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const d = CASES[cur];
      const x0=44, x1=596;
      const toX = v => x0 + (v / d.max) * (x1 - x0);

      document.getElementById('svg').innerHTML = `
        <text x="44" y="28" font-size="13" font-weight="850" fill="var(--tax-ink)">${d.title}</text>
        <line x1="${x0}" y1="112" x2="${x1}" y2="112" stroke="var(--tax-border)" stroke-width="6" stroke-linecap="round"/>

        <circle cx="${toX(d.trueV).toFixed(1)}" cy="112" r="9" fill="var(--tax-green)"/>
        <text x="${toX(d.trueV).toFixed(1)}" y="148" text-anchor="middle" font-size="11.5" font-weight="850" fill="var(--tax-green)">客观真值: ${d.trueV}${d.unit}</text>

        <circle cx="${toX(d.ancV).toFixed(1)}" cy="112" r="10" fill="var(--tax-amber)"/>
        <text x="${toX(d.ancV).toFixed(1)}" y="86" text-anchor="middle" font-size="11.5" font-weight="900" fill="var(--tax-amber)">⚓ 初始锚: ${d.ancV}${d.unit}</text>

        <line x1="${toX(d.trueV).toFixed(1)}" y1="112" x2="${toX(d.estV).toFixed(1)}" y2="112" stroke="var(--tax-red)" stroke-width="5"/>
        <circle cx="${toX(d.estV).toFixed(1)}" cy="112" r="11" fill="var(--tax-primary)" stroke="#fff" stroke-width="2.5"/>
        <text x="${toX(d.estV).toFixed(1)}" y="62" text-anchor="middle" font-size="12.5" font-weight="900" fill="var(--tax-primary)">▼ 你的估价被拽到: ${d.estV}${d.unit}</text>

        <text x="320" y="186" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-muted)">锚定效应机制：先入为主的数字成了引力中心，大脑从锚点出发微调，但永远“调整不足”！</text>
      `;

      document.getElementById('kAnc').textContent = d.anc;
      document.getElementById('kEst').textContent = `${d.estV}${d.unit}`;
      const diff = d.estV - d.trueV;
      document.getElementById('kPull').textContent = `${diff>=0?'+':''}${diff}${d.unit} 偏离真值`;
      document.getElementById('ahaBox').innerHTML = d.aha;
    }

    draw();
  </script>
</body>
</html>
