<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>心流三要素：目标清晰 + 即时反馈</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .mod-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
    .mod-btn {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      text-align: left; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .mod-btn.on { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--tax-surface); border: 1px solid var(--tax-border); white-space: nowrap; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎯 心流三要素：把枯燥工作改造成“游戏化心流”</h1>
      <p>为什么打游戏 3 小时不知疲倦，写工作报告 10 分钟就想摸鱼？因为游戏自带<strong>清晰目标 + 即时反馈 + 黄金难度</strong>。试着给“写季度复盘报告”逐个装上心流改造件！</p>
    </header>

    <section class="toy-card">
      <div class="mod-grid" id="modGrid"></div>

      <svg id="gaugeSvg" viewBox="0 0 680 140" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="心流触发指数仪表盘"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>改造起点（18%）：</strong>原始任务“本周写完季度报告”既模糊又缺乏进度反馈，大脑根本不知道下一步该干嘛。依次点亮上方 3 个心流改造件试试！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const MODS = [
      { id: 'goal', title: '🎯 要素 1：把“写完报告”拆成“25 分钟写出 3 条核心数据结论”', sub: '目标从模糊巨石变成一眼可见的下一关', gain: 26, on: false },
      { id: 'fb', title: '⚡ 要素 2：开启实时进度反馈（清单逐条打勾 / 字数条 / 单元测试绿灯）', sub: '把“一周后老板点评”缩短成每 5 分钟可见的即时正反馈', gain: 28, on: false },
      { id: 'bal', title: '⚖️ 要素 3：把难度校准到“+4% 黄金区”（自己先写核心观点，模板交给工具）', sub: '砍掉无聊排版，把脑力集中在刚好有点挑战的深度分析上', gain: 22, on: false }
    ];

    let done = false;
    const modGrid = document.getElementById('modGrid');
    const svg = document.getElementById('gaugeSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      modGrid.innerHTML = '';
      MODS.forEach(m => {
        const b = document.createElement('button');
        b.className = 'mod-btn' + (m.on ? ' on' : '');
        b.innerHTML = `<div><div style="font-weight:700;font-size:13.5px;">${m.title}</div><div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">${m.sub}</div></div><span class="pill">${m.on ? '✓ 已装配' : '+' + m.gain + '%'}</span>`;
        b.onclick = () => {
          m.on = !m.on;
          markDone('装配了心流三要素工作改造件');
          render();
        };
        modGrid.appendChild(b);
      });

      const score = 18 + MODS.filter(m => m.on).reduce((s, m) => s + m.gain, 0);
      const count = MODS.filter(m => m.on).length;
      const col = score >= 85 ? 'var(--tax-green)' : (score >= 55 ? 'var(--tax-primary)' : 'var(--tax-amber)');

      let html = '';
      html += `<text x="24" y="34" fill="var(--tax-ink)" font-size="14" font-weight="700">🌊 心流进入概率：${score}%（已集齐 ${count} / 3 大触发要素）</text>`;
      html += `<rect x="24" y="52" width="632" height="24" rx="12" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="24" y="52" width="${(score / 100) * 632}" height="24" rx="12" fill="${col}"/>`;
      html += `<text x="24" y="104" fill="var(--tax-muted)" font-size="12">${count === 3 ? '🎉 恭喜！你把枯燥工作改造成了“高心流游戏关卡”，专注会像磁铁一样自动吸住你！' : '提示：游戏设计师从来不靠玩家“自律”，而是靠“清晰下一关 + 秒级反馈”制造心流。'}</text>`;
      svg.innerHTML = html;

      if (count === 3) {
        ahaBox.innerHTML = '<strong>心流三要素闭环（94%）：</strong>工作之所以难进入心流，往往不是因为你不努力，而是工作环境天然缺少<strong>清晰微目标</strong>和<strong>即时反馈</strong>。主动给自己装上这三件套，就能像打游戏一样顺滑进入深度工作！';
      } else if (count > 0) {
        ahaBox.innerHTML = `<strong>心流概率提升至 ${score}%：</strong>继续点亮剩下的 ${3 - count} 个要素，看看三者叠加如何产生质变！`;
      }
    }

    render();
  </script>
</body>
</html>
