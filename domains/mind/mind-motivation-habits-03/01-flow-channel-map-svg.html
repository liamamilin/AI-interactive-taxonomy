<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>契克森米哈赖心流通道图</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .preset-btn { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--tax-border); background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; cursor: pointer; }
    .preset-btn:hover { border-color: var(--tax-primary); }
    .info-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .info-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .info-val { font-size: 18px; font-weight: 800; color: var(--tax-ink); margin-top: 2px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🌊 契克森米哈赖心流通道图（空间探索）</h1>
      <p>在下方<strong>「技能水平 × 任务挑战」</strong>二维空间里任意点击（或选择现实场景），观察大脑如何在<strong>焦虑、心流通道、无聊、淡漠</strong>四个状态间切换！</p>
    </header>

    <section class="toy-card">
      <div class="preset-row" id="presetRow"></div>

      <svg id="flowSvg" viewBox="0 0 680 280" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);cursor:crosshair;" aria-label="心流通道二维空间图"></svg>

      <div class="info-bar">
        <div class="info-card"><div style="font-size:12px;color:var(--tax-muted);">当前技能 / 挑战</div><div class="info-val" id="coordVal">70 / 74</div></div>
        <div class="info-card"><div style="font-size:12px;color:var(--tax-muted);">所处心理状态</div><div class="info-val" id="zoneVal" style="color:var(--tax-green);">🌊 心流通道</div></div>
        <div class="info-card"><div style="font-size:12px;color:var(--tax-muted);">调校建议</div><div class="info-val" id="tipVal" style="font-size:14px;">保持 +4% 黄金张力</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>心流黄金法则：</strong>心流发生在“高技能 + 略高于当前能力的挑战（约 +4%）”的斜向通道内。点击图上任意角落，试试把“焦虑”或“无聊”拉回心流通道！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const PRESETS = [
      { name: '😰 新手硬刚高难 Boss', s: 22, c: 82 },
      { name: '🥱 资深老手做重复日报', s: 84, c: 24 },
      { name: '😶 刷无聊信息流', s: 18, c: 16 },
      { name: '🌊 刚好超自己 4% 的硬核项目', s: 72, c: 76 }
    ];

    let skill = 72, chal = 76;
    let done = false;

    const svg = document.getElementById('flowSvg');
    const presetRow = document.getElementById('presetRow');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function classify(s, c) {
      if (s < 32 && c < 32) return { name: '😶 淡漠 / 萎靡区', col: 'var(--tax-muted)', tip: '先找一个有明确目标的小挑战唤醒大脑', aha: '<strong>淡漠区（低技能 × 低挑战）：</strong>刷手机发呆就落在这里——既没有成就感也没有专注张力，越刷越空虚。' };
      const diff = c - s;
      if (diff > 18) return { name: '😰 焦虑 / 过载区', col: 'var(--tax-red)', tip: '拆小任务步骤，或先补齐基础技能', aha: '<strong>焦虑区（挑战远超技能）：</strong>压力触发杏仁核警报，大脑只想逃避拖延。把大任务切成 3 个可执行子模块，就能立刻降回心流通道！' };
      if (diff < -18) return { name: '🥱 无聊 / 懈怠区', col: 'var(--tax-amber)', tip: '给自己加限时、加质量标准或换新玩法', aha: '<strong>无聊区（技能远超挑战）：</strong>重复做毫无新意的工作会让注意力涣散。试着给自己加个“30 分钟极速版”或“重构自动化脚本”的额外挑战！' };
      return { name: '🌊 黄金心流通道', col: 'var(--tax-green)', tip: '保持挑战比技能高约 4%', aha: '<strong>进入心流通道！</strong>此时时间感消失、自我批判关闭、多巴胺与去甲肾上腺素精准配比。随着技能提升，你必须不断升级挑战才能留在通道里！' };
    }

    function render() {
      const z = classify(skill, chal);
      document.getElementById('coordVal').textContent = `技能 ${skill} · 挑战 ${chal}`;
      document.getElementById('zoneVal').textContent = z.name;
      document.getElementById('zoneVal').style.color = z.col;
      document.getElementById('tipVal').textContent = z.tip;
      ahaBox.innerHTML = z.aha;

      const x0 = 60, x1 = 640, y0 = 240, y1 = 24;
      const xOf = s => x0 + (s / 100) * (x1 - x0);
      const yOf = c => y0 - (c / 100) * (y0 - y1);

      let html = '';
      // Anxiety region (upper-left)
      html += `<polygon points="${x0},${y1} ${xOf(82)},${y1} ${x0},${yOf(18)}" fill="rgba(239,68,68,0.12)"/>`;
      // Boredom region (lower-right)
      html += `<polygon points="${xOf(18)},${y0} ${x1},${y0} ${x1},${yOf(82)}" fill="rgba(245,158,11,0.12)"/>`;
      // Flow channel diagonal band
      html += `<polygon points="${x0},${yOf(18)} ${xOf(82)},${y1} ${x1},${y1} ${x1},${yOf(82)} ${xOf(18)},${y0} ${x0},${y0}" fill="rgba(16,185,129,0.18)"/>`;
      // Apathy box (bottom-left)
      html += `<rect x="${x0}" y="${yOf(32)}" width="${xOf(32) - x0}" height="${y0 - yOf(32)}" fill="rgba(148,163,184,0.18)"/>`;

      // Axes
      html += `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="var(--tax-border)" stroke-width="2"/>`;
      html += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--tax-border)" stroke-width="2"/>`;

      // Zone labels
      html += `<text x="${xOf(22)}" y="${yOf(78)}" text-anchor="middle" fill="var(--tax-red)" font-size="14" font-weight="800">😰 焦虑区</text>`;
      html += `<text x="${xOf(78)}" y="${yOf(24)}" text-anchor="middle" fill="var(--tax-amber)" font-size="14" font-weight="800">🥱 无聊区</text>`;
      html += `<text x="${xOf(16)}" y="${yOf(15)}" text-anchor="middle" fill="var(--tax-muted)" font-size="12" font-weight="700">😶 淡漠区</text>`;
      html += `<text x="${xOf(58)}" y="${yOf(60)}" text-anchor="middle" fill="var(--tax-green)" font-size="15" font-weight="800" transform="rotate(-19 ${xOf(58)} ${yOf(60)})">🌊 心流通道（FLOW）</text>`;

      html += `<text x="${(x0 + x1) / 2}" y="268" text-anchor="middle" fill="var(--tax-muted)" font-size="12">技能水平（Skill） →</text>`;
      html += `<text x="20" y="132" text-anchor="middle" fill="var(--tax-muted)" font-size="12" transform="rotate(-90 20 132)">任务挑战（Challenge） →</text>`;

      // Current point
      const px = xOf(skill), py = yOf(chal);
      html += `<circle cx="${px}" cy="${py}" r="14" fill="${z.col}" opacity="0.24"/>`;
      html += `<circle cx="${px}" cy="${py}" r="7" fill="${z.col}" stroke="#fff" stroke-width="2"/>`;
      svg.innerHTML = html;
    }

    PRESETS.forEach(p => {
      const b = document.createElement('button');
      b.className = 'preset-btn';
      b.textContent = p.name;
      b.onclick = () => {
        skill = p.s; chal = p.c;
        markDone(`探索了心流通道场景：${p.name}`);
        render();
      };
      presetRow.appendChild(b);
    });

    svg.addEventListener('click', e => {
      const rect = svg.getBoundingClientRect();
      const vx = ((e.clientX - rect.left) / rect.width) * 680;
      const vy = ((e.clientY - rect.top) / rect.height) * 280;
      skill = Math.max(0, Math.min(100, Math.round(((vx - 60) / 580) * 100)));
      chal = Math.max(0, Math.min(100, Math.round(((240 - vy) / 216) * 100)));
      markDone('在心流通道二维空间图上点击探索了状态分区');
      render();
    });

    render();
  </script>
</body>
</html>
