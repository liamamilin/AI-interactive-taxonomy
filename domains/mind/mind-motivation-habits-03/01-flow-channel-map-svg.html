<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌊 契克森米哈赖心流通道图（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌊 契克森米哈赖心流通道图（SVG）</h1><p>心流（Flow）诞生在“挑战略高于当前技能约 4%”的狭窄走廊：挑战太高会陷入焦虑崩盘，技能太高则会陷入无聊发困。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前个人技能水平</span><span id="vSkl">60 分</span></label><input type="range" id="sSkl" min="10" max="100" value="60" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>当前任务挑战难度</span><span id="vChl">65 分</span></label><input type="range" id="sChl" min="10" max="100" value="65" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">所处心理状态区</div><div class="k-val" id="kZone">—</div></div>
        <div class="kpi"><div class="k-lbl">调优方向</div><div class="k-val" id="kTip">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const skl=+document.getElementById('sSkl').value, chl=+document.getElementById('sChl').value;
  document.getElementById('vSkl').textContent=skl+' 分';
  document.getElementById('vChl').textContent=chl+' 分';
  const diff=chl - skl;
  let zone, tip, col;
  if(skl<30 && chl<30){ zone='🫥 冷漠区（低技能低挑战）'; tip='先选一个稍微有趣的小挑战起步'; col='#64748b'; }
  else if(diff>18){ zone='😰 焦虑恐慌区'; tip='拆小任务难度，或先补足前置技能'; col='#ef4444'; }
  else if(diff<-18){ zone='🥱 无聊厌倦区'; tip='主动加码限时/更高标准，拉升挑战'; col='#f59e0b'; }
  else { zone='🌊 黄金心流通道!'; tip='完美匹配：忘我投入，技能飞速成长'; col='#059669'; }
  document.getElementById('kZone').textContent=zone;
  document.getElementById('kZone').style.color=col;
  document.getElementById('kTip').textContent=tip;
  const px=80 + skl*4.4, py=195 - chl*1.55;
  document.getElementById('svg').innerHTML=`
    <text x="80" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">挑战-技能二维心流通道图（绿带 = 心流走廊）</text>
    <polygon points="80,195 160,195 520,65 520,40 440,40 80,165" fill="#059669" opacity="0.16"/>
    <line x1="80" y1="195" x2="530" y2="195" stroke="var(--tax-border)" stroke-width="1.5"/>
    <line x1="80" y1="35" x2="80" y2="195" stroke="var(--tax-border)" stroke-width="1.5"/>
    <text x="145" y="75" font-size="12.5" font-weight="800" fill="#ef4444">焦虑区（太难）</text>
    <text x="405" y="175" font-size="12.5" font-weight="800" fill="#d97706">无聊区（太简单）</text>
    <text x="295" y="118" font-size="12.5" font-weight="850" fill="#059669">心流通道</text>
    <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="10" fill="${col}" stroke="#fff" stroke-width="2.5"/>
    <text x="530" y="212" text-anchor="end" font-size="11" fill="var(--tax-muted)">技能水平 →</text>
    <text x="20" y="55" font-size="11" fill="var(--tax-muted)">挑战↑</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>随着你技能变强，原本的心流任务会掉进无聊区——所以顶级游戏和顶尖成长者都在不断动态调高挑战等级，沿着心流通道螺旋上升！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
