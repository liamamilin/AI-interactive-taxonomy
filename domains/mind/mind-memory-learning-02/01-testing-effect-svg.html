<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>测试效应：合上书本默写的威力</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .stat-card { padding: 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .big-num { font-size: 26px; font-weight: 800; margin-top: 2px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🧠 测试效应：重复阅读 vs 闭卷提取对决</h1>
      <p>基于 Roediger &amp; Karpicke (2006) 经典实验：同样 4 轮学习时段，<strong>SSSS 组</strong>连续精读 4 遍，<strong>STTT 组</strong>只读 1 遍然后闭卷默写 3 遍。切换考场时间点，见证令人震惊的成绩大反转！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="m5Btn">⏱️ 5 分钟后立刻考试</button>
        <button class="toy-btn secondary" id="d7Btn">📅 7 天后延迟大考</button>
        <button class="toy-btn secondary" id="animBtn">▶ 播放 7 天遗忘反转</button>
      </div>

      <svg id="raceSvg" viewBox="0 0 680 225" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="测试效应成绩反转对比"></svg>

      <div class="cards">
        <div class="stat-card">
          <div style="font-size:12px;color:var(--tax-muted);">📖 重复阅读组（SSSS · 读 4 遍）</div>
          <div class="big-num" id="sScore" style="color:var(--tax-amber);">81%</div>
          <div style="font-size:12px;color:var(--tax-muted);" id="sSub">5 分钟后看似领先</div>
        </div>
        <div class="stat-card">
          <div style="font-size:12px;color:var(--tax-muted);">✍️ 提取练习组（STTT · 1 读 + 3 默写）</div>
          <div class="big-num" id="tScore" style="color:var(--tax-green);">75%</div>
          <div style="font-size:12px;color:var(--tax-muted);" id="tSub">前期费力，但提取路径极深</div>
        </div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>反转预告：</strong>在「5 分钟后立考」里，重复阅读组甚至反超 6%——这就是为什么大多数学生沉迷划重点和反复翻书。点击「7 天后延迟大考」看看一周后发生了什么！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let t = 0; // 0 = 5 min, 1 = 7 days
    let raf = null;
    let done = false;

    const svg = document.getElementById('raceSvg');
    const m5Btn = document.getElementById('m5Btn');
    const d7Btn = document.getElementById('d7Btn');
    const sScore = document.getElementById('sScore');
    const tScore = document.getElementById('tScore');
    const sSub = document.getElementById('sSub');
    const tSub = document.getElementById('tSub');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function draw() {
      const sVal = Math.round(81 - 41 * t); // 81% -> 40%
      const tVal = Math.round(75 - 14 * t); // 75% -> 61%
      const dayText = t < 0.05 ? '5 分钟后' : (t > 0.95 ? '7 天后' : `第 ${(t * 7).toFixed(1)} 天`);

      sScore.textContent = sVal + '%';
      tScore.textContent = tVal + '%';
      sSub.textContent = t > 0.5 ? '7 天遗忘率高达 51%（断崖跌落）' : '5 分钟后略微领先，带来虚假自信';
      tSub.textContent = t > 0.5 ? '7 天遗忘率仅 19%（反超 +21%）' : '提取时费劲，但正在加固长期突触';

      m5Btn.className = t < 0.5 ? 'toy-btn' : 'toy-btn secondary';
      d7Btn.className = t >= 0.5 ? 'toy-btn' : 'toy-btn secondary';

      const x0 = 60, x1 = 360;
      const yOf = v => 190 - (v / 100) * 145;
      const curX = x0 + t * (x1 - x0);

      let html = '';
      // Left: slope chart
      [20, 40, 60, 80, 100].forEach(v => {
        const y = yOf(v);
        html += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--tax-border)" stroke-dasharray="3 3"/>`;
        html += `<text x="${x0 - 8}" y="${y + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="11">${v}%</text>`;
      });
      html += `<text x="${x0}" y="210" text-anchor="middle" fill="var(--tax-muted)" font-size="11">5 分钟后</text>`;
      html += `<text x="${x1}" y="210" text-anchor="middle" fill="var(--tax-muted)" font-size="11">7 天后</text>`;

      // Full lines
      html += `<line x1="${x0}" y1="${yOf(81)}" x2="${x1}" y2="${yOf(40)}" stroke="var(--tax-amber)" stroke-width="3" opacity="0.4"/>`;
      html += `<line x1="${x0}" y1="${yOf(75)}" x2="${x1}" y2="${yOf(61)}" stroke="var(--tax-green)" stroke-width="3" opacity="0.4"/>`;

      // Active progress lines
      html += `<line x1="${x0}" y1="${yOf(81)}" x2="${curX}" y2="${yOf(sVal)}" stroke="var(--tax-amber)" stroke-width="3.5"/>`;
      html += `<line x1="${x0}" y1="${yOf(75)}" x2="${curX}" y2="${yOf(tVal)}" stroke="var(--tax-green)" stroke-width="3.5"/>`;
      html += `<circle cx="${curX}" cy="${yOf(sVal)}" r="6" fill="var(--tax-amber)"/>`;
      html += `<circle cx="${curX}" cy="${yOf(tVal)}" r="6" fill="var(--tax-green)"/>`;

      // Right: Current snapshot bars
      html += `<text x="530" y="34" text-anchor="middle" fill="var(--tax-ink)" font-size="13" font-weight="700">考场快照：${dayText}</text>`;
      const barBase = 190;
      const hS = (sVal / 100) * 135;
      const hT = (tVal / 100) * 135;
      html += `<rect x="445" y="${barBase - hS}" width="64" height="${hS}" rx="8" fill="rgba(245,158,11,0.75)"/>`;
      html += `<text x="477" y="${barBase - hS - 8}" text-anchor="middle" fill="var(--tax-amber)" font-size="14" font-weight="800">${sVal}%</text>`;
      html += `<text x="477" y="210" text-anchor="middle" fill="var(--tax-muted)" font-size="11">重复读 4 遍</text>`;

      html += `<rect x="545" y="${barBase - hT}" width="64" height="${hT}" rx="8" fill="rgba(16,185,129,0.8)"/>`;
      html += `<text x="577" y="${barBase - hT - 8}" text-anchor="middle" fill="var(--tax-green)" font-size="14" font-weight="800">${tVal}%</text>`;
      html += `<text x="577" y="210" text-anchor="middle" fill="var(--tax-muted)" font-size="11">1读+3默写</text>`;

      svg.innerHTML = html;

      if (t >= 0.85) {
        ahaBox.innerHTML = '<strong>测试效应大反转（61% vs 40%）！</strong>“测试”不只是用来打分的尺子，它本身就是最强的学习发动机。合上书本硬想的过程会重建检索线索，让 7 天后的遗忘率直降一大半！';
      } else if (t <= 0.1) {
        ahaBox.innerHTML = '<strong>短期陷阱（81% vs 75%）：</strong>如果只在学完 5 分钟后测，重复阅读组略微占优，而且自己感觉“全懂了”。点「7 天后延迟大考」看真正决定长期掌握的分水岭！';
      }
    }

    function animateTo(target) {
      cancelAnimationFrame(raf);
      const start = t;
      const startMs = performance.now();
      const dur = 1100;
      function step(now) {
        const p = Math.min(1, (now - startMs) / dur);
        const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        t = start + (target - start) * ease;
        draw();
        if (p < 1) raf = requestAnimationFrame(step);
      }
      raf = requestAnimationFrame(step);
    }

    m5Btn.onclick = () => { markDone('对比了测试效应短期成绩'); animateTo(0); };
    d7Btn.onclick = () => { markDone('对比了测试效应7天延迟大反转'); animateTo(1); };
    document.getElementById('animBtn').onclick = () => { markDone('播放了测试效应7天反转动画'); t = 0; animateTo(1); };
    draw();
  </script>
</body>
</html>
