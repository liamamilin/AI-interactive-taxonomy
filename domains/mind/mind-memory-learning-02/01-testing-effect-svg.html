<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 测试效应：合上书本默写的威力（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧠 测试效应：合上书本默写的威力（SVG）</h1><p>Roediger & Karpicke 经典实验：重复阅读 4 遍的学生在 5 分钟后略微领先，但 1 周后合书自测组的留存率反超 50% 以上！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>复习时间中“合书自测”占比</span><span id="vRet">60%</span></label><input type="range" id="sRet" min="0" max="100" value="60" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>距离正式测试的天数</span><span id="vDay">7 天</span></label><input type="range" id="sDay" min="1" max="30" value="7" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">纯重复阅读组得分</div><div class="k-val" id="kRead">—</div></div>
        <div class="kpi"><div class="k-lbl">你的提取练习策略得分</div><div class="k-val" id="kTest">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const ret=+document.getElementById('sRet').value, day=+document.getElementById('sDay').value;
  document.getElementById('vRet').textContent=ret+'%';
  document.getElementById('vDay').textContent=day+' 天';
  const readScore=Math.max(12, Math.round(82*Math.exp(-day/9)));
  const effRet=Math.min(85, ret);
  const testScore=Math.max(15, Math.min(96, Math.round((74 + effRet*0.14)*Math.exp(-day/(9 + effRet*0.35)))));
  document.getElementById('kRead').textContent=readScore+' 分';
  document.getElementById('kTest').textContent=testScore+' 分';
  document.getElementById('kTest').style.color=testScore>readScore?'#059669':'#3b82f6';
  const wR=Math.max(12, readScore*3.6), wT=Math.max(12, testScore*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">第 ${day} 天闭卷测试成绩对比（满 100 分）</text>
    <text x="20" y="84" font-size="12.5" font-weight="750" fill="var(--tax-text)">纯重复阅读</text>
    <rect x="145" y="66" width="${wR.toFixed(0)}" height="30" rx="6" fill="#94a3b8"/>
    <text x="${(153+wR).toFixed(0)}" y="86" font-size="12.5" font-weight="800" fill="var(--tax-muted)">${readScore} 分</text>
    <text x="20" y="140" font-size="12.5" font-weight="750" fill="var(--tax-text)">提取占比 ${ret}%</text>
    <rect x="145" y="122" width="${wT.toFixed(0)}" height="30" rx="6" fill="#059669"/>
    <text x="${(153+wT).toFixed(0)}" y="142" font-size="12.5" font-weight="800" fill="#059669">${testScore} 分</text>
    <text x="20" y="184" font-size="11.5" fill="var(--tax-muted)">注：把书合上强迫自己回忆，是在修筑“提取高速公路”；只用眼睛看书只是在给大脑制造“眼熟”的错觉。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>测试不只是用来“打分”的，测试本身就是最强的学习动作！合上书默写 10 分钟，胜过划荧光笔重读 1 小时。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
