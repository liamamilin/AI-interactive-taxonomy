<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪞 流畅感错觉：预测成绩 vs 真实成绩</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🪞 流畅感错觉：预测成绩 vs 真实成绩</h1><p>把同一页笔记读 5 遍后，你觉得自己“全懂了”，但那只是“识别流畅”，一到闭卷“回忆”就露馅。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>重复浏览/划重点次数</span><span id="vRd">5 遍</span></label><input type="range" id="sRd" min="1" max="10" value="5" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>闭卷自测纠错次数</span><span id="vQz">1 次</span></label><input type="range" id="sQz" min="0" max="6" value="1" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">自我感觉掌握度</div><div class="k-val" id="kFeel">—</div></div>
        <div class="kpi"><div class="k-lbl">一周后真实闭卷分</div><div class="k-val" id="kReal">—</div></div>
        <div class="kpi"><div class="k-lbl">认知幻觉落差</div><div class="k-val" id="kGap">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const rd=+document.getElementById('sRd').value, qz=+document.getElementById('sQz').value;
  document.getElementById('vRd').textContent=rd+' 遍';
  document.getElementById('vQz').textContent=qz+' 次';
  const feel=Math.min(98, Math.round(40 + rd*6.2 + qz*2));
  const real=Math.min(96, Math.round(24 + Math.min(rd,3)*5 + qz*10.5));
  const gap=feel - real;
  document.getElementById('kFeel').textContent=feel+' 分';
  document.getElementById('kReal').textContent=real+' 分';
  document.getElementById('kReal').style.color=real>=70?'#059669':'#f59e0b';
  document.getElementById('kGap').textContent=(gap>0?'高估 +':'校准 ')+gap+' 分';
  document.getElementById('kGap').style.color=gap>20?'#ef4444':'#059669';
  const w1=Math.max(10, feel*3.6), w2=Math.max(10, real*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">自我感觉（流畅感）vs 真实闭卷表现</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">自以为学会了</text>
    <rect x="145" y="64" width="${w1.toFixed(0)}" height="28" rx="6" fill="#8b5cf6" opacity="0.8"/>
    <text x="${(153+w1).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#8b5cf6">${feel} 分</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">真实闭卷成绩</text>
    <rect x="145" y="120" width="${w2.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(153+w2).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${real} 分</text>
    <text x="20" y="182" font-size="11.5" fill="var(--tax-muted)">${gap>20?'⚠️ 严重“眼熟当学会”幻觉！多做闭卷提取才能戳破虚高自信。':'✅ 自我评估与真实能力高度对齐！'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>“看懂答案”和“自己写得出答案”调用的是两条完全不同的神经通路。永远别拿看书时的顺畅感当成学会的证据。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
