<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎤 费曼输出法：教别人是最强提取</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎤 费曼输出法：教别人是最强提取</h1><p>试着不看资料，把一个复杂概念用大白话讲给外行听——凡是你卡壳或被迫用专业术语糊弄的地方，就是真正的知识漏洞。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>概念抽象链条长度</span><span id="vDep">6 环</span></label><input type="range" id="sDep" min="3" max="10" value="6" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>费曼白话转述迭代轮次</span><span id="vRnd">2 轮</span></label><input type="range" id="sRnd" min="0" max="5" value="2" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">暴露并修补的盲区</div><div class="k-val" id="kFix">—</div></div>
        <div class="kpi"><div class="k-lbl">迁移应用能力</div><div class="k-val" id="kTr">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const dep=+document.getElementById('sDep').value, rnd=+document.getElementById('sRnd').value;
  document.getElementById('vDep').textContent=dep+' 环';
  document.getElementById('vRnd').textContent=rnd+' 轮';
  const solid=Math.min(dep, Math.max(1, Math.round(dep*(0.28 + rnd*0.16))));
  const tr=Math.min(98, Math.round(25 + (solid/dep)*72));
  document.getElementById('kFix').textContent=solid+' / '+dep+' 环打通';
  document.getElementById('kTr').textContent=tr+'%';
  document.getElementById('kTr').style.color=tr>=75?'#059669':'#f59e0b';
  let nodes='';
  const step=500/dep;
  for(let i=0;i<dep;i++){
    const cx=55+i*step+step/2;
    const ok=i<solid;
    if(i>0) nodes+=`<line x1="${(cx-step).toFixed(1)}" y1="100" x2="${cx.toFixed(1)}" y2="100" stroke="${ok?'#059669':'#ef4444'}" stroke-width="3" stroke-dasharray="${ok?'':'4,3'}"/>`;
    nodes+=`<circle cx="${cx.toFixed(1)}" cy="100" r="18" fill="${ok?'#059669':'#ef4444'}" opacity="${ok?'0.9':'0.25'}" stroke="${ok?'#059669':'#ef4444'}" stroke-width="2"/>
      <text x="${cx.toFixed(1)}" y="104" text-anchor="middle" font-size="11" font-weight="800" fill="${ok?'#fff':'#ef4444'}">${ok?'通':'缺'}</text>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">概念因果链完整度（红色空心 = 靠术语糊弄过去的黑洞）</text>
    ${nodes}
    <text x="20" y="168" font-size="11.5" fill="var(--tax-muted)">每多一轮“禁用术语、举生活类比”的费曼讲解，就能逼出并修补隐藏的逻辑断点。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>如果你不能用简单的话把它讲清楚，说明你还没有真正理解它。输出不是学习的终点，而是最高效的纠错雷达。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
