<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📢 确认偏误与回音室极化器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📢 确认偏误与回音室极化器</h1>
        <p>误区：互联网信息这么发达，只要每天多刷新闻就能越来越客观。真相：人类天生爱点赞支持自己观点的帖子，推荐算法又拼命投喂同类内容——原本只有轻微差异的温和派，刷完 10 轮信息流就会被撕裂成水火不容的极端派！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="playFeed()">▶ 播放 10 轮信息流喂养演化</button>
        <button class="pill active" onclick="setMode('algo',this)">📱 算法迎合回音室（只推同温层）</button>
        <button class="pill" onclick="setMode('diverse',this)">🧭 主动破壁（引入 35% 理性反方）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">第 10 轮双方立场鸿沟</div><div class="k-val" id="kGap" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">信息茧房封闭度</div><div class="k-val" id="kCoc" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">理性对话可能性</div><div class="k-val" id="kTalk" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let mode = 'algo', step = 10, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setMode(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); playFeed();
    }
    function playFeed(){
      if(timer) clearInterval(timer);
      markDone();
      step = 0;
      timer = setInterval(()=>{
        step++;
        draw();
        if(step >= 10){ clearInterval(timer); timer=null; }
      }, 120);
      draw();
    }

    function posAt(r){
      // Start mild: A=45, B=55
      if(mode === 'algo'){
        const a = Math.max(5, Math.round(45 - r * 4.0));
        const b = Math.min(95, Math.round(55 + r * 4.0));
        return { a, b };
      }
      const a = Math.round(45 - r * 0.6);
      const b = Math.round(55 + r * 0.6);
      return { a, b };
    }

    function draw(){
      const x0=54, x1=612, yMin=28, yMax=188;
      const toX = r => x0 + (r/10)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pA=[], pB=[];
      for(let r=0; r<=step; r++){
        const v = posAt(r);
        pA.push(`${toX(r).toFixed(1)},${toY(v.a).toFixed(1)}`);
        pB.push(`${toX(r).toFixed(1)},${toY(v.b).toFixed(1)}`);
      }
      const now = posAt(step);
      const gap = now.b - now.a;

      document.getElementById('svg').innerHTML = `
        <line x1="${x0}" y1="${toY(50)}" x2="${x1}" y2="${toY(50)}" stroke="var(--tax-muted)" stroke-dasharray="4 4"/>
        <text x="${x0-6}" y="${toY(50)+4}" text-anchor="end" font-size="10.5" fill="var(--tax-muted)">中立</text>
        ${[0,2,4,6,8,10].map(r=>`<text x="${toX(r)}" y="206" text-anchor="middle" font-size="11" fill="var(--tax-muted)">第${r}轮</text>`).join('')}
        <polyline points="${pA.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3.4"/>
        <polyline points="${pB.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3.4"/>
        <circle cx="${toX(step)}" cy="${toY(now.a)}" r="6" fill="var(--tax-primary)"/>
        <circle cx="${toX(step)}" cy="${toY(now.b)}" r="6" fill="var(--tax-red)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-primary)">● 蓝方温和派 (${now.a})</text>
        <text x="${x0+150}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-red)">● 红方温和派 (${now.b}) · 当前撕裂鸿沟：${gap} 分</text>
      `;

      document.getElementById('kGap').textContent = `${gap} 分` + (gap>=60?' 🔥 严重极化':' ✅ 温和可控');
      document.getElementById('kCoc').textContent = mode==='algo' ? '92% 密闭茧房' : '35% 开放通风';
      document.getElementById('kTalk').textContent = gap>=60 ? '几乎为零（互相拉黑）' : '高度可对话 🤝';

      document.getElementById('ahaBox').innerHTML = mode === 'algo'
        ? `💡 <strong>顿悟时刻：</strong>开局两人只差 10 分，完全可以坐下来聊天；但“人性确认偏误 × 算法投其所好”连刷 10 轮后，双方被推向 <strong>${now.a} vs ${now.b}</strong> 的极端两极——你以为自己越来越清醒，其实只是在回音室里反复听自己的回声！`
        : `💡 <strong>顿悟时刻：</strong>主动在信息源里混入 <strong>35% 高质量反方观点</strong>，就像给密闭房间开了一扇窗，10 轮后双方分歧始终稳在 <strong>${gap} 分</strong>的理性区间，免于被算法推向极端！`;
    }

    draw();
  </script>
</body>
</html>
