<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📢 确认偏误与回音室极化器（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📢 确认偏误与回音室极化器（SVG）</h1><p>人类天生喜欢搜寻支持自己观点的证据，而现代推荐算法又专门投你所好，两者叠加构成飞轮般的“回音室极化”。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>个人对反面证据的过滤排斥度</span><span id="vRej">75%</span></label><input type="range" id="sRej" min="0" max="95" value="75" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>推荐算法同温层喂养强度</span><span id="vAlg">70%</span></label><input type="range" id="sAlg" min="0" max="95" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">10 轮后的观点极端度</div><div class="k-val" id="kExt">—</div></div>
        <div class="kpi"><div class="k-lbl">信息茧房状态</div><div class="k-val" id="kSt">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const rej=+document.getElementById('sRej').value, alg=+document.getElementById('sAlg').value;
  document.getElementById('vRej').textContent=rej+'%';
  document.getElementById('vAlg').textContent=alg+'%';
  let b=55, pts=[];
  for(let i=0;i<=10;i++){
    const x=45+i*50, y=175 - b*1.3;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    const proRatio=0.5 + (alg/200);
    const conAccept=(1 - proRatio)*(1 - rej/100);
    b=Math.min(99, Math.max(50, b + (proRatio*0.65 - conAccept*0.8)*11));
  }
  const fin=Math.round(b);
  document.getElementById('kExt').textContent=fin+'% 确信';
  document.getElementById('kExt').style.color=fin>=85?'#ef4444':'#059669';
  document.getElementById('kSt').textContent=fin>=85?'🚨 深度信息茧房':'✅ 保持开放校准';
  document.getElementById('svg').innerHTML=`
    <text x="45" y="26" font-size="13" font-weight="800" fill="var(--tax-text)">初始 55% 轻微倾向，经过 10 轮信息流后的极化轨迹</text>
    <line x1="45" y1="175" x2="555" y2="175" stroke="var(--tax-border)" stroke-width="1.5"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${fin>=85?'#ef4444':'#3b82f6'}" stroke-width="3"/>
    <text x="45" y="194" font-size="11" fill="var(--tax-muted)">第 0 轮 (55%)</text>
    <text x="485" y="194" font-size="11" font-weight="800" fill="${fin>=85?'#ef4444':'#3b82f6'}">第 10 轮 (${fin}%)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>确认偏误 + 推荐算法会把“轻微偏好”滚雪球成“绝对真理”。打破茧房的唯一办法是主动订阅高质量的反方观点。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
