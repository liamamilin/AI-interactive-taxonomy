<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧪 沃森 2-4-6 实验：证实 vs 证伪</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .chip-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:9px; margin-bottom:12px; }
    .c-btn { padding:10px 11px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .c-btn.yes { border-color:var(--tax-green); background:var(--tax-green-soft); }
    .c-btn.no { border-color:var(--tax-red); background:var(--tax-red-soft); }
    .c-btn .t { display:flex; justify-content:space-between; font-size:14px; font-weight:900; font-family:monospace; }
    .c-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧪 沃森 2-4-6 实验：证实 vs 证伪</h1>
        <p>1960 年经典心理学实验：我心里藏着一条关于三个数字的规则，已知 <strong>2 - 4 - 6</strong> 符合规则！大多数人直觉猜“每次 +2 的偶数”，于是只测 4-6-8、10-12-14——结果 <strong>80% 的人永远猜错真正规则</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🔬 点击下方三元组向系统发起检验（看看哪些是“只求证实”、哪些是“高明证伪”）：</div>
      <div class="chip-grid" id="grid"></div>
      <div class="bar">
        <button class="tax-btn" onclick="reveal()">🔓 我想好了，揭晓隐藏的真正规则！</button>
        <button class="tax-back" style="cursor:pointer;" onclick="resetExp()">↺ 清空重测</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 190"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    // Hidden rule: strictly ascending (a < b < c)!
    const CASES = [
      { id:0, seq:'4 - 6 - 8',    ok:true,  type:'confirm', note:'正向证实（延续+2偶数猜想）' },
      { id:1, seq:'10 - 12 - 14', ok:true,  type:'confirm', note:'正向证实（信息量极低）' },
      { id:2, seq:'1 - 2 - 3',    ok:true,  type:'falsify', note:'⚡ 证伪测试：打破偶数与+2！' },
      { id:3, seq:'1 - 5 - 100',  ok:true,  type:'falsify', note:'⚡ 证伪测试：打破等差间距！' },
      { id:4, seq:'6 - 4 - 2',    ok:false, type:'falsify', note:'⚡ 边界证伪：倒序降序！' },
      { id:5, seq:'2 - 2 - 2',    ok:false, type:'falsify', note:'⚡ 边界证伪：相等不增！' }
    ];
    let tested = new Set();
    let revealed = false;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function testCase(id){ tested.add(id); markDone(); draw(); }
    function reveal(){ revealed = true; markDone(); draw(); }
    function resetExp(){ tested = new Set(); revealed = false; draw(); }

    function draw(){
      document.getElementById('grid').innerHTML = CASES.map(c => {
        const isT = tested.has(c.id);
        const cls = isT ? (c.ok ? 'yes' : 'no') : '';
        return `
          <button class="c-btn ${cls}" onclick="testCase(${c.id})">
            <div class="t"><span>${c.seq}</span><span>${isT ? (c.ok ? '✅ 符合' : '❌ 不符') : '点击测'}</span></div>
            <div class="s">${isT ? c.note : '点击提交给裁判检验'}</div>
          </button>
        `;
      }).join('');

      const confCnt = Array.from(tested).filter(id => CASES[id].type === 'confirm').length;
      const falsCnt = Array.from(tested).filter(id => CASES[id].type === 'falsify').length;
      const infoPct = Math.min(100, confCnt * 8 + falsCnt * 26);

      document.getElementById('svg').innerHTML = `
        <text x="24" y="30" font-size="13" font-weight="850" fill="var(--tax-ink)">你的实验信息增益进度（已测 ${tested.size} 组：正向证实 ${confCnt} 次 · 主动证伪 ${falsCnt} 次）</text>
        <rect x="24" y="46" width="592" height="26" rx="8" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="24" y="46" width="${Math.round(592*infoPct/100)}" height="26" rx="8" fill="${infoPct>=75?'var(--tax-green)':'var(--tax-amber)'}"/>
        <text x="320" y="64" text-anchor="middle" font-size="12" font-weight="900" fill="${infoPct>50?'#fff':'var(--tax-ink)'}">逼近真相度：${infoPct}%</text>

        <rect x="24" y="92" width="592" height="80" rx="12" fill="${revealed?'var(--tax-green-soft)':'var(--tax-surface-alt)'}" stroke="${revealed?'var(--tax-green)':'var(--tax-border)'}" stroke-width="2"/>
        <text x="320" y="124" text-anchor="middle" font-size="15" font-weight="900" fill="${revealed?'var(--tax-green)':'var(--tax-muted)'}">
          ${revealed ? '🏆 真正的隐藏规则极其简单：只要三个数字严格递增（a < b < c）即可！' : '🔒 隐藏规则待揭晓：试着故意打破“+2 偶数”猜想（如 1-5-100 或 6-4-2）再揭晓！'}
        </text>
        <text x="320" y="152" text-anchor="middle" font-size="11.5" fill="var(--tax-muted)">
          ${revealed ? '哪怕你测 100 组“+2 偶数”全得到 ✅，也永远发现不了规则其实宽得多——只有“反例”才能划清真相边界！' : '提示：科学发现的核心不是寻找“支持我的证据”，而是拼命寻找“能推翻我的反例”！'}
        </text>
      `;

      document.getElementById('ahaBox').innerHTML = revealed
        ? `💡 <strong>顿悟时刻：</strong>沃森实验揭示了人类最隐蔽的思维盲区——<strong>正向检验偏差</strong>！只测符合自己猜想的例子（4-6-8、10-12-14）只会给你虚假自信；<strong>真正高效的思考者，会故意构造自己以为会失败的反例（如 1-5-100、6-4-2）来迅速逼近真相！</strong>`
        : falsCnt >= 2
        ? `💡 <strong>顿悟时刻：</strong>太敏锐了！你已经主动测试了 <strong>${falsCnt} 个打破原猜想的反例</strong>，信息增益飙升到 ${infoPct}%！点击上方 <strong>🔓 揭晓隐藏规则</strong> 验证你的推理！`
        : `💡 <strong>顿悟时刻：</strong>先试着点几组数字检验吧！注意观察：测试“4-6-8”得到 ✅ 其实几乎没帮你排除任何错误猜想，试试故意破坏规律的组合！`;
    }

    draw();
  </script>
</body>
</html>
