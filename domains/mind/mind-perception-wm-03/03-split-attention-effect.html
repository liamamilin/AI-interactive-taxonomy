<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗺️ 注意分散效应：图注分离 vs 原位标注</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🗺️ 注意分散效应：图注分离 vs 原位标注</h1><p>把图例放在图表最下面、把步骤说明写在另一页，会逼着读者眼球反复往返搜寻，白白烧掉大量工作记忆。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>图表待对照标签数量</span><span id="vLbl">6 个</span></label><input type="range" id="sLbl" min="2" max="12" value="6" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>图文分离物理距离</span><span id="vDst">高（分页/底部图例）</span></label><input type="range" id="sDst" min="1" max="10" value="7" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">分离排版眼球往返次数</div><div class="k-val" id="kEye">—</div></div>
        <div class="kpi"><div class="k-lbl">原位标注节省认知能耗</div><div class="k-val" id="kSav">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const lbl=+document.getElementById('sLbl').value, dst=+document.getElementById('sDst').value;
  document.getElementById('vLbl').textContent=lbl+' 个';
  document.getElementById('vDst').textContent=dst>=7?'高（分页/底部图例）':(dst>=4?'中（侧边图例）':'低（紧邻）');
  const eye=Math.round(lbl*(1.2 + dst*0.35));
  const sav=Math.min(78, Math.round(18 + dst*5.2 + lbl*1.1));
  document.getElementById('kEye').textContent=eye+' 次扫视';
  document.getElementById('kSav').textContent='省 '+sav+'%';
  document.getElementById('kSav').style.color='#059669';
  const wSep=Math.max(12, Math.min(340, eye*8));
  const wInl=Math.max(12, Math.min(340, wSep*(1-sav/100)));
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">视觉搜索与工作记忆整合耗时对比</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">图注分离（查表式）</text>
    <rect x="175" y="64" width="${wSep.toFixed(0)}" height="28" rx="6" fill="#ef4444" opacity="0.82"/>
    <text x="${(183+wSep).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#ef4444">${eye} 次往返</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">原位直接标注</text>
    <rect x="175" y="120" width="${wInl.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(183+wInl).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">减少 ${sav}% 负荷</text>
    <text x="20" y="182" font-size="11.5" fill="var(--tax-muted)">空间邻近原则：把文字直接贴在对应曲线或部件旁边，彻底消灭“来回对照”的记忆税。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>任何让读者在“图 A”和“下面文字说明”之间反复横跳的排版，都在强迫工作记忆做无意义的搬运工。直接标在图上，一眼看懂！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
