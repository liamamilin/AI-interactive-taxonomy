<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>注意分散效应：图注分离 vs 原位标注</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .legend-box {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px;
      padding: 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); font-size: 12px;
    }
    .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .res-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .res-val { font-size: 20px; font-weight: 800; color: var(--tax-ink); }
    svg .hotspot { cursor: pointer; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🗺️ 注意分散效应：图注分离 vs 原位标注（盲测）</h1>
      <p>同样是一张咖啡机内部结构图，分别在<strong>A：编号+底部图例</strong>和<strong>B：原位直接标注</strong>下，快速找出系统指定的 3 个部件，测一测眼球来回扫视消耗了多少时间！</p>
    </header>

    <section class="toy-card">
      <div class="top-bar">
        <button class="toy-btn" id="startBtn">▶ 开始实验 A（图注分离版）</button>
        <div id="promptText" style="font-size:14px;font-weight:700;color:var(--tax-primary);">准备就绪：每轮需在图中点出 3 个部件</div>
      </div>

      <svg id="diagSvg" viewBox="0 0 680 220" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="咖啡机结构图"></svg>

      <div class="legend-box" id="legendBox" style="display:none;"></div>

      <div class="res-grid">
        <div class="res-card">
          <div style="font-size:12px;color:var(--tax-muted);">实验 A · 图注分离耗时</div>
          <div class="res-val" id="resA">—</div>
        </div>
        <div class="res-card">
          <div style="font-size:12px;color:var(--tax-muted);">实验 B · 原位标注耗时</div>
          <div class="res-val" id="resB">—</div>
        </div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>盲测说明：</strong>完成 A/B 两轮搜寻，直观感受为什么“把图例挪到图里”是最便宜也最有效的减负手段。
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const PARTS = [
      { id: 1, name: '高压水泵', x: 110, y: 150, w: 96, h: 44 },
      { id: 2, name: 'PID 温控锅炉', x: 255, y: 55, w: 120, h: 52 },
      { id: 3, name: '三通泄压阀', x: 430, y: 65, w: 106, h: 42 },
      { id: 4, name: '冲煮分水网', x: 520, y: 145, w: 110, h: 44 },
      { id: 5, name: '蒸汽热交换管', x: 265, y: 145, w: 120, h: 44 },
      { id: 6, name: '预浸泡电磁阀', x: 105, y: 58, w: 110, h: 42 }
    ];

    const TARGETS_A = [3, 6, 5];
    const TARGETS_B = [1, 4, 2];

    let phase = 'idleA'; // idleA, runA, idleB, runB, done
    let idx = 0;
    let startMs = 0;
    let timeA = null, timeB = null;
    let done = false;

    const svg = document.getElementById('diagSvg');
    const legendBox = document.getElementById('legendBox');
    const startBtn = document.getElementById('startBtn');
    const promptText = document.getElementById('promptText');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function drawDiagram(integrated) {
      let html = '';
      // Connecting pipes
      html += `<path d="M158 150 L158 100 L255 81 M375 81 L430 86 M483 107 L575 145 M315 107 L325 145" fill="none" stroke="var(--tax-border)" stroke-width="4" stroke-linecap="round"/>`;
      PARTS.forEach(p => {
        const label = integrated ? p.name : `部件 #${p.id}`;
        html += `<g class="hotspot" data-id="${p.id}">`;
        html += `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="10" fill="rgba(59,130,246,0.14)" stroke="var(--tax-primary)" stroke-width="1.8"/>`;
        html += `<text x="${p.x + p.w/2}" y="${p.y + p.h/2 + 5}" text-anchor="middle" fill="var(--tax-ink)" font-size="12" font-weight="700">${label}</text>`;
        html += `</g>`;
      });
      svg.innerHTML = html;

      svg.querySelectorAll('.hotspot').forEach(g => {
        g.onclick = () => handlePick(Number(g.dataset.id), g);
      });

      if (!integrated) {
        legendBox.style.display = 'grid';
        // Shuffle display order to simulate real legend lookup
        const order = [4, 1, 6, 3, 2, 5];
        legendBox.innerHTML = order.map(id => {
          const p = PARTS.find(x => x.id === id);
          return `<div><strong>#${p.id}</strong> = ${p.name}</div>`;
        }).join('');
      } else {
        legendBox.style.display = 'none';
      }
    }

    function handlePick(id, gEl) {
      if (phase !== 'runA' && phase !== 'runB') return;
      const list = phase === 'runA' ? TARGETS_A : TARGETS_B;
      if (id === list[idx]) {
        gEl.querySelector('rect').setAttribute('fill', 'rgba(16,185,129,0.28)');
        gEl.querySelector('rect').setAttribute('stroke', 'var(--tax-green)');
        idx++;
        if (idx >= list.length) {
          const sec = (performance.now() - startMs) / 1000;
          if (phase === 'runA') {
            timeA = sec;
            document.getElementById('resA').textContent = `${sec.toFixed(2)} 秒`;
            phase = 'idleB';
            startBtn.disabled = false;
            startBtn.textContent = '▶ 开始实验 B（原位标注版）';
            promptText.textContent = '实验 A 完成！准备测试原位标注版';
            ahaBox.innerHTML = `<strong>实验 A 用时 ${sec.toFixed(2)} 秒：</strong>你的视线被迫在“顶部结构图”和“底部图例”之间来回折返，每找一个部件都要暂存编号再核对。继续测实验 B！`;
          } else {
            timeB = sec;
            document.getElementById('resB').textContent = `${sec.toFixed(2)} 秒`;
            phase = 'done';
            startBtn.disabled = false;
            startBtn.textContent = '↺ 重新做一遍实验';
            promptText.textContent = `完成！图注分离 ${timeA.toFixed(2)}s vs 原位标注 ${timeB.toFixed(2)}s`;
            markDone(`完成注意分散盲测：分离 ${timeA.toFixed(2)}s vs 原位 ${timeB.toFixed(2)}s`);
            const saved = Math.round(((timeA - timeB) / timeA) * 100);
            ahaBox.innerHTML = saved > 0
              ? `<strong>空间邻近原则生效（提速 ${saved}%）：</strong>把文字直接贴到对应图形旁边，消除了来回扫视的“外在认知负荷”。做 PPT、画架构图或写产品文档时，永远优先用原位标注代替独立图例！`
              : `<strong>对比完成（${timeA.toFixed(2)}s vs ${timeB.toFixed(2)}s）：</strong>你对图例检索非常熟练，但对首次接触新图表的读者而言，原位标注通常能减少 30%–50% 的眼球跳转与工作记忆消耗。`;
          }
        } else {
          const nextName = PARTS.find(p => p.id === list[idx]).name;
          promptText.textContent = `请点击图中：【${nextName}】（${idx + 1}/3）`;
        }
      } else {
        gEl.querySelector('rect').setAttribute('stroke', 'var(--tax-red)');
        setTimeout(() => gEl.querySelector('rect').setAttribute('stroke', 'var(--tax-primary)'), 250);
      }
    }

    startBtn.onclick = () => {
      if (phase === 'done') {
        phase = 'idleA';
        document.getElementById('resA').textContent = '—';
        document.getElementById('resB').textContent = '—';
      }
      if (phase === 'idleA') {
        phase = 'runA';
        idx = 0;
        drawDiagram(false);
        startMs = performance.now();
        startBtn.disabled = true;
        promptText.textContent = `请点击图中：【${PARTS.find(p => p.id === TARGETS_A[0]).name}】（1/3）`;
      } else if (phase === 'idleB') {
        phase = 'runB';
        idx = 0;
        drawDiagram(true);
        startMs = performance.now();
        startBtn.disabled = true;
        promptText.textContent = `请点击图中：【${PARTS.find(p => p.id === TARGETS_B[0]).name}】（1/3）`;
      }
    };

    drawDiagram(false);
  </script>
</body>
</html>
