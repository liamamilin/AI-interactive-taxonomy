<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛫 协和式飞机效应：承诺升级陷阱</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🛫 协和式飞机效应：承诺升级陷阱</h1><p>英法两国早就知道协和超音速客机商业上必定血亏，但因为前任和现任领导人已投入几十亿、谁砍项目谁背锅，结果硬生生又烧了十年钱。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>决策者个人面子/政治声誉绑定度</span><span id="vEgo">85%</span></label><input type="range" id="sEgo" min="0" max="100" value="85" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>项目已被证明无望的证据强度</span><span id="vEv">75%</span></label><input type="range" id="sEv" min="20" max="100" value="75" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">原发起人叫停概率</div><div class="k-val" id="kOrg">—</div></div>
        <div class="kpi"><div class="k-lbl">新接任者叫停概率</div><div class="k-val" id="kNew">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const ego=+document.getElementById('sEgo').value, ev=+document.getElementById('sEv').value;
  document.getElementById('vEgo').textContent=ego+'%';
  document.getElementById('vEv').textContent=ev+'%';
  const org=Math.max(5, Math.min(95, Math.round(ev*0.85 - ego*0.65 + 15)));
  const nw=Math.max(20, Math.min(98, Math.round(ev*0.95 + 4)));
  document.getElementById('kOrg').textContent=org+'%';
  document.getElementById('kOrg').style.color=org<40?'#ef4444':'#f59e0b';
  document.getElementById('kNew').textContent=nw+'%';
  document.getElementById('kNew').style.color='#059669';
  const wO=Math.max(12, org*2.7), wN=Math.max(12, nw*2.7);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">面对相同铁证（${ev}% 无望），两类决策者果断砍项目的概率</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">原项目发起人</text>
    <rect x="145" y="64" width="${wO.toFixed(0)}" height="28" rx="6" fill="#ef4444"/>
    <text x="${(153+wO).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#ef4444">${org}%（怕承认自己当初错了）</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">空降新接班人</text>
    <rect x="145" y="120" width="${wN.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(153+wN).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${nw}%（无历史面子包袱）</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">英特尔前 CEO 格鲁夫的经典自救法：“如果董事会今天炒掉我们换个新 CEO，他会怎么做？”</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>打破沉没成本的终极技巧是“假装自己今天刚入职接手这个烂摊子”——剥离面子包袱，答案瞬间清晰。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
