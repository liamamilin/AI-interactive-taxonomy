<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 烂片离场计算器：别拿未来时间陪葬</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎬 烂片离场计算器：别拿未来时间陪葬</h1><p>花 80 元买票看电影，30 分钟后发现烂到坐立难安。继续硬坐 90 分钟，你不仅没把 80 元赚回来，还额外亏掉了 90 分钟宝贵人生！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>已花掉的电影票价（已沉没）</span><span id="vTic">80 元</span></label><input type="range" id="sTic" min="30" max="200" step="10" value="80" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>剩余 90 分钟的煎熬折磨度</span><span id="vPain">75 分</span></label><input type="range" id="sPain" min="10" max="100" value="75" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">提前离场总体验</div><div class="k-val" id="kLve">—</div></div>
        <div class="kpi"><div class="k-lbl">硬坐到底总体验</div><div class="k-val" id="kSty">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const tic=+document.getElementById('sTic').value, pain=+document.getElementById('sPain').value;
  document.getElementById('vTic').textContent=tic+' 元';
  document.getElementById('vPain').textContent=pain+' 分';
  const leaveVal=40;
  const stayVal=-pain;
  document.getElementById('kLve').textContent='+'+leaveVal+' 分（省下 90 分钟去喝咖啡）';
  document.getElementById('kLve').style.color='#059669';
  document.getElementById('kSty').textContent=stayVal+' 分（白白受罪 90 分钟）';
  document.getElementById('kSty').style.color='#ef4444';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">无论票价是 ${tic} 元还是 200 元，它都在检票那一刻归零了</text>
    <rect x="30" y="60" width="250" height="86" rx="10" fill="#059669" opacity="0.14" stroke="#059669" stroke-width="2"/>
    <text x="155" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#059669">🚶 果断离场</text>
    <text x="155" y="114" text-anchor="middle" font-size="12" fill="var(--tax-text)">花费：已付 ${tic} 元</text>
    <text x="155" y="134" text-anchor="middle" font-size="12" font-weight="750" fill="#059669">收获：90 分钟自由好心情</text>
    <rect x="320" y="60" width="250" height="86" rx="10" fill="#ef4444" opacity="0.14" stroke="#ef4444" stroke-width="2"/>
    <text x="445" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="#ef4444">🪑 硬坐到底</text>
    <text x="445" y="114" text-anchor="middle" font-size="12" fill="var(--tax-text)">花费：已付 ${tic} 元 + 90 分钟</text>
    <text x="445" y="134" text-anchor="middle" font-size="12" font-weight="750" fill="#ef4444">收获：${pain} 分煎熬窝火</text>
    <text x="30" y="178" font-size="11.5" fill="var(--tax-muted)">同样适用于读不下去的烂书、消耗你的坏关系、和没有未来的鸡肋项目。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>提前离场不是“浪费了票钱”，硬坐到底才是“既浪费了票钱，又浪费了人生”的双重亏损！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
