<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏳ 双曲贴现偏好反转交叉点（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⏳ 双曲贴现偏好反转交叉点（SVG）</h1><p>人类对时间的打折不是均匀的指数曲线，而是“双曲线” V = A / (1 + k·D)：离得远时理智占优，一旦诱惑近在眼前，小甜头价值瞬间飙升反超！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>大脑急躁贴现率 k（越大越重眼前）</span><span id="vK">0.35</span></label><input type="range" id="sK" min="0.05" max="0.80" step="0.05" value="0.35" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>当前距离诱惑兑现的天数</span><span id="vD">2 天</span></label><input type="range" id="sD" min="0" max="14" value="2" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">眼前刷手机主观价值</div><div class="k-val" id="kS">—</div></div>
        <div class="kpi"><div class="k-lbl">未来大目标主观价值</div><div class="k-val" id="kL">—</div></div>
        <div class="kpi"><div class="k-lbl">此刻大脑最终选择</div><div class="k-val" id="kCh">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const k=+document.getElementById('sK').value, d=+document.getElementById('sD').value;
  document.getElementById('vK').textContent=k.toFixed(2);
  document.getElementById('vD').textContent=d+' 天';
  const vS=65/(1 + k*d);
  const vL=100/(1 + k*(d+5));
  const fold=vS>vL;
  document.getElementById('kS').textContent=vS.toFixed(1);
  document.getElementById('kL').textContent=vL.toFixed(1);
  document.getElementById('kCh').textContent=fold?'📱 破功屈服于眼前诱惑!':'🏆 理性坚守长期目标';
  document.getElementById('kCh').style.color=fold?'#ef4444':'#059669';
  let ptsS=[], ptsL=[];
  for(let t=0;t<=14;t+=0.5){
    const x=540 - t*34;
    const ys=178 - (65/(1+k*t))*1.35;
    const yl=178 - (100/(1+k*(t+5)))*1.35;
    ptsS.push(`${x.toFixed(1)},${ys.toFixed(1)}`);
    ptsL.push(`${x.toFixed(1)},${yl.toFixed(1)}`);
  }
  const cx=540 - d*34;
  document.getElementById('svg').innerHTML=`
    <text x="45" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">双曲贴现曲线（从左到右 = 越来越逼近诱惑时刻）</text>
    <line x1="45" y1="178" x2="555" y2="178" stroke="var(--tax-border)" stroke-width="1.5"/>
    <polyline points="${ptsL.join(' ')}" fill="none" stroke="#059669" stroke-width="3"/>
    <polyline points="${ptsS.join(' ')}" fill="none" stroke="#ef4444" stroke-width="3"/>
    <line x1="${cx.toFixed(1)}" y1="36" x2="${cx.toFixed(1)}" y2="178" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="60" y="50" font-size="11.5" font-weight="800" fill="#059669">绿线 = 延迟大目标 (100)</text>
    <text x="240" y="50" font-size="11.5" font-weight="800" fill="#ef4444">红线 = 眼前小甜头 (65)</text>
    <text x="45" y="196" font-size="11" fill="var(--tax-muted)">14 天前（理性计划）</text>
    <text x="485" y="196" font-size="11" font-weight="750" fill="#ef4444">诱惑就在眼前!</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>昨晚的你和今早的你不是同一个人——远离诱惑时大目标胜出，贴近诱惑时双曲线交叉反转！这就是一切“间歇性踌躇满志，持续性躺平摆烂”的数学根源。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
