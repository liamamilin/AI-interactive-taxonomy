<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>双曲贴现偏好反转交叉点</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    @media (max-width: 600px) { .ctrl-grid { grid-template-columns: 1fr; } }
    .ctrl-box { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .verdict { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); font-size: 13px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⏳ 双曲贴现：偏好反转交叉点模拟器</h1>
      <p>行为经济学公式 <strong>V = A / (1 + k·D)</strong> 解释了人类的“今朝有酒今朝醉”：离诱惑还远时，理性觉得大回报（早睡/150元）更值；可一旦逼近眼前，小诱惑（刷剧/100元）的主观价值会呈双曲线陡然飙升，瞬间反超！</p>
    </header>

    <section class="toy-card">
      <div class="ctrl-grid">
        <div class="ctrl-box">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
            <span>🕒 距离“眼前诱惑”还有几天？</span>
            <strong id="dayVal" style="color:var(--tax-primary);">6 天后（提前立 Flag 时）</strong>
          </div>
          <input type="range" id="dayRange" min="0" max="10" step="0.5" value="6" style="width:100%;" />
        </div>
        <div class="ctrl-box">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
            <span>🔥 个人冲动贴现系数 k</span>
            <strong id="kVal" style="color:var(--tax-amber);">0.60</strong>
          </div>
          <input type="range" id="kRange" min="0.15" max="1.2" step="0.05" value="0.6" style="width:100%;" />
        </div>
      </div>

      <svg id="hypSvg" viewBox="0 0 680 225" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="双曲贴现偏好反转曲线"></svg>

      <div class="verdict" id="verdictBox"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>动手验证：</strong>把上方「距离眼前诱惑还有几天」从 6 天往左拖到 <strong>0 天（就是今晚！）</strong>，亲眼看红线如何一举冲破绿线，完成“白天发誓、晚上真香”的偏好反转！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const dayRange = document.getElementById('dayRange');
    const kRange = document.getElementById('kRange');
    const svg = document.getElementById('hypSvg');
    const verdictBox = document.getElementById('verdictBox');
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function valHyper(amount, delay, k) {
      return amount / (1 + k * delay);
    }

    function render() {
      const d = Number(dayRange.value); // delay until small reward; large reward is at d + 3
      const k = Number(kRange.value);

      document.getElementById('dayVal').textContent = d === 0 ? '0 天（诱惑就在眼前！）' : `${d} 天后`;
      document.getElementById('kVal').textContent = k.toFixed(2);

      // Small-Sooner = 100 at delay d; Large-Later = 160 at delay d + 3
      const vSmall = valHyper(100, d, k);
      const vLarge = valHyper(160, d + 3, k);

      const xOf = t => 54 + ((10 - t) / 10) * 586; // Left = 10 days away, Right = 0 days (NOW)
      const yOf = v => 190 - (v / 120) * 150;

      let sPts = [], lPts = [];
      for (let t = 10; t >= 0; t -= 0.2) {
        sPts.push(`${xOf(t).toFixed(1)},${yOf(valHyper(100, t, k)).toFixed(1)}`);
        lPts.push(`${xOf(t).toFixed(1)},${yOf(valHyper(160, t + 3, k)).toFixed(1)}`);
      }

      let html = '';
      html += `<line x1="54" y1="190" x2="640" y2="190" stroke="var(--tax-border)"/>`;
      [10, 8, 6, 4, 2, 0].forEach(t => {
        html += `<text x="${xOf(t)}" y="210" text-anchor="middle" fill="var(--tax-muted)" font-size="11">${t === 0 ? '此刻(诱惑到眼前)' : t + '天前'}</text>`;
      });

      html += `<polyline points="${lPts.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3"/>`;
      html += `<polyline points="${sPts.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3"/>`;

      // Current vertical line
      const cx = xOf(d);
      html += `<line x1="${cx}" y1="26" x2="${cx}" y2="190" stroke="var(--tax-primary)" stroke-dasharray="4 3" stroke-width="2"/>`;
      html += `<circle cx="${cx}" cy="${yOf(vSmall)}" r="6" fill="var(--tax-red)"/>`;
      html += `<circle cx="${cx}" cy="${yOf(vLarge)}" r="6" fill="var(--tax-green)"/>`;

      html += `<text x="64" y="34" fill="var(--tax-green)" font-size="12" font-weight="700">🟢 长期大回报（价值 160，延迟+3天）：当前主观值 ${vLarge.toFixed(1)}</text>`;
      html += `<text x="64" y="52" fill="var(--tax-red)" font-size="12" font-weight="700">🔴 即时小诱惑（价值 100）：当前主观值 ${vSmall.toFixed(1)}</text>`;

      svg.innerHTML = html;

      if (vSmall > vLarge) {
        verdictBox.innerHTML = `🔥 <strong>偏好反转发生！</strong>此刻小诱惑的主观分（<strong>${vSmall.toFixed(1)}</strong>）已反超长期大回报（${vLarge.toFixed(1)}）——你决定“今晚先刷剧，明天再努力”！`;
        ahaBox.innerHTML = '<strong>这就是拖延症的数学本质：</strong>双曲贴现让“此刻”被无限放大，而“明天”和“后天”在远处几乎一样廉价。所以你永远把痛苦推给“明天的自己”，却在明天变成“今天”时再次投降！';
      } else {
        verdictBox.innerHTML = `🧠 <strong>理性占上风：</strong>因为诱惑还在 ${d} 天之外，长期大回报（<strong>${vLarge.toFixed(1)}</strong>）轻松击败小诱惑（${vSmall.toFixed(1)}）——这是立 Flag 和签事前契约的黄金窗口！`;
        ahaBox.innerHTML = '<strong>为什么白天计划总很完美？</strong>站在远距离视角看，双曲曲线很平缓，你能冷静看出 160 > 100。把滑块拖到 <strong>0 天</strong>，亲眼看理性在诱惑面前崩盘！';
      }
    }

    dayRange.oninput = () => { markDone('拖动时间轴观察了双曲贴现偏好反转'); render(); };
    kRange.oninput = () => { markDone('调节了双曲贴现冲动系数'); render(); };
    render();
  </script>
</body>
</html>
