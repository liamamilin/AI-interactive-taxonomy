<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>死线恐慌怪：为什么拖到最后一晚才开工？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .s-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .s-val { font-size: 20px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>👹 死线恐慌怪：10 天交稿竞速对决</h1>
      <p>同样一份 10 天后截止的重要报告：<strong>方案 A</strong> 只有一个最终死线；<strong>方案 B</strong> 拆成第 3、6、9 天三个公开微死线。按下播放键，看“即时满足猴”与“死线恐慌怪”如何角力！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="playBtn">▶ 播放 10 天进度竞速</button>
        <button class="toy-btn secondary" id="jumpEndBtn">⏩ 直接看第 10 天结局</button>
        <button class="toy-btn secondary" id="resetBtn">↺ 重置回第 1 天</button>
      </div>

      <svg id="raceSvg" viewBox="0 0 680 220" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="死线恐慌怪与微死线进度竞速"></svg>

      <div class="stats">
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">当前倒计时</div><div class="s-val" id="dayVal">第 1 / 10 天</div></div>
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">👹 单一死线组进度 / 质量</div><div class="s-val" id="singleVal" style="color:var(--tax-red);">0%</div></div>
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">🎯 微死线拆分组进度 / 质量</div><div class="s-val" id="microVal" style="color:var(--tax-green);">12%</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>竞速说明：</strong>点击「播放 10 天进度竞速」，观察前 8 天大脑如何被“即时满足猴”完全接管，直到第 9 天恐慌怪才被迫通宵救火！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const SINGLE = [0, 2, 4, 5, 7, 10, 14, 20, 42, 85]; // Panic sprint on Day 9-10
    const MICRO  = [12, 24, 35, 45, 56, 68, 76, 85, 93, 100]; // Steady 3-day milestones

    let day = 1;
    let timer = null;
    let playing = false;
    let done = false;

    const svg = document.getElementById('raceSvg');
    const playBtn = document.getElementById('playBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function draw() {
      const s = SINGLE[day - 1];
      const m = MICRO[day - 1];
      document.getElementById('dayVal').textContent = `第 ${day} / 10 天`;
      document.getElementById('singleVal').textContent = day === 10 ? `${s}%（熬夜交差 62分）` : `${s}%`;
      document.getElementById('microVal').textContent = day === 10 ? `${m}%（从容打磨 94分）` : `${m}%`;

      const xOf = d => 48 + ((d - 1) / 9) * 592;
      const yOf = v => 185 - (v / 100) * 145;

      let sPts = [], mPts = [];
      for (let d = 1; d <= day; d++) {
        sPts.push(`${xOf(d).toFixed(1)},${yOf(SINGLE[d - 1]).toFixed(1)}`);
        mPts.push(`${xOf(d).toFixed(1)},${yOf(MICRO[d - 1]).toFixed(1)}`);
      }

      let html = '';
      [25, 50, 75, 100].forEach(v => {
        const y = yOf(v);
        html += `<line x1="48" y1="${y}" x2="640" y2="${y}" stroke="var(--tax-border)" stroke-dasharray="3 3"/>`;
        html += `<text x="40" y="${y + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="11">${v}%</text>`;
      });

      // Micro-deadline vertical markers at D3, D6, D9
      [3, 6, 9].forEach(md => {
        html += `<line x1="${xOf(md)}" y1="32" x2="${xOf(md)}" y2="185" stroke="var(--tax-green)" stroke-dasharray="3 4" opacity="0.5"/>`;
        html += `<text x="${xOf(md)}" y="26" text-anchor="middle" fill="var(--tax-green)" font-size="10">微死线 D${md}</text>`;
      });

      for (let d = 1; d <= 10; d++) {
        html += `<text x="${xOf(d)}" y="205" text-anchor="middle" fill="var(--tax-muted)" font-size="11">D${d}</text>`;
      }

      if (sPts.length > 1) {
        html += `<polyline points="${sPts.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3"/>`;
        html += `<polyline points="${mPts.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3"/>`;
      }
      html += `<circle cx="${xOf(day)}" cy="${yOf(s)}" r="6" fill="var(--tax-red)"/>`;
      html += `<circle cx="${xOf(day)}" cy="${yOf(m)}" r="6" fill="var(--tax-green)"/>`;
      svg.innerHTML = html;

      if (day <= 7) {
        ahaBox.innerHTML = `<strong>第 ${day} 天（即时满足猴统治期）：</strong>单一死线组还有 ${10 - day} 天，双曲贴现把遥远的痛苦折算得几乎为零，进度纹丝不动；而微死线组借着 D3/D6 节点稳步推进到 ${m}%！`;
      } else if (day < 10) {
        ahaBox.innerHTML = `<strong>第 ${day} 天（👹 恐慌怪苏醒！）：</strong>死线迫近眼前，公开出丑的恐惧终于压倒刷手机的快乐，单一死线组开始肾上腺素狂飙通宵赶工！`;
      } else {
        ahaBox.innerHTML = '<strong>第 10 天终局（94 分 vs 62 分）：</strong>别等最后一只大恐慌怪来救命——把一个 10 天的大死线切成 3 个公开交付的小里程碑（如第 3 天交大纲、第 6 天交初稿），等于提前召唤温和可控的“小恐慌怪”！';
      }
    }

    function stop() { playing = false; clearInterval(timer); playBtn.textContent = '▶ 播放 10 天进度竞速'; }

    playBtn.onclick = () => {
      markDone('播放了死线恐慌怪与微死线竞速');
      if (playing) { stop(); return; }
      if (day >= 10) day = 1;
      playing = true;
      playBtn.textContent = '⏸ 暂停';
      timer = setInterval(() => {
        day++;
        draw();
        if (day >= 10) stop();
      }, 360);
    };

    document.getElementById('jumpEndBtn').onclick = () => { stop(); day = 10; markDone('查看了死线恐慌怪第10天终局'); draw(); };
    document.getElementById('resetBtn').onclick = () => { stop(); day = 1; draw(); };
    draw();
  </script>
</body>
</html>
