<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👹 死线恐慌怪：为什么拖到最后一晚才开工？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>👹 死线恐慌怪：为什么拖到最后一晚才开工？</h1><p>皮尔斯·斯蒂尔拖延方程：动机 = (期望 × 价值) / (冲动 × 延迟)。只要截止日还远，分母“延迟”巨大，动机就永远低于开工线！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>距离截止日期剩余天数</span><span id="vRem">5 天</span></label><input type="range" id="sRem" min="0.5" max="14" step="0.5" value="5" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>任务拆分后的里程碑密度（缩短延迟）</span><span id="vSpl">1 个大死线</span></label><input type="range" id="sSpl" min="1" max="5" value="1" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当下行动力得分（开工线 60）</div><div class="k-val" id="kMot">—</div></div>
        <div class="kpi"><div class="k-lbl">行为状态</div><div class="k-val" id="kAct">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const rem=+document.getElementById('sRem').value, spl=+document.getElementById('sSpl').value;
  document.getElementById('vRem').textContent=rem.toFixed(1)+' 天';
  document.getElementById('vSpl').textContent=spl+' 个阶段小死线';
  const effDelay=rem/spl;
  const mot=Math.min(100, Math.round(110/(1 + 0.45*effDelay)));
  const go=mot>=60;
  document.getElementById('kMot').textContent=mot+' 分';
  document.getElementById('kMot').style.color=go?'#059669':'#ef4444';
  document.getElementById('kAct').textContent=go?'🚀 立刻进入开工状态!':'🦥 继续刷手机拖延';
  const w=Math.max(12, mot*4.4);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="32" font-size="13" font-weight="800" fill="var(--tax-text)">行动力进度条 vs 开工触发阈值（60 分红线）</text>
    <rect x="30" y="66" width="440" height="38" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="66" width="${w.toFixed(0)}" height="38" rx="8" fill="${go?'#059669':'#f59e0b'}"/>
    <line x1="${30+60*4.4}" y1="50" x2="${30+60*4.4}" y2="120" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="${30+60*4.4}" y="46" text-anchor="middle" font-size="11" font-weight="800" fill="#ef4444">60 分开工线</text>
    <text x="30" y="152" font-size="12" fill="var(--tax-muted)">把 14 天的大死线拆成 ${spl} 个小里程碑，有效延迟立刻从 ${rem.toFixed(1)} 天压缩到 ${effDelay.toFixed(1)} 天，提前唤醒行动力！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>拖延不是因为你懒，而是大目标离得太远导致分母太大。把一个大死线切成 3~5 个“今晚就要交的小交付”，拖延症立刻不药而愈！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
