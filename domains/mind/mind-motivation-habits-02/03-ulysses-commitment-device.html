<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>奥德修斯契约：用事前锁定战胜未来的自己</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .lock-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (max-width: 600px) { .lock-grid { grid-template-columns: 1fr; } }
    .lock-btn {
      text-align: left; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .lock-btn.on { border-color: var(--tax-primary); background: var(--tax-primary-soft); }
    .lock-title { font-weight: 700; font-size: 13.5px; }
    .lock-sub { font-size: 12px; color: var(--tax-muted); margin-top: 3px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚓ 奥德修斯契约：事前锁定盾牌构建器</h1>
      <p>奥德修斯知道自己听见塞壬歌声一定会发疯，于是提前让水手把自己绑在桅杆上。趁现在还清醒，为今晚的自己装配<strong>承诺装置（Commitment Devices）</strong>，再放诱惑浪潮进场测试！</p>
    </header>

    <section class="toy-card">
      <div class="lock-grid" id="lockGrid"></div>

      <div style="margin-bottom:12px;">
        <button class="toy-btn" id="testBtn">🌊 释放今晚 22:00 塞壬诱惑测试</button>
      </div>

      <svg id="shieldSvg" viewBox="0 0 680 150" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="奥德修斯契约防线强度"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>构建挑战：</strong>不装任何事前锁定装置时，纯靠深夜残存的意志力抵挡诱惑胜率仅 <strong>18%</strong>！勾选 2–3 项奥德修斯契约，看看如何用“物理/社交锁”降维打击拖延症。
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const LOCKS = [
      { id: 'box', title: '📦 物理隔离：手机锁进客厅定时盒', sub: '把打开诱惑的门槛从 1 秒抬高到物理不可达', boost: 28, on: false },
      { id: 'bet', title: '💸 经济对赌：未按时提交自动捐款 100 元', sub: '利用损失厌恶（2 倍痛感）对抗双曲贴现', boost: 24, on: false },
      { id: 'peer', title: '🤝 社交绑定：约搭子 21:00 腾讯会议静音自习', sub: '引入外部见证与微小社交羞耻感', boost: 22, on: false },
      { id: 'block', title: '🛡️ 软件断网：21:00–23:00 自动封锁视频网站', sub: '消除“就看 5 分钟”的决策摩擦', boost: 16, on: false }
    ];

    let tested = false;
    let done = false;

    const lockGrid = document.getElementById('lockGrid');
    const svg = document.getElementById('shieldSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      lockGrid.innerHTML = '';
      LOCKS.forEach(lk => {
        const b = document.createElement('button');
        b.className = 'lock-btn' + (lk.on ? ' on' : '');
        b.innerHTML = `<div class="lock-title">${lk.on ? '✓ ' : '○ '}${lk.title} (+${lk.boost}%)</div><div class="lock-sub">${lk.sub}</div>`;
        b.onclick = () => {
          lk.on = !lk.on;
          tested = false;
          markDone('配置了奥德修斯事前锁定装置');
          render();
        };
        lockGrid.appendChild(b);
      });

      const base = 18;
      const total = Math.min(96, base + LOCKS.filter(l => l.on).reduce((s, l) => s + l.boost, 0));
      const wavePower = 75;
      const survived = total >= wavePower;

      let html = '';
      html += `<text x="24" y="34" fill="var(--tax-ink)" font-size="14" font-weight="700">⚓ 今晚抗诱惑防线总强度：${total}%（塞壬诱惑波强度：${wavePower}%）</text>`;
      html += `<rect x="24" y="54" width="632" height="24" rx="12" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="24" y="54" width="${(total / 100) * 632}" height="24" rx="12" fill="${survived ? 'var(--tax-green)' : 'var(--tax-amber)'}"/>`;
      // Threshold marker
      const tx = 24 + (wavePower / 100) * 632;
      html += `<line x1="${tx}" y1="44" x2="${tx}" y2="90" stroke="var(--tax-red)" stroke-width="2.5" stroke-dasharray="4 3"/>`;
      html += `<text x="${tx}" y="106" text-anchor="middle" fill="var(--tax-red)" font-size="11" font-weight="700">75% 诱惑击穿线</text>`;

      const status = tested
        ? (survived ? '🎉 塞壬诱惑波已被事前锁定彻底挡住，你顺利完成今晚任务！' : '💥 警报！防线被深夜诱惑击穿，你滑进了“再看 5 分钟”黑洞！')
        : '勾选上方事前锁定装置，再点击「释放塞壬诱惑测试」验证防线。';
      html += `<text x="24" y="134" fill="${tested ? (survived ? 'var(--tax-green)' : 'var(--tax-red)') : 'var(--tax-muted)'}" font-size="12" font-weight="700">${status}</text>`;
      svg.innerHTML = html;

      if (tested) {
        ahaBox.innerHTML = survived
          ? `<strong>奥德修斯策略胜利（防线 ${total}%）！</strong>真正自律的人并不是意志力特别强，而是深知“未来的自己不可信”，提前在清醒时把通往诱惑的桥烧掉！`
          : `<strong>防线不足（${total}% < 75%）！</strong>别高估夜晚疲惫大脑的自控力——再多加 1–2 道物理隔离或经济对赌锁，让防线超过 75% 再测！`;
      }
    }

    document.getElementById('testBtn').onclick = () => {
      tested = true;
      markDone('测试了奥德修斯契约抗诱惑防线');
      render();
    };
    render();
  </script>
</body>
</html>
