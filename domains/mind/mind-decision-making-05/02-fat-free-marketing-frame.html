<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥛 “90% 无脂” vs “含 10% 脂肪”营销框架</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🥛 “90% 无脂” vs “含 10% 脂肪”营销框架</h1>
        <p>误区：只要成分表写得一模一样，换个宣传语不会影响理性消费者的评价。真相：正向属性框架瞬间唤醒“健康/安全/优惠”联想，负向框架瞬间拉响“油腻/死亡/被坑”警报——哪怕两者描述的是<strong>100% 同一个东西</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setCase('yogurt',this)">🥛 酸奶/牛肉：90% 无脂 vs 含 10% 脂肪</button>
        <button class="pill" onclick="setCase('surgery',this)">🏥 手术知情：90% 存活率 vs 10% 死亡率</button>
        <button class="pill" onclick="setCase('card',this)">💳 结账规则：现金 95 折 vs 刷卡加收 5% 费</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const CASES = {
      yogurt: {
        posLbl:'🟢 正向包装：“90% 无脂 / 90% 纯瘦肉”', posScore:84,
        negLbl:'🔴 负向实话：“含有 10% 脂肪”', negScore:47,
        metric:'消费者“健康/购买意愿”评分',
        aha:'💡 <strong>顿悟时刻：</strong>同一盒酸奶、同一块牛肉，正面印上“90% Fat-Free”健康评分飙到 <strong>84 分</strong>，印上“含 10% 脂肪”瞬间暴跌到 <strong>47 分</strong>！破解方法：看到“95% 无糖/无添加”时，立刻在脑子里手动翻译成“含 5% 糖/添加剂”！'
      },
      surgery: {
        posLbl:'🟢 存活框架：“术后 1 个月存活率高达 90%”', posScore:82,
        negLbl:'🔴 死亡框架：“术后 1 个月死亡率达到 10%”', negScore:50,
        metric:'患者及家属同意接受手术比例',
        aha:'💡 <strong>顿悟时刻：</strong>《新英格兰医学杂志》经典研究证实：连哈佛医学院的医生在面对“90% 存活”与“10% 死亡”时，推荐手术的比例也会暴差 <strong>32 个百分点</strong>！做重大医疗或财务决策前，务必强迫自己把正反两种说法都念一遍！'
      },
      card: {
        posLbl:'🟢 折扣框架：“现金支付享 95 折优惠”', posScore:79,
        negLbl:'🔴 罚金框架：“刷卡支付加收 5% 手续费”', negScore:26,
        metric:'顾客心理接受度与满意度',
        aha:'💡 <strong>顿悟时刻：</strong>信用卡游说集团当年死活要求法律禁止商家写“刷卡加收手续费”，但允许写“现金折扣”——因为同样多付 5%，被称作“失去折扣”让人微感遗憾，被称作“额外罚款”却让人怒火中烧！'
      }
    };
    let cur = 'yogurt';

    function setCase(c, btn){
      cur = c;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const d = CASES[cur];
      const wP = Math.round((d.posScore / 100) * 420), wN = Math.round((d.negScore / 100) * 420);
      document.getElementById('svg').innerHTML = `
        <text x="24" y="26" font-size="13" font-weight="850" fill="var(--tax-ink)">${d.metric}（两组数学事实 100% 完全等价）：</text>
        <text x="24" y="66" font-size="12.5" font-weight="850" fill="var(--tax-green)">${d.posLbl}</text>
        <rect x="24" y="76" width="420" height="26" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="24" y="76" width="${wP}" height="26" rx="6" fill="var(--tax-green)"/>
        <text x="456" y="94" font-size="13" font-weight="900" fill="var(--tax-green)">${d.posScore}%</text>

        <text x="24" y="136" font-size="12.5" font-weight="850" fill="var(--tax-red)">${d.negLbl}</text>
        <rect x="24" y="146" width="420" height="26" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="24" y="146" width="${wN}" height="26" rx="6" fill="var(--tax-red)"/>
        <text x="456" y="164" font-size="13" font-weight="900" fill="var(--tax-red)">${d.negScore}% (暴跌 -${d.posScore-d.negScore}%!)</text>
      `;

      document.getElementById('ahaBox').innerHTML = d.aha;
    }

    draw();
  </script>
</body>
</html>
