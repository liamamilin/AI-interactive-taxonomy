<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥛 “90% 无脂” vs “含 10% 脂肪”营销框架</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🥛 “90% 无脂” vs “含 10% 脂肪”营销框架</h1><p>同样的酸奶和牛肉：写“90% 瘦肉”时顾客觉得健康美味，写“含 10% 肥肉”时顾客瞬间皱眉——这就是属性框架的魔力。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>产品真实脂肪含量</span><span id="vFat">10%</span></label><input type="range" id="sFat" min="2" max="30" value="10" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>包装采用正向框架（强调“XX%无脂”）强度</span><span id="vPos">90%</span></label><input type="range" id="sPos" min="0" max="100" value="90" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">标签呈现文案</div><div class="k-val" id="kLbl">—</div></div>
        <div class="kpi"><div class="k-lbl">消费者健康印象分</div><div class="k-val" id="kScr">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const fat=+document.getElementById('sFat').value, pos=+document.getElementById('sPos').value;
  document.getElementById('vFat').textContent=fat+'%';
  document.getElementById('vPos').textContent=pos+'%';
  const lean=100 - fat;
  const negScr=Math.max(15, Math.round(72 - fat*1.8));
  const posScr=Math.min(98, Math.round(negScr + pos*0.26));
  document.getElementById('kLbl').textContent=pos>=50?(`${lean}% 零脂纯净`):(`含 ${fat}% 脂肪`);
  document.getElementById('kScr').textContent=posScr+' 分 (负向写法仅 '+negScr+' 分)';
  document.getElementById('kScr').style.color=posScr>=70?'#059669':'#f59e0b';
  const wN=Math.max(12, negScr*3.6), wP=Math.max(12, posScr*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">同一成分表，不同框架文案带来的健康评分差</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">写“含 ${fat}% 脂肪”</text>
    <rect x="165" y="64" width="${wN.toFixed(0)}" height="28" rx="6" fill="#94a3b8"/>
    <text x="${(173+wN).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="var(--tax-muted)">${negScr} 分</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">当前正向包装</text>
    <rect x="165" y="120" width="${wP.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(173+wP).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${posScr} 分 (+${posScr-negScr})</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">同理：把“信用卡加收 3% 手续费”改写成“现金支付立享 3% 优惠”，投诉率立刻暴跌！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>看商品和合同，别被大字框架牵着走——直接翻到背面看客观营养成分表或真实年化费率。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
