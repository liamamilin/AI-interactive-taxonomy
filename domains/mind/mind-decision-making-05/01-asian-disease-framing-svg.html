<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🖼️ 经典疾病决策框架翻转器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .pill { padding:9px 14px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .opt-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-bottom:14px; }
    .opt-card { padding:12px 14px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); }
    .opt-card h3 { font-size:13.5px; margin-bottom:4px; }
    .opt-card p { font-size:12.5px; color:var(--tax-muted); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🖼️ 经典疾病决策框架翻转器</h1>
        <p>1981 年特沃斯基与卡尼曼震动经济学界的实验：突发疫情威胁 <strong>600 条生命</strong>，两套方案在数学上 <strong>100% 等价（期望都是活 200 人、死 400 人）</strong>——仅仅把措辞从“救活”换成“死亡”，人群的选择就发生了 <strong>180° 戏剧性大反转</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setFrame('gain',this)">🟢 收益框架（用“救活人数”表述）</button>
        <button class="pill" onclick="setFrame('loss',this)">🔴 损失框架（用“死亡人数”表述）</button>
      </div>
      <div class="opt-grid" id="optCards"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 190"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const FRAMES = {
      gain: {
        aTitle:'方案 A（确定求稳）', aDesc:'确定能救活 200 人。',
        bTitle:'方案 B（冒险博弈）', bDesc:'1/3 概率 600 人全活，2/3 概率无人获救。',
        pA:72, pB:28, col:'var(--tax-green)',
        aha:'💡 <strong>顿悟时刻：</strong>在<strong>收益框架（救活）</strong>下，人类极度厌恶风险！高达 <strong>72%</strong> 的受试者选择稳稳落袋为安的方案 A（先保住 200 条命再说）。现在点击切换到 <strong>🔴 损失框架</strong> 见证奇迹翻转！'
      },
      loss: {
        aTitle:'方案 C（与 A 数学 100% 等价！）', aDesc:'确定有 400 人会死亡。',
        bTitle:'方案 D（与 B 数学 100% 等价！）', bDesc:'1/3 概率无人死亡，2/3 概率 600 人全死。',
        pA:22, pB:78, col:'var(--tax-red)',
        aha:'💡 <strong>顿悟时刻：</strong>180° 彻底大反转！方案 C 与方案 A 数学上完全是同一件事，但“确定死 400 人”触发了剧烈损失厌恶，于是高达 <strong>78%</strong> 的人瞬间化身赌徒去搏方案 D——<strong>决定你选择的往往不是事实本身，而是画框的颜色！</strong>'
      }
    };
    let cur = 'gain';

    function setFrame(f, btn){
      cur = f;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const d = FRAMES[cur];
      document.getElementById('optCards').innerHTML = `
        <div class="opt-card"><h3>🛡️ ${d.aTitle}</h3><p>${d.aDesc}</p></div>
        <div class="opt-card"><h3>🎲 ${d.bTitle}</h3><p>${d.bDesc}</p></div>
      `;

      const wA = Math.round((d.pA / 100) * 420), wB = Math.round((d.pB / 100) * 420);
      document.getElementById('svg').innerHTML = `
        <text x="24" y="28" font-size="13" font-weight="850" fill="var(--tax-ink)">真实受试者投票分布（连资深临床医生也照样中招！）：</text>
        <text x="24" y="64" font-size="12.5" font-weight="800" fill="var(--tax-primary)">🛡️ 选择确定方案 (${cur==='gain'?'A':'C'})：${d.pA}%</text>
        <rect x="24" y="74" width="420" height="24" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="24" y="74" width="${wA}" height="24" rx="6" fill="var(--tax-primary)"/>
        <text x="456" y="91" font-size="12.5" font-weight="900" fill="var(--tax-primary)">${d.pA}%</text>

        <text x="24" y="130" font-size="12.5" font-weight="800" fill="${d.col}">🎲 选择冒险博弈 (${cur==='gain'?'B':'D'})：${d.pB}%</text>
        <rect x="24" y="140" width="420" height="24" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="24" y="140" width="${wB}" height="24" rx="6" fill="${d.col}"/>
        <text x="456" y="157" font-size="12.5" font-weight="900" fill="${d.col}">${d.pB}%</text>
      `;

      document.getElementById('ahaBox').innerHTML = d.aha;
    }

    draw();
  </script>
</body>
</html>
