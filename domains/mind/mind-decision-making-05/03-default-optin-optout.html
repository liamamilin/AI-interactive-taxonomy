<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>☑️ 默认选项框架：器官捐献率 12% vs 99%</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:9px 14px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>☑️ 默认选项框架：器官捐献率 12% vs 99%</h1>
        <p>误区：奥地利人比文化、语言几乎完全相同的邻居德国人善良 8 倍，所以器官捐献率高达 99.9% vs 德国 12%。真相：根本不是道德差距，而是<strong>驾照申请表上那一个小勾的“默认状态”不同</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setMode('optin',this)">⬜ 主动勾选加入 (Opt-in：德国/丹麦/英国)</button>
        <button class="pill" onclick="setMode('optout',this)">☑️ 默认加入可退出 (Opt-out：奥地利/法国/比利时)</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 210"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const DATA = {
      optin: {
        form:'☐ 如你愿意参与器官捐献，请在此处打勾并签字',
        countries:[{n:'丹麦',v:4},{n:'德国',v:12},{n:'英国(旧)',v:17},{n:'荷兰',v:28}],
        col:'var(--tax-amber)',
        aha:'💡 <strong>顿悟时刻：</strong>在 Opt-in（主动勾选）国家，人们并非反对捐献，而是面对沉重话题时选择<strong>“先空着不管（现状偏差）”</strong>——结果德语同源的德国捐献率竟然只有 <strong>12%</strong>！点击切换到 <strong>☑️ 默认加入可退出</strong> 看惊人反差！'
      },
      optout: {
        form:'☑ 你已默认加入器官捐献计划（如不愿意，请打勾退出）',
        countries:[{n:'奥地利',v:99.9},{n:'法国',v:99.9},{n:'比利时',v:98},{n:'葡萄牙',v:99.6}],
        col:'var(--tax-green)',
        aha:'💡 <strong>顿悟时刻：</strong>仅仅改了一行表单默认文案（<strong>助推设计 Nudge</strong>），零强制、零罚款，奥地利和法国的捐献率直接飙到 <strong>99.9%</strong>！同样，互联网 App 的“默认勾选自动续费”也是这招的暗黑版——<strong>永远警惕替你做决定的默认选项！</strong>'
      }
    };
    let cur = 'optin';

    function setMode(m, btn){
      cur = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const d = DATA[cur];
      const bars = d.countries.map((c, i) => {
        const y = 78 + i * 31;
        const w = Math.round((c.v / 100) * 430);
        return `
          <text x="24" y="${y+16}" font-size="12.5" font-weight="800" fill="var(--tax-ink)">${c.n}</text>
          <rect x="115" y="${y}" width="430" height="22" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
          <rect x="115" y="${y}" width="${w}" height="22" rx="6" fill="${d.col}"/>
          <text x="556" y="${y+16}" font-size="12.5" font-weight="900" fill="${d.col}">${c.v}%</text>
        `;
      }).join('');

      document.getElementById('svg').innerHTML = `
        <rect x="24" y="16" width="592" height="42" rx="10" fill="var(--tax-primary-soft)" stroke="var(--tax-primary)" stroke-width="1.8"/>
        <text x="320" y="42" text-anchor="middle" font-size="13" font-weight="900" fill="var(--tax-primary)">驾照表单文案：${d.form}</text>
        ${bars}
      `;

      document.getElementById('ahaBox').innerHTML = d.aha;
    }

    draw();
  </script>
</body>
</html>
