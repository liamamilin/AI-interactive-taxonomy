<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏓 球拍与球陷阱：直觉抢答验算器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏓 球拍与球陷阱：直觉抢答验算器</h1><p>球拍和球一共 1.10 元，球拍比球贵 1.00 元，球多少钱？系统 1 瞬间算出 0.10 元，但验证一下：0.10 + 1.10 = 1.20 元，错了！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>球拍 + 球总价</span><span id="vTot">1.10 元</span></label><input type="range" id="sTot" min="1.1" max="5.0" step="0.1" value="1.1" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>球拍比球贵多少</span><span id="vDif">1.00 元</span></label><input type="range" id="sDif" min="0.2" max="4.0" step="0.1" value="1.0" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">系统 1 抢答误算</div><div class="k-val" id="kS1">—</div></div>
        <div class="kpi"><div class="k-lbl">系统 2 正确解</div><div class="k-val" id="kS2">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const tot=+document.getElementById('sTot').value, rawDif=+document.getElementById('sDif').value;
  const dif=Math.min(rawDif, +(tot-0.1).toFixed(2));
  document.getElementById('vTot').textContent=tot.toFixed(2)+' 元';
  document.getElementById('vDif').textContent=dif.toFixed(2)+' 元';
  const s1=Math.max(0.01, tot - dif);
  const s2=(tot - dif)/2;
  const s1Check=s1 + (s1+dif);
  document.getElementById('kS1').textContent=s1.toFixed(2)+' 元 (验算总价 '+s1Check.toFixed(2)+')';
  document.getElementById('kS1').style.color='#ef4444';
  document.getElementById('kS2').textContent=s2.toFixed(2)+' 元 (球拍 '+(s2+dif).toFixed(2)+')';
  document.getElementById('kS2').style.color='#059669';
  const sc=360/Math.max(tot, s1Check);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">价格拆解对照：为什么直觉会多算出一份球价？</text>
    <text x="20" y="82" font-size="12" font-weight="750" fill="#ef4444">系统 1 抢答</text>
    <rect x="130" y="64" width="${Math.max(8,s1*sc).toFixed(0)}" height="28" rx="4" fill="#ef4444"/>
    <rect x="${(132+s1*sc).toFixed(0)}" y="64" width="${Math.max(8,(s1+dif)*sc).toFixed(0)}" height="28" rx="4" fill="#fca5a5"/>
    <text x="515" y="83" font-size="11.5" font-weight="800" fill="#ef4444">合 ${s1Check.toFixed(2)} ❌</text>
    <text x="20" y="138" font-size="12" font-weight="750" fill="#059669">系统 2 正解</text>
    <rect x="130" y="120" width="${Math.max(8,s2*sc).toFixed(0)}" height="28" rx="4" fill="#059669"/>
    <rect x="${(132+s2*sc).toFixed(0)}" y="120" width="${Math.max(8,(s2+dif)*sc).toFixed(0)}" height="28" rx="4" fill="#6ee7b7"/>
    <text x="515" y="139" font-size="11.5" font-weight="800" fill="#059669">合 ${tot.toFixed(2)} ✅</text>
    <text x="20" y="182" font-size="11.5" fill="var(--tax-muted)">只要花 1 秒把直觉答案代回原题验算，就能立刻唤醒沉睡的系统 2。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>连名校高材生也有超半数掉进这题的坑——高智商不等于不犯错，缺乏“随手复核直觉”的习惯一样中招。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
