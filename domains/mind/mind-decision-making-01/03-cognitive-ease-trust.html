<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ 认知流畅度陷阱：排版顺眼就等于真实？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>✨ 认知流畅度陷阱：排版顺眼就等于真实？</h1><p>只要一句话押韵、字体清晰、重复出现过三次，系统 1 就会感到“认知放松”，并顺手给它打上“这听起来挺有道理”的信任标签。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>口号押韵/排版流畅度</span><span id="vFlu">85%</span></label><input type="range" id="sFlu" min="10" max="100" value="85" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>信息重复刷屏次数</span><span id="vRep">5 次</span></label><input type="range" id="sRep" min="1" max="10" value="5" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">主观直觉可信度</div><div class="k-val" id="kTru">—</div></div>
        <div class="kpi"><div class="k-lbl">系统 2 警觉度</div><div class="k-val" id="kAlr">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const flu=+document.getElementById('sFlu').value, rep=+document.getElementById('sRep').value;
  document.getElementById('vFlu').textContent=flu+'%';
  document.getElementById('vRep').textContent=rep+' 次';
  const tru=Math.min(95, Math.round(22 + flu*0.48 + rep*3.2));
  const alr=Math.max(8, 100 - tru);
  document.getElementById('kTru').textContent=tru+'%';
  document.getElementById('kAlr').textContent=alr+'%';
  document.getElementById('kAlr').style.color=alr<35?'#ef4444':'#059669';
  const wT=Math.max(12, tru*3.6), wA=Math.max(12, alr*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">哪怕内容是伪科学，流畅度与重复率如何凭空制造“真相感”</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">直觉可信度</text>
    <rect x="145" y="64" width="${wT.toFixed(0)}" height="28" rx="6" fill="#f59e0b"/>
    <text x="${(153+wT).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#d97706">${tru}%</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">理性怀疑度</text>
    <rect x="145" y="120" width="${wA.toFixed(0)}" height="28" rx="6" fill="#3b82f6"/>
    <text x="${(153+wA).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#2563eb">${alr}%</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">真相效应（Illusory Truth Effect）：谎言重复十遍不会变真，但会让系统 1 彻底放下戒备。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>听起来越顺口、越押韵的金句（“顺口溜式真理”），越要手动唤醒系统 2 检查它的逻辑前提。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
