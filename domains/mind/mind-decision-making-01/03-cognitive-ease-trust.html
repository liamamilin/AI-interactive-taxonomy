<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ 认知流畅度陷阱：排版顺眼就等于真实？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>✨ 认知流畅度陷阱：排版顺眼就等于真实？</h1>
        <p>误区：我判断一句话是真是假，只看它的逻辑和证据，绝不会被字体排版或顺口溜忽悠。真相：心理学实测，仅仅把同一句毫无证据的伪命题<strong>改成押韵金句 + 高对比清晰字体</strong>，大众相信它是真理的比例就能凭空飙升 <strong>+25%</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setPair('rhyme',this)">🎵 押韵金句 vs 朴素原话（逻辑 100% 相同）</button>
        <button class="pill" onclick="setPair('font',this)">🔤 高对比清晰排版 vs 灰暗别扭字体</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">✨ 流畅包装版：大众相信率</div><div class="k-val" id="kEasy" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">🌫️ 朴素生涩版：大众相信率</div><div class="k-val" id="kHard" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">系统 2 警觉唤醒度</div><div class="k-val" id="kS2" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const PAIRS = {
      rhyme: {
        aTitle:'✨ 高流畅押韵版（系统 1 瞬间陶醉）',
        aQuote:'“祸不单行福无双，谨慎行船万年长”',
        aRate:76,
        bTitle:'🌫️ 同义不押韵版（逻辑一字未变）',
        bQuote:'“厄运容易连续发生，小心行事比较安全”',
        bRate:51,
        aha:'💡 <strong>顿悟时刻：</strong>这就是著名的<strong>押韵即真理效应（Rhyme-as-Reason）</strong>！朗朗上口的顺口溜、对仗工整的毒鸡汤让大脑读起来毫不费力，系统 1 把“读着顺口”偷换成“这一定是真理”，直接催眠了负责挑刺的系统 2！'
      },
      font: {
        aTitle:'✨ 高对比加粗清晰版（极度顺眼）',
        aQuote:'“每天喝八杯碱性水可防百病”',
        aRate:68,
        bTitle:'🌫️ 低对比斜体生涩版（读着费劲）',
        bQuote:'“每天喝八杯碱性水可防百病”',
        bRate:41,
        aha:'💡 <strong>顿悟时刻：</strong>普林斯顿大学实验发现：当文字印得模糊难读时，受试者在 CRT 逻辑题上的正确率反而大幅提升！因为<strong>“阅读阻力”强行叫醒了打瞌睡的系统 2</strong>；相反，越是排版精美、朗朗上口的营销号爆文，越要警惕大脑自动关闭审校！'
      }
    };
    let cur = 'rhyme';

    function setPair(p, btn){
      cur = p;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const d = PAIRS[cur];
      document.getElementById('svg').innerHTML = `
        <rect x="20" y="22" width="286" height="162" rx="14" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="2.2"/>
        <text x="163" y="48" text-anchor="middle" font-size="12.5" font-weight="850" fill="var(--tax-amber)">${d.aTitle}</text>
        <text x="163" y="92" text-anchor="middle" font-size="14" font-weight="900" fill="var(--tax-ink)">${d.aQuote}</text>
        <rect x="44" y="118" width="238" height="16" rx="8" fill="var(--tax-surface)"/>
        <rect x="44" y="118" width="${Math.round(238*d.aRate/100)}" height="16" rx="8" fill="var(--tax-amber)"/>
        <text x="163" y="158" text-anchor="middle" font-size="13.5" font-weight="900" fill="var(--tax-amber)">受试者轻信率：${d.aRate}%</text>

        <rect x="334" y="22" width="286" height="162" rx="14" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>
        <text x="477" y="48" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--tax-muted)">${d.bTitle}</text>
        <text x="477" y="92" text-anchor="middle" font-size="12.5" font-style="italic" fill="var(--tax-muted)" opacity="0.72">${d.bQuote}</text>
        <rect x="358" y="118" width="238" height="16" rx="8" fill="var(--tax-border)"/>
        <rect x="358" y="118" width="${Math.round(238*d.bRate/100)}" height="16" rx="8" fill="var(--tax-primary)"/>
        <text x="477" y="158" text-anchor="middle" font-size="13.5" font-weight="900" fill="var(--tax-primary)">受试者轻信率：${d.bRate}%（警觉！）</text>
      `;

      document.getElementById('kEasy').textContent = d.aRate + '%';
      document.getElementById('kHard').textContent = d.bRate + '%';
      document.getElementById('kS2').textContent = `生涩版多唤醒 +${d.aRate - d.bRate}% 质疑`;
      document.getElementById('ahaBox').innerHTML = d.aha;
    }

    draw();
  </script>
</body>
</html>
