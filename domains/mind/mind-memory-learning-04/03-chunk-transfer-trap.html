<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧱 组块的双刃剑：定势思维陷阱</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧱 组块的双刃剑：定势思维陷阱</h1><p>当环境规则突然改变时，过度自动化的旧组块反而会变成“盲区”，让你死活看不到更简单的新解法。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>旧套路自动化固化程度</span><span id="vFix">80%</span></label><input type="range" id="sFix" min="10" max="100" value="80" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>新环境底层规则变异度</span><span id="vChg">70%</span></label><input type="range" id="sChg" min="0" max="100" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">老手表现效率</div><div class="k-val" id="kVet">—</div></div>
        <div class="kpi"><div class="k-lbl">陷入定势盲区风险</div><div class="k-val" id="kTrap">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const fix=+document.getElementById('sFix').value, chg=+document.getElementById('sChg').value;
  document.getElementById('vFix').textContent=fix+'%';
  document.getElementById('vChg').textContent=chg+'%';
  const trap=Math.round((fix*chg)/100);
  const vet=Math.max(12, Math.min(98, Math.round(50 + fix*0.45 - trap*0.75)));
  document.getElementById('kVet').textContent=vet+' 分';
  document.getElementById('kTrap').textContent=trap+'%';
  document.getElementById('kTrap').style.color=trap>50?'#ef4444':'#059669';
  const wV=Math.max(12, vet*3.6), wT=Math.max(12, trap*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">规则稳定时组块是加速器，规则剧变时组块变绊脚石</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">综合应对效能</text>
    <rect x="145" y="64" width="${wV.toFixed(0)}" height="28" rx="6" fill="#3b82f6"/>
    <text x="${(153+wV).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#3b82f6">${vet} 分</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">定势盲区风险</text>
    <rect x="145" y="120" width="${wT.toFixed(0)}" height="28" rx="6" fill="${trap>50?'#ef4444':'#f59e0b'}"/>
    <text x="${(153+wT).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="${trap>50?'#ef4444':'#d97706'}">${trap}%</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">${trap>50?'⚠️ 规则大变时，老手最容易犯“拿着锤子看啥都是钉子”的错误！':'✅ 规则相对稳定或保持开放拆解，经验组块发挥正向复利！'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>面对范式转移（如 AI 时代），刻意“拆开旧组块”、回归第一性原理，才能避免被过去的成功经验锁死。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
