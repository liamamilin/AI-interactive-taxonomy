<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 双重诅咒：能力差所以测不出自己差</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🎯 双重诅咒：能力差所以测不出自己差</h1>
        <p>1999 年达宁与克鲁格原论文核心数据：逻辑推理考分排在<strong>垫底 25%（真实第 12 百分位）</strong>的受试者，居然自我评估排在<strong>第 62 百分位</strong>！原因很残酷：做对题和“看出自己做错了题”，用的是同一套能力！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="pickQ(0,this)">📉 垫底 25% 群体（高估 +50%）</button>
        <button class="pill" onclick="pickQ(1,this)">📊 中下 25% 群体</button>
        <button class="pill" onclick="pickQ(2,this)">📈 中上 25% 群体</button>
        <button class="pill" onclick="pickQ(3,this)">🏆 顶尖 25% 群体（反略低估！）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 220"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">该群体真实考分排名</div><div class="k-val" id="kReal" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">该群体自评能力排名</div><div class="k-val" id="kSelf" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">元认知错位误差</div><div class="k-val" id="kErr">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    // Classic Kruger & Dunning (1999) quartiles
    const QUARTS = [
      { lbl:'垫底 25%', real:12, self:62, aha:'💡 <strong>顿悟时刻：</strong>这就是“双重诅咒”！排在第 <strong>12%</strong> 的人不仅考砸了，还因为缺乏评判逻辑对错的标尺，真诚地以为自己考了中上（<strong>62%</strong>，整整高估 +50 个百分位）！' },
      { lbl:'中下 25%', real:37, self:65, aha:'💡 <strong>顿悟时刻：</strong>中下群体依然高估了自己 <strong>+28 个百分位</strong>。打破盲区最有效的方法不是空想，而是接受<strong>外部盲审与客观标准答案的毒打</strong>！' },
      { lbl:'中上 25%', real:63, self:70, aha:'💡 <strong>顿悟时刻：</strong>进入中上水平后，你终于拥有了足以识别自身错误的元认知标尺，自评（70%）与真实（63%）迅速逼近！' },
      { lbl:'顶尖 25%', real:86, self:74, aha:'💡 <strong>顿悟时刻：</strong>原论文最迷人的反转！顶尖 25% 高手（真实排 <strong>86%</strong>）居然普遍<strong>低估</strong>了自己的排名（自评 74%）——因为他们觉得题很简单，便误以为别人也都考得很好！' }
    ];
    let q = 0;

    function pickQ(i, btn){
      q = i;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const x0=84, x1=580, yMin=28, yMax=182;
      const toX = i => x0 + (i/3)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      const ptsR = QUARTS.map((d,i)=>`${toX(i).toFixed(1)},${toY(d.real).toFixed(1)}`).join(' ');
      const ptsS = QUARTS.map((d,i)=>`${toX(i).toFixed(1)},${toY(d.self).toFixed(1)}`).join(' ');
      const cur = QUARTS[q];
      const err = cur.self - cur.real;

      document.getElementById('svg').innerHTML = `
        ${[0,25,50,75,100].map(v=>`<line x1="${x0-24}" y1="${toY(v)}" x2="${x1+24}" y2="${toY(v)}" stroke="var(--tax-border)"/><text x="${x0-32}" y="${toY(v)+4}" text-anchor="end" font-size="10.5" fill="var(--tax-muted)">${v}%</text>`).join('')}
        ${QUARTS.map((d,i)=>`<text x="${toX(i)}" y="204" text-anchor="middle" font-size="11.5" font-weight="${i===q?900:700}" fill="${i===q?'var(--tax-primary)':'var(--tax-muted)'}">${d.lbl}</text>`).join('')}
        <line x1="${toX(q)}" y1="${toY(cur.real)}" x2="${toX(q)}" y2="${toY(cur.self)}" stroke="${err>0?'var(--tax-red)':'var(--tax-amber)'}" stroke-width="3" stroke-dasharray="4 3"/>
        <polyline points="${ptsR}" fill="none" stroke="var(--tax-green)" stroke-width="3.2"/>
        <polyline points="${ptsS}" fill="none" stroke="var(--tax-primary)" stroke-width="3.2" stroke-dasharray="6 4"/>
        ${QUARTS.map((d,i)=>`<circle cx="${toX(i)}" cy="${toY(d.real)}" r="${i===q?7:4.5}" fill="var(--tax-green)"/><circle cx="${toX(i)}" cy="${toY(d.self)}" r="${i===q?7:4.5}" fill="var(--tax-primary)"/>`).join('')}
        <text x="${x0-20}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-primary)">-- 主观自评百分位</text>
        <text x="${x0+130}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-green)">● 客观真实考分百分位（1999 原论文实测）</text>
      `;

      document.getElementById('kReal').textContent = `第 ${cur.real} 百分位`;
      document.getElementById('kSelf').textContent = `自评第 ${cur.self} 百分位`;
      const kE = document.getElementById('kErr');
      kE.textContent = err > 0 ? `高估 +${err}% 🚨` : `反向低估 ${err}% 🎭`;
      kE.style.color = err > 20 ? 'var(--tax-red)' : 'var(--tax-amber)';
      document.getElementById('ahaBox').innerHTML = cur.aha;
    }

    draw();
  </script>
</body>
</html>
