<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎭 专家的反向错觉：错误共识与冒充者感</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎭 专家的反向错觉：错误共识与冒充者感</h1><p>达克效应的另一端常被忽视：顶尖高手因为自己觉得任务太容易，会误以为“别人也能轻松做到”，从而低估自己、产生冒充者综合征。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>个人真实专业水平</span><span id="vLvl">90 分</span></label><input type="range" id="sLvl" min="50" max="99" value="90" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>身边参照圈子平均水平</span><span id="vPeer">88 分（顶尖圈层）</span></label><input type="range" id="sPeer" min="40" max="98" value="88" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">全行业真实排位</div><div class="k-val" id="kAll">—</div></div>
        <div class="kpi"><div class="k-lbl">局域参照引发的冒充者感</div><div class="k-val" id="kImp">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const lvl=+document.getElementById('sLvl').value, peer=+document.getElementById('sPeer').value;
  document.getElementById('vLvl').textContent=lvl+' 分';
  document.getElementById('vPeer').textContent=peer+' 分';
  const imp=Math.max(5, Math.min(95, Math.round(50 + (peer - lvl)*3 + (peer-60)*0.6)));
  document.getElementById('kAll').textContent='超越全行业 '+lvl+'% 的人';
  document.getElementById('kImp').textContent=imp+'%'+(imp>=65?'（强冒充者感）':'（自我定位平和）');
  document.getElementById('kImp').style.color=imp>=65?'#8b5cf6':'#059669';
  const wL=Math.max(12, lvl*3.6), wP=Math.max(12, peer*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">你的水平 vs 身边高频对比圈层</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">你的真实能力</text>
    <rect x="145" y="64" width="${wL.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(153+wL).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#059669">${lvl} 分</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">身边参照圈子</text>
    <rect x="145" y="120" width="${wP.toFixed(0)}" height="28" rx="6" fill="#3b82f6"/>
    <text x="${(153+wP).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#3b82f6">${peer} 分</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">常年待在顶尖圈子里，会让你误把“前 10% 的硬实力”当成人人都会的普通水准。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>如果你常觉得自己“只是运气好、随时会被拆穿”，试着去教一次新人，你立刻会重新校准自己的真实价值。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
