<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏔️ 达克效应“愚昧之山”曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🏔️ 达克效应“愚昧之山”曲线</h1>
        <p>误区：自信心是随着能力线性增长的——懂得越多越敢拍胸脯。真相：初学一点皮毛时，因为“不知道自己不知道”，自信心会瞬间飙上<strong>愚昧之山顶</strong>；直到撞上真实难题跌进<strong>绝望之谷</strong>，才真正开始成长！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="playClimb()">▶ 播放成长轨迹</button>
        <button class="pill active" onclick="jump(12,this)">🐣 刚看 2 篇爆文（愚昧之山）</button>
        <button class="pill" onclick="jump(34,this)">😰 实战踩坑（绝望之谷）</button>
        <button class="pill" onclick="jump(66,this)">🛠️ 刻意深耕（开悟之坡）</button>
        <button class="pill" onclick="jump(92,this)">🧙 行业专家（平稳高原）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当前真实领域能力</div><div class="k-val" id="kSkill" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">当前主观自信心</div><div class="k-val" id="kConf">—</div></div>
        <div class="kpi"><div class="k-lbl">所处达克阶段</div><div class="k-val" id="kPhase">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let sk = 12, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function jump(v, btn){
      if(timer){ clearInterval(timer); timer=null; }
      sk = v;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function playClimb(){
      if(timer) clearInterval(timer);
      markDone();
      sk = 2;
      timer = setInterval(()=>{
        sk += 2;
        if(sk >= 96){ sk = 96; clearInterval(timer); timer=null; }
        draw();
      }, 45);
      draw();
    }

    function confAt(x){
      // Mount Stupid peak at x=12 (~92), Valley of Despair at x=34 (~24), Slope of Enlightenment -> Plateau (~78)
      const peak = 82 * Math.exp(-Math.pow((x - 11) / 8.5, 2));
      const valley = -32 * Math.exp(-Math.pow((x - 34) / 14, 2));
      const slope = 78 / (1 + Math.exp(-(x - 46) / 14));
      return Math.max(15, Math.min(96, Math.round(14 + peak + valley + slope * 0.82)));
    }

    function draw(){
      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = v => x0 + (v/100)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pts = [];
      for(let v=0; v<=100; v+=2) pts.push(`${toX(v).toFixed(1)},${toY(confAt(v)).toFixed(1)}`);
      const c = confAt(sk);
      const phase = sk < 22 ? '🏔️ 愚昧之山顶' : (sk < 48 ? '🕳️ 绝望之谷' : (sk < 80 ? '⛰️ 开悟之坡' : '🧙 平稳高原'));
      const col = sk < 22 ? 'var(--tax-red)' : (sk < 48 ? 'var(--tax-amber)' : 'var(--tax-green)');

      document.getElementById('svg').innerHTML = `
        <line x1="${x0}" y1="${yMax}" x2="${x1}" y2="${yMin}" stroke="var(--tax-muted)" stroke-dasharray="5 4" stroke-opacity="0.5"/>
        <text x="${toX(12)}" y="${toY(95)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-red)">愚昧之山</text>
        <text x="${toX(34)}" y="${toY(14)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-amber)">绝望之谷</text>
        <text x="${toX(88)}" y="${toY(83)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-green)">平稳高原</text>
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="${toX(sk)}" cy="${toY(c)}" r="7" fill="${col}"/>
        <text x="${x0}" y="208" font-size="11" fill="var(--tax-muted)">0% 零基础</text>
        <text x="${x1}" y="208" text-anchor="end" font-size="11" fill="var(--tax-muted)">100% 领域宗师</text>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">横轴：真实能力 · 纵轴：主观自信（虚线 = 理想校准线）</text>
      `;

      document.getElementById('kSkill').textContent = sk + ' 分';
      const kC = document.getElementById('kConf'); kC.textContent = c + ' 分'; kC.style.color = col;
      const kP = document.getElementById('kPhase'); kP.textContent = phase; kP.style.color = col;

      document.getElementById('ahaBox').innerHTML = sk < 22
        ? `💡 <strong>顿悟时刻：</strong>你正站在<strong>愚昧之山顶</strong>（能力 ${sk}，自信却飙到 <strong>${c}</strong>）！因为还没见过冰山下的复杂细节，以为“这玩意就这么简单”——此时最容易在评论区大放厥词！`
        : sk < 48
        ? `💡 <strong>顿悟时刻：</strong>恭喜跌进<strong>绝望之谷</strong>（能力涨到了 ${sk}，自信却暴跌到 ${c}）！别沮丧——<strong>感到自己很菜，恰恰是你真正看清领域深度的第一个成熟标志！</strong>`
        : `💡 <strong>顿悟时刻：</strong>越过绝望之谷走上<strong>${phase}</strong>！真正的大师（能力 ${sk}）反而比半吊子更谦逊谨慎（自信 ${c}），因为他们比谁都清楚边界和例外在哪里！`;
    }

    draw();
  </script>
</body>
</html>
