<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>运动与乐器：随机变奏为何比死磕单动作稳？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (max-width: 600px) { .plan-grid { grid-template-columns: 1fr; } }
    .plan-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .plan-btn:hover { border-color: var(--tax-primary); }
    .plan-btn.active { border-color: var(--tax-primary); background: var(--tax-primary-soft); }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .m-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .m-val { font-size: 22px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚾ 运动与乐器：随机变奏教练决策</h1>
      <p>Hall 等人 (1994) 对大学棒球队做过 6 周实验：同样每周额外击打 45 颗球（直球、曲球、变速球各 15 颗），你会作为教练为队员选择哪种排课方案？</p>
    </header>

    <section class="toy-card">
      <div style="font-size:13px;color:var(--tax-muted);margin-bottom:8px;">为接下来 3 个训练场景选择排课策略（共 3 轮）：</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:10px;" id="sceneTitle"></div>

      <div class="plan-grid">
        <button class="plan-btn" id="optBlocked">
          <div style="font-weight:700;font-size:14px;" id="bTitle"></div>
          <div style="font-size:12px;color:var(--tax-muted);margin-top:4px;" id="bDesc"></div>
        </button>
        <button class="plan-btn" id="optRandom">
          <div style="font-weight:700;font-size:14px;" id="rTitle"></div>
          <div style="font-size:12px;color:var(--tax-muted);margin-top:4px;" id="rDesc"></div>
        </button>
      </div>

      <svg id="chartSvg" viewBox="0 0 680 165" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="训练手感与比赛实战对比"></svg>

      <div class="metrics">
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">🏋️ 当日训练手感满意度</div><div class="m-val" id="feelVal">—</div></div>
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">🏆 正式比赛 / 舞台实战表现</div><div class="m-val" id="matchVal">—</div></div>
      </div>

      <div style="margin-top:10px;text-align:right;">
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一个训练场景 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>教练抉择：</strong>选定一种训练法，观察“训练场爽感”与“正式比赛提升幅度”之间的反向关系。
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const SCENES = [
      {
        title: '场景 1/3 · 棒球击球训练（直球 / 曲球 / 变速球，共 45 球）',
        bTitle: '🧱 固定分组：15 直球 → 15 曲球 → 15 变速',
        bDesc: '每颗球都知道下一次怎么挥棒，训练场安打声不断',
        rTitle: '🎲 随机变奏：45 球完全随机发球',
        rDesc: '每球都得重新读球路、重启发力程序，训练场频频挥空',
        bFeel: 88, bMatch: 24, rFeel: 52, rMatch: 57,
        note: 'Hall (1994) 实证结果：6 周后随机变奏组实战击球提升 +57%，远超固定分组的 +24%！'
      },
      {
        title: '场景 2/3 · 钢琴音乐会备赛（3 个高难乐句，共练 30 分钟）',
        bTitle: '🧱 死磕单句：每句连续重复弹 10 分钟',
        bDesc: '第 8 分钟越弹越顺手，肌肉进入自动巡航',
        rTitle: '🎲 交错切段：每 2 分钟随机切另一乐句并换速度',
        rDesc: '刚顺手就被迫切换，大脑必须不断重新提取指法表征',
        bFeel: 90, bMatch: 38, rFeel: 58, rMatch: 79,
        note: '每次主动“遗忘并重建动作计划”，才会在运动皮层刻下抗紧张、抗干扰的稳固表征！'
      },
      {
        title: '场景 3/3 · 羽毛球网前小球与后场杀球衔接',
        bTitle: '🧱 定点喂球：先喂 30 个网前，再喂 30 个高远',
        bDesc: '脚步不用重新启动，汗流浃背但动作很规整',
        rTitle: '🎲 不定点混喂：前后左右随机喂球 60 拍',
        rDesc: '失误率翻倍，但每拍都在练真实比赛里的“预判→步法→击球”',
        bFeel: 85, bMatch: 32, rFeel: 50, rMatch: 82,
        note: '运动科学称之为“情境干扰效应（Contextual Interference）”：只有在初学建构基本动作后的巩固期引入随机变奏，技能迁移才最稳！'
      }
    ];

    let idx = 0;
    let picked = null;
    let done = false;

    const svg = document.getElementById('chartSvg');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function drawBars(feel, match, label) {
      let html = `<text x="24" y="28" fill="var(--tax-ink)" font-size="13" font-weight="700">${label}</text>`;
      // Feel bar
      html += `<text x="24" y="64" fill="var(--tax-muted)" font-size="12">训练场爽感</text>`;
      html += `<rect x="115" y="48" width="500" height="22" rx="10" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="115" y="48" width="${feel * 5}" height="22" rx="10" fill="rgba(245,158,11,0.78)"/>`;
      html += `<text x="${123 + feel * 5}" y="64" fill="var(--tax-amber)" font-size="12" font-weight="700">${feel}%</text>`;

      // Match bar
      html += `<text x="24" y="114" fill="var(--tax-muted)" font-size="12">实战提升力</text>`;
      html += `<rect x="115" y="98" width="500" height="22" rx="10" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="115" y="98" width="${match * 5}" height="22" rx="10" fill="rgba(16,185,129,0.82)"/>`;
      html += `<text x="${123 + match * 5}" y="114" fill="var(--tax-green)" font-size="12" font-weight="700">${match}%</text>`;

      html += `<text x="24" y="148" fill="var(--tax-muted)" font-size="11">提示：点击另一个方案可以直接对比两种训练法的反差</text>`;
      svg.innerHTML = html;
    }

    function renderScene() {
      const s = SCENES[idx];
      picked = null;
      document.getElementById('sceneTitle').textContent = s.title;
      document.getElementById('bTitle').textContent = s.bTitle;
      document.getElementById('bDesc').textContent = s.bDesc;
      document.getElementById('rTitle').textContent = s.rTitle;
      document.getElementById('rDesc').textContent = s.rDesc;
      document.getElementById('optBlocked').classList.remove('active');
      document.getElementById('optRandom').classList.remove('active');
      document.getElementById('feelVal').textContent = '—';
      document.getElementById('matchVal').textContent = '—';
      nextBtn.style.display = 'none';
      svg.innerHTML = `<text x="340" y="88" text-anchor="middle" fill="var(--tax-muted)" font-size="13">请点击上方两种训练方案之一，查看训练手感 vs 实战迁移数据</text>`;
    }

    function choose(type) {
      const s = SCENES[idx];
      picked = type;
      document.getElementById('optBlocked').classList.toggle('active', type === 'blocked');
      document.getElementById('optRandom').classList.toggle('active', type === 'random');
      const feel = type === 'blocked' ? s.bFeel : s.rFeel;
      const match = type === 'blocked' ? s.bMatch : s.rMatch;
      document.getElementById('feelVal').textContent = feel + '%';
      document.getElementById('matchVal').textContent = match + '%';
      drawBars(feel, match, type === 'blocked' ? '🧱 固定单动作连刷结果' : '🎲 随机变奏交错训练结果');
      ahaBox.innerHTML = `<strong>${type === 'random' ? '✓ 选对实战利器' : '⚠️ 警惕训练场假象'}：</strong>${s.note}`;
      if (idx === SCENES.length - 1) {
        markDone('完成了运动与乐器随机变奏训练决策');
        nextBtn.textContent = '↺ 重头体验 3 个场景';
      } else {
        nextBtn.textContent = '下一个训练场景 →';
      }
      nextBtn.style.display = 'inline-block';
    }

    document.getElementById('optBlocked').onclick = () => choose('blocked');
    document.getElementById('optRandom').onclick = () => choose('random');
    nextBtn.onclick = () => {
      idx = (idx + 1) % SCENES.length;
      renderScene();
    };

    renderScene();
  </script>
</body>
</html>
