<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>解题两步：选对工具 vs 算对步骤</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .q-box { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .tool-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    @media (max-width: 600px) { .tool-row { grid-template-columns: 1fr; } }
    .tool-btn {
      padding: 10px; border-radius: 9px; border: 1px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .tool-btn:hover { border-color: var(--tax-primary); }
    .tool-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .tool-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); color: var(--tax-red); }
    .mode-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--tax-primary-soft); color: var(--tax-primary); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🧰 解题两步：策略判别盲测实验室</h1>
      <p>真实考场里的任何一道题都有两步：<strong>① 识别该掏哪件工具（判别）</strong> + ② 动手执行。体验下面两轮：先做「章节集中刷题」，再做「无标签交错混测」，看哪一轮才真正逼你动用了第 ① 步！</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <span class="mode-pill" id="modeBadge">第 1 轮 · 集中刷题模式（已知本章：贝叶斯概率）</span>
        <span style="font-size:13px;color:var(--tax-muted);" id="progressTxt">题目 1 / 4</span>
      </div>

      <div class="q-box">
        <div style="font-size:15px;font-weight:700;line-height:1.55;" id="qText"></div>
        <div style="font-size:12px;color:var(--tax-muted);margin-top:6px;">请为这道题选择最核心的解题工具：</div>
        <div class="tool-row" id="toolRow"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;color:var(--tax-muted);" id="fbTxt">点击上方工具作答</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一题 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>实验观察：</strong>注意第 1 轮顶部已经剧透了“本章专题”，你的大脑根本不需要做判别；第 2 轮把章节标签撕掉后，才是真正考验区分力的开始！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const TOOLS = ['条件概率 / 贝叶斯', '期望值 / 边际分析', '组合计数 / 排列'];
    const QUESTIONS = [
      { mode: 'blocked', q: '【第 3 章·贝叶斯课后题 1】某疾病发病率 1%，检测灵敏度 99%，测出阳性后真正患病的概率？', ans: 0 },
      { mode: 'blocked', q: '【第 3 章·贝叶斯课后题 2】两枚硬币一枚正常一枚双面正，随机抽一枚抛 3 次全正，抽到假币概率？', ans: 0 },
      { mode: 'interleaved', q: '【混合考场题 1】从 8 名工程师里选 3 人组成评审组（不计顺序），共有多少种组队方案？', ans: 2 },
      { mode: 'interleaved', q: '【混合考场题 2】花 10 元抽盲盒，10% 概率中 80 元，90% 概率中 0 元，长期抽是否划算？', ans: 1 }
    ];

    let idx = 0;
    let locked = false;
    let interCorrect = 0;
    let done = false;

    const modeBadge = document.getElementById('modeBadge');
    const progressTxt = document.getElementById('progressTxt');
    const qText = document.getElementById('qText');
    const toolRow = document.getElementById('toolRow');
    const fbTxt = document.getElementById('fbTxt');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const item = QUESTIONS[idx];
      locked = false;
      nextBtn.style.display = 'none';
      progressTxt.textContent = `题目 ${idx + 1} / ${QUESTIONS.length}`;
      modeBadge.textContent = item.mode === 'blocked'
        ? '阶段 A · 集中刷题（章节标签已剧透答案工具）'
        : '阶段 B · 交错混测（撕掉标签，必须自主判别工具！）';
      qText.textContent = item.q;
      fbTxt.textContent = '请选择这道题对应的核心工具';
      toolRow.innerHTML = '';

      TOOLS.forEach((t, ti) => {
        const b = document.createElement('button');
        b.className = 'tool-btn';
        b.textContent = t;
        b.onclick = () => {
          if (locked) return;
          locked = true;
          const ok = ti === item.ans;
          b.classList.add(ok ? 'ok' : 'bad');
          if (item.mode === 'interleaved' && ok) interCorrect++;
          fbTxt.textContent = ok
            ? (item.mode === 'blocked' ? '✓ 对了——但其实你不读题也知道选贝叶斯，第 1 步判别能力训练量为 0！' : '✓ 精准识别！你在没有提示的情况下独立完成了“题型→工具”映射！')
            : `✕ 这道题的核心工具是「${TOOLS[item.ans]}」。`;

          if (idx < QUESTIONS.length - 1) {
            nextBtn.textContent = '下一题 →';
            nextBtn.style.display = 'inline-block';
          } else {
            markDone(`完成策略判别盲测（交错阶段答对 ${interCorrect}/2）`);
            nextBtn.textContent = '↺ 重新体验';
            nextBtn.style.display = 'inline-block';
            ahaBox.innerHTML = '<strong>为什么交错练习更管用？</strong>课后集中刷题把“第 ① 步：选工具”直接外包给了章节标题，只练了机械代入；只有撕掉章节标签、把易混淆题型混在一起刷，大脑才会被迫提炼“题干特征 → 策略选择”的判别边界！';
          }
        };
        toolRow.appendChild(b);
      });
    }

    nextBtn.onclick = () => {
      if (idx < QUESTIONS.length - 1) idx++;
      else { idx = 0; interCorrect = 0; }
      render();
    };

    render();
  </script>
</body>
</html>
