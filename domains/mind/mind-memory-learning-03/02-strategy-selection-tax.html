<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧰 解题两步：选对工具 vs 算对步骤</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧰 解题两步：选对工具 vs 算对步骤</h1><p>真实世界的问题从来不会在脑门上贴标签写着“请用第 3 章公式”。不会选工具，算得再快也是南辕北辙。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>单题型计算熟练度</span><span id="vCal">90%</span></label><input type="range" id="sCal" min="30" max="100" value="90" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>跨题型“选对公式”辨别率</span><span id="vSel">45%</span></label><input type="range" id="sSel" min="20" max="100" value="45" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">综合卷最终得分率</div><div class="k-val" id="kTot">—</div></div>
        <div class="kpi"><div class="k-lbl">当前最大瓶颈</div><div class="k-val" id="kBot">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const cal=+document.getElementById('sCal').value, sel=+document.getElementById('sSel').value;
  document.getElementById('vCal').textContent=cal+'%';
  document.getElementById('vSel').textContent=sel+'%';
  const tot=Math.round(cal*sel/100);
  document.getElementById('kTot').textContent=tot+'%';
  document.getElementById('kTot').style.color=tot>=70?'#059669':'#ef4444';
  document.getElementById('kBot').textContent=sel<cal?'🎯 判别选型短板':'⚙️ 执行计算短板';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">串联乘法效应：最终得分 = 选对工具 (${sel}%) × 算对步骤 (${cal}%)</text>
    <rect x="30" y="65" width="150" height="68" rx="10" fill="#3b82f6" opacity="0.16" stroke="#3b82f6" stroke-width="2"/>
    <text x="105" y="94" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">Step 1: 选对工具</text>
    <text x="105" y="118" text-anchor="middle" font-size="18" font-weight="850" fill="#2563eb">${sel}%</text>
    <text x="202" y="106" font-size="20" font-weight="800" fill="var(--tax-muted)">×</text>
    <rect x="225" y="65" width="150" height="68" rx="10" fill="#8b5cf6" opacity="0.16" stroke="#8b5cf6" stroke-width="2"/>
    <text x="300" y="94" text-anchor="middle" font-size="12" font-weight="800" fill="#7c3aed">Step 2: 执行步骤</text>
    <text x="300" y="118" text-anchor="middle" font-size="18" font-weight="850" fill="#7c3aed">${cal}%</text>
    <text x="398" y="106" font-size="20" font-weight="800" fill="var(--tax-muted)">=</text>
    <rect x="425" y="65" width="145" height="68" rx="10" fill="${tot>=70?'#059669':'#ef4444'}" opacity="0.18" stroke="${tot>=70?'#059669':'#ef4444'}" stroke-width="2"/>
    <text x="497" y="94" text-anchor="middle" font-size="12" font-weight="800" fill="${tot>=70?'#059669':'#ef4444'}">真实得分</text>
    <text x="497" y="118" text-anchor="middle" font-size="20" font-weight="900" fill="${tot>=70?'#059669':'#ef4444'}">${tot}%</text>
    <text x="30" y="172" font-size="11.5" fill="var(--tax-muted)">把题混起来练，专门补齐 Step 1 的短板，边际提分远超继续死磕 Step 2！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>集中练习只把 Step 2 刷到 95%，却让 Step 1 停在 45%，两者一相乘照样不及格。交错练习补上的正是缺失的“路由判断力”。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
