<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔊 语音回路：2 秒不默念就消散</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔊 语音回路：2 秒不默念就消散</h1><p>巴德利模型指出，大脑靠“内心默念（语音回路）”不断刷新临时信息，而语音回路的保鲜期只有约 2 秒。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>单次默念完整耗时（词长影响）</span><span id="vSpk">1.8 秒</span></label><input type="range" id="sSpk" min="0.8" max="4.0" step="0.2" value="1.8" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>中途被打断停止默念时长</span><span id="vInt">1.0 秒</span></label><input type="range" id="sInt" min="0" max="4.0" step="0.2" value="1.0" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">信息衰减周期</div><div class="k-val" id="kCyc">—</div></div>
        <div class="kpi"><div class="k-lbl">验证码存活概率</div><div class="k-val" id="kSurv">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const spk=+document.getElementById('sSpk').value, intr=+document.getElementById('sInt').value;
  document.getElementById('vSpk').textContent=spk.toFixed(1)+' 秒';
  document.getElementById('vInt').textContent=intr.toFixed(1)+' 秒';
  const total=spk+intr;
  const surv=Math.max(4, Math.min(99, Math.round(100*Math.exp(-Math.max(0, total-1.6)*0.72))));
  document.getElementById('kCyc').textContent=total.toFixed(1)+' 秒';
  document.getElementById('kSurv').textContent=surv+'%';
  document.getElementById('kSurv').style.color=surv<50?'#ef4444':'#059669';
  let pts=[];
  for(let t=0;t<=60;t++){
    const sec=t*0.1;
    const rem=sec<=0.4?100:100*Math.exp(-Math.max(0,sec-0.4)/2.0);
    const x=45+sec*85, y=170-rem*1.25;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  const cx=Math.min(555, 45+total*85);
  const cy=170 - surv*1.25;
  document.getElementById('svg').innerHTML=`
    <text x="45" y="26" font-size="13" font-weight="800" fill="var(--tax-text)">语音痕量自然衰减曲线（无复述 2 秒半衰期）</text>
    <line x1="45" y1="170" x2="560" y2="170" stroke="var(--tax-border)" stroke-width="1.5"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#6366f1" stroke-width="3"/>
    <line x1="${cx.toFixed(1)}" y1="40" x2="${cx.toFixed(1)}" y2="170" stroke="${surv<50?'#ef4444':'#059669'}" stroke-dasharray="4,3" stroke-width="2"/>
    <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="7" fill="${surv<50?'#ef4444':'#059669'}"/>
    <text x="${Math.min(460,cx+10).toFixed(1)}" y="${Math.max(55,cy-8).toFixed(1)}" font-size="12" font-weight="800" fill="${surv<50?'#ef4444':'#059669'}">存活 ${surv}%</text>
    <text x="45" y="190" font-size="11" fill="var(--tax-muted)">0s</text>
    <text x="215" y="190" font-size="11" fill="var(--tax-muted)">2s（语音回路极限）</text>
    <text x="520" y="190" font-size="11" fill="var(--tax-muted)">6s</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>这就是为什么中文单音节数字比多音节英文数字更好记（2 秒内能默念更多位），也解释了为什么刚背完 6 位验证码被别人问一句“午饭吃啥”就瞬间清零！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
