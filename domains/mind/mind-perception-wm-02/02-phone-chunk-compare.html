<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📱 11 位数字裸记 vs 分段记忆</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📱 11 位数字裸记 vs 分段记忆</h1><p>槽位数量几乎无法通过训练扩大，但每个槽位里能装下的“打包体积”却可以成倍增长。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>原始离散字符长度</span><span id="vLen">11 位</span></label><input type="range" id="sLen" min="6" max="18" value="11" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>每组打包字符数（Chunk Size）</span><span id="vGrp">4 位/组</span></label><input type="range" id="sGrp" min="1" max="5" value="4" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">裸记所需槽位</div><div class="k-val" id="kRaw">—</div></div>
        <div class="kpi"><div class="k-lbl">分组后占用槽位</div><div class="k-val" id="kChk">—</div></div>
        <div class="kpi"><div class="k-lbl">预估完整回忆率</div><div class="k-val" id="kAcc">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const len=+document.getElementById('sLen').value, grp=+document.getElementById('sGrp').value;
  document.getElementById('vLen').textContent=len+' 位';
  document.getElementById('vGrp').textContent=grp+' 位/组';
  const chunks=Math.ceil(len/grp);
  const rawAcc=Math.max(8, Math.min(99, Math.round(100 - Math.max(0, len-5)*11)));
  const chkAcc=Math.max(12, Math.min(99, Math.round(100 - Math.max(0, chunks-4)*14 - Math.max(0, grp-4)*10)));
  document.getElementById('kRaw').textContent=len+' 槽';
  document.getElementById('kChk').textContent=chunks+' 槽';
  document.getElementById('kChk').style.color=chunks<=4?'#059669':'#f59e0b';
  document.getElementById('kAcc').textContent=chkAcc+'% (裸记仅 '+rawAcc+'%)';
  const w1=Math.max(10, Math.min(340, len*18));
  const w2=Math.max(10, Math.min(340, chunks*18));
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">工作记忆槽位压力对比（安全红线：4 槽）</text>
    <line x1="232" y1="45" x2="232" y2="165" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="236" y="54" font-size="11" font-weight="800" fill="#ef4444">4 槽安全线</text>
    <text x="20" y="86" font-size="12.5" font-weight="750" fill="var(--tax-text)">无分组裸记</text>
    <rect x="160" y="68" width="${w1}" height="28" rx="6" fill="#ef4444" opacity="0.8"/>
    <text x="${168+w1}" y="87" font-size="12" font-weight="800" fill="#ef4444">${len} 槽</text>
    <text x="20" y="140" font-size="12.5" font-weight="750" fill="var(--tax-text)">${grp} 位一组编码</text>
    <rect x="160" y="122" width="${w2}" height="28" rx="6" fill="${chunks<=4?'#059669':'#f59e0b'}"/>
    <text x="${168+w2}" y="141" font-size="12" font-weight="800" fill="${chunks<=4?'#059669':'#d97706'}">${chunks} 槽</text>
    <text x="20" y="186" font-size="11.5" fill="var(--tax-muted)">每组 3~4 位恰好落在“子槽位”舒适区，能把 11 位手机号压进 3 个工作记忆槽！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>手机号 138-0013-8000、银行卡每 4 位空格、代码缩进分块，全都是在向人类 4 槽位工作记忆“低头”的经典设计。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
