<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>为什么“假设已失败”能打破群体迷思？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (max-width: 600px) { .btn-pair { grid-template-columns: 1fr; } }
    .mode-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .mode-btn.active { border-color: var(--tax-primary); background: var(--tax-primary-soft); }
    .chat-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    @media (max-width: 600px) { .chat-list { grid-template-columns: 1fr; } }
    .bubble { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); font-size: 12.5px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🗣️ 为什么“假设已失败”能打破群体迷思？（会议室情景）</h1>
      <p>老板刚激情澎湃讲完一个有隐患的新项目，全场鼓掌。切换下面两种<strong>会议提问方式</strong>，偷听 4 位核心成员内心真正想说的话 vs 敢不敢当场说出口！</p>
    </header>

    <section class="toy-card">
      <div class="btn-pair">
        <button class="mode-btn active" id="normalBtn">
          <div style="font-weight:800;font-size:14px;">😬 传统问法：“大家觉得这个方案有什么问题吗？”</div>
          <div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">此时唱反调 = 质疑老板、破坏团结、显得不合群</div>
        </button>
        <button class="mode-btn" id="preBtn">
          <div style="font-weight:800;font-size:14px;">🩺 事前验尸指令：“假设 1 年后已惨败，每人必须写 2 条死因！”</div>
          <div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">唱反调瞬间变成“帮团队排雷的聪明贡献”！</div>
        </button>
      </div>

      <svg id="meterSvg" viewBox="0 0 680 95" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="会议室心理安全感与真实风险暴露率"></svg>

      <div class="chat-list" id="chatList"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>群体迷思现场：</strong>在传统问法下，4 个人心里都看见了隐患，但为了避免当“扫兴的人”，真话暴露率只有 <strong>18%</strong>！点击右侧「事前验尸指令」看心理安全感瞬间翻转！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const MEMBERS = [
      { role: '🧑‍💻 后端架构师', normal: '（心里：数据库扛不住峰值…）嘴上：“挺好的，我们尽力配合！”', pre: '🗣️ 公开写出：“死因 1：大促峰值写入会锁表宕机，必须提前做读写分离！”' },
      { role: '📊 产品经理', normal: '（心里：老用户根本不会迁移…）嘴上：“方向很赞，期待上线！”', pre: '🗣️ 公开写出：“死因 2：老客户迁移成本太高，留存可能掉 40%！”' },
      { role: '⚖️ 法务合规', normal: '（心里：跨境数据审批要 3 个月…）嘴上：“后续我们再评估一下。”', pre: '🗣️ 公开写出：“死因 3：跨境数据合规审批至少卡 90 天，排期必爆！”' },
      { role: '📣 市场负责人', normal: '（心里：获客成本比预算高 3 倍…）嘴上：“没问题，全力冲刺！”', pre: '🗣️ 公开写出：“死因 4：冷启动获客单价超预算 3 倍，推广两周就会烧光！”' }
    ];

    let mode = 'normal';
    let done = false;

    const svg = document.getElementById('meterSvg');
    const chatList = document.getElementById('chatList');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('normalBtn').classList.toggle('active', mode === 'normal');
      document.getElementById('preBtn').classList.toggle('active', mode === 'pre');

      const rate = mode === 'pre' ? 86 : 18;
      const col = mode === 'pre' ? 'var(--tax-green)' : 'var(--tax-red)';

      let html = '';
      html += `<text x="24" y="30" fill="var(--tax-ink)" font-size="13.5" font-weight="800">🛡️ 真实异见与暗雷暴露率：${rate}%（${mode === 'pre' ? '心理安全感拉满' : '严重群体迷思沉默'}）</text>`;
      html += `<rect x="24" y="46" width="632" height="22" rx="11" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="24" y="46" width="${(rate / 100) * 632}" height="22" rx="11" fill="${col}"/>`;
      svg.innerHTML = html;

      chatList.innerHTML = '';
      MEMBERS.forEach(m => {
        const div = document.createElement('div');
        div.className = 'bubble';
        div.style.borderColor = mode === 'pre' ? 'var(--tax-green)' : 'var(--tax-border)';
        div.innerHTML = `<strong style="display:block;margin-bottom:4px;color:${mode === 'pre' ? 'var(--tax-green)' : 'var(--tax-muted)'};">${m.role}</strong>${mode === 'pre' ? m.pre : m.normal}`;
        chatList.appendChild(div);
      });

      ahaBox.innerHTML = mode === 'pre'
        ? '<strong>事前验尸的社交魔力（暴露率 86%）：</strong>它给批评披上了“合法外衣”——团队不再争论“老板对不对”，而是比拼“谁能帮已失败的未来找出最隐蔽的死因”。当提反对意见变成展示专业度的竞赛，群体迷思瞬间瓦解！'
        : '<strong>群体迷思陷阱（暴露率仅 18%）：</strong>当领导已经表达了热情，直接问“有没有问题”会让每个人都觉得自己是在唱反调。点击右侧「事前验尸指令」切换会议机制！';
    }

    document.getElementById('normalBtn').onclick = () => { mode = 'normal'; markDone('对比了传统评审的群体迷思'); render(); };
    document.getElementById('preBtn').onclick = () => { mode = 'pre'; markDone('体验了事前验尸打破群体迷思的心理安全感'); render(); };
    render();
  </script>
</body>
</html>
