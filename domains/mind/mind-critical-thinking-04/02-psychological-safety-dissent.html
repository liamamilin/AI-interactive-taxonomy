<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗣️ 为什么“假设已失败”能打破群体迷思？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🗣️ 为什么“假设已失败”能打破群体迷思？</h1><p>老板满腔热血拍板的项目，你当众泼冷水会显得“不合群”；但事前验尸把“找死因”变成每个人的 KPI，谁找到最致命的坑谁立大功！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>团队权威压迫/一言堂程度</span><span id="vAut">75%</span></label><input type="range" id="sAut" min="10" max="100" value="75" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>采用“匿名独立写死因”机制</span><span id="vAn">85%</span></label><input type="range" id="sAn" min="0" max="100" value="85" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">常规会议说出真话比例</div><div class="k-val" id="kOpn">—</div></div>
        <div class="kpi"><div class="k-lbl">事前验尸挖出真隐患比例</div><div class="k-val" id="kDig">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const aut=+document.getElementById('sAut').value, an=+document.getElementById('sAn').value;
  document.getElementById('vAut').textContent=aut+'%';
  document.getElementById('vAn').textContent=an+'%';
  const opn=Math.max(8, Math.round(88 - aut*0.76));
  const dig=Math.min(96, Math.round(opn + (100-opn)*(an/100)*0.82));
  document.getElementById('kOpn').textContent=opn+'%';
  document.getElementById('kDig').textContent=dig+'%';
  document.getElementById('kDig').style.color='#059669';
  const wO=Math.max(12, opn*3.6), wD=Math.max(12, dig*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">一线员工敢把致命隐患摆上桌面的比例</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">常规当众讨论</text>
    <rect x="145" y="64" width="${wO.toFixed(0)}" height="28" rx="6" fill="#ef4444" opacity="0.8"/>
    <text x="${(153+wO).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#ef4444">${opn}%（怕泼冷水背锅）</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">事前验尸匿名写</text>
    <rect x="145" y="120" width="${wD.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(153+wD).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${dig}%（反对完全合法化）</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">关键细节：必须先各自静默写 5 分钟再亮卡片，避免第一个发言的高管锚定全场！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>事前验尸最绝的地方在于“把唱反调变成政治正确”——给潜伏在团队里的清醒者发了一张免死金牌。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
