<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🩺 事前验尸 vs 乐观计划谬误（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🩺 事前验尸 vs 乐观计划谬误（SVG）</h1><p>心理学家加里·克莱因发明的决策神技：在项目启动前，假定已经快进到一年后且项目彻底惨败，让每个人花 10 分钟独立写下“它是怎么死掉的”——能将找错能力提升 30% 以上！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>团队初始乐观偏误（计划谬误）</span><span id="vOpt">75%</span></label><input type="range" id="sOpt" min="20" max="100" value="75" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>事前验尸覆盖的致命死因比例</span><span id="vCov">70%</span></label><input type="range" id="sCov" min="10" max="95" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">常规启动会项目存活率</div><div class="k-val" id="kNrm">—</div></div>
        <div class="kpi"><div class="k-lbl">事前验尸后项目存活率</div><div class="k-val" id="kPre">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const opt=+document.getElementById('sOpt').value, cov=+document.getElementById('sCov').value;
  document.getElementById('vOpt').textContent=opt+'%';
  document.getElementById('vCov').textContent=cov+'%';
  const nrm=Math.max(15, Math.round(78 - opt*0.52));
  const pre=Math.min(95, Math.round(nrm + (100-nrm)*(cov/100)*0.72));
  document.getElementById('kNrm').textContent=nrm+'%';
  document.getElementById('kPre').textContent=pre+'% (+'+(pre-nrm)+'%)';
  document.getElementById('kPre').style.color='#059669';
  const wN=Math.max(12, nrm*3.6), wP=Math.max(12, pre*3.6);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">开工前把“事后诸葛亮”提前到“事前”的收益对比</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">常规乐观启动会</text>
    <rect x="155" y="64" width="${wN.toFixed(0)}" height="28" rx="6" fill="#94a3b8"/>
    <text x="${(163+wN).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="var(--tax-muted)">${nrm}%</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">执行事前验尸</text>
    <rect x="155" y="120" width="${wP.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(163+wP).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">${pre}%</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">当大脑被强制假设“失败已成既定事实”时，它会自动从“辩护模式”切换到“侦探找死因模式”！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>医学上的验尸只能帮助下一个病人，决策里的“事前验尸”却能在项目还健康时就救活它自己！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
