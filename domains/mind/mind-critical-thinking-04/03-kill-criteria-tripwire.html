<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>给未来埋好“熔断绊线”：防沉没成本</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .wire-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
    .wire-btn {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      text-align: left; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .wire-btn.on { border-color: var(--tax-amber); background: var(--tax-amber-soft); }
    .tag { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--tax-surface); border: 1px solid var(--tax-border); white-space: nowrap; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚡ 给未来埋好“熔断绊线”：防沉没成本（构建器）</h1>
      <p>一旦项目投了 200 万，人就会被沉没成本绑架不断“再加一点预算试试”。在开工前最清醒的时刻，亲手埋下量化的<strong>熔断绊线（Kill Criteria）</strong>，然后模拟一场 6 个月的市场遇冷危机，看能保住多少真金白银！</p>
    </header>

    <section class="toy-card">
      <div class="wire-grid" id="wireGrid"></div>

      <div style="margin-bottom:12px;">
        <button class="toy-btn" id="simBtn">📉 模拟运行 6 个月（遭遇伪需求遇冷）</button>
      </div>

      <svg id="lossSvg" viewBox="0 0 680 155" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="熔断绊线止损对比"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>构建挑战：</strong>如果不提前写死量化止损线，项目往往会一路烧光全部 300 万预算！勾选上方 1–3 道事前熔断绊线，再点击「模拟运行 6 个月」验证止损威力！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const WIRES = [
      { id: 'w1', title: '📊 绊线 1 · 留存红线（第 2 个月触发）', sub: '“若上线 60 天次周留存率 < 15%，立即停止买量并复盘转型”', stopMonth: 2, on: false },
      { id: 'w2', title: '💸 绊线 2 · 预算红线（第 3 个月触发）', sub: '“若累计烧钱达 120 万仍无付费验证，自动冻结后续 180 万拨款”', stopMonth: 3, on: false },
      { id: 'w3', title: '📅 绊线 3 · 时间红线（第 4 个月触发）', sub: '“若第 4 个月仍未签下 3 家种子付费客户，直接体面关停项目”', stopMonth: 4, on: false }
    ];

    let simulated = false;
    let done = false;

    const wireGrid = document.getElementById('wireGrid');
    const svg = document.getElementById('lossSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      wireGrid.innerHTML = '';
      WIRES.forEach(w => {
        const b = document.createElement('button');
        b.className = 'wire-btn' + (w.on ? ' on' : '');
        b.innerHTML = `<div><div style="font-weight:700;font-size:13.5px;">${w.title}</div><div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">${w.sub}</div></div><span class="tag">${w.on ? '⚡ 已埋设' : '未启用'}</span>`;
        b.onclick = () => {
          w.on = !w.on;
          simulated = false;
          markDone('配置了事前熔断绊线');
          render();
        };
        wireGrid.appendChild(b);
      });

      const activeWires = WIRES.filter(w => w.on);
      const stopM = activeWires.length ? Math.min(...activeWires.map(w => w.stopMonth)) : 6;
      const burned = stopM * 50; // 50万 / 月, total 300万
      const saved = 300 - burned;

      let html = '';
      html += `<text x="24" y="32" fill="var(--tax-ink)" font-size="13.5" font-weight="800">${simulated ? `📉 模拟结果：在第 ${stopM} 个月停止失血 · 实际亏损 ${burned} 万 · 成功抢救回 ${saved} 万！` : '已埋设 ' + activeWires.length + ' / 3 道事前熔断绊线（总预算池：300 万，月烧 50 万）'}</text>`;

      // Bar representing 300万
      const barW = 632;
      const burnW = (burned / 300) * barW;
      html += `<rect x="24" y="50" width="${burnW}" height="32" rx="8" fill="rgba(239,68,68,0.75)"/>`;
      if (saved > 0) {
        html += `<rect x="${24 + burnW}" y="50" width="${barW - burnW}" height="32" rx="8" fill="rgba(16,185,129,0.80)"/>`;
        html += `<text x="${24 + burnW + (barW - burnW)/2}" y="71" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">抢救回 ${saved} 万弹药</text>`;
      }
      html += `<text x="${24 + burnW/2}" y="71" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">沉没消耗 ${burned} 万</text>`;

      // Month ticks
      for (let m = 1; m <= 6; m++) {
        const x = 24 + (m / 6) * barW;
        html += `<text x="${x - 10}" y="102" text-anchor="end" fill="var(--tax-muted)" font-size="11">M${m}</text>`;
      }

      html += `<text x="24" y="132" fill="var(--tax-muted)" font-size="12">${simulated ? (saved > 0 ? '⚡ 熔断成功！事前白纸黑字的客观指标替你战胜了“不甘心再赌一把”的人性弱点！' : '💥 无熔断线保护：每次开会都觉得“再熬一个月就成了”，最终 300 万全部清零！') : '点击「模拟运行 6 个月」测试你埋下的熔断绊线。'}</text>`;
      svg.innerHTML = html;

      if (simulated) {
        ahaBox.innerHTML = saved > 0
          ? `<strong>止损抢救回 ${saved} 万（留住 ${Math.round((saved / 300) * 100)}% 弹药）！</strong>心理学家 Annie Duke 称熔断绊线为“写给未来深陷泥潭的自己的一封清醒遗书”。把放弃标准提前量化写死，让你在项目遇冷时能果断转身、体面止损！`
          : '<strong>全军覆没（亏损 300 万）：</strong>没有提前定好退出条件时，沉没成本谬误会让你不断给失败项目续命。赶紧勾选 1–2 道量化熔断绊线再模拟一次！';
      }
    }

    document.getElementById('simBtn').onclick = () => {
      simulated = true;
      markDone('模拟了熔断绊线在沉没成本危机中的止损效果');
      render();
    };
    render();
  </script>
</body>
</html>
