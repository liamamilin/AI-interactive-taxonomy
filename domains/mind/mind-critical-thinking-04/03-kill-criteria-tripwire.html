<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ 给未来埋好“熔断绊线”：防沉没成本</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚡ 给未来埋好“熔断绊线”：防沉没成本</h1><p>事前验尸的最后一步，是把最致命的 2 个死因写成白纸黑字的“止损熔断线”（例如：3 个月留存低于 15% 自动关停），防止日后深陷沉没成本泥潭！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>事前熔断止损线（触发月数）</span><span id="vCut">第 3 个月</span></label><input type="range" id="sCut" min="2" max="12" value="3" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>项目每月烧钱速度</span><span id="vBrn">20 万/月</span></label><input type="range" id="sBrn" min="5" max="50" step="5" value="20" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">触发熔断实际止损额</div><div class="k-val" id="kCut">—</div></div>
        <div class="kpi"><div class="k-lbl">相比死扛 12 月节省资金</div><div class="k-val" id="kSav">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const cut=+document.getElementById('sCut').value, brn=+document.getElementById('sBrn').value;
  document.getElementById('vCut').textContent='第 '+cut+' 个月';
  document.getElementById('vBrn').textContent=brn+' 万/月';
  const full=12*brn;
  const act=cut*brn;
  const sav=full - act;
  document.getElementById('kCut').textContent='-'+act+' 万';
  document.getElementById('kSav').textContent='省下 '+sav+' 万';
  document.getElementById('kSav').style.color='#059669';
  const sc=265/Math.max(1, full);
  const wF=Math.max(15, full*sc), wA=Math.max(15, act*sc);
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">项目不达标时：无熔断死扛 12 月 vs 预设第 ${cut} 月自动止损</text>
    <text x="20" y="82" font-size="12.5" font-weight="750" fill="var(--tax-text)">无绊线死扛到底</text>
    <rect x="155" y="64" width="${wF.toFixed(0)}" height="28" rx="6" fill="#ef4444"/>
    <text x="${(163+wF).toFixed(0)}" y="83" font-size="12" font-weight="800" fill="#ef4444">亏 ${full} 万</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">触发事前熔断线</text>
    <rect x="155" y="120" width="${wA.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(163+wA).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="#059669">亏 ${act} 万（保住 ${sav} 万）</text>
    <text x="20" y="180" font-size="11.5" fill="var(--tax-muted)">在还没投入感情的 Day 0 写下量化止损红线，就能在未来陷入当局者迷时自动救自己一命！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>事前验尸 + 事前熔断线 = 给团队和个人装上飞机黑匣子 + 自动弹射座椅。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
