<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍵 感冒偏方为何总显得“吃一次就好”？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🍵 感冒偏方为何总显得“吃一次就好”？</h1>
        <p>误区：我感冒第 3 天难受到极点，喝了一碗神秘偏方，第 4 天立刻大幅好转，所以偏方有奇效！真相：普通感冒是 7 天自限性疾病，你偏偏在<strong>症状山顶</strong>才喝偏方——把“只喝白开水”的对照组叠上去，两条线竟然 100% 重合！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="toggleControl()">👁️ 叠加上帝视角对照组：只喝温白开水</button>
        <button class="pill active" onclick="setTakeDay(3,this)">🤒 第 3 天最难受时喝偏方</button>
        <button class="pill" onclick="setTakeDay(1,this)">🤧 第 1 天刚流鼻涕就喝</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 220"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">喝偏方次日症状变化</div><div class="k-val" id="kNext">—</div></div>
        <div class="kpi"><div class="k-lbl">白开水对照组次日变化</div><div class="k-val" id="kCtrl" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">偏方真实净功劳</div><div class="k-val" style="color:var(--tax-red);">0%（完全重合）</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let takeDay = 3, showCtrl = false;
    const SYM = [15, 48, 82, 95, 62, 34, 16, 5]; // Day 0..7 natural cold curve

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setTakeDay(d, btn){
      takeDay = d;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function toggleControl(){ showCtrl = !showCtrl; markDone(); draw(); }

    function draw(){
      const x0=54, x1=612, yMin=28, yMax=188;
      const toX = d => x0 + (d/7)*(x1-x0);
      const toY = v => yMax - (v/105)*(yMax-yMin);

      const pts = SYM.map((v,i)=>`${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');
      const diff = SYM[takeDay+1] - SYM[takeDay];

      document.getElementById('svg').innerHTML = `
        ${[0,1,2,3,4,5,6,7].map(d=>`<text x="${toX(d)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">第${d}天</text>`).join('')}
        ${showCtrl ? `<polyline points="${pts}" fill="none" stroke="var(--tax-primary)" stroke-width="8" opacity="0.35" stroke-linecap="round"/>` : ''}
        <polyline points="${pts}" fill="none" stroke="var(--tax-amber)" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="${toX(takeDay)}" cy="${toY(SYM[takeDay])}" r="7" fill="var(--tax-red)"/>
        <text x="${toX(takeDay)}" y="${toY(SYM[takeDay])-12}" text-anchor="middle" font-size="11.5" font-weight="900" fill="var(--tax-red)">🍵 第${takeDay}天喝偏方</text>
        <circle cx="${toX(takeDay+1)}" cy="${toY(SYM[takeDay+1])}" r="6" fill="${diff<0?'var(--tax-green)':'var(--tax-red)'}"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-amber)">● 喝偏方后的病程轨迹 ${showCtrl?'（粗蓝线 = 只喝白开水对照组：100% 重合！）':''}</text>
      `;

      const kN = document.getElementById('kNext');
      kN.textContent = diff < 0 ? `暴降 ${diff} 分（显灵错觉!）` : `反而加重 +${diff} 分!`;
      kN.style.color = diff < 0 ? 'var(--tax-green)' : 'var(--tax-red)';
      document.getElementById('kCtrl').textContent = showCtrl ? `${diff >= 0 ? '+' : ''}${diff} 分（一模一样）` : '点击上方蓝色按钮叠加对比';

      document.getElementById('ahaBox').innerHTML = takeDay === 3
        ? `💡 <strong>顿悟时刻：</strong>第 3 天正好是普通感冒的<strong>症状最高峰（95 分）</strong>！你在这天喝偏方，第 4 天免疫系统本来就会把症状打到 62 分（-33 分），结果大脑把免疫系统的功劳全记在了偏方头上——<strong>“发生在其后 ≠ 由其导致”！</strong>`
        : `💡 <strong>顿悟时刻：</strong>如果你在第 1 天刚流鼻涕就喝同一碗偏方，第 2 天症状照样冲上 82 分，你会立刻大骂这偏方没用！同一碗零效偏方，<strong>仅仅因为你习惯拖到最难受那天再喝，就成了“神药”！</strong>`;
    }

    draw();
  </script>
</body>
</html>
