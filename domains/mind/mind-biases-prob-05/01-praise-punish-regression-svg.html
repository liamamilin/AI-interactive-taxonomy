<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈️ 飞行教官错觉：骂完进步的数学真相</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>✈️ 飞行教官错觉：骂完进步的数学真相</h1>
        <p>卡尼曼最震撼的真实经历：空军教官坚信“表扬害人、痛骂管用”，因为每次夸完飞得极好的学员，下次准飞差；痛骂飞得极烂的学员，下次准进步！真相：<strong>赏罚对下一次成绩的设定效应 = 0</strong>，全都是纯统计学的<strong>回归均值</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="simBatch()">🎲 随机模拟 24 名飞行员两次着陆（设定：夸奖与痛骂效果 = 0！）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">👏 被表扬组（第1次高分）下次变化</div><div class="k-val" id="kPraise" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">🤬 被痛骂组（第1次低分）下次变化</div><div class="k-val" id="kScold" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">教官产生的错误因果结论</div><div class="k-val" style="color:var(--tax-amber);font-size:15px;">“果然骂人比夸人管用！”</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let runs = 0;
    let pilots = [];

    function randn(){ return (Math.random()+Math.random()+Math.random()-1.5)*2; }
    function genData(){
      pilots = [];
      for(let i=0; i<24; i++){
        const trueSkill = 70 + randn() * 6;
        const s1 = Math.max(35, Math.min(99, Math.round(trueSkill + randn() * 14)));
        const s2 = Math.max(35, Math.min(99, Math.round(trueSkill + randn() * 14)));
        pilots.push({ s1, s2 });
      }
    }
    function simBatch(){
      runs++;
      genData();
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const praised = pilots.filter(p => p.s1 >= 82);
      const scolded = pilots.filter(p => p.s1 <= 58);
      const avgP = praised.length ? Math.round(praised.reduce((s,p)=>s+(p.s2-p.s1),0)/praised.length) : -14;
      const avgS = scolded.length ? Math.round(scolded.reduce((s,p)=>s+(p.s2-p.s1),0)/scolded.length) : +14;

      const x1 = 150, x2 = 490, yMin = 30, yMax = 188;
      const toY = v => yMax - ((v - 30)/72)*(yMax - yMin);

      let lines = '';
      pilots.forEach(p => {
        const isP = p.s1 >= 82, isS = p.s1 <= 58;
        const col = isP ? 'var(--tax-red)' : (isS ? 'var(--tax-green)' : 'var(--tax-border)');
        const op = (isP || isS) ? 0.85 : 0.35;
        lines += `<line x1="${x1}" y1="${toY(p.s1).toFixed(1)}" x2="${x2}" y2="${toY(p.s2).toFixed(1)}" stroke="${col}" stroke-width="${isP||isS?2.4:1.2}" opacity="${op}"/>
                  <circle cx="${x1}" cy="${toY(p.s1).toFixed(1)}" r="4" fill="${col}" opacity="${op}"/>
                  <circle cx="${x2}" cy="${toY(p.s2).toFixed(1)}" r="4" fill="${col}" opacity="${op}"/>`;
      });

      document.getElementById('svg').innerHTML = `
        <line x1="60" y1="${toY(70)}" x2="580" y2="${toY(70)}" stroke="var(--tax-primary)" stroke-dasharray="5 4"/>
        <text x="580" y="${toY(70)-6}" text-anchor="end" font-size="10.5" font-weight="800" fill="var(--tax-primary)">真实平均实力线 (70分)</text>
        ${lines}
        <text x="${x1}" y="206" text-anchor="middle" font-size="12" font-weight="850" fill="var(--tax-ink)">第 1 次着陆成绩</text>
        <text x="${x2}" y="206" text-anchor="middle" font-size="12" font-weight="850" fill="var(--tax-ink)">第 2 次着陆成绩（零干预）</text>
        <text x="320" y="18" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-muted)">🔴 红线 = 第1次超常发挥被夸（几乎全回落） · 🟢 绿线 = 第1次失常被骂（几乎全反弹）</text>
      `;

      document.getElementById('kPraise').textContent = `${avgP >= 0 ? '+' : ''}${avgP} 分（普遍退步!）`;
      document.getElementById('kScold').textContent = `${avgS >= 0 ? '+' : ''}${avgS} 分（普遍进步!）`;

      document.getElementById('ahaBox').innerHTML = `💡 <strong>顿悟时刻：</strong>在这个纯随机模拟器里，<strong>夸奖和痛骂的代码效果严格为 0</strong>，但你每点一次“重新模拟”，绿线（被骂组）都稳稳反弹 <strong>+${Math.abs(avgS)} 分</strong>，红线（被夸组）都稳稳回落 <strong>${avgP} 分</strong>！无数老板、老师和家长就是这样被统计学骗了一辈子，误以为“严厉批评最有效”！`;
    }

    genData();
    draw();
  </script>
</body>
</html>
