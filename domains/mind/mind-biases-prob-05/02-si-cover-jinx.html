<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏆 体育画报封面魔咒：巅峰后的必然回调</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🏆 体育画报封面魔咒：巅峰后的必然回调</h1>
        <p>误区：运动员一登上《体育画报》封面，或者基金经理刚拿完“年度冠军”，下一年业绩准暴跌，肯定是“被毒奶诅咒了”或“飘了”。真相：任何年度第 1 名几乎都是<strong>“高实力 + 爆表运气”</strong>的极值产物——下一年实力没变，运气自然回归平均罢了！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="rollSeason()">🎲 模拟新一年冠军与次年回调</button>
        <button class="pill active" onclick="setLuck('high',this)">🎰 高运气波动领域（股票基金/高尔夫）</button>
        <button class="pill" onclick="setLuck('low',this)">♟️ 纯实力主导领域（国际象棋/举重）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">年度冠军上封面成绩</div><div class="k-val" id="kY1" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">其中真实实力 vs 运气成分</div><div class="k-val" id="kSplit" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">次年成绩变化（所谓魔咒）</div><div class="k-val" id="kY2">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let luckMode = 'high';
    let champ = { skill:82, luck1:16, luck2:-1 };

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setLuck(m, btn){
      luckMode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); rollSeason();
    }
    function rollSeason(){
      const amp = luckMode === 'high' ? 18 : 4;
      let best = { total:-999 };
      for(let i=0; i<30; i++){
        const sk = 68 + Math.round(Math.random() * 16);
        const l1 = Math.round((Math.random()*2 - 1) * amp);
        const l2 = Math.round((Math.random()*2 - 1) * amp);
        if(sk + l1 > best.total) best = { skill:sk, luck1:l1, luck2:l2, total:sk+l1 };
      }
      champ = best;
      markDone(); draw();
    }

    function draw(){
      const y1 = champ.skill + champ.luck1;
      const y2 = champ.skill + champ.luck2;
      const diff = y2 - y1;
      const scale = 4.6;

      document.getElementById('svg').innerHTML = `
        <text x="24" y="30" font-size="13" font-weight="850" fill="var(--tax-ink)">第 1 年：登顶封面冠军（总分 ${y1} = 实力 ${champ.skill} + 爆表好运 ${champ.luck1>=0?'+':''}${champ.luck1}）</text>
        <rect x="24" y="42" width="${champ.skill*scale}" height="32" rx="6" fill="var(--tax-primary)"/>
        <text x="${24+champ.skill*scale/2}" y="63" text-anchor="middle" font-size="11.5" font-weight="850" fill="#fff">真实实力 ${champ.skill}</text>
        ${champ.luck1 > 0 ? `<rect x="${24+champ.skill*scale+3}" y="42" width="${champ.luck1*scale}" height="32" rx="6" fill="var(--tax-amber)"/><text x="${24+champ.skill*scale+3+champ.luck1*scale/2}" y="63" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">+${champ.luck1}</text>` : ''}

        <line x1="24" y1="98" x2="616" y2="98" stroke="var(--tax-border)" stroke-dasharray="4 4"/>

        <text x="24" y="126" font-size="13" font-weight="850" fill="${diff<0?'var(--tax-red)':'var(--tax-green)'}">第 2 年：次年实绩（总分 ${y2} = 同一实力 ${champ.skill} + 回归普通运气 ${champ.luck2>=0?'+':''}${champ.luck2}）</text>
        <rect x="24" y="138" width="${champ.skill*scale}" height="32" rx="6" fill="var(--tax-primary)"/>
        <text x="${24+champ.skill*scale/2}" y="159" text-anchor="middle" font-size="11.5" font-weight="850" fill="#fff">实力丝毫没退步 (${champ.skill})</text>
        ${champ.luck2 > 0 ? `<rect x="${24+champ.skill*scale+3}" y="138" width="${champ.luck2*scale}" height="32" rx="6" fill="var(--tax-green)"/>` : ''}
        <text x="24" y="192" font-size="11.5" font-weight="750" fill="var(--tax-muted)">规律：运气占比越高的行业（如买去年冠军主动基金），“封面魔咒”就越灵验！</text>
      `;

      document.getElementById('kY1').textContent = y1 + ' 分 🏆';
      document.getElementById('kSplit').textContent = `实力 ${champ.skill} + 运气 ${champ.luck1>=0?'+':''}${champ.luck1}`;
      const k2 = document.getElementById('kY2');
      k2.textContent = `${y2} 分 (${diff>=0?'+':''}${diff})`;
      k2.style.color = diff < -4 ? 'var(--tax-red)' : 'var(--tax-green)';

      document.getElementById('ahaBox').innerHTML = luckMode === 'high'
        ? `💡 <strong>顿悟时刻：</strong>在高运气波动领域，冠军的真实实力一点没退步（稳在 ${champ.skill}），但第 1 年撞上的 <strong>+${champ.luck1} 分好运</strong>很难连中两年，所以第 2 年大概率掉回 <strong>${y2} 分</strong>——这就是为什么理财界常说“买去年第一名的冠军基金最容易亏钱”！`
        : `💡 <strong>顿悟时刻：</strong>在国际象棋、举重这类<strong>纯实力主导、运气极小</strong>的领域里，封面魔咒几乎彻底消失（次年变动仅 ${diff} 分）——<strong>魔咒有多灵，只取决于这行运气成分有多大！</strong>`;
    }

    rollSeason();
  </script>
</body>
</html>
