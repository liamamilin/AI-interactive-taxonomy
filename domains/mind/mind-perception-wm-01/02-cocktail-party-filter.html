<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍸 鸡尾酒会效应：双耳分听过滤器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🍸 鸡尾酒会效应：双耳分听过滤器</h1>
        <p>误区：嘈杂派对里我专心跟面前的人聊天，旁边桌说话我是一个字也没听见。真相：特雷斯曼“衰减过滤模型”证明，大脑并没有把背景音彻底关机，而是把音量调小在后台监听——一旦远方有人提到<strong>你的名字</strong>，它立刻击穿防线冲进意识！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setBg('noise',this)">🗣️ 背景通道：陌生人聊天气（被衰减拦截）</button>
        <button class="pill" onclick="setBg('name',this)">⚡ 背景通道：突然有人喊“你的名字”！（击穿拦截）</button>
        <button class="pill" onclick="setBg('danger',this)">🔥 背景通道：有人喊“着火了！”（最高级唤醒）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let bg = 'noise';
    function setBg(b, btn){
      bg = b;
      document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const pass = bg !== 'noise';
      const bgTxt = bg === 'noise' ? '“今天天气不错…”' : (bg === 'name' ? '“喂，刚才看到[你的名字]…”' : '“不好了，厨房着火了！”');
      const bgCol = pass ? 'var(--tax-red)' : 'var(--tax-muted)';

      document.getElementById('svg').innerHTML = `
        <rect x="20" y="28" width="176" height="58" rx="12" fill="var(--tax-green-soft)" stroke="var(--tax-green)" stroke-width="2"/>
        <text x="108" y="52" text-anchor="middle" font-size="12.5" font-weight="850" fill="var(--tax-green)">🎯 聚焦通道（面前好友）</text>
        <text x="108" y="72" text-anchor="middle" font-size="11" fill="var(--tax-ink)">音量 100% 畅通无阻</text>

        <rect x="20" y="114" width="176" height="58" rx="12" fill="${pass?'var(--tax-red-soft)':'var(--tax-surface-alt)'}" stroke="${bgCol}" stroke-width="2"/>
        <text x="108" y="138" text-anchor="middle" font-size="12.5" font-weight="850" fill="${bgCol}">🔊 非注意背景通道</text>
        <text x="108" y="158" text-anchor="middle" font-size="11" fill="var(--tax-ink)">${bgTxt}</text>

        <line x1="196" y1="57" x2="264" y2="96" stroke="var(--tax-green)" stroke-width="3.5"/>
        <line x1="196" y1="143" x2="264" y2="108" stroke="${bgCol}" stroke-width="${pass?3.5:1.6}" stroke-dasharray="${pass?'0':'5 4'}"/>

        <rect x="266" y="46" width="124" height="110" rx="14" fill="var(--tax-primary-soft)" stroke="var(--tax-primary)" stroke-width="2.2"/>
        <text x="328" y="84" text-anchor="middle" font-size="13" font-weight="900" fill="var(--tax-primary)">🎛️ 衰减过滤器</text>
        <text x="328" y="108" text-anchor="middle" font-size="11" fill="var(--tax-ink)">背景音压低 -80%</text>
        <text x="328" y="130" text-anchor="middle" font-size="10.5" font-weight="800" fill="${pass?'var(--tax-red)':'var(--tax-muted)'}">${pass?'⚡ 低阈值词击穿!':'普通词被静音'}</text>

        <line x1="390" y1="101" x2="442" y2="101" stroke="${pass?'var(--tax-red)':'var(--tax-green)'}" stroke-width="3.5"/>

        <rect x="444" y="42" width="174" height="118" rx="14" fill="${pass?'var(--tax-amber-soft)':'var(--tax-green-soft)'}" stroke="${pass?'var(--tax-amber)':'var(--tax-green)'}" stroke-width="2.2"/>
        <text x="531" y="76" text-anchor="middle" font-size="24">${pass?'😲':'😌'}</text>
        <text x="531" y="106" text-anchor="middle" font-size="13.5" font-weight="900" fill="${pass?'var(--tax-amber)':'var(--tax-green)'}">${pass?'瞬间转头惊醒！':'专注聊天不受扰'}</text>
        <text x="531" y="132" text-anchor="middle" font-size="11" fill="var(--tax-ink)">${pass?'注意聚光灯被瞬间劫持':'后台仅作微弱监听'}</text>
      `;

      document.getElementById('ahaBox').innerHTML = pass
        ? `💡 <strong>顿悟时刻：</strong>你的名字和危险词在大脑词典里拥有极低的<strong>“激活阈值”</strong>！即便背景音已经被衰减器压低了 80%，它们依然足以拉响意识警报——这就是“鸡尾酒会效应”，也是为什么开会走神时一听领导念自己名字立刻回魂！`
        : `💡 <strong>顿悟时刻：</strong>注意过滤器不是“非黑即白的硬断电”，而是<strong>调音台式的衰减器</strong>！普通闲聊被压成白噪音，但你依然在潜意识里扫描关键词——点击上方试试有人突然喊你名字！`;
    }

    draw();
  </script>
</body>
</html>
