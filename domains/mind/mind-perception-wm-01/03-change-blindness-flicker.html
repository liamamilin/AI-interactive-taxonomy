<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👁️ 变化盲视：一次眨眼如何抹掉剧变？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>👁️ 变化盲视：一次眨眼如何抹掉剧变？</h1><p>只要在两张图之间插入不到 0.1 秒的空白闪烁（或眨眼、扫视），哪怕画面里整栋大楼消失，大脑也要花几十秒才能发现。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>画面间空白中断时长</span><span id="vGap">120 ms</span></label><input type="range" id="sGap" min="0" max="400" step="20" value="120" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>场景视觉元素数量</span><span id="vObj">18 个</span></label><input type="range" id="sObj" min="4" max="36" value="18" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">瞬时运动信号保留</div><div class="k-val" id="kMot">—</div></div>
        <div class="kpi"><div class="k-lbl">发现变化平均耗时</div><div class="k-val" id="kSec">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const gap=+document.getElementById('sGap').value, obj=+document.getElementById('sObj').value;
  document.getElementById('vGap').textContent=gap+' ms';
  document.getElementById('vObj').textContent=obj+' 个';
  const hasGap=gap>=60;
  const sec=hasGap ? (1.2 + obj*0.42 + gap*0.015).toFixed(1) : (0.3 + obj*0.02).toFixed(1);
  document.getElementById('kMot').textContent=hasGap?'❌ 被全局闪烁淹没':'✅ 局部突变直接触发';
  document.getElementById('kMot').style.color=hasGap?'#ef4444':'#059669';
  document.getElementById('kSec').textContent=sec+' 秒';
  const barNoGap=Math.max(8, Math.min(340, (0.3+obj*0.02)*16));
  const barGap=Math.max(8, Math.min(340, parseFloat(sec)*16));
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">发现显著变化所需时间对比（场景含 ${obj} 个物体）</text>
    <text x="20" y="80" font-size="12.5" font-weight="750" fill="var(--tax-text)">无中断直接切换</text>
    <rect x="160" y="62" width="${barNoGap.toFixed(0)}" height="28" rx="6" fill="#059669"/>
    <text x="${(168+barNoGap).toFixed(0)}" y="81" font-size="12" font-weight="800" fill="#059669">${(0.3+obj*0.02).toFixed(1)}s</text>
    <text x="20" y="138" font-size="12.5" font-weight="750" fill="var(--tax-text)">插入 ${gap}ms 闪烁</text>
    <rect x="160" y="120" width="${barGap.toFixed(0)}" height="28" rx="6" fill="${hasGap?'#ef4444':'#3b82f6'}"/>
    <text x="${(168+barGap).toFixed(0)}" y="139" font-size="12" font-weight="800" fill="${hasGap?'#ef4444':'#3b82f6'}">${sec}s</text>
    <text x="20" y="182" font-size="11.5" fill="var(--tax-muted)">${hasGap?'由于空白中断覆盖了局部运动信号，大脑被迫退化为“逐个物体慢速扫描”！':'无中断时，变化瞬间的局部亮度跃变会自动拉住注意力。'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>我们以为脑子里存了一张完整高清照片，其实大脑只存了稀疏的“语义草图”。只要打断瞬时运动信号，我们对未聚焦区域的变化几乎是瞎的。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
