<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👁️ 变化盲视：一次眨眼如何抹掉剧变？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>👁️ 变化盲视：一次眨眼如何抹掉剧变？</h1>
        <p>心理学震撼实验：两张街景图之间有一处<strong>非常巨大的变化</strong>！如果没有间隔直接切换，你 0.1 秒就能看到闪动；可一旦在中间插入 <strong>250 毫秒的短暂空白（模拟眨眼/转头）</strong>，很多人盯 15 秒都找不出来！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setMode('flicker',this)">⚡ 开启 250ms 眨眼闪烁（难找！）</button>
        <button class="pill" onclick="setMode('direct',this)">👁️ 关闭闪烁直接切换（0.1秒秒看！）</button>
        <button class="tax-btn" style="padding:7px 14px;font-size:12.5px;" onclick="toggleHint()">🔍 高亮揭晓变化处</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let mode = 'flicker', showHint = false, frame = 0, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setMode(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); startLoop();
    }
    function toggleHint(){ showHint = !showHint; markDone(); draw(); }

    function startLoop(){
      if(timer) clearInterval(timer);
      frame = 0;
      timer = setInterval(()=>{
        frame = (frame + 1) % (mode === 'flicker' ? 4 : 2);
        draw();
      }, mode === 'flicker' ? 320 : 520);
      draw();
    }

    function draw(){
      const isBlank = mode === 'flicker' && (frame === 1 || frame === 3);
      const isAlt = (mode === 'flicker' && frame === 2) || (mode === 'direct' && frame === 1);

      if(isBlank){
        document.getElementById('svg').innerHTML = `<rect x="0" y="0" width="640" height="205" fill="var(--tax-surface-alt)"/><text x="320" y="108" text-anchor="middle" font-size="13" font-weight="800" fill="var(--tax-muted)">（250ms 短暂眨眼/视线遮挡空白）</text>`;
        return;
      }

      // Scene with subtle-but-huge change: the middle tower window/roof disappears or engine bar shifts
      document.getElementById('svg').innerHTML = `
        <rect x="20" y="20" width="600" height="165" rx="12" fill="var(--tax-primary-soft)" opacity="0.35"/>
        <circle cx="96" cy="56" r="20" fill="var(--tax-amber)"/>
        <rect x="64" y="110" width="76" height="75" rx="4" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>
        <rect x="160" y="72" width="88" height="113" rx="4" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>
        <rect x="272" y="92" width="96" height="93" rx="4" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>
        ${!isAlt ? `<rect x="298" y="48" width="44" height="44" rx="6" fill="var(--tax-primary)" opacity="0.85"/>` : ''}
        ${showHint ? `<circle cx="320" cy="70" r="34" fill="none" stroke="var(--tax-red)" stroke-width="3" stroke-dasharray="5 4"/><text x="320" y="34" text-anchor="middle" font-size="11.5" font-weight="900" fill="var(--tax-red)">👇 中央蓝楼顶在不断消失/出现！</text>` : ''}
        <rect x="392" y="64" width="82" height="121" rx="4" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>
        <rect x="494" y="102" width="92" height="83" rx="4" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>
        <circle cx="195" cy="145" r="14" fill="var(--tax-green)"/>
        <circle cx="430" cy="145" r="14" fill="var(--tax-green)"/>
        <text x="32" y="198" font-size="11.5" font-weight="800" fill="var(--tax-muted)">当前模式：${mode==='flicker'?'⚡ 带眨眼空白闪烁（打断视觉运动检测器）':'👁️ 无闪烁直接切换（局部运动瞬间抓眼！）'}</text>
      `;

      document.getElementById('ahaBox').innerHTML = mode === 'direct'
        ? `💡 <strong>顿悟时刻：</strong>撤掉中间的空白闪烁后，中央那块蓝色楼顶的跳动简直显眼到 0.1 秒就被眼角余光抓到！因为连续画面激活了大脑低级的<strong>局部瞬态运动检测器</strong>！`
        : `💡 <strong>顿悟时刻：</strong>仅仅插入一次 250ms 的眨眼空白，就把视觉运动检测器彻底清空重启了——由于大脑根本不会把整张画面的像素全存进记忆，只要没把注意力精准扫到那块楼顶，它就能在你眼皮底下反复消失！`;
    }

    startLoop();
  </script>
</body>
</html>
