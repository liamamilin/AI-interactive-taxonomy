<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 处置效应：为何散户总爱卖盈留亏？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .choice-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-bottom:14px; }
    .stk { padding:14px; border-radius:12px; border:1.8px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .stk.win:hover, .stk.win.sel { border-color:var(--tax-green); background:var(--tax-green-soft); }
    .stk.lose:hover, .stk.lose.sel { border-color:var(--tax-red); background:var(--tax-red-soft); }
    .stk .t { font-size:14px; font-weight:900; }
    .stk .s { font-size:12px; color:var(--tax-muted); margin-top:4px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📊 处置效应：为何散户总爱卖盈留亏？</h1>
        <p>股市经典魔咒：明明书里都写着“截断亏损、让利润奔跑”，但 80% 的散户实盘操作却刚好相反——<strong>一赚 10% 就慌忙落袋为安，一亏 30% 却装死死扛绝不割肉</strong>！来体验一次真实交易抉择！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13.5px;font-weight:850;margin-bottom:10px;color:var(--tax-ink);">💼 情景：你手里有两只股票，今天急需用钱必须卖掉其中 1 只，你会卖哪只？</div>
      <div class="choice-grid">
        <button class="stk win" id="bWin" onclick="pick('win')">
          <div class="t" style="color:var(--tax-green);">📈 股票 A：当前浮盈 +22%</div>
          <div class="s">基本面强劲、业绩持续超预期。卖掉它立刻锁定实实在在的盈利！</div>
        </button>
        <button class="stk lose" id="bLose" onclick="pick('lose')">
          <div class="t" style="color:var(--tax-red);">📉 股票 B：当前浮亏 -28%</div>
          <div class="s">行业下行、业绩连亏两季。卖掉它等于立刻把“账面浮亏”变成“永久真亏”！</div>
        </button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 195"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let choice = null;
    function pick(c){
      choice = c;
      document.getElementById('bWin').classList.toggle('sel', c==='win');
      document.getElementById('bLose').classList.toggle('sel', c==='lose');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      if(!choice){
        document.getElementById('svg').innerHTML = `
          <rect x="36" y="30" width="568" height="135" rx="14" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-dasharray="6 4"/>
          <text x="320" y="92" text-anchor="middle" font-size="16" font-weight="900" fill="var(--tax-primary)">💼 点击上方选择你要卖出的股票！</text>
          <text x="320" y="122" text-anchor="middle" font-size="12.5" fill="var(--tax-muted)">选完立刻对比「真实散户行为数据」与「一年后账户净值结局」</text>
        `;
        document.getElementById('ahaBox').innerHTML = `💡 <strong>实验提示：</strong>别想教科书答案，诚实感受一下你更怕“到手的盈利飞了”，还是更怕“亲手点下割肉按钮承认亏钱”？`;
        return;
      }

      const soldWin = choice === 'win';
      document.getElementById('svg').innerHTML = `
        <text x="24" y="28" font-size="13" font-weight="850" fill="var(--tax-ink)">真实股市大数据统计（Odean 1998 追踪 1 万个散户账户）：</text>
        <text x="24" y="64" font-size="12.5" font-weight="800" fill="var(--tax-red)">卖出盈利股的概率是卖出亏损股的 1.5 倍（78% 散户选择卖 A 留 B！）</text>
        <rect x="24" y="76" width="440" height="24" rx="6" fill="var(--tax-red-soft)" stroke="var(--tax-red)"/>
        <rect x="24" y="76" width="343" height="24" rx="6" fill="var(--tax-red)"/>
        <text x="376" y="93" font-size="12" font-weight="900" fill="var(--tax-red)">78% 卖盈留亏</text>

        <rect x="24" y="118" width="592" height="62" rx="12" fill="${soldWin?'var(--tax-amber-soft)':'var(--tax-green-soft)'}" stroke="${soldWin?'var(--tax-amber)':'var(--tax-green)'}" stroke-width="2"/>
        <text x="320" y="144" text-anchor="middle" font-size="13.5" font-weight="900" fill="${soldWin?'var(--tax-amber)':'var(--tax-green)'}">
          ${soldWin ? '⚠️ 你触发了经典「处置效应」：拔掉了鲜花，却留了一花园杂草！' : '🏆 罕见的反人性自律！截断亏损的烂股，把资金留给基本面强劲的赢家！'}
        </text>
        <text x="320" y="166" text-anchor="middle" font-size="11.5" fill="var(--tax-muted)">
          前景理论解释：盈利区人类极度求稳（怕煮熟的鸭子飞了），亏损区人类瞬间变赌徒（只要不卖就不算真亏！）
        </text>
      `;

      document.getElementById('ahaBox').innerHTML = soldWin
        ? `💡 <strong>顿悟时刻：</strong>你做出了和 78% 散户一样的人性本能选择！行为金融学实证显示：散户卖掉的盈利股在未来一年平均<strong>跑赢大盘 +3.4%</strong>，而死扛留下的亏损股继续跑输大盘——只因“点下割肉键那一秒的痛苦”实在太剧烈了！`
        : `💡 <strong>顿悟时刻：</strong>干得漂亮！专业投资者的心法很简单：<strong>把买入成本价从脑海里彻底擦掉</strong>，只问自己：“如果今天手里全是现金，我愿意买 A 还是买 B？”——瞬间就能治愈处置效应！`;
    }

    draw();
  </script>
</body>
</html>
