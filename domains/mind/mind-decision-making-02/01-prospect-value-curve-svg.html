<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 前景理论 S 形价值函数</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .ctrl-box { padding:10px 14px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface-alt); margin-bottom:12px; }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📉 前景理论 S 形价值函数</h1>
        <p>误区：赚 100 元的开心和亏 100 元的难过一样大，所以只要抛硬币“赢 +120 / 输 -100（正期望）”，理性人都会抢着玩！真相：卡尼曼前景理论证明，人类对亏损的痛感是同等盈利快感的 <strong>2.25 倍</strong>，赢不到 +225 元大多数人根本不敢下注！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setBet(100,this)">🪙 公平赌局：赢 +100 / 输 -100</button>
        <button class="pill" onclick="setBet(150,this)">💰 正期望赌局：赢 +150 / 输 -100</button>
        <button class="pill" onclick="setBet(250,this)">🚀 诱人赌局：赢 +250 / 输 -100</button>
      </div>
      <div class="ctrl-box">
        <label><span>如果抛硬币输了亏 100 元，赢多少元你才肯玩？</span><span id="vWin">赢 +100 元</span></label>
        <input type="range" id="sWin" min="50" max="350" step="10" value="100" oninput="onSlide()">
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 220"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">赢钱主观快乐值</div><div class="k-val" id="kGain" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">亏 100 元主观痛苦值</div><div class="k-val" id="kLoss" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">大脑心理净感受</div><div class="k-val" id="kNet">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let winAmt = 100;
    const lambda = 2.25, alpha = 0.88;

    function valFn(x){ return x >= 0 ? Math.pow(x, alpha) : -lambda * Math.pow(-x, alpha); }
    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setBet(v, btn){
      winAmt = v; document.getElementById('sWin').value = v;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function onSlide(){
      winAmt = +document.getElementById('sWin').value;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      markDone(); draw();
    }

    function draw(){
      document.getElementById('vWin').textContent = `赢 +${winAmt} 元`;
      const gVal = valFn(winAmt);
      const lVal = valFn(-100); // ~ -129.6
      const net = gVal + lVal;

      const xMid = 250, yMid = 96;
      const toX = x => xMid + (x / 360) * 340;
      const toY = v => yMid - (v / 220) * 90;

      let ptsG = [], ptsL = [];
      for(let x=-180; x<=0; x+=6) ptsL.push(`${toX(x).toFixed(1)},${toY(valFn(x)).toFixed(1)}`);
      for(let x=0; x<=350; x+=10) ptsG.push(`${toX(x).toFixed(1)},${toY(valFn(x)).toFixed(1)}`);

      const col = net >= 0 ? 'var(--tax-green)' : 'var(--tax-red)';

      document.getElementById('svg').innerHTML = `
        <line x1="40" y1="${yMid}" x2="610" y2="${yMid}" stroke="var(--tax-border)" stroke-width="1.6"/>
        <line x1="${xMid}" y1="18" x2="${xMid}" y2="202" stroke="var(--tax-border)" stroke-width="1.6"/>
        <polyline points="${ptsL.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3.4"/>
        <polyline points="${ptsG.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3.4"/>
        <circle cx="${toX(-100)}" cy="${toY(lVal)}" r="6.5" fill="var(--tax-red)"/>
        <text x="${toX(-100)-8}" y="${toY(lVal)+16}" text-anchor="end" font-size="11.5" font-weight="900" fill="var(--tax-red)">亏100 → 痛 ${Math.round(lVal)}</text>
        <circle cx="${toX(winAmt)}" cy="${toY(gVal)}" r="6.5" fill="var(--tax-green)"/>
        <text x="${Math.min(590, toX(winAmt)+8)}" y="${Math.max(30, toY(gVal)-8)}" font-size="11.5" font-weight="900" fill="var(--tax-green)">赢${winAmt} → 乐 +${Math.round(gVal)}</text>
        <text x="605" y="${yMid-6}" text-anchor="end" font-size="11" fill="var(--tax-muted)">盈利 (+元)</text>
        <text x="45" y="${yMid-6}" font-size="11" fill="var(--tax-muted)">亏损 (-元)</text>
      `;

      document.getElementById('kGain').textContent = `+${Math.round(gVal)} 心理分`;
      document.getElementById('kLoss').textContent = `${Math.round(lVal)} 心理分`;
      const kN = document.getElementById('kNet');
      kN.textContent = `${net>=0?'+':''}${Math.round(net)} (${net>=0?'愿意下注 ✅':'拒绝赌局 🚫'})`;
      kN.style.color = col;

      document.getElementById('ahaBox').innerHTML = net < 0
        ? `💡 <strong>顿悟时刻：</strong>哪怕抛硬币给你开出<strong>赢 +${winAmt} / 输 -100</strong>的数学正期望，你的大脑依然在拒绝（净心理感受 ${Math.round(net)}）！因为亏损一侧的陡峭悬崖（λ=2.25）让你需要至少赢 <strong>+250 元</strong>才觉得值得冒亏 100 元的风险！`
        : `💡 <strong>顿悟时刻：</strong>终于跨过 <strong>2.25 倍心理盈亏平衡点</strong>！前景理论不仅解释了为什么人们不敢做正期望冒险，也解释了为什么“涨工资 5% 没几天就无感，降薪 5% 却能让人立刻辞职”！`;
    }

    draw();
  </script>
</body>
</html>
