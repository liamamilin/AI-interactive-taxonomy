<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪦 创业成功学幻觉：沉默的墓碑</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🪦 创业成功学幻觉：沉默的墓碑</h1><p>媒体只采访敲钟的 3 位辍学首富，却不报道同样辍学却破产的 997 人，于是大脑错把“高风险特征”当成“成功密码”。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>同期下海创业者总数</span><span id="vTot">500 人</span></label><input type="range" id="sTot" min="100" max="1000" step="50" value="500" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>激进梭哈策略真实存活率</span><span id="vSur">3%</span></label><input type="range" id="sSur" min="1" max="20" value="3" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">登台演讲的幸存英雄</div><div class="k-val" id="kWin">—</div></div>
        <div class="kpi"><div class="k-lbl">无人问津的失败墓碑</div><div class="k-val" id="kLos">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const tot=+document.getElementById('sTot').value, sur=+document.getElementById('sSur').value;
  document.getElementById('vTot').textContent=tot+' 人';
  document.getElementById('vSur').textContent=sur+'%';
  const win=Math.max(1, Math.round(tot*sur/100));
  const los=tot - win;
  document.getElementById('kWin').textContent=win+' 人 (媒体曝光 100%)';
  document.getElementById('kLos').textContent=los+' 人 (媒体曝光 0%)';
  document.getElementById('kLos').style.color='#ef4444';
  let dots='';
  const show=100;
  const winDots=Math.max(1, Math.round(show*sur/100));
  for(let i=0;i<show;i++){
    const col=i%20, row=Math.floor(i/20);
    const x=38+col*26, y=54+row*26;
    const isW=i<winDots;
    dots+=`<circle cx="${x}" cy="${y}" r="${isW?8:5}" fill="${isW?'#f59e0b':'#94a3b8'}" opacity="${isW?'1':'0.35'}"/>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="30" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">百人微缩样本：金点=被写进畅销书的幸存者，灰点=沉默的大多数</text>
    ${dots}
    <text x="30" y="192" font-size="11.5" fill="var(--tax-muted)">每 1 个高喊“只要敢梭哈就能成功”的英雄背后，躺着 ${Math.round(los/win)} 个同样敢梭哈却血本无归的人。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>听成功者复盘时，先补上看不见的分母——问一句“用同样方法但失败的人有多少？”立刻免疫 90% 的毒鸡汤。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
