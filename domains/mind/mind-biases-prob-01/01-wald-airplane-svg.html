<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈️ 沃尔德弹孔飞机：看见的 vs 坠毁的（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>✈️ 沃尔德弹孔飞机：看见的 vs 坠毁的（SVG）</h1><p>返航飞机机翼布满弹孔、引擎却干干净净——不是引擎没挨打，而是引擎挨打的飞机全坠毁在海底、根本没机会飞回来让你统计！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>把有限装甲加在“引擎/驾驶舱”比例</span><span id="vEng">80%</span></label><input type="range" id="sEng" min="0" max="100" value="80" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>敌方防空火力密度</span><span id="vFlak">65%</span></label><input type="range" id="sFlak" min="20" max="100" value="65" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">100 架出击真实返航数</div><div class="k-val" id="kRet">—</div></div>
        <div class="kpi"><div class="k-lbl">策略评价</div><div class="k-val" id="kVer">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const eng=+document.getElementById('sEng').value, flak=+document.getElementById('sFlak').value;
  document.getElementById('vEng').textContent=eng+'%';
  document.getElementById('vFlak').textContent=flak+'%';
  const killProb=(flak/100)*(0.55*(1 - eng/130) + 0.08*(eng/100));
  const ret=Math.max(15, Math.min(96, Math.round(100*(1 - killProb))));
  document.getElementById('kRet').textContent=ret+' 架';
  document.getElementById('kRet').style.color=eng>=60?'#059669':'#ef4444';
  document.getElementById('kVer').textContent=eng>=60?'✅ 沃尔德反直觉正解':'❌ 掉入幸存者偏差';
  const eCol=eng>=60?'#059669':'#ef4444', wCol=eng<40?'#3b82f6':'#94a3b8';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">轰炸机装甲分配示意（红点 = 返航机可见弹孔，实则非致命）</text>
    <path d="M 155 45 L 175 95 L 265 110 L 265 128 L 175 125 L 168 175 L 200 185 L 200 196 L 155 188 L 110 196 L 110 185 L 142 175 L 135 125 L 45 128 L 45 110 L 135 95 Z" fill="${wCol}" opacity="0.28" stroke="${wCol}" stroke-width="2"/>
    <rect x="139" y="65" width="32" height="36" rx="6" fill="${eCol}" opacity="0.85"/>
    <text x="155" y="88" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">引擎</text>
    <circle cx="80" cy="118" r="4" fill="#ef4444"/><circle cx="105" cy="115" r="4" fill="#ef4444"/><circle cx="215" cy="117" r="4" fill="#ef4444"/><circle cx="240" cy="120" r="4" fill="#ef4444"/><circle cx="155" cy="155" r="4" fill="#ef4444"/>
    <rect x="315" y="52" width="255" height="130" rx="12" fill="var(--tax-border)" opacity="0.18"/>
    <text x="335" y="82" font-size="12.5" font-weight="800" fill="var(--tax-text)">返航率：${ret}%（坠毁 ${100-ret} 架）</text>
    <rect x="335" y="96" width="215" height="22" rx="6" fill="var(--tax-border)" opacity="0.35"/>
    <rect x="335" y="96" width="${Math.max(8, ret*2.15).toFixed(0)}" height="22" rx="6" fill="${eng>=60?'#059669':'#ef4444'}"/>
    <text x="335" y="146" font-size="11.5" fill="var(--tax-muted)">引擎装甲权重：${eng}% | 机翼：${100-eng}%</text>
    <text x="335" y="166" font-size="11.5" fill="var(--tax-muted)">永远要问：哪些样本根本没活着进入报表？</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>只看“活着回来”的样本做决策，就会把致命弱点当成安全区。真正决定生死的证据，往往沉默地躺在海底。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
