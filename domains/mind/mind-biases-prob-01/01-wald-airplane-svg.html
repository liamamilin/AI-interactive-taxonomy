<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✈️ 沃尔德弹孔飞机：看见的 vs 坠毁的</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .zone { cursor:pointer; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>✈️ 沃尔德弹孔飞机：看见的 vs 坠毁的</h1>
        <p>误区：返航轰炸机的机翼和机尾布满密密麻麻的弹孔，说明那里最常挨打，应该把珍贵的钢板全加固在红点密集处！真相：统计学家沃尔德指出——<strong>能飞回基地的都是中弹后依然死不了的部位</strong>，引擎和驾驶舱没有弹孔，是因为挨打的早就坠毁在海底了！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <span style="font-size:12.5px;font-weight:800;color:var(--tax-muted);">🛡️ 装甲重量有限，只能选 1 处加固（也可直接点击飞机对应部位）：</span>
        <button class="pill active" id="btnWing" onclick="arm('wing')">🔴 加固弹孔密集区（机翼/机尾）</button>
        <button class="pill" id="btnEng" onclick="arm('engine')">🟢 加固空白无弹孔区（引擎/驾驶舱）</button>
        <button class="tax-btn" style="padding:7px 14px;font-size:12.5px;" onclick="launchSortie()">✈️ 模拟 100 架次出击</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">本次 100 架次安全返航</div><div class="k-val" id="kSurv">—</div></div>
        <div class="kpi"><div class="k-lbl">引擎中弹当场坠毁</div><div class="k-val" id="kCrash" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">沃尔德统计学评级</div><div class="k-val" id="kJudge">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let target = 'wing';
    let sorties = 0, surv = 62, crash = 38;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function arm(t){
      target = t;
      document.getElementById('btnWing').classList.toggle('active', t==='wing');
      document.getElementById('btnEng').classList.toggle('active', t==='engine');
      markDone(); launchSortie();
    }
    function launchSortie(){
      sorties++;
      if(target === 'wing'){
        surv = 61 + (sorties % 4);
      } else {
        surv = 88 + (sorties % 4);
      }
      crash = 100 - surv;
      markDone(); draw();
    }

    function draw(){
      const isEng = target === 'engine';
      const holes = [
        [165,78],[182,88],[150,92],[170,105],[200,98],[140,104],
        [475,78],[458,88],[490,92],[470,105],[440,98],[500,104],
        [305,152],[332,162],[318,175],[298,168],[338,148]
      ];

      document.getElementById('svg').innerHTML = `
        <text x="20" y="22" font-size="11.5" font-weight="800" fill="var(--tax-muted)">返航轰炸机弹孔分布图（点击机翼或引擎切换装甲位置）</text>

        <g class="zone" onclick="arm('wing')">
          <rect x="115" y="72" width="410" height="44" rx="14" fill="${!isEng?'var(--tax-primary-soft)':'var(--tax-surface-alt)'}" stroke="${!isEng?'var(--tax-primary)':'var(--tax-border)'}" stroke-width="${!isEng?3:1.8}"/>
          <polygon points="270,164 370,164 352,192 288,192" fill="${!isEng?'var(--tax-primary-soft)':'var(--tax-surface-alt)'}" stroke="${!isEng?'var(--tax-primary)':'var(--tax-border)'}" stroke-width="${!isEng?2.6:1.6}"/>
        </g>

        <rect x="292" y="34" width="56" height="156" rx="22" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>

        <g class="zone" onclick="arm('engine')">
          <rect x="234" y="64" width="32" height="58" rx="8" fill="${isEng?'var(--tax-green-soft)':'var(--tax-amber-soft)'}" stroke="${isEng?'var(--tax-green)':'var(--tax-amber)'}" stroke-width="${isEng?3:1.8}"/>
          <rect x="374" y="64" width="32" height="58" rx="8" fill="${isEng?'var(--tax-green-soft)':'var(--tax-amber-soft)'}" stroke="${isEng?'var(--tax-green)':'var(--tax-amber)'}" stroke-width="${isEng?3:1.8}"/>
          <rect x="302" y="46" width="36" height="32" rx="10" fill="${isEng?'var(--tax-green-soft)':'var(--tax-amber-soft)'}" stroke="${isEng?'var(--tax-green)':'var(--tax-amber)'}" stroke-width="${isEng?3:1.8}"/>
          <text x="250" y="97" text-anchor="middle" font-size="10" font-weight="900" fill="${isEng?'var(--tax-green)':'var(--tax-amber)'}">引擎</text>
          <text x="390" y="97" text-anchor="middle" font-size="10" font-weight="900" fill="${isEng?'var(--tax-green)':'var(--tax-amber)'}">引擎</text>
          <text x="320" y="66" text-anchor="middle" font-size="9.5" font-weight="900" fill="${isEng?'var(--tax-green)':'var(--tax-amber)'}">驾驶</text>
        </g>

        ${holes.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4.5" fill="var(--tax-red)"/>`).join('')}

        <text x="530" y="94" font-size="11.5" font-weight="800" fill="var(--tax-red)">← 返航弹孔密布</text>
        <text x="530" y="112" font-size="10.5" fill="var(--tax-muted)">(说明被打穿也能飞回来)</text>
        <text x="20" y="214" font-size="11.5" font-weight="800" fill="${isEng?'var(--tax-green)':'var(--tax-red)'}">
          ${isEng?'🛡️ 当前装甲护住空白引擎与驾驶舱 → 返航率暴涨至 '+surv+'%！':'⚠️ 当前装甲浪费在耐打的机翼上 → 引擎一旦中弹立刻坠毁，返航率仅 '+surv+'%'}
        </text>
      `;

      const kS = document.getElementById('kSurv'); kS.textContent = `${surv} / 100 架`; kS.style.color = isEng ? 'var(--tax-green)' : 'var(--tax-amber)';
      document.getElementById('kCrash').textContent = `${crash} 架坠海`;
      const kJ = document.getElementById('kJudge'); kJ.textContent = isEng ? '🏆 看透沉默数据！' : '🕳️ 掉进幸存者偏差'; kJ.style.color = isEng ? 'var(--tax-green)' : 'var(--tax-red)';

      document.getElementById('ahaBox').innerHTML = isEng
        ? `💡 <strong>顿悟时刻：</strong>你复现了沃尔德的传奇洞察！返航飞机上<strong>看不见弹孔的空白区域（引擎与驾驶舱）</strong>，恰恰是最致命的一击必杀区——加固那里后，生还率瞬间飙升到 <strong>${surv}%</strong>！`
        : `💡 <strong>顿悟时刻：</strong>直觉很容易盯着满屏红点（机翼弹孔）猛加钢板，却忘了<strong>“样本在进门前已经被死神筛过一遍”</strong>！点击飞机上的<strong>黄色引擎</strong>或上方绿色按钮，看看生还率如何跃升！`;
    }

    draw();
  </script>
</body>
</html>
