<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：B+ 树“矮胖哲学” · 树高与磁盘 I/O 沙盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }
    .card { background: var(--tax-surface-alt); border: 1.5px solid var(--tax-border); border-radius: 14px; padding: 16px; }
    .num { font-size: 28px; font-weight: 900; font-family: ui-monospace, monospace; margin-top: 6px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📐 B+ 树“矮胖哲学”：为什么数据库绝不用红黑树存磁盘索引？</h1>
        <p>每多 1 层树高，就意味着多 1 次昂贵的磁盘 I/O！把数据行数拉到 <strong>2,000 万行</strong>，对比二叉树（每节点 2 叉）和 B+ 树（16KB 页放 1,000 叉）的树高差距！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <label style="font-size:14.5px;font-weight:850;">🗄️ 数据库表总行数：<span id="nVal" style="color:var(--tax-primary)">1,000,000</span> 行</label>
      <input id="nSlider" type="range" min="3" max="8" step="1" value="6" style="width:100%;margin-top:8px;" />

      <div class="cards">
        <div class="card">
          <div style="font-size:13px;color:var(--tax-muted);font-weight:750;">🌲 平衡二叉树（每次只分 2 叉）</div>
          <div class="num" id="binH" style="color:var(--tax-red);">20 次磁盘 I/O</div>
          <div style="font-size:12px;color:var(--tax-muted);margin-top:4px;">又高又瘦，每次读 16KB 磁盘页却只放 1 个键，血亏！</div>
        </div>
        <div class="card" style="border-color:var(--tax-primary);">
          <div style="font-size:13px;color:var(--tax-muted);font-weight:750;">🌳 MySQL B+ 树（每 16KB 页分 ~1000 叉）</div>
          <div class="num" id="bpH" style="color:var(--tax-green);">3 次磁盘 I/O</div>
          <div style="font-size:12px;color:var(--tax-muted);margin-top:4px;">极度矮胖！根节点常驻内存，实际查硬盘仅 1~2 次！</div>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let drags = 0;
    function render() {
      const exp = parseInt(document.getElementById("nSlider").value, 10);
      const n = Math.pow(10, exp);
      document.getElementById("nVal").textContent = n.toLocaleString();
      const bh = Math.ceil(Math.log2(n));
      // 16KB leaf holds ~16 rows (1KB/row), internal node holds ~1000 pointers
      const leaves = Math.ceil(n / 16);
      const bph = leaves <= 1 ? 1 : leaves <= 1000 ? 2 : leaves <= 1000000 ? 3 : 4;
      document.getElementById("binH").textContent = bh + " 次磁盘 I/O";
      document.getElementById("bpH").textContent = bph + " 次磁盘 I/O";

      document.getElementById("ahaBox").innerHTML = `💡 <strong>矮胖即正义（${n.toLocaleString()} 行数据）：</strong>因为非叶子节点<strong>只存目录索引、不存整行大字段</strong>，一个 16KB 磁盘页能塞进上千个路标指针！于是 <strong>3 层 B+ 树就能轻松扛下 2,000 万行数据</strong>，把查找死死锁在 1–3 毫秒！`;
    }
    document.getElementById("nSlider").addEventListener("input", () => {
      drags++;
      render();
      if (drags >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    });
    render();
  </script>
</body>
</html>
