<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：B+ 树“矮胖哲学” · SVG 树高与磁盘 I/O 对比</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    @media (max-width: 740px) { .stage { grid-template-columns: 1fr; } }
    .card { background: #0f172a; border: 1.5px solid var(--tax-border); border-radius: 16px; padding: 14px; color: #e2e8f0; }
    svg { width: 100%; height: 185px; display: block; margin-top: 6px; }
    .stat { font-size: 20px; font-weight: 900; font-family: ui-monospace, monospace; margin-top: 4px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📐 B+ 树“矮胖哲学”：为什么数据库绝不用红黑树存磁盘索引？</h1>
        <p>每多 1 层树高，就意味着多 1 次昂贵的磁盘 I/O！把表行数拉到 <strong>1,000 万行</strong>，直观对比高瘦二叉树与矮胖 3 层 B+ 树的磁盘读取次数！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <label style="font-size:14.5px;font-weight:850;">🗄️ 数据库表总行数：<span id="nVal" style="color:var(--tax-primary)">1,000,000</span> 行</label>
      <input id="nSlider" type="range" min="3" max="8" step="1" value="6" style="width:100%;margin-top:8px;" />

      <div class="stage">
        <div class="card">
          <div style="font-size:13px;color:#94a3b8;font-weight:750;">🌲 平衡二叉树（每节点仅 2 叉 · 又高又瘦）</div>
          <div class="stat" id="binH" style="color:#f87171;">20 层 = 20 次磁盘 I/O</div>
          <svg viewBox="0 0 240 175" id="binSvg"></svg>
        </div>
        <div class="card" style="border-color:var(--tax-green);">
          <div style="font-size:13px;color:#94a3b8;font-weight:750;">🌳 MySQL B+ 树（16KB 页分 ~1000 叉 · 极度矮胖）</div>
          <div class="stat" id="bpH" style="color:#34d399;">3 层 = 3 次磁盘 I/O</div>
          <svg viewBox="0 0 240 175" id="bpSvg"></svg>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let drags = 0;
    function render() {
      const exp = parseInt(document.getElementById("nSlider").value, 10);
      const n = Math.pow(10, exp);
      document.getElementById("nVal").textContent = n.toLocaleString();
      const bh = Math.ceil(Math.log2(n));
      const leaves = Math.ceil(n / 16);
      const bph = leaves <= 1 ? 1 : leaves <= 1000 ? 2 : leaves <= 1000000 ? 3 : 4;

      document.getElementById("binH").textContent = `${bh} 层 = ${bh} 次磁盘 I/O`;
      document.getElementById("bpH").textContent = `${bph} 层 = ${bph} 次磁盘 I/O`;

      // Draw tall skinny binary tree representation
      const showLevels = Math.min(8, Math.ceil(bh / 3));
      let bs = "";
      for (let i = 0; i < showLevels; i++) {
        const y = 18 + i * 20;
        const x = 120 + (i % 2 === 0 ? -16 : 16);
        if (i < showLevels - 1) {
          const nx = 120 + ((i + 1) % 2 === 0 ? -16 : 16);
          bs += `<line x1="${x}" y1="${y}" x2="${nx}" y2="${y + 20}" stroke="#ef4444" stroke-width="2.5"/>`;
          bs += `<line x1="${x}" y1="${y}" x2="${x + (i % 2 === 0 ? -24 : 24)}" y2="${y + 18}" stroke="#334155" stroke-width="1.5"/>`;
        }
        bs += `<circle cx="${x}" cy="${y}" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.2"/>`;
      }
      bs += `<text x="120" y="170" text-anchor="middle" fill="#fca5a5" font-size="11">层数深达 ${bh} 层，磁盘磁头狂跳！</text>`;
      document.getElementById("binSvg").innerHTML = bs;

      // Draw short fat B+ Tree with linked leaf pages
      let ps = "";
      // Root
      ps += `<rect x="70" y="14" width="100" height="22" rx="6" fill="#6366f1" stroke="#fff" stroke-width="1.5"/><text x="120" y="29" text-anchor="middle" fill="#fff" font-size="10" font-weight="800">Root 页 (常驻内存)</text>`;
      // Level 2 internal nodes
      const midX = [45, 120, 195];
      midX.forEach(mx => {
        ps += `<line x1="120" y1="36" x2="${mx}" y2="66" stroke="#38bdf8" stroke-width="2"/>`;
        ps += `<rect x="${mx - 28}" y="66" width="56" height="20" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/><text x="${mx}" y="80" text-anchor="middle" fill="#7dd3fc" font-size="9">目录页×1000</text>`;
      });
      // Level 3 leaf pages linked by doubly-linked list
      const leafX = [28, 74, 120, 166, 212];
      leafX.forEach((lx, i) => {
        const parentX = midX[Math.min(2, Math.floor(i / 2))];
        ps += `<line x1="${parentX}" y1="86" x2="${lx}" y2="122" stroke="#10b981" stroke-width="1.8"/>`;
        ps += `<rect x="${lx - 18}" y="122" width="36" height="24" rx="5" fill="#065f46" stroke="#10b981" stroke-width="1.5"/><text x="${lx}" y="138" text-anchor="middle" fill="#a7f3d0" font-size="9">数据页</text>`;
        if (i < leafX.length - 1) {
          ps += `<line x1="${lx + 18}" y1="134" x2="${leafX[i+1] - 18}" y2="134" stroke="#fbbf24" stroke-width="2.5"/>`;
        }
      });
      ps += `<text x="120" y="168" text-anchor="middle" fill="#6ee7b7" font-size="11">仅 ${bph} 层搞定 + 叶子双向链表 ⇄</text>`;
      document.getElementById("bpSvg").innerHTML = ps;

      document.getElementById("ahaBox").innerHTML = `💡 <strong>矮胖即正义（${n.toLocaleString()} 行数据）：</strong>因为非叶子节点<strong>只存目录路标、不存整行大字段</strong>，一个 16KB 页能分出上千个叉！于是 <strong>${bph} 层 B+ 树</strong>就能轻松兜住海量数据，查一次比二叉树少跑 ${bh - bph} 趟硬盘！`;
    }
    document.getElementById("nSlider").addEventListener("input", () => {
      drags++;
      render();
      if (drags >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    });
    render();
  </script>
</body>
</html>
