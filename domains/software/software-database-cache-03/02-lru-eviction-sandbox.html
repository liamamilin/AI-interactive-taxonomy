<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：LRU 缓存淘汰传送带</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn { padding: 9px 14px; border-radius: 12px; border: 1.5px solid var(--tax-primary); background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; }
    .belt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0; }
    .slot { padding: 16px; border-radius: 14px; background: var(--tax-surface-alt); border: 2px solid var(--tax-border); text-align: center; font-weight: 850; font-size: 16px; }
    .slot.hot { border-color: var(--tax-green); background: rgba(16,185,129,0.14); }
    .slot.cold { border-color: var(--tax-amber); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>♻️ LRU 缓存淘汰传送带（Least Recently Used）：内存满了，到底该踢走谁？</h1>
        <p>缓存只有 <strong>3 个 VIP 座位</strong>（左=刚用过的最热数据，右=最久没碰的冷门数据）。点击访问不同页面，观察谁被顶到最左、谁被踢出局！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="ctrls">
        <button class="btn" onclick="access('A')">访问页面 A</button>
        <button class="btn" onclick="access('B')">访问页面 B</button>
        <button class="btn" onclick="access('C')">访问页面 C</button>
        <button class="btn" onclick="access('D')">访问页面 D</button>
        <button class="btn" onclick="access('E')">访问页面 E</button>
      </div>
      <div class="belt" id="beltBox"></div>
      <div id="logOut" style="font-size:13.5px;font-weight:800;color:var(--tax-primary);text-align:center;"></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let cache = ["A", "B", "C"];
    let ops = 0;

    function access(k) {
      ops++;
      const idx = cache.indexOf(k);
      if (idx >= 0) {
        cache.splice(idx, 1);
        cache.unshift(k);
        document.getElementById("logOut").textContent = `🎯 缓存命中 [${k}]！直接把它挪到最左边的热榜第 1 位！`;
      } else {
        const evicted = cache.pop();
        cache.unshift(k);
        document.getElementById("logOut").textContent = `💨 缓存未命中 [${k}]！写入队头，并把最久没用过的 [${evicted}] 淘汰出局！`;
      }
      render();
      if (ops >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    }

    function render() {
      const tags = ["🔥 最新命中（队头）", "⏱️ 较近使用", "🧊 最久未用（下个被踢！）"];
      document.getElementById("beltBox").innerHTML = cache.map((k, i) => `
        <div class="slot ${i === 0 ? "hot" : i === 2 ? "cold" : ""}">
          <div style="font-size:11.5px;color:var(--tax-muted);margin-bottom:6px;">${tags[i]}</div>
          <div>页面 ${k}</div>
        </div>
      `).join("");
      document.getElementById("ahaBox").innerHTML = "💡 <strong>LRU 的 O(1) 经典底层实现：</strong>用 <strong>哈希表（O(1) 定位节点）+ 双向链表（O(1) 把节点挪到队头或删掉队尾）</strong> 组合而成——这也是 Redis、浏览器缓存、操作系统内存页置换的基石算法！";
    }
    render();
  </script>
</body>
</html>
