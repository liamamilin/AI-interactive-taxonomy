<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：A* 寻路迷宫 vs BFS 盲目水波扩散</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .btn { padding: 9px 15px; border-radius: 12px; border: 1.5px solid var(--tax-primary); background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; }
    .btn.sec { background: var(--tax-surface-alt); color: var(--tax-text); border-color: var(--tax-border); }
    .duel { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 740px) { .duel { grid-template-columns: 1fr; } }
    .maze { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; background: var(--tax-surface-alt); padding: 10px; border-radius: 14px; border: 1.5px solid var(--tax-border); }
    .cell { aspect-ratio: 1; border-radius: 5px; background: var(--tax-surface); border: 1px solid var(--tax-border); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; user-select: none; }
    .cell.wall { background: #334155; border-color: #475569; }
    .cell.vis { background: rgba(99,102,241,0.25); }
    .cell.path { background: var(--tax-green); color: #fff; font-weight: 900; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🗺️ A* 寻路 vs BFS 盲目扩散：为什么游戏小兵知道绕开墙直奔基地？</h1>
        <p>点击任意空白格可以<strong>自由加墙/拆墙</strong>，然后点击 <strong>“同时寻路”</strong> 对比 BFS（像倒水一样盲目四散）和 A*（带着指南针 <code>f=g+h</code> 直冲终点）的探索格子数！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="ctrls">
        <button class="btn" onclick="solveBoth()">🧭 同时启动 BFS 与 A* 寻路</button>
        <button class="btn sec" onclick="resetWalls()">↺ 恢复默认迷宫</button>
      </div>
      <div class="duel">
        <div>
          <div style="font-weight:850;font-size:13.5px;margin-bottom:6px;">🌊 BFS 盲目水波（已探索：<span id="bfsCnt">0</span> 格）</div>
          <div class="maze" id="bfsMaze"></div>
        </div>
        <div>
          <div style="font-weight:850;font-size:13.5px;margin-bottom:6px;">🎯 A* 启发式寻路（已探索：<span id="astCnt">0</span> 格）</div>
          <div class="maze" id="astMaze"></div>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    const R = 6, C = 8;
    const S = [4, 1], E = [1, 6];
    let walls = new Set(["1,3", "2,3", "3,3", "4,3", "2,5"]);

    function key(r, c) { return `${r},${c}`; }

    function toggleWall(r, c) {
      const k = key(r, c);
      if (k === key(S[0], S[1]) || k === key(E[0], E[1])) return;
      if (walls.has(k)) walls.delete(k); else walls.add(k);
      renderGrid("bfsMaze", new Set(), new Set());
      renderGrid("astMaze", new Set(), new Set());
    }

    function resetWalls() {
      walls = new Set(["1,3", "2,3", "3,3", "4,3", "2,5"]);
      solveBoth();
    }

    function runSearch(useAStar) {
      const open = [{ r: S[0], c: S[1], g: 0, f: 0 }];
      const came = {};
      const gScore = { [key(S[0], S[1])]: 0 };
      const visited = new Set();

      while (open.length) {
        if (useAStar) open.sort((a, b) => a.f - b.f);
        const cur = open.shift();
        const ck = key(cur.r, cur.c);
        if (visited.has(ck)) continue;
        visited.add(ck);
        if (cur.r === E[0] && cur.c === E[1]) {
          const path = new Set();
          let p = ck;
          while (p) { path.add(p); p = came[p]; }
          return { visited, path };
        }
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr, dc]) => {
          const nr = cur.r + dr, nc = cur.c + dc, nk = key(nr, nc);
          if (nr < 0 || nr >= R || nc < 0 || nc >= C || walls.has(nk)) return;
          const ng = cur.g + 1;
          if (gScore[nk] === undefined || ng < gScore[nk]) {
            gScore[nk] = ng;
            came[nk] = ck;
            const h = Math.abs(nr - E[0]) + Math.abs(nc - E[1]);
            open.push({ r: nr, c: nc, g: ng, f: useAStar ? ng + h : ng });
          }
        });
      }
      return { visited, path: new Set() };
    }

    function renderGrid(elId, visited, path) {
      let html = "";
      for (let r = 0; r < R; r++) {
        for (let c = 0; c < C; c++) {
          const k = key(r, c);
          let cls = "cell", txt = "";
          if (walls.has(k)) { cls += " wall"; txt = "🧱"; }
          else if (k === key(S[0], S[1])) { cls += " path"; txt = "🚩"; }
          else if (k === key(E[0], E[1])) { cls += " path"; txt = "🏁"; }
          else if (path.has(k)) { cls += " path"; txt = "•"; }
          else if (visited.has(k)) { cls += " vis"; }
          html += `<div class="${cls}" onclick="toggleWall(${r},${c})">${txt}</div>`;
        }
      }
      document.getElementById(elId).innerHTML = html;
    }

    let runs = 0;
    function solveBoth() {
      const b = runSearch(false);
      const a = runSearch(true);
      renderGrid("bfsMaze", b.visited, b.path);
      renderGrid("astMaze", a.visited, a.path);
      document.getElementById("bfsCnt").textContent = b.visited.size;
      document.getElementById("astCnt").textContent = a.visited.size;
      document.getElementById("ahaBox").innerHTML = `💡 <strong>A* 启发式指南针完胜！</strong>两者找到了同样短的最优路线，但 BFS 像无头苍蝇探索了 <strong>${b.visited.size} 格</strong>，而 A* 靠着 <code>f = 已走步数 g + 到终点直线估距 h</code> 仅探索了 <strong>${a.visited.size} 格</strong> 就精准绕墙到达！`;
      runs++;
      if (runs >= 2 && window.ToySDK) window.ToySDK.markCompleted();
    }
    solveBoth();
  </script>
</body>
</html>
