<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：标记-清除（Mark & Sweep）内存清扫图</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .steps { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn { padding: 9px 15px; border-radius: 12px; border: 1.5px solid var(--tax-border); background: var(--tax-surface-alt); color: var(--tax-text); font-weight: 800; cursor: pointer; }
    .btn.active { background: var(--tax-primary); border-color: var(--tax-primary); color: #fff; }
    .stage { background: #0f172a; border: 1.5px solid var(--tax-border); border-radius: 16px; padding: 12px; }
    svg { width: 100%; height: 220px; display: block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧹 标记-清除（Mark &amp; Sweep）：垃圾回收器怎么一眼认出“孤岛垃圾”？</h1>
        <p>右侧有两个对象 <code>D ⇄ E</code> 互相拉着手（引用计数都不为 0），但已经没人能从 <strong>GC Root（调用栈）</strong> 找到它们！依次点击 3 个阶段完成清扫！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="steps">
        <button class="btn active" id="s1" onclick="go(1)">① 初始堆内存（含循环引用孤岛）</button>
        <button class="btn" id="s2" onclick="go(2)">② Mark：从 GC Root 染色可达对象</button>
        <button class="btn" id="s3" onclick="go(3)">③ Sweep：瞬间清扫未染色垃圾！</button>
      </div>
      <div class="stage"><svg viewBox="0 0 540 210" id="gcSvg"></svg></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    const seen = new Set([1]);
    function go(n) {
      seen.add(n);
      [1, 2, 3].forEach(i => document.getElementById("s" + i).classList.toggle("active", i === n));
      const marked = n >= 2;
      const swept = n === 3;

      let s = "";
      // Reachable links
      s += `<line x1="80" y1="105" x2="180" y2="65" stroke="${marked ? "#10b981" : "#64748b"}" stroke-width="3"/>`;
      s += `<line x1="180" y1="65" x2="285" y2="65" stroke="${marked ? "#10b981" : "#64748b"}" stroke-width="3"/>`;
      s += `<line x1="80" y1="105" x2="180" y2="150" stroke="${marked ? "#10b981" : "#64748b"}" stroke-width="3"/>`;

      // Island links (D <-> E)
      if (!swept) {
        s += `<line x1="390" y1="70" x2="475" y2="145" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="5,4"/>`;
        s += `<line x1="475" y1="145" x2="390" y2="70" stroke="#ef4444" stroke-width="2.5"/>`;
      }

      // Root
      s += `<rect x="26" y="82" width="90" height="46" rx="10" fill="#6366f1" stroke="#fff" stroke-width="2"/><text x="71" y="109" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">GC Root</text>`;

      // Alive nodes A, B, C
      const aliveCol = marked ? "#10b981" : "#334155";
      [[180,65,"Obj A"],[285,65,"Obj B"],[180,150,"Obj C"]].forEach(([x,y,lb]) => {
        s += `<circle cx="${x}" cy="${y}" r="24" fill="${aliveCol}" stroke="#e2e8f0" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">${lb}</text>`;
      });

      // Garbage island D, E
      if (!swept) {
        const gCol = marked ? "#7f1d1d" : "#334155";
        [[390,70,"孤岛 D"],[475,145,"孤岛 E"]].forEach(([x,y,lb]) => {
          s += `<circle cx="${x}" cy="${y}" r="24" fill="${gCol}" stroke="#ef4444" stroke-width="2" stroke-dasharray="${marked ? "4,3" : "none"}"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="#fecaca" font-size="11.5" font-weight="800">${lb}</text>`;
        });
      } else {
        s += `<text x="430" y="112" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="800">✨ 孤岛 D / E 已彻底释放！</text>`;
      }

      document.getElementById("gcSvg").innerHTML = s;
      const ahas = {
        1: "💡 <strong>为什么单纯“引用计数”会内存泄漏？</strong>看右边 D 和 E：它们互相指着对方，引用数都是 1，引用计数法永远不敢删！点击 <strong>② Mark</strong> 看追踪式 GC 如何破局。",
        2: "💡 <strong>可达性分析（Mark）：</strong>GC 根本不数谁指着你，只从栈上的 <strong>GC Root</strong> 一路顺藤摸瓜染色！A/B/C 被染绿（存活），孤岛 D/E 摸不到（依然暗红）！",
        3: "💡 <strong>一键清扫（Sweep）：</strong>所有没染上绿色的内存直接回收，不管它们内部怎么互相抱团！现代 JVM / V8 / Go 垃圾回收器的根基全建立在这个优雅的可达性算法之上！"
      };
      document.getElementById("ahaBox").innerHTML = ahas[n];
      if (seen.size >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    }
    go(1);
  </script>
</body>
</html>
