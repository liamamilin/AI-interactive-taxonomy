<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：歪脖子树急救 · BST 退化 vs AVL 平衡</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn { padding: 10px 15px; border-radius: 12px; border: 1.5px solid var(--tax-border); background: var(--tax-surface-alt); color: var(--tax-text); font-weight: 800; cursor: pointer; }
    .btn.active { background: var(--tax-primary); border-color: var(--tax-primary); color: #fff; }
    .stage { background: #0f172a; border: 1.5px solid var(--tax-border); border-radius: 16px; padding: 12px; }
    svg { width: 100%; height: 230px; display: block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🌲 歪脖子树急救：为什么数据库和标准库绝不敢用“普通二叉搜索树”？</h1>
        <p>依次按升序插入 <code>1, 2, 3, 4, 5, 6, 7</code>！切换普通 BST 与自平衡 AVL / 红黑树，看看树高与查找步数的悬殊差距！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="tabs">
        <button class="btn active" id="mBst" onclick="setM('bst')">😵 普通 BST（退化成 7 层歪脖子链表！）</button>
        <button class="btn" id="mAvl" onclick="setM('avl')">✅ 平衡树 AVL / 红黑树（旋转压成 3 层！）</button>
      </div>
      <div class="stage"><svg viewBox="0 0 520 220" id="tSvg"></svg></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    const seen = new Set(["bst"]);
    function setM(m) {
      seen.add(m);
      document.getElementById("mBst").classList.toggle("active", m === "bst");
      document.getElementById("mAvl").classList.toggle("active", m === "avl");
      const avl = m === "avl";
      let s = "";
      if (!avl) {
        const pts = Array.from({ length: 7 }, (_, i) => [90 + i * 56, 28 + i * 28, i + 1]);
        for (let i = 0; i < 6; i++) s += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[i+1][0]}" y2="${pts[i+1][1]}" stroke="#ef4444" stroke-width="3"/>`;
        pts.forEach(([x, y, v]) => {
          s += `<circle cx="${x}" cy="${y}" r="15" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">${v}</text>`;
        });
      } else {
        const nodes = [
          [260, 38, 4], [150, 105, 2], [370, 105, 6],
          [95, 175, 1], [205, 175, 3], [315, 175, 5], [425, 175, 7]
        ];
        const edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
        edges.forEach(([a,b]) => s += `<line x1="${nodes[a][0]}" y1="${nodes[a][1]}" x2="${nodes[b][0]}" y2="${nodes[b][1]}" stroke="#10b981" stroke-width="3"/>`);
        nodes.forEach(([x, y, v]) => {
          s += `<circle cx="${x}" cy="${y}" r="17" fill="#065f46" stroke="#10b981" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">${v}</text>`;
        });
      }
      document.getElementById("tSvg").innerHTML = s;
      document.getElementById("ahaBox").innerHTML = avl
        ? "💡 <strong>左旋/右旋自平衡（AVL / 红黑树）：</strong>每当一边长歪超过阈值，树就自动“提拔中间节点当新根”，把树高死死压在 <code>O(log n)</code>（7 个数最多找 3 步，100 万个数最多找 20 步）！"
        : "💡 <strong>有序数据是普通 BST 的天敌：</strong>按 1→7 顺序插入时，每个新数都比上一个大，全都往右挂，直接退化成一条 7 层的慢链表 <code>O(n)</code>！点击上方切换到 <strong>平衡树</strong> 拯救它！";
      if (seen.size >= 2 && window.ToySDK) window.ToySDK.markCompleted();
    }
    setM("bst");
  </script>
</body>
</html>
