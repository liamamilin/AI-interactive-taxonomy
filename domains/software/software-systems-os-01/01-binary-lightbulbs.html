<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：8 位二进制灯泡计数器 · Binary</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bits { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin: 16px 0; }
    @media (max-width: 680px) { .bits { grid-template-columns: repeat(4, 1fr); } }
    .bit { padding: 14px 6px; border-radius: 14px; border: 1.5px solid var(--tax-border); background: var(--tax-surface-alt); text-align: center; cursor: pointer; transition: all 0.15s ease; user-select: none; }
    .bit.on { border-color: var(--tax-amber); background: rgba(245,158,11,0.18); transform: translateY(-2px); }
    .val-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .big { font-size: 30px; font-weight: 900; font-family: ui-monospace, monospace; color: var(--tax-primary); }
    .btn { padding: 9px 14px; border-radius: 12px; border: 1.5px solid var(--tax-primary); background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; }
    .btn.sec { background: var(--tax-surface-alt); color: var(--tax-text); border-color: var(--tax-border); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>💡 8 位二进制灯泡：一字节（1 Byte）如何靠 8 个开关数到 255？</h1>
        <p>点击下方 8 盏灯泡自由切换 <code>0 / 1</code>，或点击 <strong>“+1”</strong> 观察满格 <code>11111111 (255)</code> 再加 1 时发生的经典整数溢出！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="val-bar">
        <div>
          <span style="font-size:13px;color:var(--tax-muted);font-weight:750;">十进制数值：</span>
          <span class="big" id="decOut">0</span>
          <span style="margin-left:12px;font-family:monospace;font-size:14px;color:var(--tax-muted);">HEX: <strong id="hexOut">0x00</strong></span>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn" onclick="addOne()">⚡ +1</button>
          <button class="btn sec" onclick="setVal(255)">🔥 设为 255</button>
          <button class="btn sec" onclick="setVal(0)">↺ 清零</button>
        </div>
      </div>

      <div class="bits" id="bitRow"></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let val = 42;
    let clicks = 0;
    let overflowed = false;

    function toggleBit(i) {
      val ^= (1 << (7 - i));
      clicks++;
      overflowed = false;
      render();
      if (clicks >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    }

    function addOne() {
      clicks++;
      if (val === 255) {
        val = 0;
        overflowed = true;
      } else {
        val++;
        overflowed = false;
      }
      render();
      if (clicks >= 2 && window.ToySDK) window.ToySDK.markCompleted();
    }

    function setVal(v) {
      val = v;
      overflowed = false;
      render();
    }

    function render() {
      document.getElementById("decOut").textContent = val;
      document.getElementById("hexOut").textContent = "0x" + val.toString(16).toUpperCase().padStart(2, "0");
      let html = "";
      for (let i = 0; i < 8; i++) {
        const w = 1 << (7 - i);
        const on = (val & w) !== 0;
        html += `
          <div class="bit ${on ? "on" : ""}" onclick="toggleBit(${i})">
            <div style="font-size:22px;">${on ? "💡" : "⚫"}</div>
            <div style="font-size:18px;font-weight:900;font-family:monospace;margin:4px 0;">${on ? 1 : 0}</div>
            <div style="font-size:11.5px;color:var(--tax-muted);">位权 ${w}</div>
          </div>
        `;
      }
      document.getElementById("bitRow").innerHTML = html;

      document.getElementById("ahaBox").innerHTML = overflowed
        ? "💡 <strong>发生 8 位整数溢出（Overflow）！</strong>255 是 8 个灯泡全亮的最大值，再 +1 产生的第 9 位进位装不下被丢弃，数值瞬间绕回 <strong>0</strong>——这就是历史上无数火箭失事、游戏金币变负数的著名 Bug 根源！"
        : "💡 <strong>顿悟时刻：</strong>试着点亮不同灯泡拼出数字，再点 <strong>“设为 255” → “+1”</strong> 亲手触发一次经典的 1 Byte 溢出归零！";
    }
    render();
  </script>
</body>
</html>
