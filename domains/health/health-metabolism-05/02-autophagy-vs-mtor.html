<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚖️ 生长开关 mTOR vs 清理开关 AMPK 跷跷板</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .trig-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px; margin-bottom:14px; }
    .t-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .t-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .t-btn .t { font-size:13px; font-weight:800; }
    .t-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⚖️ 生长开关 mTOR vs 清理开关 AMPK 跷跷板</h1>
        <p>误区：长寿就是永远压低 mTOR、永远拼命断食。真相：mTOR 负责“盖新楼（长肌肉/修免疫）”，AMPK 负责“清垃圾（细胞自噬）”；健康长寿的秘诀不是卡死在一边，而是让跷跷板有节奏地交替摆动！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🎛️ 点击施加不同生活触发器，观察细胞内 mTOR（建造）与 AMPK（清理）跷跷板如何切换：</div>
      <div class="trig-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">🏗️ mTOR 合成生长活性</div><div class="k-val" id="kMtor" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">🧹 AMPK 细胞清理活性</div><div class="k-val" id="kAmpk" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">当前细胞施工模式</div><div class="k-val" id="kMode" style="color:var(--tax-primary);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const TRIGGERS = [
      { id:'lift_prot', icon:'🏋️', name:'力量训练 + 优质蛋白', desc:'亮氨酸 + 机械张力', mtor:90, ampk:22, mode:'精准增肌施工 🏗️',
        aha:'💡 <strong>顿悟时刻：</strong>力量训练后的高蛋白摄入精准拉高 <strong>肌肉里的 mTOR</strong>，把氨基酸焊成新肌纤维——只要不整天不停嘴，这种脉冲式 mTOR 是强壮与抗衰的必需品！' },
      { id:'fast_16', icon:'⏳', name:'16 小时轻断食', desc:'胰岛素低谷 · 能量警报', mtor:18, ampk:86, mode:'细胞大扫除自噬 🧹',
        aha:'💡 <strong>顿悟时刻：</strong>能量暂时短缺时，细胞传感器 <strong>AMPK</strong> 强势抬头并按下 mTOR 暂停键：工地停工，全面开启垃圾回收与破损线粒体翻新！' },
      { id:'zone2', icon:'🚴', name:'空腹 Zone 2 有氧', desc:'ATP/AMP 比值下降', mtor:25, ampk:82, mode:'线粒体扩容清理 ⚡',
        aha:'💡 <strong>顿悟时刻：</strong>有氧运动消耗 ATP 产生 AMP，直接唤醒 AMPK，既燃脂又刺激新生健康线粒体，是不用极端挨饿也能激活清理开关的利器！' },
      { id:'snack_all_day', icon:'🍩', name:'全天高糖零食+久坐', desc:'胰岛素常年不降', mtor:88, ampk:10, mode:'⚠️ 持续合成无清理',
        aha:'💡 <strong>顿悟时刻：</strong>最糟糕的状态！既不运动长肌肉，又靠全天吃零食把 mTOR 锁死在 88%，AMPK 长期只有 10%——细胞垃圾越堆越多，代谢老化大幅加速！' },
      { id:'starve_long', icon:'🥶', name:'长期极端低蛋白挨饿', desc:'过度压制合成信号', mtor:10, ampk:92, mode:'⚠️ 肌肉流失警报',
        aha:'💡 <strong>顿悟时刻：</strong>把跷跷板长期锁死在 AMPK 端同样危险！缺少 mTOR 合成信号和蛋白质，老年人或节食者会迅速出现肌少症、免疫力下滑和骨质疏松。' },
      { id:'cycle', icon:'🔄', name:'白天练+吃 / 夜间空腹', desc:'周期脉冲交替切换', mtor:62, ampk:62, mode:'🏆 黄金节律脉冲',
        aha:'💡 <strong>顿悟时刻：</strong>顶级抗衰与体能法则：<strong>白天用力量训练+蛋白质拉高 mTOR 盖楼，夜晚用 14–16 小时空腹和深睡拉高 AMPK 扫地</strong>——有建有清，动态平衡！' }
    ];
    let cur = 'lift_prot';

    function pick(id){
      cur = id;
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      document.getElementById('grid').innerHTML = TRIGGERS.map(t => `
        <button class="t-btn ${cur===t.id?'active':''}" onclick="pick('${t.id}')">
          <div class="t">${t.icon} ${t.name}</div>
          <div class="s">${t.desc}</div>
        </button>
      `).join('');

      const t = TRIGGERS.find(x=>x.id===cur);
      // Tilt angle: positive tilts right (AMPK heavier/active), negative tilts left (mTOR heavier/active)
      const angle = ((t.ampk - t.mtor) / 100) * 18;
      document.getElementById('svg').innerHTML = `
        <polygon points="320,132 292,188 348,188" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="2"/>
        <g transform="rotate(${angle.toFixed(1)} 320 132)">
          <rect x="90" y="124" width="460" height="14" rx="7" fill="var(--tax-primary)"/>
          <rect x="96" y="42" width="146" height="74" rx="12" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="2.2"/>
          <text x="169" y="72" text-anchor="middle" font-size="14" font-weight="850" fill="var(--tax-amber)">🏗️ mTOR 建造</text>
          <text x="169" y="96" text-anchor="middle" font-size="15" font-weight="900" fill="var(--tax-ink)">${t.mtor}%</text>

          <rect x="398" y="42" width="146" height="74" rx="12" fill="var(--tax-green-soft)" stroke="var(--tax-green)" stroke-width="2.2"/>
          <text x="471" y="72" text-anchor="middle" font-size="14" font-weight="850" fill="var(--tax-green)">🧹 AMPK 清理</text>
          <text x="471" y="96" text-anchor="middle" font-size="15" font-weight="900" fill="var(--tax-ink)">${t.ampk}%</text>
        </g>
        <circle cx="320" cy="132" r="9" fill="var(--tax-ink)"/>
        <text x="320" y="206" text-anchor="middle" font-size="12.5" font-weight="800" fill="var(--tax-muted)">当前状态：${t.mode}</text>
      `;

      document.getElementById('kMtor').textContent = t.mtor + '%';
      document.getElementById('kAmpk').textContent = t.ampk + '%';
      document.getElementById('kMode').textContent = t.mode;
      document.getElementById('ahaBox').innerHTML = t.aha;
    }

    draw();
  </script>
</body>
</html>
