<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏱️ 断食 24 小时代谢开关时间轴</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .ctrl-box { padding:10px 14px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface-alt); margin-bottom:14px; }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⏱️ 断食 24 小时代谢开关时间轴</h1>
        <p>误区：只要少吃一顿早饭，细胞就立刻启动“诺贝尔奖级自噬大扫除”。真相：肝脏里存着够烧十几个小时的糖原，不把胰岛素降下来、把糖原清空大半，细胞自噬开关根本不会合闸！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" id="playBtn" onclick="playTimeline()">▶ 播放 36 小时代谢开关</button>
        <button class="pill" id="exBtn" onclick="toggleExercise()">🏃 叠加运动加速：关闭</button>
        <button class="pill" onclick="jumpTo(4)">4h 消化期</button>
        <button class="pill" onclick="jumpTo(14)">14h 糖原告急</button>
        <button class="pill" onclick="jumpTo(20)">20h 生酮上升</button>
        <button class="pill" onclick="jumpTo(30)">30h 自噬高峰</button>
      </div>
      <div class="ctrl-box">
        <label><span>距离上一顿饭已禁食时长</span><span id="vHr">16 小时</span></label>
        <input type="range" id="sHr" min="0" max="36" value="16" oninput="onSlide()">
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">肝糖原剩余库存</div><div class="k-val" id="kGly" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">脂肪/酮体供能比</div><div class="k-val" id="kKet" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">细胞自噬清理活性</div><div class="k-val" id="kAuto" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let hr = 16, exBoost = false, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function toggleExercise(){
      exBoost = !exBoost;
      const b = document.getElementById('exBtn');
      b.classList.toggle('active', exBoost);
      b.textContent = exBoost ? '🏃 叠加运动加速：开启（提前 4h）' : '🏃 叠加运动加速：关闭';
      markDone(); draw();
    }
    function jumpTo(h){
      if(timer){ clearInterval(timer); timer=null; }
      hr = h; document.getElementById('sHr').value = h;
      markDone(); draw();
    }
    function onSlide(){
      if(timer){ clearInterval(timer); timer=null; }
      hr = +document.getElementById('sHr').value;
      markDone(); draw();
    }
    function playTimeline(){
      if(timer) clearInterval(timer);
      markDone();
      hr = 0; document.getElementById('sHr').value = 0;
      timer = setInterval(()=>{
        hr++;
        document.getElementById('sHr').value = hr;
        draw();
        if(hr >= 36){ clearInterval(timer); timer = null; }
      }, 95);
      draw();
    }

    function metrics(h){
      const eff = h + (exBoost ? 4 : 0);
      const gly = Math.max(4, Math.round(100 * Math.exp(-eff / 10.5)));
      const ket = Math.min(95, Math.round(100 / (1 + Math.exp(-(eff - 15) / 3.8))));
      const auto = Math.min(96, Math.round(100 / (1 + Math.exp(-(eff - 22) / 3.5))));
      return { gly, ket, auto, eff };
    }

    function draw(){
      document.getElementById('vHr').textContent = `${hr} 小时${exBoost ? '（等效 '+(hr+4)+'h）' : ''}`;
      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = h => x0 + (h/36)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pG=[], pK=[], pA=[];
      for(let i=0; i<=36; i++){
        const m = metrics(i);
        pG.push(`${toX(i).toFixed(1)},${toY(m.gly).toFixed(1)}`);
        pK.push(`${toX(i).toFixed(1)},${toY(m.ket).toFixed(1)}`);
        pA.push(`${toX(i).toFixed(1)},${toY(m.auto).toFixed(1)}`);
      }
      const cur = metrics(hr);
      const cx = toX(hr);

      document.getElementById('svg').innerHTML = `
        ${[0,25,50,75,100].map(v=>`<line x1="${x0}" y1="${toY(v)}" x2="${x1}" y2="${toY(v)}" stroke="var(--tax-border)"/><text x="${x0-8}" y="${toY(v)+4}" text-anchor="end" font-size="10.5" fill="var(--tax-muted)">${v}%</text>`).join('')}
        ${[0,6,12,18,24,30,36].map(h=>`<text x="${toX(h)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${h}h</text>`).join('')}
        <polyline points="${pG.join(' ')}" fill="none" stroke="var(--tax-amber)" stroke-width="2.8"/>
        <polyline points="${pK.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="2.8"/>
        <polyline points="${pA.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3.2"/>
        <line x1="${cx}" y1="${yMin}" x2="${cx}" y2="${yMax}" stroke="var(--tax-ink)" stroke-width="1.6" stroke-dasharray="4 3"/>
        <circle cx="${cx}" cy="${toY(cur.gly)}" r="5" fill="var(--tax-amber)"/>
        <circle cx="${cx}" cy="${toY(cur.ket)}" r="5" fill="var(--tax-primary)"/>
        <circle cx="${cx}" cy="${toY(cur.auto)}" r="5.5" fill="var(--tax-green)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-amber)">● 肝糖原</text>
        <text x="${x0+74}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-primary)">● 生酮燃脂</text>
        <text x="${x0+164}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-green)">● 细胞自噬清理</text>
      `;

      document.getElementById('kGly').textContent = cur.gly + '%';
      document.getElementById('kKet').textContent = cur.ket + '%';
      document.getElementById('kAuto').textContent = cur.auto + '%';

      let aha = '';
      if(cur.eff < 10){
        aha = `💡 <strong>顿悟时刻：</strong>断食前 ${hr} 小时仍处于“消化与消耗肝糖原”阶段（糖原剩余 ${cur.gly}%），胰岛素还没彻底落回谷底，自噬开关仍处于休眠状态。`;
      } else if(cur.eff < 18){
        aha = `💡 <strong>顿悟时刻：</strong>跨过 12–16 小时门槛！肝糖原消耗过半（剩 ${cur.gly}%），身体开始明显切入脂肪与酮体供能（${cur.ket}%）——这就是 16:8 轻断食真正开始起效的区间！`;
      } else if(cur.eff < 26){
        aha = `💡 <strong>顿悟时刻：</strong>生酮与细胞自噬（${cur.auto}%）双双爬坡！细胞开始回收破损蛋白质与老化线粒体作为再生建材。注意开启“运动加速”可以把这扇门提前约 4 小时！`;
      } else {
        aha = `💡 <strong>顿悟时刻：</strong>深度自噬清理区（活性 <strong>${cur.auto}%</strong>）！但长断食并非越久越好——超过 24–36 小时可能带来肌肉分解与电解质失衡风险，普通人规律 14–16 小时已能收获大部分代谢红利。`;
      }
      document.getElementById('ahaBox').innerHTML = aha;
    }

    draw();
  </script>
</body>
</html>
