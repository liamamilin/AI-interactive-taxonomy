<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 平台期真相：基础代谢与 NEAT 滑坡曲线（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📉 平台期真相：基础代谢与 NEAT 滑坡曲线（SVG）</h1><p>误区：只要每天制造 500 大卡热量缺口，体重就会像直线一样每周稳掉 1 斤直到变成纸片人。真相：体重变轻本身就会降代谢，加上大脑下意识削减 NEAT（翘脚/眨眼/站姿消耗），缺口会越来越小直到平台期！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>每日节食热量缺口</span><span id="vDef">600 kcal</span></label><input type="range" id="sDef" min="200" max="1200" step="50" value="600" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>力量训练与高蛋白保肌度</span><span id="vProt">40%</span></label><input type="range" id="sProt" min="0" max="100" value="40" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">12周后实际有效缺口</div><div class="k-val" id="kEff" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">代谢下调补偿幅度</div><div class="k-val" id="kDrop" style="color:#ef4444;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const def=+document.getElementById('sDef').value, prot=+document.getElementById('sProt').value;
  document.getElementById('vDef').textContent=def+' kcal'; document.getElementById('vProt').textContent=prot+'%';
  const adaptRate=Math.min(0.68, 0.25 + (def/1500)*(1-prot/180));
  let pts='40,35 ', curDef=def;
  for(let w=1;w<=12;w++){
    curDef=def*(1 - adaptRate*(1-Math.exp(-w/4)));
    pts+=`${40+w*43},${160-curDef/1200*125} `;
  }
  const endDef=Math.round(curDef), drop=Math.round(def-curDef);
  document.getElementById('kEff').textContent=endDef+' kcal';
  document.getElementById('kDrop').textContent='-'+drop+' kcal';
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#059669" stroke-width="3" points="${pts}"/>
    <text x="50" y="28" font-size="12" font-weight="800" fill="#059669">12 周真实热量缺口衰减曲线（从 ${def} 跌至 ${endDef} kcal）</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>极端节食（${def} kcal）会触发大脑的“饥荒警报”，疯狂下调 ${drop} kcal 的基础体温和日常动作消耗！温和赤字 + 高蛋白护肌才能绕过代谢暴跌！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
