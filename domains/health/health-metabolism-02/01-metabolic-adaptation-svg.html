<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 平台期真相：基础代谢与 NEAT 滑坡曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .preset-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .ctrl-box { padding:10px 14px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface-alt); margin-bottom:14px; }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📉 平台期真相：基础代谢与 NEAT 滑坡曲线</h1>
        <p>误区：每天少吃 800 大卡，12 周就能按小学算术稳稳瘦 9 公斤。真相：身体把断崖节食当成“饥荒”，会自动下调体温、让你不想动弹（NEAT 暴跌），偷偷把你的赤字全部吞掉！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="preset-row">
        <button class="tax-btn" id="playBtn" onclick="playWeeks()">▶ 播放 12 周演化</button>
        <button class="pill active" onclick="setPlan('extreme',this)">🥶 极端节食 (-850 kcal/天)</button>
        <button class="pill" onclick="setPlan('moderate',this)">🌿 温和赤字 (-350 kcal/天)</button>
        <button class="pill" onclick="setPlan('refeed',this)">🔄 温和赤字 + 周末碳水回血</button>
      </div>
      <div class="ctrl-box">
        <label><span>查看第几周状态</span><span id="vWk">第 12 周</span></label>
        <input type="range" id="sWk" min="1" max="12" value="12" oninput="onSlide()">
      </div>

      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>

      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">理论预期累计减重</div><div class="k-val" id="kExp" style="color:var(--tax-muted);">—</div></div>
        <div class="kpi"><div class="k-lbl">代谢适应后真实减重</div><div class="k-val" id="kReal" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">身体暗中省电（NEAT+BMR 降幅）</div><div class="k-val" id="kDrop" style="color:var(--tax-red);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const PLANS = {
      extreme:  { name:'极端节食', def:850, adaptRate:0.46, maxDrop:560 },
      moderate: { name:'温和赤字', def:350, adaptRate:0.16, maxDrop:140 },
      refeed:   { name:'温和+周期回血', def:320, adaptRate:0.09, maxDrop:75 }
    };
    let plan = 'extreme';
    let curWk = 12;
    let timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }

    function setPlan(p, btn){
      plan = p;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone();
      playWeeks();
    }

    function onSlide(){
      if(timer){ clearInterval(timer); timer=null; }
      curWk = +document.getElementById('sWk').value;
      markDone();
      draw();
    }

    function playWeeks(){
      if(timer) clearInterval(timer);
      markDone();
      curWk = 1;
      document.getElementById('sWk').value = 1;
      timer = setInterval(()=>{
        curWk++;
        document.getElementById('sWk').value = curWk;
        draw();
        if(curWk >= 12){ clearInterval(timer); timer = null; }
      }, 140);
      draw();
    }

    function calcSeries(pKey){
      const p = PLANS[pKey];
      const exp = [0], real = [0], drops = [0];
      let cumExp = 0, cumReal = 0;
      for(let w=1; w<=12; w++){
        const drop = p.maxDrop * (1 - Math.exp(-p.adaptRate * w));
        const effDef = Math.max(40, p.def - drop);
        cumExp += (p.def * 7) / 7700;
        cumReal += (effDef * 7) / 7700;
        exp.push(cumExp);
        real.push(cumReal);
        drops.push(drop);
      }
      return { exp, real, drops };
    }

    function draw(){
      document.getElementById('vWk').textContent = `第 ${curWk} 周`;
      const { exp, real, drops } = calcSeries(plan);
      const x0=56, x1=610, yMin=28, yMax=192;
      const maxKg = 10;
      const toX = w => x0 + (w/12)*(x1-x0);
      const toY = kg => yMax - (Math.min(maxKg, kg)/maxKg)*(yMax - yMin);

      let ptsE = [], ptsR = [];
      for(let w=0; w<=curWk; w++){
        ptsE.push(`${toX(w).toFixed(1)},${toY(exp[w]).toFixed(1)}`);
        ptsR.push(`${toX(w).toFixed(1)},${toY(real[w]).toFixed(1)}`);
      }
      const gap = exp[curWk] - real[curWk];

      document.getElementById('svg').innerHTML = `
        ${[0,2,4,6,8,10].map(k=>`<line x1="${x0}" y1="${toY(k)}" x2="${x1}" y2="${toY(k)}" stroke="var(--tax-border)" stroke-width="1"/><text x="${x0-8}" y="${toY(k)+4}" text-anchor="end" font-size="11" fill="var(--tax-muted)">-${k}kg</text>`).join('')}
        ${[0,3,6,9,12].map(w=>`<text x="${toX(w)}" y="212" text-anchor="middle" font-size="11" fill="var(--tax-muted)">第${w}周</text>`).join('')}
        <polyline points="${ptsE.join(' ')}" fill="none" stroke="var(--tax-muted)" stroke-width="2.2" stroke-dasharray="6 4"/>
        <polyline points="${ptsR.join(' ')}" fill="none" stroke="${plan==='extreme'?'var(--tax-red)':'var(--tax-green)'}" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="${toX(curWk)}" cy="${toY(exp[curWk])}" r="4.5" fill="var(--tax-muted)"/>
        <circle cx="${toX(curWk)}" cy="${toY(real[curWk])}" r="6" fill="${plan==='extreme'?'var(--tax-red)':'var(--tax-green)'}"/>
        ${gap > 0.8 ? `<line x1="${toX(curWk)}" y1="${toY(exp[curWk])}" x2="${toX(curWk)}" y2="${toY(real[curWk])}" stroke="var(--tax-amber)" stroke-width="2" stroke-dasharray="3 3"/><text x="${Math.max(x0+90, toX(curWk)-10)}" y="${(toY(exp[curWk])+toY(real[curWk]))/2+4}" text-anchor="end" font-size="11.5" font-weight="800" fill="var(--tax-amber)">被省电模式吞掉 ${gap.toFixed(1)}kg</text>` : ''}
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">虚线：理论线性掉秤 · 实线：真实体重变化（${PLANS[plan].name}）</text>
      `;

      document.getElementById('kExp').textContent = `-${exp[curWk].toFixed(1)} kg`;
      document.getElementById('kReal').textContent = `-${real[curWk].toFixed(1)} kg`;
      document.getElementById('kDrop').textContent = `-${Math.round(drops[curWk])} kcal/天`;

      let aha = '';
      if(plan === 'extreme'){
        aha = `💡 <strong>顿悟时刻：</strong>极端节食前 3 周很爽，但到了第 ${curWk} 周，你的身体已悄悄开启“饥荒省电模式”，每天主动少烧 <strong>${Math.round(drops[curWk])} 大卡</strong>（少抖腿、手脚冰凉、犯困），把近一半赤字直接吞没，这就是可怕的死平台期！`;
      } else if(plan === 'moderate'){
        aha = `💡 <strong>顿悟时刻：</strong>温和赤字（-350 kcal）不会拉响大脑的饥荒警报，代谢滑坡被压在 <strong>-${Math.round(drops[curWk])} kcal/天</strong> 以内，虽然前期慢，但第 12 周能稳稳持续掉脂而不崩溃！`;
      } else {
        aha = `💡 <strong>顿悟时刻：</strong>“温和赤字 + 周末适度碳水回血”定期给瘦素（Leptin）发送“没有饥荒”的信号，几乎把代谢适应压到最低（仅 -${Math.round(drops[curWk])} kcal），是长期不反弹的科学打法！`;
      }
      document.getElementById('ahaBox').innerHTML = aha;
    }

    draw();
  </script>
</body>
</html>
