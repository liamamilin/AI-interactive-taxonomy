<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪑 健身 1 小时 vs 全天 NEAT 日常消耗</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .act-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px; }
    .card { padding:11px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; transition:all .15s; }
    .card:hover { border-color:var(--tax-primary); }
    .card.on { border-color:var(--tax-green); background:var(--tax-green-soft); }
    .card.gym.on { border-color:var(--tax-amber); background:var(--tax-amber-soft); }
    .card .t { display:flex; justify-content:space-between; font-size:13px; font-weight:800; }
    .card .s { font-size:11.5px; color:var(--tax-muted); margin-top:4px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🪑 健身 1 小时 vs 全天 NEAT 日常消耗</h1>
        <p>误区：只要每天咬牙去健身房练满 1 小时，剩下 15 个清醒小时瘫在椅子上也能狂瘦。真相：非运动性日常消耗（NEAT）的弹性高达 800+ 大卡，完全可以碾压你挥汗如雨的那 1 小时！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🧩 拼装你的一天活动清单（对比「健身房专项运动」与「零碎 NEAT 日常消耗」）：</div>
      <div class="act-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 190"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">全天总消耗 (TDEE)</div><div class="k-val" id="kTotal" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">NEAT 日常小动作</div><div class="k-val" id="kNeat" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">专项健身房运动 (EAT)</div><div class="k-val" id="kEat" style="color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const ITEMS = [
      { id:'gym', type:'eat', icon:'🏋️', name:'健身房狠练 1 小时', kcal:320, desc:'专项运动 EAT · 挥汗如雨' },
      { id:'commute', type:'neat', icon:'🚶', name:'上下班多走 6000 步', kcal:230, desc:'NEAT · 提前两站下车' },
      { id:'stand', type:'neat', icon:'🧍', name:'站立办公 3 小时', kcal:150, desc:'NEAT · 替代久坐不动' },
      { id:'chores', type:'neat', icon:'🧹', name:'做饭/收拾/遛狗 45 分', kcal:170, desc:'NEAT · 日常家务走动' },
      { id:'stairs', type:'neat', icon:'🪜', name:'全天走楼梯+起身接水', kcal:110, desc:'NEAT · 打破每小时久坐' },
      { id:'fidget', type:'neat', icon:'⚡', name:'保持日常高频微动', kcal:140, desc:'NEAT · 拒绝练完瘫痪补偿' }
    ];
    let active = new Set(['gym']);

    function toggle(id){
      if(active.has(id)) active.delete(id); else active.add(id);
      if(window.ToySDK) window.ToySDK.markCompleted();
      render();
    }

    function render(){
      document.getElementById('grid').innerHTML = ITEMS.map(it => `
        <button class="card ${it.type==='eat'?'gym':''} ${active.has(it.id)?'on':''}" onclick="toggle('${it.id}')">
          <div class="t"><span>${it.icon} ${it.name}</span><span>+${it.kcal}</span></div>
          <div class="s">${it.desc}</div>
        </button>
      `).join('');

      const bmr = 1500, tef = 180;
      let neat = 120, eat = 0; // baseline minimal NEAT 120
      ITEMS.forEach(it=>{ if(active.has(it.id)){ if(it.type==='neat') neat+=it.kcal; else eat+=it.kcal; } });
      const total = bmr + tef + neat + eat;

      const x0 = 24, maxW = 592, scale = maxW / 2900;
      const wBmr = bmr * scale, wTef = tef * scale, wEat = eat * scale, wNeat = neat * scale;

      // Reference bar: Couch potato gym-goer (bmr+tef+120+320 = 2120) vs Active non-gym (bmr+tef+920 = 2600)
      document.getElementById('svg').innerHTML = `
        <text x="${x0}" y="26" font-size="12.5" font-weight="800" fill="var(--tax-ink)">你的全天热量消耗构成（总计 ${total} kcal）</text>
        <rect x="${x0}" y="38" width="${wBmr}" height="38" rx="6" fill="var(--tax-primary-soft)" stroke="var(--tax-primary)"/>
        <text x="${x0+wBmr/2}" y="61" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-primary)">基础代谢 ${bmr}</text>

        <rect x="${x0+wBmr+2}" y="38" width="${wTef}" height="38" rx="5" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <text x="${x0+wBmr+2+wTef/2}" y="61" text-anchor="middle" font-size="10" font-weight="750" fill="var(--tax-muted)">TEF</text>

        ${wEat > 0 ? `<rect x="${x0+wBmr+wTef+4}" y="38" width="${wEat}" height="38" rx="5" fill="var(--tax-amber)"/>
        <text x="${x0+wBmr+wTef+4+wEat/2}" y="61" text-anchor="middle" font-size="11" font-weight="850" fill="#fff">健身 ${eat}</text>` : ''}

        <rect x="${x0+wBmr+wTef+wEat+(wEat>0?6:4)}" y="38" width="${wNeat}" height="38" rx="5" fill="var(--tax-green)"/>
        <text x="${x0+wBmr+wTef+wEat+(wEat>0?6:4)+wNeat/2}" y="61" text-anchor="middle" font-size="11" font-weight="850" fill="#fff">${wNeat>44?('NEAT '+neat):neat}</text>

        <line x1="${x0}" y1="104" x2="${x0+maxW}" y2="104" stroke="var(--tax-border)"/>
        <text x="${x0}" y="128" font-size="12" font-weight="750" fill="var(--tax-muted)">对照组 A：每天健身 1h + 其余 15h 久坐瘫痪（2,120 kcal）</text>
        <rect x="${x0}" y="136" width="${2120*scale}" height="12" rx="4" fill="var(--tax-amber)" opacity="0.55"/>
        <text x="${x0}" y="168" font-size="12" font-weight="750" fill="var(--tax-muted)">对照组 B：不去健身房但全天 NEAT 拉满（2,600 kcal）</text>
        <rect x="${x0}" y="176" width="${2600*scale}" height="12" rx="4" fill="var(--tax-green)" opacity="0.65"/>
      `;

      document.getElementById('kTotal').textContent = total + ' kcal';
      document.getElementById('kNeat').textContent = neat + ' kcal';
      document.getElementById('kEat').textContent = eat + ' kcal';

      let aha = '';
      if(eat > 0 && neat <= 260){
        aha = `💡 <strong>顿悟时刻：</strong>你辛苦在健身房练了 1 小时（+${eat} 大卡），但其余 15 小时几乎瘫着（NEAT 仅 ${neat} 大卡），总消耗只有 <strong>${total} 大卡</strong>——甚至不如一个不去健身房但爱走动的人！试着点亮几个绿色日常习惯看看。`;
      } else if(neat > eat * 1.5){
        aha = `💡 <strong>顿悟时刻：</strong>NEAT（<strong>${neat} 大卡</strong>）已经彻底反超健身房 1 小时！真正拉开人与人“易瘦体质”差距的，往往不是健身房里的那 1 小时，而是剩下 15 小时里积少成多的日常活动量！`;
      } else {
        aha = `💡 <strong>顿悟时刻：</strong>健身房运动（塑形+保肌）配合高 NEAT 日常活跃度，你的全天总消耗达到了 <strong>${total} 大卡</strong>，这才是既不挨饿又能稳步减脂的王道组合。`;
      }
      document.getElementById('ahaBox').innerHTML = aha;
    }

    render();
  </script>
</body>
</html>
