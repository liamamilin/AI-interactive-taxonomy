<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👟 海弗利克极限：染色体端粒鞋带头磨损（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>👟 海弗利克极限：染色体端粒鞋带头磨损（SVG）</h1><p>误区：只要吃够营养，人体细胞就能永远无限分裂更新下去。真相：DNA 复制机制天生漏掉最末端一小截，每分裂一次端粒“鞋带头”就短一截，磨光后细胞就必须停工以免癌变！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>细胞累计分裂代数</span><span id="vDiv">30 次</span></label><input type="range" id="sDiv" min="0" max="60" value="30" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>氧化应激/熬夜加速磨损率</span><span id="vOx">30%</span></label><input type="range" id="sOx" min="0" max="80" value="30" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">剩余端粒长度</div><div class="k-val" id="kTel" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">细胞状态</div><div class="k-val" id="kSt">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const div=+document.getElementById('sDiv').value, ox=+document.getElementById('sOx').value;
  document.getElementById('vDiv').textContent=div+' 次'; document.getElementById('vOx').textContent=ox+'%';
  const len=Math.max(0, Math.round(100 - div*1.6*(1+ox/150)));
  const dead=len<=10;
  document.getElementById('kTel').textContent=len+'%';
  document.getElementById('kSt').textContent=dead?'达到海弗利克极限 (停止分裂)':'健康分裂中';
  document.getElementById('kSt').style.color=dead?'#ef4444':'#059669';
  const capW=Math.max(4, len*0.8);
  document.getElementById('svg').innerHTML=`
    <rect x="${120-capW}" y="70" width="${capW}" height="38" rx="6" fill="#f59e0b"/>
    <rect x="120" y="70" width="320" height="38" rx="4" fill="#0284c7"/>
    <rect x="440" y="70" width="${capW}" height="38" rx="6" fill="#f59e0b"/>
    <text x="280" y="94" text-anchor="middle" font-size="14" font-weight="850" fill="#fff">核心基因 DNA 编码区</text>
    <text x="280" y="45" text-anchor="middle" font-size="13" font-weight="800" fill="#f59e0b">两侧橙色端粒保护帽剩余: ${len}%</text>
    <text x="280" y="148" text-anchor="middle" font-size="12.5" fill="var(--tax-muted)">${dead?'⚠️ 端粒磨光！再分裂会伤及核心基因，细胞被迫锁死进入衰老':'每次分裂端粒变短一点，充当细胞的生命倒计时'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>端粒缩短其实是一把防癌安全锁！它宁可让细胞在分裂 50 次后退休（海弗利克极限），也不允许端粒归零后染色体乱粘引发癌症！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
