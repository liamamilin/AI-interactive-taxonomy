<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏱️ 肌梭拉警报 vs 高尔基腱器放行时间轴（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⏱️ 肌梭拉警报 vs 高尔基腱器放行时间轴（SVG）</h1><p>误区：压腿时一上一下猛弹、疼得越惨拉得越开。真相：猛拉会立刻触发“肌梭牵张反射”强行收缩肌肉保护肌腱不被扯断；只有保持静止 20~30 秒，高尔基腱器才会发出“安全松手”指令！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>静态保持拉伸时长</span><span id="vSec">30 秒</span></label><input type="range" id="sSec" min="2" max="60" value="30" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>动作猛拉/弹震冲击度</span><span id="vJerk">15%</span></label><input type="range" id="sJerk" min="0" max="100" value="15" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">肌梭防卫反抗力</div><div class="k-val" id="kSp" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">真实柔韧延展收获</div><div class="k-val" id="kRel" style="color:#059669;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const sec=+document.getElementById('sSec').value, jerk=+document.getElementById('sJerk').value;
  document.getElementById('vSec').textContent=sec+' 秒'; document.getElementById('vJerk').textContent=jerk+'%';
  const sp=Math.min(98, Math.round(jerk*0.75 + 45*Math.exp(-sec/12)));
  const rel=Math.max(5, Math.round(95*(1-Math.exp(-sec/18)) - jerk*0.45));
  document.getElementById('kSp').textContent=sp+'%';
  document.getElementById('kRel').textContent=rel+' 分';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#ef4444">肌梭防御性反向收缩 (防扯断): ${sp}%</text>
    <rect x="20" y="44" width="${sp*5.2}" height="24" rx="6" fill="#ef4444"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#059669">高尔基腱器放行放松度: ${rel} 分</text>
    <rect x="20" y="112" width="${rel*5.2}" height="24" rx="6" fill="#059669"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">静待 25~30 秒 + 深呼气，神经系统才会解除防卫锁，真正打开活动度</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>拉伸本质上不是“把橡皮筋硬拉长”，而是“说服神经系统解除保护锁”！猛弹只会吓得肌梭锁死（${sp}%），慢呼吸静待 ${sec} 秒才能骗过防卫！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
