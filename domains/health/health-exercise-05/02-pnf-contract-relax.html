<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ PNF 神经拉伸术：先发力再放松的黑科技</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚡ PNF 神经拉伸术：先发力再放松的黑科技</h1><p>误区：柔韧性只能靠每天忍痛硬掰慢慢熬。真相：利用 PNF“先绷紧抗阻 6 秒再彻底吐气放松”，高尔基腱器会被强力激活并当场关闭肌肉张力，活动度一分钟就能肉眼可见地突破！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>PNF 阶段一：主动等长对抗发力度</span><span id="vCon">65%</span></label><input type="range" id="sCon" min="10" max="90" value="65" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>阶段二：呼气放松再延展秒数</span><span id="vSec">20 秒</span></label><input type="range" id="sSec" min="5" max="40" value="20" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">普通静态拉伸幅度</div><div class="k-val">+8°</div></div>
        <div class="kpi"><div class="k-lbl">PNF 黑科技即时突破</div><div class="k-val" id="kPnf" style="color:#059669;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const con=+document.getElementById('sCon').value, sec=+document.getElementById('sSec').value;
  document.getElementById('vCon').textContent=con+'%'; document.getElementById('vSec').textContent=sec+' 秒';
  const gain=Math.round(8 + con*0.18 + sec*0.2);
  document.getElementById('kPnf').textContent='+'+gain+'°';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#64748b">传统忍痛静态拉伸: +8°</text>
    <rect x="20" y="44" width="140" height="24" rx="6" fill="#64748b"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#059669">PNF 先绷紧(${con}%)再放松(${sec}s): +${gain}°</text>
    <rect x="20" y="112" width="${Math.min(540,gain*14)}" height="24" rx="6" fill="#059669"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">先主动发力骗出高尔基腱器的“自生抑制”，随后肌纤维顺从放行</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>物理治疗师最爱的 PNF 拉伸法就是利用神经反射的“后门”：先绷紧对抗 6 秒，再深呼一口气放松，活动度当场多开 <strong>+${gain}°</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
