<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧪 乳酸阈值：为什么不是乳酸让你腿酸？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧪 乳酸阈值：为什么不是乳酸让你腿酸？</h1><p>误区：运动后肌肉酸痛全是因为有毒废料“乳酸”堵在肌肉里。真相：乳酸本身其实是极好的能量燃料（能被心脏和慢肌当场回收烧掉）；真正让你腿软发酸的是伴随无氧糖酵解产生的氢离子 H+ 酸化！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前跑步配速强度</span><span id="vSpd">78%</span></label><input type="range" id="sSpd" min="30" max="100" value="78" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>有氧耐力基础 (乳酸清除速度)</span><span id="vClr">65%</span></label><input type="range" id="sClr" min="30" max="100" value="65" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">血乳酸浓度</div><div class="k-val" id="kLac">—</div></div>
        <div class="kpi"><div class="k-lbl">能否长期维持配速</div><div class="k-val" id="kSus">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const spd=+document.getElementById('sSpd').value, clr=+document.getElementById('sClr').value;
  document.getElementById('vSpd').textContent=spd+'%'; document.getElementById('vClr').textContent=clr+'%';
  const thresh=55 + clr*0.32;
  const lac=Math.max(1.0, (1.2 + Math.exp((spd-thresh)/12)*2.8)).toFixed(1);
  const over=parseFloat(lac)>4.0;
  document.getElementById('kLac').textContent=lac+' mmol/L';
  document.getElementById('kLac').style.color=over?'#ef4444':'#059669';
  document.getElementById('kSus').textContent=over?'突破阈值 (几分钟后力竭)':'稳态可巡航';
  let pts='';
  for(let x=30;x<=100;x+=3){
    const l=Math.min(14, 1.2 + Math.exp((x-thresh)/12)*2.8);
    pts+=`${40+(x-30)/70*520},${160-l*9.5} `;
  }
  const cx=40+(spd-30)/70*520, cy=160-Math.min(14,parseFloat(lac))*9.5;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <line x1="40" y1="122" x2="560" y2="122" stroke="#f59e0b" stroke-dasharray="4 3"/>
    <text x="45" y="116" font-size="11" fill="#f59e0b">4.0 mmol/L 乳酸拐点</text>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="${over?'#ef4444':'#059669'}"/>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>长跑高手跑得快不是因为他们不产乳酸，而是他们的线粒体清除乳酸能力（当前拐点 ${Math.round(thresh)}%）极高，能一边产一边烧掉！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
