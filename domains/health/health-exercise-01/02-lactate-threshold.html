<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧪 乳酸阈值：为什么不是乳酸让你腿酸？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .scen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:9px; margin-bottom:12px; }
    .s-btn { padding:10px 11px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .s-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .s-btn .t { font-size:13px; font-weight:800; }
    .s-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .pill { padding:7px 12px; border-radius:999px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-green); color:#fff; border-color:var(--tax-green); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧪 乳酸阈值：为什么不是乳酸让你腿酸？</h1>
        <p>误区：跑步腿灼痛、第二天肌肉酸痛都是“乳酸堆积有毒”。真相：乳酸其实是被冤枉的<strong>优质心脏与肌肉燃料</strong>！真正让你大腿火辣灼烧的，是糖酵解伴随溢出的<strong>氢离子 H+</strong>——超过乳酸阈值，排水管来不及清就会瞬间爆缸！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="scen-grid" id="grid"></div>
      <div class="bar">
        <span style="font-size:12.5px;font-weight:750;color:var(--tax-muted);">跑者线粒体排水管口径：</span>
        <button class="pill active" onclick="setFit('novice',this)">🐣 新手跑者（清酸能力 45）</button>
        <button class="pill" onclick="setFit('pro',this)">🏆 资深耐力跑者（清酸能力 82）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">进水口：产酸速率</div><div class="k-val" id="kIn" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">排水口：线粒体回收速率</div><div class="k-val" id="kOut" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">H+ 氢离子灼烧状态</div><div class="k-val" id="kBurn">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const PACES = [
      { id:'easy', icon:'🚶', name:'轻松有氧跑', desc:'心率 135 · 产酸 25', prod:25 },
      { id:'tempo', icon:'🏃', name:'舒适节奏跑', desc:'心率 158 · 产酸 52', prod:52 },
      { id:'lt', icon:'🔥', name:'阈值边缘冲刺', desc:'心率 172 · 产酸 76', prod:76 },
      { id:'allout', icon:'💥', name:'全力无氧爆冲', desc:'心率 188 · 产酸 98', prod:98 }
    ];
    let cur = 'tempo', fit = 'novice';

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function pick(id){ cur = id; markDone(); draw(); }
    function setFit(f, btn){
      fit = f;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }

    function draw(){
      document.getElementById('grid').innerHTML = PACES.map(p => `
        <button class="s-btn ${cur===p.id?'active':''}" onclick="pick('${p.id}')">
          <div class="t">${p.icon} ${p.name}</div>
          <div class="s">${p.desc}</div>
        </button>
      `).join('');

      const p = PACES.find(x=>x.id===cur);
      const drain = fit === 'pro' ? 82 : 45;
      const net = p.prod - drain;
      const level = net <= 0 ? Math.max(14, Math.round((p.prod / drain) * 42)) : Math.min(98, Math.round(52 + net * 1.1));
      const overflow = net > 0;
      const tankCol = overflow ? 'var(--tax-red)' : 'var(--tax-green)';
      const tankSoft = overflow ? 'var(--tax-red-soft)' : 'var(--tax-green-soft)';

      const fillH = Math.round((level / 100) * 126);
      document.getElementById('svg').innerHTML = `
        <rect x="28" y="42" width="146" height="54" rx="10" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="2"/>
        <text x="101" y="66" text-anchor="middle" font-size="13" font-weight="850" fill="var(--tax-amber)">🚰 糖酵解产酸</text>
        <text x="101" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="var(--tax-ink)">速率 ${p.prod} 单位/分</text>
        <line x1="174" y1="69" x2="236" y2="69" stroke="var(--tax-amber)" stroke-width="${3 + p.prod/22}" stroke-linecap="round"/>

        <rect x="240" y="34" width="160" height="140" rx="12" fill="var(--tax-surface-alt)" stroke="${tankCol}" stroke-width="2.4"/>
        <rect x="244" y="${170 - fillH}" width="152" height="${fillH}" rx="8" fill="${tankSoft}"/>
        <text x="320" y="88" text-anchor="middle" font-size="14" font-weight="900" fill="${tankCol}">${overflow ? '🔥 突破阈值！' : '✅ 动态平衡'}</text>
        <text x="320" y="112" text-anchor="middle" font-size="12" font-weight="800" fill="var(--tax-ink)">H+ 堆积液位 ${level}%</text>
        <text x="320" y="136" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${overflow ? '肌肉 pH 骤降 · 灼痛力竭' : '乳酸正被循环当燃料烧'}</text>

        <line x1="400" y1="142" x2="462" y2="142" stroke="var(--tax-green)" stroke-width="${3 + drain/20}" stroke-linecap="round"/>
        <rect x="466" y="112" width="146" height="58" rx="10" fill="var(--tax-green-soft)" stroke="var(--tax-green)" stroke-width="2"/>
        <text x="539" y="136" text-anchor="middle" font-size="12.5" font-weight="850" fill="var(--tax-green)">♻️ 线粒体回收泵</text>
        <text x="539" y="156" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-ink)">上限 ${drain} 单位/分</text>

        <text x="320" y="202" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-muted)">提示：第二天腿疼叫 DOMS（肌纤维微撕裂），运动后 1 小时乳酸早就清空回收了！</text>
      `;

      document.getElementById('kIn').textContent = p.prod + ' / min';
      document.getElementById('kOut').textContent = drain + ' / min';
      const kB = document.getElementById('kBurn');
      kB.textContent = overflow ? `爆缸过载 (+${net}) 🔥` : `稳态可控 ✅`;
      kB.style.color = tankCol;

      document.getElementById('ahaBox').innerHTML = overflow
        ? `💡 <strong>顿悟时刻：</strong>进水速度（${p.prod}）已超过线粒体排水管上限（${drain}），大量 <strong>H+ 氢离子</strong> 蓄积让肌肉发酸发硬！试着把身份切换到 <strong>🏆 资深耐力跑者</strong>，看看同一配速下为什么大神面不改色！`
        : `💡 <strong>顿悟时刻：</strong>水池保持稳态！此时产生的乳酸不仅没害，反而正通过“乳酸穿梭”被心肌和慢肌纤维当成超级燃料二次燃烧——提升耐力的核心就是把右侧<strong>线粒体排水管</strong>练粗！`;
    }

    draw();
  </script>
</body>
</html>
