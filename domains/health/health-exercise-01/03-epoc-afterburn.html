<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 EPOC 后燃效应：运动完躺着也在多烧多少卡？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🔥 EPOC 后燃效应：运动完躺着也在多烧多少卡？</h1>
        <p>误区：做完 15 分钟高强度 HIIT，接下来 48 小时躺着能狂燃 500 大卡。真相：EPOC（运动后过量氧耗）确实存在，但运动生理学实测它只占运动本身消耗的 <strong>6%–15%</strong>——别被健身房营销神话忽悠了！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" id="playBtn" onclick="runRace()">▶ 播放运动 + 赛后 12h 燃脂对比</button>
        <button class="pill active" onclick="setMode('hiit20',this)">🔥 20分 HIIT vs 45分 慢跑</button>
        <button class="pill" onclick="setMode('hiit30',this)">⚡ 30分 极限 HIIT vs 30分 慢跑</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 210"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">🔥 HIIT 总消耗（含后燃）</div><div class="k-val" id="kHiit" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">🏃 慢跑总消耗（含后燃）</div><div class="k-val" id="kJog" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">HIIT 后燃额外红利</div><div class="k-val" id="kEpoc" style="color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const DATA = {
      hiit20: { hLbl:'🔥 20 分钟高强度 HIIT', hEx:230, hEpoc:35, jLbl:'🏃 45 分钟舒适 Zone 2 慢跑', jEx:390, jEpoc:24 },
      hiit30: { hLbl:'⚡ 30 分钟极限 HIIT', hEx:350, hEpoc:52, jLbl:'🏃 30 分钟轻松慢跑', jEx:260, jEpoc:16 }
    };
    let mode = 'hiit20', pct = 100, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setMode(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); runRace();
    }
    function runRace(){
      if(timer) clearInterval(timer);
      markDone();
      pct = 0;
      timer = setInterval(()=>{
        pct += 4;
        if(pct >= 100){ pct = 100; clearInterval(timer); timer=null; }
        draw();
      }, 35);
      draw();
    }

    function draw(){
      const d = DATA[mode];
      const maxK = 460;
      const scale = 470 / maxK;
      const pEx = Math.min(1, pct / 65);
      const pEp = Math.max(0, (pct - 65) / 35);

      function track(y, lbl, ex, ep, col){
        const wEx = ex * pEx * scale;
        const wEp = ep * pEp * scale;
        const curTot = Math.round(ex * pEx + ep * pEp);
        return `
          <text x="24" y="${y}" font-size="13" font-weight="850" fill="var(--tax-ink)">${lbl}</text>
          <rect x="24" y="${y+10}" width="${wEx.toFixed(1)}" height="32" rx="6" fill="${col}"/>
          ${wEx > 70 ? `<text x="${24+wEx/2}" y="${y+30}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">运动中 ${Math.round(ex*pEx)}</text>` : ''}
          ${wEp > 1 ? `<rect x="${24+wEx+2}" y="${y+10}" width="${wEp.toFixed(1)}" height="32" rx="5" fill="var(--tax-amber)"/>` : ''}
          <text x="${Math.min(618, 24+wEx+wEp+10)}" y="${y+30}" font-size="12" font-weight="850" fill="var(--tax-ink)">${curTot} kcal</text>
        `;
      }

      document.getElementById('svg').innerHTML = `
        ${track(36, d.hLbl, d.hEx, d.hEpoc, 'var(--tax-red)')}
        <line x1="24" y1="104" x2="616" y2="104" stroke="var(--tax-border)" stroke-dasharray="4 4"/>
        ${track(132, d.jLbl, d.jEx, d.jEpoc, 'var(--tax-green)')}
        <text x="24" y="196" font-size="11.5" font-weight="750" fill="var(--tax-amber)">■ 橙色尾段 = 赛后躺着多烧的 EPOC 后燃效应（约占运动消耗的 6%–15%）</text>
      `;

      document.getElementById('kHiit').textContent = `${d.hEx + d.hEpoc} kcal (含后燃 ${d.hEpoc})`;
      document.getElementById('kJog').textContent = `${d.jEx + d.jEpoc} kcal (含后燃 ${d.jEpoc})`;
      document.getElementById('kEpoc').textContent = `+${d.hEpoc} kcal（约半个苹果）`;

      document.getElementById('ahaBox').innerHTML = mode === 'hiit20'
        ? `💡 <strong>顿悟时刻：</strong>20 分钟 HIIT 练到怀疑人生，后燃 EPOC 其实只多烧了约 <strong>${d.hEpoc} 大卡</strong>（半个苹果），总消耗（${d.hEx+d.hEpoc}）反而不如轻松慢跑 45 分钟（${d.jEx+d.jEpoc}）！HIIT 的真正价值是<strong>省时高效提升心肺上限</strong>，而不是靠神话般的后燃躺瘦！`
        : `💡 <strong>顿悟时刻：</strong>同等 30 分钟下，极限 HIIT 的确比慢跑多烧 <strong>${(d.hEx+d.hEpoc)-(d.jEx+d.jEpoc)} 大卡</strong>（时间效率高），但对神经和关节恢复压力也大得多，每周 1–2 次搭配日常有氧才是黄金组合！`;
    }

    draw();
  </script>
</body>
</html>
