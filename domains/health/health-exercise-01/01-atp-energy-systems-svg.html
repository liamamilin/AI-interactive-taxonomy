<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ 三大供能系统接力赛</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⚡ 三大供能系统接力赛</h1>
        <p>误区：跑步前 30 分钟全是无氧供能，30 分钟后才突然切换到有氧烧脂。真相：从迈出第一步起三台发动机就同时点火，只是随着持续时间拉长，主导接力棒在 10 秒和 2 分钟发生剧烈交接！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="playRelay()">▶ 播放全流程接力</button>
        <button class="pill active" onclick="pickIdx(0,this)">🏋️ 极限举重 (5秒)</button>
        <button class="pill" onclick="pickIdx(1,this)">⚡ 百米冲刺 (12秒)</button>
        <button class="pill" onclick="pickIdx(2,this)">🔥 400米死磕 (60秒)</button>
        <button class="pill" onclick="pickIdx(3,this)">🏃 3000米跑 (12分)</button>
        <button class="pill" onclick="pickIdx(4,this)">🚴 马拉松 (90分)</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">⚡ 磷酸原 ATP-CP（火箭）</div><div class="k-val" id="kAtp" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">🔥 无氧糖酵解（涡轮）</div><div class="k-val" id="kGly" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">🫁 有氧氧化（混动巡航）</div><div class="k-val" id="kAer" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    // Log-time axis x in [0..100]: 0=1s, 25=10s, 50=60s, 75=10min, 100=90min
    const EVENTS = [
      { pos:12, name:'5 秒极限举重', atp:90, gly:8, aer:2,
        aha:'💡 <strong>顿悟时刻：</strong>前 10 秒全靠肌肉里现成的 <strong>ATP-CP 磷酸原火箭</strong>瞬间喷射爆发力（占 90%），不需要氧气也不产酸，但燃料箱 10 秒就见底，这就是为什么极限卧推举不了第 6 下！' },
      { pos:26, name:'12 秒百米冲刺', atp:55, gly:40, aer:5,
        aha:'💡 <strong>顿悟时刻：</strong>百米冲刺到后半程，磷酸原火箭已经衰减，<strong>无氧糖酵解涡轮（40%）</strong>火速接棒，这就是为什么短跑选手最后 20 米开始感觉双腿灌铅！' },
      { pos:50, name:'60 秒 400 米死磕', atp:12, gly:68, aer:20,
        aha:'💡 <strong>顿悟时刻：</strong>400 米被称为田径最痛苦项目！此时 <strong>无氧糖酵解占 68%</strong> 火力全开，大量氢离子 H+ 涌出，而有氧系统还在爬坡赶来的路上！' },
      { pos:76, name:'12 分钟 3000 米跑', atp:2, gly:18, aer:80,
        aha:'💡 <strong>顿悟时刻：</strong>根本不需要等 30 分钟！持续运动才 <strong>2 分钟以后</strong>，<strong>有氧氧化系统</strong>就已经全面接管主导权（12 分钟时高达 80%）！' },
      { pos:95, name:'90 分钟耐力长跑', atp:1, gly:4, aer:95,
        aha:'💡 <strong>顿悟时刻：</strong>超长续航 95% 靠<strong>有氧氧化</strong>烧糖+烧脂，功率虽不如火箭爆发，却能让你连跑几小时不熄火！' }
    ];
    let pos = 12, curIdx = 0, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function pickIdx(i, btn){
      if(timer){ clearInterval(timer); timer=null; }
      curIdx = i; pos = EVENTS[i].pos;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function playRelay(){
      if(timer) clearInterval(timer);
      markDone();
      pos = 0;
      timer = setInterval(()=>{
        pos += 2;
        if(pos >= 100){ pos = 100; clearInterval(timer); timer=null; }
        curIdx = EVENTS.reduce((best, ev, i) => Math.abs(ev.pos - pos) < Math.abs(EVENTS[best].pos - pos) ? i : best, 0);
        draw();
      }, 45);
      draw();
    }

    function sysAt(p){
      const atp = Math.round(98 * Math.exp(-Math.pow(p / 24, 1.8)));
      const aer = Math.round(96 / (1 + Math.exp(-(p - 52) / 10)));
      const gly = Math.max(2, Math.min(82, 100 - atp - aer));
      const sum = atp + gly + aer;
      return { atp: Math.round(atp/sum*100), gly: Math.round(gly/sum*100), aer: 100 - Math.round(atp/sum*100) - Math.round(gly/sum*100) };
    }

    function draw(){
      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = p => x0 + (p/100)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pA=[], pG=[], pO=[];
      for(let p=0; p<=100; p+=2){
        const s = sysAt(p);
        pA.push(`${toX(p).toFixed(1)},${toY(s.atp).toFixed(1)}`);
        pG.push(`${toX(p).toFixed(1)},${toY(s.gly).toFixed(1)}`);
        pO.push(`${toX(p).toFixed(1)},${toY(s.aer).toFixed(1)}`);
      }
      const now = sysAt(pos);

      document.getElementById('svg').innerHTML = `
        ${[{p:0,t:'1秒'},{p:25,t:'10秒'},{p:50,t:'1分钟'},{p:75,t:'10分钟'},{p:100,t:'90分钟'}].map(tk=>`
          <line x1="${toX(tk.p)}" y1="${yMin}" x2="${toX(tk.p)}" y2="${yMax}" stroke="var(--tax-border)" stroke-dasharray="3 3"/>
          <text x="${toX(tk.p)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${tk.t}</text>
        `).join('')}
        <polyline points="${pA.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3"/>
        <polyline points="${pG.join(' ')}" fill="none" stroke="var(--tax-amber)" stroke-width="3"/>
        <polyline points="${pO.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3.2"/>
        <line x1="${toX(pos)}" y1="${yMin}" x2="${toX(pos)}" y2="${yMax}" stroke="var(--tax-ink)" stroke-width="1.6" stroke-dasharray="4 3"/>
        <circle cx="${toX(pos)}" cy="${toY(now.atp)}" r="5.5" fill="var(--tax-red)"/>
        <circle cx="${toX(pos)}" cy="${toY(now.gly)}" r="5.5" fill="var(--tax-amber)"/>
        <circle cx="${toX(pos)}" cy="${toY(now.aer)}" r="5.5" fill="var(--tax-green)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-red)">● 磷酸原(0-10s)</text>
        <text x="${x0+125}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-amber)">● 无氧糖酵解(15s-2m)</text>
        <text x="${x0+290}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-green)">● 有氧氧化(2m+主导)</text>
      `;

      document.getElementById('kAtp').textContent = now.atp + '%';
      document.getElementById('kGly').textContent = now.gly + '%';
      document.getElementById('kAer').textContent = now.aer + '%';
      document.getElementById('ahaBox').innerHTML = EVENTS[curIdx].aha;
    }

    draw();
  </script>
</body>
</html>
