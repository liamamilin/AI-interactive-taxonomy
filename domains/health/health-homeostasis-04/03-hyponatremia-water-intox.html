<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚨 水中毒警告：马拉松后只猛灌纯净水为什么致命？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .scen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:9px; margin-bottom:14px; }
    .s-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .s-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .s-btn .t { font-size:13px; font-weight:800; }
    .s-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🚨 水中毒警告：马拉松后只猛灌纯净水为什么致命？</h1>
        <p>误区：水是生命之源，剧烈暴汗后多灌几大瓶纯净水绝对只有好处没有坏处。真相：汗液带走了大量钠盐，如果只猛灌纯水会把血液稀释成“低渗液”，水分顺着渗透压疯狂倒灌进脑细胞，引发致命<strong>脑水肿（低钠血症）</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🏃 情景：高温跑完半马暴汗 2.5 升后，选择你的补水方式，观察脑细胞渗透压变化：</div>
      <div class="scen-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">血钠浓度（正常 135–145）</div><div class="k-val" id="kNa">—</div></div>
        <div class="kpi"><div class="k-lbl">脑细胞体积状态</div><div class="k-val" id="kCell">—</div></div>
        <div class="kpi"><div class="k-lbl">医学安全评估</div><div class="k-val" id="kSafe">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const SCENS = [
      { id:'elec', icon:'🧂', name:'少量多次补电解质盐水', desc:'补水 1.2L + 钠盐 1200mg', na:140, cellR:46, state:'等渗平稳 ✅', safe:'完全安全 🌿', col:'var(--tax-green)', soft:'var(--tax-green-soft)', arrow:'双向平衡',
        aha:'💡 <strong>顿悟时刻：</strong>完美等渗补水！电解质水同时补回水分和钠离子，细胞内外渗透压维持在 <strong>140 mmol/L</strong> 黄金平衡，既解除脱水又不撑胀大脑！' },
      { id:'mild', icon:'💧', name:'狂喝 2.5L 纯净水不补盐', desc:'血钠被明显稀释', na:129, cellR:58, state:'轻度吸水肿胀 ⚠️', safe:'头晕恶心/抽筋 ⚠️', col:'var(--tax-amber)', soft:'var(--tax-amber-soft)', arrow:'水分缓慢内灌 →',
        aha:'💡 <strong>顿悟时刻：</strong>血钠已经跌破 135 警戒线（<strong>129 mmol/L</strong>）！此时血液比细胞内部更“淡”，水分子开始逆向钻进肌肉和脑细胞里，引起典型的头晕、反胃和腿抽筋！' },
      { id:'fatal', icon:'🚨', name:'1 小时猛灌 4.5L 纯净水', desc:'严重稀释性低钠血症！', na:118, cellR:74, state:'💥 颅内压飙升脑水肿!', safe:'昏迷/致死急救 🚨', col:'var(--tax-red)', soft:'var(--tax-red-soft)', arrow:'水分疯狂倒灌!! →→',
        aha:'💡 <strong>顿悟时刻：</strong>坚硬的颅骨没有膨胀空间！血钠跌到 <strong>118 mmol/L</strong> 时，海量水分涌入脑细胞导致剧烈脑水肿与脑疝——马拉松赛场真正致死的常不是脱水，而是<strong>盲目狂灌纯水引发的水中毒</strong>！' }
    ];
    let cur = 'fatal';

    function pick(id){ cur = id; if(window.ToySDK) window.ToySDK.markCompleted(); draw(); }

    function draw(){
      document.getElementById('grid').innerHTML = SCENS.map(s => `
        <button class="s-btn ${cur===s.id?'active':''}" onclick="pick('${s.id}')">
          <div class="t">${s.icon} ${s.name}</div>
          <div class="s">${s.desc}</div>
        </button>
      `).join('');

      const s = SCENS.find(x=>x.id===cur);
      document.getElementById('svg').innerHTML = `
        <rect x="24" y="24" width="230" height="156" rx="14" fill="var(--tax-primary-soft)" stroke="var(--tax-primary)" stroke-width="2"/>
        <text x="139" y="54" text-anchor="middle" font-size="13" font-weight="850" fill="var(--tax-primary)">🩸 血液（细胞外液）</text>
        <text x="139" y="96" text-anchor="middle" font-size="24" font-weight="900" fill="${s.col}">${s.na} mmol/L</text>
        <text x="139" y="124" text-anchor="middle" font-size="11.5" fill="var(--tax-muted)">血钠浓度（正常 135–145）</text>
        <text x="139" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="${s.col}">${s.arrow}</text>

        <rect x="330" y="16" width="286" height="172" rx="18" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="3"/>
        <text x="473" y="36" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-muted)">坚硬颅骨边界（无扩张余地）</text>
        <circle cx="473" cy="112" r="${s.cellR}" fill="${s.soft}" stroke="${s.col}" stroke-width="3"/>
        <text x="473" y="108" text-anchor="middle" font-size="13.5" font-weight="900" fill="${s.col}">🧠 脑细胞</text>
        <text x="473" y="128" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-ink)">${s.state}</text>
      `;

      const kN = document.getElementById('kNa'); kN.textContent = s.na + ' mmol/L'; kN.style.color = s.col;
      const kC = document.getElementById('kCell'); kC.textContent = s.state; kC.style.color = s.col;
      const kS = document.getElementById('kSafe'); kS.textContent = s.safe; kS.style.color = s.col;
      document.getElementById('ahaBox').innerHTML = s.aha;
    }

    draw();
  </script>
</body>
</html>
