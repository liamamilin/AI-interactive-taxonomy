<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔄 肾小球 180L 超滤与 99% 重吸收流水线（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔄 肾小球 180L 超滤与 99% 重吸收流水线（SVG）</h1><p>误区：喝多少水肾脏就只过滤多少水，排出多少尿。真相：肾脏每天把全身血液像洗衣服一样疯狂超滤出 180 升“原尿”，然后再由肾小管把 99% 的干净水和营养回收回去，只留 1% 带走垃圾！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>肾小球每日滤过原尿总量</span><span id="vGfr">180 L/天</span></label><input type="range" id="sGfr" min="90" max="200" step="10" value="180" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>身体缺水度 (抗利尿激素 ADH 回收率)</span><span id="vAdh">99.1%</span></label><input type="range" id="sAdh" min="975" max="996" value="991" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">每日回收干净水</div><div class="k-val" id="kRec" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">最终排出尿液量</div><div class="k-val" id="kOut" style="color:#059669;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const gfr=+document.getElementById('sGfr').value, adh=+document.getElementById('sAdh').value/10;
  document.getElementById('vGfr').textContent=gfr+' L/天'; document.getElementById('vAdh').textContent=adh.toFixed(1)+'%';
  const out=(gfr*(1-adh/100)).toFixed(2);
  const rec=(gfr-parseFloat(out)).toFixed(1);
  document.getElementById('kRec').textContent=rec+' L';
  document.getElementById('kOut').textContent=out+' L/天';
  document.getElementById('svg').innerHTML=`
    <rect x="30" y="55" width="160" height="75" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="110" y="88" text-anchor="middle" font-size="14" font-weight="850" fill="#0369a1">肾小球超滤</text>
    <text x="110" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#0284c7">${gfr} L 原尿</text>
    <line x1="190" y1="92" x2="265" y2="92" stroke="#0284c7" stroke-width="3"/>
    <rect x="265" y="45" width="160" height="95" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="345" y="82" text-anchor="middle" font-size="13.5" font-weight="850" fill="#047857">肾小管重吸收</text>
    <text x="345" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#059669">回收 ${rec} L (${adh.toFixed(1)}%)</text>
    <line x1="425" y1="92" x2="475" y2="92" stroke="#f59e0b" stroke-width="3"/>
    <rect x="475" y="60" width="100" height="65" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="525" y="90" text-anchor="middle" font-size="13" font-weight="850" fill="#b45309">终尿</text>
    <text x="525" y="110" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b45309">${out} L</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>肾脏采用“先全部倒出来洗一遍（${gfr} L），再把好东西全捡回去（${rec} L）”的暴力精密策略——所以任何损伤肾小球的慢性高血压和高血糖，都会直接搞坏这套超滤网！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
