<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📦 增肌最小有效剂量 vs 垃圾容量 (Junk Volume)</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .set-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:9px; margin-bottom:14px; }
    .c-btn { padding:10px 11px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .c-btn.on { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .c-btn .t { display:flex; justify-content:space-between; font-size:13px; font-weight:800; }
    .c-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📦 增肌最小有效剂量 vs 垃圾容量 (Junk Volume)</h1>
        <p>误区：一次练胸连做 8 个动作、30 组练到手臂抬不起来，增肌效果才最好。真相：单肌群每周 <strong>10–18 组高质量力竭组</strong>就已拿到 90% 的增肌红利，再往上硬堆全是只添疲劳不长肉的“垃圾容量”！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🏋️ 拼装本周单肌群（如胸肌）的训练动作计划，观察增肌净收益何时拐头向下：</div>
      <div class="set-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 220"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">本周累计有效组数</div><div class="k-val" id="kSets" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">净增肌效率得分</div><div class="k-val" id="kGain" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">容量区间判定</div><div class="k-val" id="kZone">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const EXS = [
      { id:'bench', icon:'🏋️', name:'平板杠铃卧推', sets:4, desc:'+4 组核心主项' },
      { id:'incline', icon:'📐', name:'上斜哑铃卧推', sets:4, desc:'+4 组上胸刺激' },
      { id:'dips', icon:'💪', name:'负重双杠臂屈伸', sets:4, desc:'+4 组下胸强化' },
      { id:'fly', icon:'🦋', name:'龙门架夹胸', sets:4, desc:'+4 组孤立收缩' },
      { id:'pec', icon:'⚙️', name:'蝴蝶机补充组', sets:5, desc:'+5 组高疲劳追加' },
      { id:'drop', icon:'🔥', name:'力竭超级递减组', sets:7, desc:'+7 组超量轰炸' }
    ];
    let picked = new Set(['bench', 'incline', 'dips']);

    function toggle(id){
      if(picked.has(id)){ if(picked.size > 1) picked.delete(id); } else picked.add(id);
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function netGain(s){
      // Peaks around 14–16 sets, drops into junk volume above 20
      const stim = 100 * (1 - Math.exp(-s / 7.2));
      const fatigue = Math.max(0, Math.pow(Math.max(0, s - 12), 1.75) * 0.78);
      return Math.max(10, Math.round(stim - fatigue));
    }

    function draw(){
      document.getElementById('grid').innerHTML = EXS.map(e => `
        <button class="c-btn ${picked.has(e.id)?'on':''}" onclick="toggle('${e.id}')">
          <div class="t"><span>${e.icon} ${e.name}</span><span>+${e.sets}组</span></div>
          <div class="s">${e.desc}</div>
        </button>
      `).join('');

      const sets = EXS.reduce((sum, e) => sum + (picked.has(e.id) ? e.sets : 0), 0);
      const gain = netGain(sets);
      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = s => x0 + (s/30)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pts = [];
      for(let s=0; s<=30; s+=1){
        pts.push(`${toX(s).toFixed(1)},${toY(netGain(s)).toFixed(1)}`);
      }
      const col = (sets >= 10 && sets <= 18) ? 'var(--tax-green)' : (sets > 20 ? 'var(--tax-red)' : 'var(--tax-amber)');

      document.getElementById('svg').innerHTML = `
        <rect x="${toX(10)}" y="${yMin}" width="${toX(18)-toX(10)}" height="${yMax-yMin}" fill="var(--tax-green-soft)" opacity="0.6"/>
        <text x="${toX(14)}" y="${yMin+14}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-green)">🏆 黄金甜蜜区 (10-18组)</text>
        <rect x="${toX(20)}" y="${yMin}" width="${x1-toX(20)}" height="${yMax-yMin}" fill="var(--tax-red-soft)" opacity="0.6"/>
        <text x="${toX(25)}" y="${yMin+14}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-red)">🗑️ 垃圾容量区</text>
        ${[0,5,10,15,20,25,30].map(s=>`<text x="${toX(s)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${s}组</text>`).join('')}
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="${toX(Math.min(30, sets))}" cy="${toY(gain)}" r="7" fill="${col}"/>
        <text x="${Math.min(x1-78, toX(Math.min(30,sets))+10)}" y="${Math.max(44, toY(gain)-8)}" font-size="12" font-weight="850" fill="${col}">${sets}组 · ${gain}分</text>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">单肌群周训练组数 vs 净增肌收益（刺激 − 恢复疲劳）</text>
      `;

      document.getElementById('kSets').textContent = sets + ' 组/周';
      document.getElementById('kGain').textContent = gain + ' 分';
      const kZ = document.getElementById('kZone');
      kZ.textContent = sets < 10 ? '最小有效剂量 (MEV) 偏低' : (sets <= 18 ? '黄金高效增肌区 🏆' : '垃圾容量过载 🗑️');
      kZ.style.color = col;

      document.getElementById('ahaBox').innerHTML = sets > 20
        ? `💡 <strong>顿悟时刻：</strong>你已堆到 <strong>${sets} 组</strong>，掉进了经典的<strong>垃圾容量区（Junk Volume）</strong>！后面硬凑的十几组不仅增肌信号趋近于零，还把关节和神经榨干，拖慢下一次恢复，净收益反而跌到 ${gain} 分！`
        : sets >= 10
        ? `💡 <strong>顿悟时刻：</strong>精准落在 <strong>${sets} 组黄金增肌区</strong>（净收益 <strong>${gain} 分</strong>）！把精力留给这十几组高质量、接近力竭的动作，比在健身房耗 2 小时乱做 30 组强十倍！`
        : `💡 <strong>顿悟时刻：</strong>每周 <strong>${sets} 组</strong> 已达到“最小有效剂量（MEV）”，足够上班族保住肌肉甚至缓慢进步；如果想最大化增肌，可以再加 1–2 个动作凑到 12–16 组！`;
    }

    draw();
  </script>
</body>
</html>
