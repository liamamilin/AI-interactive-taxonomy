<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📦 搬重物弯腰 vs 屈髋：腰椎力矩灾难对比</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📦 搬重物弯腰 vs 屈髋：腰椎力矩灾难对比</h1>
        <p>误区：20 公斤的快递箱不算重，顺手直腿弯腰拎起来就行。真相：腰椎后侧竖脊肌的力臂只有 5 厘米，当你伸直腿远远抓箱子（力臂 50 厘米）时，杠杆直接把 20 公斤放大成 <strong>340+ 公斤的椎间盘爆表压力</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <span style="font-size:12.5px;font-weight:800;color:var(--tax-muted);">📦 选择箱子重量，双栏实时对比两种搬运姿势对 L5/S1 腰椎的压力：</span>
        <button class="pill" onclick="setWt(10,this)">10 kg 快递箱</button>
        <button class="pill active" onclick="setWt(20,this)">20 kg 饮水桶</button>
        <button class="pill" onclick="setWt(35,this)">35 kg 搬家大箱</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">💥 直腿弯腰远抓（L5/S1压力）</div><div class="k-val" id="kBad" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">✅ 贴身屈髋硬拉（L5/S1压力）</div><div class="k-val" id="kGood" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">正确姿势瞬间减负</div><div class="k-val" id="kSave" style="color:var(--tax-primary);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let wt = 20;
    function setWt(w, btn){
      wt = w;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      // Biomechanical lever: erector spinae moment arm = 5cm; bad reach = 48cm + torso torque; good close hinge = 16cm
      const badLoad = Math.round(wt * (48 / 5) + 150);
      const goodLoad = Math.round(wt * (16 / 5) + 85);
      const savePct = Math.round((1 - goodLoad / badLoad) * 100);
      const maxBar = 550;

      function card(x, title, load, arm, col, soft, note, spine){
        const bw = Math.min(240, Math.round((load / maxBar) * 240));
        return `
          <rect x="${x}" y="18" width="284" height="180" rx="14" fill="var(--tax-surface-alt)" stroke="${col}" stroke-width="2"/>
          <text x="${x+16}" y="42" font-size="13.5" font-weight="850" fill="${col}">${title}</text>
          <text x="${x+16}" y="64" font-size="11.5" fill="var(--tax-muted)">重物水平力臂：<strong>${arm} cm</strong> · ${spine}</text>
          <text x="${x+16}" y="102" font-size="26" font-weight="900" fill="${col}">${load} <tspan font-size="12.5" fill="var(--tax-muted)">kg 椎间盘压迫</tspan></text>
          <rect x="${x+16}" y="116" width="248" height="16" rx="8" fill="var(--tax-border)"/>
          <rect x="${x+16}" y="116" width="${bw}" height="16" rx="8" fill="${col}"/>
          <rect x="${x+16}" y="148" width="248" height="34" rx="8" fill="${soft}"/>
          <text x="${x+140}" y="169" text-anchor="middle" font-size="11.5" font-weight="800" fill="${col}">${note}</text>
        `;
      }

      document.getElementById('svg').innerHTML = `
        ${card(18, '💥 错误：直腿弯腰远抓', badLoad, 48, 'var(--tax-red)', 'var(--tax-red-soft)', badLoad>340?'🚨 极高腰突/闪腰风险!':'⚠️ 腰椎剪切力过载', '圆背弯曲')}
        ${card(338, '✅ 正确：贴身屈髋屈膝', goodLoad, 16, 'var(--tax-green)', 'var(--tax-green-soft)', '🛡️ 臀腿大肌群分担主导', '脊柱中立')}
      `;

      document.getElementById('kBad').textContent = badLoad + ' kg';
      document.getElementById('kGood').textContent = goodLoad + ' kg';
      document.getElementById('kSave').textContent = `-${savePct}% 压力`;

      document.getElementById('ahaBox').innerHTML = `💡 <strong>顿悟时刻：</strong>搬起 <strong>${wt} kg</strong> 重物时，决定腰会不会闪的不是箱子有多重，而是<strong>箱子离你肚脐有多远（力臂）</strong>！把箱子紧贴小腿、屈髋蹲下发力，瞬间替腰椎卸掉 <strong>${savePct}%</strong> 的恐怖压力！`;
    }

    draw();
  </script>
</body>
</html>
