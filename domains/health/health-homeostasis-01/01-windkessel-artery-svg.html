<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🩸 弹性血管缓冲器 (Windkessel) 模拟器（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🩸 弹性血管缓冲器 (Windkessel) 模拟器（SVG）</h1><p>误区：血压只有高压高才危险，低压越低越好。真相：大动脉像弹性气囊一样在心脏舒张期回弹供血；一旦动脉硬化失去弹性，高压会冲破天际而低压暴跌，拉出危险的“大脉压差”！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>主动脉血管弹性 (高=年轻软管)</span><span id="vEl">80%</span></label><input type="range" id="sEl" min="15" max="100" value="80" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>外周小血管收缩阻力</span><span id="vRes">45%</span></label><input type="range" id="sRes" min="20" max="100" value="45" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">收缩压 (高压)</div><div class="k-val" id="kSys" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">舒张压 (低压)</div><div class="k-val" id="kDia" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">脉压差 (高压-低压)</div><div class="k-val" id="kPP">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const el=+document.getElementById('sEl').value, res=+document.getElementById('sRes').value;
  document.getElementById('vEl').textContent=el+'%'; document.getElementById('vRes').textContent=res+'%';
  const sys=Math.round(100 + (100-el)*0.65 + res*0.35);
  const dia=Math.round(52 + el*0.18 + res*0.32);
  const pp=sys-dia;
  document.getElementById('kSys').textContent=sys+' mmHg';
  document.getElementById('kDia').textContent=dia+' mmHg';
  document.getElementById('kPP').textContent=pp+' mmHg'+(pp>60?' (硬化预警!)':'');
  let pts='';
  for(let t=0;t<=40;t++){
    const x=40+t*13;
    const cyc=(t%10)/10;
    const wave=cyc<0.3?Math.sin(cyc/0.3*Math.PI):Math.exp(-(cyc-0.3)*2.5)*0.4;
    const p=dia + pp*wave;
    pts+=`${x},${165-(p-40)*0.95} `;
  }
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="165" x2="560" y2="165" stroke="#94a3b8"/>
    <polyline fill="none" stroke="${sys>140?'#ef4444':'#059669'}" stroke-width="3" points="${pts}"/>
    <text x="50" y="28" font-size="12.5" font-weight="800" fill="var(--tax-text)">实时动脉血压波形：${sys}/${dia} mmHg (弹性越高，波形越平缓保护器官)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>健康的弹性动脉就像救火水车上的缓冲气囊，能把心脏每一次喷血的剧烈冲击变成平稳水流；血管变硬（弹性降至 ${el}%）后脉压差拉大到 <strong>${pp} mmHg</strong>，极易冲击肾脏与脑微血管！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
