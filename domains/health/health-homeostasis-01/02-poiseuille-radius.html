<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚰 泊肃叶四次方定律：血管堵一半，血压飙 16 倍？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .ctrl-box { padding:10px 14px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface-alt); margin-bottom:12px; }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🚰 泊肃叶四次方定律：血管堵一半，血压飙 16 倍？</h1>
        <p>误区：血管里长了点斑块、内径变窄一半，水流阻力大概也就涨个 2 倍。真相：流体力学里的<strong>泊肃叶定律（R ∝ 1/r⁴）</strong>冷酷无情——半径缩窄一半，血管阻力会暴涨 <strong>2⁴ = 16 倍</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill" onclick="setR(100,this)">🟢 100% 通畅</button>
        <button class="pill active" onclick="setR(80,this)">🟡 80% 轻度斑块</button>
        <button class="pill" onclick="setR(65,this)">🟠 65% 中度狭窄</button>
        <button class="pill" onclick="setR(50,this)">🔴 50% 严重堵塞（16×！）</button>
      </div>
      <div class="ctrl-box">
        <label><span>动脉血管有效通畅半径 (r)</span><span id="vR">80%</span></label>
        <input type="range" id="sR" min="50" max="100" value="80" oninput="onSlide()">
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">血流阻力暴涨倍数 (1/r⁴)</div><div class="k-val" id="kRes" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">同压力下血流量剩余</div><div class="k-val" id="kFlow" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">临床缺血预警</div><div class="k-val" id="kWarn" style="color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let r = 80;
    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setR(v, btn){
      r = v; document.getElementById('sR').value = v;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function onSlide(){
      r = +document.getElementById('sR').value;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      markDone(); draw();
    }

    function draw(){
      document.getElementById('vR').textContent = r + '%';
      const frac = r / 100;
      const res = +(1 / Math.pow(frac, 4)).toFixed(1);
      const flowPct = Math.round(Math.pow(frac, 4) * 100);
      const col = res >= 8 ? 'var(--tax-red)' : (res >= 2.5 ? 'var(--tax-amber)' : 'var(--tax-green)');
      const innerR = Math.round(64 * frac);
      const barW = Math.min(250, Math.round((res / 16) * 250));

      document.getElementById('svg').innerHTML = `
        <circle cx="145" cy="102" r="68" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="3"/>
        <circle cx="145" cy="102" r="${innerR}" fill="var(--tax-red-soft)" stroke="${col}" stroke-width="2.5"/>
        <text x="145" y="106" text-anchor="middle" font-size="13" font-weight="900" fill="${col}">通径 ${r}%</text>
        <text x="145" y="190" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-muted)">黄色 = 脂质斑块 · 中间圆 = 剩余血道</text>

        <rect x="275" y="28" width="335" height="148" rx="14" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <text x="295" y="56" font-size="13" font-weight="850" fill="var(--tax-ink)">流体力学四次方阻力放大器 (R = 1 / r⁴)</text>
        <text x="295" y="96" font-size="30" font-weight="900" fill="${col}">${res}× <tspan font-size="13" fill="var(--tax-muted)">倍血流阻力</tspan></text>
        <rect x="295" y="112" width="250" height="16" rx="8" fill="var(--tax-border)"/>
        <rect x="295" y="112" width="${barW}" height="16" rx="8" fill="${col}"/>
        <text x="295" y="154" font-size="12" font-weight="750" fill="var(--tax-muted)">同样血压下，下游器官只能拿到 <tspan fill="${col}" font-weight="900">${flowPct}%</tspan> 的血液！</text>
      `;

      document.getElementById('kRes').textContent = res + ' 倍';
      document.getElementById('kFlow').textContent = flowPct + '%';
      document.getElementById('kWarn').textContent = r <= 55 ? '极高心梗/脑缺血风险 🚨' : (r <= 75 ? '运动时胸闷预警 ⚠️' : '血流通畅 ✅');

      document.getElementById('ahaBox').innerHTML = r <= 55
        ? `💡 <strong>顿悟时刻：</strong>半径刚缩窄到 <strong>${r}%</strong>，阻力就呈四次方暴涨到恐怖的 <strong>${res} 倍</strong>，下游血流量断崖只剩 <strong>${flowPct}%</strong>！这就是为什么血管前期堵 30% 毫无感觉，一过 50% 拐点就突然爆发心绞痛！`
        : `💡 <strong>顿悟时刻：</strong>四次方定律也是好消息——反过来看，只要通过降脂、运动和控压让狭窄血管哪怕只<strong>微扩宽 10%</strong>，血流阻力就能骤降 30% 以上！试着拖到 50% 感受指数级爆炸！`;
    }

    draw();
  </script>
</body>
</html>
