<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🕶️ 为什么要“双盲”？连医生自己也不知道真假</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🕶️ 为什么要“双盲”？连医生自己也不知道真假</h1>
        <p>误区：只要瞒着病人（单盲）就足够公平了，医生都是专业人士不会受影响。真相：哪怕最正直的医生，如果知道眼前病人吃的是新药，也会在语气、眼神和打分上无意识地“多给一点鼓励”——把 0% 净效的糖丸硬生生吹出 <strong>+24% 虚假疗效</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setBlind('open',this)">👁️ 开放标签（医患全知道）</button>
        <button class="pill" onclick="setBlind('single',this)">🕶️ 单盲（仅病人不知 · 医生知道）</button>
        <button class="pill" onclick="setBlind('double',this)">🕶️🕶️ 双盲随机（医患均只见编号 #A/#B）</button>
        <button class="tax-btn" style="padding:7px 14px;font-size:12.5px;" onclick="revealTruth()">🔓 揭盲核对真实底牌</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">测得“新药”领先幅度</div><div class="k-val" id="kLead">—</div></div>
        <div class="kpi"><div class="k-lbl">偏倚注水水分</div><div class="k-val" id="kBias" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">循证医学证据等级</div><div class="k-val" id="kLvl" style="color:var(--tax-primary);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    // Ground truth: Drug A is a useless sugar pill (real net effect = +2%, indistinguishable from placebo 40%)
    const MODES = {
      open:   { drug:72, pla:38, bias:'+32% 严重注水', lvl:'极低（易被忽悠）', col:'var(--tax-red)',
        note:'病人知道吃新药心理预期拉满 + 医生热情暗示打分偏宽！' },
      single: { drug:58, pla:40, bias:'+16% 观察者偏倚', lvl:'中等（仍有医生暗示）', col:'var(--tax-amber)',
        note:'病人虽不知情，但医生知道谁吃新药 → 眼神鼓励 + 模糊症状倾向判“好转”！' },
      double: { drug:42, pla:40, bias:'0% 彻底榨干水分', lvl:'🏆 医学金标准', col:'var(--tax-green)',
        note:'医生和病人都只看到冰冷编号 #A / #B，情绪与预期完全拉平，假药瞬间现原形！' }
    };
    let mode = 'open', revealed = false;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setBlind(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function revealTruth(){ revealed = true; markDone(); draw(); }

    function draw(){
      const d = MODES[mode];
      const diff = d.drug - d.pla;
      const wD = Math.round((d.drug / 100) * 440);
      const wP = Math.round((d.pla / 100) * 440);

      document.getElementById('svg').innerHTML = `
        <text x="24" y="28" font-size="12.5" font-weight="850" fill="var(--tax-ink)">
          ${revealed ? '🔓 揭盲底牌：这其实是一颗真实净效仅 +2% 的普通淀粉丸！' : '🧪 盲测实验中（点击右上角「揭盲核对底牌」查看真实药效）'}
        </text>
        <text x="24" y="64" font-size="12.5" font-weight="800" fill="${d.col}">试验组（${mode==='double'?'盲盒 #A':'新药组'}）：报告好转 ${d.drug}%</text>
        <rect x="24" y="74" width="${wD}" height="28" rx="6" fill="${d.col}"/>
        <text x="24" y="132" font-size="12.5" font-weight="800" fill="var(--tax-muted)">对照组（${mode==='double'?'盲盒 #B':'安慰剂组'}）：报告好转 ${d.pla}%</text>
        <rect x="24" y="142" width="${wP}" height="28" rx="6" fill="var(--tax-muted)"/>
        <text x="24" y="194" font-size="11.5" font-weight="800" fill="${d.col}">机制诊断：${d.note}</text>
      `;

      const kL = document.getElementById('kLead'); kL.textContent = `+${diff}%`; kL.style.color = d.col;
      document.getElementById('kBias').textContent = d.bias;
      document.getElementById('kLvl').textContent = d.lvl;

      document.getElementById('ahaBox').innerHTML = mode === 'double'
        ? `💡 <strong>顿悟时刻：</strong>只有进入<strong>双盲随机对照试验</strong>，把医生和病人的心理预期全部拉平，这颗淀粉丸“+2% 无统计意义”的真相才终于浮出水面——<strong>双盲不是防坏人造假，而是防好人无意识的自我欺骗！</strong>`
        : `💡 <strong>顿悟时刻：</strong>在「${mode==='open'?'开放标签':'单盲'}」下，同一颗几乎无效的药竟测出了高达 <strong>+${diff}%</strong> 的亮眼疗效！切换到 <strong>🕶️🕶️ 双盲随机</strong> 并点击「揭盲」，看看水分是如何瞬间蒸发的！`;
    }

    draw();
  </script>
</body>
</html>
