<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 三臂对比拆解：自然自愈 + 安慰剂 + 真药净效</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .scen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:9px; margin-bottom:14px; }
    .s-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .s-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .s-btn .t { font-size:13px; font-weight:800; }
    .s-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📊 三臂对比拆解：自然自愈 + 安慰剂 + 真药净效</h1>
        <p>误区：吃了一款偏方或保健品后 65% 的人症状好转，就证明它是神药。真相：感冒、失眠、轻度疼痛本来自己就会好转（自然自愈），加上花钱吃药的仪式感（安慰剂），加起来就能占掉 60%+ 好转率——不设对照组全是自欺欺人！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🧪 选择 3 种不同“疗效”的待测产品，用三臂随机对照试验（RCT）扒出它的真实净疗效：</div>
      <div class="scen-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">表面宣称“有效率”</div><div class="k-val" id="kClaim" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">安慰剂组好转率</div><div class="k-val" id="kPla" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">分子真实净疗效</div><div class="k-val" id="kNet">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const CASES = [
      { id:'fake', icon:'🍵', name:'网红“神效感冒偏方”', desc:'表面 64% 好转 · 净效 0%', nat:40, pla:24, net:0,
        aha:'💡 <strong>顿悟时刻：</strong>惊人真相！这款“神方”表面上让 <strong>64%</strong> 的人喝完好转，评论区一片“亲测有效”！但三臂对照一眼照出原形：自然自愈 40% + 安慰剂 24% = 64%，<strong>真药分子净疗效是彻底的 0%！</strong>' },
      { id:'pain', icon:'💊', name:'循证镇痛药 / 抗焦虑药', desc:'安慰剂高 · 真药再增 +22%', nat:28, pla:30, net:22,
        aha:'💡 <strong>顿悟时刻：</strong>疼痛和情绪领域安慰剂效应极强（高达 30%），所以一款新药必须像这样在安慰剂 58% 的基础上<strong>稳定再拔高 +22%</strong>（总好转 80%），才配通过 FDA 审批！' },
      { id:'abx', icon:'🧬', name:'对症特效抗生素 / 靶向药', desc:'净疗效碾压安慰剂 (+52%)', nat:20, pla:14, net:52,
        aha:'💡 <strong>顿悟时刻：</strong>真正硬核的现代特效药（如对症抗生素、胰岛素），其分子净疗效高达 <strong>+52%</strong>，在三臂试验里把安慰剂组远远甩在身后！' }
    ];
    let cur = 'fake';

    function pick(id){ cur = id; if(window.ToySDK) window.ToySDK.markCompleted(); draw(); }

    function draw(){
      document.getElementById('grid').innerHTML = CASES.map(c => `
        <button class="s-btn ${cur===c.id?'active':''}" onclick="pick('${c.id}')">
          <div class="t">${c.icon} ${c.name}</div>
          <div class="s">${c.desc}</div>
        </button>
      `).join('');

      const c = CASES.find(x=>x.id===cur);
      const totPla = c.nat + c.pla;
      const totDrug = Math.min(100, c.nat + c.pla + c.net);
      const x0 = 24, maxW = 540; // 100% = 540px, strictly inside 640 viewBox!
      const toW = p => (Math.min(100, p) / 100) * maxW;

      document.getElementById('svg').innerHTML = `
        <text x="${x0}" y="28" font-size="12.5" font-weight="800" fill="var(--tax-muted)">① 空白观察组（啥都不吃，纯靠时间自愈）：${c.nat}%</text>
        <rect x="${x0}" y="36" width="${toW(c.nat)}" height="24" rx="6" fill="var(--tax-muted)"/>

        <text x="${x0}" y="88" font-size="12.5" font-weight="800" fill="var(--tax-amber)">② 安慰剂组（自愈 ${c.nat}% + 吃假药仪式感 ${c.pla}%）：${totPla}%</text>
        <rect x="${x0}" y="96" width="${toW(c.nat)}" height="24" rx="6" fill="var(--tax-muted)"/>
        <rect x="${x0+toW(c.nat)}" y="96" width="${toW(c.pla)}" height="24" rx="6" fill="var(--tax-amber)"/>

        <text x="${x0}" y="148" font-size="12.5" font-weight="800" fill="${c.net>0?'var(--tax-green)':'var(--tax-red)'}">③ 试验真药组（总好转 ${totDrug}% = 自愈 ${c.nat}% + 安慰剂 ${c.pla}% + 净效 +${c.net}%）</text>
        <rect x="${x0}" y="156" width="${toW(c.nat)}" height="24" rx="6" fill="var(--tax-muted)"/>
        <rect x="${x0+toW(c.nat)}" y="156" width="${toW(c.pla)}" height="24" rx="6" fill="var(--tax-amber)"/>
        ${c.net > 0 ? `<rect x="${x0+toW(totPla)}" y="156" width="${toW(c.net)}" height="24" rx="6" fill="var(--tax-green)"/>` : ''}
        <text x="${x0+toW(totDrug)+8}" y="173" font-size="12" font-weight="900" fill="${c.net>0?'var(--tax-green)':'var(--tax-red)'}">${c.net>0?`+${c.net}% 净效`:'0% 智商税!'}</text>
      `;

      document.getElementById('kClaim').textContent = totDrug + '% 好转';
      document.getElementById('kPla').textContent = totPla + '% 好转';
      const kN = document.getElementById('kNet');
      kN.textContent = c.net > 0 ? `+${c.net}% 真实有效 ✅` : '0%（纯安慰剂）❌';
      kN.style.color = c.net > 0 ? 'var(--tax-green)' : 'var(--tax-red)';
      document.getElementById('ahaBox').innerHTML = c.aha;
    }

    draw();
  </script>
</body>
</html>
