<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 均值回归陷阱：为什么偏方总在“最痛那天”显灵？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📉 均值回归陷阱：为什么偏方总在“最痛那天”显灵？</h1><p>误区：我每次关节痛到最惨那天，喝一碗神水第二天就减轻了，难道这还不是神水显灵？真相：人往往只在症状波动到最极端的谷底那天求医吃药——无论吃不吃药，极端坏运气第二天大概率都会自然往平均值回弹！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>忍到多惨的极端峰值才去吃偏方</span><span id="vThr">90 分痛</span></label><input type="range" id="sThr" min="60" max="98" value="90" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>症状日常随机波动幅度</span><span id="vVol">70%</span></label><input type="range" id="sVol" min="20" max="100" value="70" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">第二天自然回落好转</div><div class="k-val" id="kDrop" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">错当成偏方显灵概率</div><div class="k-val" id="kIll" style="color:#ef4444;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const thr=+document.getElementById('sThr').value, vol=+document.getElementById('sVol').value;
  document.getElementById('vThr').textContent=thr+' 分痛'; document.getElementById('vVol').textContent=vol+'%';
  const mean=50;
  const drop=Math.round((thr-mean)*0.65);
  const ill=Math.min(98, Math.round(50 + (thr-50)*0.95));
  document.getElementById('kDrop').textContent='-'+drop+' 分 (自动缓解)';
  document.getElementById('kIll').textContent=ill+'%';
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="105" x2="560" y2="105" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="45" y="120" font-size="11" fill="var(--tax-muted)">日常平均不适水平 (50分)</text>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="40,105 140,85 240,115 320,${155-thr*1.2} 420,${155-(thr-drop)*1.2} 540,105"/>
    <circle cx="320" cy="${155-thr*1.2}" r="6" fill="#ef4444"/>
    <text x="320" y="${140-thr*1.2}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#ef4444">忍到极值 ${thr} 分这天吃偏方!</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>坏事到了顶峰，哪怕啥也不干第二天也很大概率往均值回落（自动降 ${drop} 分）！“只在最难受那天出手”让你有 ${ill}% 的概率把自然回归误当成偏方显灵！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
