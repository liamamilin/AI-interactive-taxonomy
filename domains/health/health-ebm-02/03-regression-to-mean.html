<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 均值回归陷阱：为什么偏方总在“最痛那天”显灵？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📉 均值回归陷阱：为什么偏方总在“最痛那天”显灵？</h1>
        <p>误区：我腰痛到 9 分忍无可忍，买了张祖传神膏药贴上，第二天立刻降到 5 分，神药太灵了！真相：慢性病症状天生上下随机波动，你偏偏只在<strong>最痛的极值山顶</strong>才肯花钱买偏方——而站在山顶后，哪怕只喝白开水，明天大概率也会自然滑回平均值（均值回归）！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="genCurve()">🎲 随机生成一段新的 14 天自然波动病痛史</button>
        <span style="font-size:12.5px;color:var(--tax-muted);font-weight:750;">红点 = 你痛到极致忍不住买偏方的那天（假定偏方真实药效 = 0）</span>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 220"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">你贴偏方当天的痛感</div><div class="k-val" id="kPeak" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">次日自然回落的痛感</div><div class="k-val" id="kNext" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">你误以为偏方立下的功劳</div><div class="k-val" id="kFake" style="color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let vals = [4.5, 5.2, 6.0, 5.1, 7.2, 8.9, 5.6, 4.8, 5.4, 6.2, 4.7, 5.1, 4.9, 5.3];
    let tries = 0;

    function genCurve(){
      tries++;
      vals = [];
      let peakDay = 4 + Math.floor(Math.random() * 6);
      for(let i=0; i<14; i++){
        if(i === peakDay) vals.push(+(8.2 + Math.random() * 1.4).toFixed(1));
        else vals.push(+(3.6 + Math.random() * 3.0).toFixed(1));
      }
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const peakIdx = vals.reduce((bi, v, i) => v > vals[bi] ? i : bi, 0);
      const nextIdx = Math.min(13, peakIdx + 1);
      const peakV = vals[peakIdx], nextV = vals[nextIdx];
      const drop = +(peakV - nextV).toFixed(1);

      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = i => x0 + (i/13)*(x1-x0);
      const toY = v => yMax - (v/10.5)*(yMax-yMin);

      const pts = vals.map((v,i)=>`${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');

      document.getElementById('svg').innerHTML = `
        <line x1="${x0}" y1="${toY(5.2)}" x2="${x1}" y2="${toY(5.2)}" stroke="var(--tax-primary)" stroke-dasharray="5 4"/>
        <text x="${x1-4}" y="${toY(5.2)-5}" text-anchor="end" font-size="10.5" font-weight="750" fill="var(--tax-primary)">病情自然波动均值 (5.2 分)</text>
        ${vals.map((_,i)=>`<text x="${toX(i)}" y="208" text-anchor="middle" font-size="10.5" fill="var(--tax-muted)">D${i+1}</text>`).join('')}
        <polyline points="${pts}" fill="none" stroke="var(--tax-primary)" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="${toX(peakIdx)}" cy="${toY(peakV)}" r="7" fill="var(--tax-red)"/>
        <text x="${toX(peakIdx)}" y="${toY(peakV)-11}" text-anchor="middle" font-size="11.5" font-weight="900" fill="var(--tax-red)">🔥 第${peakIdx+1}天贴偏方 (${peakV})</text>
        <circle cx="${toX(nextIdx)}" cy="${toY(nextV)}" r="6" fill="var(--tax-green)"/>
        <line x1="${toX(peakIdx)}" y1="${toY(peakV)}" x2="${toX(nextIdx)}" y2="${toY(nextV)}" stroke="var(--tax-green)" stroke-width="3.5"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">纯随机自然波动曲线（无任何药物干预，已模拟 ${tries+1} 次）</text>
      `;

      document.getElementById('kPeak').textContent = peakV + ' 分（忍无可忍）';
      document.getElementById('kNext').textContent = nextV + ' 分（自然回落）';
      document.getElementById('kFake').textContent = `痛感骤降 -${drop} 分！`;

      document.getElementById('ahaBox').innerHTML = `💡 <strong>顿悟时刻：</strong>你在第 ${peakIdx+1} 天最痛的极值山顶（<strong>${peakV} 分</strong>）贴了毫无药效的偏方，第二天痛感自然均值回归降到了 <strong>${nextV} 分（-${drop} 分）</strong>！多点几次 <strong>🎲 重新生成</strong> 你会发现：几乎每一次“山顶买偏方”，第二天都像奇迹般显灵——这就是为什么人人都信“我亲测有效”！`;
    }

    draw();
  </script>
</body>
</html>
