<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔀 代谢交叉点：运动强度 vs 碳水脂肪供能比（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔀 代谢交叉点：运动强度 vs 碳水脂肪供能比（SVG）</h1><p>误区：跑步跑得越喘越累，脂肪烧得比例就越高。真相：强度越高，身体来不及等氧气慢吞吞烧脂肪，反而把供能全切给了“快速烧糖”——中低强度燃脂比例才最高！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>运动强度 (% 最大心率)</span><span id="vInt">65%</span></label><input type="range" id="sInt" min="30" max="95" value="65" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>体内糖原储备充足度</span><span id="vGly">75%</span></label><input type="range" id="sGly" min="15" max="100" value="75" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">脂肪供能占比</div><div class="k-val" id="kFat" style="color:#f59e0b;">—</div></div>
        <div class="kpi"><div class="k-lbl">碳水/糖原供能占比</div><div class="k-val" id="kCarb" style="color:#0284c7;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const inten=+document.getElementById('sInt').value, gly=+document.getElementById('sGly').value;
  document.getElementById('vInt').textContent=inten+'%'; document.getElementById('vGly').textContent=gly+'%';
  const carbShare=Math.min(95, Math.max(10, Math.round((inten-20)*1.05*(0.7+gly/300))));
  const fatShare=100-carbShare;
  document.getElementById('kFat').textContent=fatShare+'%';
  document.getElementById('kCarb').textContent=carbShare+'%';
  let pFat='', pCarb='';
  for(let x=30;x<=95;x+=3){
    const cs=Math.min(95, Math.max(10, (x-20)*1.05*(0.7+gly/300)));
    const fs=100-cs;
    const px=40+(x-30)/65*520;
    pCarb+=`${px},${160-cs*1.3} `;
    pFat+=`${px},${160-fs*1.3} `;
  }
  const cx=40+(inten-30)/65*520;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#f59e0b" stroke-width="3" points="${pFat}"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pCarb}"/>
    <line x1="${cx}" y1="20" x2="${cx}" y2="160" stroke="#059669" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="50" y="28" font-size="12" font-weight="800" fill="#f59e0b">橙线: 脂肪供能 ${fatShare}%</text>
    <text x="230" y="28" font-size="12" font-weight="800" fill="#0284c7">蓝线: 碳水供能 ${carbShare}%</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>碳水是高辛烷值氮气加速燃料，脂肪是长途慢燃柴油。60%~70% 最大心率的 Zone 2 有氧区能同时保持较高总消耗与 <strong>${fatShare}% 脂肪燃烧占比</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
