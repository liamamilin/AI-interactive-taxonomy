<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔀 代谢交叉点：运动强度 vs 碳水脂肪供能比</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .gear-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .ctrl-box { padding:10px 14px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface-alt); margin-bottom:14px; }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🔀 代谢交叉点：运动强度 vs 碳水脂肪供能比</h1>
        <p>误区：跑步越拼命、喘得越狠，脂肪燃烧比例越高。真相：脂肪氧化速度慢，强度一超过“代谢交叉点”，身体嫌烧油太慢就会瞬间切到“猛烧糖原”模式！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="gear-row">
        <button class="pill" onclick="setGear(30,this)">🚶 悠闲散步 (30%)</button>
        <button class="pill active" onclick="setGear(55,this)">🏃 Zone 2 慢跑 (55%)</button>
        <button class="pill" onclick="setGear(78,this)">💨 乳酸阈值快跑 (78%)</button>
        <button class="pill" onclick="setGear(95,this)">⚡ 百米冲刺 (95%)</button>
        <button class="pill" id="fastBtn" onclick="toggleFasted()">🌙 当前：饱腹状态</button>
      </div>
      <div class="ctrl-box">
        <label><span>当前运动强度（% 最大摄氧量 VO2max）</span><span id="vInt">55%</span></label>
        <input type="range" id="sInt" min="20" max="100" value="55" oninput="onSlide()">
      </div>

      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>

      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">脂肪供能占比</div><div class="k-val" id="kFat" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">碳水（糖原）供能占比</div><div class="k-val" id="kCarb" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">每小时绝对燃脂量</div><div class="k-val" id="kAbs" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let intensity = 55;
    let fasted = false;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setGear(v, btn){
      intensity = v;
      document.getElementById('sInt').value = v;
      document.querySelectorAll('.gear-row .pill:not(#fastBtn)').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function onSlide(){
      intensity = +document.getElementById('sInt').value;
      document.querySelectorAll('.gear-row .pill:not(#fastBtn)').forEach(b=>b.classList.remove('active'));
      markDone(); draw();
    }
    function toggleFasted(){
      fasted = !fasted;
      const b = document.getElementById('fastBtn');
      b.classList.toggle('active', fasted);
      b.textContent = fasted ? '☀️ 当前：晨起空腹（交叉点右移）' : '🌙 当前：饱腹状态';
      markDone(); draw();
    }

    function carbPct(i, isFast){
      const cross = isFast ? 68 : 58;
      return Math.round(100 / (1 + Math.exp(-(i - cross) / 11)));
    }

    function draw(){
      document.getElementById('vInt').textContent = intensity + '%';
      const x0=54, x1=610, yMin=26, yMax=190;
      const toX = v => x0 + ((v-20)/80)*(x1-x0);
      const toY = p => yMax - (p/100)*(yMax-yMin);

      let ptsC=[], ptsF=[];
      for(let v=20; v<=100; v+=2){
        const c = carbPct(v, fasted), f = 100 - c;
        ptsC.push(`${toX(v).toFixed(1)},${toY(c).toFixed(1)}`);
        ptsF.push(`${toX(v).toFixed(1)},${toY(f).toFixed(1)}`);
      }
      const crossX = toX(fasted ? 68 : 58);
      const cNow = carbPct(intensity, fasted), fNow = 100 - cNow;
      const totalKcalHr = Math.round(140 + intensity * 8.2);
      const fatGramsHr = Math.round((totalKcalHr * (fNow/100)) / 9);

      document.getElementById('svg').innerHTML = `
        ${[0,25,50,75,100].map(p=>`<line x1="${x0}" y1="${toY(p)}" x2="${x1}" y2="${toY(p)}" stroke="var(--tax-border)"/><text x="${x0-8}" y="${toY(p)+4}" text-anchor="end" font-size="11" fill="var(--tax-muted)">${p}%</text>`).join('')}
        ${[20,40,60,80,100].map(v=>`<text x="${toX(v)}" y="210" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${v}%强度</text>`).join('')}
        <line x1="${crossX}" y1="${yMin}" x2="${crossX}" y2="${yMax}" stroke="var(--tax-green)" stroke-dasharray="4 4" stroke-width="1.5"/>
        <text x="${crossX}" y="${yMin+12}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-green)">交叉点 ${fasted?68:58}%</text>
        <polyline points="${ptsF.join(' ')}" fill="none" stroke="var(--tax-amber)" stroke-width="3.2"/>
        <polyline points="${ptsC.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3.2"/>
        <line x1="${toX(intensity)}" y1="${yMin}" x2="${toX(intensity)}" y2="${yMax}" stroke="var(--tax-ink)" stroke-width="1.5" stroke-dasharray="3 3"/>
        <circle cx="${toX(intensity)}" cy="${toY(fNow)}" r="6" fill="var(--tax-amber)"/>
        <circle cx="${toX(intensity)}" cy="${toY(cNow)}" r="6" fill="var(--tax-primary)"/>
        <text x="${x0}" y="17" font-size="11.5" font-weight="800" fill="var(--tax-amber)">● 脂肪供能</text>
        <text x="${x0+90}" y="17" font-size="11.5" font-weight="800" fill="var(--tax-primary)">● 糖原供能</text>
      `;

      document.getElementById('kFat').textContent = fNow + '%';
      document.getElementById('kCarb').textContent = cNow + '%';
      document.getElementById('kAbs').textContent = `约 ${fatGramsHr} g/小时`;

      let aha = '';
      if(intensity < 40){
        aha = `💡 <strong>顿悟时刻：</strong>散步时脂肪供能占比高达 <strong>${fNow}%</strong>，但因为总功率低，每小时绝对燃脂只有约 <strong>${fatGramsHr}g</strong>。想把绝对燃脂效率拉到最高，试试点到 <strong>Zone 2（55% 左右）</strong>！`;
      } else if(intensity <= 65){
        aha = `💡 <strong>顿悟时刻：</strong>黄金燃脂甜蜜区！此时既有可观的总功率，又还没越过代谢交叉点，脂肪氧化每小时冲上 <strong>${fatGramsHr}g</strong>，而且不怎么喘、可以持续坚持很久！`;
      } else {
        aha = `💡 <strong>顿悟时刻：</strong>已越过代谢交叉点！为了供应爆发功率，身体把 <strong>${cNow}%</strong> 的供能任务交给了极速燃烧的糖原（脂肪只占 ${fNow}%）。高强度运动烧糖为主，但能大幅提升心肺上限与总热量消耗！`;
      }
      document.getElementById('ahaBox').innerHTML = aha;
    }

    draw();
  </script>
</body>
</html>
