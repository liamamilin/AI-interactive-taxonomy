<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚒 急性炎症救命 vs 慢性炎症伤身</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🚒 急性炎症救命 vs 慢性炎症伤身</h1>
        <p>误区：炎症都是坏东西，只要有炎症就该彻底消灭。真相：没有<strong>急性炎症</strong>，手指划破一个小口都能要你的命；真正可怕的是“消防队救完火不撤退、反而在屋里狂喷十年水”的<strong>慢性炎症</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" id="playBtn" onclick="runRace()">▶ 播放双轨炎症演化：7 天急性愈合 vs 长期慢性损伤</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">🚒 急性炎症结局</div><div class="k-val" id="kAc" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">🕯️ 慢性低度炎症结局</div><div class="k-val" id="kCh" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">本质分水岭</div><div class="k-val" style="color:var(--tax-primary);font-size:15px;">有无“消退归零信号”</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let t = 100, timer = null;

    function runRace(){
      if(timer) clearInterval(timer);
      if(window.ToySDK) window.ToySDK.markCompleted();
      t = 0;
      timer = setInterval(()=>{
        t += 3;
        if(t >= 100){ t = 100; clearInterval(timer); timer=null; }
        draw();
      }, 45);
      draw();
    }

    function acute(x){ return 8 + 86 * Math.exp(-Math.pow((x - 18)/9, 2)); }
    function chronic(x){ return 10 + 36 * (1 - Math.exp(-x/14)) + 6 * Math.sin(x * 0.25); }

    function draw(){
      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = v => x0 + (v/100)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pA=[], pC=[];
      for(let i=0; i<=t; i+=2){
        pA.push(`${toX(i).toFixed(1)},${toY(acute(i)).toFixed(1)}`);
        pC.push(`${toX(i).toFixed(1)},${toY(chronic(i)).toFixed(1)}`);
      }
      const aNow = acute(t), cNow = chronic(t);

      document.getElementById('svg').innerHTML = `
        <line x1="${x0}" y1="${toY(28)}" x2="${x1}" y2="${toY(28)}" stroke="var(--tax-amber)" stroke-dasharray="4 4"/>
        <text x="${x1-4}" y="${toY(28)-5}" text-anchor="end" font-size="10.5" font-weight="750" fill="var(--tax-amber)">长期无症状组织纤维化阈值</text>
        ${[{p:0,l:'起点'},{p:25,l:'第3天'},{p:50,l:'第1个月'},{p:75,l:'第1年'},{p:100,l:'第10年'}].map(k=>`<text x="${toX(k.p)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${k.l}</text>`).join('')}
        <polyline points="${pA.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3.2"/>
        <polyline points="${pC.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3.2"/>
        <circle cx="${toX(t)}" cy="${toY(aNow)}" r="5.5" fill="var(--tax-green)"/>
        <circle cx="${toX(t)}" cy="${toY(cNow)}" r="5.5" fill="var(--tax-red)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-green)">● 急性炎症（猛烈红肿 → 迅速清场撤军愈合）</text>
        <text x="${x0+290}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-red)">● 慢性炎症（低度不痛 → 十年持续腐蚀）</text>
      `;

      document.getElementById('kAc').textContent = t > 35 ? '彻底愈合撤退 ✅' : '猛烈杀菌清创中 🚒';
      document.getElementById('kCh').textContent = t > 60 ? '血管斑块/关节损伤 🚨' : '隐形闷烧中 🕯️';

      document.getElementById('ahaBox').innerHTML = `💡 <strong>顿悟时刻：</strong>急性炎症像“冲进来 3 天扑灭大火立刻撤退的消防队”，虽然红肿发痛却在救命；慢性炎症则是“忘了关掉警报的失控喷淋系统”，表面不痛不痒，十年下来却把好好的健康房子泡烂了！`;
    }

    draw();
  </script>
</body>
</html>
