<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚒 急性炎症救命 vs 慢性炎症伤身</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🚒 急性炎症救命 vs 慢性炎症伤身</h1><p>误区：既然炎症伤身，那一旦受伤或喉咙发炎就该彻底抑制一切炎症反应。真相：没有急性炎症召唤白细胞和血管修复，一个小伤口就能要命；真正致命的是“打完仗却忘了撤兵”的慢性炎症！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="btn-row">
        <button class="btn active" onclick="setType('acute',this)">急性炎症：72小时定点爆破修复</button>
        <button class="btn" onclick="setType('chronic',this)">慢性炎症：10年持续低度闷烧</button>
      </div>
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>免疫消退信号 (Resolvin 撤兵能力)</span><span id="vRes">70%</span></label><input type="range" id="sRes" min="10" max="100" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">组织最终修复度</div><div class="k-val" id="kFix">—</div></div>
        <div class="kpi"><div class="k-lbl">瘢痕/血管损伤累积</div><div class="k-val" id="kScar">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
let itype='acute';
function setType(t,btn){ itype=t; document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); draw(); }
function draw(){
  const res=+document.getElementById('sRes').value; document.getElementById('vRes').textContent=res+'%';
  const fix=itype==='acute'?Math.min(98, Math.round(60+res*0.38)):Math.max(20, Math.round(res*0.55));
  const scar=itype==='acute'?Math.max(2, Math.round((100-res)*0.2)):Math.max(15, Math.round(95-res*0.55));
  document.getElementById('kFix').textContent=fix+'%';
  document.getElementById('kScar').textContent=scar+'%';
  let pts='';
  for(let t=0;t<=20;t++){
    const x=40+t*26;
    const v=itype==='acute'?(85*Math.exp(-Math.pow((t-3)/2.5,2))):(38*(1-res/180));
    pts+=`${x},${158-v*1.3} `;
  }
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="158" x2="560" y2="158" stroke="#94a3b8"/>
    <polyline fill="none" stroke="${itype==='acute'?'#059669':'#ef4444'}" stroke-width="3" points="${pts}"/>
    <text x="50" y="28" font-size="12.5" font-weight="800" fill="${itype==='acute'?'#059669':'#ef4444'}">${itype==='acute'?'急风暴雨后迅速撤兵，组织满血复活':'火苗不高但永不熄灭，持续烧坏健康细胞'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>健康的免疫反应应当“来如雷霆、去如撤潮”。缺乏撤兵消退信号时，低火闷烧 10 年的累积损伤（${scar}%）远超一次高烧！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
