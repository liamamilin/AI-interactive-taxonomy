<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏔️ 耶克斯-多德森倒 U 曲线：适度压力 vs 崩溃过载</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏔️ 耶克斯-多德森倒 U 曲线：适度压力 vs 崩溃过载</h1><p>误区：要想发挥出最好成绩，压力越低、越佛系越好（或者相反，逼得越狠越好）。真相：完全没压力会昏昏欲睡，压力爆表会直接宕机——只有处于倒 U 型顶点的适度挑战才能激发巅峰表现！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前精神紧张/压力唤醒度</span><span id="vAro">60 分</span></label><input type="range" id="sAro" min="5" max="100" value="60" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>手头任务的认知复杂度</span><span id="vTask">70%</span></label><input type="range" id="sTask" min="10" max="100" value="70" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">最佳压力甜蜜点</div><div class="k-val" id="kOpt" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">当前实际表现分</div><div class="k-val" id="kPerf" style="color:#0284c7;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const aro=+document.getElementById('sAro').value, task=+document.getElementById('sTask').value;
  document.getElementById('vAro').textContent=aro+' 分'; document.getElementById('vTask').textContent=task+'%';
  const opt=Math.round(78 - task*0.35);
  const perf=Math.max(12, Math.round(100*Math.exp(-Math.pow((aro-opt)/28,2))));
  document.getElementById('kOpt').textContent=opt+' 分';
  document.getElementById('kPerf').textContent=perf+' 分';
  let pts='';
  for(let x=5;x<=100;x+=3){
    const p=100*Math.exp(-Math.pow((x-opt)/28,2));
    pts+=`${40+(x-5)/95*520},${160-p*1.25} `;
  }
  const cx=40+(aro-5)/95*520, cy=160-perf*1.25;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="${perf>80?'#059669':'#ef4444'}"/>
    <text x="50" y="30" font-size="12" font-weight="800" fill="#0284c7">倒 U 型表现曲线（复杂脑力活的最佳压力峰值仅为 ${opt} 分）</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>搬砖体力活能扛住高压力，但写代码/考试等复杂脑力任务（复杂度 ${task}%）只要压力超过 <strong>${opt} 分</strong>，前额叶立刻短路掉线！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
