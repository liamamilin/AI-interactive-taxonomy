<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📈 HRV 心率变异性：节拍器 vs 敏捷呼吸波形（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📈 HRV 心率变异性：节拍器 vs 敏捷呼吸波形（SVG）</h1><p>误区：健康的心脏跳得越均匀越好（比如每秒精确跳一次 1000ms）。真相：心率极其死板均匀往往意味着副交感刹车失灵、长期处于高压战备状态；健康的 HRV 越高，说明神经系统越敏捷从容！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>副交感迷走神经活力 (睡眠/恢复)</span><span id="vVag">75%</span></label><input type="range" id="sVag" min="15" max="100" value="75" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>交感神经紧绷度 (熬夜/饮酒/焦虑)</span><span id="vSym">30%</span></label><input type="range" id="sSym" min="10" max="100" value="30" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">HRV (RMSSD) 估算</div><div class="k-val" id="kHrv" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">身体恢复准备度</div><div class="k-val" id="kRdy">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const vag=+document.getElementById('sVag').value, sym=+document.getElementById('sSym').value;
  document.getElementById('vVag').textContent=vag+'%'; document.getElementById('vSym').textContent=sym+'%';
  const hrv=Math.max(12, Math.round(vag*0.95 - sym*0.35 + 20));
  document.getElementById('kHrv').textContent=hrv+' ms';
  document.getElementById('kRdy').textContent=hrv>60?'满血敏捷 (适合高强度训练)':(hrv>35?'中等':'紧绷疲劳 (宜休息)');
  let bars='';
  for(let i=0;i<14;i++){
    const jit=Math.sin(i*1.3)*(hrv*0.45);
    const h=65+jit;
    bars+=`<rect x="${42+i*37}" y="${155-h}" width="24" height="${h}" rx="4" fill="${hrv>60?'#059669':'#f59e0b'}"/>`;
  }
  document.getElementById('svg').innerHTML=bars+`
    <text x="42" y="28" font-size="12.5" font-weight="800" fill="var(--tax-text)">连续 14 次心跳 R-R 间隔毫秒波动（波动越丰富，HRV=${hrv}ms 越高）</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>高 HRV 代表你的心脏同时听得懂“油门”和“刹车”的微操指令（吸气快一点、呼气慢一点）；一旦熬夜喝酒交感锁死，心跳就会变得像死板的机械节拍器！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
