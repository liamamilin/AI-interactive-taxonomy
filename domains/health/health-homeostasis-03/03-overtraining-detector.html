<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🩺 用清晨 HRV 抓出隐形“过度训练与生病前兆”</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🩺 用清晨 HRV 抓出隐形“过度训练与生病前兆”</h1><p>误区：只要意志力够强，连续熬夜或感冒前夕照样咬牙冲极限才叫自律。真相：清晨静息心率飙升、HRV 暴跌往往早于发烧 48 小时出现——此时硬练只会直接引爆重病或伤病！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>连续高强度训练/缺觉累积负荷</span><span id="vLoad">75 分</span></label><input type="range" id="sLoad" min="10" max="100" value="75" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>今晨 HRV 较个人基线跌落幅度</span><span id="vDip">-28%</span></label><input type="range" id="sDip" min="0" max="45" value="28" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">红黄绿灯状态</div><div class="k-val" id="kLight">—</div></div>
        <div class="kpi"><div class="k-lbl">今日行动处方</div><div class="k-val" id="kRx">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const load=+document.getElementById('sLoad').value, dip=+document.getElementById('sDip').value;
  document.getElementById('vLoad').textContent=load+' 分'; document.getElementById('vDip').textContent='-'+dip+'%';
  const risk=Math.min(98, Math.round(load*0.45 + dip*1.3));
  const light=risk>65?'🔴 红灯 (过度疲劳/潜伏感染)':(risk>40?'🟡 黄灯 (减量恢复)':'🟢 绿灯 (可冲强度)');
  document.getElementById('kLight').textContent=light;
  document.getElementById('kRx').textContent=risk>65?'停练早睡补水!':(risk>40?'改低强度 Zone 2':'正常开练');
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="${risk>65?'#ef4444':(risk>40?'#f59e0b':'#059669')}">神经与免疫系统过载预警值: ${risk} 分</text>
    <rect x="20" y="44" width="540" height="26" rx="6" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="44" width="${risk*5.4}" height="26" rx="6" fill="${risk>65?'#ef4444':(risk>40?'#f59e0b':'#059669')}"/>
    <text x="20" y="108" font-size="13" font-weight="800" fill="var(--tax-text)">建议処方: ${risk>65?'⚠️ 立刻刹车休整，否则极易拉伤或大病一场':'✅ 负荷与恢复匹配'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>顶级运动员用 HRV 当“身体油表”：当晨测 HRV 跌破个人基线 25% 以上时，绝不靠死撑硬练，踩下刹车休整一天能救回整个赛季！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
