<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🩺 用清晨 HRV 抓出隐形“过度训练与生病前兆”</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .case-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:9px; margin-bottom:12px; }
    .c-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .c-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .c-btn .t { font-size:13px; font-weight:850; }
    .c-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .act-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .act { flex:1; min-width:150px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .act.sel { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🩺 用清晨 HRV 抓出隐形“过度训练与生病前兆”</h1>
        <p>误区：今天感觉“好像还行”，就必须按原计划硬冲大重量或跑间歇。真相：清晨静息 HRV 往往比你发烧或拉伤<strong>提前 24–48 小时</strong>拉响红灯——看懂绿/黄/红三灯信号，才能练得久不受伤！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">⌚ 第一步：查看今早手表测出的 7 天 HRV 趋势情景</div>
      <div class="case-row" id="caseGrid"></div>

      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🏋️ 第二步：做出你今天的训练决策，看看 48 小时后的身体反馈</div>
      <div class="act-row">
        <button class="act" id="actHard" onclick="chooseAct('hard')">🔥 硬冲大重量 / 高强度间歇</button>
        <button class="act" id="actEasy" onclick="chooseAct('easy')">🌿 改为轻松 Zone 2 / 拉伸</button>
        <button class="act" id="actRest" onclick="chooseAct('rest')">😴 彻底休战 + 补液早睡</button>
      </div>

      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const CASES = [
      { id:'green', icon:'🟢', name:'绿灯：HRV +10%', desc:'连睡 8h · 静息心率 54', vals:[62,64,63,65,67,69,71], best:'hard', col:'var(--tax-green)',
        res:{
          hard:'🏆 最佳决策！副交感满血恢复，今天冲 PR 破纪录效率极高，超量恢复收益拉满！',
          easy:'✅ 安全稳妥，但略微浪费了难得的“满血突破窗口”。',
          rest:'😐 身体已经彻底充好电了，今天直接歇着反而有点可惜！'
        }
      },
      { id:'yellow', icon:'🟡', name:'黄灯：连跌 3 天 (-15%)', desc:'加班熬夜 · 静息心率 +4', vals:[66,65,64,62,58,56,54], best:'easy', col:'var(--tax-amber)',
        res:{
          hard:'⚠️ 失误！在疲劳累积下强冲高强度，48 小时后 HRV 断崖暴跌，进入过度训练滑坡！',
          easy:'🎯 教科书级决策！减量做轻松有氧促进血液循环排废，既保住节奏又避免崩盘！',
          rest:'✅ 非常稳妥，彻底休一天也能迅速拉回基线！'
        }
      },
      { id:'red', icon:'🔴', name:'红灯：暴跌 -32%！', desc:'静息心率飙 +10 · 嗓子微痒', vals:[65,66,64,63,60,52,43], best:'rest', col:'var(--tax-red)',
        res:{
          hard:'🚨 灾难！免疫系统正全力对抗潜伏病毒，你强行硬练直接压垮免疫力，当晚高烧 39°C 倒下 5 天！',
          easy:'⚠️ 依然偏冒险！红灯叠加静息心率骤升是典型的感染前兆，此时连中低强度运动都应暂停。',
          rest:'🛡️ 神级止损！提前 24 小时捕获生病前兆，果断早睡补水，成功把一场重感冒扼杀在摇篮里！'
        }
      }
    ];
    let curCase = 'red', act = null;

    function pickCase(id){
      curCase = id; act = null;
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }
    function chooseAct(a){
      act = a;
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      document.getElementById('caseGrid').innerHTML = CASES.map(c => `
        <button class="c-btn ${curCase===c.id?'active':''}" onclick="pickCase('${c.id}')">
          <div class="t">${c.icon} ${c.name}</div>
          <div class="s">${c.desc}</div>
        </button>
      `).join('');

      ['hard','easy','rest'].forEach(a => {
        document.getElementById('act'+a[0].toUpperCase()+a.slice(1)).classList.toggle('sel', act===a);
      });

      const c = CASES.find(x=>x.id===curCase);
      const x0=54, x1=606, yMin=28, yMax=174;
      const toX = i => x0 + (i/6)*(x1-x0);
      const toY = v => yMax - ((v - 30)/50)*(yMax-yMin);

      const pts = c.vals.map((v,i)=>`${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');

      document.getElementById('svg').innerHTML = `
        <rect x="${x0}" y="${toY(69)}" width="${x1-x0}" height="${toY(59)-toY(69)}" fill="var(--tax-green-soft)" opacity="0.55"/>
        <text x="${x1-4}" y="${toY(69)+13}" text-anchor="end" font-size="10.5" font-weight="750" fill="var(--tax-green)">个人 7 天正常基线带 (59–69 ms)</text>
        ${['6天前','5天前','4天前','3天前','前天','昨天','今早'].map((l,i)=>`<text x="${toX(i)}" y="194" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${l}</text>`).join('')}
        <polyline points="${pts}" fill="none" stroke="${c.col}" stroke-width="3.4" stroke-linecap="round"/>
        ${c.vals.map((v,i)=>`<circle cx="${toX(i)}" cy="${toY(v)}" r="${i===6?7:4.5}" fill="${i===6?c.col:'var(--tax-primary)'}"/><text x="${toX(i)}" y="${toY(v)-10}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-ink)">${v}</text>`).join('')}
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="${c.col}">清晨静息 HRV (RMSSD) 7 天走势（今早：${c.vals[6]} ms）</text>
      `;

      document.getElementById('ahaBox').innerHTML = act
        ? `💡 <strong>48 小时后结果揭晓：</strong>${c.res[act]}`
        : `💡 <strong>顿悟时刻：</strong>今早手表已经给出 <strong>${c.name}</strong> 信号！先在上方选一个你今天的训练方案，看看自主神经系统会给你怎样的 48 小时反馈！`;
    }

    draw();
  </script>
</body>
</html>
