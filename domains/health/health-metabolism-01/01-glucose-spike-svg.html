<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📈 餐后血糖过山车曲线（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📈 餐后血糖过山车曲线（SVG）</h1><p>误区：吃完甜食犯困是因为“血液都跑到胃里消化去了”。真相：高 GI 糖分让血糖垂直飙升，迫使胰腺狂喷胰岛素，结果一小时后血糖反杀跌破饥饿线，大脑缺糖才拼命打哈欠！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>食物升糖指数 (GI 值)</span><span id="vGI">85 (高糖奶茶)</span></label><input type="range" id="sGI" min="25" max="95" value="85" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>先吃蔬菜/蛋白缓冲比例</span><span id="vFib">10%</span></label><input type="range" id="sFib" min="0" max="80" value="10" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">血糖峰值</div><div class="k-val" id="kPeak" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">2小时后跌破基线</div><div class="k-val" id="kDip">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const gi=+document.getElementById('sGI').value, fib=+document.getElementById('sFib').value;
  document.getElementById('vGI').textContent=gi+(gi>70?' (高GI精制糖)':(gi<50?' (低GI缓释)':' (中GI)'));
  document.getElementById('vFib').textContent=fib+'%';
  const damp=1-fib/135;
  const amp=(gi-20)*damp;
  let pts='40,115 ', peak=5.0, minV=5.0;
  for(let t=1;t<=24;t++){
    const h=t*0.15;
    const g=5.0 + amp*0.095*Math.exp(-Math.pow((h-0.85)/0.55,2)) - (amp>35?amp*0.022*Math.exp(-Math.pow((h-2.1)/0.65,2)):0);
    if(g>peak) peak=g; if(g<minV) minV=g;
    pts+=`${40+t*21.6},${170-(g-3)*16} `;
  }
  const dip=minV<4.6;
  document.getElementById('kPeak').textContent=peak.toFixed(1)+' mmol/L';
  document.getElementById('kDip').textContent=dip?minV.toFixed(1)+' (反应性低血糖!)':'平稳 '+minV.toFixed(1);
  document.getElementById('kDip').style.color=dip?'#ef4444':'#10b981';
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="138" x2="560" y2="138" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="45" y="133" font-size="11" fill="var(--tax-muted)">空腹基线 5.0</text>
    <polyline fill="none" stroke="${peak>8.5?'#ef4444':'#059669'}" stroke-width="3" points="${pts}"/>
    <text x="555" y="28" text-anchor="end" font-size="12" font-weight="800" fill="${peak>8.5?'#ef4444':'#059669'}">餐后 0~3.6 小时血糖波动轨迹</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>改变进食顺序（先吃菜肉再吃主食，缓冲率 ${fib}%）能直接把尖峰削平，防止胰岛素过冲引发餐后 2 小时“又饿又困”的低血糖崩溃！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
