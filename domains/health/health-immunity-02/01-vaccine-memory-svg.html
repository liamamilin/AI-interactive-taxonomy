<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 初次感染 vs 疫苗后二次秒杀曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🚀 初次感染 vs 疫苗后二次秒杀曲线</h1>
        <p>误区：打疫苗相当于往身体里一直存着“退烧药”。真相：疫苗是一场<strong>“不流血的军事演习”</strong>——它让免疫系统提前存下记忆 B/T 细胞通缉令，真病毒进门时 24 小时就能飙出 100 倍抗体瞬间秒杀！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" id="playBtn" onclick="runRace()">▶ 发射病毒入侵：播放 14 天双轨响应竞速</button>
        <span style="font-size:12.5px;color:var(--tax-muted);font-weight:750;">对比同一剂量真病毒入侵「未接种者」vs「已接种疫苗者」</span>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">🚀 疫苗记忆组：抗体起飞时间</div><div class="k-val" id="kFast" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">🐢 未接种组：抗体起飞时间</div><div class="k-val" id="kSlow" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">疫苗组体感症状</div><div class="k-val" id="kSym" style="color:var(--tax-primary);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let curDay = 14, timer = null;

    function runRace(){
      if(timer) clearInterval(timer);
      if(window.ToySDK) window.ToySDK.markCompleted();
      curDay = 0;
      document.getElementById('playBtn').textContent = '⏱ 病毒入侵对抗中...';
      timer = setInterval(()=>{
        curDay += 0.4;
        if(curDay >= 14){
          curDay = 14; clearInterval(timer); timer=null;
          document.getElementById('playBtn').textContent = '↻ 重播 14 天双轨秒杀对比';
        }
        draw();
      }, 45);
      draw();
    }

    function abPrimary(d){ return Math.round(34 / (1 + Math.exp(-(d - 7.5)/1.0))); }
    function abMemory(d){ return Math.round(96 / (1 + Math.exp(-(d - 1.6)/0.45))); }

    function draw(){
      const x0=54, x1=612, yMin=28, yMax=188;
      const toX = d => x0 + (d/14)*(x1-x0);
      const toY = v => yMax - (v/102)*(yMax-yMin);

      let p1=[], p2=[];
      for(let d=0; d<=curDay; d+=0.2){
        p1.push(`${toX(d).toFixed(1)},${toY(abPrimary(d)).toFixed(1)}`);
        p2.push(`${toX(d).toFixed(1)},${toY(abMemory(d)).toFixed(1)}`);
      }
      const v1 = abPrimary(curDay), v2 = abMemory(curDay);

      document.getElementById('svg').innerHTML = `
        <line x1="${x0}" y1="${toY(30)}" x2="${x1}" y2="${toY(30)}" stroke="var(--tax-amber)" stroke-dasharray="4 4"/>
        <text x="${x1-4}" y="${toY(30)-5}" text-anchor="end" font-size="10.5" font-weight="750" fill="var(--tax-amber)">拦截发病保护阈值</text>
        ${[0,2,4,6,8,10,12,14].map(d=>`<text x="${toX(d)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">第${d}天</text>`).join('')}
        <polyline points="${p1.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3"/>
        <polyline points="${p2.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3.4"/>
        <circle cx="${toX(curDay)}" cy="${toY(v1)}" r="5.5" fill="var(--tax-red)"/>
        <circle cx="${toX(curDay)}" cy="${toY(v2)}" r="6" fill="var(--tax-green)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-green)">● 已接种疫苗（记忆 B 细胞 24h 秒级暴涨）</text>
        <text x="${x0+275}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-red)">● 初次感染（苦等 7 天才爬过保护线）</text>
      `;

      document.getElementById('kFast').textContent = '1–2 天（峰值 100×）';
      document.getElementById('kSlow').textContent = '7–10 天（窗口期高烧）';
      document.getElementById('kSym').textContent = curDay >= 2 ? '无症状 / 极轻症 ✅' : '病毒刚进门...';

      document.getElementById('ahaBox').innerHTML = `💡 <strong>顿悟时刻：</strong>疫苗的本质不是给你发“护盾药水”，而是<strong>用无害假人提前把 7 天的笨拙摸索期走完</strong>！真病毒再来时，记忆 B 细胞 24 小时内就把抗体滴度拉爆，趁病毒还没来得及让你发烧就已经清零！`;
    }

    draw();
  </script>
</body>
</html>
