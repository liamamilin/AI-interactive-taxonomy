<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧼 大脑“类淋巴洗脑系统”夜间清理实验</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧼 大脑“类淋巴洗脑系统”夜间清理实验</h1>
        <p>误区：睡觉只是让大脑“待机关机省电”。真相：大脑白天代谢产生大量 β-淀粉样蛋白等垃圾，只有在进入深度睡眠时，胶质细胞才会主动收缩腾出 60% 缝隙，让脑脊液像高压水枪一样把垃圾冲走！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" id="playBtn" onclick="startWash()">▶ 启动夜间脑脊液冲刷模拟</button>
        <button class="pill" onclick="setSleep('short',this)">😵 熬夜仅睡 4.5 小时</button>
        <button class="pill active" onclick="setSleep('mid',this)">😐 碎片睡眠 6 小时</button>
        <button class="pill" onclick="setSleep('full',this)">😴 优质深睡 8 小时</button>
      </div>

      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>

      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">胶质细胞缝隙扩张度</div><div class="k-val" id="kGap" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">代谢废物清除率</div><div class="k-val" id="kClear" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">次日晨起脑雾残留</div><div class="k-val" id="kFog" style="color:var(--tax-red);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const MODES = {
      short: { name:'熬夜 4.5 小时', maxClear:38, gap:'+18%', shrink:4 },
      mid:   { name:'碎片睡眠 6 小时', maxClear:66, gap:'+38%', shrink:9 },
      full:  { name:'优质深睡 8 小时', maxClear:95, gap:'+60%', shrink:15 }
    };
    let mode = 'mid', progress = 100, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setSleep(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone();
      startWash();
    }

    function startWash(){
      if(timer) clearInterval(timer);
      markDone();
      progress = 0;
      document.getElementById('playBtn').textContent = '🌊 脑脊液正在冲刷...';
      timer = setInterval(()=>{
        progress += 5;
        if(progress >= 100){
          progress = 100; clearInterval(timer); timer = null;
          document.getElementById('playBtn').textContent = '↻ 重播夜间洗脑实验';
        }
        draw();
      }, 45);
      draw();
    }

    function draw(){
      const cfg = MODES[mode];
      const cleared = Math.round(cfg.maxClear * (progress / 100));
      const remain = 100 - cleared;
      const cellR = 34 - Math.round(cfg.shrink * (progress / 100));

      // Draw 8 brain cells in 2 rows + flowing CSF wave + remaining waste particles
      let cells = '';
      for(let r=0; r<2; r++){
        for(let c=0; c<4; c++){
          const cx = 110 + c * 140, cy = 68 + r * 86;
          cells += `<circle cx="${cx}" cy="${cy}" r="${cellR}" fill="var(--tax-surface-alt)" stroke="var(--tax-primary)" stroke-width="2"/>`;
          cells += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="11" font-weight="750" fill="var(--tax-muted)">脑细胞</text>`;
        }
      }
      // Waste particles (28 total)
      const totalDots = 28;
      const leftDots = Math.round(totalDots * (remain / 100));
      let dots = '';
      for(let i=0; i<totalDots; i++){
        const baseX = 46 + (i * 21) % 540;
        const baseY = 30 + ((i * 53) % 150);
        if(i < leftDots){
          dots += `<circle cx="${baseX}" cy="${baseY}" r="5.5" fill="var(--tax-amber)"/>`;
        } else {
          // Washed toward right exit
          const wx = Math.min(625, baseX + progress * 4.5);
          if(wx < 620) dots += `<circle cx="${wx}" cy="${baseY}" r="4.5" fill="var(--tax-green)" opacity="0.45"/>`;
        }
      }
      const waveX = (progress / 100) * 620;

      document.getElementById('svg').innerHTML = `
        <rect x="0" y="0" width="${waveX}" height="215" fill="var(--tax-primary-soft)" opacity="0.4"/>
        ${cells}
        ${dots}
        <line x1="${waveX}" y1="10" x2="${waveX}" y2="205" stroke="var(--tax-primary)" stroke-width="2.5" stroke-dasharray="5 3" opacity="${progress<100?0.9:0}"/>
        <text x="16" y="204" font-size="11.5" font-weight="800" fill="var(--tax-ink)">橙色颗粒 = β-淀粉样蛋白等代谢废物（剩余 ${remain}%） · 蓝色流体 = 脑脊液冲刷</text>
      `;

      document.getElementById('kGap').textContent = cfg.gap;
      document.getElementById('kClear').textContent = cleared + '%';
      document.getElementById('kFog').textContent = remain + '%' + (remain > 45 ? ' 🌫️ 重度脑雾' : remain > 20 ? ' 轻微迟钝' : ' ✨ 清透无比');

      document.getElementById('ahaBox').innerHTML = mode === 'full'
        ? `💡 <strong>顿悟时刻：</strong>优质深睡 8 小时让胶质细胞收缩腾出 <strong>+60%</strong> 的冲刷通道，脑脊液把 <strong>${cleared}%</strong> 的日间代谢废物一冲而空——深度睡眠就是大脑每天一次的“高压自动洗车”！`
        : mode === 'short'
        ? `💡 <strong>顿悟时刻：</strong>只睡 4.5 小时，类淋巴通道刚打开一点就被闹钟强行关闭，高达 <strong>${remain}%</strong> 的代谢垃圾残留在脑细胞缝隙里——这就是熬夜第二天脑子像灌了浆糊的物理真相！`
        : `💡 <strong>顿悟时刻：</strong>碎片睡眠 6 小时只能清掉 <strong>${cleared}%</strong> 的垃圾，剩下的 <strong>${remain}%</strong> 会在一周内逐日叠加成“慢性睡眠债”。试试切换到 <strong>优质深睡 8 小时</strong> 对比冲刷威力！`;
    }

    draw();
  </script>
</body>
</html>
