<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏰ 90 分钟睡眠周期与“起床惯性”避坑</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⏰ 90 分钟睡眠周期与“起床惯性”避坑</h1><p>误区：睡 7 小时一定比睡 6 小时精神。真相：如果闹钟刚好把你从第 4 个周期最深的 N3 深睡期里强行拖起来，严重的“睡眠惯性”会让你昏沉一上午；卡在 90 分钟整数倍周期末尾醒来才最神清气爽！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>设定夜间实际总睡眠时长</span><span id="vDur">7.5 小时 (5个完整周期)</span></label><input type="range" id="sDur" min="5" max="9" step="0.5" value="7.5" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>入睡前辗转反侧耗时</span><span id="vLat">15 分钟</span></label><input type="range" id="sLat" min="5" max="45" step="5" value="15" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">闹钟唤醒瞬间所处阶段</div><div class="k-val" id="kSt">—</div></div>
        <div class="kpi"><div class="k-lbl">醒后清醒度评分</div><div class="k-val" id="kClr" style="color:#059669;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const dur=+document.getElementById('sDur').value, lat=+document.getElementById('sLat').value;
  const cycs=(dur/1.5).toFixed(1);
  document.getElementById('vDur').textContent=`${dur} 小时 (${cycs}周期)`;
  document.getElementById('vLat').textContent=lat+' 分钟';
  const phase=(dur*60)%90;
  const inDeep=phase>=25 && phase<=65;
  const clr=inDeep?45:92;
  document.getElementById('kSt').textContent=inDeep?'深度睡眠谷底 (昏沉惯性!)':'浅睡/周期交界 (清爽)';
  document.getElementById('kSt').style.color=inDeep?'#ef4444':'#059669';
  document.getElementById('kClr').textContent=clr+' 分';
  let pts='';
  for(let m=0;m<=dur*60;m+=10){
    const x=40+m/540*520;
    const depth=Math.sin((m%90)/90*Math.PI)*(m<200?1:0.55);
    pts+=`${x.toFixed(1)},${35+depth*115} `;
  }
  const ex=40+(dur*60)/540*520;
  document.getElementById('svg').innerHTML=`
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pts}"/>
    <line x1="${ex}" y1="20" x2="${ex}" y2="160" stroke="${inDeep?'#ef4444':'#059669'}" stroke-width="3"/>
    <text x="${ex-6}" y="28" text-anchor="end" font-size="12" font-weight="800" fill="${inDeep?'#ef4444':'#059669'}">闹钟响 (${dur}h)</text>
    <text x="45" y="172" font-size="12" fill="var(--tax-muted)">波谷=深睡修复身体（前半夜多）；波峰=REM快速眼动（后半夜多，整理记忆）</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>记住 90 分钟周期律加上 ${lat} 分钟入睡缓冲！闹钟切忌响在深睡波谷里，卡在 6.0 / 7.5 / 9.0 小时周期交界点（清醒度 ${clr} 分）醒来最轻松！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
