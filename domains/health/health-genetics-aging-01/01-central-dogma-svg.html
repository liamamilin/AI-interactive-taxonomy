<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏭 DNA → mRNA → 蛋白质 车间流水线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🏭 DNA → mRNA → 蛋白质 车间流水线</h1>
        <p>误区：打进体内的 mRNA 疫苗会钻进细胞核永久篡改我们的 DNA。真相：细胞核膜对 mRNA 是“只出不进”的单向门禁——mRNA 只在细胞质核糖体车间当“一次性施工图”，造完蛋白几小时就降解销毁！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="runFlow()">▶ 启动流水线动画</button>
        <button class="pill active" onclick="setMode('dna',this)">🧬 常规模式：DNA 转录出 mRNA</button>
        <button class="pill" onclick="setMode('mrna',this)">💉 mRNA 疫苗：直接空降图纸到车间</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 210"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">细胞核 DNA 蓝图安全</div><div class="k-val" style="color:var(--tax-green);">100% 锁死未改</div></div>
        <div class="kpi"><div class="k-lbl">mRNA 施工图寿命</div><div class="k-val" id="kLife" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">核糖体组装产出</div><div class="k-val" id="kOut" style="color:var(--tax-primary);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let mode = 'dna', prog = 1, raf = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setMode(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); runFlow();
    }
    function runFlow(){
      if(raf) cancelAnimationFrame(raf);
      markDone();
      prog = 0;
      function step(){
        prog = Math.min(1, prog + 0.022);
        draw();
        if(prog < 1) raf = requestAnimationFrame(step);
      }
      step();
    }

    function draw(){
      const isDna = mode === 'dna';
      // Moving packet position
      const px = isDna ? (100 + prog * 430) : (320 + prog * 210);
      const py = isDna ? 105 : (prog < 0.3 ? 30 + (prog/0.3)*75 : 105);

      document.getElementById('svg').innerHTML = `
        <rect x="20" y="34" width="166" height="140" rx="14" fill="var(--tax-primary-soft)" stroke="var(--tax-primary)" stroke-width="${isDna?2.6:1.5}" opacity="${isDna?1:0.55}"/>
        <text x="103" y="76" text-anchor="middle" font-size="24">🧬</text>
        <text x="103" y="106" text-anchor="middle" font-size="13.5" font-weight="850" fill="var(--tax-primary)">细胞核 DNA 母版</text>
        <text x="103" y="130" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${isDna?'单向转录拷贝图纸':'🔒 核膜紧闭 · 绝不接触'}</text>

        <line x1="186" y1="105" x2="246" y2="105" stroke="var(--tax-primary)" stroke-width="3" stroke-dasharray="${isDna?'0':'5 4'}"/>

        <rect x="248" y="54" width="144" height="102" rx="14" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="2.4"/>
        <text x="320" y="92" text-anchor="middle" font-size="22">📜</text>
        <text x="320" y="118" text-anchor="middle" font-size="13" font-weight="850" fill="var(--tax-amber)">mRNA 临时图纸</text>
        <text x="320" y="138" text-anchor="middle" font-size="10.8" fill="var(--tax-muted)">${isDna?'经核孔送出':'💉 直接空降细胞质'}</text>

        <line x1="392" y1="105" x2="452" y2="105" stroke="var(--tax-green)" stroke-width="3.5"/>

        <rect x="454" y="34" width="166" height="140" rx="14" fill="var(--tax-green-soft)" stroke="var(--tax-green)" stroke-width="2.4"/>
        <text x="537" y="76" text-anchor="middle" font-size="24">🧱</text>
        <text x="537" y="106" text-anchor="middle" font-size="13.5" font-weight="850" fill="var(--tax-green)">核糖体翻译车间</text>
        <text x="537" y="130" text-anchor="middle" font-size="11" fill="var(--tax-ink)">${isDna?'组装生命所需蛋白':'造出无害刺突蛋白练兵'}</text>

        <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="9" fill="var(--tax-amber)" stroke="#fff" stroke-width="2"/>
        <text x="320" y="196" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-muted)">中心法则单向通道：DNA（图书馆孤本） → mRNA（一次性复印件） → 蛋白质（成品）</text>
      `;

      document.getElementById('kLife').textContent = isDna ? '数小时后自动降解' : '24–48h 彻底清除';
      document.getElementById('kOut').textContent = isDna ? '正常酶/肌肉蛋白' : '唤醒免疫记忆抗原';

      document.getElementById('ahaBox').innerHTML = isDna
        ? `💡 <strong>顿悟时刻：</strong>细胞核里的 DNA 是绝不外借的“镇馆孤本”，每次细胞需要造蛋白，只能抄一份临时 <strong>mRNA 复印件</strong>送到细胞质核糖体车间组装，用完即焚！`
        : `💡 <strong>顿悟时刻：</strong>mRNA 疫苗相当于直接把一张无害病毒外壳的“一次性施工图”空降到细胞质核糖体车间，连细胞核的大门都进不去——造出靶子让免疫系统演练完，图纸几小时就被酶切碎回收了！`;
    }

    draw();
  </script>
</body>
</html>
