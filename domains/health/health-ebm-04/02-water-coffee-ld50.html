<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📏 万物皆有毒：咖啡、水与维生素的致死剂量尺</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📏 万物皆有毒：咖啡、水与维生素的致死剂量尺</h1><p>误区：天然无添加的东西（水、维生素、草药）吃再多也没毒，只有化学合成药才有毒。真相：毒理学鼻祖帕拉塞尔苏斯 500 年前就指出“万物皆有毒，唯剂量决定毒性”——连喝水太猛也能致死！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="btn-row">
        <button class="btn active" onclick="setSub(6,'6 升纯净水 (短时狂饮)',this)">纯净水 (100%天然)</button>
        <button class="btn" onclick="setSub(100,'100 杯美式咖啡',this)">咖啡因</button>
        <button class="btn" onclick="setSub(60,'60 克精盐 (一次性)',this)">食盐</button>
      </div>
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>一次性摄入占“致死危险线”比例</span><span id="vPct">25%</span></label><input type="range" id="sPct" min="5" max="110" value="25" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当前摄入绝对量</div><div class="k-val" id="kAmt">—</div></div>
        <div class="kpi"><div class="k-lbl">身体反应</div><div class="k-val" id="kSt">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
let maxAmt=6, label='6 升纯净水 (短时狂饮)', unit='升纯净水';
function setSub(m,lbl,btn){ maxAmt=m; label=lbl; unit=lbl.split(' ')[1]||lbl; document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); draw(); }
function draw(){
  const pct=+document.getElementById('sPct').value; document.getElementById('vPct').textContent=pct+'%';
  const amt=(maxAmt*pct/100).toFixed(1);
  const bad=pct>=70;
  document.getElementById('kAmt').textContent=amt+' '+unit;
  document.getElementById('kSt').textContent=pct>=95?'🚨 达到 LD50 致死线!':(bad?'⚠️ 严重中毒反应':'安全日常区');
  document.getElementById('kSt').style.color=bad?'#ef4444':'#059669';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">安全阈值 vs 致死剂量标尺 (${label})</text>
    <rect x="20" y="55" width="540" height="34" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="55" width="${Math.min(540,pct*4.9)}" height="34" rx="8" fill="${pct>=95?'#ef4444':(bad?'#f59e0b':'#059669')}"/>
    <line x1="510" y1="40" x2="510" y2="105" stroke="#ef4444" stroke-width="3"/>
    <text x="510" y="34" text-anchor="middle" font-size="11.5" font-weight="850" fill="#ef4444">100% 危险红线</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>离开剂量谈毒性都是耍流氓！同样是水，每天喝 2 升维持生命，1 小时内硬灌 6 升就会引发低钠脑水肿致死；健康的关键永远在“安全剂量窗”内！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
