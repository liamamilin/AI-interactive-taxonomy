<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧊 冰水浴与桑拿：利用可控微应激激活长寿蛋白</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .prot-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .p-box { padding:12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .p-box h3 { font-size:13.5px; margin-bottom:8px; }
    .pill { padding:6px 10px; border-radius:8px; border:1.5px solid var(--tax-border); background:var(--tax-surface); color:var(--tax-ink); font-size:12px; font-weight:800; cursor:pointer; margin:0 6px 6px 0; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧊 冰水浴与桑拿：利用可控微应激激活长寿蛋白</h1>
        <p>误区：泡冰水或蒸桑拿“撑得越久越硬汉、越养生”。真相：冷热暴露是典型的 <strong>Hormesis 微应激</strong>——85°C 桑拿 15–20 分钟激活热休克蛋白（HSP）、10°C 冷水 2–3 分钟飙升持久多巴胺；硬撑超时立刻反转为中暑脱水与失温休克！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="prot-grid">
        <div class="p-box">
          <h3 style="color:var(--tax-red);">🔥 85°C 芬兰干蒸桑拿时长</h3>
          <button class="pill" onclick="setSauna(0,this)">不蒸 (0分)</button>
          <button class="pill active" onclick="setSauna(18,this)">18 分钟 (黄金窗)</button>
          <button class="pill" onclick="setSauna(50,this)">50 分钟 (硬撑过载!)</button>
        </div>
        <div class="p-box">
          <h3 style="color:var(--tax-primary);">🧊 10°C 冷水/冰浴时长</h3>
          <button class="pill" onclick="setCold(0,this)">不泡 (0分)</button>
          <button class="pill active" onclick="setCold(3,this)">3 分钟 (黄金窗)</button>
          <button class="pill" onclick="setCold(18,this)">18 分钟 (失温危险!)</button>
        </div>
      </div>

      <svg id="svg" class="svg-box" viewBox="0 0 640 195"></svg>

      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">🔥 热休克蛋白 (HSP 修复)</div><div class="k-val" id="kHsp" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">🧊 去甲肾上腺素/多巴胺</div><div class="k-val" id="kNe" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">安全与抗衰综合评级</div><div class="k-val" id="kGrade">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let sauna = 18, cold = 3;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setSauna(m, btn){
      sauna = m;
      btn.parentElement.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      markDone(); draw();
    }
    function setCold(m, btn){
      cold = m;
      btn.parentElement.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      markDone(); draw();
    }

    function draw(){
      const hsp = sauna === 0 ? 10 : (sauna === 18 ? 92 : 40);
      const ne  = cold === 0 ? 15 : (cold === 3 ? 90 : 35);
      const danger = sauna > 35 || cold > 10;
      const risk = (sauna > 35 ? 65 : 10) + (cold > 10 ? 65 : 10);
      const safeRisk = Math.min(98, risk);
      const col = danger ? 'var(--tax-red)' : (sauna===18 || cold===3 ? 'var(--tax-green)' : 'var(--tax-muted)');

      function row(y, lbl, val, c){
        return `
          <text x="24" y="${y+17}" font-size="12.5" font-weight="800" fill="var(--tax-ink)">${lbl}</text>
          <rect x="210" y="${y}" width="340" height="22" rx="6" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
          <rect x="210" y="${y}" width="${Math.round(val*3.4)}" height="22" rx="6" fill="${c}"/>
          <text x="562" y="${y+17}" font-size="12.5" font-weight="900" fill="${c}">${val}%</text>
        `;
      }

      document.getElementById('svg').innerHTML = `
        <text x="24" y="26" font-size="13" font-weight="900" fill="${col}">当前冷热微应激方案：桑拿 ${sauna} 分钟 + 冷水 ${cold} 分钟</text>
        ${row(46, '🔥 HSP 蛋白折叠修复活性', hsp, 'var(--tax-amber)')}
        ${row(88, '🧊 持久多巴胺与清醒度', ne, 'var(--tax-primary)')}
        ${row(130, '🚨 中暑脱水 / 核心失温风险', safeRisk, danger?'var(--tax-red)':'var(--tax-green)')}
        <text x="24" y="182" font-size="11.5" font-weight="750" fill="var(--tax-muted)">安全提醒：心血管疾病患者慎用极端冷热交替；力量训练后立刻泡冰水会轻微钝化增肌信号！</text>
      `;

      document.getElementById('kHsp').textContent = hsp + '% 激活';
      document.getElementById('kNe').textContent = ne + '% 持久提升';
      const kG = document.getElementById('kGrade');
      kG.textContent = danger ? '🚨 危险过载！立刻停止' : (sauna===18 && cold===3 ? '🏆 北欧黄金冷热协议' : (sauna===0 && cold===0 ? '零微应激基线' : '✅ 单项安全有效'));
      kG.style.color = col;

      document.getElementById('ahaBox').innerHTML = danger
        ? `💡 <strong>顿悟时刻：</strong>硬撑超时已经跨过 Hormesis 悬崖！50 分钟高温桑拿导致严重脱水与低血压晕厥，18 分钟冰水直接引发核心失温与心律失常——<strong>微应激的精髓是“短、稳、可控”，绝不是拼命硬扛！</strong>`
        : (sauna === 18 && cold === 3)
        ? `💡 <strong>顿悟时刻：</strong>教科书级的<strong>北欧冷热交替协议</strong>！18 分钟桑拿唤醒热休克蛋白修复受损蛋白并扩张血管，3 分钟冷水激发 250% 持久温和多巴胺且零戒断低谷！`
        : `💡 <strong>顿悟时刻：</strong>不需要任何昂贵补剂，短短 <strong>2–3 分钟微冷淋浴</strong> 或 <strong>15–20 分钟热桑拿</strong> 就能安全拨动人体自带的抗衰防御开关！`;
    }

    draw();
  </script>
</body>
</html>
