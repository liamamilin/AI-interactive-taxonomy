<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧊 冰水浴与桑拿：利用可控微应激激活长寿蛋白</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧊 冰水浴与桑拿：利用可控微应激激活长寿蛋白</h1><p>误区：既然冷浴和桑拿抗炎长寿，那泡得越久（比如冰水泡 30 分钟）效果就越好。真相：Hormesis 只吃“短促可控的冲击”（冰水 2~3 分钟、桑拿 15 分钟），超长硬撑直接变成失温或中暑！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>高热桑拿 / 冰水浴持续分钟数</span><span id="vMin">12 分钟</span></label><input type="range" id="sMin" min="1" max="35" value="12" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>温度极端刺激强度</span><span id="vInt">70%</span></label><input type="range" id="sInt" min="20" max="100" value="70" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">热/冷休克修复蛋白激活</div><div class="k-val" id="kHsp" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">风险评估</div><div class="k-val" id="kRisk">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const mins=+document.getElementById('sMin').value, inten=+document.getElementById('sInt').value;
  document.getElementById('vMin').textContent=mins+' 分钟'; document.getElementById('vInt').textContent=inten+'%';
  const load=mins*inten/100;
  const hsp=Math.round(90*Math.exp(-Math.pow((load-10)/7,2)));
  const over=load>16;
  document.getElementById('kHsp').textContent=hsp+' 分';
  document.getElementById('kRisk').textContent=over?'⚠️ 超时中暑/失温风险!':'安全微应激区间';
  document.getElementById('kRisk').style.color=over?'#ef4444':'#059669';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#059669">修复保护蛋白 (HSP) 唤醒收益: ${hsp} 分</text>
    <rect x="20" y="44" width="${hsp*5.4}" height="24" rx="6" fill="#059669"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="${over?'#ef4444':'#0284c7'}">累积热/冷负荷压力: ${load.toFixed(1)} (安全甜蜜点 8~14)</text>
    <rect x="20" y="112" width="${Math.min(540,load*20)}" height="24" rx="6" fill="${over?'#ef4444':'#0284c7'}"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">适度冷热冲击会欺骗细胞以为遇到危机，从而大批量生产折叠修复蛋白</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>桑拿和冷水浴之所以有用，全靠“短时受一点可控小苦”触发修复基因，但一旦负荷冲破 16（超时硬扛），立刻从长寿法宝变成危险事故！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
