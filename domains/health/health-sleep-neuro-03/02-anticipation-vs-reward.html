<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎁 多巴胺的真相：渴望 (Wanting) ≠ 享受 (Liking)</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .mode-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .box-stage { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); margin-bottom:12px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🎁 多巴胺的真相：渴望 (Wanting) ≠ 享受 (Liking)</h1>
        <p>误区：多巴胺是“拿到奖励后的幸福快乐分子”。真相：多巴胺其实是“预期与渴望分子”！当奖励 100% 确定时多巴胺反而平平无奇，只有 50% 随机盲盒才会让摇铃瞬间多巴胺彻底爆表！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="mode-row">
        <span style="font-size:12.5px;font-weight:800;color:var(--tax-muted);">切换实验规则：</span>
        <button class="pill" onclick="setRule('sure',this)">🍬 100% 确定给糖</button>
        <button class="pill active" onclick="setRule('random',this)">🎰 50% 随机盲盒（最强成瘾）</button>
        <button class="pill" onclick="setRule('miss',this)">💔 预期落空（铃响不给糖）</button>
      </div>

      <div class="box-stage">
        <div style="font-size:13.5px;font-weight:800;" id="trialTxt">准备就绪：点击右侧按钮摇响提示铃并揭晓本次盲盒结果！</div>
        <button class="tax-btn" onclick="runTrial()">🔔 摇铃 & 开盒测试</button>
      </div>

      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>

      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">🔔 摇铃等待瞬间多巴胺</div><div class="k-val" id="kCue" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">🎁 揭晓瞬间奖赏预测误差</div><div class="k-val" id="kRpe" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">重复拉杆/下拉刷新成瘾度</div><div class="k-val" id="kAddict" style="color:var(--tax-red);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let rule = 'random';
    let lastOutcome = 'hit'; // hit | miss
    let trials = 0;

    function setRule(r, btn){
      rule = r;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      lastOutcome = r === 'miss' ? 'miss' : 'hit';
      draw();
    }

    function runTrial(){
      trials++;
      if(rule === 'sure') lastOutcome = 'hit';
      else if(rule === 'miss') lastOutcome = 'miss';
      else lastOutcome = Math.random() < 0.5 ? 'hit' : 'miss';
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      // Curve across t = 0..100: Cue bell at t=28, Reward reveal at t=72
      const cuePeak = rule === 'random' ? 96 : (rule === 'sure' ? 62 : 66);
      const revDelta = rule === 'sure' ? 4 : (rule === 'miss' ? -36 : (lastOutcome === 'hit' ? +38 : -28));
      const base = 42;

      const x0=52, x1=612, yMin=26, yMax=188;
      const toX = t => x0 + (t/100)*(x1-x0);
      const toY = v => yMax - (Math.max(4, Math.min(104, v))/105)*(yMax-yMin);

      let pts = [];
      for(let t=0; t<=100; t+=1){
        let v = base;
        // Cue spike around t=28
        v += (cuePeak - base) * Math.exp(-Math.pow((t - 28)/6.5, 2));
        // Sustained anticipation ramp in random mode between t=32..68
        if(rule === 'random' && t > 28 && t < 72) v += 24 * Math.sin(((t-28)/44)*Math.PI);
        // Reveal spike or dip around t=72
        v += revDelta * Math.exp(-Math.pow((t - 72)/6.5, 2));
        pts.push(`${toX(t).toFixed(1)},${toY(v).toFixed(1)}`);
      }

      document.getElementById('svg').innerHTML = `
        <line x1="${x0}" y1="${toY(base)}" x2="${x1}" y2="${toY(base)}" stroke="var(--tax-muted)" stroke-dasharray="4 4"/>
        <text x="${x0-6}" y="${toY(base)+4}" text-anchor="end" font-size="10.5" fill="var(--tax-muted)">基线</text>
        <line x1="${toX(28)}" y1="${yMin}" x2="${toX(28)}" y2="${yMax}" stroke="var(--tax-amber)" stroke-dasharray="4 3"/>
        <text x="${toX(28)}" y="206" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-amber)">🔔 提示铃响（预期）</text>
        <line x1="${toX(72)}" y1="${yMin}" x2="${toX(72)}" y2="${yMax}" stroke="var(--tax-primary)" stroke-dasharray="4 3"/>
        <text x="${toX(72)}" y="206" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-primary)">🎁 揭晓时刻（${lastOutcome==='hit'?'中奖!':'落空'}）</text>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${rule==='random'?'var(--tax-red)':'var(--tax-primary)'}" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="${toX(28)}" cy="${toY(cuePeak)}" r="6" fill="var(--tax-amber)"/>
        <circle cx="${toX(72)}" cy="${toY(base + revDelta)}" r="6" fill="${revDelta>=0?'var(--tax-green)':'var(--tax-red)'}"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">脑内多巴胺神经放电实时记录（第 ${trials} 次实验）</text>
      `;

      document.getElementById('trialTxt').textContent =
        rule === 'sure' ? '🍬 确定模式：第 ' + trials + ' 次开盒 → 毫不意外拿到了糖（几乎没有惊喜波形）' :
        rule === 'miss' ? '💔 落空模式：铃响了却没给糖 → 多巴胺直接跌穿基线！' :
        (lastOutcome === 'hit' ? `🎰 50% 盲盒第 ${trials} 次：🎉 抽中大奖！等待期+揭晓瞬间双峰拉满！` : `🎰 50% 盲盒第 ${trials} 次：💨 差一点就中了！落空感反而激起更强的“再来一次”冲动！`);

      document.getElementById('kCue').textContent = cuePeak + ' Hz' + (rule==='random'?' 🔥 极值':'');
      document.getElementById('kRpe').textContent = (revDelta >= 0 ? '+' : '') + revDelta + ' Hz';
      document.getElementById('kAddict').textContent = rule === 'random' ? '98% 停不下来 🎰' : (rule === 'sure' ? '28% 很快腻味' : '15% 彻底失望');

      document.getElementById('ahaBox').innerHTML = rule === 'random'
        ? `💡 <strong>顿悟时刻：</strong>这就是老虎机、抽卡手游和短视频下拉刷新的神经密码！<strong>50% 的不确定性</strong>让大脑在“等结果”的那几秒钟疯狂飙出 <strong>${cuePeak} Hz</strong> 多巴胺——多巴胺驱动的是<strong>疯狂想要（Wanting）</strong>，而不是真正满足（Liking）！`
        : rule === 'sure'
        ? `💡 <strong>顿悟时刻：</strong>一旦奖励 100% 可预测，拿到糖的那一刻多巴胺几乎不再跳动（+${revDelta} Hz）！大脑只把多巴胺留给<strong>意外惊喜（奖赏预测误差 RPE）</strong>。`
        : `💡 <strong>顿悟时刻：</strong>满怀期待却被放鸽子，多巴胺瞬间暴跌 <strong>${revDelta} Hz</strong> 跌穿基线——大脑会立刻把这次挫败刻进记忆里。`;
    }

    draw();
  </script>
</body>
</html>
