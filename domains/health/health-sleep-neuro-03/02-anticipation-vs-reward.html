<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎁 多巴胺的真相：渴望 (Wanting) ≠ 享受 (Liking)</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎁 多巴胺的真相：渴望 (Wanting) ≠ 享受 (Liking)</h1><p>误区：多巴胺让人产生当下的满足感。真相：多巴胺其实是“预期与渴望”的燃料——一旦奖励变得 100% 确定，多巴胺瞬间熄火；反而是“50% 随机给不给”的盲盒机制让多巴胺飙升到最高！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>奖励出现概率的不确定性 (50%最刺激)</span><span id="vProb">50%</span></label><input type="range" id="sProb" min="5" max="100" value="50" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>每次拆封前的等待悬念</span><span id="vWait">60 分</span></label><input type="range" id="sWait" min="10" max="100" value="60" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">多巴胺渴望驱动力</div><div class="k-val" id="kWant" style="color:#f59e0b;">—</div></div>
        <div class="kpi"><div class="k-lbl">成瘾粘性</div><div class="k-val" id="kAdd">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const p=+document.getElementById('sProb').value/100, w=+document.getElementById('sWait').value;
  document.getElementById('vProb').textContent=(p*100).toFixed(0)+'%'; document.getElementById('vWait').textContent=w+' 分';
  const uncert=4*p*(1-p);
  const want=Math.round(uncert*65 + w*0.35);
  document.getElementById('kWant').textContent=want+' 分';
  document.getElementById('kAdd').textContent=want>70?'极强 (盲盒/短视频机制)':(want>40?'中等':'平淡 (确定性高)');
  let pts='';
  for(let x=0.05;x<=1;x+=0.04){
    const val=4*x*(1-x)*65+w*0.35;
    pts+=`${40+x*520},${160-val*1.25} `;
  }
  const cx=40+p*520, cy=160-want*1.25;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#f59e0b" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#ef4444"/>
    <text x="50" y="30" font-size="12" font-weight="800" fill="#f59e0b">多巴胺倒 U 曲线：50% 随机不确定性（最高峰）远比 100% 确定更上瘾！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>下一次你想刷手机停不下来时记住：你不是在享受当下，而是被 <strong>${(p*100).toFixed(0)}% 概率</strong>的随机变比奖励（下一条可能超好看！）死死钩住了！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
