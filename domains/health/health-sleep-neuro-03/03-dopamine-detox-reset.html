<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌿 多巴胺受体敏感度重置（21天戒断曲线）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .ctrl-box { padding:10px 14px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface-alt); margin-bottom:14px; }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🌿 多巴胺受体敏感度重置（21天戒断曲线）</h1>
        <p>误区：戒掉短视频/熬夜第一周浑身难受、干啥都无聊，说明“我就是天生离不开手机”。真相：前 3–7 天是最典型的戒断低谷，熬过这段受体上调期，第 14–21 天起日常读书散步会重新变得津津有味！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="play21()">▶ 播放 21 天神经重置过程</button>
        <button class="pill active" onclick="setStrat('active',this)">🏃 戒廉价刺激 + 运动/户外</button>
        <button class="pill" onclick="setStrat('passive',this)">😐 单纯干熬戒断</button>
      </div>
      <div class="ctrl-box">
        <label><span>当前坚持天数</span><span id="vDay">第 14 天</span></label>
        <input type="range" id="sDay" min="0" max="21" value="14" oninput="onSlide()">
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 220"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">D2 多巴胺受体敏感度</div><div class="k-val" id="kD2" style="color:var(--tax-green);">—</div></div>
        <div class="kpi"><div class="k-lbl">当下心理体感</div><div class="k-val" id="kFeel" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">专注阅读 30 分钟意愿</div><div class="k-val" id="kRead" style="color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let day = 14, strat = 'active', timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setStrat(s, btn){
      strat = s;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function onSlide(){
      if(timer){ clearInterval(timer); timer=null; }
      day = +document.getElementById('sDay').value;
      markDone(); draw();
    }
    function play21(){
      if(timer) clearInterval(timer);
      markDone();
      day = 0; document.getElementById('sDay').value = 0;
      timer = setInterval(()=>{
        day++;
        document.getElementById('sDay').value = day;
        draw();
        if(day >= 21){ clearInterval(timer); timer=null; }
      }, 120);
      draw();
    }

    function d2At(d){
      // Dip on days 1-5, then sigmoid recovery faster with active exercise
      const dip = -14 * Math.exp(-Math.pow((d - 3.2)/2.2, 2));
      const speed = strat === 'active' ? 0.28 : 0.19;
      const mid = strat === 'active' ? 9.5 : 13.5;
      const rec = 62 / (1 + Math.exp(-speed * (d - mid)));
      return Math.max(18, Math.min(96, Math.round(34 + dip + rec)));
    }

    function draw(){
      document.getElementById('vDay').textContent = `第 ${day} 天`;
      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = d => x0 + (d/21)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pts = [];
      for(let d=0; d<=21; d+=0.5){
        pts.push(`${toX(d).toFixed(1)},${toY(d2At(d)).toFixed(1)}`);
      }
      const val = d2At(day);

      document.getElementById('svg').innerHTML = `
        <rect x="${toX(1)}" y="${yMin}" width="${toX(6)-toX(1)}" height="${yMax-yMin}" fill="var(--tax-red-soft)" opacity="0.65"/>
        <text x="${toX(3.5)}" y="${yMin+14}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-red)">戒断低谷期</text>
        <rect x="${toX(14)}" y="${yMin}" width="${toX(21)-toX(14)}" height="${yMax-yMin}" fill="var(--tax-green-soft)" opacity="0.55"/>
        <text x="${toX(17.5)}" y="${yMin+14}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-green)">敏感度重生区</text>
        ${[0,3,7,10,14,18,21].map(d=>`<text x="${toX(d)}" y="206" text-anchor="middle" font-size="11" fill="var(--tax-muted)">D${d}</text>`).join('')}
        <polyline points="${pts.join(' ')}" fill="none" stroke="var(--tax-green)" stroke-width="3.4" stroke-linecap="round"/>
        <line x1="${toX(day)}" y1="${yMin}" x2="${toX(day)}" y2="${yMax}" stroke="var(--tax-ink)" stroke-dasharray="4 3" stroke-width="1.5"/>
        <circle cx="${toX(day)}" cy="${toY(val)}" r="6" fill="var(--tax-green)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">D2 多巴胺受体密度与日常愉悦感恢复轨迹</text>
      `;

      document.getElementById('kD2').textContent = val + '%';
      document.getElementById('kFeel').textContent = day <= 5 ? '焦躁空虚（正常戒断）' : day <= 12 ? '平静回暖中' : '清晰充实 ✨';
      document.getElementById('kRead').textContent = val >= 72 ? '高（容易进心流）' : val >= 48 ? '中等' : '极低（坐不住）';

      document.getElementById('ahaBox').innerHTML = day <= 5
        ? `💡 <strong>顿悟时刻：</strong>第 ${day} 天是最容易破功的“戒断谷底”（敏感度仅 ${val}%）！千万别误以为“我本来就不快乐”，这只是大脑还没来得及重新长出新的 D2 受体。`
        : day < 14
        ? `💡 <strong>顿悟时刻：</strong>熬过前一周后，曲线开始昂扬拐头（<strong>${val}%</strong>）！搭配运动和晨光能比“单纯干熬”提前约 4 天完成受体上调。`
        : `💡 <strong>顿悟时刻：</strong>第 ${day} 天，D2 受体敏感度已回升到 <strong>${val}%</strong>！你会惊讶地发现：一顿普通的家常菜、一段安静的散步或半小时深度阅读，又能重新带来久违的满足感！`;
    }

    draw();
  </script>
</body>
</html>
