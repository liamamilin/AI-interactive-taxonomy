<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌿 多巴胺受体敏感度重置（21天戒断曲线）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌿 多巴胺受体敏感度重置（21天戒断曲线）</h1><p>误区：戒掉娱乐就会永远像苦行僧一样无聊。真相：只要熬过前几天无聊期，下调的 D2 受体就会重新长出来，你会惊奇地发现喝白开水、晒太阳和读一页书居然重新变得有滋有味！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>减少廉价高刺激娱乐的天数</span><span id="vDays">14 天</span></label><input type="range" id="sDays" min="0" max="30" value="14" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>冷水澡/运动等主动努力型多巴胺</span><span id="vEff">50%</span></label><input type="range" id="sEff" min="0" max="100" value="50" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">D2 受体敏感度恢复</div><div class="k-val" id="kRec" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">日常专注与幸福感</div><div class="k-val" id="kHap">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const days=+document.getElementById('sDays').value, eff=+document.getElementById('sEff').value;
  document.getElementById('vDays').textContent=days+' 天'; document.getElementById('vEff').textContent=eff+'%';
  const rec=Math.min(98, Math.round(35 + 63*(1-Math.exp(-days/10)) + eff*0.1));
  document.getElementById('kRec').textContent=rec+'%';
  document.getElementById('kHap').textContent=rec>75?'充沛敏感 (享受细节)':(rec>50?'逐步恢复中':'受体钝化');
  let pts='';
  for(let d=0;d<=30;d++){
    const v=35 + 63*(1-Math.exp(-d/10)) + eff*0.1;
    pts+=`${40+d/30*520},${160-Math.min(98,v)*1.3} `;
  }
  const cx=40+days/30*520, cy=160-rec*1.3;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#059669" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#0284c7"/>
    <text x="50" y="30" font-size="12" font-weight="800" fill="#059669">第 ${days} 天 D2 受体敏感度回升至 ${rec}%</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>“先苦后甜”有坚实的神经生物学基础：主动做一件略微费力但有意义的事，多巴胺上升平缓且不会在事后把基线摔进谷底！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
