<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔑 B细胞克隆选择：百万分之一钥匙怎么配出？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .b-hit { cursor:pointer; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🔑 B细胞克隆选择：百万分之一钥匙怎么配出？</h1>
        <p>误区：病毒进来后，身体临时看一眼病毒长相才“现画图纸”造抗体。真相：你的骨髓早就通过 <strong>V(D)J 基因随机洗牌</strong>预造了上亿把奇形怪状的 B 细胞钥匙；病毒一进门，谁碰巧严丝合缝卡住，谁就被立刻复制成百万大军！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="newVirus()">🦠 换一个全新未知变异病毒</button>
        <span style="font-size:12.5px;font-weight:750;color:var(--tax-muted);">👆 点击下方 6 个随机预制的 B 细胞中形状与病毒完全互补的那一个，触发百万倍克隆扩增！</span>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当前病毒抗原形状</div><div class="k-val" id="kVir" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">克隆选择匹配状态</div><div class="k-val" id="kMatch" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">特效抗体军团规模</div><div class="k-val" id="kArmy" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const SHAPES = [
      { id:0, name:'三角尖刺', sym:'▲', col:'#ef4444' },
      { id:1, name:'方形蛋白', sym:'■', col:'#f59e0b' },
      { id:2, name:'圆形包膜', sym:'●', col:'#3b82f6' },
      { id:3, name:'菱形刺突', sym:'◆', col:'#8b5cf6' },
      { id:4, name:'星形表位', sym:'★', col:'#ec4899' },
      { id:5, name:'六边衣壳', sym:'⬡', col:'#14b8a6' }
    ];
    let targetId = 3;
    let pickedId = null;
    let matched = false;

    function newVirus(){
      let next = Math.floor(Math.random() * 6);
      if(next === targetId) next = (next + 1) % 6;
      targetId = next;
      pickedId = null;
      matched = false;
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function tryCell(id){
      pickedId = id;
      matched = (id === targetId);
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const v = SHAPES[targetId];
      let cellsSvg = '';
      SHAPES.forEach((s, i) => {
        const cx = 74 + i * 98, cy = 152;
        const isHit = matched && s.id === targetId;
        const isWrong = pickedId === s.id && !matched;
        const stroke = isHit ? 'var(--tax-green)' : (isWrong ? 'var(--tax-red)' : 'var(--tax-border)');
        const fill = isHit ? 'var(--tax-green-soft)' : (isWrong ? 'var(--tax-red-soft)' : 'var(--tax-surface-alt)');
        cellsSvg += `
          <g class="b-hit" onclick="tryCell(${s.id})">
            <rect x="${cx-40}" y="${cy-34}" width="80" height="68" rx="12" fill="${fill}" stroke="${stroke}" stroke-width="${isHit||isWrong?2.8:1.5}"/>
            <text x="${cx}" y="${cy+2}" text-anchor="middle" font-size="22" fill="${s.col}">${s.sym}</text>
            <text x="${cx}" y="${cy+23}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-ink)">B细胞 #${i+1}</text>
          </g>
        `;
      });

      // If matched, draw clone expansion burst around top-right
      let cloneBurst = '';
      if(matched){
        for(let k=0; k<12; k++){
          const bx = 430 + (k % 6) * 32, by = 38 + Math.floor(k / 6) * 30;
          cloneBurst += `<circle cx="${bx}" cy="${by}" r="11" fill="var(--tax-green-soft)" stroke="var(--tax-green)" stroke-width="1.5"/>
                         <text x="${bx}" y="${by+4}" text-anchor="middle" font-size="11" fill="${v.col}">${v.sym}</text>`;
        }
        cloneBurst += `<text x="510" y="92" text-anchor="middle" font-size="11.5" font-weight="850" fill="var(--tax-green)">⚡ 百万倍克隆扩增！</text>`;
      }

      document.getElementById('svg').innerHTML = `
        <rect x="28" y="20" width="340" height="74" rx="14" fill="var(--tax-red-soft)" stroke="var(--tax-red)" stroke-width="2"/>
        <text x="72" y="66" text-anchor="middle" font-size="30" fill="${v.col}">${v.sym}</text>
        <text x="112" y="48" font-size="13.5" font-weight="850" fill="var(--tax-red)">🦠 新入侵病毒抗原：${v.name}</text>
        <text x="112" y="72" font-size="11.5" fill="var(--tax-ink)">请从下方 6 个预制 B 细胞中点击能完美咬合的钥匙！</text>
        ${cloneBurst}
        <text x="28" y="110" font-size="11.5" font-weight="800" fill="var(--tax-muted)">人体随机预制 B 细胞抗体库（V(D)J 基因洗牌，真实库容超 10¹¹ 种）：</text>
        ${cellsSvg}
      `;

      document.getElementById('kVir').textContent = `${v.sym} ${v.name}`;
      document.getElementById('kMatch').textContent = matched ? '✅ 严丝合缝咬合！' : (pickedId !== null ? '❌ 形状不匹配，再试' : '等待配对...');
      document.getElementById('kArmy').textContent = matched ? '1,000,000+ 浆细胞军团 🚀' : '1 个巡逻兵';

      document.getElementById('ahaBox').innerHTML = matched
        ? `💡 <strong>顿悟时刻：</strong>命中！人类基因组只有 2 万多个基因，却靠 <strong>V(D)J 基因片段随机排列组合</strong>在病毒出现之前就盲造了上千亿把钥匙！一旦选中这唯一匹配的一把，立刻分裂出百万大军（并留下永久记忆 B 细胞）！`
        : pickedId !== null
        ? `💡 <strong>顿悟时刻：</strong>这把 B 细胞钥匙（${SHAPES[pickedId].sym}）锁不住当前病毒（${v.sym}），所以免疫系统不会浪费能量扩增它。试着点中对应的 <strong>${v.sym} ${v.name}</strong> 钥匙！`
        : `💡 <strong>顿悟时刻：</strong>这就是诺贝尔奖级理论<strong>“克隆选择学说”</strong>：不是“按需设计”，而是“提前随机海选 + 命中后疯狂复印”！点击下方匹配的 B 细胞体验克隆爆发！`;
    }

    draw();
  </script>
</body>
</html>
