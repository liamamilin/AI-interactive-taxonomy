<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌡️ 发烧的演化智慧：为什么免疫系统故意调高体温？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌡️ 发烧的演化智慧：为什么免疫系统故意调高体温？</h1><p>误区：只要体温一超过 37.5°C 就必须立刻吃强效退烧药压回正常。真相：38~39°C 的适度发烧能把白细胞游走和抗体合成速度翻倍，同时抑制细菌病毒复制——盲目压低微烧反而延长病程！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前人体设定体温</span><span id="vTemp">38.5 °C</span></label><input type="range" id="sTemp" min="36.5" max="41.0" step="0.2" value="38.5" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>患者耐受储备 (儿童/老人更脆弱)</span><span id="vTol">75%</span></label><input type="range" id="sTol" min="30" max="100" value="75" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">免疫细胞杀伤增速</div><div class="k-val" id="kImm" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">高热风险与建议</div><div class="k-val" id="kAdv">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const t=+document.getElementById('sTemp').value, tol=+document.getElementById('sTol').value;
  document.getElementById('vTemp').textContent=t.toFixed(1)+' °C'; document.getElementById('vTol').textContent=tol+'%';
  const boost=Math.round(100 + (t-36.8)*48 - Math.max(0, t-39.8)*90);
  const danger=t >= (38.8 + tol*0.015);
  document.getElementById('kImm').textContent=boost+'%';
  document.getElementById('kAdv').textContent=danger?'⚠️ 需物理/药物退热':'高温杀敌黄金区间';
  document.getElementById('kAdv').style.color=danger?'#ef4444':'#059669';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#059669">白细胞与干扰素战斗效率 (${t.toFixed(1)}°C): ${boost}%</text>
    <rect x="20" y="44" width="${Math.min(540,boost*2.2)}" height="24" rx="6" fill="#059669"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="${danger?'#ef4444':'#0284c7'}">${danger?'体温过载危险区：蛋白酶开始受损':'安全高能防御区：病菌繁殖被高温压制'}</text>
    <rect x="20" y="112" width="${Math.min(540,(t-36)*110)}" height="24" rx="6" fill="${danger?'#ef4444':'#0284c7'}"/>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>发烧不是身体坏了，而是下丘脑主动把空调调高到 ${t.toFixed(1)}°C 来“煮沸”入侵者；退烧药主要用于缓解痛苦与防止超高热损伤，而非消灭病毒本身！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
