<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 低患病率下的体检“假阳性爆炸”</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .scen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:9px; margin-bottom:14px; }
    .s-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .s-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .s-btn .t { font-size:13px; font-weight:800; }
    .s-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📊 低患病率下的体检“假阳性爆炸”</h1>
        <p>误区：某癌症筛查试剂“准确率 99%（灵敏度 99%、特异度 99%）”，所以我体检呈阳性就意味着 99% 得了绝症！真相：如果该病在年轻人里患病率只有 0.1%，1000 人体检会查出 <strong>1 个真病人 + 10 个假阳性</strong>——你拿到的阳性报告里，高达 <strong>91% 是虚惊一场</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🔬 同一台 99% 高精度仪器，对 1,000 人做检测，切换人群真实患病率看阳性报告可信度（PPV）：</div>
      <div class="scen-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">1,000 人中：真阳性 vs 假阳性</div><div class="k-val" id="kCnt" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">查出阳性后“真得病”概率 (PPV)</div><div class="k-val" id="kPpv">—</div></div>
        <div class="kpi"><div class="k-lbl">医学指南建议</div><div class="k-val" id="kAdv" style="font-size:14.5px;color:var(--tax-amber);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const POP = [
      { id:'low', icon:'🧍', name:'25 岁无症状普筛', desc:'真实患病率 0.1%（千分之一）', tp:1, fp:10, adv:'不推荐盲目全套肿瘤标普筛',
        aha:'💡 <strong>顿悟时刻：</strong>贝叶斯定理最反直觉的震撼！虽然仪器 99% 准，但健康人基数太大（999 人 × 1% 误报 = <strong>10 个假阳性</strong>），直接淹没了唯一的 1 个真病人！阳性报告里 <strong>91% 是假警报</strong>——这就是为什么指南反对健康年轻人盲目乱做全身肿瘤标志物普筛！' },
      { id:'mid', icon:'👵', name:'55 岁高危人群定向筛查', desc:'真实患病率 5%（每 20 人有 1 人）', tp:50, fp:10, adv:'🎯 精准高危筛查收益极高',
        aha:'💡 <strong>顿悟时刻：</strong>把同一台仪器聚焦到 55 岁以上或有家族史的高危人群（患病率 5%），真阳性跃升到 50 人，假阳性仍是 10 人，阳性报告的真实确诊率（PPV）瞬间从 9% 飙升到 <strong>83%</strong>！' },
      { id:'high', icon:'🏥', name:'已有典型症状门诊确诊', desc:'真实患病率 30%', tp:297, fp:7, adv:'✅ 高度可信，指导治疗',
        aha:'💡 <strong>顿悟时刻：</strong>医学检测的威力高度依赖“验前概率”！同样的 99% 仪器，用在有症状的门诊病人身上，阳性预测值高达 <strong>98%</strong>，几乎一锤定音！' }
    ];
    let cur = 'low';

    function pick(id){ cur = id; if(window.ToySDK) window.ToySDK.markCompleted(); draw(); }

    function draw(){
      document.getElementById('grid').innerHTML = POP.map(p => `
        <button class="s-btn ${cur===p.id?'active':''}" onclick="pick('${p.id}')">
          <div class="t">${p.icon} ${p.name}</div>
          <div class="s">${p.desc}</div>
        </button>
      `).join('');

      const p = POP.find(x=>x.id===cur);
      const totPos = p.tp + p.fp;
      const ppv = Math.round((p.tp / totPos) * 100);
      const col = ppv < 25 ? 'var(--tax-red)' : (ppv < 85 ? 'var(--tax-amber)' : 'var(--tax-green)');

      // Visualize the positive-report pool as 20 icons proportionally
      const slots = 20;
      const tpSlots = Math.max(1, Math.round((p.tp / totPos) * slots));
      let icons = '';
      for(let i=0; i<slots; i++){
        const cx = 56 + (i % 10) * 56, cy = 78 + Math.floor(i / 10) * 48;
        const isTp = i < tpSlots;
        icons += `<circle cx="${cx}" cy="${cy}" r="16" fill="${isTp?'var(--tax-red-soft)':'var(--tax-amber-soft)'}" stroke="${isTp?'var(--tax-red)':'var(--tax-amber)'}" stroke-width="2.2"/>
                  <text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="11.5" font-weight="900" fill="${isTp?'var(--tax-red)':'var(--tax-amber)'}">${isTp?'真':'假'}</text>`;
      }

      document.getElementById('svg').innerHTML = `
        <text x="28" y="28" font-size="13" font-weight="850" fill="var(--tax-ink)">所有拿到“🔴 体检阳性报告”的人中（共 ${totPos} 人）：真病人 vs 虚惊假阳性比例</text>
        <text x="28" y="48" font-size="11.5" fill="var(--tax-muted)">🔴 真 = 确实患病 (${p.tp}人) · 🟡 假 = 健康人被仪器误报 (${p.fp}人)</text>
        ${icons}
        <text x="28" y="190" font-size="12.5" font-weight="900" fill="${col}">结论：拿到阳性报告后，你真的得病的概率（PPV）只有 ${ppv}%！</text>
      `;

      document.getElementById('kCnt').textContent = `真 ${p.tp} 人 vs 假 ${p.fp} 人`;
      const kP = document.getElementById('kPpv'); kP.textContent = ppv + '%'; kP.style.color = col;
      document.getElementById('kAdv').textContent = p.adv;
      document.getElementById('ahaBox').innerHTML = p.aha;
    }

    draw();
  </script>
</body>
</html>
