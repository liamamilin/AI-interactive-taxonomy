<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 低患病率下的体检“假阳性爆炸”（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📊 低患病率下的体检“假阳性爆炸”（SVG）</h1><p>误区：只要体检仪器准确率达到 99%，那我查出阳性就 99% 真的是生病了。真相：当真正患病率只有 0.1%（千分之一）时，99% 准确率在 1000 个健康人里抓出的 10 个假阳性，能把 1 个真病人淹没到只剩 9%！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>人群真实患病率</span><span id="vPrev">0.5% (5/1000)</span></label><input type="range" id="sPrev" min="1" max="50" value="5" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>检测假阳性误报率 (1 - 特异度)</span><span id="vFp">3%</span></label><input type="range" id="sFp" min="1" max="10" value="3" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">真病人检出 (真阳性)</div><div class="k-val" id="kTP" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">健康人虚惊 (假阳性)</div><div class="k-val" id="kFP" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">阳性结果真的有病概率 (PPV)</div><div class="k-val" id="kPPV" style="color:#0284c7;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const prev=+document.getElementById('sPrev').value/1000, fpRate=+document.getElementById('sFp').value/100;
  document.getElementById('vPrev').textContent=(prev*100).toFixed(1)+'% ('+Math.round(prev*1000)+'/1000)';
  document.getElementById('vFp').textContent=(fpRate*100).toFixed(0)+'%';
  const tp=Math.round(1000*prev*0.98), fp=Math.round(1000*(1-prev)*fpRate);
  const ppv=tp+fp>0?(tp/(tp+fp)*100):0;
  document.getElementById('kTP').textContent=tp+' 人';
  document.getElementById('kFP').textContent=fp+' 人';
  document.getElementById('kPPV').textContent=ppv.toFixed(1)+'%';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#059669">每 1000 人体检中的真阳性患者: ${tp} 人</text>
    <rect x="20" y="44" width="${Math.max(4,tp*5)}" height="24" rx="6" fill="#059669"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#ef4444">每 1000 人中被误报的假阳性健康人: ${fp} 人</text>
    <rect x="20" y="112" width="${Math.min(540,fp*5)}" height="24" rx="6" fill="#ef4444"/>
    <text x="20" y="166" font-size="13" font-weight="850" fill="#0284c7">体检单亮红灯时，真的患病概率仅 ${ppv.toFixed(1)}%（虚惊率 ${(100-ppv).toFixed(1)}%）！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>这就是为什么医学指南反对健康年轻人乱查高敏肿瘤标志物或全身 CT！在极低基础患病率下，阳性结果有 <strong>${(100-ppv).toFixed(1)}%</strong> 是虚惊一场，带来巨额心理恐慌和过度穿刺！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
