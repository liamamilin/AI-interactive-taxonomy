<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏳ 领先时间偏倚：早查出癌症真的让你多活了 3 年吗？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⏳ 领先时间偏倚：早查出癌症真的让你多活了 3 年吗？</h1>
        <p>误区：某高端早筛广告宣传“把 5 年生存率从 0% 提高到了 100%”，说明它肯定能大幅延长寿命！真相：如果查出来却没有更有效的根治手段，只是把“确诊秒表”提前按了 4 年，<strong>患者离世的年龄一天没变，却白白多当了 4 年焦虑的病人</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setMode('bias',this)">🎭 统计幻觉：早查出 4 年但无根治药（领先时间偏倚）</button>
        <button class="pill" onclick="setMode('real',this)">🏆 真正有效的早筛（如肠镜切息肉 · 真的延寿！）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">不筛查组：确诊后“5年生存”</div><div class="k-val" style="color:var(--tax-muted);">仅活 3 年 (0%)</div></div>
        <div class="kpi"><div class="k-lbl">早筛组：确诊后“5年生存”</div><div class="k-val" id="kSurv" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">实际多活了几年？</div><div class="k-val" id="kReal">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let mode = 'bias';
    function setMode(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const isReal = mode === 'real';
      // Axis: age 58 to 76
      const x0=54, x1=610;
      const toX = a => x0 + ((a - 58)/18)*(x1-x0);

      const deathB = isReal ? 75 : 68;
      document.getElementById('svg').innerHTML = `
        ${[58,60,62,64,66,68,70,72,74,76].map(a=>`<line x1="${toX(a)}" y1="28" x2="${toX(a)}" y2="180" stroke="var(--tax-border)" stroke-dasharray="3 3"/><text x="${toX(a)}" y="200" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${a}岁</text>`).join('')}

        <text x="${x0}" y="46" font-size="12.5" font-weight="850" fill="var(--tax-muted)">路线 A：未做早筛（65岁出现症状确诊 → 68岁离世，确诊后活 3 年）</text>
        <rect x="${toX(58)}" y="56" width="${toX(65)-toX(58)}" height="24" rx="5" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="${toX(65)}" y="56" width="${toX(68)-toX(65)}" height="24" rx="5" fill="var(--tax-amber)"/>
        <text x="${toX(66.5)}" y="72" text-anchor="middle" font-size="11" font-weight="850" fill="#fff">3年</text>

        <text x="${x0}" y="118" font-size="12.5" font-weight="850" fill="${isReal?'var(--tax-green)':'var(--tax-red)'}">
          ${isReal?'路线 B：有效早筛（61岁切掉早癌/息肉 → 真正延寿至 75 岁！）':'路线 B：早筛提前 4 年发现（61岁确诊 → 依然 68岁离世！）'}
        </text>
        <rect x="${toX(58)}" y="128" width="${toX(61)-toX(58)}" height="24" rx="5" fill="var(--tax-surface-alt)" stroke="var(--tax-border)"/>
        <rect x="${toX(61)}" y="128" width="${toX(deathB)-toX(61)}" height="24" rx="5" fill="${isReal?'var(--tax-green)':'var(--tax-red)'}"/>
        <text x="${(toX(61)+toX(deathB))/2}" y="144" text-anchor="middle" font-size="11.5" font-weight="900" fill="#fff">确诊后存活 ${deathB-61} 年（5年生存率 100%!）</text>
        <line x1="${toX(68)}" y1="48" x2="${toX(68)}" y2="162" stroke="var(--tax-red)" stroke-width="2" stroke-dasharray="4 3"/>
      `;

      document.getElementById('kSurv').textContent = `活 ${deathB-61} 年 (100%!)`;
      const kR = document.getElementById('kReal');
      kR.textContent = isReal ? '+7 年真实延寿 🏆' : '+0 年（一天没多活!）🎭';
      kR.style.color = isReal ? 'var(--tax-green)' : 'var(--tax-red)';

      document.getElementById('ahaBox').innerHTML = isReal
        ? `💡 <strong>顿悟时刻：</strong>只有像<strong>肠镜切息肉、宫颈 HPV 筛查、低剂量肺 CT</strong>这样“早发现后确实能靠干预改写死亡终点”的筛查，才能真正降低<strong>全因死亡率</strong>并让你多活 7 年以上！`
        : `💡 <strong>顿悟时刻：</strong>看清这个经典统计魔术！仅仅把确诊秒表从 65 岁提前到 61 岁，就能让“5 年生存率”从 0% 奇迹般暴涨到 100%，哪怕死亡终点（68 岁红虚线）纹丝不动！所以评价一种早筛值不值得做，永远看<strong>是否降低真实死亡率</strong>，绝不只看“5 年生存率”！`;
    }

    draw();
  </script>
</body>
</html>
