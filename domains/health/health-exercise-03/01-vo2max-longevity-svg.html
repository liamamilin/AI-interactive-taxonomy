<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>❤️ VO2 Max 与全因死亡率悬崖曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .tier-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(142px,1fr)); gap:9px; margin-bottom:14px; }
    .t-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .t-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .t-btn .t { font-size:13px; font-weight:800; }
    .t-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>❤️ VO2 Max 与全因死亡率悬崖曲线</h1>
        <p>误区：VO2 Max（最大摄氧量）只是马拉松运动员才关心的炫技指标。真相：人过 30 岁后心肺每十年自然衰减约 10%——你今天攒下的 VO2 Max 存款，直接决定了你 80 岁时还能不能自己爬三楼买菜！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🏦 选择你 35 岁时的心肺储备起跑线，推演未来 55 年（35 → 90 岁）的自理能力下滑曲线：</div>
      <div class="tier-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">相对全因死亡风险</div><div class="k-val" id="kRisk">—</div></div>
        <div class="kpi"><div class="k-lbl">80 岁时剩余 VO2 Max</div><div class="k-val" id="k80" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">80 岁能否轻松爬三楼？</div><div class="k-val" id="kStair">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const TIERS = [
      { id:'low', icon:'🛋️', name:'久坐垫底 25%', v35:30, hr:'4.0×（极高风险）', desc:'35 岁 VO2 = 30' },
      { id:'avg', icon:'🚶', name:'普通平均水平', v35:38, hr:'2.0×（基准风险）', desc:'35 岁 VO2 = 38' },
      { id:'high', icon:'🏃', name:'常年运动前 25%', v35:48, hr:'1.3×（显著保护）', desc:'35 岁 VO2 = 48' },
      { id:'elite', icon:'🏆', name:'耐力精英前 2%', v35:58, hr:'1.0×（死亡率最低）', desc:'35 岁 VO2 = 58' }
    ];
    let cur = 'avg';

    function pick(id){ cur = id; if(window.ToySDK) window.ToySDK.markCompleted(); draw(); }

    function vo2At(v35, age){
      return v35 * Math.pow(0.90, (age - 35) / 10);
    }

    function draw(){
      document.getElementById('grid').innerHTML = TIERS.map(t => `
        <button class="t-btn ${cur===t.id?'active':''}" onclick="pick('${t.id}')">
          <div class="t">${t.icon} ${t.name}</div>
          <div class="s">${t.desc}</div>
        </button>
      `).join('');

      const t = TIERS.find(x=>x.id===cur);
      const x0=54, x1=612, yMin=26, yMax=190;
      const toX = a => x0 + ((a - 35)/55)*(x1-x0);
      const toY = v => yMax - (Math.min(62, v)/62)*(yMax-yMin);

      const curves = TIERS.map(tr => {
        const pts = [];
        for(let a=35; a<=90; a+=2.5) pts.push(`${toX(a).toFixed(1)},${toY(vo2At(tr.v35, a)).toFixed(1)}`);
        const active = tr.id === cur;
        const col = tr.id==='low'?'var(--tax-red)':tr.id==='elite'?'var(--tax-green)':tr.id==='high'?'var(--tax-primary)':'var(--tax-amber)';
        return `<polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="${active?3.8:1.5}" opacity="${active?1:0.35}"/>`;
      }).join('');

      const v80 = vo2At(t.v35, 80);
      const canStair = v80 >= 22;
      const colNow = t.id==='low'?'var(--tax-red)':t.id==='elite'?'var(--tax-green)':t.id==='high'?'var(--tax-primary)':'var(--tax-amber)';

      document.getElementById('svg').innerHTML = `
        <rect x="${x0}" y="${toY(18)}" width="${x1-x0}" height="${yMax-toY(18)}" fill="var(--tax-red-soft)" opacity="0.65"/>
        <line x1="${x0}" y1="${toY(18)}" x2="${x1}" y2="${toY(18)}" stroke="var(--tax-red)" stroke-dasharray="5 4" stroke-width="1.6"/>
        <text x="${x1-6}" y="${toY(18)+14}" text-anchor="end" font-size="10.5" font-weight="800" fill="var(--tax-red)">生活自理警戒线 (VO2=18：平地慢走/起身)</text>
        <line x1="${x0}" y1="${toY(24)}" x2="${x1}" y2="${toY(24)}" stroke="var(--tax-green)" stroke-dasharray="4 4" stroke-opacity="0.7"/>
        <text x="${x1-6}" y="${toY(24)-5}" text-anchor="end" font-size="10.5" font-weight="750" fill="var(--tax-green)">独立爬三楼/提重物线 (VO2=24)</text>
        ${[35,45,55,65,75,85,90].map(a=>`<text x="${toX(a)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${a}岁</text>`).join('')}
        ${curves}
        <circle cx="${toX(80)}" cy="${toY(v80)}" r="6.5" fill="${colNow}"/>
        <text x="${toX(80)-8}" y="${toY(v80)-10}" text-anchor="end" font-size="12" font-weight="850" fill="${colNow}">80岁: ${v80.toFixed(1)}</text>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">心肺储备随年龄衰减轨迹（每 10 年自然下降约 10%）</text>
      `;

      const kR = document.getElementById('kRisk'); kR.textContent = t.hr; kR.style.color = colNow;
      document.getElementById('k80').textContent = v80.toFixed(1) + ' ml/kg/min';
      const kS = document.getElementById('kStair');
      kS.textContent = v80 >= 24 ? '轻松独立爬三楼 ✅' : (v80 >= 18 ? '勉强平地散步 ⚠️' : '跌破自理线 🚨');
      kS.style.color = v80 >= 24 ? 'var(--tax-green)' : (v80 >= 18 ? 'var(--tax-amber)' : 'var(--tax-red)');

      document.getElementById('ahaBox').innerHTML = t.id === 'low'
        ? `💡 <strong>顿悟时刻：</strong>35 岁只有 30 的心肺存款，到了 80 岁会滑落到 <strong>${v80.toFixed(1)}</strong>，连独立买菜爬楼都吃力！好消息是：<strong>从垫底 25% 练到普通偏上，带来的死亡率降幅比戒烟还要大！</strong>`
        : t.id === 'elite' || t.id === 'high'
        ? `💡 <strong>顿悟时刻：</strong>你存下了厚实的心肺养老金！哪怕按每十年降 10% 衰老，80 岁依然手握 <strong>${v80.toFixed(1)}</strong> 的摄氧储备——这就是长寿医学说的“百年老人十项全能”：80 岁还能自己提行李箱、陪孙辈逛公园！`
        : `💡 <strong>顿悟时刻：</strong>普通水平（38）在 80 岁时刚好卡在 <strong>${v80.toFixed(1)}</strong> 爬楼边缘。现在每周坚持 Zone 2 + 1 次间歇，把 VO2 Max 抬高 8–10 点，等于给晚年多买 15 年高质量自理寿命！`;
    }

    draw();
  </script>
</body>
</html>
