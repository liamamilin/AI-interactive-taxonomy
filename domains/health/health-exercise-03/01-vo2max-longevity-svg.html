<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>❤️ VO2 Max 与全因死亡率悬崖曲线（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>❤️ VO2 Max 与全因死亡率悬崖曲线（SVG）</h1><p>误区：最大摄氧量只是马拉松运动员才需要关心的竞技数据。真相：人过 30 岁后 VO2 Max 每十年掉 10%；你现在储备不够高，80 岁时连买菜爬两层楼都会突破极限而卧床！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前最大摄氧量 (VO2 Max)</span><span id="vVo2">42 ml/kg/min</span></label><input type="range" id="sVo2" min="20" max="65" value="42" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>当前生理年龄</span><span id="vAge">35 岁</span></label><input type="range" id="sAge" min="25" max="75" value="35" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">80岁预期剩余 VO2 Max</div><div class="k-val" id="k80">—</div></div>
        <div class="kpi"><div class="k-lbl">全因死亡风险相对倍数</div><div class="k-val" id="kRisk" style="color:#059669;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const vo2=+document.getElementById('sVo2').value, age=+document.getElementById('sAge').value;
  document.getElementById('vVo2').textContent=vo2+' ml/kg/min'; document.getElementById('vAge').textContent=age+' 岁';
  const at80=Math.max(10, Math.round(vo2*Math.pow(0.91, Math.max(0,(80-age)/10))));
  const risk=(1/(0.25 + (vo2-18)*0.025)).toFixed(2)+'x';
  const indep=at80>=18;
  document.getElementById('k80').textContent=at80+' ml/kg/min';
  document.getElementById('k80').style.color=indep?'#059669':'#ef4444';
  document.getElementById('kRisk').textContent=risk;
  let pts='';
  for(let v=20;v<=65;v+=2){
    const r=1/(0.25 + (v-18)*0.025);
    pts+=`${40+(v-20)/45*520},${160-Math.min(130,r*35)} `;
  }
  const cx=40+(vo2-20)/45*520, cy=160-Math.min(130,parseFloat(risk)*35);
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#059669" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#0284c7"/>
    <text x="50" y="28" font-size="12" font-weight="800" fill="#059669">VO2 Max 越高，死亡率曲线断崖下行；18 为 80 岁生活自理最低红线</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>生活自理（爬楼梯、拎重物）至少需要 18 的摄氧量。你 ${age} 岁时储备到 ${vo2}，80 岁时还能剩 <strong>${at80}</strong>，${indep?'足以稳稳独立养老！':'有提前丧失独立行动力的风险！'}`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
