<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧼 卫生假说：免疫系统“太闲了”就会乱开枪（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧼 卫生假说：免疫系统“太闲了”就会乱开枪（SVG）</h1><p>误区：过敏是因为免疫系统“太弱了”，需要吃保健品把免疫力再拉高一点。真相：过敏恰恰是因为免疫系统太闲太敏感、把无害的花粉/花生当成了恐怖寄生虫，狂喷组胺误伤自己！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>早期自然微生物接触度 (泥土/宠物)</span><span id="vNat">30%</span></label><input type="range" id="sNat" min="5" max="100" value="30" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>环境无菌/消毒剂过度使用度</span><span id="vSte">75%</span></label><input type="range" id="sSte" min="0" max="100" value="75" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">Th2 过敏倾向活跃度</div><div class="k-val" id="kTh2" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">过敏/哮喘发生风险</div><div class="k-val" id="kRisk">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const nat=+document.getElementById('sNat').value, ste=+document.getElementById('sSte').value;
  document.getElementById('vNat').textContent=nat+'%'; document.getElementById('vSte').textContent=ste+'%';
  const th2=Math.max(10, Math.min(95, Math.round(50 + ste*0.45 - nat*0.4)));
  document.getElementById('kTh2').textContent=th2+'%';
  document.getElementById('kRisk').textContent=th2>60?'高风险 (过度反应)':'免疫耐受平衡';
  document.getElementById('kRisk').style.color=th2>60?'#ef4444':'#059669';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#059669">调节性 T 细胞 (Treg 维和部队) 成熟度: ${Math.round(nat*0.9)}%</text>
    <rect x="20" y="44" width="${nat*0.9*5.4}" height="24" rx="6" fill="#059669"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#ef4444">Th2 过敏误报率 (IgE 组胺炸弹): ${th2}%</text>
    <rect x="20" y="112" width="${th2*5.4}" height="24" rx="6" fill="#ef4444"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">过分无菌环境剥夺了免疫系统的“靶场练兵机会”，导致见啥打啥</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>免疫系统需要靠早期的泥土和益生菌来校准“敌我识别精度”！过度消毒（${ste}%）让维和部队缺席，一粒花粉就能引爆全身组胺警报（${th2}%）！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
