<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 自身免疫误伤：胸腺“新兵政审”漏网之鱼</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎯 自身免疫误伤：胸腺“新兵政审”漏网之鱼</h1><p>误区：自身免疫病（如红斑狼疮/类风湿）是因为免疫力太差。真相：恰恰相反，是免疫系统火力太猛、且病毒长得太像人体自身蛋白（分子模拟），导致部队在清敌时把自己的关节或胰岛也当敌人炸了！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>免疫系统识别容错宽松度</span><span id="vTol">35%</span></label><input type="range" id="sTol" min="10" max="90" value="35" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>病原体与自身组织的“分子伪装度”</span><span id="vMim">70%</span></label><input type="range" id="sMim" min="10" max="95" value="70" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">漏过病原体风险</div><div class="k-val" id="kMiss" style="color:#f59e0b;">—</div></div>
        <div class="kpi"><div class="k-lbl">友军误伤 (自身免疫)</div><div class="k-val" id="kAuto" style="color:#ef4444;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const tol=+document.getElementById('sTol').value, mim=+document.getElementById('sMim').value;
  document.getElementById('vTol').textContent=tol+'%'; document.getElementById('vMim').textContent=mim+'%';
  const miss=Math.round(tol*0.65);
  const auto=Math.max(3, Math.round(mim*0.65 - tol*0.35));
  document.getElementById('kMiss').textContent=miss+'%';
  document.getElementById('kAuto').textContent=auto+'%';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#f59e0b">过度宽容导致放跑伪装病毒: ${miss}%</text>
    <rect x="20" y="44" width="${miss*5.4}" height="24" rx="6" fill="#f59e0b"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#ef4444">宁杀错不放过导致误伤自身器官: ${auto}%</text>
    <rect x="20" y="112" width="${auto*5.4}" height="24" rx="6" fill="#ef4444"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">免疫平衡就是走钢丝：既要打死披着羊皮的狼，又不能误伤真羊</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>很多病毒会故意长得和人类关节、心肌或神经髓鞘很像（伪装度 ${mim}%）。为了消灭病毒，免疫系统有时不得不冒着 ${auto}% 的友军误伤风险开火！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
