<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪜 脱敏疗法阶梯：微剂量诱导“免疫耐受”</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🪜 脱敏疗法阶梯：微剂量诱导“免疫耐受”</h1><p>误区：对某种食物或花粉过敏，一辈子只能绝对零接触，绝不可能逆转。真相：在医生监护下，从十万分之一的极微剂量开始逐周递增，能诱导免疫系统改产温和的 IgG4 抗体，把警报阀彻底调高！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>规范脱敏递增坚持周数</span><span id="vWk">16 周</span></label><input type="range" id="sWk" min="1" max="36" value="16" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>单次增量步幅控制稳健度</span><span id="vStep">85%</span></label><input type="range" id="sStep" min="30" max="100" value="85" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">耐受阈值提升倍数</div><div class="k-val" id="kTol" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">安全耐受状态</div><div class="k-val" id="kSafe">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const wk=+document.getElementById('sWk').value, stp=+document.getElementById('sStep').value;
  document.getElementById('vWk').textContent=wk+' 周'; document.getElementById('vStep').textContent=stp+'%';
  const mul=Math.round(Math.pow(1.18, wk)*(stp/80));
  document.getElementById('kTol').textContent=mul+'x';
  document.getElementById('kSafe').textContent=stp<50?'增量太猛易诱发急性过敏!':(wk>20?'高耐受安全':'稳步建立耐受中');
  let pts='';
  for(let w=1;w<=36;w++){
    const m=Math.min(350, Math.pow(1.18,w)*(stp/80));
    pts+=`${40+(w-1)/35*520},${158-m/350*125} `;
  }
  const cx=40+(wk-1)/35*520, cy=158-Math.min(350,mul)/350*125;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="158" x2="560" y2="158" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#059669" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#0284c7"/>
    <text x="50" y="28" font-size="12" font-weight="800" fill="#059669">第 ${wk} 周耐受阈值爬升至初始的 ${mul} 倍</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>免疫系统是可以“被重新训练”的！通过极微剂量（稳健度 ${stp}%）反复敲门而不引爆警报，身体会逐步学会把过敏原当成无害路人，耐受量翻升 <strong>${mul} 倍</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
