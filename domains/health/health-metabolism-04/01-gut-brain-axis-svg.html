<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 脑肠轴生态与神经递质工厂</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .mode-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .pill.bad.active { background:var(--tax-red); border-color:var(--tax-red); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .node-hit { cursor:pointer; }
    .info-card { margin-top:12px; padding:12px 14px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .info-card h3 { font-size:14.5px; margin-bottom:4px; }
    .info-card p { font-size:13px; color:var(--tax-muted); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧠 脑肠轴生态与神经递质工厂</h1>
        <p>误区：大脑是高高在上的唯一总司令，肠道只是负责排泄的笨管道。真相：肠道拥有上亿神经元并合成人体约 90% 的血清素，通过 3 条高速通道全天候双向“遥控”你的情绪、焦虑和精力！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="mode-row">
        <span style="font-size:12.5px;font-weight:800;color:var(--tax-muted);">肠道生态状态：</span>
        <button class="pill active" id="btnGood" onclick="setState('good')">🥗 高纤维健康生态</button>
        <button class="pill bad" id="btnBad" onclick="setState('bad')">🍔 高糖+熬夜+抗生素失衡</button>
        <span style="font-size:12px;color:var(--tax-muted);margin-left:auto;">👆 点击下方图谱中任意一条通路探索机理</span>
      </div>

      <svg id="svg" class="svg-box" viewBox="0 0 640 235"></svg>

      <div class="info-card" id="detailBox"></div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const PATHS = {
      vagus: {
        name:'⚡ 神经快线：迷走神经（双向光纤）',
        good:'约 80% 的迷走神经纤维是从肠道向大脑“上行汇报”！健康菌群分泌的 GABA 与丁酸通过迷走神经传递平静信号，副交感神经占优，情绪松弛稳定。',
        bad:'菌群失衡时，迷走神经不断向大脑发送“警报与渴望”信号，人更容易莫名烦躁、焦虑或疯狂想吃高糖食物。',
        aha:'💡 <strong>顿悟时刻：</strong>你以为“紧张就胃痛”只是大脑影响肚子？其实<strong>80% 的信息流是从肚子发往大脑的</strong>——肠道才是情绪的“第二大脑”！'
      },
      serotonin: {
        name:'🧪 化学信使：90% 血清素与色氨酸工厂',
        good:'肠道嗜铬细胞在有益菌协助下，高效把色氨酸转化为血清素前体与神经调节因子，既维持肠道蠕动节律，也为大脑提供充足的情绪原料。',
        bad:'慢性肠道炎症会劫持色氨酸代谢通路（转向犬尿氨酸炎症通路），导致大脑可用原料短缺，出现精力低迷与情绪抑郁感。',
        aha:'💡 <strong>顿悟时刻：</strong>情绪低落未必全靠“想开点”——肠道生态直接决定了色氨酸是用来造“快乐原料”还是被炎症消耗掉！'
      },
      scfa: {
        name:'🛡️ 免疫屏障：短链脂肪酸 (SCFA) 与肠漏防线',
        good:'有益菌发酵膳食纤维产生大量丁酸（SCFA），给肠壁细胞供能并把紧密连接焊死，阻挡内毒素入血，大脑免受神经炎症干扰，思路清晰。',
        bad:'缺乏纤维时，细菌啃食肠道黏液层导致“肠壁通透性增加”，脂多糖（LPS）等炎症因子入血波及大脑，引起典型的“脑雾”和莫名疲惫。',
        aha:'💡 <strong>顿悟时刻：</strong>膳食纤维人类自己消化不了，但它是肠道菌群制造<strong>丁酸（SCFA）</strong>的唯一口粮——少吃纤维等于断了肠壁城墙的维修建材！'
      }
    };
    let state = 'good';
    let focus = 'vagus';

    function setState(s){
      state = s;
      document.getElementById('btnGood').classList.toggle('active', s==='good');
      document.getElementById('btnBad').classList.toggle('active', s==='bad');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }
    function selectPath(p){
      focus = p;
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const isGood = state === 'good';
      const col = isGood ? 'var(--tax-green)' : 'var(--tax-red)';
      const soft = isGood ? 'var(--tax-green-soft)' : 'var(--tax-red-soft)';

      const nodes = [
        { id:'vagus', y:52, label:'⚡ 迷走神经快线', sub:isGood?'上行平静信号 (80%上行)':'高频焦虑/催糖警报' },
        { id:'serotonin', y:118, label:'🧪 血清素原料工厂', sub:isGood?'色氨酸高效供给':'炎症劫持原料短缺' },
        { id:'scfa', y:184, label:'🛡️ SCFA 肠壁屏障', sub:isGood?'丁酸充足 · 屏障紧固':'黏液变薄 · 脑雾炎症' }
      ];

      document.getElementById('svg').innerHTML = `
        <rect x="20" y="54" width="142" height="126" rx="16" fill="var(--tax-primary-soft)" stroke="var(--tax-primary)" stroke-width="2"/>
        <text x="91" y="102" text-anchor="middle" font-size="28">🧠</text>
        <text x="91" y="130" text-anchor="middle" font-size="14" font-weight="850" fill="var(--tax-primary)">大脑情绪中枢</text>
        <text x="91" y="152" text-anchor="middle" font-size="11.5" font-weight="750" fill="${col}">${isGood?'清醒 · 平静 · 专注':'脑雾 · 易焦虑 · 馋糖'}</text>

        <rect x="478" y="54" width="142" height="126" rx="16" fill="${soft}" stroke="${col}" stroke-width="2"/>
        <text x="549" y="102" text-anchor="middle" font-size="28">🦠</text>
        <text x="549" y="130" text-anchor="middle" font-size="14" font-weight="850" fill="${col}">肠道微生态</text>
        <text x="549" y="152" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-ink)">${isGood?'益生菌丰茂 · 纤维足':'菌群单一 · 炎症偏高'}</text>

        ${nodes.map(n => {
          const active = focus === n.id;
          const stroke = active ? 'var(--tax-primary)' : 'var(--tax-border)';
          const lineCol = active ? col : 'var(--tax-muted)';
          return `
            <line x1="162" y1="117" x2="225" y2="${n.y}" stroke="${lineCol}" stroke-width="${active?3:1.5}" stroke-dasharray="${isGood?'0':'5 4'}"/>
            <line x1="415" y1="${n.y}" x2="478" y2="117" stroke="${lineCol}" stroke-width="${active?3:1.5}" stroke-dasharray="${isGood?'0':'5 4'}"/>
            <g class="node-hit" onclick="selectPath('${n.id}')">
              <rect x="225" y="${n.y-24}" width="190" height="48" rx="11" fill="${active?'var(--tax-primary-soft)':'var(--tax-surface-alt)'}" stroke="${stroke}" stroke-width="${active?2.4:1.2}"/>
              <text x="320" y="${n.y-3}" text-anchor="middle" font-size="12.5" font-weight="850" fill="var(--tax-ink)">${n.label}</text>
              <text x="320" y="${n.y+15}" text-anchor="middle" font-size="10.8" font-weight="700" fill="${active?col:'var(--tax-muted)'}">${n.sub}</text>
            </g>
          `;
        }).join('')}
      `;

      const p = PATHS[focus];
      document.getElementById('detailBox').innerHTML = `
        <h3 style="color:${col};">${p.name}（当前：${isGood?'健康运转':'失衡警报'}）</h3>
        <p>${isGood ? p.good : p.bad}</p>
      `;
      document.getElementById('ahaBox').innerHTML = p.aha;
    }

    draw();
  </script>
</body>
</html>
