<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛡️ 诺德森“多重打击”防线击穿模拟（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🛡️ 诺德森“多重打击”防线击穿模拟（SVG）</h1><p>误区：只要接触一次致癌物或发生一次基因突变，细胞就会立刻变成癌细胞。真相：癌症至少需要集齐 5~7 个关键驱动突变（油门卡死 + 双重刹车全断 + 免疫隐身），是一个漫长多年的“多重打击”过程！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>致癌暴露 (烟草/辐射/慢性炎症)</span><span id="vExp">45%</span></label><input type="range" id="sExp" min="5" max="100" value="45" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>经过岁月年龄</span><span id="vAge">55 岁</span></label><input type="range" id="sAge" min="20" max="85" value="55" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">已被击穿的防线层数 (共6层)</div><div class="k-val" id="kHits" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">恶性肿瘤形成风险</div><div class="k-val" id="kRisk">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const exp=+document.getElementById('sExp').value, age=+document.getElementById('sAge').value;
  document.getElementById('vExp').textContent=exp+'%'; document.getElementById('vAge').textContent=age+' 岁';
  const hits=Math.min(6, Math.max(1, Math.round(exp*age/1300)));
  const names=['1.油门卡死','2.p53刹车1断','3.刹车2全失','4.端粒永生','5.免疫隐身','6.血管转移'];
  document.getElementById('kHits').textContent=hits+' / 6 层';
  document.getElementById('kRisk').textContent=hits>=5?'高危 (防线接近全穿)':'安全拦截中';
  document.getElementById('kRisk').style.color=hits>=5?'#ef4444':'#059669';
  let gates='';
  names.forEach((nm,i)=>{
    const broken=i<hits, x=30+i*92;
    gates+=`<rect x="${x}" y="52" width="80" height="75" rx="8" fill="${broken?'#ef4444':'#059669'}" opacity="0.2" stroke="${broken?'#ef4444':'#059669'}" stroke-width="2"/>
    <text x="${x+40}" y="84" text-anchor="middle" font-size="11.5" font-weight="800" fill="${broken?'#ef4444':'#059669'}">${nm}</text>
    <text x="${x+40}" y="110" text-anchor="middle" font-size="12" font-weight="850" fill="var(--tax-text)">${broken?'💥失守':'🛡️稳固'}</text>`;
  });
  document.getElementById('svg').innerHTML=gates+`<text x="30" y="160" font-size="12.5" font-weight="750" fill="var(--tax-muted)">必须连续击穿全部 6 道独立安全阀才会形成临床癌症</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>正因为需要“多重打击”累积（当前已破 ${hits}/6 层），癌症风险才随年龄呈指数上升，也正因如此，戒烟、防晒和早筛能把防线稳稳挡在前 3 层！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
