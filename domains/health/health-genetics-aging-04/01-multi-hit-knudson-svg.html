<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛡️ 诺德森“多重打击”防线击穿模拟</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .hit-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:9px; margin-bottom:14px; }
    .h-btn { padding:10px 11px; border-radius:12px; border:1.5px solid var(--tax-green); background:var(--tax-green-soft); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .h-btn.broken { border-color:var(--tax-red); background:var(--tax-red-soft); }
    .h-btn .t { display:flex; justify-content:space-between; font-size:12.5px; font-weight:850; }
    .h-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🛡️ 诺德森“多重打击”防线击穿模拟</h1>
        <p>误区：只要细胞里发生一次基因突变，就会立刻长出恶性肿瘤。真相：人体每天发生上万次 DNA 突变，但演化筑起了 <strong>5 道严密安检防线</strong>——一个正常细胞往往需要历经几十年、接连击穿 <strong>4–5 道防线（多重打击）</strong>才能突破癌变！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">💥 点击逐一击穿下方 5 道人体抗癌防线（绿色 = 完好守卫，红色 = 已突变击穿）：</div>
      <div class="hit-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 190"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">已被击穿防线数</div><div class="k-val" id="kHits" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">当前细胞演化阶段</div><div class="k-val" id="kStage">—</div></div>
        <div class="kpi"><div class="k-lbl">剩余拦截概率</div><div class="k-val" id="kStop" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const SHIELDS = [
      { id:0, name:'① DNA 错配修复酶', desc:'复制纠错巡检', broken:true },
      { id:1, name:'② 原癌基因油门', desc:'控制分裂速度', broken:false },
      { id:2, name:'③ p53 抑癌总刹车', desc:'受损即令自杀', broken:false },
      { id:3, name:'④ 端粒限次熔断', desc:'50次分裂上限', broken:false },
      { id:4, name:'⑤ 免疫 T 细胞巡逻', desc:'定点清除异己', broken:false }
    ];

    function toggle(i){
      SHIELDS[i].broken = !SHIELDS[i].broken;
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      document.getElementById('grid').innerHTML = SHIELDS.map(s => `
        <button class="h-btn ${s.broken?'broken':''}" onclick="toggle(${s.id})">
          <div class="t"><span>${s.name}</span><span>${s.broken?'💥 击穿':'🛡️ 守卫'}</span></div>
          <div class="s">${s.desc}</div>
        </button>
      `).join('');

      const hits = SHIELDS.filter(s=>s.broken).length;
      const col = hits >= 5 ? 'var(--tax-red)' : (hits >= 3 ? 'var(--tax-amber)' : 'var(--tax-green)');
      const stages = ['完全正常健康细胞', '偶发单点突变（随时修复）', '轻度不典型增生（仍受控）', '原位病变预警（癌前状态）', '高度恶变临界（仅剩 1 道门）', '🚨 恶性肿瘤突破防线！'];
      const stopPct = [100, 99.9, 98, 85, 45, 0][hits];

      let shieldsSvg = '';
      SHIELDS.forEach((s, i) => {
        const x = 112 + i * 86;
        shieldsSvg += `
          <rect x="${x}" y="38" width="66" height="106" rx="10" fill="${s.broken?'var(--tax-red-soft)':'var(--tax-green-soft)'}" stroke="${s.broken?'var(--tax-red)':'var(--tax-green)'}" stroke-width="2.2" stroke-dasharray="${s.broken?'5 4':'0'}"/>
          <text x="${x+33}" y="82" text-anchor="middle" font-size="22">${s.broken?'💥':'🛡️'}</text>
          <text x="${x+33}" y="112" text-anchor="middle" font-size="10.5" font-weight="800" fill="${s.broken?'var(--tax-red)':'var(--tax-green)'}">防线 #${i+1}</text>
          <text x="${x+33}" y="130" text-anchor="middle" font-size="10" fill="var(--tax-muted)">${s.broken?'已失效':'拦住!'}</text>
        `;
      });
      const beamEnd = hits === 5 ? 600 : (112 + SHIELDS.findIndex(s=>!s.broken) * 86);

      document.getElementById('svg').innerHTML = `
        <circle cx="52" cy="91" r="24" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="2"/>
        <text x="52" y="96" text-anchor="middle" font-size="11.5" font-weight="850" fill="var(--tax-amber)">突变</text>
        <line x1="76" y1="91" x2="${beamEnd}" y2="91" stroke="var(--tax-red)" stroke-width="4" stroke-linecap="round"/>
        ${shieldsSvg}
        <circle cx="585" cy="91" r="26" fill="${hits===5?'var(--tax-red)':'var(--tax-surface-alt)'}" stroke="${hits===5?'var(--tax-red)':'var(--tax-border)'}" stroke-width="2"/>
        <text x="585" y="95" text-anchor="middle" font-size="11.5" font-weight="900" fill="${hits===5?'#fff':'var(--tax-muted)'}">${hits===5?'癌变!':'安全'}</text>
        <text x="320" y="174" text-anchor="middle" font-size="12" font-weight="800" fill="${col}">当前状态：${stages[hits]}</text>
      `;

      document.getElementById('kHits').textContent = `${hits} / 5 道`;
      const kS = document.getElementById('kStage'); kS.textContent = stages[hits]; kS.style.color = col;
      document.getElementById('kStop').textContent = stopPct + '%';

      document.getElementById('ahaBox').innerHTML = hits === 5
        ? `💡 <strong>顿悟时刻：</strong>全部 <strong>5 道安检门</strong>都被接连击穿，细胞才终于演化成逃逸免疫、无限增殖的恶性肿瘤！这也解释了为什么癌症发病率随年龄呈指数上升——<strong>积攒 5 次巧合打击通常需要几十年时间！</strong>`
        : `💡 <strong>顿悟时刻：</strong>目前虽然已有 <strong>${hits} 道防线</strong>受损，但只要还有剩余盾牌站岗（拦截概率 <strong>${stopPct}%</strong>），突变细胞就会被立刻修复或强令自杀！戒烟、防晒、控慢性炎症的核心就是：<strong>大幅降低每天撞击防线的子弹数量！</strong>`;
    }

    draw();
  </script>
</body>
</html>
