<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪪 免疫检查点 PD-1：癌细胞是怎么“伪造良民证”的？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:9px 14px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🪪 免疫检查点 PD-1：癌细胞是怎么“伪造良民证”的？</h1>
        <p>误区：癌症长出来是因为免疫 T 细胞打不过癌细胞。真相：T 细胞其实就停在肿瘤旁边！只因狡猾的癌细胞表面疯狂长出 <strong>PD-L1“伪造良民证”</strong>，一握手就把 T 细胞的 <strong>PD-1 刹车按钮</strong>按下让它当场睡着——2018 年诺贝尔奖免疫疗法正是把这张假证撕掉！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setMode('evade',this)">🪪 癌细胞举起 PD-L1 假证（免疫逃逸）</button>
        <button class="pill" onclick="setMode('drug',this)">💉 注入 PD-1 单抗药（撕掉假证·唤醒杀癌！）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">⚔️ 杀手 T 细胞状态</div><div class="k-val" id="kTcell">—</div></div>
        <div class="kpi"><div class="k-lbl">PD-1 / PD-L1 握手状态</div><div class="k-val" id="kHand" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">肿瘤最终命运</div><div class="k-val" id="kTum">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let mode = 'evade';
    function setMode(m, btn){
      mode = m;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const isDrug = mode === 'drug';
      document.getElementById('svg').innerHTML = `
        <rect x="26" y="42" width="176" height="126" rx="16" fill="${isDrug?'var(--tax-green-soft)':'var(--tax-primary-soft)'}" stroke="${isDrug?'var(--tax-green)':'var(--tax-primary)'}" stroke-width="2.4"/>
        <text x="114" y="84" text-anchor="middle" font-size="28">${isDrug?'⚔️':'😴'}</text>
        <text x="114" y="114" text-anchor="middle" font-size="14" font-weight="900" fill="${isDrug?'var(--tax-green)':'var(--tax-primary)'}">杀手 T 细胞</text>
        <text x="114" y="138" text-anchor="middle" font-size="11.5" fill="var(--tax-ink)">${isDrug?'刹车解除 · 火力全开!':'被按下 PD-1 刹车休眠'}</text>

        <rect x="202" y="92" width="56" height="26" rx="6" fill="var(--tax-primary)"/>
        <text x="230" y="109" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">PD-1</text>

        ${isDrug
          ? `<rect x="274" y="70" width="92" height="70" rx="12" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="2.6"/>
             <text x="320" y="100" text-anchor="middle" font-size="13" font-weight="900" fill="var(--tax-amber)">🛡️ 阻断单抗</text>
             <text x="320" y="122" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--tax-ink)">死死卡住不让握手!</text>
             <line x1="202" y1="62" x2="438" y2="62" stroke="var(--tax-green)" stroke-width="3.5" stroke-dasharray="6 4"/>
             <text x="320" y="52" text-anchor="middle" font-size="11.5" font-weight="850" fill="var(--tax-green)">⚡ 释放穿孔素精准摧毁肿瘤!</text>`
          : `<line x1="258" y1="105" x2="382" y2="105" stroke="var(--tax-red)" stroke-width="4"/>
             <text x="320" y="90" text-anchor="middle" font-size="12" font-weight="900" fill="var(--tax-red)">🤝 握手成功！误认自己人</text>`}

        <rect x="382" y="92" width="56" height="26" rx="6" fill="var(--tax-red)"/>
        <text x="410" y="109" text-anchor="middle" font-size="11" font-weight="900" fill="#fff">PD-L1</text>

        <rect x="438" y="42" width="176" height="126" rx="16" fill="var(--tax-red-soft)" stroke="var(--tax-red)" stroke-width="2.4" opacity="${isDrug?0.65:1}"/>
        <text x="526" y="84" text-anchor="middle" font-size="28">${isDrug?'💥':'😈'}</text>
        <text x="526" y="114" text-anchor="middle" font-size="14" font-weight="900" fill="var(--tax-red)">狡猾癌细胞</text>
        <text x="526" y="138" text-anchor="middle" font-size="11.5" fill="var(--tax-ink)">${isDrug?'伪装失效 · 被围剿清除':'举着 PD-L1 假证逍遥法外'}</text>

        <text x="320" y="198" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-muted)">2018 年诺贝尔生理学或医学奖（本庶佑 & 艾利森）：不是用毒药毒癌，而是替自己的免疫系统松开刹车！</text>
      `;

      const kT = document.getElementById('kTcell');
      kT.textContent = isDrug ? '彻底唤醒 · 猛攻杀癌 ⚔️' : '被催眠放行 😴';
      kT.style.color = isDrug ? 'var(--tax-green)' : 'var(--tax-amber)';
      document.getElementById('kHand').textContent = isDrug ? '已被单抗药强行阻断 🛡️' : '握手锁定（免疫逃逸）';
      const kTu = document.getElementById('kTum');
      kTu.textContent = isDrug ? '精准瓦解缩小 💥' : '肆无忌惮疯狂扩散 🚨';
      kTu.style.color = isDrug ? 'var(--tax-green)' : 'var(--tax-red)';

      document.getElementById('ahaBox').innerHTML = isDrug
        ? `💡 <strong>顿悟时刻：</strong>PD-1 单抗药（如 K 药/O 药）本身并不直接毒杀癌细胞，它只是像一块精准的垫片插在 PD-1 和 PD-L1 中间，<strong>阻止癌细胞按住 T 细胞的刹车键</strong>——一旦刹车松开，你自带的免疫大军立刻睁开眼把肿瘤彻底撕碎！`
        : `💡 <strong>顿悟时刻：</strong>正常细胞表面也有 PD-L1“良民证”，防止免疫系统误伤自己；癌细胞偷学了这招，给自己贴满假证让 T 细胞当场熄火！点击上方 <strong>💉 注入 PD-1 单抗药</strong> 见证诺贝尔奖级反转！`;
    }

    draw();
  </script>
</body>
</html>
