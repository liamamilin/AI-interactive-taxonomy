<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📡 细菌的“耐药外挂共享”：质粒水平转移</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .b-node { cursor:pointer; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📡 细菌的“耐药外挂共享”：质粒水平转移</h1>
        <p>误区：耐药基因只能靠“父传子”一代代慢慢演化出来。真相：细菌之间竟然能像隔空发微信文件一样，通过伸出接合菌毛把环状 DNA<strong>“耐药质粒”直接跨物种传给邻居</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="spreadStep()">📡 触发一次“质粒外挂”共享传播</button>
        <button class="pill" onclick="resetNet()">↺ 重置菌群网络</button>
        <span style="font-size:12px;color:var(--tax-muted);">👆 也可直接点击任意蓝色敏感细菌，看它被红色耐药菌“隔空投送外挂”</span>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">已获得耐药外挂菌株</div><div class="k-val" id="kRes" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">跨物种传播种类</div><div class="k-val" id="kSp" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">传播方式</div><div class="k-val" id="kWay" style="font-size:15px;color:var(--tax-primary);">水平基因转移 (HGT)</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const BUGS = [
      { id:0, x:100, y:112, sp:'大肠杆菌', res:true },
      { id:1, x:245, y:56,  sp:'肺炎克雷伯菌', res:false },
      { id:2, x:245, y:168, sp:'沙门氏菌', res:false },
      { id:3, x:400, y:56,  sp:'铜绿假单胞菌', res:false },
      { id:4, x:400, y:168, sp:'金黄色葡萄球菌', res:false },
      { id:5, x:545, y:112, sp:'鲍曼不动杆菌', res:false }
    ];
    const EDGES = [[0,1],[0,2],[1,3],[2,4],[1,2],[3,5],[4,5]];

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function spreadStep(){
      const newly = new Set();
      EDGES.forEach(([a,b]) => {
        if(BUGS[a].res && !BUGS[b].res) newly.add(b);
        if(BUGS[b].res && !BUGS[a].res) newly.add(a);
      });
      newly.forEach(i => BUGS[i].res = true);
      markDone(); draw();
    }
    function clickBug(id){
      BUGS[id].res = true;
      markDone(); draw();
    }
    function resetNet(){
      BUGS.forEach((b,i) => b.res = (i === 0));
      markDone(); draw();
    }

    function draw(){
      let edgesSvg = '';
      EDGES.forEach(([a,b]) => {
        const ba = BUGS[a], bb = BUGS[b];
        const hot = ba.res && bb.res;
        edgesSvg += `<line x1="${ba.x}" y1="${ba.y}" x2="${bb.x}" y2="${bb.y}" stroke="${hot?'var(--tax-red)':'var(--tax-border)'}" stroke-width="${hot?3:1.8}" stroke-dasharray="${hot?'0':'5 4'}"/>`;
        if(hot){
          const mx = (ba.x+bb.x)/2, my = (ba.y+bb.y)/2;
          edgesSvg += `<circle cx="${mx}" cy="${my}" r="7" fill="var(--tax-amber-soft)" stroke="var(--tax-amber)" stroke-width="1.8"/>`;
        }
      });

      const nodesSvg = BUGS.map(b => `
        <g class="b-node" onclick="clickBug(${b.id})">
          <rect x="${b.x-58}" y="${b.y-24}" width="116" height="48" rx="24" fill="${b.res?'var(--tax-red-soft)':'var(--tax-primary-soft)'}" stroke="${b.res?'var(--tax-red)':'var(--tax-primary)'}" stroke-width="2.2"/>
          <text x="${b.x}" y="${b.y-2}" text-anchor="middle" font-size="11.5" font-weight="850" fill="${b.res?'var(--tax-red)':'var(--tax-primary)'}">${b.res?'🛡️ 耐药外挂':'🔵 敏感菌'}</text>
          <text x="${b.x}" y="${b.y+15}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--tax-ink)">${b.sp}</text>
        </g>
      `).join('');

      document.getElementById('svg').innerHTML = `
        <text x="20" y="20" font-size="11.5" font-weight="800" fill="var(--tax-muted)">橙色小圆环 = 正在通过菌毛跨物种传输的环状 DNA “耐药质粒”</text>
        ${edgesSvg}${nodesSvg}
      `;

      const resCnt = BUGS.filter(b=>b.res).length;
      document.getElementById('kRes').textContent = `${resCnt} / 6 株`;
      document.getElementById('kSp').textContent = `${resCnt} 个不同菌种`;

      document.getElementById('ahaBox').innerHTML = resCnt >= 5
        ? `💡 <strong>顿悟时刻：</strong>短短几轮接触，原本只有大肠杆菌拥有的耐药基因，竟然像发压缩包一样<strong>跨物种共享给了 ${resCnt} 种截然不同的致命病菌</strong>！这就是为什么畜牧养殖场和医院减少低剂量抗生素滥用如此生死攸关！`
        : `💡 <strong>顿悟时刻：</strong>动物只能把基因垂直传给后代，但细菌拥有“水平基因转移（质粒共享）”黑科技！点击 <strong>📡 触发共享传播</strong>，看一颗耐药菌如何瞬间把整张跨物种网络全部染红！`;
    }

    draw();
  </script>
</body>
</html>
