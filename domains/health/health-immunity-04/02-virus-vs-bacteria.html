<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 普通感冒吃阿莫西林？病毒 vs 细菌靶点图</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🎯 普通感冒吃阿莫西林？病毒 vs 细菌靶点图</h1>
        <p>误区：头孢、阿莫西林是“万能消炎药”，一感冒发烧就来两粒准没错。真相：90% 的普通感冒和流感都是<strong>病毒</strong>引起的；抗生素专打“细菌细胞壁”，病毒连细胞壁都没有——吃错药等于<strong>敌军零伤亡、肠道友军大团灭</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill active" onclick="setTarget('virus',this)">🦠 入侵者：普通感冒/流感病毒</button>
        <button class="pill" onclick="setTarget('bacteria',this)">🧫 入侵者：化脓性链球菌（细菌）</button>
        <button class="tax-btn" onclick="fireAbx()">💊 发射阿莫西林（细胞壁破坏弹）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">🎯 入侵病原体伤亡率</div><div class="k-val" id="kEnemy">—</div></div>
        <div class="kpi"><div class="k-lbl">🥗 肠道无辜益生菌伤亡</div><div class="k-val" id="kGut" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">用药医学判定</div><div class="k-val" id="kJudge">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let target = 'virus', fired = false;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setTarget(t, btn){
      target = t; fired = false;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function fireAbx(){ fired = true; markDone(); draw(); }

    function draw(){
      const isVir = target === 'virus';
      const enemyHit = fired && !isVir;
      const enemyCol = enemyHit ? 'var(--tax-green)' : 'var(--tax-red)';

      document.getElementById('svg').innerHTML = `
        <rect x="24" y="54" width="142" height="106" rx="14" fill="var(--tax-primary-soft)" stroke="var(--tax-primary)" stroke-width="2"/>
        <text x="95" y="96" text-anchor="middle" font-size="26">💊</text>
        <text x="95" y="124" text-anchor="middle" font-size="13" font-weight="850" fill="var(--tax-primary)">阿莫西林 / 头孢</text>
        <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="var(--tax-muted)">唯一靶点：细菌细胞壁</text>

        ${fired ? `<line x1="166" y1="84" x2="364" y2="58" stroke="${enemyHit?'var(--tax-green)':'var(--tax-muted)'}" stroke-width="3.2" stroke-dasharray="${enemyHit?'0':'6 4'}"/>
        <line x1="166" y1="128" x2="364" y2="152" stroke="var(--tax-red)" stroke-width="3.2"/>` : ''}

        <rect x="368" y="20" width="246" height="74" rx="12" fill="${enemyHit?'var(--tax-green-soft)':'var(--tax-red-soft)'}" stroke="${enemyCol}" stroke-width="2"/>
        <text x="491" y="48" text-anchor="middle" font-size="13.5" font-weight="850" fill="${enemyCol}">${isVir?'🦠 感冒病毒（无细胞壁！）':'🧫 致病细菌（有肽聚糖细胞壁）'}</text>
        <text x="491" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="var(--tax-ink)">${!fired?'等待发射药丸...':(isVir?'💨 子弹直接穿空！病毒毫发无损':'💥 细胞壁被精准炸裂！病菌团灭')}</text>

        <rect x="368" y="116" width="246" height="74" rx="12" fill="${fired?'var(--tax-amber-soft)':'var(--tax-green-soft)'}" stroke="${fired?'var(--tax-amber)':'var(--tax-green)'}" stroke-width="2"/>
        <text x="491" y="144" text-anchor="middle" font-size="13.5" font-weight="850" fill="${fired?'var(--tax-amber)':'var(--tax-green)'}">🥗 肠道有益菌群（也有细胞壁）</text>
        <text x="491" y="170" text-anchor="middle" font-size="12" font-weight="800" fill="var(--tax-ink)">${!fired?'和平护卫肠道中':'⚠️ 遭无差别误杀 65%（腹泻+耐药风险）'}</text>
      `;

      const kE = document.getElementById('kEnemy');
      kE.textContent = !fired ? '待测试' : (isVir ? '0%（完全无效！）' : '98%（精准清除 ✅）');
      kE.style.color = !fired ? 'var(--tax-muted)' : enemyCol;
      document.getElementById('kGut').textContent = !fired ? '0%（安全）' : '-65% 附带误伤';
      const kJ = document.getElementById('kJudge');
      kJ.textContent = !fired ? '点击上方发射' : (isVir ? '❌ 典型滥用！白伤肠胃' : '✅ 对症精准打击');
      kJ.style.color = !fired ? 'var(--tax-muted)' : (isVir ? 'var(--tax-red)' : 'var(--tax-green)');

      document.getElementById('ahaBox').innerHTML = !fired
        ? `💡 <strong>顿悟时刻：</strong>先点击 <strong>💊 发射阿莫西林</strong> 看看它打在感冒病毒身上会发生什么，再切换成细菌对比！`
        : isVir
        ? `💡 <strong>顿悟时刻：</strong>感冒病毒只是蛋白质外壳裹着一段 RNA，压根没有细胞壁！吃阿莫西林对病毒<strong>0% 杀伤力</strong>，却顺手把你肠道里同样有细胞壁的益生菌炸毁 65%，还帮潜在坏菌练出了耐药性！`
        : `💡 <strong>顿悟时刻：</strong>面对明确的<strong>细菌感染</strong>（如链球菌扁桃体化脓、细菌性肺炎），阿莫西林精准锁死细菌细胞壁靶点，虽然会附带误伤部分肠道菌群，但收益远大于代价！`;
    }

    draw();
  </script>
</body>
</html>
