<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌊 睡眠双过程模型：腺苷睡压 vs 昼夜唤醒波</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌊 睡眠双过程模型：腺苷睡压 vs 昼夜唤醒波</h1><p>误区：越晚越困，困意是随着时间匀速线性增加的。真相：生物钟在晚上 8~10 点会送出一天中最后的“清醒唤醒高峰”来抵消腺苷睡压，只有等它退潮后睡意才会像海啸一样扑来！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前连续清醒小时数</span><span id="vAw">15 小时</span></label><input type="range" id="sAw" min="6" max="22" value="15" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>下午午睡时长 (清除了部分腺苷)</span><span id="vNap">30 分钟</span></label><input type="range" id="sNap" min="0" max="90" value="30" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">腺苷睡眠压力</div><div class="k-val" id="kAd" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">当前净睡意差值</div><div class="k-val" id="kNet">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const aw=+document.getElementById('sAw').value, nap=+document.getElementById('sNap').value;
  document.getElementById('vAw').textContent=aw+' 小时'; document.getElementById('vNap').textContent=nap+' 分钟';
  const ad=Math.max(10, Math.min(98, Math.round(aw*4.6 - nap*0.35)));
  const circ=Math.round(50 + 30*Math.sin((aw-6)/16*Math.PI));
  const net=ad - circ*0.7;
  document.getElementById('kAd').textContent=ad+' 分';
  document.getElementById('kNet').textContent=net>15?'极度想睡 (睡门打开)':(net>0?'轻微困意':'精神清醒');
  document.getElementById('kNet').style.color=net>15?'#059669':'#f59e0b';
  let pAd='', pCi='';
  for(let h=6;h<=22;h++){
    const x=40+(h-6)/16*520;
    const a=Math.max(10, Math.min(98, h*4.6-nap*0.35));
    const c=35 + 28*Math.sin((h-6)/16*Math.PI);
    pAd+=`${x},${160-a*1.3} `; pCi+=`${x},${160-c*1.3} `;
  }
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pAd}"/>
    <polyline fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5 3" points="${pCi}"/>
    <text x="50" y="28" font-size="12" font-weight="800" fill="#0284c7">蓝线: 腺苷睡压 (${ad}分)</text>
    <text x="260" y="28" font-size="12" font-weight="800" fill="#f59e0b">橙虚线: 生物钟唤醒波</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>如果下午狂睡 ${nap} 分钟把腺苷提前洗掉了，晚上生物钟又刚好在高峰期，就会在深夜瞪眼睡不着——午睡控制在 20 分钟内最稳！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
