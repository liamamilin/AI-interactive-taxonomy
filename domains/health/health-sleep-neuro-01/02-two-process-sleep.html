<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌊 睡眠双过程模型：腺苷睡压 vs 昼夜唤醒波</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    .pill { padding:8px 12px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:12.5px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .ctrl-box { padding:10px 14px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface-alt); margin-bottom:14px; }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🌊 睡眠双过程模型：腺苷睡压 vs 昼夜唤醒波</h1>
        <p>误区：熬得越久就会越困，不存在“晚上突然精神”。真相：困意由“腺苷睡压（Process S）”减去“昼夜唤醒波（Process C）”决定——傍晚 8–9 点唤醒波冲顶，会制造出诡异的“越晚越精神（禁睡区）”！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="playDay()">▶ 播放全天 24 小时波动</button>
        <span style="font-size:12.5px;font-weight:750;color:var(--tax-muted);">午睡策略：</span>
        <button class="pill active" onclick="setNap('none',this)">不午睡</button>
        <button class="pill" onclick="setNap('short',this)">13:30 小憩 20 分钟</button>
        <button class="pill" onclick="setNap('late',this)">16:30 猛睡 90 分钟</button>
      </div>
      <div class="ctrl-box">
        <label><span>当前时刻（07:00 起床 → 次日 01:00）</span><span id="vHr">23:00</span></label>
        <input type="range" id="sHr" min="7" max="25" step="0.5" value="23" oninput="onSlide()">
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">腺苷睡眠压力 (Process S)</div><div class="k-val" id="kS" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">昼夜唤醒驱动 (Process C)</div><div class="k-val" id="kC" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">净入睡驱动力 (S - C)</div><div class="k-val" id="kNet" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let nap = 'none', hr = 23, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setNap(n, btn){
      nap = n;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); draw();
    }
    function onSlide(){
      if(timer){ clearInterval(timer); timer=null; }
      hr = +document.getElementById('sHr').value;
      markDone(); draw();
    }
    function playDay(){
      if(timer) clearInterval(timer);
      markDone();
      hr = 7; document.getElementById('sHr').value = 7;
      timer = setInterval(()=>{
        hr += 0.5;
        document.getElementById('sHr').value = hr;
        draw();
        if(hr >= 25){ clearInterval(timer); timer=null; }
      }, 90);
      draw();
    }

    function calcSC(h){
      // Process S builds up from 7:00
      let s = 12 + (1 - Math.exp(-(h - 7)/9.5)) * 86;
      if(nap === 'short' && h >= 13.8) s -= 9 * Math.exp(-(h - 13.8)/7);
      if(nap === 'late' && h >= 17.5) s -= 34 * Math.exp(-(h - 17.5)/8);
      s = Math.max(8, Math.min(98, s));
      // Process C: afternoon dip around 14:30, forbidden zone peak around 20:30, drops sharply after 22:00
      const c = 52 + 28 * Math.sin(((h - 15.5) / 24) * Math.PI * 2) + 12 * Math.exp(-Math.pow((h - 20.3)/1.4, 2)) - 14 * Math.exp(-Math.pow((h - 14.3)/1.3, 2));
      return { s: Math.round(s), c: Math.round(Math.max(12, Math.min(92, c))) };
    }

    function draw(){
      const hh = Math.floor(hr) % 24, mm = (hr % 1) ? '30' : '00';
      document.getElementById('vHr').textContent = `${String(hh).padStart(2,'0')}:${mm}`;

      const x0=52, x1=612, yMin=28, yMax=188;
      const toX = h => x0 + ((h - 7)/18)*(x1-x0);
      const toY = v => yMax - (v/100)*(yMax-yMin);

      let pS=[], pC=[];
      for(let h=7; h<=25; h+=0.25){
        const v = calcSC(h);
        pS.push(`${toX(h).toFixed(1)},${toY(v.s).toFixed(1)}`);
        pC.push(`${toX(h).toFixed(1)},${toY(v.c).toFixed(1)}`);
      }
      const now = calcSC(hr);
      const net = now.s - now.c;

      document.getElementById('svg').innerHTML = `
        <rect x="${toX(19.5)}" y="${yMin}" width="${toX(21.5)-toX(19.5)}" height="${yMax-yMin}" fill="var(--tax-amber-soft)" opacity="0.7"/>
        <text x="${toX(20.5)}" y="${yMin+14}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--tax-amber)">禁睡区</text>
        <rect x="${toX(22.5)}" y="${yMin}" width="${toX(24.5)-toX(22.5)}" height="${yMax-yMin}" fill="var(--tax-green-soft)" opacity="0.6"/>
        <text x="${toX(23.5)}" y="${yMin+14}" text-anchor="middle" font-size="10" font-weight="800" fill="var(--tax-green)">黄金入睡窗</text>
        ${[7,10,13,16,19,22,25].map(h=>`<text x="${toX(h)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${String(h%24).padStart(2,'0')}:00</text>`).join('')}
        <polyline points="${pS.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3.2"/>
        <polyline points="${pC.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3.2"/>
        <line x1="${toX(hr)}" y1="${yMin}" x2="${toX(hr)}" y2="${yMax}" stroke="var(--tax-ink)" stroke-dasharray="4 3" stroke-width="1.5"/>
        <circle cx="${toX(hr)}" cy="${toY(now.s)}" r="5.5" fill="var(--tax-red)"/>
        <circle cx="${toX(hr)}" cy="${toY(now.c)}" r="5.5" fill="var(--tax-primary)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-red)">● 腺苷睡压 (越清醒越高)</text>
        <text x="${x0+175}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-primary)">● 昼夜唤醒波 (傍晚冲顶·深夜骤降)</text>
      `;

      document.getElementById('kS').textContent = now.s + ' 分';
      document.getElementById('kC').textContent = now.c + ' 分';
      document.getElementById('kNet').textContent = (net >= 0 ? '+' : '') + net + (net > 28 ? ' (秒睡窗口 😴)' : net < 0 ? ' (头脑清醒 ⚡)' : ' (微困)');

      let aha = '';
      if(nap === 'late' && hr >= 22){
        aha = `💡 <strong>顿悟时刻：</strong>下午 4:30 猛睡 90 分钟把你辛辛苦苦攒了一天的<strong>腺苷睡压直接泄掉了一大截</strong>！导致晚上 23:00 净困意不足（仅 ${net}），躺床上瞪眼到凌晨 2 点！`;
      } else if(hr >= 19.5 && hr <= 21.5){
        aha = `💡 <strong>顿悟时刻：</strong>你正处于<strong>“睡眠禁区（Forbidden Zone）”</strong>！虽然腺苷睡压已经高达 ${now.s}，但生物钟在睡前 2 小时故意拉高唤醒波（${now.c}）帮你撑过傍晚——所以别在 20:30 硬逼自己上床翻烙饼！`;
      } else if(net >= 28){
        aha = `💡 <strong>顿悟时刻：</strong><strong>黄金入睡窗打开！</strong>腺苷睡压冲顶（${now.s}）而昼夜唤醒波断崖回落（${now.c}），两者拉开 <strong>+${net}</strong> 的巨大落差，此时关灯上床最容易 10 分钟内沉沉入睡！`;
      } else {
        aha = `💡 <strong>顿悟时刻：</strong>睡意不是单靠“累了”，而是<strong>红线（腺苷）与蓝线（生物钟）之间的剪刀差</strong>！拖到 14:30 可看到“午后犯困低谷”，拖到 23:00 可看到“黄金入睡窗”。`;
      }
      document.getElementById('ahaBox').innerHTML = aha;
    }

    draw();
  </script>
</body>
</html>
