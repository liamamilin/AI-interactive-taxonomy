<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛣️ 髓鞘化：大脑神经从土路升级光纤（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🛣️ 髓鞘化：大脑神经从土路升级光纤（SVG）</h1><p>误区：人过 25 岁大脑就定型了，新技能再怎么练也长不出新回路。真相：反复、高专注、带纠错的练习会刺激大脑给对应神经轴突裹上厚厚的“髓鞘”绝缘层，让电信号像光纤一样跳跃狂飙！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>高专注纠错式刻意练习次数</span><span id="vRep">60 次</span></label><input type="range" id="sRep" min="5" max="100" value="60" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>练后深度睡眠修复整合度</span><span id="vSlp">80%</span></label><input type="range" id="sSlp" min="20" max="100" value="80" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">髓鞘绝缘厚度</div><div class="k-val" id="kMye" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">神经信号传导倍率</div><div class="k-val" id="kSpd" style="color:#059669;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const rep=+document.getElementById('sRep').value, slp=+document.getElementById('sSlp').value;
  document.getElementById('vRep').textContent=rep+' 次'; document.getElementById('vSlp').textContent=slp+'%';
  const mye=Math.min(100, Math.round(rep*0.65 + slp*0.35));
  const spd=(1 + mye*0.49).toFixed(1)+'x';
  document.getElementById('kMye').textContent=mye+'%';
  document.getElementById('kSpd').textContent=spd;
  let segs='';
  const thick=4+mye*0.18;
  for(let i=0;i<5;i++){
    const x=50+i*105;
    segs+=`<rect x="${x}" y="${90-thick}" width="85" height="${thick*2}" rx="8" fill="#f59e0b" opacity="0.85"/>`;
  }
  document.getElementById('svg').innerHTML=`
    <line x1="30" y1="90" x2="570" y2="90" stroke="#0284c7" stroke-width="5"/>
    ${segs}
    <text x="30" y="34" font-size="13" font-weight="800" fill="#0284c7">髓鞘包裹度 ${mye}% → 神经信号跨越兰氏结跳跃传输速度提升至 ${spd}</text>
    <text x="30" y="160" font-size="12.5" font-weight="750" fill="var(--tax-muted)">练的时候触发错误信号标定电路，睡着的时候大脑才真正动工裹上髓鞘！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>天才的秘密不是生下来就有高速公路，而是用“专心犯错+立刻纠正”点亮回路，再靠睡眠（${slp}%）把髓鞘包裹成 <strong>${spd} 光纤高速</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
