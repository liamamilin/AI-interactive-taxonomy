<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔑 成年人可塑性双钥匙：肾上腺素 + 乙酰胆碱</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔑 成年人可塑性双钥匙：肾上腺素 + 乙酰胆碱</h1><p>误区：成年人学东西应该全程轻松愉悦、毫无挫败感，效率才最高。真相：成年大脑只为“觉得重要且有点难”的事开启可塑性——那股学不会时的轻微焦躁，正是肾上腺素在帮你打开重塑大门！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>挑战感/轻微挫败紧迫度 (去甲肾上腺素)</span><span id="vAdr">65%</span></label><input type="range" id="sAdr" min="0" max="100" value="65" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>单点全神贯注度 (乙酰胆碱聚光灯)</span><span id="vAch">80%</span></label><input type="range" id="sAch" min="10" max="100" value="80" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">可塑性大门开启度</div><div class="k-val" id="kGate" style="color:#059669;">—</div></div>
        <div class="kpi"><div class="k-lbl">学习状态</div><div class="k-val" id="kSt">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const adr=+document.getElementById('sAdr').value, ach=+document.getElementById('sAch').value;
  document.getElementById('vAdr').textContent=adr+'%'; document.getElementById('vAch').textContent=ach+'%';
  const gate=Math.round((100-Math.abs(adr-65)*0.8)*0.45 + ach*0.55);
  document.getElementById('kGate').textContent=gate+'%';
  document.getElementById('kSt').textContent=gate>75?'高效重塑态':(adr<25?'太安逸没触发':'专注或情绪失衡');
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#f59e0b">紧迫警觉信号 (去甲肾上腺素): ${adr}%</text>
    <rect x="20" y="44" width="${adr*5.2}" height="22" rx="6" fill="#f59e0b"/>
    <text x="20" y="96" font-size="13" font-weight="800" fill="#0284c7">激光专注标定 (乙酰胆碱): ${ach}%</text>
    <rect x="20" y="106" width="${ach*5.2}" height="22" rx="6" fill="#0284c7"/>
    <text x="20" y="156" font-size="13" font-weight="800" fill="#059669">成年可塑性窗口开启度: ${gate}%</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>孩子大脑随时敞开吸收，成年大脑则有双钥匙锁：必须先有轻微受挫时的“紧迫感”放出信号，再用“高度专注”把聚光灯打在要改的突触上！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
