<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>☠️ 一氧化碳中毒：240 倍亲和力的霸道抢座</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .scen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:9px; margin-bottom:14px; }
    .s-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .s-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .s-btn .t { font-size:13px; font-weight:800; }
    .s-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>☠️ 一氧化碳中毒：240 倍亲和力的霸道抢座</h1>
        <p>误区：房间里氧气还占 20.9%，混进 0.1% 一氧化碳（CO）浓度这么低不可能中毒。真相：CO 对血红蛋白的亲和力是氧气的 <strong>240 倍</strong>！只需 0.1% 的 CO 就能霸占一半以上的运氧专车座位，还把同车剩下的氧气焊死不让下车！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">🚐 切换房间内空气中一氧化碳 (CO) 浓度，观察 16 个血红蛋白座位如何被瞬间劫持：</div>
      <div class="scen-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">CO 霸占座位比例 (COHb)</div><div class="k-val" id="kCo" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">组织实际能拿到的氧</div><div class="k-val" id="kO2" style="color:var(--tax-primary);">—</div></div>
        <div class="kpi"><div class="k-lbl">临床中毒风险</div><div class="k-val" id="kRisk">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const LEVELS = [
      { id:'l0', icon:'🌿', name:'0% 清新空气', desc:'0 ppm · 全部满载 O2', coPct:0, coSeats:0, o2Avail:100, risk:'安全健康 ✅', col:'var(--tax-green)',
        aha:'💡 <strong>顿悟时刻：</strong>清新空气中，4 台血红蛋白专车（16 个座位）全部优雅运载氧气并按需在组织顺畅卸货！' },
      { id:'l1', icon:'🚬', name:'0.02% 轻度泄露', desc:'200 ppm · 2 小时头痛头晕', coPct:25, coSeats:4, o2Avail:62, risk:'头痛恶心预警 ⚠️', col:'var(--tax-amber)',
        aha:'💡 <strong>顿悟时刻：</strong>空气里只有区区 <strong>0.02%</strong> 的一氧化碳（氧气是它的 1000 倍！），但靠着 240 倍的霸道亲和力，它已经强抢了 <strong>25%</strong> 的血红蛋白座位！' },
      { id:'l2', icon:'🔥', name:'0.1% 燃气热水器漏气', desc:'1000 ppm · 致命抢座！', coPct:56, coSeats:9, o2Avail:24, risk:'昏迷/致命危机 🚨', col:'var(--tax-red)',
        aha:'💡 <strong>顿悟时刻：</strong>0.1% × 240 ≈ 24%，直接与 20.9% 的氧气打成平手甚至反超！高达 <strong>56%</strong> 的座位被 CO 锁死，而且<strong>更毒的是：同车剩下的氧气也被锁死在车上卸不下来</strong>，脑细胞瞬间窒息！' },
      { id:'l3', icon:'☠️', name:'0.4% 密闭车库尾气', desc:'4000 ppm · 数分钟失去意识', coPct:81, coSeats:13, o2Avail:8, risk:'极速致死 ☠️', col:'var(--tax-red)',
        aha:'💡 <strong>顿悟时刻：</strong>一氧化碳无色无味，且结合后的血液呈欺骗性的樱桃红色（普通指夹血氧仪甚至会被骗测出 99%！）。急救唯一王道：<strong>立刻开窗通风脱离现场 + 高压纯氧把 CO 挤下车！</strong>' }
    ];
    let cur = 'l2';

    function pick(id){ cur = id; if(window.ToySDK) window.ToySDK.markCompleted(); draw(); }

    function draw(){
      document.getElementById('grid').innerHTML = LEVELS.map(l => `
        <button class="s-btn ${cur===l.id?'active':''}" onclick="pick('${l.id}')">
          <div class="t">${l.icon} ${l.name}</div>
          <div class="s">${l.desc}</div>
        </button>
      `).join('');

      const l = LEVELS.find(x=>x.id===cur);
      // 4 hemoglobin cars, each with 4 seats (total 16)
      let buses = '';
      for(let b=0; b<4; b++){
        const bx = 26 + b * 150, by = 44;
        buses += `<rect x="${bx}" y="${by}" width="134" height="114" rx="12" fill="var(--tax-surface-alt)" stroke="var(--tax-border)" stroke-width="1.8"/>
                  <text x="${bx+67}" y="${by+20}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-muted)">血红蛋白专车 #${b+1}</text>`;
        for(let s=0; s<4; s++){
          const idx = b * 4 + s;
          const isCo = idx < l.coSeats;
          const sx = bx + 20 + (s % 2) * 52;
          const sy = by + 34 + Math.floor(s / 2) * 38;
          buses += `<rect x="${sx}" y="${sy}" width="42" height="28" rx="6" fill="${isCo?'var(--tax-red)':'var(--tax-primary)'}"/>
                    <text x="${sx+21}" y="${sy+18}" text-anchor="middle" font-size="11.5" font-weight="900" fill="#fff">${isCo?'CO':'O₂'}</text>`;
        }
      }

      document.getElementById('svg').innerHTML = `
        <text x="26" y="26" font-size="12.5" font-weight="850" fill="${l.col}">4 辆血红蛋白运氧专车（共 16 座）：🔴 CO 霸座 ${l.coSeats} 座 · 🔵 O₂ 仅剩 ${16-l.coSeats} 座</text>
        ${buses}
        <text x="26" y="186" font-size="11.5" font-weight="750" fill="var(--tax-muted)">⚠️ 双重打击：只要车上混进 1 个 CO，同车剩下的 O₂ 也会被“焊死”在座位上无法卸给大脑！</text>
      `;

      document.getElementById('kCo').textContent = l.coPct + '%';
      document.getElementById('kO2').textContent = l.o2Avail + '% 有效供氧';
      const kR = document.getElementById('kRisk'); kR.textContent = l.risk; kR.style.color = l.col;
      document.getElementById('ahaBox').innerHTML = l.aha;
    }

    draw();
  </script>
</body>
</html>
