<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏔️ 高原反应与 EPO 红细胞代偿适应</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:750; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🏔️ 高原反应与 EPO 红细胞代偿适应</h1>
        <p>误区：高原缺氧是因为空气里“氧气百分比变低了”。真相：拉萨空气含氧量照样是 <strong>21%</strong>，只是气压低导致氧分压骤降！肾脏察觉缺氧后会猛喷 <strong>EPO（促红细胞生成素）</strong>，用 2–3 周扩编红细胞车队把血氧托回来！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="tax-btn" onclick="playAccl()">▶ 播放 21 天高原习服适应曲线</button>
        <button class="pill" onclick="setAlt(2400,'丽江 (2400m)',this)">🏔️ 2400m 丽江</button>
        <button class="pill active" onclick="setAlt(3650,'拉萨 (3650m)',this)">🏔️ 3650m 拉萨</button>
        <button class="pill" onclick="setAlt(5200,'珠峰大本营 (5200m)',this)">❄️ 5200m 大本营</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 220"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当前有效氧分压（相对平原）</div><div class="k-val" id="kPo2" style="color:var(--tax-amber);">—</div></div>
        <div class="kpi"><div class="k-lbl">第 21 天红细胞扩编幅度</div><div class="k-val" id="kRbc" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">第 1 天 → 第 21 天血氧恢复</div><div class="k-val" id="kSpo2" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let alt = 3650, altName = '拉萨 (3650m)', curDay = 21, timer = null;

    function markDone(){ if(window.ToySDK) window.ToySDK.markCompleted(); }
    function setAlt(a, n, btn){
      alt = a; altName = n;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      markDone(); playAccl();
    }
    function playAccl(){
      if(timer) clearInterval(timer);
      markDone();
      curDay = 0;
      timer = setInterval(()=>{
        curDay += 0.5;
        if(curDay >= 21){ curDay = 21; clearInterval(timer); timer=null; }
        draw();
      }, 45);
      draw();
    }

    function simAt(d){
      const drop = alt === 2400 ? 6 : (alt === 3650 ? 14 : 24);
      const rbcGain = alt === 2400 ? 8 : (alt === 3650 ? 18 : 28);
      const rbc = 100 + rbcGain * (1 - Math.exp(-d / 7.5));
      const spo2 = 98 - drop * Math.exp(-d / 9.5) - (alt === 5200 ? 6 : 2);
      return { rbc: Math.round(rbc), spo2: Math.round(spo2) };
    }

    function draw(){
      const x0=54, x1=612, yMin=28, yMax=188;
      const toX = d => x0 + (d/21)*(x1-x0);
      const toY = v => yMax - ((v - 60)/75)*(yMax-yMin);

      let pO2=[], pRbc=[];
      for(let d=0; d<=curDay; d+=0.5){
        const v = simAt(d);
        pO2.push(`${toX(d).toFixed(1)},${toY(v.spo2).toFixed(1)}`);
        pRbc.push(`${toX(d).toFixed(1)},${toY(v.rbc).toFixed(1)}`);
      }
      const d1 = simAt(0), d21 = simAt(21), now = simAt(curDay);
      const po2Pct = alt === 2400 ? '75%' : (alt === 3650 ? '65%' : '53%');

      document.getElementById('svg').innerHTML = `
        <line x1="${x0}" y1="${toY(90)}" x2="${x1}" y2="${toY(90)}" stroke="var(--tax-green)" stroke-dasharray="4 4"/>
        <text x="${x1-4}" y="${toY(90)-5}" text-anchor="end" font-size="10.5" font-weight="750" fill="var(--tax-green)">舒适血氧线 (90%)</text>
        ${[0,3,7,14,21].map(d=>`<text x="${toX(d)}" y="208" text-anchor="middle" font-size="11" fill="var(--tax-muted)">第${d}天</text>`).join('')}
        <polyline points="${pRbc.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3" stroke-dasharray="6 3"/>
        <polyline points="${pO2.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3.4"/>
        <circle cx="${toX(curDay)}" cy="${toY(now.rbc)}" r="5" fill="var(--tax-red)"/>
        <circle cx="${toX(curDay)}" cy="${toY(now.spo2)}" r="6" fill="var(--tax-primary)"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-primary)">● 动脉血氧饱和度 (SpO2: ${now.spo2}%)</text>
        <text x="${x0+245}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-red)">-- 肾脏 EPO 扩编红细胞总量 (${now.rbc}%)</text>
      `;

      document.getElementById('kPo2').textContent = po2Pct + ' 平原气压';
      document.getElementById('kRbc').textContent = `+${d21.rbc - 100}% 红细胞`;
      document.getElementById('kSpo2').textContent = `${d1.spo2}% → ${d21.spo2}%`;

      document.getElementById('ahaBox').innerHTML = `💡 <strong>顿悟时刻：</strong>抵达 <strong>${altName}</strong> 第 1 天气压仅剩平原的 <strong>${po2Pct}</strong>，血氧掉到 <strong>${d1.spo2}%</strong> 引发头痛气喘；随后肾脏疯狂分泌 <strong>EPO</strong> 催生骨髓多造 <strong>+${d21.rbc-100}%</strong> 红细胞，21 天后硬生生把血氧托回 <strong>${d21.spo2}%</strong>——这也是顶级马拉松选手“高原训练、平原夺冠”的生理外挂！`;
    }

    draw();
  </script>
</body>
</html>
