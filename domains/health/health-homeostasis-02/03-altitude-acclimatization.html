<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏔️ 高原反应与 EPO 红细胞代偿适应</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏔️ 高原反应与 EPO 红细胞代偿适应</h1><p>误区：去高原前猛练憋气就能立刻防住高原反应。真相：高原适应是“换硬件”的过程——肾脏感知缺氧后分泌 EPO，需要 7~14 天才能把红细胞和血红蛋白产量拉上去，急不得！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>所在海拔高度</span><span id="vAlt">3800 米</span></label><input type="range" id="sAlt" min="1500" max="5500" step="200" value="3800" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>在高原停留适应天数</span><span id="vDays">7 天</span></label><input type="range" id="sDays" min="1" max="28" value="7" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">空气有效氧分压</div><div class="k-val" id="kAir">—</div></div>
        <div class="kpi"><div class="k-lbl">EPO 增产红细胞后血氧携带</div><div class="k-val" id="kCarry" style="color:#059669;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const alt=+document.getElementById('sAlt').value, days=+document.getElementById('sDays').value;
  document.getElementById('vAlt').textContent=alt+' 米'; document.getElementById('vDays').textContent=days+' 天';
  const air=Math.round(100*Math.exp(-(alt-500)/7500));
  const epoBoost=1 + (1-air/100)*0.75*(1-Math.exp(-days/8));
  const carry=Math.min(98, Math.round(air*epoBoost));
  document.getElementById('kAir').textContent=air+'% 平原';
  document.getElementById('kCarry').textContent=carry+'% 平原';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#f59e0b">外部空气氧浓度 (${alt}m): 平原的 ${air}%</text>
    <rect x="20" y="44" width="${air*5.2}" height="24" rx="6" fill="#f59e0b"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#059669">适应 ${days} 天增产红细胞后综合供氧: ${carry}%</text>
    <rect x="20" y="112" width="${carry*5.2}" height="24" rx="6" fill="#059669"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">肾脏是人体的氧压传感器，缺氧时用 EPO 扩编红细胞运输车队</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>长跑运动员去高原集训就是为了合法骗出 EPO！在 ${alt} 米待上 ${days} 天，运输车队扩编后回到平原血氧直接溢出，耐力暴涨！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
