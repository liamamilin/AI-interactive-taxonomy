<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📈 血药浓度治疗窗与半衰期锯齿波</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:8px 13px; border-radius:10px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); font-size:13px; font-weight:800; cursor:pointer; }
    .pill.active { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📈 血药浓度治疗窗与半衰期锯齿波</h1>
        <p>误区：药盒写着“每 8 小时一次”，我嫌麻烦改成“早晚各一次”或者“每 4 小时吃一次”应该差不多。真相：每种药都有狭窄的<strong>绿色治疗窗（高于有效线、低于中毒线）</strong>，擅自改间隔不是蓄积中毒，就是反复断崖失效！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="bar">
        <button class="pill" onclick="setIntv(4,this)">🔥 每 4 小时吃（太密 → 蓄积中毒）</button>
        <button class="pill active" onclick="setIntv(8,this)">🎯 每 8 小时吃（医嘱黄金治疗窗）</button>
        <button class="pill" onclick="setIntv(16,this)">🦥 每 16 小时吃（太稀 → 反复失效）</button>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 225"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">稳态峰值浓度</div><div class="k-val" id="kPeak">—</div></div>
        <div class="kpi"><div class="k-lbl">稳态谷底浓度</div><div class="k-val" id="kTrough">—</div></div>
        <div class="kpi"><div class="k-lbl">落在绿色治疗窗时间</div><div class="k-val" id="kWin" style="color:var(--tax-green);">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    let intv = 8; // drug half-life = 8h, dose adds +45
    function setIntv(v, btn){
      intv = v;
      document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      if(window.ToySDK) window.ToySDK.markCompleted();
      draw();
    }

    function draw(){
      const hl = 8, dose = 45, minEff = 40, maxTox = 100;
      const x0=54, x1=612, yMin=26, yMax=190;
      const toX = h => x0 + (h/48)*(x1-x0);
      const toY = c => yMax - (Math.min(155, c)/155)*(yMax-yMin);

      let pts = [], c = 0, peak = 0, trough = 999, inWin = 0, tot = 0;
      for(let h=0; h<=48; h+=0.25){
        if(Math.abs(h % intv) < 0.01) c += dose;
        if(h >= 24){
          if(c > peak) peak = c;
          if(c < trough) trough = c;
          tot++;
          if(c >= minEff && c <= maxTox) inWin++;
        }
        pts.push(`${toX(h).toFixed(1)},${toY(c).toFixed(1)}`);
        c *= Math.pow(0.5, 0.25 / hl);
      }
      const winPct = Math.round((inWin / tot) * 100);
      const col = peak > maxTox ? 'var(--tax-red)' : (trough < minEff ? 'var(--tax-amber)' : 'var(--tax-green)');

      document.getElementById('svg').innerHTML = `
        <rect x="${x0}" y="${yMin}" width="${x1-x0}" height="${toY(maxTox)-yMin}" fill="var(--tax-red-soft)" opacity="0.65"/>
        <text x="${x1-6}" y="${toY(maxTox)-5}" text-anchor="end" font-size="10.5" font-weight="800" fill="var(--tax-red)">🚨 肝肾中毒红线 (100)</text>
        <rect x="${x0}" y="${toY(maxTox)}" width="${x1-x0}" height="${toY(minEff)-toY(maxTox)}" fill="var(--tax-green-soft)" opacity="0.55"/>
        <text x="${x1-6}" y="${toY(minEff)-6}" text-anchor="end" font-size="10.5" font-weight="800" fill="var(--tax-green)">🎯 有效治疗窗 (40–100)</text>
        <text x="${x1-6}" y="${yMax-6}" text-anchor="end" font-size="10.5" fill="var(--tax-muted)">无效谷底 (<40)</text>
        ${[0,8,16,24,32,40,48].map(h=>`<text x="${toX(h)}" y="210" text-anchor="middle" font-size="11" fill="var(--tax-muted)">${h}h</text>`).join('')}
        <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>
        <text x="${x0}" y="18" font-size="11.5" font-weight="800" fill="var(--tax-ink)">药物半衰期 = 8 小时 · 当前每 ${intv} 小时服药 1 次</text>
      `;

      const kP = document.getElementById('kPeak'); kP.textContent = Math.round(peak) + (peak>maxTox?' 🚨 超毒线!':' ✅'); kP.style.color = peak>maxTox?'var(--tax-red)':'var(--tax-green)';
      const kT = document.getElementById('kTrough'); kT.textContent = Math.round(trough) + (trough<minEff?' ⚠️ 失效!':' ✅'); kT.style.color = trough<minEff?'var(--tax-amber)':'var(--tax-green)';
      document.getElementById('kWin').textContent = winPct + '% 稳态时间';

      document.getElementById('ahaBox').innerHTML = intv === 8
        ? `💡 <strong>顿悟时刻：</strong>按半衰期（每 8 小时）准时服药，血药锯齿波稳稳夹在 <strong>${Math.round(trough)}–${Math.round(peak)}</strong> 之间，<strong>${winPct}%</strong> 的时间都精准落在绿色治疗窗内！这就是医嘱“一日三次（每 8 小时）”背后的精确数学！`
        : intv === 4
        ? `💡 <strong>顿悟时刻：</strong>每 4 小时吃一次太密了！前一次药还没代谢掉一半，新药又叠加上来，血药浓度像滚雪球一样冲爆 <strong>${Math.round(peak)}</strong> 冲进红色中毒区！`
        : `💡 <strong>顿悟时刻：</strong>每 16 小时才吃一次，大半时间血药浓度都掉进了 40 以下的无效区（谷底仅 ${Math.round(trough)}），不仅压不住症状，如果是抗生素还会给耐药菌喘息演化的窗口！`;
    }

    draw();
  </script>
</body>
</html>
