<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚠️ 漏服后翻倍补吃？肝肾峰值冲击测试</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .scen-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:9px; margin-bottom:14px; }
    .s-btn { padding:10px 12px; border-radius:12px; border:1.5px solid var(--tax-border); background:var(--tax-surface-alt); color:var(--tax-ink); cursor:pointer; text-align:left; }
    .s-btn.active { border-color:var(--tax-primary); background:var(--tax-primary-soft); }
    .s-btn .t { font-size:13px; font-weight:800; }
    .s-btn .s { font-size:11px; color:var(--tax-muted); margin-top:3px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface-alt); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:18px; font-weight:850; margin-top:2px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⚠️ 漏服后翻倍补吃？肝肾峰值冲击测试</h1>
        <p>误区：早上忘吃药了，晚上把两顿合在一起吃两倍，一天总量不变就行。真相：血药浓度看的是<strong>瞬时峰值</strong>！对于治疗指数（TI）很窄的药物，翻倍补吃会瞬间冲穿中毒红线，引发严重低血糖、大出血或肝肾损伤！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;color:var(--tax-muted);">💊 情景：早 8 点漏服了 1 粒药，到了晚 8 点，对比两种处理方式在不同药物上的后果：</div>
      <div class="scen-grid" id="grid"></div>
      <svg id="svg" class="svg-box" viewBox="0 0 640 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">晚 8 点血药瞬时峰值</div><div class="k-val" id="kPeak">—</div></div>
        <div class="kpi"><div class="k-lbl">中毒红线高度</div><div class="k-val" id="kTox" style="color:var(--tax-red);">—</div></div>
        <div class="kpi"><div class="k-lbl">临床结局</div><div class="k-val" id="kRes">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
    const SCENS = [
      { id:'narrow_dbl', icon:'🚨', name:'窄窗药 + 翻倍吃 2 粒', desc:'如华法林/降糖药/茶碱', peak:148, tox:105, res:'💥 冲穿中毒线！急救风险', col:'var(--tax-red)',
        aha:'💡 <strong>顿悟时刻：</strong>惨烈冲顶！窄治疗窗药物（抗凝药、降糖药、强心苷、锂盐等）中毒线仅比有效线高一点点（105），翻倍补吃把峰值直接轰上 <strong>148</strong>，极易引发严重低血糖休克或内出血！' },
      { id:'narrow_norm', icon:'✅', name:'窄窗药 + 跳过漏服只吃 1 粒', desc:'国际通用漏服安全法则', peak:84, tox:105, res:'🛡️ 稳妥回归安全治疗窗', col:'var(--tax-green)',
        aha:'💡 <strong>顿悟时刻：</strong>牢记全球药师通用口诀：<strong>“漏服后若已接近下一次服药时间，直接跳过漏服那一顿，按正常单倍剂量吃，绝不翻倍补吃！”</strong>短暂低谷远比峰值中毒安全得多！' },
      { id:'wide_dbl', icon:'🟡', name:'宽安全窗药 + 翻倍吃 2 粒', desc:'如部分维生素/宽窗药', peak:148, tox:220, res:'⚠️ 虽未中毒，仍不建议', col:'var(--tax-amber)',
        aha:'💡 <strong>顿悟时刻：</strong>少数宽治疗窗药物（中毒线 220）容错率较高，但依然会增加胃肠道刺激与肝肾额外代谢负担。最稳妥的永远是按说明书或咨询药师！' }
    ];
    let cur = 'narrow_dbl';

    function pick(id){ cur = id; if(window.ToySDK) window.ToySDK.markCompleted(); draw(); }

    function draw(){
      document.getElementById('grid').innerHTML = SCENS.map(s => `
        <button class="s-btn ${cur===s.id?'active':''}" onclick="pick('${s.id}')">
          <div class="t">${s.icon} ${s.name}</div>
          <div class="s">${s.desc}</div>
        </button>
      `).join('');

      const s = SCENS.find(x=>x.id===cur);
      const x0=54, x1=612, yMin=26, yMax=188;
      const toX = h => x0 + (h/36)*(x1-x0);
      const toY = v => yMax - (Math.min(240, v)/240)*(yMax-yMin);

      // Simulate 0h normal (85), 12h missed (drops to 30), 24h action (jumps to s.peak), decays to 36h
      let pts = [];
      for(let h=0; h<=36; h+=0.5){
        let v;
        if(h < 12) v = 84 * Math.pow(0.5, h/12);
        else if(h < 24) v = 42 * Math.pow(0.5, (h-12)/12); // missed at 12h!
        else v = s.peak * Math.pow(0.5, (h-24)/12);
        pts.push(`${toX(h).toFixed(1)},${toY(v).toFixed(1)}`);
      }

      document.getElementById('svg').innerHTML = `
        <rect x="${x0}" y="${yMin}" width="${x1-x0}" height="${toY(s.tox)-yMin}" fill="var(--tax-red-soft)" opacity="0.65"/>
        <line x1="${x0}" y1="${toY(s.tox)}" x2="${x1}" y2="${toY(s.tox)}" stroke="var(--tax-red)" stroke-dasharray="5 4" stroke-width="1.8"/>
        <text x="${x1-6}" y="${toY(s.tox)-5}" text-anchor="end" font-size="10.5" font-weight="800" fill="var(--tax-red)">🚨 中毒红线 (${s.tox})</text>
        <line x1="${x0}" y1="${toY(40)}" x2="${x1}" y2="${toY(40)}" stroke="var(--tax-green)" stroke-dasharray="4 4"/>
        <text x="${toX(12)}" y="${toY(42)-10}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-amber)">❌ 早 8 点漏服</text>
        <text x="${toX(24)}" y="206" text-anchor="middle" font-size="11" font-weight="800" fill="${s.col}">晚 8 点服药点</text>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${s.col}" stroke-width="3.4" stroke-linejoin="round"/>
        <circle cx="${toX(24)}" cy="${toY(s.peak)}" r="6.5" fill="${s.col}"/>
        <text x="${toX(24)+10}" y="${toY(s.peak)+4}" font-size="12" font-weight="900" fill="${s.col}">峰值 ${s.peak}</text>
      `;

      const kP = document.getElementById('kPeak'); kP.textContent = s.peak; kP.style.color = s.col;
      document.getElementById('kTox').textContent = s.tox;
      const kR = document.getElementById('kRes'); kR.textContent = s.res; kR.style.color = s.col;
      document.getElementById('ahaBox').innerHTML = s.aha;
    }

    draw();
  </script>
</body>
</html>
