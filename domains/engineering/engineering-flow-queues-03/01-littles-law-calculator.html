<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：利特尔法则（L = λ × W）咖啡店沙盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 700px) { .ctrls { grid-template-columns: 1fr; } }
    .res { padding: 18px; border-radius: 16px; background: var(--tax-surface-alt); border: 1.5px solid var(--tax-border); text-align: center; }
    .big { font-size: 32px; font-weight: 900; font-family: ui-monospace, monospace; color: var(--tax-primary); margin-top: 6px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>☕ 利特尔法则（Little's Law）：<code>交付周期 W = 积压在制品 L ÷ 吞吐率 λ</code></h1>
        <p>一家咖啡店每小时稳定出杯 <strong>λ</strong> 杯（产能固定）。拖动同时积压在台面上的订单数 <strong>L（WIP）</strong>，看看每位顾客拿到咖啡的时间 <strong>W</strong> 怎么变！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="ctrls">
        <div>
          <label style="font-weight:850;font-size:14px;">📦 同时积压在制品数 L (WIP)：<span id="lVal" style="color:var(--tax-amber)">10</span> 单</label>
          <input id="lSl" type="range" min="2" max="40" value="10" style="width:100%;margin-top:6px;" />
        </div>
        <div>
          <label style="font-weight:850;font-size:14px;">⚡ 团队/咖啡机稳定吞吐 λ：<span id="rVal" style="color:var(--tax-green)">20</span> 单/小时</label>
          <input id="rSl" type="range" min="5" max="40" value="20" style="width:100%;margin-top:6px;" />
        </div>
      </div>

      <div class="res">
        <div style="font-size:13px;color:var(--tax-muted);font-weight:750;">每单平均等待交付时间 W = L / λ</div>
        <div class="big" id="wOut">30.0 分钟</div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let drags = 0;
    function render() {
      const L = parseInt(document.getElementById("lSl").value, 10);
      const lam = parseInt(document.getElementById("rSl").value, 10);
      document.getElementById("lVal").textContent = L;
      document.getElementById("rVal").textContent = lam;
      const mins = (L / lam) * 60;
      const el = document.getElementById("wOut");
      el.textContent = mins.toFixed(1) + " 分钟";
      el.style.color = mins <= 15 ? "var(--tax-green)" : mins <= 45 ? "var(--tax-amber)" : "var(--tax-red)";

      document.getElementById("ahaBox").innerHTML = `💡 <strong>管理学与系统工程的“牛顿定律”：</strong>在团队产能 <code>λ = ${lam}</code> 不变的前提下，想要把交付时间 <code>W</code> 砍半，<strong>最快且零成本的方法不是逼大家加班，而是把同时开工的积压任务数 <code>L</code> 砍半！</strong>（Stop starting, start finishing！）`;
    }
    ["lSl", "rSl"].forEach(id => document.getElementById(id).addEventListener("input", () => {
      drags++;
      render();
      if (drags >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    }));
    render();
  </script>
</body>
</html>
