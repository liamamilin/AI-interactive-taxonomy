<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：队列竞速 · 1 条蛇形总队 vs 3 条独立小队</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--tax-primary); background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; margin-bottom: 14px; }
    .duel { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .duel { grid-template-columns: 1fr; } }
    .lane { background: var(--tax-surface-alt); border: 1.5px solid var(--tax-border); border-radius: 14px; padding: 16px; }
    .track { height: 14px; background: var(--tax-surface); border-radius: 999px; overflow: hidden; border: 1px solid var(--tax-border); margin: 8px 0; }
    .fill { height: 100%; width: 0%; transition: width 0.14s linear; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🏁 1 条蛇形大队 vs 3 条独立小队：为什么总觉得“我排的那一队最慢”？</h1>
        <p>12 位顾客去 3 个收银台结账，其中 2 号台突然出现一位“大采购慢顾客”（耗时是普通人的 5 倍）！点击发车对比！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <button class="btn" onclick="go()">▶ 12 位顾客同时开始结账</button>
      <div class="duel">
        <div class="lane" style="border-color:var(--tax-green);">
          <div style="font-weight:850;font-size:14px;">🐍 单排蛇形总队（M/M/3 · 哪空去哪）</div>
          <div class="track"><div class="fill" id="f1" style="background:var(--tax-green);"></div></div>
          <div id="s1" style="font-size:12.5px;font-family:monospace;color:var(--tax-muted);">待命…</div>
        </div>
        <div class="lane">
          <div style="font-weight:850;font-size:14px;">🧍🧍🧍 3 条独立小队（各自为战）</div>
          <div class="track"><div class="fill" id="f2" style="background:var(--tax-amber);"></div></div>
          <div id="s2" style="font-size:12.5px;font-family:monospace;color:var(--tax-muted);">待命…</div>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻：</strong>点击开始结账，看清为什么“看起来很长的一条蛇形队”，实际平均等待和最坏等待时间都远胜 3 条短队！
    </div>
  </div>

  <script>
    let timer = null;
    function go() {
      if (timer) clearInterval(timer);
      let p1 = 0, p2 = 0;
      timer = setInterval(() => {
        p1 = Math.min(100, p1 + 25);
        p2 = Math.min(100, p2 + 10);
        document.getElementById("f1").style.width = p1 + "%";
        document.getElementById("f2").style.width = p2 + "%";
        document.getElementById("s1").textContent = p1 >= 100 ? "✅ 全部结完：总耗时 6 分钟（1/3 号台迅速分担了 2 号台后面的人！）" : `动态分流结账中 ${p1}%`;
        document.getElementById("s2").textContent = p2 >= 100 ? "😵 全部结完：总耗时 14 分钟（1/3 号台早已空转发呆，2 号队还在苦等！）" : `2 号队被卡死，1/3 号台提前闲置 ${p2}%`;
        if (p2 >= 100) {
          clearInterval(timer);
          document.getElementById("ahaBox").innerHTML = "💡 <strong>排队论铁律（共享池永远碾压隔离池）：</strong>独立小队最大的浪费是<strong>“一边排长龙、一边空窗口发呆”</strong>，且彻底破坏先来先得公平感！蛇形总队（就像后端服务的共享线程池/消息队列）能消灭空转并把最坏等待时间直接腰斩！";
          if (window.ToySDK) window.ToySDK.markCompleted();
        }
      }, 150);
    }
  </script>
</body>
</html>
