<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：表面积/体积比透视镜</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .presets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .pbtn { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; cursor: pointer; font-weight: 700; }
    .pbtn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🐘 表面积/体积比透视镜：为什么老鼠怕冷而大象怕热？</h1>
        <p>误区：物体越大，表面积越大，散热应该越快。真相：体积产热按 L³ 增长，表面积散热只按 L² 增长，越大越容易“闷烧”！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="presets">
        <button class="pbtn active" onclick="setSize(1, this)">🐭 小鼠 / 手机芯片 (L=1)</button>
        <button class="pbtn" onclick="setSize(4, this)">🧑 人类 / 台式机箱 (L=4)</button>
        <button class="pbtn" onclick="setSize(10, this)">🐘 大象 / 高密机柜 (L=10)</button>
      </div>
      <label style="font-weight:750;font-size:14px;">📐 特征边长 L：<span id="lOut">1</span>
        <input id="lS" type="range" min="1" max="12" value="1" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svSvg" viewBox="0 0 540 220" style="width:100%;height:auto;margin-top:14px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻（Aha! Moment）：</strong>切换小鼠与大象，看看“单位体积拥有的散热表面积（6/L）”是如何断崖式下跌的！
    </div>
  </div>

  <script>
    let visited = 0;
    function setSize(v, btn) {
      document.getElementById("lS").value = v;
      document.querySelectorAll(".pbtn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    }
    function render() {
      const L = +document.getElementById("lS").value;
      document.getElementById("lOut").textContent = L;
      const S = 6 * L * L;
      const V = L * L * L;
      const ratio = (S / V).toFixed(2);
      const boxSize = 20 + L * 11;

      document.getElementById("svSvg").innerHTML = `
        <rect x="60" y="${110 - boxSize/2}" width="${boxSize}" height="${boxSize}" rx="8" fill="var(--tax-primary)" fill-opacity="0.22" stroke="var(--tax-primary)" stroke-width="2.5"/>
        <text x="60" y="198" font-size="12.5" font-weight="700" fill="var(--tax-muted)">边长 L = ${L}</text>
        <text x="240" y="65" font-size="15" font-weight="800" fill="currentColor">散热表面积 (6L²)：${S}</text>
        <text x="240" y="100" font-size="15" font-weight="800" fill="#f59e0b">产热体积 (L³)：${V}</text>
        <text x="240" y="142" font-size="18" font-weight="900" fill="${L>=8?'#ef4444':'#10b981'}">比表面积 (S/V = 6/L)：${ratio}</text>
      `;

      visited++;
      if (visited >= 2) {
        document.getElementById("ahaBox").innerHTML = `💡 <strong>顿悟时刻（Aha! Moment）：</strong>当边长 L=${L} 时，比表面积仅剩 <strong>${ratio}</strong>！这就是为什么大象必须长出薄而巨大的耳朵、高密度 AI 芯片必须改用液冷直接把热量抽出来。`;
        if (window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
  </script>
</body>
</html>
