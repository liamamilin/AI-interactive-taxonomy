<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：卡尔曼增益（K）加权融合沙盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrls { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 700px) { .ctrls { grid-template-columns: 1fr; } }
    .stage { background: #0f172a; border: 1.5px solid var(--tax-border); border-radius: 16px; padding: 12px; }
    svg { width: 100%; height: 195px; display: block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🎯 卡尔曼增益 K：把两个“都不太准的猜测”融合成比两者都更准的真相！</h1>
        <p>里程计预测车在 <strong>100m</strong>（蓝），GPS 测量车在 <strong>112m</strong>（橙）。拖动两者的误差标准差，看卡尔曼滤波如何自动偏向更靠谱的那一方并融出更窄的绿峰！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="ctrls">
        <div>
          <label style="font-weight:850;font-size:13.5px;">🔵 里程计预测不确定度 σ₁：<span id="s1Val" style="color:var(--tax-primary)">8</span> m</label>
          <input id="s1" type="range" min="2" max="20" value="8" style="width:100%;margin-top:6px;" />
        </div>
        <div>
          <label style="font-weight:850;font-size:13.5px;">🟠 GPS 测量不确定度 σ₂：<span id="s2Val" style="color:var(--tax-amber)">8</span> m</label>
          <input id="s2" type="range" min="2" max="20" value="8" style="width:100%;margin-top:6px;" />
        </div>
      </div>

      <div class="stage"><svg viewBox="0 0 540 190" id="kfSvg"></svg></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let drags = 0;
    function gaussPath(mean, sigma, col, width) {
      let pts = [];
      for (let x = 70; x <= 140; x += 1) {
        const px = 30 + ((x - 70) / 70) * 480;
        const val = Math.exp(-0.5 * Math.pow((x - mean) / sigma, 2)) / (sigma * 0.14);
        const py = 168 - Math.min(140, val * 55);
        pts.push(`${px.toFixed(1)},${py.toFixed(1)}`);
      }
      return `<polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="${width}"/>`;
    }

    function render() {
      const s1 = parseInt(document.getElementById("s1").value, 10);
      const s2 = parseInt(document.getElementById("s2").value, 10);
      document.getElementById("s1Val").textContent = s1;
      document.getElementById("s2Val").textContent = s2;

      const v1 = s1 * s1, v2 = s2 * s2;
      const K = v1 / (v1 + v2);
      const fusedMean = 100 + K * (112 - 100);
      const fusedSigma = Math.sqrt((v1 * v2) / (v1 + v2));

      let s = `<line x1="30" y1="168" x2="510" y2="168" stroke="#334155" stroke-width="2"/>`;
      s += gaussPath(100, s1, "#6366f1", 2.5);
      s += gaussPath(112, s2, "#f59e0b", 2.5);
      s += gaussPath(fusedMean, fusedSigma, "#10b981", 4);
      s += `<text x="270" y="20" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="800">卡尔曼增益 K = ${K.toFixed(2)} · 融合定位 = ${fusedMean.toFixed(1)}m · 融合误差 σ = ${fusedSigma.toFixed(1)}m（比两者都更窄！）</text>`;
      document.getElementById("kfSvg").innerHTML = s;

      document.getElementById("ahaBox").innerHTML = `💡 <strong>1 + 1 &gt; 2 的数学魔法：</strong>谁的方差小（更靠谱），卡尔曼增益 <code>K</code> 就自动给谁更大权重！更神奇的是，融合后的绿色高斯分布永远比单独看里程计（${s1}m）或单独看 GPS（${s2}m）<strong>都要更窄、更确定（仅 ${fusedSigma.toFixed(1)}m）</strong>——这就是当年把阿波罗飞船精准送上月球的传奇算法！`;
    }

    ["s1", "s2"].forEach(id => document.getElementById(id).addEventListener("input", () => {
      drags++;
      render();
      if (drags >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    }));
    render();
  </script>
</body>
</html>
