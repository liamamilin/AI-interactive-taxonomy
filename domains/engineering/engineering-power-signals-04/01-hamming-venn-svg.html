<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：汉明(7,4)三圆维恩图 · SVG 自动纠错</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .stage { background: #0f172a; border: 1.5px solid var(--tax-border); border-radius: 16px; padding: 12px; margin-top: 12px; }
    svg { width: 100%; height: 300px; display: block; }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⭕ 汉明(7,4)三圆维恩图：宇宙射线劈翻 1 bit 自动锁定！</h1>
        <p>规则极其简单：<strong>每个大圆圈内所有数字之和必须是偶数</strong>。直接<strong>点击图里任意一个数字圆点</strong>模拟宇宙射线翻转它，看红圈交集如何秒级定位！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="stage"><svg viewBox="0 0 540 295" id="vennSvg"></svg></div>
      <div class="btn-row">
        <button id="fixBtn" class="tax-btn" type="button">🛠️ 一键按交集自动修复</button>
        <button id="randBtn" class="tax-btn" type="button" style="background:var(--tax-surface-2);color:var(--tax-text);border:1px solid var(--tax-border);">🎲 随机生成新 4 位数据</button>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    // 1-indexed Hamming(7,4):
    // pos 1: P1 (only C1) -> covers 1,3,5,7
    // pos 2: P2 (only C2) -> covers 2,3,6,7
    // pos 3: D1 (C1 ∩ C2)
    // pos 4: P4 (only C4) -> covers 4,5,6,7
    // pos 5: D2 (C1 ∩ C4)
    // pos 6: D3 (C2 ∩ C4)
    // pos 7: D4 (C1 ∩ C2 ∩ C4)
    let bits = [0, 0, 1, 1, 0, 1, 0, 1]; // index 1..7
    let flips = 0;

    function encodeFromData(d1, d2, d3, d4) {
      const p1 = d1 ^ d2 ^ d4;
      const p2 = d1 ^ d3 ^ d4;
      const p4 = d2 ^ d3 ^ d4;
      bits = [0, p1, p2, d1, p4, d2, d3, d4];
    }

    function flipBit(pos) {
      bits[pos] ^= 1;
      flips++;
      render();
      if (flips >= 2 && window.ToySDK) window.ToySDK.markCompleted();
    }
    window.flipBit = flipBit;

    function getSyndrome() {
      const e1 = bits[1] ^ bits[3] ^ bits[5] ^ bits[7];
      const e2 = bits[2] ^ bits[3] ^ bits[6] ^ bits[7];
      const e4 = bits[4] ^ bits[5] ^ bits[6] ^ bits[7];
      return { e1, e2, e4, pos: e1 * 1 + e2 * 2 + e4 * 4 };
    }

    function render() {
      const { e1, e2, e4, pos } = getSyndrome();

      // Three Venn circles: C1 (top-left), C2 (top-right), C4 (bottom)
      const c1 = { x: 222, y: 122, r: 86, err: e1 === 1, name: "圆1 (P1)" };
      const c2 = { x: 318, y: 122, r: 86, err: e2 === 1, name: "圆2 (P2)" };
      const c4 = { x: 270, y: 196, r: 86, err: e4 === 1, name: "圆4 (P4)" };

      let s = "";
      [c1, c2, c4].forEach((c) => {
        s += `<circle cx="${c.x}" cy="${c.y}" r="${c.r}" fill="${c.err ? "rgba(239,68,68,0.18)" : "rgba(56,189,248,0.10)"}" stroke="${c.err ? "#ef4444" : "#38bdf8"}" stroke-width="${c.err ? 3.5 : 2}"/>`;
      });

      s += `<text x="112" y="62" fill="${e1 ? "#fca5a5" : "#7dd3fc"}" font-size="12" font-weight="800">圆1：${e1 ? "❌ 奇数报错" : "✅ 偶数正常"}</text>`;
      s += `<text x="428" y="62" text-anchor="end" fill="${e2 ? "#fca5a5" : "#7dd3fc"}" font-size="12" font-weight="800">圆2：${e2 ? "❌ 奇数报错" : "✅ 偶数正常"}</text>`;
      s += `<text x="270" y="290" text-anchor="middle" fill="${e4 ? "#fca5a5" : "#7dd3fc"}" font-size="12" font-weight="800">圆4：${e4 ? "❌ 奇数报错" : "✅ 偶数正常"}</text>`;

      const nodes = [
        { p: 1, x: 184, y: 102, lbl: "P1" },
        { p: 2, x: 356, y: 102, lbl: "P2" },
        { p: 3, x: 270, y: 98,  lbl: "D1" },
        { p: 4, x: 270, y: 242, lbl: "P4" },
        { p: 5, x: 215, y: 174, lbl: "D2" },
        { p: 6, x: 325, y: 174, lbl: "D3" },
        { p: 7, x: 270, y: 150, lbl: "D4" }
      ];

      nodes.forEach((n) => {
        const isSuspect = pos === n.p;
        const fill = isSuspect ? "#ef4444" : n.lbl.startsWith("D") ? "#10b981" : "#6366f1";
        s += `<g style="cursor:pointer" onclick="flipBit(${n.p})">`;
        s += `<circle cx="${n.x}" cy="${n.y}" r="${isSuspect ? 22 : 19}" fill="${fill}" stroke="#fff" stroke-width="${isSuspect ? 3 : 1.5}"/>`;
        s += `<text x="${n.x}" y="${n.y + 4}" text-anchor="middle" fill="#fff" font-size="15" font-weight="900">${bits[n.p]}</text>`;
        s += `<text x="${n.x}" y="${n.y - 23}" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-weight="700">${n.lbl}(#${n.p})</text>`;
        s += `</g>`;
      });

      document.getElementById("vennSvg").innerHTML = s;

      document.getElementById("ahaBox").innerHTML = pos === 0
        ? "💡 <strong>数据完好无损！</strong>三个圆里 1 的个数都是偶数。现在试着<strong>随便点击任意一个圆点</strong>发射宇宙射线，看汉明码怎么瞬间抓住它！"
        : `💡 <strong>雷达锁定出错位：第 #${pos} 位（校验交集 = ${e4}${e2}${e1}₂ = ${pos}）！</strong>只有第 #${pos} 位刚好同时落在所有变红的圆的交集里，且不在任何正常蓝圈里——点「一键自动修复」就能零重传自愈！`;
    }

    document.getElementById("fixBtn").addEventListener("click", () => {
      const { pos } = getSyndrome();
      if (pos > 0) {
        bits[pos] ^= 1;
        render();
        if (window.ToySDK) window.ToySDK.markCompleted();
      }
    });

    document.getElementById("randBtn").addEventListener("click", () => {
      encodeFromData(Math.round(Math.random()), Math.round(Math.random()), Math.round(Math.random()), Math.round(Math.random()));
      render();
    });

    encodeFromData(1, 0, 1, 1);
    render();
  </script>
</body>
</html>
