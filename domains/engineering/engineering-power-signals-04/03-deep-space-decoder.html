<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：深空探测器纠错解码台 · 旅行者号盲解</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .pkt-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 12px; }
    .pkt-bit { padding: 12px 4px; border-radius: 12px; border: 2px solid var(--tax-border); background: var(--tax-surface-2); text-align: center; cursor: pointer; }
    .pkt-bit:hover { border-color: var(--tax-primary); }
    .pkt-bit.fixed { border-color: #10b981; background: rgba(16, 185, 129, 0.16); }
    .chk-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .chk-card { background: var(--tax-surface-2); border: 1px solid var(--tax-border); border-radius: 10px; padding: 10px; text-align: center; font-size: 13px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🛰️ 深空探测器纠错解码台（旅行者号盲解挑战）</h1>
        <p>信号飞了 22 小时才到地球，根本来不及喊它重发！数据包里有 <strong>1 个比特被宇宙射线劈翻了</strong>，请看下方 3 组校验结果，<strong>亲自点出坏比特修复它</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div style="font-weight:850;font-size:15px;">📡 收到数据包（点击你怀疑出错的位进行翻转修复）：</div>
        <div style="font-size:13px;font-weight:800;color:var(--tax-primary);">已成功抢救：<span id="winCnt">0</span> 包</div>
      </div>

      <div class="pkt-row" id="pktRow"></div>

      <div class="chk-grid">
        <div class="chk-card">P1 校验 (#1,3,5,7)<div id="c1" style="font-size:17px;font-weight:900;margin-top:4px;"></div></div>
        <div class="chk-card">P2 校验 (#2,3,6,7)<div id="c2" style="font-size:17px;font-weight:900;margin-top:4px;"></div></div>
        <div class="chk-card">P4 校验 (#4,5,6,7)<div id="c4" style="font-size:17px;font-weight:900;margin-top:4px;"></div></div>
      </div>

      <div id="statusMsg" style="margin-top:12px;font-weight:850;font-size:14.5px;"></div>
      <div style="margin-top:10px;">
        <button id="newBtn" class="tax-btn" type="button">🛰️ 接收下一包深空信号</button>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">💡 <strong>解码秘籍：</strong>把报错（奇数=1，正常=0）按 <code>P4 P2 P1</code> 顺序拼成 3 位二进制，十进制数值就是坏掉的位号（1~7）！</div>
  </div>

  <script>
    let bits = [];
    let solved = false;
    let wins = 0;

    function newPacket() {
      const d1 = Math.round(Math.random()), d2 = Math.round(Math.random()), d3 = Math.round(Math.random()), d4 = Math.round(Math.random());
      const p1 = d1 ^ d2 ^ d4, p2 = d1 ^ d3 ^ d4, p4 = d2 ^ d3 ^ d4;
      bits = [0, p1, p2, d1, p4, d2, d3, d4];
      const errPos = 1 + Math.floor(Math.random() * 7);
      bits[errPos] ^= 1;
      solved = false;
      render();
    }

    function render() {
      const e1 = bits[1] ^ bits[3] ^ bits[5] ^ bits[7];
      const e2 = bits[2] ^ bits[3] ^ bits[6] ^ bits[7];
      const e4 = bits[4] ^ bits[5] ^ bits[6] ^ bits[7];
      const syn = e4 * 4 + e2 * 2 + e1;

      const row = document.getElementById("pktRow");
      row.innerHTML = [1, 2, 3, 4, 5, 6, 7].map((i) => `<div class="pkt-bit ${syn === 0 ? "fixed" : ""}" data-i="${i}">
        <div style="font-size:11px;color:var(--tax-muted);font-weight:700;">#${i}</div>
        <div style="font-size:24px;font-weight:900;">${bits[i]}</div>
      </div>`).join("");

      row.querySelectorAll(".pkt-bit").forEach((el) => {
        el.addEventListener("click", () => {
          const i = parseInt(el.dataset.i, 10);
          bits[i] ^= 1;
          const ne1 = bits[1] ^ bits[3] ^ bits[5] ^ bits[7];
          const ne2 = bits[2] ^ bits[3] ^ bits[6] ^ bits[7];
          const ne4 = bits[4] ^ bits[5] ^ bits[6] ^ bits[7];
          if (ne1 === 0 && ne2 === 0 && ne4 === 0 && !solved) {
            solved = true;
            wins++;
            document.getElementById("winCnt").textContent = wins;
            if (window.ToySDK) window.ToySDK.markCompleted();
          }
          render();
        });
      });

      document.getElementById("c1").innerHTML = e1 ? '<span style="color:#ef4444">❌ 奇 (1)</span>' : '<span style="color:#10b981">✅ 偶 (0)</span>';
      document.getElementById("c2").innerHTML = e2 ? '<span style="color:#ef4444">❌ 奇 (1)</span>' : '<span style="color:#10b981">✅ 偶 (0)</span>';
      document.getElementById("c4").innerHTML = e4 ? '<span style="color:#ef4444">❌ 奇 (1)</span>' : '<span style="color:#10b981">✅ 偶 (0)</span>';

      const msg = document.getElementById("statusMsg");
      if (syn === 0) {
        const dataStr = `${bits[3]}${bits[5]}${bits[6]}${bits[7]}`;
        msg.style.color = "#10b981";
        msg.textContent = `🎉 抢救成功！三组校验全部归零，还原出完整 4 位深空数据：${dataStr}`;
        document.getElementById("ahaBox").innerHTML = "💡 <strong>现实里的无声英雄：</strong>从 240 亿公里外的旅行者 1 号、手机 5G 信号、QR 二维码污损容错到数据中心 ECC 内存条，全都在用汉明码与里德-所罗门码默默帮人类对抗宇宙噪声！";
      } else {
        msg.style.color = "#f59e0b";
        msg.textContent = `🔍 提示：报错二进制 (P4 P2 P1) = ${e4}${e2}${e1}₂，算算它等于十进制几号位，然后点上面那一位修复它！`;
      }
    }

    document.getElementById("newBtn").addEventListener("click", newPacket);
    newPacket();
  </script>
</body>
</html>
