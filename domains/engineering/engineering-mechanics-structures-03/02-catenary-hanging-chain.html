<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：倒悬链线秘密 · 完美拱桥曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--tax-primary); background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
    .stage { background: #0f172a; border: 1.5px solid var(--tax-border); border-radius: 16px; padding: 12px; }
    svg { width: 100%; height: 210px; display: block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⛓️ 倒悬链线（Catenary）：把自然下垂的铁链倒过来，就是大自然最完美的拱门！</h1>
        <p>1675 年科学家胡克写下名言：<em>“软链怎么垂，硬拱就怎么立！”</em>点击按钮一键上下翻转这条自由悬垂的铁链！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <button class="btn" id="flipBtn" onclick="flip()">🔄 上下翻转 180°（悬链 → 完美圣家堂拱门！）</button>
      <div class="stage"><svg viewBox="0 0 520 200" id="catSvg"></svg></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let inverted = false;
    function flip() {
      inverted = !inverted;
      document.getElementById("flipBtn").textContent = inverted ? "🔄 翻回自然下垂铁链" : "🔄 上下翻转 180°（悬链 → 完美拱门！）";
      render();
      if (inverted && window.ToySDK) window.ToySDK.markCompleted();
    }

    function render() {
      const pts = [];
      for (let i = -10; i <= 10; i++) {
        const t = i / 5; // -2 .. 2
        const x = 260 + i * 19;
        const coshVal = (Math.cosh(t) - 1) / (Math.cosh(2) - 1); // 0 at center, 1 at ends
        const y = inverted ? 32 + coshVal * 145 : 172 - coshVal * 145;
        pts.push([x, y]);
      }
      const d = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
      let s = `<polyline points="${d}" fill="none" stroke="${inverted ? "#38bdf8" : "#f59e0b"}" stroke-width="5" stroke-linejoin="round"/>`;
      pts.forEach(([x, y], i) => {
        if (i % 2 === 0) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="#fff"/>`;
      });
      s += `<text x="260" y="${inverted ? 190 : 22}" text-anchor="middle" fill="${inverted ? "#6ee7b7" : "#fcd34d"}" font-size="12.5" font-weight="800">${inverted ? "🏛️ 翻转后：全线纯受压零弯矩！圣路易斯大拱门 & 圣家堂同款曲线！" : "⛓️ 自由垂落铁链：全线纯受拉力、零弯曲力矩"}</text>`;
      document.getElementById("catSvg").innerHTML = s;

      document.getElementById("ahaBox").innerHTML = inverted
        ? "💡 <strong>建筑天才高迪的“倒挂沙袋法”：</strong>柔软的铁链根本扛不住弯曲，所以它自然下垂成的<strong>悬链线（y = cosh x）</strong>必然全线只受纯拉力；把它上下翻转凝固成石头，所有拉力瞬间反号变成<strong>100% 纯压力</strong>，一根钢筋不用也能建出百米教堂！"
        : "💡 <strong>顿悟时刻：</strong>点击上方按钮把铁链上下翻转 180°，亲眼看见自然界最优雅的力学对称！";
    }
    render();
  </script>
</body>
</html>
