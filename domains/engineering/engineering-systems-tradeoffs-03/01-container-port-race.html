<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：港口装卸竞速</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 14px; }
    @media (max-width: 740px) { .lanes { grid-template-columns: 1fr; } }
    .lane { border: 1px solid var(--tax-border); border-radius: 14px; padding: 16px; background: var(--tax-surface); }
    .bar { height: 14px; background: var(--tax-border); border-radius: 999px; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; width: 0%; transition: width 0.1s linear; }
    .tax-btn { padding: 10px 18px; border-radius: 10px; border: none; background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🚢 港口装卸竞速：为什么集装箱改变了世界贸易？</h1>
        <p>误区：海运变快主要靠轮船发动机升级。真相：轮船在海上跑再快，以前也有一半时间耗在港口人工搬运上！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <button class="tax-btn" onclick="startRace()">🚀 开始装卸 1000 吨混合货物竞速</button>
      <div class="lanes">
        <div class="lane">
          <h3 style="margin:0 0 6px;">📦 1950 年：散杂货人工码垛</h3>
          <p style="font-size:13px;color:var(--tax-muted);margin:0;">木箱、麻袋、铁桶尺寸各异，吊车必须逐件捆扎，船卡对接全靠人工重装。</p>
          <svg id="svgA" viewBox="0 0 280 96" style="width:100%;height:auto;margin-top:8px;border-radius:10px;background:var(--tax-surface-alt);"></svg>
          <div class="bar"><div id="fillA" class="fill" style="background:#f59e0b;"></div></div>
          <div style="font-weight:800;font-family:monospace;">进度：<span id="pctA">0%</span> · 耗时：<span id="timeA">0</span> 天</div>
        </div>
        <div class="lane">
          <h3 style="margin:0 0 6px;">🏗️ 现代：标准集装箱（TEU）吊装</h3>
          <p style="font-size:13px;color:var(--tax-muted);margin:0;">内部装什么不管，外部锁孔与尺寸全球统一，龙门吊一键抓起直接落上卡车/火车。</p>
          <svg id="svgB" viewBox="0 0 280 96" style="width:100%;height:auto;margin-top:8px;border-radius:10px;background:var(--tax-surface-alt);"></svg>
          <div class="bar"><div id="fillB" class="fill" style="background:#10b981;"></div></div>
          <div style="font-weight:800;font-family:monospace;">进度：<span id="pctB">0%</span> · 耗时：<span id="timeB">0</span> 小时</div>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻（Aha! Moment）：</strong>点击上方按钮开始竞速，感受“标准物理接口”如何把一周的港口滞留压缩到几小时！
    </div>
  </div>

  <script>
    let timer = null;
    function drawScene(a, b) {
      const boxesA = Math.floor((a / 100) * 12);
      let htmlA = `<rect x="14" y="68" width="252" height="16" rx="4" fill="var(--tax-border)"/>`;
      for (let i = 0; i < boxesA; i++) {
        const w = 12 + (i % 3) * 5, h = 12 + ((i + 1) % 3) * 4;
        htmlA += `<rect x="${20 + i*19}" y="${68-h}" width="${w}" height="${h}" rx="2" fill="#f59e0b" opacity="0.85"/>`;
      }
      document.getElementById("svgA").innerHTML = htmlA;

      const boxesB = Math.floor((b / 100) * 12);
      let htmlB = `<rect x="14" y="68" width="252" height="16" rx="4" fill="var(--tax-border)"/>`;
      for (let i = 0; i < boxesB; i++) {
        const col = i % 6, row = Math.floor(i / 6);
        htmlB += `<rect x="${24 + col*39}" y="${50 - row*19}" width="35" height="17" rx="2" fill="#10b981" stroke="#fff" stroke-width="1"/>`;
      }
      document.getElementById("svgB").innerHTML = htmlB;
    }

    function startRace() {
      if (timer) clearInterval(timer);
      let a = 0, b = 0;
      timer = setInterval(() => {
        a = Math.min(100, a + 1.1);
        b = Math.min(100, b + 8.5);
        document.getElementById("fillA").style.width = a + "%";
        document.getElementById("fillB").style.width = b + "%";
        document.getElementById("pctA").textContent = Math.round(a) + "%";
        document.getElementById("pctB").textContent = Math.round(b) + "%";
        document.getElementById("timeA").textContent = (a * 0.08).toFixed(1);
        document.getElementById("timeB").textContent = (b * 0.06).toFixed(1);
        drawScene(a, b);
        if (b >= 100 && a < 100) {
          document.getElementById("ahaBox").innerHTML = `💡 <strong>顿悟时刻（Aha! Moment）：</strong>集装箱已全部装船发走（仅 6 小时），散杂货码头才刚装完 <strong>${Math.round(a)}%</strong>！标准化接口把“货物”与“运载工具”彻底解耦，让船、火车、卡车无缝接力。`;
        }
        if (a >= 100 && b >= 100) {
          clearInterval(timer);
          if (window.ToySDK) window.ToySDK.markCompleted();
        }
      }, 60);
    }
    drawScene(0, 0);
  </script>
</body>
</html>
