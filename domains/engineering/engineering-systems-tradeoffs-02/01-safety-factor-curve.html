<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：安全系数经济学</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 18px; align-items: start; }
    @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
    .ctrl { margin-bottom: 14px; }
    .ctrl label { display: flex; justify-content: space-between; font-weight: 750; font-size: 14px; margin-bottom: 6px; }
    .metric { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--tax-border); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .metric strong { font-size: 18px; font-family: ui-monospace, monospace; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⚖️ 安全系数经济学：安全余量越厚越好吗？</h1>
        <p>误区：把安全系数拉到 10 倍最省心。真相：每多一倍材料冗余，成本与重量就呈陡峭上升，甚至让航天器飞不起来！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="grid">
        <div>
          <div class="ctrl">
            <label><span>🛡️ 安全系数 SF（设计强度 / 预期载荷）</span><span id="sfVal">2.0</span></label>
            <input id="sfSlider" type="range" min="1.0" max="6.0" step="0.1" value="2.0" style="width:100%;" oninput="render()" />
          </div>
          <div class="ctrl">
            <label><span>🚀 重量/成本敏感度（普通建筑 → 航天器）</span><span id="wVal">中</span></label>
            <input id="wSlider" type="range" min="1" max="5" step="1" value="2" style="width:100%;" oninput="render()" />
          </div>
          <div class="metric"><span>材料与过设计成本</span><strong id="buildCost" style="color:#f59e0b;">0</strong></div>
          <div class="metric"><span>预期失效风险代价</span><strong id="failCost" style="color:#ef4444;">0</strong></div>
          <div class="metric"><span>系统总生命周期代价</span><strong id="totalCost" style="color:var(--tax-primary);">0</strong></div>
        </div>
        <div>
          <svg id="curve" viewBox="0 0 460 280" style="width:100%;height:auto;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻（Aha! Moment）：</strong>试着把“重量敏感度”调到最高（模拟火箭），再把安全系数拉到 4.0，看看总代价是如何飙升的！
    </div>
  </div>

  <script>
    let touched = 0;
    const wLabels = ["极低(电梯)", "低(桥梁)", "中(汽车)", "高(民航)", "极高(火箭)"];
    function calc(sf, w) {
      const build = Math.round(12 * w * Math.pow(sf, 1.45));
      const fail = Math.round(450 * Math.exp(-2.3 * (sf - 1.0)));
      return { build, fail, total: build + fail };
    }
    function render() {
      const sf = parseFloat(document.getElementById("sfSlider").value);
      const w = parseInt(document.getElementById("wSlider").value, 10);
      document.getElementById("sfVal").textContent = sf.toFixed(1) + "×";
      document.getElementById("wVal").textContent = wLabels[w - 1];

      const cur = calc(sf, w);
      document.getElementById("buildCost").textContent = cur.build + " 万";
      document.getElementById("failCost").textContent = cur.fail + " 万";
      document.getElementById("totalCost").textContent = cur.total + " 万";

      let bestSf = 1.0, bestTot = 1e9;
      const ptsB = [], ptsF = [], ptsT = [];
      for (let s = 1.0; s <= 6.01; s += 0.2) {
        const c = calc(s, w);
        if (c.total < bestTot) { bestTot = c.total; bestSf = s; }
        ptsB.push([s, c.build]);
        ptsF.push([s, c.fail]);
        ptsT.push([s, c.total]);
      }

      const maxY = Math.max(550, ...ptsT.map(p => p[1])) * 1.08;
      const sx = s => 45 + ((s - 1.0) / 5.0) * 395;
      const sy = v => 240 - (v / maxY) * 210;
      const path = arr => arr.map((p, i) => `${i===0?'M':'L'}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");

      document.getElementById("curve").innerHTML = `
        <line x1="45" y1="240" x2="440" y2="240" stroke="var(--tax-border)"/>
        <line x1="45" y1="30" x2="45" y2="240" stroke="var(--tax-border)"/>
        <path d="${path(ptsB)}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4"/>
        <path d="${path(ptsF)}" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4"/>
        <path d="${path(ptsT)}" fill="none" stroke="var(--tax-primary)" stroke-width="3"/>
        <line x1="${sx(sf)}" y1="30" x2="${sx(sf)}" y2="240" stroke="var(--tax-primary)" stroke-width="1.5" opacity="0.5"/>
        <circle cx="${sx(sf)}" cy="${sy(cur.total)}" r="6" fill="var(--tax-primary)" stroke="#fff" stroke-width="2"/>
        <circle cx="${sx(bestSf)}" cy="${sy(bestTot)}" r="5" fill="#10b981"/>
        <text x="${sx(bestSf)}" y="${sy(bestTot)-10}" text-anchor="middle" font-size="11" font-weight="800" fill="#10b981">最优 SF≈${bestSf.toFixed(1)}</text>
        <text x="240" y="266" text-anchor="middle" font-size="12" fill="var(--tax-muted)">安全系数 SF (1.0× → 6.0×)</text>
      `;

      touched++;
      if (touched > 2) {
        document.getElementById("ahaBox").innerHTML = `💡 <strong>顿悟时刻（Aha! Moment）：</strong>在「${wLabels[w-1]}」场景下，经济最优安全系数约在 <strong>${bestSf.toFixed(1)}×</strong>！过低会因失效赔穿底，过高则会把大量预算和运力浪费在毫无必要的“过设计”上。`;
        if (window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
  </script>
</body>
</html>
