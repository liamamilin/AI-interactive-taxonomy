<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：桥梁受力 X 光透视 · 受拉 vs 受压</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .stage { background: #0f172a; border: 1.5px solid var(--tax-border); border-radius: 16px; padding: 12px; margin-top: 12px; }
    svg { width: 100%; height: 210px; display: block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🌉 桥梁受力 X 光透视：卡车压在桥中央，哪根钢梁在被“挤短”、哪根在被“扯长”？</h1>
        <p>向右增加卡车载重吨位，开启 <strong>X 光力学热力透视</strong>：<strong style="color:#38bdf8">蓝色 = 受压（被挤短）</strong>，<strong style="color:#f87171">红色 = 受拉（被扯长）</strong>！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <label style="font-weight:850;font-size:14.5px;">🚚 桥面卡车载重：<span id="wVal" style="color:var(--tax-primary)">30</span> 吨</label>
      <input id="wSl" type="range" min="5" max="80" value="30" style="width:100%;margin-top:8px;" />
      <div class="stage"><svg viewBox="0 0 540 200" id="brSvg"></svg></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let drags = 0;
    function render() {
      const w = parseInt(document.getElementById("wSl").value, 10);
      document.getElementById("wVal").textContent = w;
      const thick = 3 + (w / 80) * 6;
      const sag = (w / 80) * 8;

      let s = "";
      // Piers
      s += `<rect x="45" y="145" width="24" height="45" fill="#475569"/><rect x="471" y="145" width="24" height="45" fill="#475569"/>`;
      // Top chord (COMPRESSION - blue)
      s += `<line x1="150" y1="${65 + sag}" x2="390" y2="${65 + sag}" stroke="#38bdf8" stroke-width="${thick.toFixed(1)}" stroke-linecap="round"/>`;
      // Side diagonals (COMPRESSION - blue)
      s += `<line x1="60" y1="145" x2="150" y2="${65 + sag}" stroke="#38bdf8" stroke-width="${thick.toFixed(1)}" stroke-linecap="round"/>`;
      s += `<line x1="480" y1="145" x2="390" y2="${65 + sag}" stroke="#38bdf8" stroke-width="${thick.toFixed(1)}" stroke-linecap="round"/>`;
      // Inner diagonals (TENSION - red)
      s += `<line x1="150" y1="${65 + sag}" x2="270" y2="${145 + sag}" stroke="#f87171" stroke-width="${(thick*0.85).toFixed(1)}" stroke-linecap="round"/>`;
      s += `<line x1="390" y1="${65 + sag}" x2="270" y2="${145 + sag}" stroke="#f87171" stroke-width="${(thick*0.85).toFixed(1)}" stroke-linecap="round"/>`;
      // Bottom deck (TENSION - red)
      s += `<line x1="60" y1="145" x2="270" y2="${145 + sag}" stroke="#ef4444" stroke-width="${thick.toFixed(1)}" stroke-linecap="round"/>`;
      s += `<line x1="270" y1="${145 + sag}" x2="480" y2="145" stroke="#ef4444" stroke-width="${thick.toFixed(1)}" stroke-linecap="round"/>`;

      // Truck
      s += `<text x="270" y="${132 + sag}" text-anchor="middle" font-size="28">🚚</text>`;
      s += `<text x="270" y="24" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="800">🔵 上弦杆受压（挤短 ${Math.round(w*1.6)}吨力） · 🔴 下弦桥面受拉（扯长 ${Math.round(w*1.4)}吨力）</text>`;
      document.getElementById("brSvg").innerHTML = s;

      document.getElementById("ahaBox").innerHTML = "💡 <strong>上压下拉的永恒规律：</strong>任何简支梁桥在重车下微微下弯时，<strong>顶部被挤紧（受压，蓝色）、底部被绷紧（受拉，红色）</strong>！桁架桥把所有弯矩转化成杆件的纯拉力与纯压力，用最轻的钢材跨过最宽的江河！";
    }
    document.getElementById("wSl").addEventListener("input", () => {
      drags++;
      render();
      if (drags >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    });
    render();
  </script>
</body>
</html>
