<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：预防性维护成本平衡器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .m-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
    .m-box { background: var(--tax-surface-2); border: 1.5px solid var(--tax-border); border-radius: 12px; padding: 12px; text-align: center; }
    .m-val { font-size: 20px; font-weight: 900; color: var(--tax-primary); }
    .m-lbl { font-size: 12px; color: var(--tax-muted); margin-top: 4px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🔧 预防性维护成本平衡器：换太勤亏钱，换太晚停产！</h1>
        <p>工厂核心轴承平均磨耗寿命约 <strong>600 小时</strong>：计划内预防更换只需 <strong>$300</strong>，但如果在生产中突然抱死停线，抢修+停产损失高达 <strong>$4,000</strong>！拖动保养周期找最低总成本！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <label style="font-weight:850;font-size:14.5px;">🗓️ 定期预防性更换间隔：<span id="intVal" style="color:var(--tax-primary)">300</span> 小时</label>
      <input id="intSl" type="range" min="100" max="900" step="50" value="300" style="width:100%;margin-top:8px;" />

      <div class="m-grid">
        <div class="m-box"><div class="m-val" id="pmCost">$1,000</div><div class="m-lbl">每千小时计划保养费</div></div>
        <div class="m-box"><div class="m-val" id="failCost">$120</div><div class="m-lbl">每千小时突发停机损失</div></div>
        <div class="m-box"><div class="m-val" id="totCost">$1,120</div><div class="m-lbl">每千小时综合总成本</div></div>
      </div>

      <svg id="uCurve" viewBox="0 0 560 220" style="width:100%;height:auto;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    let moves = 0;
    function calc(T) {
      const pFail = 1 - Math.exp(-Math.pow(T / 620, 4.2));
      const cycles = 1000 / T;
      const pm = cycles * (1 - pFail) * 300;
      const fail = cycles * pFail * 4000;
      return { pm, fail, tot: pm + fail };
    }

    function render() {
      const T = parseInt(document.getElementById("intSl").value, 10);
      document.getElementById("intVal").textContent = T;
      const cur = calc(T);

      document.getElementById("pmCost").textContent = "$" + Math.round(cur.pm).toLocaleString();
      document.getElementById("failCost").textContent = "$" + Math.round(cur.fail).toLocaleString();
      document.getElementById("totCost").textContent = "$" + Math.round(cur.tot).toLocaleString();
      document.getElementById("totCost").style.color = cur.tot < 1150 ? "#10b981" : cur.tot < 2000 ? "#f59e0b" : "#ef4444";

      const sx = t => 48 + ((t - 100) / 800) * 490;
      const sy = v => 188 - (Math.min(4800, v) / 4800) * 160;
      let pPm = [], pFail = [], pTot = [], bestT = 100, bestTot = 1e9;
      for (let t = 100; t <= 900; t += 20) {
        const c = calc(t);
        if (c.tot < bestTot) { bestTot = c.tot; bestT = t; }
        pPm.push(`${t===100?'M':'L'}${sx(t).toFixed(1)},${sy(c.pm).toFixed(1)}`);
        pFail.push(`${t===100?'M':'L'}${sx(t).toFixed(1)},${sy(c.fail).toFixed(1)}`);
        pTot.push(`${t===100?'M':'L'}${sx(t).toFixed(1)},${sy(c.tot).toFixed(1)}`);
      }

      document.getElementById("uCurve").innerHTML = `
        <line x1="48" y1="188" x2="538" y2="188" stroke="var(--tax-border)"/>
        <line x1="48" y1="28" x2="48" y2="188" stroke="var(--tax-border)"/>
        <path d="${pPm.join(' ')}" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
        <path d="${pFail.join(' ')}" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
        <path d="${pTot.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3"/>
        <circle cx="${sx(bestT)}" cy="${sy(bestTot)}" r="5" fill="#10b981"/>
        <text x="${sx(bestT)}" y="${sy(bestTot)-10}" text-anchor="middle" font-size="11" font-weight="800" fill="#10b981">谷底 ≈${bestT}h</text>
        <line x1="${sx(T)}" y1="28" x2="${sx(T)}" y2="188" stroke="var(--tax-primary)" stroke-width="1.5" opacity="0.5"/>
        <circle cx="${sx(T)}" cy="${sy(cur.tot)}" r="6" fill="var(--tax-primary)" stroke="#fff" stroke-width="2"/>
        <text x="293" y="208" text-anchor="middle" font-size="11.5" fill="var(--tax-muted)">保养周期（100h → 900h）</text>
      `;

      if (T >= 300 && T <= 400) {
        document.getElementById("ahaBox").innerHTML = `💡 <strong>🎉 找到 U 型成本谷底（约 350 小时）！</strong>每千小时综合成本压低到仅 <strong>$${Math.round(cur.tot)}</strong>——既没把还能用的轴承过早扔掉，又稳稳躲开了 600 小时后的磨耗崩盘！`;
      } else if (T < 300) {
        document.getElementById("ahaBox").innerHTML = "💡 <strong>过度保养陷阱（Over-maintenance）：</strong>虽然突发停机几乎为零，但你把大量完好无损的轴承提前拆掉扔了，光保养费就把利润吃光了！试着往右拉一点。";
      } else {
        document.getElementById("ahaBox").innerHTML = "💡 <strong>拖延保养的灾难（Run-to-Failure）：</strong>虽然省了一点计划换件费，但轴承进入浴盆右坡后频频在生产中抱死，单次 $4,000 的停产抢修费瞬间让总成本爆表！";
      }
    }

    document.getElementById("intSl").addEventListener("input", () => {
      moves++;
      render();
      if (moves >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    });
    render();
  </script>
</body>
</html>
