<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ 新奇效应衰退测试：改版头 3 天暴涨是真的有效吗？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>✨ 新奇效应衰退测试：改版头 3 天暴涨是真的有效吗？</h1><p>误区：新功能上线头三天点击率暴涨 40%，赶紧发全员喜报！真相：老用户只是因为“页面上突然多了新东西”好奇点两下，两周后新鲜感一过立刻回落！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>观察实验天数</span><span id="vD">第 3 天</span></label><input id="d" type="range" min="1" max="21" step="1" value="3" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>上线初期新奇刺激幅度</span><span id="vN">+6.0%</span></label><input id="nov" type="range" min="2" max="10" step="1" value="6" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">老版本稳态点击率</div><div class="k-val">10.0%</div></div>
      <div class="kpi"><div class="k-lbl">新改版当天点击率</div><div class="k-val" id="kNew" style="color:#2563eb;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const d=+document.getElementById('d').value, nov=+document.getElementById('nov').value;
      document.getElementById('vD').textContent='第 '+d+' 天';
      document.getElementById('vN').textContent='+'+nov.toFixed(1)+'%';
      const valAt=t=>10 + nov*Math.exp(-t/4.5);
      const pts=[];
      for(let t=1;t<=21;t++){
        pts.push(`${t===1?'M':'L'}${(55+((t-1)/20)*490).toFixed(1)},${(165-(valAt(t)/22)*135).toFixed(1)}`);
      }
      const cur=valAt(d);
      document.getElementById('svg').innerHTML=`
        <line x1="55" y1="${(165-(10/22)*135).toFixed(1)}" x2="545" y2="${(165-(10/22)*135).toFixed(1)}" stroke="#94a3b8" stroke-dasharray="4,4"/>
        <path d="${pts.join(' ')}" fill="none" stroke="#2563eb" stroke-width="3.5"/>
        <circle cx="${(55+((d-1)/20)*490).toFixed(1)}" cy="${(165-(cur/22)*135).toFixed(1)}" r="6" fill="#f59e0b"/>
      `;
      document.getElementById('kNew').textContent=cur.toFixed(1)+'%';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>第 ${d} 天表面还有 ${(cur-10).toFixed(1)}% 伪涨幅，但跑满 21 天后新鲜感耗尽就会打回 10% 原形！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
