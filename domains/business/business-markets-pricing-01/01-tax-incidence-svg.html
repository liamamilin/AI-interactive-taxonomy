<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧾 税负转嫁分配器：谁更刚需谁买单（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧾 税负转嫁分配器：谁更刚需谁买单（SVG）</h1><p>误区：对商家或房东加税 10 元，商家就得自己少赚 10 元。真相：谁离开市场越难（弹性越低），谁就得承担绝大部分税收！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
       <button class="btn active" onclick="setEl(0.2,this)">胰岛素/香烟（极度刚需）</button>
       <button class="btn" onclick="setEl(1.0,this)">普通日用品（弹性均衡）</button>
       <button class="btn" onclick="setEl(3.5,this)">可乐/网红奶茶（极易替代）</button>
     </div>
     <div class="ctrl-grid">
       <div class="ctrl-box"><label><span>买家需求弹性 |Ed|</span><span id="vEd">0.2</span></label><input id="ed" type="range" min="0.1" max="4" step="0.1" value="0.2" oninput="draw(true)"></div>
     </div>
     <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
     <div class="kpi-row">
       <div class="kpi"><div class="k-lbl">每件加税总额</div><div class="k-val">10.0 元</div></div>
       <div class="kpi"><div class="k-lbl">消费者涨价承担</div><div class="k-val" id="kBuy" style="color:#ef4444;">—</div></div>
       <div class="kpi"><div class="k-lbl">商家降利承担</div><div class="k-val" id="kSel" style="color:#2563eb;">—</div></div>
     </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function setEl(v,btn){
       document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
       if(btn) btn.classList.add('active');
       document.getElementById('ed').value=v;
       draw(true);
     }
     function draw(mark){
       const ed=+document.getElementById('ed').value;
       const es=1.0;
       document.getElementById('vEd').textContent=ed.toFixed(1);
       const buyerShare=es/(es+ed);
       const bTax=10*buyerShare, sTax=10-bTax;
       document.getElementById('svg').innerHTML=`
         <rect x="60" y="55" width="${(buyerShare*480).toFixed(1)}" height="36" rx="5" fill="#ef4444"/>
         <rect x="${(60+buyerShare*480).toFixed(1)}" y="55" width="${((1-buyerShare)*480).toFixed(1)}" height="36" rx="5" fill="#2563eb"/>
         <text x="${(60+buyerShare*240).toFixed(1)}" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">买家付 ${bTax.toFixed(1)}元</text>
         <text x="${(60+buyerShare*480+(1-buyerShare)*240).toFixed(1)}" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">商家付 ${sTax.toFixed(1)}元</text>
         <text x="300" y="130" text-anchor="middle" font-size="12" fill="var(--tax-muted)">税收由弹性更小（更没得选）的一方承担大头</text>
       `;
       document.getElementById('kBuy').textContent=bTax.toFixed(1)+' 元 ('+(buyerShare*100).toFixed(0)+'%)';
       document.getElementById('kSel').textContent=sTax.toFixed(1)+' 元 ('+((1-buyerShare)*100).toFixed(0)+'%)';
       document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>当买家极其刚需（Ed=${ed.toFixed(1)}）时，哪怕税单名义上是向商家征收，最终也有 <strong>${(buyerShare*100).toFixed(0)}%</strong> 通过涨价转嫁到买家头上！`;
       if(mark && window.ToySDK) window.ToySDK.markCompleted();
     }
     draw(false);</script>
</body>
</html>
