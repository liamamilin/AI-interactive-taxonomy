<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📈 提价能多赚钱吗？弹性与总营收抛物线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📈 提价能多赚钱吗？弹性与总营收抛物线</h1><p>误区：只要东西涨价，营业额肯定会变多。真相：当商品有很多替代品时，涨价 10% 可能导致销量暴跌 30%，总营收反而缩水！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>当前商品售价 P</span><span id="vP">50 元</span></label><input id="p" type="range" min="10" max="95" step="5" value="50" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>替代品竞争烈度（弹性斜率）</span><span id="vSl">1.0x</span></label><input id="sl" type="range" min="0.5" max="1.5" step="0.1" value="1.0" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">预期销量 Q</div><div class="k-val" id="kQ">—</div></div>
      <div class="kpi"><div class="k-lbl">总营收 (P×Q)</div><div class="k-val" id="kRev" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">当前价格弹性区间</div><div class="k-val" id="kZone">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const p=+document.getElementById('p').value, sl=+document.getElementById('sl').value;
      document.getElementById('vP').textContent=p+' 元';
      document.getElementById('vSl').textContent=sl.toFixed(1)+'x';
      const q=Math.max(0, 100 - sl*p), rev=p*q;
      const optP=100/(2*sl), maxRev=optP*(100-sl*optP);
      const pts=[];
      for(let x0=10;x0<=95;x0+=5){
        const r0=x0*Math.max(0,100-sl*x0);
        pts.push(`${x0===10?'M':'L'}${(55+((x0-10)/85)*490).toFixed(1)},${(175-(r0/5000)*140).toFixed(1)}`);
      }
      const cx=55+((p-10)/85)*490, cy=175-(rev/5000)*140;
      document.getElementById('svg').innerHTML=`
        <path d="${pts.join(' ')}" fill="none" stroke="#2563eb" stroke-width="3.5"/>
        <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="#10b981"/>
        <text x="300" y="190" text-anchor="middle" font-size="11" fill="var(--tax-muted)">当前弹性下最优定价：${optP.toFixed(0)} 元（最高营收 ${maxRev.toFixed(0)} 元）</text>
      `;
      document.getElementById('kQ').textContent=q.toFixed(0)+' 件';
      document.getElementById('kRev').textContent=rev.toFixed(0)+' 元';
      document.getElementById('kZone').textContent=p<optP-3?'缺乏弹性（提价增收）':p<=optP+3?'最优营收顶点！':'富有弹性（降价增收）';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>竞争越激烈（弹性 ${sl.toFixed(1)}x），最优定价越低（仅 <strong>${optP.toFixed(0)} 元</strong>）！想卖高价必须先降低商品的可替代性。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
