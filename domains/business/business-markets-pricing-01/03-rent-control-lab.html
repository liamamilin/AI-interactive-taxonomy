<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏚️ 限价令反作用实验：强行压低房租会发生什么？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏚️ 限价令反作用实验：强行压低房租会发生什么？</h1><p>误区：政府强行规定房租不准超过 2000 元，穷人就能住上便宜好房。真相：强行压价会让房东把房子撤出出租市场，房源越少排队越长！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>行政最高限价 (均衡价=4000)</span><span id="vCap">2500 元</span></label><input id="cap" type="range" min="1500" max="4500" step="250" value="2500" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>房东退租转卖灵敏度（供给弹性）</span><span id="vEs">1.0</span></label><input id="es" type="range" min="0.4" max="1.8" step="0.2" value="1.0" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">愿意出租房源</div><div class="k-val" id="kSup" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">排队求租人数</div><div class="k-val" id="kDem" style="color:#f59e0b;">—</div></div>
      <div class="kpi"><div class="k-lbl">租房短缺缺口</div><div class="k-val" id="kGap" style="color:#ef4444;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const cap=+document.getElementById('cap').value, es=+document.getElementById('es').value;
      document.getElementById('vCap').textContent=cap+' 元';
      document.getElementById('vEs').textContent=es.toFixed(1);
      const sup=Math.max(10, Math.min(120, Math.round(100*Math.pow(cap/4000, es))));
      const dem=Math.round(100*(4000/cap));
      const gap=Math.max(0, dem-sup);
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">市场供给房源</text>
        <rect x="140" y="36" width="${(sup*2.2).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
        <text x="${(148+sup*2.2).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${sup} 套</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">求租排队需求</text>
        <rect x="140" y="96" width="${Math.min(380,dem*2.2).toFixed(1)}" height="26" rx="5" fill="#ef4444"/>
        <text x="${(148+Math.min(380,dem*2.2)).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="#ef4444">${dem} 人</text>
      `;
      document.getElementById('kSup').textContent=sup+' 套';
      document.getElementById('kDem').textContent=dem+' 人';
      document.getElementById('kGap').textContent=gap>0?gap+' 人租不到':'供需平衡';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>供给越有弹性（房东越容易撤房不租），限价造成的房源萎缩（${sup} 套）和排队缺口（<strong>${gap} 人</strong>）就越灾难性！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
