<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⏳ 获客回本周期现金流沙盘：为什么高速增长也会缺钱倒闭？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⏳ 获客回本周期现金流沙盘：为什么高速增长也会缺钱倒闭？</h1><p>误区：只要 LTV 远大于 CAC（比如 4:1），拼命投广告增长就绝对不会缺钱。真相：广告费今天就要付出去，订阅费却要分 18 个月才收回来——高速增长会在前期挖出巨大的现金流深坑！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
       <div class="ctrl-box"><label><span>每月新增付费用户数</span><span id="vN">100 人</span></label><input id="n" type="range" min="20" max="200" step="20" value="100" oninput="draw(true)"></div>
       <div class="ctrl-box"><label><span>单客 CAC 回本周期</span><span id="vP">12 个月</span></label><input id="pay" type="range" min="3" max="18" step="3" value="12" oninput="draw(true)"></div>
     </div>
     <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
     <div class="kpi-row">
       <div class="kpi"><div class="k-lbl">现金流最低谷（需垫资）</div><div class="k-val" id="kDip" style="color:#ef4444;">—</div></div>
       <div class="kpi"><div class="k-lbl">第 24 个月账面现金</div><div class="k-val" id="kEnd" style="color:#10b981;">—</div></div>
     </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
       const n=+document.getElementById('n').value, pay=+document.getElementById('pay').value;
       document.getElementById('vN').textContent=n+' 人/月';
       document.getElementById('vP').textContent=pay+' 个月';
       const cac=600, mRev=cac/pay;
       let cash=0, minC=0;
       const arr=[0];
       for(let m=1;m<=24;m++){
         cash -= n*cac;
         cash += (m*n)*mRev;
         minC=Math.min(minC,cash);
         arr.push(cash/10000);
       }
       const maxA=Math.max(10, ...arr), minA=Math.min(-10, ...arr);
       const rng=maxA-minA;
       const x=i=>48+(i/24)*520, y=v=>170-((v-minA)/rng)*140;
       const p=arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
       document.getElementById('svg').innerHTML=`
         <line x1="48" y1="${y(0).toFixed(1)}" x2="568" y2="${y(0).toFixed(1)}" stroke="#ef4444" stroke-dasharray="4,4"/>
         <path d="${p}" fill="none" stroke="#2563eb" stroke-width="3"/>
         <text x="565" y="${y(0)-5}" text-anchor="end" font-size="10.5" fill="#ef4444">现金零线（跌破即需融资垫资）</text>
       `;
       document.getElementById('kDip').textContent=(minC/10000).toFixed(1)+' 万元';
       document.getElementById('kEnd').textContent=arr[24].toFixed(1)+' 万元';
       document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>哪怕模型长期极度赚钱，在 <strong>${pay} 个月</strong> 回本周期下月增 ${n} 客依然要先垫付 <strong>${Math.abs(minC/10000).toFixed(1)} 万</strong> 现金流深坑！无数好产品都是死在回本前的资金链断裂上。`;
       if(mark && window.ToySDK) window.ToySDK.markCompleted();
     }
     draw(false);</script>
</body>
</html>
