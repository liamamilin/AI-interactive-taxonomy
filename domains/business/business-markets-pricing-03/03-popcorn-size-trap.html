<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍿 电影院爆米花大中小杯心理战</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🍿 电影院爆米花大中小杯心理战</h1><p>误区：大杯比中杯大一倍却只贵 3 块钱，买大杯的我太机智了！真相：影院就是故意把中杯定价推高来逼你升级买大杯，因为玉米成本不到 2 毛钱！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>中杯定价（小杯15元）</span><span id="vMid">28 元</span></label><input id="m" type="range" min="18" max="29" step="1" value="28" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>大杯定价（锚点目标）</span><span id="vBig">30 元</span></label><input id="big" type="range" min="30" max="40" step="2" value="30" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">主动升级买大杯比例</div><div class="k-val" id="kBig" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">影院单客平均毛利</div><div class="k-val" id="kProf" style="color:#2563eb;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const m=+document.getElementById('m').value, b=+document.getElementById('big').value;
      document.getElementById('vMid').textContent=m+' 元';
      document.getElementById('vBig').textContent=b+' 元';
      const gap=Math.max(1, b-m);
      const bigPct=Math.min(88, Math.max(15, Math.round(92 - gap*6)));
      const avg=(bigPct*(b-2) + (100-bigPct)*(m-1.5))/100;
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">选大杯(${b}元)比例</text>
        <rect x="160" y="36" width="${(bigPct*3.6).toFixed(1)}" height="26" rx="5" fill="#10b981"/>
        <text x="${(168+bigPct*3.6).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#10b981">${bigPct}%</text>
        <text x="20" y="115" font-size="12" fill="var(--tax-muted)">中杯 ¥${m} vs 大杯 ¥${b}（仅差 ¥${b-m}，分量翻倍，大杯玉米成本仅 ¥2）</text>
      `;
      document.getElementById('kBig').textContent=bigPct+'%';
      document.getElementById('kProf').textContent='¥'+avg.toFixed(1);
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>中杯与大杯只差 <strong>¥${b-m}</strong> 时，高达 <strong>${bigPct}%</strong> 的顾客会自以为聪明地升级大杯，影院单客毛利直冲 ¥${avg.toFixed(1)}！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
