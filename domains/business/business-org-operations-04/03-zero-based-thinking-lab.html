<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔄 零基思维测试台：如果今天重来，你还会投它吗？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔄 零基思维测试台：如果今天重来，你还会投它吗？</h1><p>误区：现有业务只要没破产，就顺着惯性继续做下去。真相：做一次残酷的“零基思维”发问——如果不肯今天花现钱重新买它，今天就该关停或卖掉！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>老业务未来年化回报预期</span><span id="vOld">4%</span></label><input id="oldR" type="range" min="-5" max="15" step="1" value="4" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>替代新项目年化回报预期</span><span id="vNew">18%</span></label><input id="newR" type="range" min="5" max="30" step="1" value="18" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">3 年机会成本差距</div><div class="k-val" id="kGap" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">零基思维动作</div><div class="k-val" id="kAct">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const o=+document.getElementById('oldR').value/100, n=+document.getElementById('newR').value/100;
      document.getElementById('vOld').textContent=(o*100).toFixed(0)+'%';
      document.getElementById('vNew').textContent=(n*100).toFixed(0)+'%';
      const vOld=100*Math.pow(1+o,3), vNew=100*Math.pow(1+n,3);
      const stop=vNew>vOld;
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">留守老业务(3年后)</text>
        <rect x="160" y="36" width="${(vOld/250*350).toFixed(1)}" height="26" rx="5" fill="${stop?'#94a3b8':'#10b981'}"/>
        <text x="${(168+vOld/250*350).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="var(--tax-text)">${vOld.toFixed(0)} 万</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">转投新机会(3年后)</text>
        <rect x="160" y="96" width="${(vNew/250*350).toFixed(1)}" height="26" rx="5" fill="#10b981"/>
        <text x="${(168+vNew/250*350).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="#10b981">${vNew.toFixed(0)} 万</text>
      `;
      document.getElementById('kGap').textContent=Math.abs(vNew-vOld).toFixed(0)+' 万';
      document.getElementById('kAct').textContent=stop?'✂️ 立刻止损切换新赛道':'继续持有老业务';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>“今天不卖出，就等于今天按市价重新买入它！”零基思维帮你省下 <strong>${Math.abs(vNew-vOld).toFixed(0)} 万</strong> 机会成本。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
