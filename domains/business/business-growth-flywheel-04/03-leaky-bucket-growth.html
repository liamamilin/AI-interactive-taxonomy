<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪣 漏水桶假增长警报：拉新越快死得越惨？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🪣 漏水桶假增长警报：拉新越快死得越惨？</h1><p>误区：每个月都稳稳新增 1000 个新用户，明年用户数肯定翻倍。真相：月流失率决定了水桶的上限，用户盘子到达平衡点就会彻底卡死不动！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>月流失率（水桶漏水速度）</span><span id="vCh">25%</span></label><input id="ch" type="range" min="5" max="40" step="5" value="25" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>每月恒定拉新人数</span><span id="vIn">1,000 人</span></label><input id="inU" type="range" min="500" max="3000" step="500" value="1000" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">12 个月后活跃人数</div><div class="k-val" id="kM12" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">理论活跃人数天花板</div><div class="k-val" id="kCap" style="color:#2563eb;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const ch=+document.getElementById('ch').value/100, inU=+document.getElementById('inU').value;
      document.getElementById('vCh').textContent=(ch*100).toFixed(0)+'%';
      document.getElementById('vIn').textContent=inU.toLocaleString()+' 人';
      const cap=inU/ch;
      let u=0; const arr=[0];
      for(let m=1;m<=12;m++){ u=u*(1-ch)+inU; arr.push(u); }
      const maxV=Math.max(8000, cap);
      const x=i=>48+(i/12)*520, y=v=>168-(v/maxV)*138;
      const p=arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
      document.getElementById('svg').innerHTML=`
        <line x1="48" y1="${y(cap).toFixed(1)}" x2="568" y2="${y(cap).toFixed(1)}" stroke="#ef4444" stroke-dasharray="4,4"/>
        <text x="565" y="${y(cap)-5}" text-anchor="end" font-size="11" fill="#ef4444">增长天花板 ${cap.toFixed(0)} 人</text>
        <path d="${p}" fill="none" stroke="#2563eb" stroke-width="3.5"/>
      `;
      document.getElementById('kM12').textContent=Math.round(arr[12]).toLocaleString()+' 人';
      document.getElementById('kCap').textContent=Math.round(cap).toLocaleString()+' 人';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>平衡公式：<strong>用户上限 = 月拉新 ÷ 月流失率</strong>！不把流失率降下来，只靠猛买量很快就会撞上 <strong>${Math.round(cap).toLocaleString()} 人</strong> 天花板！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
