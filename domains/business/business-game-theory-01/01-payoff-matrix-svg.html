<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧩 囚徒困境收益矩阵透视镜（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧩 囚徒困境收益矩阵透视镜（SVG）</h1><p>误区：只要大家都是聪明人，就一定能达成双赢合作。真相：单次博弈中无论对方怎么选，背叛永远让你多赚——于是两个聪明人一起掉进双输！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
       <button class="btn active" onclick="pick(0,0,this)">合作 + 合作 (3, 3)</button>
       <button class="btn" onclick="pick(0,1,this)">你合作 + 对方背叛 (0, 5)</button>
       <button class="btn" onclick="pick(1,0,this)">你背叛 + 对方合作 (5, 0)</button>
       <button class="btn" onclick="pick(1,1,this)">背叛 + 背叛 (1, 1)</button>
     </div>
     <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
     <div class="kpi-row">
       <div class="kpi"><div class="k-lbl">你的收益</div><div class="k-val" id="kMe" style="color:#2563eb;">—</div></div>
       <div class="kpi"><div class="k-lbl">对手收益</div><div class="k-val" id="kOp" style="color:#10b981;">—</div></div>
       <div class="kpi"><div class="k-lbl">社会总福利</div><div class="k-val" id="kTot">—</div></div>
     </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>const M=[[[3,3],[0,5]],[[5,0],[1,1]]];
     function pick(a,b,btn){
       document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
       if(btn) btn.classList.add('active');
       const [me,op]=M[a][b];
       let cells='';
       const lbls=[['合作+合作','合作+背叛'],['背叛+合作','背叛+背叛']];
       for(let i=0;i<2;i++) for(let j=0;j<2;j++){
         const act=(i===a&&j===b);
         const [x0,y0]=M[i][j];
         const rx=120+j*185, ry=24+i*76;
         cells+=`<rect x="${rx}" y="${ry}" width="170" height="64" rx="10" fill="${act?'#2563eb':'var(--tax-border)'}" opacity="${act?0.22:0.3}" stroke="${act?'#2563eb':'var(--tax-border)'}" stroke-width="${act?2.5:1}"/>
         <text x="${rx+85}" y="${ry+25}" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-text)">${lbls[i][j]}</text>
         <text x="${rx+85}" y="${ry+48}" text-anchor="middle" font-size="14" font-weight="850" fill="${act?'#2563eb':'var(--tax-muted)'}">(${x0}, ${y0})</text>`;
       }
       document.getElementById('svg').innerHTML=cells;
       document.getElementById('kMe').textContent=me+' 分';
       document.getElementById('kOp').textContent=op+' 分';
       document.getElementById('kTot').textContent=(me+op)+' 分';
       document.getElementById('ahaBox').innerHTML=a===1&&b===1
         ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>(1,1) 是唯一稳定的纳什均衡！虽然合作能拿 (3,3)=6 分，但只要单次博弈没有惩罚，背叛永远是占优策略！`
         : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>当前结果是 (${me}, ${op})。试试从对方视角思考：如果对方选背叛，你合作只能拿 0 分，逼着你也只能选背叛！`;
       if(window.ToySDK) window.ToySDK.markCompleted();
     }
     pick(0,0,document.querySelector('.btn.active'));</script>
</body>
</html>
