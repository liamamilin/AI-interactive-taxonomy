<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏮 扎堆红利测试：为什么汽配城和美食街都扎堆开？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏮 扎堆红利测试：为什么汽配城和美食街都扎堆开？</h1><p>误区：开店一定要避开所有同行，去独门独院的地方。真相：同类商户扎堆能帮顾客省掉搜寻成本、吸引全城流量，单店生意反而比独门店更火！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>一条街扎堆的同行数量 N</span><span id="vN">5 家</span></label><input id="n" type="range" min="1" max="15" step="1" value="5" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>品类聚集磁吸系数</span><span id="vM">1.6x</span></label><input id="mag" type="range" min="1.0" max="2.2" step="0.2" value="1.6" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">整条街总客流</div><div class="k-val" id="kTot">—</div></div>
      <div class="kpi"><div class="k-lbl">你的单店日均客流</div><div class="k-val" id="kMe" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const n=+document.getElementById('n').value, mag=+document.getElementById('mag').value;
      document.getElementById('vN').textContent=n+' 家';
      document.getElementById('vM').textContent=mag.toFixed(1)+'x';
      const tot=Math.round(140*Math.pow(n, mag-0.3));
      const me=Math.round(tot/n);
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">商圈总吸引客流</text>
        <rect x="150" y="36" width="${Math.min(360,(tot/4000)*360).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
        <text x="${(158+Math.min(360,(tot/4000)*360)).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${tot} 人/天</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">你的单店分得客流</text>
        <rect x="150" y="96" width="${Math.min(360,(me/500)*360).toFixed(1)}" height="26" rx="5" fill="#10b981"/>
        <text x="${(158+Math.min(360,(me/500)*360)).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="#10b981">${me} 人/天</text>
      `;
      document.getElementById('kTot').textContent=tot+' 人';
      document.getElementById('kMe').textContent=me+' 人/天';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>当聚集效应强（${mag.toFixed(1)}x）时，${n} 家同行扎堆把蛋糕做大到 ${tot} 人，你的单店客流（${me} 人）依然吊打孤岛独店（140 人）！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
