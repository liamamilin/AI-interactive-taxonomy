<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📊 古德哈特 KPI 刷榜模拟器（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📊 古德哈特 KPI 刷榜模拟器（SVG）</h1><p>误区：定一个能直接量化的 KPI（比如程序员代码行数、客服挂断速度），工作效率肯定飙升。真相：当一个指标成为考核目标时，它就不再是一个好指标——员工会疯狂刷分！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
       <button class="btn active" onclick="pick(0,this)">KPI = 代码行数（程序员狂写冗余屎山）</button>
       <button class="btn" onclick="pick(1,this)">KPI = 客服平均挂断时长（秒挂客户电话）</button>
       <button class="btn" onclick="pick(2,this)">平衡指标 = 问题一次解决率 + 客户满意度</button>
     </div>
     <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
     <div class="kpi-row">
       <div class="kpi"><div class="k-lbl">考核表面 KPI 得分</div><div class="k-val" id="kKpi" style="color:#10b981;">—</div></div>
       <div class="kpi"><div class="k-lbl">公司真实业务健康度</div><div class="k-val" id="kReal">—</div></div>
     </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>const DATA=[
       {kpi:98, real:25, col:'#ef4444', msg:'为了刷代码行数，把 10 行的函数拆成 200 行，系统 Bug 满天飞但人人都拿 S 绩效！'},
       {kpi:96, real:18, col:'#ef4444', msg:'为了缩短单通时长，客服故意在 30 秒时把复杂问题直接挂断让客户重打，表面效率翻倍，投诉率爆表！'},
       {kpi:86, real:88, col:'#10b981', msg:'用互相制约的多维指标（解决率 + 复打率 + 满意度），才真正封死了刷榜空间！'}
     ];
     function pick(i,btn){
       document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
       if(btn) btn.classList.add('active');
       const d=DATA[i];
       document.getElementById('svg').innerHTML=`
         <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">表面 KPI 漂亮度</text>
         <rect x="160" y="36" width="${(d.kpi*3.6).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
         <text x="${(168+d.kpi*3.6).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${d.kpi} 分</text>
         <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">真实业务健康度</text>
         <rect x="160" y="96" width="${(d.real*3.6).toFixed(1)}" height="26" rx="5" fill="${d.col}"/>
         <text x="${(168+d.real*3.6).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="${d.col}">${d.real} 分</text>
       `;
       document.getElementById('kKpi').textContent=d.kpi+' 分';
       document.getElementById('kReal').textContent=d.real+' 分';
       document.getElementById('kReal').style.color=d.col;
       document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>${d.msg}`;
       if(window.ToySDK) window.ToySDK.markCompleted();
     }
     pick(0,document.querySelector('.btn.active'));</script>
</body>
</html>
