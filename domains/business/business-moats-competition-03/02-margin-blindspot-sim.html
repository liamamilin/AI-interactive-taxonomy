<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🙈 毛利率盲区：为什么巨头永远懒得反击低端市场？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🙈 毛利率盲区：为什么巨头永远懒得反击低端市场？</h1><p>误区：巨头发现小公司做廉价版，马上派人抄一个低价版就能掐死它。真相：低端市场毛利率极低，会拉低巨头财报与股价，理性的高管反而主动放弃低端！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>低端廉价机毛利率</span><span id="vLm">15%</span></label><input id="lm" type="range" min="5" max="35" step="5" value="15" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>低端机蚕食自家高端机比例</span><span id="vCan">40%</span></label><input id="can" type="range" min="10" max="70" step="10" value="40" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">原高端机毛利率</div><div class="k-val" style="color:#10b981;">65%</div></div>
      <div class="kpi"><div class="k-lbl">反击后综合财报毛利率</div><div class="k-val" id="kMar" style="color:#ef4444;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const lm=+document.getElementById('lm').value, can=+document.getElementById('can').value/100;
      document.getElementById('vLm').textContent=lm+'%';
      document.getElementById('vCan').textContent=(can*100).toFixed(0)+'%';
      const mar=65*(1-can)+lm*can;
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">坚守高端财报</text>
        <rect x="150" y="36" width="292.5" height="26" rx="5" fill="#10b981"/>
        <text x="450" y="54" font-size="12" font-weight="800" fill="#10b981">65.0%</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-ink)">下场反击综合毛利</text>
        <rect x="150" y="96" width="${(mar*4.5).toFixed(1)}" height="26" rx="5" fill="#ef4444"/>
        <text x="${(158+mar*4.5).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="#ef4444">${mar.toFixed(1)}% (暴跌！)</text>
      `;
      document.getElementById('kMar').textContent=mar.toFixed(1)+'%';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>自己做低端机直接把综合毛利率从 65% 拉垮到 <strong>${mar.toFixed(1)}%</strong>，当季股价大跌！所以巨头高管理性地选择了“把低端让给创业公司”。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
