<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💎 维克里二价拍卖机：为什么只付第二名的出价才逼出真话？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>💎 维克里二价拍卖机：为什么只付第二名的出价才逼出真话？</h1><p>误区：按最高出价收钱最能帮卖家多赚钱。真相：一价拍卖逼着所有人刻意压低报价互相试探；只有“赢家付第二高价”，大家才敢老老实实报出心里真实底价！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
       <button class="btn" onclick="setMode('first',this)">一价拍卖（按自己出价付钱）</button>
       <button class="btn active" onclick="setMode('second',this)">二价拍卖（赢了只付第二名价格）</button>
     </div>
     <div class="ctrl-grid">
       <div class="ctrl-box"><label><span>你的心里真实底价=100，你的报价</span><span id="vB">100 元</span></label><input id="bid" type="range" min="60" max="120" step="5" value="100" oninput="draw(true)"></div>
     </div>
     <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
     <div class="kpi-row">
       <div class="kpi"><div class="k-lbl">对手隐藏最高出价</div><div class="k-val">85 元</div></div>
       <div class="kpi"><div class="k-lbl">你的实际成交付款</div><div class="k-val" id="kPay" style="color:#2563eb;">—</div></div>
       <div class="kpi"><div class="k-lbl">你的净赚剩余价值</div><div class="k-val" id="kSurp" style="color:#10b981;">—</div></div>
     </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>let mode='second';
     function setMode(m,btn){
       mode=m;
       document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
       if(btn) btn.classList.add('active');
       draw(true);
     }
     function draw(mark){
       const b=+document.getElementById('bid').value;
       document.getElementById('vB').textContent=b+' 元';
       const win=b>85;
       const pay=win ? (mode==='first'?b:85) : 0;
       const surp=win ? (100-pay) : 0;
       document.getElementById('svg').innerHTML=`
         <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">你的报价 vs 对手(85)</text>
         <rect x="175" y="36" width="${(b*2.6).toFixed(1)}" height="26" rx="5" fill="${win?'#10b981':'#ef4444'}"/>
         <line x1="${175+85*2.6}" y1="25" x2="${175+85*2.6}" y2="145" stroke="#f59e0b" stroke-dasharray="4,4" stroke-width="2"/>
         <text x="${175+85*2.6}" y="20" text-anchor="middle" font-size="11" fill="#f59e0b">对手出价 85</text>
         <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-ink)">实际扣除付款</text>
         <rect x="175" y="96" width="${(pay*2.6).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
         <text x="${(183+pay*2.6).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="#2563eb">${win?pay+' 元':'未中标'}</text>
       `;
       document.getElementById('kPay').textContent=win?pay+' 元':'未中标';
       document.getElementById('kSurp').textContent=win?'+'+surp+' 元':'0 元';
       document.getElementById('ahaBox').innerHTML=mode==='second'
         ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>在二价拍卖里，报高了也只付第二名的 85 元，报低了反而丢单！所以“老实报出底价 100 元”永远是你的唯一最优解（Google 广告竞价核心机制）！`
         : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>在一价拍卖里，你如果老实报 100 元，利润直接归零！这逼着大家猜对手底线、互相压价。`;
       if(mark && window.ToySDK) window.ToySDK.markCompleted();
     }
     draw(false);</script>
</body>
</html>
