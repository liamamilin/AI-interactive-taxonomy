<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>😵 赢家诅咒模拟器：出价最高者为什么反而是最冤的？（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>😵 赢家诅咒模拟器：出价最高者为什么反而是最冤的？（SVG）</h1><p>误区：拍下稀缺资源说明我们眼光最好。真相：参与竞标的人越多、估价越不准，中标者亏损得就越惨！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row"><button class="btn primary" onclick="sim(true)">🔨 重新模拟一轮竞拍</button></div>
    <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>参与竞标的对手人数 N</span><span id="vN">10 家</span></label><input id="n" type="range" min="3" max="15" step="1" value="10" oninput="sim(true)"></div>
      <div class="ctrl-box"><label><span>资产估价误差离散度 σ</span><span id="vS">25 亿</span></label><input id="sig" type="range" min="10" max="50" step="5" value="25" oninput="sim(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">资产事后真实价值</div><div class="k-val" style="color:#10b981;">100 亿</div></div>
      <div class="kpi"><div class="k-lbl">全场中标最高出价</div><div class="k-val" id="kWin" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">中标者净盈亏</div><div class="k-val" id="kPnl">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function sim(mark){
      const n=+document.getElementById('n').value, sig=+document.getElementById('sig').value;
      document.getElementById('vN').textContent=n+' 家';
      document.getElementById('vS').textContent=sig+' 亿';
      const bids=[];
      for(let i=0;i<n;i++) bids.push(Math.round(100+(Math.random()+Math.random()-1)*sig*1.6));
      bids.sort((a,b)=>a-b);
      const maxB=bids[n-1], pnl=100-maxB;
      const bw=Math.min(34, 460/n);
      const x=i=>55+i*(490/n), y=v=>165-Math.min(145,(v/165)*140);
      document.getElementById('svg').innerHTML=`
        <line x1="40" y1="${y(100).toFixed(1)}" x2="560" y2="${y(100).toFixed(1)}" stroke="#10b981" stroke-dasharray="5,4" stroke-width="2"/>
        ${bids.map((v,i)=>`<rect x="${x(i).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*0.8).toFixed(1)}" height="${(165-y(v)).toFixed(1)}" rx="3" fill="${i===n-1?'#ef4444':'#94a3b8'}" opacity="${i===n-1?0.9:0.55}"/><text x="${(x(i)+bw*0.4).toFixed(1)}" y="${(y(v)-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="750" fill="${i===n-1?'#ef4444':'var(--tax-text)'}">${v}</text>`).join('')}
      `;
      document.getElementById('kWin').textContent=maxB+' 亿';
      document.getElementById('kPnl').textContent=(pnl>=0?'+':'')+pnl+' 亿';
      document.getElementById('kPnl').style.color=pnl>=0?'#10b981':'#ef4444';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>在 ${n} 家对手、±${sig} 亿估价误差下，出价最高的中标者（<strong>${maxB} 亿</strong>）几乎注定买贵亏损 <strong>${pnl} 亿</strong>！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    sim(false);</script>
</body>
</html>
