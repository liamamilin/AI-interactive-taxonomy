<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 竞标压价修正器：对手越多，出价反而要压得越低？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📉 竞标压价修正器：对手越多，出价反而要压得越低？</h1><p>误区：竞争对手越多，我越要往高了喊价才能抢到标。真相：对手越多、市场估价噪音越大，你的防诅咒折价修正就越必须压得更狠！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>参与竞标的对手数量 N</span><span id="vN">5 家</span></label><input id="n" type="range" min="2" max="30" step="1" value="5" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>行业估值不确定性 σ</span><span id="vS">20%</span></label><input id="sig" type="range" min="5" max="40" step="5" value="20" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">你的原始估值</div><div class="k-val">100 万</div></div>
      <div class="kpi"><div class="k-lbl">防诅咒安全出价</div><div class="k-val" id="kSafe" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">必须预留的折扣空间</div><div class="k-val" id="kDisc" style="color:#f59e0b;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const n=+document.getElementById('n').value, sig=+document.getElementById('sig').value;
      document.getElementById('vN').textContent=n+' 家';
      document.getElementById('vS').textContent=sig+'%';
      const disc=Math.min(48, Math.round((sig/20)*8*Math.log(n)));
      const safe=100-disc;
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">你的原始估值</text>
        <rect x="150" y="36" width="350" height="26" rx="5" fill="#94a3b8" opacity="0.45"/>
        <text x="508" y="54" font-size="12" font-weight="750" fill="var(--tax-muted)">100 万</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">安全理性出价</text>
        <rect x="150" y="96" width="${(safe*3.5).toFixed(1)}" height="26" rx="5" fill="#10b981"/>
        <text x="${(158+safe*3.5).toFixed(1)}" y="114" font-size="12.5" font-weight="800" fill="#10b981">${safe} 万（压低 -${disc}%）</text>
      `;
      document.getElementById('kSafe').textContent=safe+' 万';
      document.getElementById('kDisc').textContent='-'+disc+'%';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>当竞标人数达到 <strong>${n} 家</strong> 且估值不确定性高达 ${sig}% 时，不主动折价 <strong>-${disc}%</strong> 就会惨遭赢家诅咒反噬！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
