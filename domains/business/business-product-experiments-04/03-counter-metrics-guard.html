<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛡️ 护栏指标防火墙：防止北极星指标被走偏刷爆</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🛡️ 护栏指标防火墙：防止北极星指标被走偏刷爆</h1><p>误区：只要盯死唯一的北极星指标猛冲，团队就不会跑偏。真相：不加护栏，团队就会用标题党和低质内容刷爆短期时长，直到用户忍无可忍卸载！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>推荐流中标题党/低质刺激占比</span><span id="vC">40%</span></label><input id="cb" type="range" min="0" max="80" step="10" value="40" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>护栏指标惩罚权重</span><span id="vG">高</span></label><input id="grd" type="range" min="0" max="1" step="1" value="1" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">短期点击时长得分</div><div class="k-val" id="kTime">—</div></div>
      <div class="kpi"><div class="k-lbl">护栏指标：长期口碑留存</div><div class="k-val" id="kHeal">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const cb=+document.getElementById('cb').value, grd=+document.getElementById('grd').value;
      document.getElementById('vC').textContent=cb+'%';
      document.getElementById('vG').textContent=grd?'严格拦截':'无护栏';
      const t=Math.round(55 + cb*0.5), h=Math.max(10, Math.round(95 - cb*(grd?0.4:1.1)));
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">北极星：停留时长</text>
        <rect x="150" y="36" width="${(t*3.6).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
        <text x="${(158+t*3.6).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${t} 分</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-ink)">护栏：长期口碑健康</text>
        <rect x="150" y="96" width="${(h*3.6).toFixed(1)}" height="26" rx="5" fill="${h>=60?'#10b981':'#ef4444'}"/>
        <text x="${(158+h*3.6).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="${h>=60?'#10b981':'#ef4444'}">${h} 分</text>
      `;
      document.getElementById('kTime').textContent=t+' 分';
      document.getElementById('kHeal').textContent=h+' 分';
      document.getElementById('kHeal').style.color=h>=60?'#10b981':'#ef4444';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>标题党占比 ${cb}% 时短期时长看似漂亮，但长期口碑暴跌到 <strong>${h} 分</strong>——必须用护栏指标刹车！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
