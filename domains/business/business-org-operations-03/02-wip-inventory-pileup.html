<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📦 在制品积压效应：上游越努力，系统越堵车？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📦 在制品积压效应：上游越努力，系统越堵车？</h1><p>误区：绝对不能让上游员工闲着，没事也要先多写代码。真相：下游处理不过来时，上游超产只会堆出巨额“在制品库存 (WIP)”，拖垮所有人！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>上游每周硬塞进来的需求数</span><span id="vIn">15 个</span></label><input id="inQ" type="range" min="5" max="20" step="1" value="15" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>下游测试消化能力</span><span id="vOut">8 个</span></label><input id="outQ" type="range" min="4" max="16" step="1" value="8" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">8 周后积压半成品 (WIP)</div><div class="k-val" id="kWip" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">新需求平均等待周期</div><div class="k-val" id="kLead">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const q=+document.getElementById('inQ').value, cap=+document.getElementById('outQ').value;
      document.getElementById('vIn').textContent=q+' 个/周';
      document.getElementById('vOut').textContent=cap+' 个/周';
      const arr=[]; let wip=0;
      for(let w=0;w<=8;w++){ arr.push(wip); wip=Math.max(0, wip + q - cap); }
      const maxV=Math.max(30, ...arr);
      const x=i=>55+i*62, y=v=>165-(v/maxV)*135;
      const p=arr.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v).toFixed(1)}`).join(' ');
      const finWip=arr[8], lead=(finWip/cap + 1);
      document.getElementById('svg').innerHTML=`
        <path d="${p}" fill="none" stroke="${finWip>0?'#ef4444':'#10b981'}" stroke-width="3.5"/>
        ${arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v).toFixed(1)}" r="4" fill="${finWip>0?'#ef4444':'#10b981'}"/><text x="${x(i)}" y="${(y(v)-8).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--tax-text)">${v}</text>`).join('')}
      `;
      document.getElementById('kWip').textContent=finWip+' 个积压';
      document.getElementById('kLead').textContent=lead.toFixed(1)+' 周';
      document.getElementById('ahaBox').innerHTML=finWip>0
        ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>上游超产导致 8 周积压 <strong>${finWip} 个半成品</strong>，所有新需求都要排 <strong>${lead.toFixed(1)} 周</strong> 才上线！限制 WIP 才是正道。`
        : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>上下游节拍匹配（≤${cap} 个/周），实现零积压快速流动！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
