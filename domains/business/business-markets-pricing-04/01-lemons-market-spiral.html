<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚗 二手车柠檬市场崩塌模拟器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🚗 二手车柠檬市场崩塌模拟器</h1><p>误区：只要买家愿意按市场平均价出钱，好车和坏车都能正常交易。真相：买家分不清好坏只肯出平均价，好车车主嫌亏纷纷退场，拉低均价引发恶性循环！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
      <button class="btn primary" onclick="nextR(true)">▶️ 推进下一轮交易</button>
      <button class="btn" onclick="resetM()">重置市场</button>
    </div>
    <div class="ctrl-grid">
      <div class="ctrl-box"><label><span>初始好车比例</span><span id="vG">60%</span></label><input id="g0" type="range" min="20" max="80" step="10" value="60" oninput="resetM(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">好车留存比例（真值10万）</div><div class="k-val" id="kGood" style="color:#10b981;">—</div></div>
      <div class="kpi"><div class="k-lbl">买家心理出价（均价）</div><div class="k-val" id="kBid" style="color:#ef4444;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>let good=60, hist=[7.6];
    function resetM(mark){
      good=+document.getElementById('g0').value;
      document.getElementById('vG').textContent=good+'%';
      hist=[(good*10+(100-good)*4)/100];
      render(mark);
    }
    function nextR(mark){
      if(hist.length>=6) return;
      good=Math.max(0, good-15);
      hist.push((good*10+(100-good)*4)/100);
      render(mark);
    }
    function render(mark){
      const bid=hist[hist.length-1];
      const x=i=>65+i*90, y=v=>165-(v/11)*135;
      const p=hist.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v).toFixed(1)}`).join(' ');
      document.getElementById('svg').innerHTML=`
        <path d="${p}" fill="none" stroke="#ef4444" stroke-width="3.5"/>
        ${hist.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v).toFixed(1)}" r="5" fill="#ef4444"/><text x="${x(i)}" y="${(y(v)-9).toFixed(1)}" text-anchor="middle" font-size="11.5" font-weight="750" fill="var(--tax-ink)">${v.toFixed(1)}万</text>`).join('')}
      `;
      document.getElementById('kGood').textContent=good+'%';
      document.getElementById('kBid').textContent=bid.toFixed(1)+' 万';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>好车留存跌到 <strong>${good}%</strong>，市场均价跌到 <strong>${bid.toFixed(1)} 万</strong>！信息不对称会让好车彻底退出市场！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    resetM(false);</script>
</body>
</html>
