<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏬 为什么越贵的品牌越爱花钱做重资产体验店？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏬 为什么越贵的品牌越爱花钱做重资产体验店？</h1><p>误区：开豪华旗舰店纯属乱花钱，不如省下来打折卖货。真相：巨额房租和品牌投入就是一种“人质抵押”——骗子绝不会花一千万装修只为骗你一次！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>品牌沉没抵押投入 (万)</span><span id="vInv">2000 万</span></label><input id="inv" type="range" min="0" max="3000" step="200" value="2000" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>预计客户复购周期 (年)</span><span id="vYr">5 年</span></label><input id="yr" type="range" min="1" max="10" step="1" value="5" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">造假跑路沉没损失</div><div class="k-val" id="kLoss" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">消费者信任溢价意愿</div><div class="k-val" id="kTrust" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const inv=+document.getElementById('inv').value, yr=+document.getElementById('yr').value;
      document.getElementById('vInv').textContent=inv+' 万';
      document.getElementById('vYr').textContent=yr+' 年';
      const trust=Math.min(96, Math.round(15 + (inv/3000)*55 + yr*2.5));
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">品牌抵押沉没成本</text>
        <rect x="160" y="36" width="${Math.max(8, inv/3000*360).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
        <text x="${(168+Math.max(8, inv/3000*360)).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${inv} 万</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-ink)">消费者信任指数</text>
        <rect x="160" y="96" width="${(trust*3.6).toFixed(1)}" height="26" rx="5" fill="${trust>=65?'#10b981':'#f59e0b'}"/>
        <text x="${(168+trust*3.6).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="${trust>=65?'#10b981':'#f59e0b'}">${trust}%</text>
      `;
      document.getElementById('kLoss').textContent=inv+' 万';
      document.getElementById('kTrust').textContent=trust+' / 100';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>投入 <strong>${inv} 万</strong> 重资产与 ${yr} 年口碑沉淀，等于向顾客交出“人质”，消费者才敢放心支付高额品牌溢价！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
