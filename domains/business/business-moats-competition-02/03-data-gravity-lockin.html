<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧲 数据引力锁定实验：为什么 10 年相册和笔记让人无法离开？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧲 数据引力锁定实验：为什么 10 年相册和笔记让人无法离开？</h1><p>误区：只要导出按钮还在，用户数据就没有被锁定。真相：当个人数据沉淀超过 5 年，产生的“迁移重力”让竞争对手必须倒贴巨额红包才撬得动！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>你在该平台沉淀数据的年数</span><span id="vY">5 年</span></label><input id="y" type="range" min="1" max="10" step="1" value="5" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>新竞品给的挖角现金补贴</span><span id="vSub">100 元</span></label><input id="sub" type="range" min="0" max="1000" step="100" value="100" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">数据迁移心理折腾成本</div><div class="k-val" id="kCost">—</div></div>
      <div class="kpi"><div class="k-lbl">用户流失概率</div><div class="k-val" id="kCh" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const y=+document.getElementById('y').value, sub=+document.getElementById('sub').value;
      document.getElementById('vY').textContent=y+' 年';
      document.getElementById('vSub').textContent=sub+' 元';
      const cost=y*y*12;
      const churn=Math.max(1, Math.min(85, Math.round(35*(sub/Math.max(50,cost)))));
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">数据重力迁移代价</text>
        <rect x="160" y="36" width="${(cost/1200*360).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
        <text x="${(168+cost/1200*360).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">折合 ${cost} 元</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">被挖角流失率</text>
        <rect x="160" y="96" width="${(churn*4).toFixed(1)}" height="26" rx="5" fill="${churn>25?'#ef4444':'#10b981'}"/>
        <text x="${(168+churn*4).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="${churn>25?'#ef4444':'#10b981'}">${churn}%</text>
      `;
      document.getElementById('kCost').textContent=cost+' 元';
      document.getElementById('kCh').textContent=churn+'% /年';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>用了 ${y} 年后数据重力高达 ${cost} 元，竞品补贴 ${sub} 元也只能撬动 ${churn}% 的用户！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
