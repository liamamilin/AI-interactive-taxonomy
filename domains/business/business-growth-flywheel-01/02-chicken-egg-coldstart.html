<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥚 双边市场冷启动沙盘：先补贴买家还是先拉商家？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🥚 双边市场冷启动沙盘：先补贴买家还是先拉商家？</h1><p>误区：先有鸡还是先有蛋的问题无解，只能两边平均烧钱。真相：应该重金补贴供应稀缺且能撬动另一边的“杠杆端”！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>供给端密度（司机/商家）</span><span id="vS">60%</span></label><input id="sup" type="range" min="10" max="100" step="10" value="60" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>买家拉新补贴力度</span><span id="vB">30%</span></label><input id="buy" type="range" min="10" max="100" step="10" value="30" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">叫车等待时间</div><div class="k-val" id="kWait">—</div></div>
      <div class="kpi"><div class="k-lbl">乘客次月自发留存率</div><div class="k-val" id="kRet" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const s=+document.getElementById('sup').value, b=+document.getElementById('buy').value;
      document.getElementById('vS').textContent=s+'%';
      document.getElementById('vB').textContent=b+'%';
      const wait=Math.round(28*Math.exp(-s/35)+2);
      const ret=Math.min(92, Math.round((s*0.75 + Math.min(s,b)*0.25)));
      const fly=s>=60 && ret>=55;
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">平台飞轮转速</text>
        <rect x="140" y="36" width="${(ret*4).toFixed(1)}" height="28" rx="6" fill="${fly?'#10b981':'#f59e0b'}"/>
        <text x="${(148+ret*4).toFixed(1)}" y="55" font-size="12" font-weight="800" fill="${fly?'#10b981':'#f59e0b'}">${fly?'🚀 突破临界点，正向自转！':'⏳ 供给不足，补贴买家也是白烧'}</text>
        <text x="20" y="115" font-size="12" fill="var(--tax-muted)">乘客平均等待 ${wait} 分钟（供给不够时，狂补贴买家只会加速差评卸载）</text>
      `;
      document.getElementById('kWait').textContent=wait+' 分钟';
      document.getElementById('kRet').textContent=ret+'%';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>试着把买家补贴拉到 100% 但供给只有 20%——留存依然惨淡！双边冷启动必须先喂饱稀缺的供给端。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
