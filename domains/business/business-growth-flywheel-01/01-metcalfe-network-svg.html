<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔗 梅特卡夫定律：节点翻倍，网络价值翻 4 倍</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔗 梅特卡夫定律：节点翻倍，网络价值翻 4 倍</h1><p>误区：用户数翻一倍，平台价值也只是翻一倍。真相：N 个人之间共有 N(N-1)/2 条连接，用户翻倍时网络价值按平方级暴涨！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>网络用户节点数 N</span><span id="vN">8 人</span></label><input id="n" type="range" min="2" max="16" step="1" value="8" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>单条连接年均商业价值</span><span id="vV">10 元</span></label><input id="val" type="range" min="5" max="50" step="5" value="10" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">潜在连接数 N(N-1)/2</div><div class="k-val" id="kE" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">网络总商业估值</div><div class="k-val" id="kTot" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const n=+document.getElementById('n').value, v=+document.getElementById('val').value;
      document.getElementById('vN').textContent=n+' 人';
      document.getElementById('vV').textContent=v+' 元';
      const pts=[];
      for(let i=0;i<n;i++){
        const a=(i/n)*Math.PI*2 - Math.PI/2;
        pts.push([300+Math.cos(a)*78, 102+Math.sin(a)*78]);
      }
      let lines='', dots='';
      for(let i=0;i<n;i++) for(let j=i+1;j<n;j++){
        lines+=`<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}" stroke="#2563eb" opacity="0.28" stroke-width="1.3"/>`;
      }
      pts.forEach(p=>dots+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="6" fill="#2563eb"/>`);
      document.getElementById('svg').innerHTML=lines+dots;
      const edges=n*(n-1)/2;
      document.getElementById('kE').textContent=edges+' 条';
      document.getElementById('kTot').textContent=(edges*v).toLocaleString()+' 元';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>${n} 个节点产生 <strong>${edges} 条</strong> 连接，总价值 <strong>${(edges*v).toLocaleString()} 元</strong>！用户规模翻倍，估值直接翻 4 倍！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
