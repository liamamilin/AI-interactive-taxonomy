<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍕 亚马逊“两块披萨团队”拆解台</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🍕 亚马逊“两块披萨团队”拆解台</h1><p>误区：把 20 个工程师全拉到一个大群里协同开发，信息最透明。真相：拆成独立的自治小团队、中间只用标准 API 接口说话，总产出直接翻倍！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>研发总人数</span><span id="vN">20 人</span></label><input id="n" type="range" min="10" max="40" step="5" value="20" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>拆分成自治小团队个数 K</span><span id="vK">4 组</span></label><input id="k" type="range" min="1" max="8" step="1" value="4" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">每组人数</div><div class="k-val" id="kSub">—</div></div>
      <div class="kpi"><div class="k-lbl">总沟通连线数</div><div class="k-val" id="kLines" style="color:#ef4444;">—</div></div>
      <div class="kpi"><div class="k-lbl">有效业务净产出</div><div class="k-val" id="kOut" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const n=+document.getElementById('n').value, k=+document.getElementById('k').value;
      document.getElementById('vN').textContent=n+' 人';
      document.getElementById('vK').textContent=k+' 组';
      const sub=n/k;
      const lines=Math.round(k*(sub*(sub-1)/2) + k*(k-1)/2);
      const out=Math.max(15, Math.min(95, Math.round(92 - lines*0.18)));
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">内部开会对齐连线</text>
        <rect x="160" y="36" width="${Math.min(360, lines*0.9).toFixed(1)}" height="26" rx="5" fill="#ef4444"/>
        <text x="${(168+Math.min(360, lines*0.9)).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#ef4444">${lines} 条线</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-ink)">实际功能交付速度</text>
        <rect x="160" y="96" width="${(out*3.6).toFixed(1)}" height="26" rx="5" fill="#10b981"/>
        <text x="${(168+out*3.6).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="#10b981">${out} 分</text>
      `;
      document.getElementById('kSub').textContent=sub.toFixed(1)+' 人/组';
      document.getElementById('kLines').textContent=lines+' 条';
      document.getElementById('kOut').textContent=out+' / 100';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>把 ${n} 人拆成 ${k} 个小队（每组 ${sub.toFixed(1)} 人），沟通连线直降到 <strong>${lines} 条</strong>，交付速度飙至 <strong>${out} 分</strong>！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
