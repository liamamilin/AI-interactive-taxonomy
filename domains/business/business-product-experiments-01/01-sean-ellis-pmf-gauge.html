<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌡️ 肖恩·埃利斯 PMF 40% 测试仪</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌡️ 肖恩·埃利斯 PMF 40% 测试仪</h1><p>误区：只要有几千个注册用户且有人夸界面好看，就算找到 PMF 了。真相：只有 ≥40% 核心用户选“没有它会非常失望”，才算真正跨过 PMF！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>“非常失望”核心用户占比</span><span id="vP">32%</span></label><input id="p" type="range" min="5" max="75" step="1" value="32" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>“有点失望”潜在转化占比</span><span id="vS">25%</span></label><input id="s" type="range" min="5" max="45" step="5" value="25" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">PMF 达标黄金线</div><div class="k-val" style="color:#10b981;">40%</div></div>
      <div class="kpi"><div class="k-lbl">优化后可达潜力</div><div class="k-val" id="kPot" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">当前产品阶段</div><div class="k-val" id="kSt">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const p=+document.getElementById('p').value, s=+document.getElementById('s').value;
      document.getElementById('vP').textContent=p+'%';
      document.getElementById('vS').textContent=s+'%';
      const pot=Math.min(85, Math.round(p + s*0.6));
      const ok=p>=40;
      document.getElementById('svg').innerHTML=`
        <rect x="60" y="55" width="480" height="32" rx="8" fill="var(--tax-border)" opacity="0.35"/>
        <rect x="60" y="55" width="${(pot/85*480).toFixed(1)}" height="32" rx="8" fill="#2563eb" opacity="0.35"/>
        <rect x="60" y="55" width="${(p/85*480).toFixed(1)}" height="32" rx="8" fill="${ok?'#10b981':'#f59e0b'}"/>
        <line x1="${60+40/85*480}" y1="40" x2="${60+40/85*480}" y2="105" stroke="#10b981" stroke-dasharray="4,4" stroke-width="2.5"/>
        <text x="${60+40/85*480}" y="32" text-anchor="middle" font-size="11.5" font-weight="800" fill="#10b981">40% PMF 生死线</text>
      `;
      document.getElementById('kPot').textContent=pot+'%';
      document.getElementById('kSt').textContent=ok?'🚀 已跨过 PMF':'🔧 专注转化“有点失望”人群';
      document.getElementById('kSt').style.color=ok?'#10b981':'#f59e0b';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>没跨过 40% 之前千万别买广告！把那 ${s}% “有点失望”的人群痛点打穿，就能把 PMF 推到 <strong>${pot}%</strong>！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
