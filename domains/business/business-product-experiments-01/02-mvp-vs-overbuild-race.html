<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚀 MVP 最小可行产品 vs 闭门憋大招竞速</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🚀 MVP 最小可行产品 vs 闭门憋大招竞速</h1><p>误区：产品不够完美不能发给用户看，先闭门研发半年再惊艳所有人。真相：缩短单次迭代周期并高频试错，才是提高命中率的唯一方法！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>单次产品迭代发布周期</span><span id="vW">2 周</span></label><input id="wk" type="range" min="1" max="24" step="1" value="2" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>单次猜中真实需求概率</span><span id="vP">15%</span></label><input id="pr" type="range" min="10" max="40" step="5" value="15" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">半年 (24周) 内试错轮次</div><div class="k-val" id="kCnt" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">至少命中 1 次真需求概率</div><div class="k-val" id="kProb" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const wk=+document.getElementById('wk').value, pr=+document.getElementById('pr').value/100;
      document.getElementById('vW').textContent=wk+' 周';
      document.getElementById('vP').textContent=(pr*100).toFixed(0)+'%';
      const cnt=Math.max(1, Math.floor(24/wk));
      const hit=(1-Math.pow(1-pr, cnt))*100;
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">半年真实试错次数</text>
        <rect x="160" y="36" width="${(cnt/24*350).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
        <text x="${(168+cnt/24*350).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${cnt} 轮</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">命中真需求概率</text>
        <rect x="160" y="96" width="${(hit*3.5).toFixed(1)}" height="26" rx="5" fill="${hit>=65?'#10b981':'#ef4444'}"/>
        <text x="${(168+hit*3.5).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="${hit>=65?'#10b981':'#ef4444'}">${hit.toFixed(1)}%</text>
      `;
      document.getElementById('kCnt').textContent=cnt+' 次';
      document.getElementById('kProb').textContent=hit.toFixed(1)+'%';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>每 ${wk} 周发一版 MVP，半年能验证 ${cnt} 轮，命中真需求概率高达 <strong>${hit.toFixed(1)}%</strong>；而闭门 24 周只试一次只有 ${(pr*100).toFixed(0)}%！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
