<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎭 伪 PMF 陷阱识别台：补贴拉来的留存算不算 PMF？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎭 伪 PMF 陷阱识别台：补贴拉来的留存算不算 PMF？</h1><p>误区：发红包活动期次日留存高达 60%，肯定找到 PMF 了！真相：一旦停发补贴，真实留存瞬间打回产品本身的自然底色！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>活动期发钱补贴力度</span><span id="vSub">50 元</span></label><input id="sub" type="range" min="0" max="100" step="10" value="50" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>产品自身真实留存力</span><span id="vNat">5%</span></label><input id="nat" type="range" min="2" max="45" step="3" value="5" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">停补贴后真实留存</div><div class="k-val" id="kRet">—</div></div>
      <div class="kpi"><div class="k-lbl">PMF 真实性诊断</div><div class="k-val" id="kDiag">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const sub=+document.getElementById('sub').value, nat=+document.getElementById('nat').value;
      document.getElementById('vSub').textContent=sub+' 元';
      document.getElementById('vNat').textContent=nat+'%';
      const fake=Math.min(85, nat + sub*0.55);
      const arr=[Math.round(fake), Math.round(fake*0.9), Math.round((fake+nat)/2), Math.round(nat*1.2), nat, nat];
      const x=i=>60+i*92, y=v=>165-(v/90)*135;
      const p=arr.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v).toFixed(1)}`).join(' ');
      const col=nat>=25?'#10b981':'#ef4444';
      document.getElementById('svg').innerHTML=`
        <path d="${p}" fill="none" stroke="${col}" stroke-width="3.5"/>
        ${arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v).toFixed(1)}" r="4.5" fill="${col}"/><text x="${x(i)}" y="${(y(v)-8).toFixed(1)}" text-anchor="middle" font-size="11" fill="var(--tax-ink)">${v}%</text>`).join('')}
      `;
      document.getElementById('kRet').textContent=nat+'%';
      document.getElementById('kDiag').textContent=nat>=25?'✅ 真刚需 PMF':'💀 停补贴即归零 (伪 PMF)';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>第 3 周停发 ${sub} 元补贴后，曲线立刻跌回自然留存 <strong>${nat}%</strong>！永远别用红包掩盖真实需求。`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
