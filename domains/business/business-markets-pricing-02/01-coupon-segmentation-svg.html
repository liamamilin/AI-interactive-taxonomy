<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✂️ 优惠券价格筛选器：如何赚两拨人的钱？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>✂️ 优惠券价格筛选器：如何赚两拨人的钱？</h1><p>误区：商家发优惠券纯粹是在做慈善回馈顾客。真相：优惠券是一道“时间门槛”，只把价格敏感的穷人筛出来打折，同时照样收高收入忙碌人群的原价！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="btn-row">
       <button class="btn" onclick="window.__userActed=true;setMode('high',this)">统一高价 35 元（穷人全不买）</button>
       <button class="btn" onclick="window.__userActed=true;setMode('low',this)">统一低价 20 元（富人白省 15 元）</button>
       <button class="btn active" onclick="window.__userActed=true;setMode('disc',this)">原价 35 元 + 麻烦满减券 20 元</button>
     </div>
     <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
     <div class="kpi-row">
       <div class="kpi"><div class="k-lbl">忙碌高薪客贡献利润</div><div class="k-val" id="kRich" style="color:#2563eb;">—</div></div>
       <div class="kpi"><div class="k-lbl">价格敏感客贡献利润</div><div class="k-val" id="kPoor" style="color:#10b981;">—</div></div>
       <div class="kpi"><div class="k-lbl">商家总利润</div><div class="k-val" id="kTot">—</div></div>
     </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function setMode(m,btn){
       document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
       if(btn) btn.classList.add('active');
       const cost=10;
       const rich = m==='low' ? 10*(20-cost) : 10*(35-cost);
       const poor = m==='high' ? 0 : 15*(20-cost);
       const tot = rich + poor;
       document.getElementById('svg').innerHTML=`
         <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-ink)">高薪忙碌群(10人)</text>
         <rect x="160" y="36" width="${(rich*1.1).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
         <text x="${(168+rich*1.1).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${rich} 元</text>
         <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-ink)">时间换折扣群(15人)</text>
         <rect x="160" y="96" width="${(poor*1.1).toFixed(1)}" height="26" rx="5" fill="#10b981"/>
         <text x="${(168+poor*1.1).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="#10b981">${poor} 元</text>
       `;
       document.getElementById('kRich').textContent=rich+' 元';
       document.getElementById('kPoor').textContent=poor+' 元';
       document.getElementById('kTot').textContent=tot+' 元';
       document.getElementById('ahaBox').innerHTML=m==='disc'
         ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>商家总利润飙到 <strong>${tot} 元</strong>！故意把优惠券设得麻烦，正是为了筛选出“嫌麻烦直接付 35 元”的高支付意愿用户！`
         : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>统一售价无论定高定低都会丢掉一大块利润（仅 ${tot} 元），只有用优惠券做价格歧视才能把两拨人的钱都赚到！`;
       if(window.__userActed && window.ToySDK) window.ToySDK.markCompleted();
     }
     setMode('disc',document.querySelector('.btn.active'));</script>
</body>
</html>
