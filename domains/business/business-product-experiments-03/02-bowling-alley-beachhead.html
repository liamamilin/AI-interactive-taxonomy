<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎳 保龄球道滩头阵地沙盘：先打穿一个细分刚需场景</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎳 保龄球道滩头阵地沙盘：先打穿一个细分刚需场景</h1><p>误区：小团队应该同时做十个行业的通用版来扩大客户面。真相：精力分散必死，把 100% 兵力砸穿“1 号细分刚需”才能撞倒后面一片！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel"><div class="ctrl-grid">
      <div class="ctrl-box"><label><span>同时撒网攻打的行业数量 K</span><span id="vK">1 个</span></label><input id="k" type="range" min="1" max="10" step="1" value="1" oninput="draw(true)"></div>
      <div class="ctrl-box"><label><span>团队总研发/销售兵力</span><span id="vP">100 人</span></label><input id="pow" type="range" min="50" max="200" step="25" value="100" oninput="draw(true)"></div>
    </div>
    <svg id="svg" class="svg-box" viewBox="0 0 600 175"></svg>
    <div class="kpi-row">
      <div class="kpi"><div class="k-lbl">单个行业分到的兵力</div><div class="k-val" id="kPer" style="color:#2563eb;">—</div></div>
      <div class="kpi"><div class="k-lbl">滩头阵地打穿概率</div><div class="k-val" id="kOk" style="color:#10b981;">—</div></div>
    </div></div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>function draw(mark){
      const k=+document.getElementById('k').value, pow=+document.getElementById('pow').value;
      document.getElementById('vK').textContent=k+' 个行业';
      document.getElementById('vP').textContent=pow+' 人';
      const per=pow/k, ok=Math.min(92, Math.round(per*0.82));
      document.getElementById('svg').innerHTML=`
        <text x="20" y="55" font-size="12" font-weight="750" fill="var(--tax-text)">单行业压强</text>
        <rect x="150" y="36" width="${Math.min(360, per*2.5).toFixed(1)}" height="26" rx="5" fill="#2563eb"/>
        <text x="${(158+Math.min(360, per*2.5)).toFixed(1)}" y="54" font-size="12" font-weight="800" fill="#2563eb">${per.toFixed(0)} 人/行业</text>
        <text x="20" y="115" font-size="12" font-weight="750" fill="var(--tax-text)">打穿口碑成功率</text>
        <rect x="150" y="96" width="${(ok*3.6).toFixed(1)}" height="26" rx="5" fill="${ok>=60?'#10b981':'#ef4444'}"/>
        <text x="${(158+ok*3.6).toFixed(1)}" y="114" font-size="12" font-weight="800" fill="${ok>=60?'#10b981':'#ef4444'}">${ok}%</text>
      `;
      document.getElementById('kPer').textContent=per.toFixed(0)+' 人';
      document.getElementById('kOk').textContent=ok+'%';
      document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>同时攻打 ${k} 个行业，每个行业只分到 ${per.toFixed(0)} 人，打穿概率只有 <strong>${ok}%</strong>！集中兵力先打穿 1 个垂直细分才是正解！`;
      if(mark && window.ToySDK) window.ToySDK.markCompleted();
    }
    draw(false);</script>
</body>
</html>
