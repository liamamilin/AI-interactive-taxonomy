<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>果酱实验与选择过载：选项太多反而买得少</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .s-card { padding: 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .big-num { font-size: 24px; font-weight: 800; margin-top: 4px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🍓 果酱实验与选择过载：转化漏斗竞速对决</h1>
      <p>哥伦比亚大学 Iyengar &amp; Lepper (2000) 在高档超市摆出两个果酱试吃摊：<strong>A 摊摆 24 种口味</strong>，<strong>B 摊只摆 6 种精选口味</strong>。各来 100 位路人——点击播放，见证“围观热闹却没人买单”的选择瘫痪大反转！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="playBtn">▶ 模拟 100 位顾客进店转化对决</button>
        <button class="toy-btn secondary" id="jumpBtn">⏩ 直接看最终成交榜</button>
        <button class="toy-btn secondary" id="resetBtn">↺ 重置</button>
      </div>

      <svg id="funnelSvg" viewBox="0 0 680 210" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="果酱实验24种与6种口味转化漏斗对决"></svg>

      <div class="cards">
        <div class="s-card">
          <div style="font-size:12px;color:var(--tax-muted);">🫙 24 种口味大摊（围观 60% · 转化仅 3%）</div>
          <div class="big-num" id="buy24" style="color:var(--tax-red);">0 人买单</div>
        </div>
        <div class="s-card">
          <div style="font-size:12px;color:var(--tax-muted);">🍓 6 种精选小摊（围观 40% · 转化高达 30%！）</div>
          <div class="big-num" id="buy6" style="color:var(--tax-green);">0 人买单</div>
        </div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>反直觉漏斗：</strong>点击播放看 100 位顾客流过两个摊位——选项多确实更吸引围观，但在最后一步结账时却发生了灾难性的<strong>选择瘫痪（Choice Overload）</strong>！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let pct = 0, playing = false, timer = null, done = false;
    const svg = document.getElementById('funnelSvg');
    const playBtn = document.getElementById('playBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function draw() {
      const stop24 = Math.round(60 * pct), buy24 = Math.round(1.8 * pct); // 60% stop * 3% buy = ~2 / 100
      const stop6  = Math.round(40 * pct), buy6  = Math.round(12.0 * pct); // 40% stop * 30% buy = 12 / 100

      document.getElementById('buy24').textContent = `${buy24} 人买单（围观 ${stop24} 人）`;
      document.getElementById('buy6').textContent = `${buy6} 人买单（围观 ${stop6} 人）`;

      let html = '';
      // Left group: 24 jams
      html += `<text x="175" y="26" text-anchor="middle" fill="var(--tax-red)" font-size="13.5" font-weight="800">🫙 24 种口味（选择过载）</text>`;
      html += `<text x="40" y="64" fill="var(--tax-muted)" font-size="12">驻足试吃</text>`;
      html += `<rect x="106" y="48" width="200" height="22" rx="6" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="106" y="48" width="${(stop24 / 65) * 200}" height="22" rx="6" fill="var(--tax-amber)"/>`;
      html += `<text x="${114 + (stop24 / 65) * 200}" y="64" fill="var(--tax-ink)" font-size="12" font-weight="700">${stop24}人</text>`;

      html += `<text x="40" y="118" fill="var(--tax-muted)" font-size="12">最终买单</text>`;
      html += `<rect x="106" y="102" width="200" height="22" rx="6" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="106" y="102" width="${Math.max(4, (buy24 / 15) * 200)}" height="22" rx="6" fill="var(--tax-red)"/>`;
      html += `<text x="${114 + (buy24 / 15) * 200}" y="118" fill="var(--tax-red)" font-size="13" font-weight="800">${buy24}人</text>`;

      // Divider
      html += `<line x1="340" y1="20" x2="340" y2="175" stroke="var(--tax-border)" stroke-dasharray="4 4"/>`;

      // Right group: 6 jams
      html += `<text x="505" y="26" text-anchor="middle" fill="var(--tax-green)" font-size="13.5" font-weight="800">🍓 6 种精选（轻松拍板）</text>`;
      html += `<text x="368" y="64" fill="var(--tax-muted)" font-size="12">驻足试吃</text>`;
      html += `<rect x="434" y="48" width="200" height="22" rx="6" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="434" y="48" width="${(stop6 / 65) * 200}" height="22" rx="6" fill="var(--tax-primary)"/>`;
      html += `<text x="${442 + (stop6 / 65) * 200}" y="64" fill="var(--tax-ink)" font-size="12" font-weight="700">${stop6}人</text>`;

      html += `<text x="368" y="118" fill="var(--tax-muted)" font-size="12">最终买单</text>`;
      html += `<rect x="434" y="102" width="200" height="22" rx="6" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="434" y="102" width="${(buy6 / 15) * 200}" height="22" rx="6" fill="var(--tax-green)"/>`;
      html += `<text x="${442 + (buy6 / 15) * 200}" y="118" fill="var(--tax-green)" font-size="13" font-weight="800">${buy6}人</text>`;

      html += `<text x="340" y="192" text-anchor="middle" fill="${pct >= 1 ? 'var(--tax-green)' : 'var(--tax-muted)'}" font-size="12.5" font-weight="800">${pct >= 1 ? '🏆 最终战果：6 种精选摊销量（12单）是 24 种大摊（2单）的 6 倍！' : '模拟顾客进店试吃与结账转化中…'}</text>`;
      svg.innerHTML = html;

      if (pct >= 1) {
        ahaBox.innerHTML = '<strong>选择过载悖论（6 倍成交碾压）！</strong>24 种口味让顾客陷入“万一另一罐更好吃”的机会成本焦虑，干脆谁都不买；帮你提前做好<strong>精选策展（Curation）</strong>，反而大幅提升成交率与满意度！';
      }
    }

    function stop() { playing = false; clearInterval(timer); playBtn.textContent = '▶ 模拟 100 位顾客进店转化对决'; }

    playBtn.onclick = () => {
      markDone('播放了果酱实验选择过载转化漏斗');
      if (playing) { stop(); return; }
      if (pct >= 1) pct = 0;
      playing = true;
      playBtn.textContent = '⏸ 暂停';
      timer = setInterval(() => {
        pct = Math.min(1, pct + 0.05);
        draw();
        if (pct >= 1) stop();
      }, 65);
    };
    document.getElementById('jumpBtn').onclick = () => { stop(); pct = 1; markDone('查看了果酱实验6倍转化终局'); draw(); };
    document.getElementById('resetBtn').onclick = () => { stop(); pct = 0; draw(); };
    draw();
  </script>
</body>
</html>
