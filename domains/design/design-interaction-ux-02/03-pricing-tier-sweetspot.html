<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💳 为什么 SaaS 定价表几乎全都是 3 档？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>💳 为什么 SaaS 定价表几乎全都是 3 档？</h1><p>1 档没得比，7 档算到晕；3 档（基础版 / 推荐专业版 / 旗舰版）恰好同时满足希克定律的极低认知负担与“折中居中效应”！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>定价套餐档位数</span><span id="vTr">3 档</span></label><input type="range" id="sTr" min="1" max="7" value="3" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>是否高亮标出“最受欢迎”推荐档</span><span id="vHi">85%</span></label><input type="range" id="sHi" min="0" max="100" value="85" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">付费转化效率指数</div><div class="k-val" id="kCnv">—</div></div>
        <div class="kpi"><div class="k-lbl">设计评估</div><div class="k-val" id="kEv">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const tr=+document.getElementById('sTr').value, hi=+document.getElementById('sHi').value;
  document.getElementById('vTr').textContent=tr+' 档';
  document.getElementById('vHi').textContent=hi+'%';
  const base=tr===3?84:(tr===2?72:(tr===4?68:Math.max(28, 70-(tr-3)*12)));
  const cnv=Math.min(98, Math.round(base + hi*0.14));
  document.getElementById('kCnv').textContent=cnv+' 分';
  document.getElementById('kCnv').style.color=cnv>=80?'#059669':'#f59e0b';
  document.getElementById('kEv').textContent=tr===3?'🏆 黄金三档 + 推荐锚点':(tr>4?'😵 参数表格太长劝退':'⚖️ 尚可');
  let boxes='';
  const w=Math.min(110, 480/tr - 10);
  const startX=300 - (tr*(w+10)-10)/2;
  for(let i=0;i<tr;i++){
    const isMid=(i===Math.floor(tr/2) && hi>=50);
    const x=startX+i*(w+10);
    boxes+=`<rect x="${x.toFixed(1)}" y="${isMid?48:64}" width="${w.toFixed(1)}" height="${isMid?108:92}" rx="8" fill="${isMid?'#3b82f6':'var(--tax-border)'}" opacity="${isMid?'0.88':'0.35'}"/>
      <text x="${(x+w/2).toFixed(1)}" y="114" text-anchor="middle" font-size="11.5" font-weight="800" fill="${isMid?'#fff':'var(--tax-text)'}">${isMid?'★ 推荐':('档位'+(i+1))}</text>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="30" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">定价页卡片结构预览（当前 ${tr} 档）</text>
    ${boxes}`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>三档定价不是巧合——便宜档锚定低门槛、昂贵档提供高锚、中间高亮档接住 60% 以上不想费脑比较的买家！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
