<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>为什么 SaaS 定价表几乎全都是 3 档？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tiers { display: grid; gap: 8px; margin-bottom: 12px; }
    .tier-card {
      padding: 12px 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border);
      text-align: center; position: relative;
    }
    .tier-card.rec { border: 2px solid var(--tax-primary); background: var(--tax-primary-soft); }
    .rec-badge { display: inline-block; font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--tax-primary); color: #fff; margin-bottom: 4px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .s-card { padding: 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); text-align: center; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>💳 为什么 SaaS 定价表几乎全都是 3 档？（构建器）</h1>
      <p>在 <strong>1 档</strong>、<strong>3 档黄金结构（+ 推荐徽章）</strong> 与 <strong>7 档复杂矩阵</strong>之间自由切换，观察希克定律、折中效应（Compromise Effect）与付费转化率如何实时联动！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn secondary" id="t1Btn">1 档：一口价</button>
        <button class="toy-btn" id="t3Btn">✨ 3 档：基础 / 推荐专业 / 企业</button>
        <button class="toy-btn secondary" id="t7Btn">💥 7 档：细碎功能矩阵</button>
      </div>

      <div class="tiers" id="tiersGrid"></div>

      <div class="stats">
        <div class="s-card"><div style="font-size:11.5px;color:var(--tax-muted);">页面转化率</div><strong id="crVal" style="font-size:20px;color:var(--tax-green);">7.4%</strong></div>
        <div class="s-card"><div style="font-size:11.5px;color:var(--tax-muted);">平均决策耗时</div><strong id="rtVal" style="font-size:20px;">12 秒</strong></div>
        <div class="s-card"><div style="font-size:11.5px;color:var(--tax-muted);">客单价 ARPU</div><strong id="arpuVal" style="font-size:20px;color:var(--tax-primary);">¥199/月</strong></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>3 档黄金甜点（折中效应 + 锚定）：</strong>第 1 档降低门槛，第 3 档拉高价格锚点，<strong>中间第 2 档</strong>戴上“最受欢迎”徽章后直接承接 65%+ 的付费订单——决策快、客单价还最高！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CONFIGS = {
      1: {
        cols: '1fr', cr: '3.8%', rt: '6 秒', arpu: '¥99/月',
        items: [{ name: '标准全功能版', price: '¥99/月', desc: '买或不买，零对比参考点', rec: false }],
        aha: '<strong>1 档一口价（转化 3.8%）：</strong>用户心里的问题从“选哪档”变成了“要不要花钱”，缺少高价锚点参照，大客户也只付了 ¥99，白白损失高客单！'
      },
      3: {
        cols: 'repeat(3, 1fr)', cr: '7.4%', rt: '12 秒', arpu: '¥199/月',
        items: [
          { name: '入门版', price: '¥69/月', desc: '个人轻量使用', rec: false },
          { name: '专业版', price: '¥199/月', desc: '团队协作 + 无限空间', rec: true },
          { name: '企业版', price: '¥699/月', desc: '专属部署 + SLA', rec: false }
        ],
        aha: '<strong>3 档黄金结构（转化 7.4% · 客单 ¥199）：</strong>完美踩中希克定律舒适区（3 选 1 极快）+ 行为经济学折中效应（大家天然避开最便宜和最贵，直奔中间推荐档）！'
      },
      7: {
        cols: 'repeat(4, 1fr)', cr: '2.1%', rt: '68 秒', arpu: '¥118/月',
        items: [
          { name: 'Mini', price: '¥29' }, { name: 'Lite', price: '¥49' }, { name: 'Basic', price: '¥79' },
          { name: 'Plus', price: '¥119' }, { name: 'Pro', price: '¥189' }, { name: 'Max', price: '¥299' },
          { name: 'Ultra', price: '¥499' }
        ],
        aha: '<strong>7 档选择瘫痪（转化暴跌至 2.1%）：</strong>为了照顾每个细分需求塞进 7 档价格，结果用户比了 1 分钟还是算不清哪档划算，直接关掉网页走人！'
      }
    };

    let cur = 3, done = false;
    const tiersGrid = document.getElementById('tiersGrid');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      [1, 3, 7].forEach(k => {
        document.getElementById(`t${k}Btn`).className = cur === k ? 'toy-btn' : 'toy-btn secondary';
      });
      const cfg = CONFIGS[cur];
      tiersGrid.style.gridTemplateColumns = cfg.cols;
      tiersGrid.innerHTML = cfg.items.map(it => `
        <div class="tier-card ${it.rec ? 'rec' : ''}">
          ${it.rec ? '<div class="rec-badge">★ 65% 用户选择</div>' : ''}
          <div style="font-weight:800;font-size:14px;">${it.name}</div>
          <div style="font-size:18px;font-weight:900;color:var(--tax-primary);margin:4px 0;">${it.price}</div>
          ${it.desc ? `<div style="font-size:11.5px;color:var(--tax-muted);">${it.desc}</div>` : ''}
        </div>
      `).join('');

      document.getElementById('crVal').textContent = cfg.cr;
      document.getElementById('crVal').style.color = cur === 3 ? 'var(--tax-green)' : (cur === 7 ? 'var(--tax-red)' : 'var(--tax-amber)');
      document.getElementById('rtVal').textContent = cfg.rt;
      document.getElementById('arpuVal').textContent = cfg.arpu;
      ahaBox.innerHTML = cfg.aha;
    }

    [1, 3, 7].forEach(k => {
      document.getElementById(`t${k}Btn`).onclick = () => { cur = k; markDone(`对比了SaaS ${k}档定价表转化率`); render(); };
    });
    render();
  </script>
</body>
</html>
