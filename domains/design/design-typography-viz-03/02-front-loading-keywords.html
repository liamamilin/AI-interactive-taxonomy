<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ 前置关键词法则：每行前 3 个字决定生死</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚡ 前置关键词法则：每行前 3 个字决定生死</h1><p>既然 F 型扫读只扫每段最左边的两三个字，把核心信息藏在句子末尾（“关于我们如何提升效率的说明：免费试用”）注定被跳过！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>核心关键词前置比例（放在句首前 3 字）</span><span id="vFrt">85%</span></label><input type="range" id="sFrt" min="10" max="100" value="85" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>列表条目总数量</span><span id="vCnt">12 条</span></label><input type="range" id="sCnt" min="4" max="20" value="12" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">3 秒内精准扫中率</div><div class="k-val" id="kHit">—</div></div>
        <div class="kpi"><div class="k-lbl">文案写法对比</div><div class="k-val" id="kEx">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const frt=+document.getElementById('sFrt').value, cnt=+document.getElementById('sCnt').value;
  document.getElementById('vFrt').textContent=frt+'%';
  document.getElementById('vCnt').textContent=cnt+' 条';
  const hit=Math.max(18, Math.min(97, Math.round(22 + frt*0.76 - cnt*0.8)));
  document.getElementById('kHit').textContent=hit+'%';
  document.getElementById('kHit').style.color=hit>=70?'#059669':'#ef4444';
  document.getElementById('kEx').textContent=frt>=60?'✅ “免费退换：7 天无理由”':'❌ “关于本平台退换政策的说明”';
  const w=Math.max(15, hit*4.2);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">用户在 ${cnt} 条列表中 3 秒扫中关键信息的概率</text>
    <rect x="30" y="68" width="440" height="38" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="68" width="${w.toFixed(0)}" height="38" rx="8" fill="${hit>=70?'#059669':'#f59e0b'}"/>
    <text x="${Math.min(480,38+w).toFixed(0)}" y="93" font-size="14" font-weight="850" fill="${hit>=70?'#059669':'#d97706'}">${hit}%</text>
    <text x="30" y="150" font-size="12" fill="var(--tax-muted)">写小标题、菜单项和项目要点时，砍掉“关于、如何、进行”等废话，让硬核动词和名词打头阵！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>网页写作不是写悬疑小说，永远用“倒金字塔结构”——把结论塞进第一行前三个字！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
