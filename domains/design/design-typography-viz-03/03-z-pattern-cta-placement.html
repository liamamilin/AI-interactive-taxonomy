<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Z 型动线终点：把行动按钮放在右下角！</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .slot-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎯 Z 型动线终点：CTA 按钮布局构建器</h1>
      <p>你正在设计一张极简 SaaS 落地页首屏。点击下方 4 个位置，把<strong>【立即免费试用】主按钮</strong>安放到画布不同角落，看看哪一个位置能完美接住 Z 型视线终点的转化势能！</p>
    </header>

    <section class="toy-card">
      <div class="slot-row" id="slotRow"></div>

      <svg id="ctaSvg" viewBox="0 0 680 235" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="Z型动线CTA按钮落点布局"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>构建实验：</strong>依次把主按钮放到 4 个角落，观察用户视线流与预估转化率的变化！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const SLOTS = [
      { id: 'tl', name: '↖️ 放左上角（抢 Logo 位）', x: 36, y: 24, cr: '1.8%', ok: false, aha: '<strong>左上角（转化率 1.8%）：</strong>用户连你是谁、产品干嘛的都还没看，一上来就怼按钮，只会引发防御反感！' },
      { id: 'tr', name: '↗️ 放右上角（顶部导航尾）', x: 510, y: 24, cr: '3.6%', ok: false, aha: '<strong>右上角（转化率 3.6%）：</strong>作为辅助“登录/试用”入口不错，但还没经过中间主视觉的说服铺垫，转化不够彻底。' },
      { id: 'bl', name: '↙️ 放左下角（逆动线死角）', x: 36, y: 170, cr: '2.4%', ok: false, aha: '<strong>左下角（转化率 2.4%）：</strong>视线斜穿下来刚落到左下角，习惯还会继续往右扫，把最终按钮放这会让视线走过头！' },
      { id: 'br', name: '↘️ 放右下角（Z 型终点黄金位！）', x: 500, y: 170, cr: '6.8%', ok: true, aha: '<strong>Z 型终点大满贯（转化率 6.8%）！</strong>用户完整看完了“① 你是谁 → ② 核心卖点 → ③ 客户背书”，视线正好顺滑停在右下角按钮上，点击动作水到渠成！' }
    ];

    let cur = SLOTS[0], done = false;
    const slotRow = document.getElementById('slotRow');
    const svg = document.getElementById('ctaSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      slotRow.innerHTML = '';
      SLOTS.forEach(s => {
        const b = document.createElement('button');
        b.className = s.id === cur.id ? 'toy-btn' : 'toy-btn secondary';
        b.textContent = s.name;
        b.onclick = () => { cur = s; markDone(`测试了Z型动线CTA位置：${s.name}`); render(); };
        slotRow.appendChild(b);
      });

      let html = '';
      // Z trajectory guide
      html += `<polyline points="90,44 580,44 100,190 570,190" fill="none" stroke="var(--tax-primary)" stroke-width="3" stroke-dasharray="6 5" opacity="0.45"/>`;
      // Center Hero Value Prop
      html += `<rect x="175" y="78" width="330" height="78" rx="12" fill="rgba(148,163,184,0.12)" stroke="var(--tax-border)"/>`;
      html += `<text x="340" y="110" text-anchor="middle" fill="var(--tax-ink)" font-size="16" font-weight="800">10 倍提速你的设计评审流</text>`;
      html += `<text x="340" y="134" text-anchor="middle" fill="var(--tax-muted)" font-size="12">全球 50,000+ 产品团队正在使用</text>`;

      // Logo placeholder if not overridden
      if (cur.id !== 'tl') html += `<text x="42" y="48" fill="var(--tax-muted)" font-size="13" font-weight="800">◆ ACME STUDIO</text>`;
      if (cur.id !== 'bl') html += `<text x="42" y="196" fill="var(--tax-muted)" font-size="11.5">★★★★★ 4.9/5 好评背书</text>`;

      // Placed CTA button
      html += `<rect x="${cur.x}" y="${cur.y}" width="144" height="40" rx="10" fill="${cur.ok ? 'var(--tax-green)' : 'var(--tax-primary)'}"/>`;
      html += `<text x="${cur.x + 72}" y="${cur.y + 25}" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">立即免费试用 →</text>`;

      html += `<text x="340" y="226" text-anchor="middle" fill="${cur.ok ? 'var(--tax-green)' : 'var(--tax-amber)'}" font-size="12.5" font-weight="800">预估首屏点击转化率：${cur.cr}</text>`;
      svg.innerHTML = html;
      ahaBox.innerHTML = cur.aha;
    }

    render();
  </script>
</body>
</html>
