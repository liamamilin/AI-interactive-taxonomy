<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👀 眼动仪热力轨迹：F 型文章 vs Z 型落地页（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>👀 眼动仪热力轨迹：F 型文章 vs Z 型落地页（SVG）</h1><p>尼尔森诺曼集团（NN/g）眼动实验证明：面对长文和搜索结果，人眼走“F 型”（扫顶行、扫第二段开头、再沿左侧快速下拉）；面对海报和官网首屏，人眼走“Z 型”！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="btn-row">
        <button class="btn active" onclick="setP('F',this)">F 型动线（资讯列表 / 文档 / 搜索页）</button>
        <button class="btn" onclick="setP('Z',this)">Z 型动线（产品官网 / 海报 / 落地页）</button>
      </div>
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>用户耐心扫读进度（秒）</span><span id="vT">3.0 秒</span></label><input type="range" id="sT" min="0.5" max="5.0" step="0.5" value="3.0" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">最热门黄金视觉区</div><div class="k-val" id="kHot">—</div></div>
        <div class="kpi"><div class="k-lbl">天然视觉盲区</div><div class="k-val" id="kBld">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
let pat='F';
function setP(p,btn){ pat=p; document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); draw(); }
function draw(){
  const t=+document.getElementById('sT').value;
  document.getElementById('vT').textContent=t.toFixed(1)+' 秒';
  const op=Math.min(1, 0.35 + t*0.14).toFixed(2);
  document.getElementById('kHot').textContent=pat==='F'?'顶部横栏 + 左侧首字列':'左上 Logo → 右上导航 → 右下 CTA';
  document.getElementById('kBld').textContent=pat==='F'?'右下角大段文字（几乎没人看）':'左右边缘零散装饰';
  const pathSvg=pat==='F'
    ? `<path d="M 85 52 L 490 52 M 85 102 L 360 102 M 85 52 L 85 182" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round" opacity="${op}"/>
       <circle cx="85" cy="52" r="14" fill="#ef4444"/><text x="85" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">1</text>
       <circle cx="490" cy="52" r="12" fill="#f97316"/><text x="490" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">2</text>
       <circle cx="85" cy="182" r="12" fill="#facc15"/><text x="85" y="186" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">3</text>`
    : `<path d="M 85 52 L 510 52 L 85 172 L 510 172" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>
       <circle cx="85" cy="52" r="13" fill="#2563eb"/><text x="85" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">1</text>
       <circle cx="510" cy="52" r="12" fill="#3b82f6"/><text x="510" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">2</text>
       <circle cx="85" cy="172" r="12" fill="#60a5fa"/><text x="85" y="176" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">3</text>
       <circle cx="510" cy="172" r="15" fill="#059669"/><text x="510" y="176" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">4</text>`;
  document.getElementById('svg').innerHTML=`
    <rect x="40" y="22" width="520" height="176" rx="12" fill="var(--tax-surface)" stroke="var(--tax-border)"/>
    ${pathSvg}
    <text x="300" y="212" text-anchor="middle" font-size="11" fill="var(--tax-muted)">眼动轨迹模拟（${pat} 型扫读 · 停留 ${t.toFixed(1)} 秒）</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>不要对抗用户的扫读习惯——顺着 F/Z 轨迹把最核心的价值主张、图标和按钮埋在眼球必经的十字路口上！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
