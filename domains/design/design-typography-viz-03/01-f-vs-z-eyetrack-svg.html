<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>眼动仪热力轨迹：F 型文章 vs Z 型落地页</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>👀 眼动仪热力轨迹：F 型文章 vs Z 型落地页（空间模拟）</h1>
      <p>尼尔森诺曼集团追踪了数千名用户的真实眼动轨迹：面对<strong>文字密集型页面</strong>，眼睛走 <strong>F 型</strong>（右下角几乎零曝光）；面对<strong>视觉稀疏型落地页</strong>，眼睛走 <strong>Z 型</strong>！切换模式播放眼动回放：</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="fBtn">📰 F 型动线（信息流 / 文章 / 搜索页）</button>
        <button class="toy-btn secondary" id="zBtn">🚀 Z 型动线（极简落地页 / 海报）</button>
        <button class="toy-btn secondary" id="replayBtn">▶ 重播眼动轨迹</button>
      </div>

      <svg id="eyeSvg" viewBox="0 0 680 255" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="F型与Z型眼动热力轨迹图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>F 型扫读规律：</strong>用户先横扫顶部第一行，再略短地扫一下第二段，随后直接贴着<strong>最左侧垂直滑落</strong>！把重要信息塞在长文右下角，90% 的读者根本看不见！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let mode = 'F';
    let step = 0;
    let timer = null;
    let done = false;

    const svg = document.getElementById('eyeSvg');
    const ahaBox = document.getElementById('ahaBox');

    const PATH_F = [
      [85, 55, '① 首行全幅横扫'], [240, 55, ''], [420, 55, ''], [570, 55, ''],
      [85, 118, '② 中段半幅扫读'], [220, 118, ''], [350, 118, ''],
      [85, 175, '③ 贴左侧垂直速览'], [85, 220, '④ 仅看每行前 2 词']
    ];
    const PATH_Z = [
      [95, 52, '① 左上：品牌 Logo'], [575, 52, '② 右上：登录 / 导航'],
      [340, 130, '③ 斜穿：核心主视觉'],
      [110, 208, '④ 左下：社会认同'], [560, 208, '⑤ 右下：终极 CTA！']
    ];

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function draw() {
      document.getElementById('fBtn').className = mode === 'F' ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('zBtn').className = mode === 'Z' ? 'toy-btn' : 'toy-btn secondary';

      const pts = mode === 'F' ? PATH_F : PATH_Z;
      let html = '';

      // Wireframe background
      if (mode === 'F') {
        for (let i = 0; i < 4; i++) {
          const y = 42 + i * 54;
          html += `<rect x="64" y="${y}" width="540" height="12" rx="4" fill="rgba(148,163,184,0.22)"/>`;
          html += `<rect x="64" y="${y + 20}" width="${460 - i * 40}" height="9" rx="4" fill="rgba(148,163,184,0.14)"/>`;
        }
        // Cold dead zone badge bottom-right
        html += `<rect x="430" y="150" width="180" height="80" rx="10" fill="rgba(148,163,184,0.08)" stroke="var(--tax-border)" stroke-dasharray="4 4"/>`;
        html += `<text x="520" y="194" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5">❄️ 右下角扫读盲区</text>`;
      } else {
        // Z-pattern landing page wireframe
        html += `<rect x="54" y="34" width="100" height="32" rx="6" fill="rgba(59,130,246,0.18)"/>`;
        html += `<rect x="520" y="34" width="106" height="32" rx="6" fill="rgba(148,163,184,0.18)"/>`;
        html += `<rect x="190" y="92" width="300" height="72" rx="10" fill="rgba(148,163,184,0.14)"/>`;
        html += `<rect x="54" y="188" width="140" height="36" rx="8" fill="rgba(148,163,184,0.14)"/>`;
        html += `<rect x="488" y="188" width="140" height="36" rx="8" fill="rgba(16,185,129,0.24)" stroke="var(--tax-green)" stroke-width="2"/>`;
      }

      // Draw trajectory up to `step`
      const activePts = pts.slice(0, Math.max(1, step));
      if (activePts.length > 1) {
        html += `<polyline points="${activePts.map(p => `${p[0]},${p[1]}`).join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>`;
      }

      // Heat circles
      activePts.forEach((p, idx) => {
        const isLast = idx === activePts.length - 1;
        html += `<circle cx="${p[0]}" cy="${p[1]}" r="${isLast ? 24 : 16}" fill="rgba(239,68,68,0.22)"/>`;
        html += `<circle cx="${p[0]}" cy="${p[1]}" r="${isLast ? 8 : 5}" fill="var(--tax-red)"/>`;
        if (p[2]) {
          html += `<text x="${p[0]}" y="${p[1] - 14}" text-anchor="middle" fill="var(--tax-ink)" font-size="11.5" font-weight="800">${p[2]}</text>`;
        }
      });

      svg.innerHTML = html;

      ahaBox.innerHTML = mode === 'F'
        ? '<strong>F 型动线法则（适合内容密集页）：</strong>用户越往下越没耐心，只扫最左边！因此博客、文档和列表页必须把<strong>小标题、粗体核心词</strong>牢牢锚定在左侧边缘。'
        : '<strong>Z 型动线法则（适合极简落地页/海报）：</strong>信息元素少于 5 块时，视线自然沿着左上→右上→斜穿中心→右下角的“Z”字滑行，终点右下角就是转化率最高的 <strong>CTA 按钮黄金位</strong>！';
    }

    function play() {
      clearInterval(timer);
      const pts = mode === 'F' ? PATH_F : PATH_Z;
      step = 1;
      draw();
      timer = setInterval(() => {
        step++;
        draw();
        if (step >= pts.length) clearInterval(timer);
      }, 320);
    }

    document.getElementById('fBtn').onclick = () => { mode = 'F'; markDone('播放了F型眼动轨迹'); play(); };
    document.getElementById('zBtn').onclick = () => { mode = 'Z'; markDone('播放了Z型眼动轨迹'); play(); };
    document.getElementById('replayBtn').onclick = () => { markDone('重播了眼动仪热力轨迹'); play(); };
    play();
  </script>
</body>
</html>
