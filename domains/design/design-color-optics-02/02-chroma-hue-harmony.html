<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎡 OKLCH 主题色盘生成器：换色相不毁对比度</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎡 OKLCH 主题色盘生成器：换色相不毁对比度</h1><p>在感知均匀空间里，只需固定 L（明度）和 C（色度），旋转 H（色相角）即可瞬间生成视觉重量完全平衡的多色标签体系！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>主品牌起始色相角 H</span><span id="vH">220°</span></label><input type="range" id="sH" min="0" max="360" value="220" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>色盘统一视觉明度 L</span><span id="vL">52%</span></label><input type="range" id="sL" min="35" max="70" value="52" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">五色视觉重量方差</div><div class="k-val" id="kVar">极低（完全均衡）</div></div>
        <div class="kpi"><div class="k-lbl">推荐文字反色</div><div class="k-val" id="kTxt">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const h0=+document.getElementById('sH').value, l=+document.getElementById('sL').value;
  document.getElementById('vH').textContent=h0+'°';
  document.getElementById('vL').textContent=l+'%';
  const txtCol=l>60?'#0f172a':'#ffffff';
  document.getElementById('kTxt').textContent=l>60?'深黑字 (#0f172a)':'纯白字 (#ffffff)';
  let cards='';
  const labels=['主色','成功','警告','信息','强调'];
  for(let i=0;i<5;i++){
    const h=(h0+i*72)%360;
    const x=30+i*110;
    const comp=(h>40 && h<190)?-8:((h>210 && h<280)?8:0);
    const al=Math.max(28, Math.min(78, l+comp));
    cards+=`<rect x="${x}" y="50" width="98" height="96" rx="12" fill="hsl(${h},72%,${al}%)"/>
      <text x="${x+49}" y="92" text-anchor="middle" font-size="13" font-weight="850" fill="${txtCol}">${labels[i]}</text>
      <text x="${x+49}" y="116" text-anchor="middle" font-size="11" fill="${txtCol}" opacity="0.9">H=${h}°</text>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="30" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">等距 72° 感知均匀五色系统（旋转色相角，无任何一格显得突兀）</text>
    ${cards}
    <text x="30" y="176" font-size="11.5" fill="var(--tax-muted)">多维图表配色（柱状图、状态徽章）最怕某个颜色比别的更抢戏，等亮色盘一举根治！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>好看的 UI 配色不是靠玄学灵感，而是把所有语义色钉在同一条“感知明度水平线”上！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
