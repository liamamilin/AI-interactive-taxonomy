<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>塔夫特撒谎因子：截断 Y 轴魔术棒</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .ctrl-box { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .m-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .m-val { font-size: 20px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎭 塔夫特撒谎因子：截断 Y 轴魔术棒（模拟器）</h1>
      <p>两个产品的真实好评率分别是 <strong>95%</strong> 和 <strong>98%</strong>（仅差 3.16%）。拖动下方「Y 轴截断起点」，亲手把微不足道的 3% 差距伪装成“领先 4 倍的断崖式碾压”！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn secondary" id="pHonest">✅ 诚实基准（从 0% 起步）</button>
        <button class="toy-btn" id="pLie">🎭 发布会忽悠模式（从 94% 截断）</button>
      </div>

      <div class="ctrl-box">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span>✂️ Y 轴截断起点（Min Y）</span>
          <strong id="minVal" style="color:var(--tax-red);">94%（严重截断！）</strong>
        </div>
        <input type="range" id="minRange" min="0" max="94" value="94" style="width:100%;" />
      </div>

      <svg id="barSvg" viewBox="0 0 680 215" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="截断Y轴柱状图撒谎因子演示"></svg>

      <div class="metrics">
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">真实数值增幅</div><div class="m-val" style="color:var(--tax-ink);">+3.2%</div></div>
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">视觉柱高增幅</div><div class="m-val" id="visVal" style="color:var(--tax-red);">+300%</div></div>
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">塔夫特撒谎因子</div><div class="m-val" id="lieVal" style="color:var(--tax-red);">95.0×</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>撒谎因子（Lie Factor = 视觉变化 ÷ 真实变化）：</strong>塔夫特规定诚实图表的撒谎因子应在 <code>0.95–1.05</code> 之间！现在从 94% 截断直接把撒谎因子飙到了 <strong>95 倍</strong>——把滑块拖回 0% 看看真相！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const minRange = document.getElementById('minRange');
    const svg = document.getElementById('barSvg');
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const minY = Number(minRange.value);
      const maxY = 100;
      const vA = 95, vB = 98;
      const realInc = (vB - vA) / vA; // 0.03158
      const hA = (vA - minY) / (maxY - minY);
      const hB = (vB - minY) / (maxY - minY);
      const visInc = (hB - hA) / Math.max(0.001, hA);
      const lieFactor = visInc / realInc;

      document.getElementById('minVal').textContent = minY === 0 ? '0%（✅ 诚实零基线）' : `${minY}%（⚠️ 截断了下方 ${minY}%！）`;
      document.getElementById('minVal').style.color = minY === 0 ? 'var(--tax-green)' : 'var(--tax-red)';
      document.getElementById('visVal').textContent = `+${Math.round(visInc * 100)}%`;
      document.getElementById('lieVal').textContent = `${lieFactor.toFixed(1)}×`;
      document.getElementById('lieVal').style.color = lieFactor <= 1.2 ? 'var(--tax-green)' : (lieFactor <= 5 ? 'var(--tax-amber)' : 'var(--tax-red)');

      const baseY = 180, topY = 36, spanH = baseY - topY;
      const pxA = hA * spanH;
      const pxB = hB * spanH;

      let html = '';
      // Y axis
      html += `<line x1="90" y1="${topY}" x2="90" y2="${baseY}" stroke="var(--tax-border)" stroke-width="2"/>`;
      html += `<line x1="90" y1="${baseY}" x2="600" y2="${baseY}" stroke="var(--tax-border)" stroke-width="2"/>`;
      html += `<text x="80" y="${topY + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="11.5">100%</text>`;
      html += `<text x="80" y="${baseY + 4}" text-anchor="end" fill="${minY > 0 ? 'var(--tax-red)' : 'var(--tax-green)'}" font-size="12" font-weight="800">${minY}%</text>`;

      // Bar A (95%)
      html += `<rect x="190" y="${(baseY - pxA).toFixed(1)}" width="110" height="${pxA.toFixed(1)}" rx="8" fill="rgba(148,163,184,0.45)"/>`;
      html += `<text x="245" y="${(baseY - pxA - 8).toFixed(1)}" text-anchor="middle" fill="var(--tax-ink)" font-size="13.5" font-weight="800">竞品 A：95%</text>`;

      // Bar B (98%)
      html += `<rect x="380" y="${(baseY - pxB).toFixed(1)}" width="110" height="${pxB.toFixed(1)}" rx="8" fill="${lieFactor > 2 ? 'var(--tax-red)' : 'var(--tax-primary)'}"/>`;
      html += `<text x="435" y="${(baseY - pxB - 8).toFixed(1)}" text-anchor="middle" fill="${lieFactor > 2 ? 'var(--tax-red)' : 'var(--tax-primary)'}" font-size="13.5" font-weight="800">自家 B：98%</text>`;

      if (minY > 0) {
        html += `<text x="340" y="204" text-anchor="middle" fill="var(--tax-red)" font-size="12" font-weight="700">✂️ 底部 0%–${minY}% 被偷偷剪掉，柱 B 看起来比柱 A 高出 ${(hB / hA).toFixed(1)} 倍！</text>`;
      } else {
        html += `<text x="340" y="204" text-anchor="middle" fill="var(--tax-green)" font-size="12" font-weight="700">✅ 诚实零基线：两款产品好评率几乎打平（95% vs 98%），绝不误导读者！</text>`;
      }
      svg.innerHTML = html;

      ahaBox.innerHTML = minY === 0
        ? '<strong>诚实可视化（撒谎因子 1.0×）：</strong>柱状图靠“柱子总高度（面积）”编码数值，因此<strong>柱状图必须从 0 起步</strong>！如果想看清 95% 和 98% 的细微差别，请换用折线图或直接标注差值 +3%，绝不要偷偷截断柱子！'
        : `<strong>警惕截断骗局（撒谎因子 ${lieFactor.toFixed(1)}×）！</strong>仅仅把 Y 轴起点抬到 ${minY}%，微小的 +3% 就变成了肉眼震撼的 ${(hB / hA).toFixed(1)} 倍碾压！下次看发布会 PPT，第一眼永远先盯左下角 Y 轴是不是从 0 开始！`;
    }

    minRange.oninput = () => { markDone('拖动Y轴截断起点实测了塔夫特撒谎因子'); render(); };
    document.getElementById('pHonest').onclick = () => { minRange.value = 0; markDone('恢复了诚实0基线柱状图'); render(); };
    document.getElementById('pLie').onclick = () => { minRange.value = 94; markDone('演示了94%截断Y轴骗局'); render(); };
    render();
  </script>
</body>
</html>
