<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>截选时间窗口：选好起点就能讲出相反故事</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 640px) { .btn-row { grid-template-columns: 1fr; } }
    .role-btn {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: left;
    }
    .role-btn.active { border-color: var(--tax-primary); background: var(--tax-primary-soft); color: var(--tax-primary); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>✂️ 截选时间窗口（Cherry-Picking）：同一条曲线，三种相反新闻</h1>
      <p>同样是一家公司全年 12 个月的真实股价曲线，数据一字未改——切换 3 位立场不同的撰稿人，看看只靠<strong>“挑好起始月份裁一刀”</strong>，如何同时写出“暴涨 +33%”和“崩盘 -28%”两篇截然相反的爆款文章！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row" id="roleRow"></div>

      <svg id="cropSvg" viewBox="0 0 680 220" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="截选时间窗口操控叙事图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>反操弄指南：</strong>任何只给你看“近 3 个月”或“从某个奇怪日期起算”的趋势图，都必须立刻反问一句：<strong>“把时间轴拉长到 1 年 / 5 年，全貌长什么样？”</strong>
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    // 12-month data: M1=100, M4=72 (bottom), M8=96 (rebound), M12=84
    const VALS = [100, 94, 82, 72, 78, 85, 91, 96, 92, 88, 86, 84];
    const ROLES = [
      { id: 'pr',   name: '📈 公司公关喜报（只截 M4→M8）', s: 3, e: 7, headline: '“强势反弹！短短 4 个月暴涨 +33%，开启黄金增长期！”', col: 'var(--tax-green)', aha: '<strong>公关截窗术（M4→M8，+33%）：</strong>精准挑选全年最低点 M4 作为起点、反弹高点 M8 作为终点，成功把一家全年下跌的公司包装成超级黑马！' },
      { id: 'bear', name: '📉 竞品做空黑稿（只截 M1→M4）', s: 0, e: 3, headline: '“全线崩盘！开年暴跌 -28%，商业模式彻底失效！”', col: 'var(--tax-red)', aha: '<strong>黑稿截窗术（M1→M4，-28%）：</strong>故意截断在最低谷 M4 之前，对后面稳步反弹绝口不提，最大化制造恐慌情绪！' },
      { id: 'full', name: '🔎 诚实全景视角（完整 M1→M12）', s: 0, e: 11, headline: '“全年整体温和回调 -16%，年中出现深度 V 型震荡。”', col: 'var(--tax-primary)', aha: '<strong>全景视角破局（M1→M12，-16%）：</strong>拉出完整自然年窗口，所有片面暴涨与恐慌暴跌瞬间退潮，露出真实的中期震荡全貌！' }
    ];

    let cur = ROLES[0], done = false;
    const roleRow = document.getElementById('roleRow');
    const svg = document.getElementById('cropSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      roleRow.innerHTML = '';
      ROLES.forEach(r => {
        const b = document.createElement('button');
        b.className = 'role-btn' + (r.id === cur.id ? ' active' : '');
        b.textContent = r.name;
        b.onclick = () => { cur = r; markDone(`切换了截选时间窗口视角：${r.name}`); render(); };
        roleRow.appendChild(b);
      });

      const xOf = i => 54 + (i / 11) * 572;
      const yOf = v => 185 - ((v - 60) / 50) * 130;

      const fullPts = VALS.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
      const cropPts = VALS.slice(cur.s, cur.e + 1).map((v, idx) => `${xOf(cur.s + idx).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');

      let html = '';
      // Highlighted cropped window band
      const wx = xOf(cur.s), ww = xOf(cur.e) - wx;
      html += `<rect x="${wx.toFixed(1)}" y="40" width="${ww.toFixed(1)}" height="145" fill="${cur.col}" opacity="0.13"/>`;

      // Full dimmed curve
      html += `<polyline points="${fullPts}" fill="none" stroke="var(--tax-muted)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>`;
      // Cropped highlighted curve
      html += `<polyline points="${cropPts}" fill="none" stroke="${cur.col}" stroke-width="4" stroke-linecap="round"/>`;

      // Endpoints of cropped window
      html += `<circle cx="${xOf(cur.s)}" cy="${yOf(VALS[cur.s])}" r="6" fill="${cur.col}"/>`;
      html += `<circle cx="${xOf(cur.e)}" cy="${yOf(VALS[cur.e])}" r="6" fill="${cur.col}"/>`;

      for (let i = 0; i < 12; i++) {
        html += `<text x="${xOf(i)}" y="204" text-anchor="middle" fill="${i >= cur.s && i <= cur.e ? 'var(--tax-ink)' : 'var(--tax-muted)'}" font-size="11" font-weight="${i === cur.s || i === cur.e ? '800' : '400'}">M${i + 1}</text>`;
      }

      html += `<text x="340" y="26" text-anchor="middle" fill="${cur.col}" font-size="13" font-weight="800">${cur.headline}</text>`;
      svg.innerHTML = html;
      ahaBox.innerHTML = cur.aha;
    }

    render();
  </script>
</body>
</html>
