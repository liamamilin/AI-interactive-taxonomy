<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📈 双纵轴障眼法：把毫不相干的曲线强行粘在一起</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📈 双纵轴障眼法：把毫不相干的曲线强行粘在一起</h1><p>双 Y 轴图表是数据汇报里最容易暗箱操作的魔术：只需拉伸或压缩右侧纵轴刻度，就能让两条毫无关系的曲线显得“严丝合缝”或“剧烈背离”！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>右轴刻度拉伸倍率（操控红线坡度）</span><span id="vSc">2.5x</span></label><input type="range" id="sSc" min="0.5" max="4.0" step="0.25" value="2.5" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>右轴垂直平移偏移量</span><span id="vOff">0</span></label><input type="range" id="sOff" min="-40" max="40" step="5" value="0" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">视觉给人的第一印象</div><div class="k-val" id="kImp">—</div></div>
        <div class="kpi"><div class="k-lbl">防骗建议</div><div class="k-val">拆成上下两张独立小图</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const sc=+document.getElementById('sSc').value, off=+document.getElementById('sOff').value;
  document.getElementById('vSc').textContent=sc.toFixed(2)+'x';
  document.getElementById('vOff').textContent=(off>=0?'+':'')+off;
  const blue=[30, 42, 55, 62, 74, 82];
  const redRaw=[50, 52, 54, 55, 57, 59];
  let ptsB=[], ptsR=[];
  for(let i=0;i<6;i++){
    const x=65+i*92;
    const yb=172 - blue[i]*1.3;
    const rVal=50 + (redRaw[i]-50)*sc*2 + off*0.6;
    const yr=Math.max(36, Math.min(172, 172 - rVal*1.3));
    ptsB.push(`${x},${yb.toFixed(1)}`);
    ptsR.push(`${x},${yr.toFixed(1)}`);
  }
  const fakeSync=sc>=2.0 && Math.abs(off)<=15;
  document.getElementById('kImp').textContent=fakeSync?'🤯 看起来与蓝线同步暴涨!':'📏 露出平缓波动的真面目';
  document.getElementById('kImp').style.color=fakeSync?'#ef4444':'#059669';
  document.getElementById('svg').innerHTML=`
    <text x="65" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">蓝线真实暴涨 173%，红线其实只微涨 18%——全看你怎么拉右轴！</text>
    <line x1="65" y1="172" x2="535" y2="172" stroke="var(--tax-border)" stroke-width="1.5"/>
    <polyline points="${ptsB.join(' ')}" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <polyline points="${ptsR.join(' ')}" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,3"/>
    <text x="65" y="192" font-size="11" fill="#2563eb">左轴：蓝线 (30→82)</text>
    <text x="535" y="192" text-anchor="end" font-size="11" fill="#ef4444">右轴：红线 (仅 50→59，拉伸 ${sc.toFixed(2)}x)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>双纵轴的交叉点毫无数学意义，全取决于作图人的刻度选择！想诚实对比两个不同量纲的指标，改用“归一化指数（同设为基期=100）”或拆成上下双图！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
