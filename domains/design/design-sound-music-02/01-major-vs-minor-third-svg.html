<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>只差半音的情绪魔法：大三度 vs 小三度</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎹 只差半音的情绪魔法：大三度 vs 小三度（盲听实验）</h1>
      <p>大三和弦（C–E–G）和小三和弦（C–Eb–G）之间，<strong>仅仅只差中间那一颗音降了半个键</strong>！先点击播放神秘和弦盲听，猜猜它是阳光大调还是忧伤小调！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="playMysteryBtn">🔊 播放神秘三和弦（盲听）</button>
        <button class="toy-btn secondary" id="guessMajBtn">☀️ 我猜：大三和弦（明亮）</button>
        <button class="toy-btn secondary" id="guessMinBtn">🌧️ 我猜：小三和弦（忧伤）</button>
      </div>

      <svg id="pianoSvg" viewBox="0 0 680 185" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="钢琴键大三度与小三度半音对比"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>盲听任务：</strong>点击「🔊 播放神秘三和弦」倾听它的情绪底色，再选出你的判断！揭晓后可以看到钢琴键上那 <strong>1 个半音（100 音分）</strong>的微移！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let isMajor = Math.random() > 0.5;
    let revealed = false, score = 0, rounds = 0, ctx = null, done = false;
    const svg = document.getElementById('pianoSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function playTriad(maj) {
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const notes = maj ? [261.63, 329.63, 392.00] : [261.63, 311.13, 392.00];
        notes.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.05);
          g.gain.setValueAtTime(0.001, now + idx * 0.05);
          g.gain.linearRampToValueAtTime(0.16, now + idx * 0.05 + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, now + 1.25);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(now + idx * 0.05); osc.stop(now + 1.3);
        });
      } catch (e) {}
    }

    function drawPiano() {
      const whites = ['C','D','E','F','G','A','B'];
      const startX = 130, kw = 60, kh = 130;
      let html = '';

      whites.forEach((w, i) => {
        const x = startX + i * kw;
        const lit = revealed && (w === 'C' || w === 'G' || (isMajor && w === 'E'));
        const fill = lit ? (isMajor ? 'rgba(245,158,11,0.45)' : 'rgba(59,130,246,0.38)') : '#f8fafc';
        html += `<rect x="${x}" y="22" width="${kw - 3}" height="${kh}" rx="6" fill="${fill}" stroke="#334155" stroke-width="1.5"/>`;
        html += `<text x="${x + kw / 2 - 1}" y="138" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="800">${w}</text>`;
      });

      // Black keys (C#, Eb, F#, Ab, Bb)
      const blacks = [
        { name: 'C#', pos: 0.68 }, { name: 'Eb', pos: 1.68 },
        { name: 'F#', pos: 3.68 }, { name: 'Ab', pos: 4.68 }, { name: 'Bb', pos: 5.68 }
      ];
      blacks.forEach(b => {
        const x = startX + b.pos * kw;
        const lit = revealed && !isMajor && b.name === 'Eb';
        html += `<rect x="${x}" y="22" width="36" height="80" rx="5" fill="${lit ? '#3b82f6' : '#0f172a'}" stroke="#0f172a"/>`;
        if (lit) html += `<text x="${x + 18}" y="90" text-anchor="middle" fill="#fff" font-size="11" font-weight="800">Eb</text>`;
      });

      html += `<text x="340" y="172" text-anchor="middle" fill="var(--tax-ink)" font-size="12.5" font-weight="800">${revealed ? (isMajor ? '☀️ 揭晓：C 大三和弦（C - E - G，含大三度 4 半音）' : '🌧️ 揭晓：C 小三和弦（C - Eb - G，中音降 1 个半音成小三度！）') : '🎧 盲听中：点击上方按钮听音辨情绪！'}</text>`;
      svg.innerHTML = html;
    }

    function guess(choseMaj) {
      revealed = true;
      rounds++;
      const ok = choseMaj === isMajor;
      if (ok) score++;
      markDone(`完成大小三度半音情绪盲听（命中 ${score}/${rounds}）`);
      drawPiano();
      ahaBox.innerHTML = `${ok ? '🎯 <strong>听感精准！</strong>' : '🌧️ <strong>差一点点！</strong>'}刚才播放的是<strong>${isMajor ? 'C 大三和弦（C–E–G）' : 'C 小三和弦（C–Eb–G）'}</strong>（累计命中 ${score}/${rounds}）。仅仅把中间三音向左挪动 <strong>1 个黑键（半音）</strong>，频率比就从阳光的 5:4 变成带微妙张力的 6:5，瞬间改写人类情绪！再点「播放神秘三和弦」换下一题！`;
      isMajor = Math.random() > 0.5;
    }

    document.getElementById('playMysteryBtn').onclick = () => {
      revealed = false;
      drawPiano();
      playTriad(isMajor);
    };
    document.getElementById('guessMajBtn').onclick = () => guess(true);
    document.getElementById('guessMinBtn').onclick = () => guess(false);
    drawPiano();
  </script>
</body>
</html>
