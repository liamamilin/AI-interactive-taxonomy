<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>万能流行 4536251 与 1645 和弦套路</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .seq-strip { display: grid; gap: 8px; margin: 12px 0; }
    .chord-tile {
      padding: 14px 8px; border-radius: 10px; background: var(--tax-surface-alt); border: 1.5px solid var(--tax-border);
      text-align: center; transition: transform .12s, border-color .12s, background .12s;
    }
    .chord-tile.lit { border-color: var(--tax-primary); background: var(--tax-primary-soft); transform: translateY(-3px); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎸 万能流行和弦套路播放器（编曲构建器）</h1>
      <p>为什么几百首中英文金曲听起来似曾相识、百听不腻？因为它们共用同一套满足大脑“预期+微惊喜”的<strong>黄金和弦级数公式</strong>！点击切换套路并播放试听：</p>
    </header>

    <section class="toy-card">
      <div class="btn-row" id="progRow"></div>
      <div class="seq-strip" id="seqStrip"></div>
      <button class="toy-btn" id="playBtn">▶ 播放当前和弦进行</button>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>流行音乐密码：</strong>点击上方 3 套世界级万能和弦套路试听，你会惊讶地发现自己脑中立刻自动响起了十首不同歌手的副歌旋律！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CHORD_F = {
      '1 (C)':  [261.63, 329.63, 392.00],
      '2m (Dm)':[293.66, 349.23, 440.00],
      '3m (Em)':[329.63, 392.00, 493.88],
      '4 (F)':  [349.23, 440.00, 523.25],
      '5 (G)':  [392.00, 493.88, 587.33],
      '6m (Am)':[220.00, 261.63, 329.63]
    };

    const PROGS = [
      { id: '1564', name: '🌟 欧美金曲 1-5-6-4', seq: ['1 (C)', '5 (G)', '6m (Am)', '4 (F)'], aha: '<strong>1-5-6-4（全球最畅销四和弦）：</strong>从《Let It Be》到《Someone Like You》，先明亮开局（1-5）、再轻落一丝感伤（6m）、最后温暖托起（4），完美闭环循环！' },
      { id: '1645', name: '☀️ 复古甜蜜 1-6-4-5', seq: ['1 (C)', '6m (Am)', '4 (F)', '5 (G)'], aha: '<strong>1-6-4-5（50 年代甜蜜循环）：</strong>无数校园民谣与青春情歌的标配，最后落在 5 级属和弦制造强烈回 1 级的推进力！' },
      { id: '4536', name: '💫 华语/J-Pop 催泪 4-5-3-6-2-5-1', seq: ['4 (F)', '5 (G)', '3m (Em)', '6m (Am)', '2m (Dm)', '5 (G)', '1 (C)'], aha: '<strong>4-5-3-6-2-5-1（王道催泪进行）：</strong>跳过 1 级直接从温暖悬空的 4 级切入，接连经过 3m→6m→2m 五度圈下行，把深情拉满后稳稳落回 1 级！' }
    ];

    let cur = PROGS[0], ctx = null, timers = [], done = false;
    const progRow = document.getElementById('progRow');
    const seqStrip = document.getElementById('seqStrip');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function clearTimers() { timers.forEach(t => clearTimeout(t)); timers = []; }

    function playProg() {
      clearTimers();
      markDone(`试听了流行和弦套路：${cur.name}`);
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const tiles = [...seqStrip.children];
        cur.seq.forEach((name, idx) => {
          const t0 = now + idx * 0.62;
          CHORD_F[name].forEach(f => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, t0);
            g.gain.setValueAtTime(0.001, t0);
            g.gain.linearRampToValueAtTime(0.12, t0 + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.58);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(t0); osc.stop(t0 + 0.6);
          });
          timers.push(setTimeout(() => {
            tiles.forEach((el, j) => el.classList.toggle('lit', j === idx));
          }, idx * 620));
        });
        timers.push(setTimeout(() => tiles.forEach(el => el.classList.remove('lit')), cur.seq.length * 620 + 200));
      } catch (e) {}
    }

    function render() {
      progRow.innerHTML = '';
      PROGS.forEach(p => {
        const b = document.createElement('button');
        b.className = p.id === cur.id ? 'toy-btn' : 'toy-btn secondary';
        b.textContent = p.name;
        b.onclick = () => { cur = p; render(); playProg(); };
        progRow.appendChild(b);
      });

      seqStrip.style.gridTemplateColumns = `repeat(${cur.seq.length}, 1fr)`;
      seqStrip.innerHTML = cur.seq.map(n => `<div class="chord-tile"><div style="font-size:15px;font-weight:900;color:var(--tax-ink);">${n.split(' ')[0]}</div><div style="font-size:11px;color:var(--tax-muted);margin-top:3px;">${n.split(' ')[1]}</div></div>`).join('');
      ahaBox.innerHTML = cur.aha;
    }

    document.getElementById('playBtn').onclick = playProg;
    render();
  </script>
</body>
</html>
