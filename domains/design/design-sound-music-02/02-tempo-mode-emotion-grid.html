<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧭 调式 × 速度二维情绪象限</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🧭 调式 × 速度二维情绪象限</h1><p>大调不一定是欢快的（慢速大调可以是庄严催泪的告别曲），小调也不一定是悲伤的（高速小调是热血沸腾的动漫战歌）！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>调式明亮度（0=深沉小调 ↔ 100=明亮大调）</span><span id="vMod">25%（小调）</span></label><input type="range" id="sMod" min="0" max="100" value="25" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>节拍速度 BPM（慢板 60 ↔ 疾速 160）</span><span id="vBpm">135 BPM</span></label><input type="range" id="sBpm" min="60" max="160" value="135" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 215"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当前音乐情绪象限</div><div class="k-val" id="kQd">—</div></div>
        <div class="kpi"><div class="k-lbl">典型电影配乐场景</div><div class="k-val" id="kScn">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const mod=+document.getElementById('sMod').value, bpm=+document.getElementById('sBpm').value;
  document.getElementById('vMod').textContent=mod+'%';
  document.getElementById('vBpm').textContent=bpm+' BPM';
  let qd, scn, col;
  if(mod>=50 && bpm>=110){ qd='🎉 欢快明朗（高唤醒+正效价）'; scn='夏日冒险、庆祝胜利'; col='#f59e0b'; }
  else if(mod>=50 && bpm<110){ qd='🌅 温暖治愈（低唤醒+正效价）'; scn='日落回忆、温柔摇篮曲'; col='#059669'; }
  else if(mod<50 && bpm>=110){ qd='⚔️ 紧张燃系（高唤醒+暗色调）'; scn='Boss 决战、悬疑追逐'; col='#ef4444'; }
  else { qd='🌧️ 悲伤寂寥（低唤醒+暗色调）'; scn='雨夜离别、深沉思念'; col='#3b82f6'; }
  document.getElementById('kQd').textContent=qd;
  document.getElementById('kQd').style.color=col;
  document.getElementById('kScn').textContent=scn;
  const px=80 + mod*4.4, py=188 - (bpm-60)*1.45;
  document.getElementById('svg').innerHTML=`
    <text x="80" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">拉塞尔情感模型：调式（横轴）× 速度 BPM（纵轴）</text>
    <rect x="80" y="38" width="440" height="150" rx="8" fill="var(--tax-border)" opacity="0.16"/>
    <line x1="300" y1="38" x2="300" y2="188" stroke="var(--tax-border)" stroke-dasharray="4,3"/>
    <line x1="80" y1="113" x2="520" y2="113" stroke="var(--tax-border)" stroke-dasharray="4,3"/>
    <text x="190" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#ef4444">⚔️ 燃系/紧张</text>
    <text x="410" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#d97706">🎉 欢快/明朗</text>
    <text x="190" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb">🌧️ 悲伤/忧郁</text>
    <text x="410" y="156" text-anchor="middle" font-size="12" font-weight="800" fill="#059669">🌅 温暖/宁静</text>
    <circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="10" fill="${col}" stroke="#fff" stroke-width="2.5"/>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>配乐师控制观众心跳的两个旋钮就是调式和 BPM：小调定色调、快拍拉心率，两者组合就能精准调配出任意复杂情绪！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
