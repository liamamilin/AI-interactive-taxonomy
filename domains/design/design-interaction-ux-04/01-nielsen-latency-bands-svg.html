<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>尼尔森三大延迟临界点仪（0.1s / 1s / 10s）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .test-stage {
      padding: 20px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border);
      text-align: center; margin-bottom: 12px;
    }
    .lamp {
      width: 68px; height: 68px; border-radius: 50%; margin: 0 auto 12px;
      background: rgba(148,163,184,0.22); border: 3px solid var(--tax-border);
      display: flex; align-items: center; justify-content: center; font-size: 28px; transition: background .08s, border-color .08s;
    }
    .lamp.on { background: rgba(16,185,129,0.28); border-color: var(--tax-green); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⏱️ 尼尔森三大延迟临界点仪：指尖实测盲测</h1>
      <p>可用性大师 Jakob Nielsen 总结了人类大脑感知延迟的 3 条物理红线：<strong>0.1 秒</strong>（瞬时直觉）、<strong>1.0 秒</strong>（思绪连续极限）、<strong>10 秒</strong>（注意力彻底流失）。切换下方延迟档位，亲自按下开关感受指尖体感！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row" id="delayRow"></div>

      <div class="test-stage">
        <div class="lamp" id="lamp">💡</div>
        <button class="toy-btn" id="triggerBtn">👇 点击测试开关响应手感</button>
        <div id="statusTxt" style="font-size:13px;color:var(--tax-muted);margin-top:10px;">当前已注入延迟：50 ms（0.05 秒）</div>
      </div>

      <svg id="bandSvg" viewBox="0 0 680 96" width="100%" style="display:block;border-radius:10px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="尼尔森延迟三区间标尺"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>动手体感：</strong>先点 <strong>50ms</strong>（感觉就像物理开关一样跟手），再切到 <strong>400ms</strong> 和 <strong>1600ms</strong>，亲自体验超过 1 秒不给反馈时心里涌起的“是不是死机了？”焦躁感！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const LEVELS = [
      { ms: 50,   name: '⚡ 50ms（< 0.1s 瞬时）', zone: '瞬时直觉区', col: 'var(--tax-green)',  aha: '<strong>< 0.1 秒（瞬时直觉区）：</strong>大脑完全察觉不到延迟，觉得是自己的手指直接推动了物体！无需任何 Loading 提示。' },
      { ms: 400,  name: '🟡 400ms（轻微粘滞）',   zone: '可察觉延迟区', col: 'var(--tax-primary)', aha: '<strong>0.1s – 1.0s（思绪连续区）：</strong>你能明显感觉到“慢半拍”失去了直接操纵感，但思绪还没断；超过 0.3s 最好给个按钮按下态反馈。' },
      { ms: 1600, name: '🟠 1.6s（> 1s 思绪中断）', zone: '心流打断区', col: 'var(--tax-amber)',   aha: '<strong>> 1.0 秒（心流打断红线！）：</strong>刚才等那 1.6 秒是不是特别难熬、甚至想再点一次？超过 1 秒必须立刻显示骨架屏或进度指示，否则用户就会怀疑卡死！' },
      { ms: 3200, name: '🔴 3.2s（逼近流失）',    zone: '焦躁弃用区', col: 'var(--tax-red)',     aha: '<strong>逼近 10 秒弃用红线：</strong>无反馈等待超过 3 秒，移动端 53% 的访客就会直接关闭页面！长任务必须提供明确进度条与预计剩余时间（甚至允许后台运行）。' }
    ];

    let cur = LEVELS[0], lampOn = false, busy = false, done = false;
    const delayRow = document.getElementById('delayRow');
    const lamp = document.getElementById('lamp');
    const statusTxt = document.getElementById('statusTxt');
    const svg = document.getElementById('bandSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      delayRow.innerHTML = '';
      LEVELS.forEach(lv => {
        const b = document.createElement('button');
        b.className = lv.ms === cur.ms ? 'toy-btn' : 'toy-btn secondary';
        b.textContent = lv.name;
        b.onclick = () => { cur = lv; statusTxt.textContent = `当前注入延迟：${lv.ms} ms，点击上方按钮体验手感！`; render(); };
        delayRow.appendChild(b);
      });

      const pct = cur.ms === 50 ? 12 : (cur.ms === 400 ? 40 : (cur.ms === 1600 ? 68 : 90));
      let html = '';
      html += `<rect x="24" y="34" width="180" height="22" rx="6" fill="rgba(16,185,129,0.28)"/>`;
      html += `<rect x="208" y="34" width="210" height="22" rx="6" fill="rgba(245,158,11,0.25)"/>`;
      html += `<rect x="422" y="34" width="234" height="22" rx="6" fill="rgba(239,68,68,0.25)"/>`;
      html += `<text x="114" y="49" text-anchor="middle" fill="var(--tax-green)" font-size="11" font-weight="800">< 0.1s 瞬时跟手</text>`;
      html += `<text x="313" y="49" text-anchor="middle" fill="var(--tax-amber)" font-size="11" font-weight="800">0.1s – 1.0s 保持连续</text>`;
      html += `<text x="539" y="49" text-anchor="middle" fill="var(--tax-red)" font-size="11" font-weight="800">> 1.0s – 10s 必须给进度</text>`;

      const mx = 24 + (pct / 100) * 632;
      html += `<circle cx="${mx}" cy="45" r="8" fill="${cur.col}" stroke="#fff" stroke-width="2.5"/>`;
      html += `<text x="${mx}" y="80" text-anchor="middle" fill="${cur.col}" font-size="12" font-weight="800">当前：${cur.ms}ms（${cur.zone}）</text>`;
      svg.innerHTML = html;
    }

    document.getElementById('triggerBtn').onclick = () => {
      if (busy) return;
      busy = true;
      statusTxt.textContent = cur.ms >= 1000 ? '⏳ 无声等待中…（感受焦虑感！）' : '响应中…';
      setTimeout(() => {
        lampOn = !lampOn;
        lamp.classList.toggle('on', lampOn);
        statusTxt.textContent = `✓ 耗时 ${cur.ms} ms 后才亮灯！（${cur.zone}）`;
        ahaBox.innerHTML = cur.aha;
        busy = false;
        markDone(`指尖实测了尼尔森延迟阈值：${cur.ms}ms`);
      }, cur.ms);
    };

    render();
  </script>
</body>
</html>
