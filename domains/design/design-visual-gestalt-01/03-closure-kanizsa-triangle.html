<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>闭合原则：卡尼萨幻觉三角形</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ctrl-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .slider-box { flex: 1; min-width: 220px; padding: 8px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔺 闭合原则：卡尼萨幻觉三角形模拟器</h1>
      <p>下面画布里<strong>根本没有画任何白色的三角形</strong>，只有 3 个缺口圆盘（吃豆人）和 3 个折角。拖动旋转角度让缺口偏离中心，亲眼看那个“发光的白色三角形”如何瞬间蒸发！</p>
    </header>

    <section class="toy-card">
      <div class="ctrl-bar">
        <div class="slider-box">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
            <span>🔄 旋转吃豆人缺口角度</span>
            <strong id="angVal" style="color:var(--tax-primary);">0°（完美对齐·幻觉拉满）</strong>
          </div>
          <input type="range" id="angRange" min="0" max="60" value="0" style="width:100%;" />
        </div>
        <button class="toy-btn secondary" id="proofBtn">🔬 叠加真实矢量轮廓</button>
      </div>

      <svg id="kanSvg" viewBox="0 0 680 265" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="卡尼萨幻觉三角形演示"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>闭合原则（Closure）：</strong>大脑极度讨厌“残缺的形状”，会自动在空无一物的背景上脑补出完整轮廓。把角度拖到 30° 试试，幻觉瞬间破碎！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const angRange = document.getElementById('angRange');
    const angVal = document.getElementById('angVal');
    const proofBtn = document.getElementById('proofBtn');
    const svg = document.getElementById('kanSvg');
    const ahaBox = document.getElementById('ahaBox');

    let showProof = false;
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function pacmanPath(cx, cy, r, startDeg, endDeg) {
      const s = (startDeg * Math.PI) / 180;
      const e = (endDeg * Math.PI) / 180;
      const x1 = cx + r * Math.cos(s), y1 = cy + r * Math.sin(s);
      const x2 = cx + r * Math.cos(e), y2 = cy + r * Math.sin(e);
      return `M ${cx} ${cy} L ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 1 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z`;
    }

    function render() {
      const rot = Number(angRange.value);
      angVal.textContent = rot === 0 ? '0°（完美对齐·幻觉拉满）' : `${rot}°（对齐破坏）`;

      // Equilateral triangle vertices centered at (340, 140), radius 88
      const cx = 340, cy = 142, R = 86;
      const pts = [
        { x: cx, y: cy - R, mouthCenter: 90 },
        { x: cx - R * Math.cos(Math.PI / 6), y: cy + R * Math.sin(Math.PI / 6), mouthCenter: -30 },
        { x: cx + R * Math.cos(Math.PI / 6), y: cy + R * Math.sin(Math.PI / 6), mouthCenter: 210 }
      ];

      // Background inverted wireframe triangle (broken by illusory white triangle)
      const inv = [
        [cx, cy + R],
        [cx - R * Math.cos(Math.PI / 6), cy - R * Math.sin(Math.PI / 6)],
        [cx + R * Math.cos(Math.PI / 6), cy - R * Math.sin(Math.PI / 6)]
      ];

      let html = '';
      // Inverted outline triangle behind
      html += `<polygon points="${inv.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--tax-ink)" stroke-width="3" opacity="0.65"/>`;

      // Cover center with background-colored triangle ONLY when rot===0 to create genuine Kanizsa cutout effect?
      // Better: draw the 3 Pac-Men with genuine wedge cutouts AND broken corners so there is literally NO triangle fill!
      // Erase segments of inverted triangle near the illusory edges using matching surface-alt mask only for the 3 line segments
      html += `<polygon points="${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}" fill="var(--tax-surface-alt)"/>`;

      // Draw 3 Pac-Man circles (mouth opening = 60 deg centered at mouthCenter + rot)
      pts.forEach(p => {
        const mc = p.mouthCenter + rot;
        html += `<path d="${pacmanPath(p.x, p.y, 32, mc + 30, mc - 30)}" fill="var(--tax-ink)"/>`;
      });

      if (showProof) {
        html += `<polygon points="${pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="2" stroke-dasharray="5 4"/>`;
        html += `<text x="340" y="252" text-anchor="middle" fill="var(--tax-primary)" font-size="12" font-weight="700">虚线内 100% 是纯背景色，没有任何边线——亮度差完全是你大脑脑补出来的！</text>`;
      } else {
        html += `<text x="340" y="252" text-anchor="middle" fill="var(--tax-muted)" font-size="12">${rot <= 6 ? '👁️ 你是不是看见了一个比背景更亮的倒扣/正立三角形？' : '✨ 缺口一旦错位，幻觉三角形立刻消失，只剩 3 个普通圆盘！'}</text>`;
      }

      svg.innerHTML = html;

      if (rot >= 20) {
        ahaBox.innerHTML = '<strong>幻觉破碎！</strong>仅仅把 3 个圆盘转了 ' + rot + '°，刚才那块清晰无比的三角形就彻底消失了。这证明设计 Logo（如 WWF 熊猫、IBM 条纹）时，<strong>留出恰到好处的缺口</strong>能让观众大脑主动参与补全，记忆度反而翻倍！';
      } else if (showProof) {
        ahaBox.innerHTML = '<strong>主观轮廓（Illusory Contours）：</strong>大脑初级视皮层 V2 区的神经元真的会沿着缺口连线放电——哪怕那里一个像素都没有！';
      }
    }

    angRange.oninput = () => { markDone('旋转探索了卡尼萨幻觉三角形闭合原则'); render(); };
    proofBtn.onclick = () => {
      showProof = !showProof;
      proofBtn.textContent = showProof ? '🙈 隐藏矢量辅助线' : '🔬 叠加真实矢量轮廓';
      markDone('验证了卡尼萨幻觉三角形的主观轮廓');
      render();
    };
    render();
  </script>
</body>
</html>
