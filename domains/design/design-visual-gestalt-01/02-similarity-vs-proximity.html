<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ 相似原则 vs 接近原则：谁的分组拉力更强？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚡ 相似原则 vs 接近原则：谁的分组拉力更强？</h1><p>当一组图标距离很近、但颜色交替不同时，大脑会按颜色（相似）还是按距离（接近）分组？实验证明：空间接近通常略胜一筹，但强色彩对比也能反杀！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>组间物理拉开的间距差</span><span id="vGap">42 px</span></label><input type="range" id="sGap" min="0" max="80" value="42" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>同色标签的色彩对比强烈度</span><span id="vCol">75%</span></label><input type="range" id="sCol" min="10" max="100" value="75" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">主导视觉分组力量</div><div class="k-val" id="kWin">—</div></div>
        <div class="kpi"><div class="k-lbl">界面认知冲突度</div><div class="k-val" id="kCnf">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const gap=+document.getElementById('sGap').value, col=+document.getElementById('sCol').value;
  document.getElementById('vGap').textContent=gap+' px';
  document.getElementById('vCol').textContent=col+'%';
  const proxF=gap*1.25, simF=col*0.85;
  const win=proxF>simF+10?'📍 接近原则占优':(simF>proxF+10?'🎨 相似原则占优':'⚔️ 两者冲突，大脑打架!');
  const cnf=Math.round(Math.min(proxF,simF));
  document.getElementById('kWin').textContent=win;
  document.getElementById('kCnf').textContent=cnf+' 分';
  document.getElementById('kCnf').style.color=cnf>50?'#ef4444':'#059669';
  let items='';
  const cA=`hsl(215,${col}%,50%)`, cB=`hsl(25,${col}%,52%)`;
  for(let g=0;g<2;g++) for(let i=0;i<3;i++){
    const x=115 + g*(140+gap) + i*44;
    const fill=(i%2===0)?cA:cB;
    items+=`<rect x="${x}" y="76" width="32" height="32" rx="${i%2===0?16:6}" fill="${fill}"/>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="20" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">两组元素：距离把它们分成左右 2 团，颜色形状却把它们跨组相连</text>
    ${items}
    <text x="300" y="162" text-anchor="middle" font-size="11.5" fill="var(--tax-muted)">好设计要让“接近”和“相似”指向同一个分组方向，切忌让两者互相打架！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>如果两个按钮功能完全无关，千万别给它们涂成同一个显眼颜色——相似原则会骗用户以为它们是一伙的！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
