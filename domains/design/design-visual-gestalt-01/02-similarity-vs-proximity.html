<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>相似原则 vs 接近原则：谁的分组拉力更强？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚡ 相似原则 vs 接近原则：视觉拔河盲测</h1>
      <p>当<strong>“颜色/形状相似”</strong>和<strong>“空间距离接近”</strong>同时拉扯你的眼睛，究竟谁能赢？快速扫一眼下面 3 组图形，选出你第一直觉看到的分组方式！</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--tax-muted);">
        <span id="stageTag">盲测第 1 / 3 关</span>
        <span id="hintTag">只看 1 秒凭第一眼直觉作答</span>
      </div>

      <svg id="tugSvg" viewBox="0 0 680 210" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="相似原则与接近原则拔河盲测"></svg>

      <div class="btn-row" id="choiceRow"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>格式塔拔河实验：</strong>依次完成 3 关直觉测试，总结出 UI 设计师必须背熟的“完形力量排行榜”！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const ROUNDS = [
      {
        title: '第 1 关：间距均等 + 颜色按行交替',
        draw() {
          let s = '';
          for (let r = 0; r < 4; r++) {
            const col = r % 2 === 0 ? 'var(--tax-primary)' : 'var(--tax-amber)';
            for (let c = 0; c < 6; c++) {
              s += `<circle cx="${190 + c * 60}" cy="${42 + r * 42}" r="11" fill="${col}"/>`;
            }
          }
          return s;
        },
        aha: '<strong>第 1 关（相似原则接管）：</strong>当行列距离完全相等时，大脑立刻启用<strong>颜色相似性</strong>，把同色点自动归成 4 条横排！'
      },
      {
        title: '第 2 关：空间强列分组（竖着极近）vs 颜色按行交替',
        draw() {
          let s = '';
          for (let c = 0; c < 4; c++) {
            const cx = 155 + c * 124;
            for (let r = 0; r < 4; r++) {
              const col = r % 2 === 0 ? 'var(--tax-primary)' : 'var(--tax-amber)';
              s += `<circle cx="${cx}" cy="${44 + r * 36}" r="11" fill="${col}"/>`;
            }
          }
          return s;
        },
        aha: '<strong>第 2 关（接近原则碾压相似原则！）：</strong>即使颜色是按横排交替的，只要竖向极近、横向极远，绝大多数人第一眼依然看成 <strong>4 条竖柱</strong>！格式塔研究证实：<strong>空间接近性 > 颜色/形状相似性</strong>。'
      },
      {
        title: '第 3 关：共同区域（外框卡片）vs 间距与颜色',
        draw() {
          let s = '';
          for (let g = 0; g < 2; g++) {
            const bx = 95 + g * 270;
            s += `<rect x="${bx}" y="38" width="220" height="134" rx="14" fill="rgba(59,130,246,0.10)" stroke="var(--tax-primary)" stroke-width="2"/>`;
            for (let r = 0; r < 2; r++) {
              for (let c = 0; c < 3; c++) {
                const col = (r + c) % 2 === 0 ? 'var(--tax-green)' : 'var(--tax-red)';
                s += `<circle cx="${bx + 44 + c * 66}" cy="${78 + r * 54}" r="11" fill="${col}"/>`;
              }
            }
          }
          return s;
        },
        aha: '<strong>终极法则揭晓（共同区域 > 接近 > 相似）：</strong>一旦加上卡片容器（共同区域 Common Region），就算里面元素五颜六色、间距松散，大脑也会毫不犹豫地把框内视为一组！这也是现代 App 普遍用卡片分区的原因。'
      }
    ];

    let idx = 0, done = false;
    const svg = document.getElementById('tugSvg');
    const choiceRow = document.getElementById('choiceRow');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const r = ROUNDS[idx];
      document.getElementById('stageTag').textContent = `盲测第 ${idx + 1} / 3 关 · ${r.title}`;
      svg.innerHTML = r.draw();
      choiceRow.innerHTML = '';

      const opts = idx === 2
        ? ['📦 左右 2 个大卡片组', '🎨 按红/绿颜色分组']
        : ['➖ 4 条横排（按颜色相似）', '❘ 4 条竖列（按空间接近）'];

      opts.forEach(txt => {
        const b = document.createElement('button');
        b.className = 'toy-btn secondary';
        b.textContent = txt;
        b.onclick = () => {
          ahaBox.innerHTML = r.aha;
          if (idx === ROUNDS.length - 1) {
            markDone('完成了格式塔相似与接近拔河三关盲测');
          }
          choiceRow.innerHTML = `<button class="toy-btn" id="nxtBtn">${idx < 2 ? '进入下一关 →' : '↺ 重新盲测'}</button>`;
          document.getElementById('nxtBtn').onclick = () => { idx = (idx + 1) % ROUNDS.length; render(); };
        };
        choiceRow.appendChild(b);
      });
    }

    render();
  </script>
</body>
</html>
