<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>视·听·触三感官同步微反馈仪</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .tog-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    @media (max-width: 600px) { .tog-row { grid-template-columns: 1fr; } }
    .tog-btn {
      padding: 10px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .tog-btn.on { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .pad-stage {
      padding: 28px; border-radius: 14px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border);
      text-align: center;
    }
    .big-key {
      width: 170px; height: 64px; border-radius: 16px; border: 2px solid var(--tax-primary);
      background: var(--tax-primary); color: #fff; font-size: 17px; font-weight: 900;
      cursor: pointer; position: relative; transition: transform .08s, box-shadow .12s;
      box-shadow: 0 6px 0 rgba(29,78,216,0.75);
    }
    @keyframes microShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
    }
    .shake { animation: microShake .11s linear; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>✨ 视·听·触三感官同步微反馈仪（多模态盲测）</h1>
      <p>为什么实体机械按键和苹果 Taptic Engine 让人按到上瘾？因为大脑把 <strong>50 毫秒内同时抵达的视觉 + 听觉 + 触觉</strong>融合为极致的“真实实体感”！分别开关三个通道，按下中央大按钮体验质感跃迁（请打开设备声音）：</p>
    </header>

    <section class="toy-card">
      <div class="tog-row">
        <button class="tog-btn" id="vBtn">○ 👁️ 视觉形变回弹：关</button>
        <button class="tog-btn" id="aBtn">○ 🔊 听觉清脆咔嗒声：关</button>
        <button class="tog-btn" id="hBtn">○ 📳 触觉微震脉冲：关</button>
      </div>

      <div class="pad-stage" id="padStage">
        <button class="big-key" id="bigKey">按下体验手感</button>
        <div id="feelTxt" style="font-size:13px;color:var(--tax-muted);margin-top:14px;">当前开启 0 / 3 感官通道（像按在死掉的玻璃板上）</div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>多模态同步实验：</strong>先在 0 通道下按一次（毫无反馈，甚至怀疑没点上）；再依次打开视觉、听觉（Web Audio 实时合成清脆开关声）与微震动，感受“死玻璃”变成“实体机械键”的魔法！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let chV = false, chA = false, chH = false, done = false;
    let audioCtx = null;

    const vBtn = document.getElementById('vBtn');
    const aBtn = document.getElementById('aBtn');
    const hBtn = document.getElementById('hBtn');
    const bigKey = document.getElementById('bigKey');
    const padStage = document.getElementById('padStage');
    const feelTxt = document.getElementById('feelTxt');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function playClickSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(680, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(190, audioCtx.currentTime + 0.035);
        gain.gain.setValueAtTime(0.22, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.045);
      } catch (e) {}
    }

    function renderToggles() {
      const cnt = [chV, chA, chH].filter(Boolean).length;
      vBtn.classList.toggle('on', chV);
      aBtn.classList.toggle('on', chA);
      hBtn.classList.toggle('on', chH);
      vBtn.textContent = (chV ? '✓ ' : '○ ') + '👁️ 视觉形变回弹：' + (chV ? '开' : '关');
      aBtn.textContent = (chA ? '✓ ' : '○ ') + '🔊 听觉清脆咔嗒声：' + (chA ? '开' : '关');
      hBtn.textContent = (chH ? '✓ ' : '○ ') + '📳 触觉微震脉冲：' + (chH ? '开' : '关');
      feelTxt.textContent = cnt === 0
        ? '当前开启 0 / 3 感官通道（毫无反馈，像戳死玻璃）'
        : `当前已同步开启 ${cnt} / 3 感官通道 —— 快按上方大按钮试试！`;
    }

    bigKey.onclick = () => {
      markDone('体验了视听触三感官同步微反馈');
      const cnt = [chV, chA, chH].filter(Boolean).length;

      if (chV) {
        bigKey.animate([
          { transform: 'translateY(0) scale(1)', boxShadow: '0 6px 0 rgba(29,78,216,0.75)' },
          { transform: 'translateY(5px) scale(0.96)', boxShadow: '0 1px 0 rgba(29,78,216,0.75)' },
          { transform: 'translateY(-1px) scale(1.02)', boxShadow: '0 7px 0 rgba(29,78,216,0.75)' },
          { transform: 'translateY(0) scale(1)', boxShadow: '0 6px 0 rgba(29,78,216,0.75)' }
        ], { duration: 190, easing: 'ease-out' });
      }
      if (chA) playClickSound();
      if (chH) {
        if (navigator.vibrate) navigator.vibrate(18);
        padStage.classList.remove('shake');
        void padStage.offsetWidth;
        padStage.classList.add('shake');
      }

      if (cnt === 3) {
        ahaBox.innerHTML = '<strong>三感官黄金同步（< 30ms 融合）！</strong>按下去的瞬间视觉下陷 + 清脆咔嗒声 + 轻微触觉脉冲同时抵达大脑，产生“像按动真实开关”的极高确定感！';
      } else if (cnt === 0) {
        ahaBox.innerHTML = '<strong>零反馈死玻璃感：</strong>刚才你点了按钮，但什么都没动、没响，大脑瞬间陷入“我点上了吗？”的怀疑！把上面三个感官通道全打开再按一次！';
      } else {
        ahaBox.innerHTML = `<strong>已开启 ${cnt} / 3 通道：</strong>手感明显活起来了！把 3 个通道全打开，体验多感官叠加的 1+1+1 > 3 协同效应！`;
      }
    };

    vBtn.onclick = () => { chV = !chV; renderToggles(); };
    aBtn.onclick = () => { chA = !chA; renderToggles(); };
    hBtn.onclick = () => { chH = !chH; renderToggles(); };
    renderToggles();
  </script>
</body>
</html>
