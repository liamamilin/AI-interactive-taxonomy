<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👍 微交互四步曲：触发 → 规则 → 反馈 → 循环</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>👍 微交互四步曲：触发 → 规则 → 反馈 → 循环</h1><p>丹·萨弗《微交互》：伟大的产品往往赢在微小细节——开关切换的弹跳、密码输错时的横向摇头、支付成功的清脆叮声，都在无声建立信任与愉悦。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>操作状态即时清晰度（成功/报错一目了然）</span><span id="vClr">85%</span></label><input type="range" id="sClr" min="10" max="100" value="85" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>品牌个性小彩蛋打磨度</span><span id="vJoy">70%</span></label><input type="range" id="sJoy" min="0" max="100" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">用户操作安全确信度</div><div class="k-val" id="kCnf">—</div></div>
        <div class="kpi"><div class="k-lbl">产品口碑好感度</div><div class="k-val" id="kLov">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const clr=+document.getElementById('sClr').value, joy=+document.getElementById('sJoy').value;
  document.getElementById('vClr').textContent=clr+'%';
  document.getElementById('vJoy').textContent=joy+'%';
  const lov=Math.min(99, Math.round(clr*0.65 + joy*0.35));
  document.getElementById('kCnf').textContent=clr+'%';
  document.getElementById('kLov').textContent=lov+' 分';
  document.getElementById('kLov').style.color=lov>=75?'#059669':'#f59e0b';
  const w=Math.max(15, lov*4.2);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">微交互好感度 = 清晰功能反馈 (${clr}%) + 恰到好处的愉悦彩蛋 (${joy}%)</text>
    <rect x="30" y="68" width="440" height="38" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="68" width="${w.toFixed(0)}" height="38" rx="8" fill="#059669"/>
    <text x="${Math.min(480,38+w).toFixed(0)}" y="93" font-size="14" font-weight="850" fill="#059669">${lov} 分</text>
    <text x="30" y="150" font-size="12" fill="var(--tax-muted)">例：密码输错时输入框轻轻左右晃动一下，比弹出一大段冷冰冰红字更符合人类直觉！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>功能决定用户“来不来”，而微交互细节决定用户“爱不爱用”——先保证清晰即时，再点缀克制的惊喜！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
