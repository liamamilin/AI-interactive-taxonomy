<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📳 微反馈的克制律：处处震动等于全屏噪音</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📳 微反馈的克制律：处处震动等于全屏噪音</h1><p>很多新手爱给每一次滑动、每一个按钮都加上叮咚音效和猛烈震动——不到 2 分钟，用户就会觉得烦躁不堪，直接去设置里一键全关！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>每分钟触发音效/震动的交互次数</span><span id="vFrq">4 次/分（仅关键节点）</span></label><input type="range" id="sFrq" min="1" max="30" value="4" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>单次震动/提示音的柔和克制度</span><span id="vSft">85%</span></label><input type="range" id="sSft" min="10" max="100" value="85" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">用户保留开启反馈率</div><div class="k-val" id="kKep">—</div></div>
        <div class="kpi"><div class="k-lbl">体验评价</div><div class="k-val" id="kEv">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const frq=+document.getElementById('sFrq').value, sft=+document.getElementById('sSft').value;
  document.getElementById('vFrq').textContent=frq+' 次/分';
  document.getElementById('vSft').textContent=sft+'%';
  const kep=Math.max(8, Math.min(96, Math.round(52 + sft*0.52 - Math.max(0, frq-5)*3.4)));
  const ev=kep>=75?'✨ 精致克制，爱不释手':(kep>=45?'⚠️ 略显啰嗦吵闹':'🔇 烦躁透顶，立刻关静音!');
  document.getElementById('kKep').textContent=kep+'%';
  document.getElementById('kKep').style.color=kep>=75?'#059669':'#ef4444';
  document.getElementById('kEv').textContent=ev;
  const w=Math.max(15, kep*4.2);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">用户愿意长期保留微反馈的比例（高频滥用直接劝退）</text>
    <rect x="30" y="68" width="440" height="38" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="68" width="${w.toFixed(0)}" height="38" rx="8" fill="${kep>=75?'#059669':'#ef4444'}"/>
    <text x="${Math.min(480,38+w).toFixed(0)}" y="93" font-size="14" font-weight="850" fill="${kep>=75?'#059669':'#ef4444'}">${kep}%</text>
    <text x="30" y="150" font-size="12" fill="var(--tax-muted)">把听觉和触觉微反馈留给真正有意义的“状态跃迁点”（支付成功、开关吸附、删除警告）！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>声音和震动就像做菜里的盐——撒一点提鲜，倒半袋就毁了整道菜！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
