<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌗 Z 轴海拔与真实物理阴影引擎（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌗 Z 轴海拔与真实物理阴影引擎（SVG）</h1><p>新手做阴影总爱画一圈死黑生硬的细边；真实光学里，卡片离桌面越高（如悬浮弹窗 vs 贴底卡片），投影向下偏移越大、模糊半径越大、透明度反而越柔和！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>卡片悬浮海拔高度 Z（dp）</span><span id="vZ">12 dp（悬浮弹窗）</span></label><input type="range" id="sZ" min="0" max="24" value="12" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>环境漫射光柔和度</span><span id="vAmb">70%</span></label><input type="range" id="sAmb" min="20" max="100" value="70" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">对应层级语义</div><div class="k-val" id="kSem">—</div></div>
        <div class="kpi"><div class="k-lbl">阴影物理参数</div><div class="k-val" id="kPar">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const z=+document.getElementById('sZ').value, amb=+document.getElementById('sAmb').value;
  document.getElementById('vZ').textContent=z+' dp';
  document.getElementById('vAmb').textContent=amb+'%';
  const dy=Math.round(z*0.9), blur=Math.round(z*1.1*(amb/70)), op=(z===0?0:Math.max(0.08, 0.28 - z*0.006)).toFixed(2);
  const sem=z===0?'📄 0dp 贴底平面':(z<=6?'🃏 卡片 / 按钮浮层':(z<=14?'🧭 下拉菜单 / 悬浮球':'🪟 顶级模态弹窗 Modal'));
  document.getElementById('kSem').textContent=sem;
  document.getElementById('kPar').textContent=`Y:${dy}px · 模糊:${blur}px · 透明度:${op}`;
  document.getElementById('svg').innerHTML=`
    <defs><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="${dy}" stdDeviation="${Math.max(0.5,blur*0.5).toFixed(1)}" flood-color="#0f172a" flood-opacity="${op}"/></filter></defs>
    <rect x="20" y="16" width="560" height="174" rx="12" fill="#f1f5f9"/>
    <rect x="170" y="${(54 - z*0.6).toFixed(1)}" width="260" height="96" rx="14" fill="#ffffff" filter="url(#sh)"/>
    <text x="300" y="${(100 - z*0.6).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="850" fill="#0f172a">Z = ${z} dp 悬浮卡片</text>
    <text x="300" y="${(124 - z*0.6).toFixed(1)}" text-anchor="middle" font-size="11.5" fill="#64748b">${sem}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>记住物理阴影口诀：“近小深实，远大浅虚”——用 Z 轴海拔隐喻帮用户一眼分清谁是底页、谁是临时弹出的浮层！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
