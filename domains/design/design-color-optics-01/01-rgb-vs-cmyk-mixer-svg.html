<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>加色光 vs 减色颜料实时混合台</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chan-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chan-btn {
      padding: 7px 13px; border-radius: 999px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .chan-btn.on { border-color: var(--tax-primary); background: var(--tax-primary-soft); color: var(--tax-primary); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔦 加色光 vs 减色颜料实时混合台（构建器）</h1>
      <p>屏幕发的是<strong>光（RGB 加色）</strong>，越叠加越亮，三光合一变纯白；纸张涂的是<strong>墨（CMYK 减色）</strong>，靠吸收光线反射剩余色，三墨合一变浑黑！亲手开关三原色通道体验截然相反的物理法则！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="rgbBtn">🔦 屏幕模式：RGB 加色光（黑底发光）</button>
        <button class="toy-btn secondary" id="cmyBtn">🎨 印刷模式：CMY 减色颜料（白纸吸光）</button>
      </div>

      <div class="chan-row" id="chanRow"></div>

      <svg id="mixSvg" viewBox="0 0 680 245" width="100%" style="display:block;border-radius:12px;border:1px solid var(--tax-border);" aria-label="RGB与CMY三原色混合维恩图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>混合观察：</strong>当前处于 RGB 加色模式，3 束色光全开时正中央叠加出<strong>纯白光</strong>！试着单独关掉蓝光（留红+绿），看看屏幕是如何造出亮黄色的，再切到 CMY 印刷模式对比！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let mode = 'rgb';
    const ch = { a: true, b: true, c: true };
    let done = false;

    const chanRow = document.getElementById('chanRow');
    const svg = document.getElementById('mixSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('rgbBtn').className = mode === 'rgb' ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('cmyBtn').className = mode === 'cmy' ? 'toy-btn' : 'toy-btn secondary';

      const labels = mode === 'rgb'
        ? [{ k: 'a', name: '🔴 红光 R' }, { k: 'b', name: '🟢 绿光 G' }, { k: 'c', name: '🔵 蓝光 B' }]
        : [{ k: 'a', name: '🩵 青墨 C' }, { k: 'b', name: '🩷 品红墨 M' }, { k: 'c', name: '💛 黄墨 Y' }];

      chanRow.innerHTML = '';
      labels.forEach(item => {
        const b = document.createElement('button');
        b.className = 'chan-btn' + (ch[item.k] ? ' on' : '');
        b.textContent = (ch[item.k] ? '✓ ' : '○ ') + item.name;
        b.onclick = () => { ch[item.k] = !ch[item.k]; markDone(`切换了${mode.toUpperCase()}通道混合`); render(); };
        chanRow.appendChild(b);
      });

      const isRgb = mode === 'rgb';
      const bg = isRgb ? '#0b1020' : '#f1f5f9';
      const blend = isRgb ? 'screen' : 'multiply';
      const cols = isRgb ? ['#ff2a2a', '#18e04d', '#246bff'] : ['#00c8ff', '#ff1fa9', '#ffe600'];
      const textCol = isRgb ? '#e2e8f0' : '#0f172a';

      // Center overlap result description
      const activeCnt = [ch.a, ch.b, ch.c].filter(Boolean).length;
      let centerDesc = '';
      if (isRgb) {
        if (activeCnt === 3) centerDesc = '红 + 绿 + 蓝 = ⚪ 纯白光（能量相加至满）';
        else if (ch.a && ch.b) centerDesc = '红光 + 绿光 = 💛 亮黄色（屏幕就是这样造黄的！）';
        else if (ch.a && ch.c) centerDesc = '红光 + 蓝光 = 🩷 洋红色（Magenta）';
        else if (ch.b && ch.c) centerDesc = '绿光 + 蓝光 = 🩵 青色（Cyan）';
        else if (activeCnt === 1) centerDesc = '单色光照射（暗室背景保持纯黑）';
        else centerDesc = '全部光源关闭 = ⬛ 绝对黑暗';
      } else {
        if (activeCnt === 3) centerDesc = '青 + 品红 + 黄 = ⬛ 深暗黑（三层墨吸光，实际需补 K 黑墨）';
        else if (ch.a && ch.b) centerDesc = '青墨 + 品红墨 = 🔵 靛蓝色（吸收红与绿）';
        else if (ch.a && ch.c) centerDesc = '青墨 + 黄墨 = 🟢 翠绿色（吸收红与蓝）';
        else if (ch.b && ch.c) centerDesc = '品红墨 + 黄墨 = 🔴 大红色（吸收绿与蓝）';
        else if (activeCnt === 1) centerDesc = '单层油墨滤光（仅反射对应波段）';
        else centerDesc = '无油墨 = ⬜ 纯白纸张（反射全部光线）';
      }

      let html = `<rect x="0" y="0" width="680" height="245" fill="${bg}"/>`;
      html += `<g style="isolation:isolate;">`;
      if (ch.a) html += `<circle cx="300" cy="105" r="66" fill="${cols[0]}" style="mix-blend-mode:${blend};"/>`;
      if (ch.b) html += `<circle cx="380" cy="105" r="66" fill="${cols[1]}" style="mix-blend-mode:${blend};"/>`;
      if (ch.c) html += `<circle cx="340" cy="158" r="66" fill="${cols[2]}" style="mix-blend-mode:${blend};"/>`;
      html += `</g>`;

      html += `<text x="340" y="22" text-anchor="middle" fill="${textCol}" font-size="13" font-weight="800">${isRgb ? '🔦 RGB 加色光模式（mix-blend: screen）' : '🎨 CMY 减色颜料模式（mix-blend: multiply）'}</text>`;
      html += `<text x="340" y="236" text-anchor="middle" fill="${textCol}" font-size="12.5" font-weight="700">${centerDesc}</text>`;
      svg.innerHTML = html;

      ahaBox.innerHTML = isRgb
        ? `<strong>RGB 加色原理：</strong>${centerDesc}。注意 RGB 两两叠加的中间色（青、品红、黄）恰好就是印刷 CMY 的三原色！`
        : `<strong>CMYK 减色原理：</strong>${centerDesc}。由于真实颜料不纯，C+M+Y 叠出来往往发褐发脏，所以印刷厂专门加了一管纯黑油墨 <strong>K（Key/Black）</strong>，这就是 CMYK 的由来！`;
    }

    document.getElementById('rgbBtn').onclick = () => { mode = 'rgb'; markDone('切换至RGB加色光模式'); render(); };
    document.getElementById('cmyBtn').onclick = () => { mode = 'cmy'; markDone('切换至CMY减色颜料模式'); render(); };
    render();
  </script>
</body>
</html>
