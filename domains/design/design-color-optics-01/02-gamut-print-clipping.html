<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🖨️ 印刷色域缩水：为什么霓虹亮蓝印出来就发灰？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🖨️ 印刷色域缩水：为什么霓虹亮蓝印出来就发灰？</h1><p>显示屏能发出极高纯度的荧光绿与电光蓝，但纸张油墨无法自己发光，一旦超出 CMYK 色域边界，印厂就会把它强行压暗裁平。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>屏幕设计稿色相（Hue）</span><span id="vHue">200°（电光蓝）</span></label><input type="range" id="sHue" min="0" max="360" value="200" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>屏幕设计稿饱和度（Saturation）</span><span id="vSat">95%</span></label><input type="range" id="sSat" min="15" max="100" value="95" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">CMYK 印刷保真度</div><div class="k-val" id="kFid">—</div></div>
        <div class="kpi"><div class="k-lbl">印前预警</div><div class="k-val" id="kWrn">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const hue=+document.getElementById('sHue').value, sat=+document.getElementById('sSat').value;
  document.getElementById('vHue').textContent=hue+'°';
  document.getElementById('vSat').textContent=sat+'%';
  const neonZone=(hue>=110 && hue<=260) ? 1.3 : 0.85;
  const clipSat=Math.min(sat, Math.round(74/neonZone));
  const loss=Math.max(0, sat - clipSat);
  const fid=Math.max(45, 100 - Math.round(loss*1.1));
  document.getElementById('kFid').textContent=fid+'%';
  document.getElementById('kFid').style.color=loss>18?'#ef4444':'#059669';
  document.getElementById('kWrn').textContent=loss>18?'⚠️ 严重溢色，印出来发灰!':'✅ 落在印刷安全色域内';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">左：屏幕 sRGB 预览色 vs 右：四色油墨 CMYK 实际印刷效果</text>
    <rect x="35" y="48" width="240" height="105" rx="12" fill="hsl(${hue},${sat}%,52%)"/>
    <text x="155" y="175" text-anchor="middle" font-size="12" font-weight="800" fill="var(--tax-text)">屏幕设计稿 (饱和度 ${sat}%)</text>
    <rect x="325" y="48" width="240" height="105" rx="12" fill="hsl(${hue},${clipSat}%,46%)"/>
    <text x="445" y="175" text-anchor="middle" font-size="12" font-weight="800" fill="${loss>18?'#ef4444':'#059669'}">实际印出 (被压至 ${clipSat}%)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>做海报、名片或包装时，提前打开 CMYK 软打样！纯度极高的荧光绿、电光紫和亮青是印刷翻车重灾区。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
