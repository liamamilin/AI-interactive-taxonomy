<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>同色异谱：屏幕根本没有黄光，为何你看见了黄？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .cone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .cone-card { padding: 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); text-align: center; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>👁️ 同色异谱：欺骗视锥细胞的光学魔术（模拟器）</h1>
      <p>你的手机屏幕只有红、绿、蓝三种灯珠，<strong>物理上完全发不出 580nm 的黄色光波</strong>！切换下方两种完全不同的物理光谱，观察你眼睛里 <strong>L / M / S 三种视锥细胞</strong>的放电比例为何一模一样！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="realBtn">☀️ 物理真黄光（单波长 580nm 钠灯）</button>
        <button class="toy-btn secondary" id="fakeBtn">📱 屏幕假黄光（650nm 红 + 530nm 绿）</button>
      </div>

      <svg id="specSvg" viewBox="0 0 680 205" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="同色异谱光谱与视锥响应对比"></svg>

      <div class="cone-grid">
        <div class="cone-card"><div style="font-size:12px;color:var(--tax-red);font-weight:700;">L 视锥（偏红长波）</div><div style="font-size:22px;font-weight:800;">86% 放电</div></div>
        <div class="cone-card"><div style="font-size:12px;color:var(--tax-green);font-weight:700;">M 视锥（偏绿中波）</div><div style="font-size:22px;font-weight:800;">82% 放电</div></div>
        <div class="cone-card"><div style="font-size:12px;color:var(--tax-primary);font-weight:700;">S 视锥（偏蓝短波）</div><div style="font-size:22px;font-weight:800;">3% 放电</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>同色异谱（Metamerism）：</strong>点击切换「☀️ 物理真黄光」和「📱 屏幕假黄光」——上方光谱仪截然不同，但底部三种视锥细胞读数<strong>纹丝不动</strong>，所以大脑坚信它们是完全相同的黄色！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let isFake = false;
    let done = false;

    const svg = document.getElementById('specSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('realBtn').className = !isFake ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('fakeBtn').className = isFake ? 'toy-btn' : 'toy-btn secondary';

      // Wavelength 400nm .. 700nm mapped to x: 50 .. 460
      const xOf = nm => 50 + ((nm - 400) / 300) * 410;

      let html = `
        <defs>
          <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="25%" stop-color="#06b6d4"/>
            <stop offset="48%" stop-color="#22c55e"/>
            <stop offset="62%" stop-color="#eab308"/>
            <stop offset="80%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#ef4444"/>
          </linearGradient>
        </defs>`;

      // Rainbow spectrum bar at bottom
      html += `<rect x="50" y="168" width="410" height="10" rx="5" fill="url(#rainbow)"/>`;
      [400, 480, 530, 580, 650, 700].forEach(nm => {
        html += `<text x="${xOf(nm)}" y="194" text-anchor="middle" fill="var(--tax-muted)" font-size="10.5">${nm}nm</text>`;
      });

      html += `<text x="255" y="24" text-anchor="middle" fill="var(--tax-ink)" font-size="13" font-weight="800">${isFake ? '📱 手机屏幕光谱：只有 530nm 绿峰 + 650nm 红峰（580nm 为 0！）' : '☀️ 物理真黄光光谱：唯一尖峰位于 580nm'}</text>`;

      if (!isFake) {
        const x580 = xOf(580);
        html += `<path d="M${x580 - 22} 168 Q${x580} 36 ${x580 + 22} 168 Z" fill="rgba(234,179,8,0.55)" stroke="#eab308" stroke-width="2.5"/>`;
        html += `<text x="${x580}" y="46" text-anchor="middle" fill="#eab308" font-size="11.5" font-weight="800">580nm 真黄光</text>`;
      } else {
        const x530 = xOf(530), x650 = xOf(650), x580 = xOf(580);
        html += `<path d="M${x530 - 20} 168 Q${x530} 48 ${x530 + 20} 168 Z" fill="rgba(34,197,94,0.5)" stroke="#22c55e" stroke-width="2.5"/>`;
        html += `<path d="M${x650 - 20} 168 Q${x650} 48 ${x650 + 20} 168 Z" fill="rgba(239,68,68,0.5)" stroke="#ef4444" stroke-width="2.5"/>`;
        html += `<line x1="${x580}" y1="88" x2="${x580}" y2="168" stroke="var(--tax-muted)" stroke-dasharray="4 3"/>`;
        html += `<text x="${x580}" y="80" text-anchor="middle" fill="var(--tax-muted)" font-size="11">580nm 能量 = 0！</text>`;
      }

      // Right side: Perceived color swatch (identical!)
      html += `<rect x="495" y="42" width="160" height="126" rx="14" fill="#facc15" stroke="var(--tax-border)" stroke-width="2"/>`;
      html += `<text x="575" y="100" text-anchor="middle" fill="#1e293b" font-size="15" font-weight="900">大脑主观看见</text>`;
      html += `<text x="575" y="122" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="700">100% 相同的明黄</text>`;
      svg.innerHTML = html;

      ahaBox.innerHTML = isFake
        ? '<strong>屏幕光学黑客：</strong>手机屏幕压根没有黄色 LED，它只是同时点亮红+绿像素，恰好把你眼里的 L 细胞和 M 细胞刺激到 86% / 82%！如果是一只有 4 种视锥细胞的鸟来看你的手机屏幕，它一眼就能看穿这只是“红绿拼接假黄”！'
        : '<strong>为什么人眼能被 RGB 三原色骗过？</strong>因为人类视网膜只有 L/M/S 三种色觉采样器，任何两种光谱只要激发出相同的三元组读数，在人脑里就是完全相同的颜色！点击「📱 屏幕假黄光」对比光谱！';
    }

    document.getElementById('realBtn').onclick = () => { isFake = false; markDone('对比了真黄光光谱'); render(); };
    document.getElementById('fakeBtn').onclick = () => { isFake = true; markDone('对比了屏幕红绿混合同色异谱假黄光'); render(); };
    render();
  </script>
</body>
</html>
