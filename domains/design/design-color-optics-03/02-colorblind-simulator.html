<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>红绿色盲视角模拟器：为什么别只靠颜色传信息</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .dash { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    @media (max-width: 600px) { .dash { grid-template-columns: 1fr; } }
    .srv-card {
      padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border);
      display: flex; align-items: center; justify-content: space-between; cursor: pointer;
    }
    .dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; }
    .sim-deut { filter: url(#deuteranopia); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🚦 红绿色盲视角盲测：为什么绝不能只靠颜色传信息？</h1>
      <p>全球约有 <strong>8% 的男性（每 12 人就有 1 位）</strong>存在红绿色觉异常！现在已为你戴上「红绿色盲模拟滤镜」——请立刻点出下面 3 台服务器中<strong>“宕机报错”</strong>的那一台！</p>
    </header>

    <!-- Hidden SVG Color Matrix for Deuteranopia simulation -->
    <svg width="0" height="0" style="position:absolute;">
      <defs>
        <filter id="deuteranopia">
          <feColorMatrix type="matrix" values="
            0.625 0.375 0 0 0
            0.700 0.300 0 0 0
            0     0.300 0.700 0 0
            0     0     0     1 0"/>
        </filter>
      </defs>
    </svg>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="visionBtn">👓 当前：红绿色盲视角（已开启）</button>
        <button class="toy-btn secondary" id="cueBtn">➕ 开启无障碍双编码（图标 + 文字）</button>
      </div>

      <div class="dash sim-deut" id="dashGrid"></div>

      <div id="fbBar" style="font-size:13px;color:var(--tax-muted);">盲测任务：点击上方你认为处于“红色宕机报警”的节点卡片！</div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>色觉盲测体验：</strong>在红绿色盲滤镜下，原本刺眼的红灯和绿灯全变成了几乎一样的<strong>土黄色</strong>！试试点击「➕ 开启无障碍双编码（图标 + 文字）」，看问题如何一秒彻底解决！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const NODES = [
      { id: 'n1', name: '支付网关 #01', status: 'ok',   color: '#16a34a', icon: '✓', text: '正常' },
      { id: 'n2', name: '订单核心 #02', status: 'err',  color: '#dc2626', icon: '✕', text: '宕机' },
      { id: 'n3', name: '消息队列 #03', status: 'warn', color: '#ca8a04', icon: '!', text: '延迟' }
    ];

    let simOn = true;
    let dualCue = false;
    let done = false;

    const dashGrid = document.getElementById('dashGrid');
    const visionBtn = document.getElementById('visionBtn');
    const cueBtn = document.getElementById('cueBtn');
    const fbBar = document.getElementById('fbBar');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      dashGrid.classList.toggle('sim-deut', simOn);
      visionBtn.textContent = simOn ? '👓 当前：红绿色盲视角（点此切正常色觉）' : '👁️ 当前：正常三色视觉（点此戴色盲滤镜）';
      cueBtn.textContent = dualCue ? '✓ 无障碍双编码：已开启（颜色+图标+文字）' : '➕ 开启无障碍双编码（图标 + 文字）';

      dashGrid.innerHTML = '';
      NODES.forEach(n => {
        const card = document.createElement('div');
        card.className = 'srv-card';
        card.innerHTML = `
          <div>
            <div style="font-weight:800;font-size:14px;">${n.name}</div>
            <div style="font-size:12px;color:var(--tax-muted);margin-top:2px;">${dualCue ? `状态：${n.text}` : '仅靠右侧圆点颜色表示'}</div>
          </div>
          <span class="dot" style="background:${n.color};">${dualCue ? n.icon : ''}</span>
        `;
        card.onclick = () => {
          markDone('完成了红绿色盲监控面板盲测');
          if (n.status === 'err') {
            fbBar.innerHTML = dualCue
              ? '🎯 <strong>秒选正确（订单核心 #02）！</strong>有了 ✕ 图标与“宕机”文字双编码，就算完全看不出红绿也能零误判！'
              : '🎯 <strong>你猜中了订单核心 #02！</strong>但在纯色点模式下，红/绿/黄在色盲眼里几乎全是同色土黄，全靠蒙！快开启双编码看看。';
          } else {
            fbBar.innerHTML = `💥 <strong>误判了！</strong>「${n.name}」其实是<strong>${n.text}</strong>，而不是红色宕机！在红绿色盲眼里这三个纯色点根本分不清。`;
          }
        };
        dashGrid.appendChild(card);
      });

      if (dualCue) {
        ahaBox.innerHTML = '<strong>WCAG 1.4.1 双重编码铁律：</strong>绝不能“仅用颜色”作为传递状态、报错或涨跌的唯一视觉手段！永远把<strong>颜色 + 形状图标（✓ / ✕ / ▲）+ 简短文字</strong>绑定使用，同时帮到色盲用户、黑白打印与强光屏幕！';
      }
    }

    visionBtn.onclick = () => { simOn = !simOn; markDone('切换了红绿色盲滤镜视角'); render(); };
    cueBtn.onclick = () => { dualCue = !dualCue; markDone('开启了无障碍双编码'); render(); };
    render();
  </script>
</body>
</html>
