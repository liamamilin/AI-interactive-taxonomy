<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>✨ 复节奏 3 对 4：两条脉冲交错出的魔幻网格</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>✨ 复节奏 3 对 4：两条脉冲交错出的魔幻网格</h1><p>左手每循环打 3 下，右手同时打 4 下，两者在最小公倍数 12 格里不断错位又在第 1 拍准时重逢——这就是非洲鼓乐和现代前卫音乐的几何魔力！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>声部 A（蓝色）每循环击打次数</span><span id="vA">3 拍</span></label><input type="range" id="sA" min="2" max="6" value="3" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>声部 B（橙色）每循环击打次数</span><span id="vB">4 拍</span></label><input type="range" id="sB" min="2" max="6" value="4" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">最小公倍数细网格</div><div class="k-val" id="kLcm">—</div></div>
        <div class="kpi"><div class="k-lbl">交错复节奏张力</div><div class="k-val" id="kTen">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function gcd(a,b){ return b===0?a:gcd(b,a%b); }
function draw(){
  const a=+document.getElementById('sA').value, b=+document.getElementById('sB').value;
  document.getElementById('vA').textContent=a+' 拍';
  document.getElementById('vB').textContent=b+' 拍';
  const lcm=(a*b)/gcd(a,b);
  const coprime=gcd(a,b)===1;
  document.getElementById('kLcm').textContent=lcm+' 细分格';
  document.getElementById('kTen').textContent=coprime?'✨ 互质交错，张力极强!':'⚖️ 倍数重合，平稳规整';
  let rowA='', rowB='';
  const step=480/lcm;
  for(let i=0;i<lcm;i++){
    const x=60+i*step;
    const hitA=(i%(lcm/a)===0), hitB=(i%(lcm/b)===0);
    rowA+=`<circle cx="${x.toFixed(1)}" cy="78" r="${hitA?9:3.5}" fill="${hitA?'#3b82f6':'#cbd5e1'}"/>`;
    rowB+=`<circle cx="${x.toFixed(1)}" cy="132" r="${hitB?9:3.5}" fill="${hitB?'#f97316':'#cbd5e1'}"/>`;
    if(hitA && hitB) rowA+=`<line x1="${x.toFixed(1)}" y1="62" x2="${x.toFixed(1)}" y2="148" stroke="#059669" stroke-dasharray="3,2" stroke-width="2"/>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="60" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">${a} 对 ${b} 复节奏时间网格（绿虚线 = 两声部齐齐重逢的强拍）</text>
    <text x="20" y="82" font-size="12" font-weight="800" fill="#2563eb">A(${a})</text>
    <text x="20" y="136" font-size="12" font-weight="800" fill="#ea580c">B(${b})</text>
    ${rowA}${rowB}
    <text x="60" y="180" font-size="11.5" fill="var(--tax-muted)">口诀体验 3 对 4：“Pass the god-damn but-ter”（两声部在第 1 拍重逢，中间完美错峰）！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>复节奏在“错位分离”与“周期重逢”之间循环往复，让大脑同时追踪两条时间线，产生奇妙的催眠推力！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
