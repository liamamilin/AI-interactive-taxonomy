<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>复节奏 3 对 4：两条脉冲交错出的魔幻网格</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .grid12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin-bottom: 8px; }
    .cell {
      padding: 10px 2px; border-radius: 7px; text-align: center; font-size: 11px; font-weight: 800;
      background: var(--tax-surface-alt); border: 1px solid var(--tax-border); color: var(--tax-muted);
    }
    .cell.a { background: rgba(59,130,246,0.22); border-color: var(--tax-primary); color: var(--tax-primary); }
    .cell.b { background: rgba(245,158,11,0.22); border-color: var(--tax-amber); color: var(--tax-amber); }
    .cell.now { box-shadow: 0 0 0 2px var(--tax-green); transform: scale(1.06); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>✨ 复节奏 3 对 4：最小公倍数 12 格交错构建器</h1>
      <p>左手匀速打 <strong>3 拍</strong>，右手在完全相同的时间里匀速打 <strong>4 拍</strong>——怎么算都不对劲？秘诀是找到最小公倍数 <strong>3 × 4 = 12 格</strong>！分别开关两条轨道并播放，听出非洲鼓与爵士乐的催眠交错网格！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="playBtn">▶ 播放 3 对 4 复节奏</button>
        <button class="toy-btn secondary" id="togA">✓ 轨道 A（3 拍 · 每 4 格响）</button>
        <button class="toy-btn secondary" id="togB">✓ 轨道 B（4 拍 · 每 3 格响）</button>
      </div>

      <div style="font-size:12px;color:var(--tax-primary);font-weight:700;margin-bottom:4px;">🔵 轨道 A：3 拍脉冲（第 1, 5, 9 格）</div>
      <div class="grid12" id="rowA"></div>

      <div style="font-size:12px;color:var(--tax-amber);font-weight:700;margin:8px 0 4px;">🟡 轨道 B：4 拍脉冲（第 1, 4, 7, 10 格）</div>
      <div class="grid12" id="rowB"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>3 对 4 记忆神口诀：</strong>把 12 格连起来听，两轨合奏的节奏刚好是英语 <strong>“Pass the god-damn but-ter”（第 1、4、5、7、9、10 格）</strong>！试着先单独听一轨，再把两轨同时打开，感受交错瞬间的魔幻张力！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let onA = true, onB = true, playing = false, step = 0, timer = null, ctx = null, done = false;
    const rowA = document.getElementById('rowA');
    const rowB = document.getElementById('rowB');
    const playBtn = document.getElementById('playBtn');
    const togA = document.getElementById('togA');
    const togB = document.getElementById('togB');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function beep(freq) {
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.18, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.1);
      } catch (e) {}
    }

    function render() {
      togA.textContent = (onA ? '✓ ' : '○ ') + '轨道 A（3 拍 · 每 4 格）';
      togB.textContent = (onB ? '✓ ' : '○ ') + '轨道 B（4 拍 · 每 3 格）';

      rowA.innerHTML = '';
      rowB.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const hitA = i % 4 === 0;
        const hitB = i % 3 === 0;
        const cA = document.createElement('div');
        cA.className = 'cell' + (hitA && onA ? ' a' : '') + (playing && step === i ? ' now' : '');
        cA.textContent = hitA ? '●' : (i + 1);
        rowA.appendChild(cA);

        const cB = document.createElement('div');
        cB.className = 'cell' + (hitB && onB ? ' b' : '') + (playing && step === i ? ' now' : '');
        cB.textContent = hitB ? '◆' : (i + 1);
        rowB.appendChild(cB);
      }
    }

    playBtn.onclick = () => {
      if (playing) {
        playing = false;
        clearInterval(timer);
        playBtn.textContent = '▶ 播放 3 对 4 复节奏';
        render();
        return;
      }
      playing = true;
      step = 0;
      playBtn.textContent = '⏸ 暂停复节奏';
      markDone('播放并体验了3对4复节奏12格网格');
      timer = setInterval(() => {
        if (onA && step % 4 === 0) beep(329.63); // E4
        if (onB && step % 3 === 0) beep(493.88); // B4
        render();
        step = (step + 1) % 12;
      }, 145);
    };

    togA.onclick = () => { onA = !onA; markDone('切换了复节奏A轨'); render(); };
    togB.onclick = () => { onB = !onB; markDone('切换了复节奏B轨'); render(); };
    render();
  </script>
</body>
</html>
