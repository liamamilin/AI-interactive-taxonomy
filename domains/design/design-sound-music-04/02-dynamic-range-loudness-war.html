<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>响度战争灾难：把动态全压扁为何听着累？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .s-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>📢 响度战争灾难：高动态波形 vs 砖墙压扁（对决）</h1>
      <p>90 年代起唱片公司为了在电台里“比别人更响”，用限幅器把整首歌的动态范围（轻柔与高潮的落差）狠狠压成一块<strong>密不透风的矩形砖墙</strong>！对比两种波形与试听体验：</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="dynBtn">✅ 试听：高动态范围（DR14 · 有呼吸起伏）</button>
        <button class="toy-btn secondary" id="brickBtn">💥 试听：砖墙过度压缩（DR3 · 全程轰炸）</button>
      </div>

      <svg id="waveSvg" viewBox="0 0 680 190" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="响度战争高动态与砖墙波形对比"></svg>

      <div class="cards">
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">🟢 高动态母带（DR14）</div><strong style="color:var(--tax-green);">副歌爆发力极强 · 听 1 小时不累</strong></div>
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">🔴 砖墙压缩母带（DR3）</div><strong style="color:var(--tax-red);">无轻重落差 · 削波失真 · 3 分钟耳鸣疲劳</strong></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>响度战争终结者（LUFS 响度归一化）：</strong>当一切声音都一样响时，高潮就失去了冲击力！如今 Spotify、Apple Music 等平台强制执行 <strong>−14 LUFS 响度统一</strong>，把砖墙压扁的歌强行调小音量后反而显得又扁又没劲，好动态终于重新胜出！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let brick = false, ctx = null, done = false;
    const svg = document.getElementById('waveSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function playDemo(isBrick) {
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const notes = [261.63, 329.63, 392.00, 523.25];
        const vols = isBrick ? [0.24, 0.25, 0.25, 0.26] : [0.05, 0.08, 0.14, 0.28];
        notes.forEach((f, i) => {
          const t0 = now + i * 0.28;
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = isBrick ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(f, t0);
          g.gain.setValueAtTime(vols[i], t0);
          g.gain.exponentialRampToValueAtTime(isBrick ? 0.14 : 0.01, t0 + 0.25);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(t0); osc.stop(t0 + 0.26);
        });
      } catch (e) {}
    }

    function draw() {
      document.getElementById('dynBtn').className = !brick ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('brickBtn').className = brick ? 'toy-btn' : 'toy-btn secondary';

      let html = '';
      // Ceiling lines
      html += `<line x1="30" y1="36" x2="650" y2="36" stroke="var(--tax-red)" stroke-dasharray="4 4" opacity="0.55"/>`;
      html += `<line x1="30" y1="164" x2="650" y2="164" stroke="var(--tax-red)" stroke-dasharray="4 4" opacity="0.55"/>`;
      html += `<text x="646" y="28" text-anchor="end" fill="var(--tax-red)" font-size="11">0 dBFS 削波天花板</text>`;

      // Waveform bars
      const bars = 62;
      for (let i = 0; i < bars; i++) {
        const x = 34 + i * 10;
        // Natural verse (quiet) -> chorus (loud) envelope
        const env = i < 20 ? 0.28 : (i < 38 ? 0.55 : 0.95);
        const raw = env * (0.45 + 0.55 * Math.abs(Math.sin(i * 1.7)));
        const h = brick ? Math.min(62, raw * 150 + 38) : raw * 62;
        const clipped = brick && h >= 60;
        const col = brick ? (clipped ? 'var(--tax-red)' : 'var(--tax-amber)') : 'var(--tax-green)';
        html += `<rect x="${x}" y="${(100 - h).toFixed(1)}" width="6" height="${(h * 2).toFixed(1)}" rx="2" fill="${col}"/>`;
      }

      html += `<text x="34" y="182" fill="var(--tax-muted)" font-size="11">主歌轻声（铺垫呼吸）</text>`;
      html += `<text x="480" y="182" fill="var(--tax-muted)" font-size="11">副歌高潮（瞬间释放！）</text>`;
      svg.innerHTML = html;

      ahaBox.innerHTML = brick
        ? '<strong>砖墙削波灾难（DR3）：</strong>连轻声主歌都被强行顶到 0 dBFS 天花板削平，耳膜全程承受持续高能量轰炸，不仅听 3 分钟就头晕疲劳，真正的副歌进来时反而完全没了爆发力！'
        : '<strong>高动态呼吸感（DR14）：</strong>主歌轻柔克制、副歌瞬间冲顶，大落差让听觉神经持续保持新鲜与震撼——这和视觉排版里的“对比留白”是同一条底层美学定律！';
    }

    document.getElementById('dynBtn').onclick = () => { brick = false; markDone('试听了高动态范围波形'); draw(); playDemo(false); };
    document.getElementById('brickBtn').onclick = () => { brick = true; markDone('试听了砖墙过度压缩波形'); draw(); playDemo(true); };
    draw();
  </script>
</body>
</html>
