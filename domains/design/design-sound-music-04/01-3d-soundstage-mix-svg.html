<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>混音三维声场工作台：声像 × 混响 × 频段</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    svg .inst-node { cursor: pointer; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎧 混音三维声场工作台：声像 × 纵深 × 频段（空间混音）</h1>
      <p>顶级混音师把耳机里的声音当成一座<strong>三维舞台</strong>：左右靠<strong>声像（Pan）</strong>拉开，远近靠<strong>混响干湿比（Reverb）</strong>推远，上下靠<strong>高中低频段</strong>分层！对比“挤成一团”与“立体分离”：</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn secondary" id="mudBtn">💥 灾难混音：全挤在正中央打架（浑浊）</button>
        <button class="toy-btn" id="proBtn">🎧 格莱美级声场：三维清晰分离</button>
      </div>

      <svg id="stageSvg" viewBox="0 0 680 245" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="三维混音声场舞台空间图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>三维声场铁律：</strong>底鼓与贝斯低频能量最大，必须锁死在<strong>正中央底座</strong>；主唱干声贴脸居中；吉他、键盘与和声往<strong>左右声道 + 后方混响空间</strong>散开，瞬间从“广场舞音响”升级成“沉浸音乐厅”！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const PRO_POS = [
      { id: 'vox',  name: '🎤 主唱',     x: 340, y: 158, r: 28, col: 'var(--tax-primary)', info: '居中贴脸（干声为主，核心主角）' },
      { id: 'bass', name: '🥁 底鼓+贝斯', x: 340, y: 204, r: 24, col: 'var(--tax-green)',   info: '正中底部（低频单声道最稳）' },
      { id: 'gtr',  name: '🎸 电吉他',    x: 145, y: 124, r: 24, col: 'var(--tax-amber)',   info: '左声道 65%（避开主唱中频打架）' },
      { id: 'keys', name: '🎹 合成器',    x: 535, y: 124, r: 24, col: 'var(--tax-amber)',   info: '右声道 65%（与吉他形成立体对称）' },
      { id: 'pad',  name: '🎻 弦乐混响',  x: 340, y: 66,  r: 30, col: 'var(--tax-red)',     info: '远景后场（加 45% 混响推远营造包裹感）' }
    ];

    const MUD_POS = [
      { id: 'vox',  name: '🎤 主唱',     x: 332, y: 132, r: 26, col: 'var(--tax-primary)', info: '被吉他和弦乐死死盖住！' },
      { id: 'bass', name: '🥁 底鼓+贝斯', x: 348, y: 146, r: 24, col: 'var(--tax-green)',   info: '与所有乐器挤在同一个单声道点' },
      { id: 'gtr',  name: '🎸 电吉他',    x: 318, y: 142, r: 24, col: 'var(--tax-amber)',   info: '中频直接撞上主唱人声！' },
      { id: 'keys', name: '🎹 合成器',    x: 358, y: 126, r: 24, col: 'var(--tax-amber)',   info: '完全没有左右声场宽度' },
      { id: 'pad',  name: '🎻 弦乐混响',  x: 340, y: 118, r: 28, col: 'var(--tax-red)',     info: '混响糊在最前面，整首歌发闷' }
    ];

    let isPro = true, selected = null, done = false;
    const svg = document.getElementById('stageSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('proBtn').className = isPro ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('mudBtn').className = !isPro ? 'toy-btn' : 'toy-btn secondary';

      let html = '';
      // Soundstage semicircular arcs (Near / Mid / Far Reverb Depth)
      html += `<path d="M 60 220 A 280 190 0 0 1 620 220" fill="none" stroke="var(--tax-border)" stroke-dasharray="5 4"/>`;
      html += `<path d="M 155 220 A 185 125 0 0 1 525 220" fill="none" stroke="var(--tax-border)" stroke-dasharray="5 4"/>`;
      html += `<text x="340" y="24" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5">↑ 远景纵深（混响越湿越靠后 · 空间感）</text>`;
      html += `<text x="38" y="135" fill="var(--tax-muted)" font-size="11.5">← 左声道 L</text>`;
      html += `<text x="642" y="135" text-anchor="end" fill="var(--tax-muted)" font-size="11.5">右声道 R →</text>`;
      html += `<text x="340" y="238" text-anchor="middle" fill="var(--tax-ink)" font-size="11.5" font-weight="700">🎧 听众双耳位置（近景干声区）</text>`;

      const list = isPro ? PRO_POS : MUD_POS;
      list.forEach(item => {
        const hi = selected === item.id;
        html += `<g class="inst-node" data-id="${item.id}">`;
        html += `<circle cx="${item.x}" cy="${item.y}" r="${item.r}" fill="${item.col}" opacity="${isPro ? 0.25 : 0.35}" stroke="${item.col}" stroke-width="${hi ? 3.5 : 2}"/>`;
        html += `<text x="${item.x}" y="${item.y + 4}" text-anchor="middle" fill="var(--tax-ink)" font-size="11" font-weight="800">${item.name}</text>`;
        html += `</g>`;
      });

      svg.innerHTML = html;
      svg.querySelectorAll('.inst-node').forEach(g => {
        g.onclick = () => {
          selected = g.dataset.id;
          const it = list.find(x => x.id === selected);
          markDone(`查看了声场乐器定位：${it.name}`);
          ahaBox.innerHTML = `<strong>${it.name} 声场定位：</strong>${it.info}`;
          render();
        };
      });
    }

    document.getElementById('proBtn').onclick = () => { isPro = true; selected = null; markDone('切换至三维分离声场'); ahaBox.innerHTML = '<strong>三维分离声场（清晰通透）：</strong>5 件乐器错开左右声像与前后混响纵深，彼此不抢同一个频段位置，每件乐器都颗粒分明！点击任意乐器圆圈查看混音细节。'; render(); };
    document.getElementById('mudBtn').onclick = () => { isPro = false; selected = null; markDone('对比了单点浑浊声场'); ahaBox.innerHTML = '<strong>声场打架灾难（浑浊发闷）：</strong>所有乐器全堆在正中央同一深度，产生严重的<strong>频率掩蔽效应（Masking）</strong>，人声被电吉他和混响彻底淹没！'; render(); };
    render();
  </script>
</body>
</html>
