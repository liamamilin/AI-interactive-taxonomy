<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎧 混音三维声场工作台：声像 × 混响 × 频段（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎧 混音三维声场工作台：声像 × 混响 × 频段（SVG）</h1><p>顶级混音师在立体声里盖房子：左右声像（Pan）定宽度，混响湿声（Reverb）定前后景深，高/低频分配定上下高度！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>吉他左右声像摆位（-100左 ↔ +100右）</span><span id="vPan">-55 (偏左)</span></label><input type="range" id="sPan" min="-100" max="100" value="-55" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>空间混响比例 Reverb（越小越贴耳，越大越远）</span><span id="vRev">40%</span></label><input type="range" id="sRev" min="0" max="100" value="40" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 210"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">听觉距离感</div><div class="k-val" id="kDst">—</div></div>
        <div class="kpi"><div class="k-lbl">声场分离度</div><div class="k-val" id="kSep">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const pan=+document.getElementById('sPan').value, rev=+document.getElementById('sRev').value;
  document.getElementById('vPan').textContent=pan===0?'0 (正中)':(pan<0?pan+' (左耳)':'+'+pan+' (右耳)');
  document.getElementById('vRev').textContent=rev+'%';
  const dst=rev<20?'🎤 贴耳干声（极其亲密）':(rev<60?'🏛️ 音乐厅中景':'🌌 辽阔大教堂远景');
  const sep=Math.min(98, Math.round(35 + Math.abs(pan)*0.55 + (100-rev)*0.15));
  document.getElementById('kDst').textContent=dst;
  document.getElementById('kSep').textContent=sep+' 分';
  document.getElementById('kSep').style.color=sep>=65?'#059669':'#f59e0b';
  const gx=300 + pan*2.1, gy=155 - rev*1.05;
  const halo=14 + rev*0.32;
  document.getElementById('svg').innerHTML=`
    <text x="20" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">立体声舞台俯视图（下方 = 听众双耳，上方 = 音乐厅深处）</text>
    <rect x="60" y="36" width="480" height="148" rx="12" fill="#0f172a"/>
    <circle cx="300" cy="148" r="14" fill="#38bdf8"/>
    <text x="300" y="175" text-anchor="middle" font-size="11" font-weight="800" fill="#38bdf8">主唱+底鼓 (稳居中前)</text>
    <circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="${halo.toFixed(1)}" fill="#f59e0b" opacity="0.22"/>
    <circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="12" fill="#f59e0b"/>
    <text x="${gx.toFixed(1)}" y="${(gy-16).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#fde047">吉他 (声像 ${pan})</text>
    <text x="75" y="175" font-size="11" fill="#94a3b8">◀ 左声道 L</text>
    <text x="525" y="175" text-anchor="end" font-size="11" fill="#94a3b8">右声道 R ▶</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>如果把所有乐器都塞在正中间且拉满混响，就会糊成一锅粥；拉宽声像、给主唱留干声、给背景铺混响，3D 声场瞬间立体！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
