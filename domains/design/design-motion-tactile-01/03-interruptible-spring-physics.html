<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>为什么苹果动画中途打断依然丝滑？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .lane-box { padding: 12px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 10px; }
    .track { position: relative; height: 42px; border-radius: 999px; background: var(--tax-surface); border: 1px solid var(--tax-border); margin-top: 6px; }
    .orb { position: absolute; top: 5px; width: 32px; height: 32px; border-radius: 50%; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>✋ 为什么苹果动画中途打断依然丝滑？（盲测手感）</h1>
      <p><strong>连续快速疯狂点击下方【↔️ 切换目标方向】按钮</strong>（不要等动画播完！）：仔细盯住上方的「传统 CSS 贝塞尔动画」和下方的「物理弹簧动量动画」，瞬间看穿谁在抽搐折返、谁在丝滑过弯！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="flipBtn">↔️ 快速连续点我（中途打断！）</button>
        <span id="cntTxt" style="font-size:13px;color:var(--tax-muted);">中途打断次数：0</span>
      </div>

      <div class="lane-box">
        <div style="font-size:12.5px;font-weight:700;color:var(--tax-red);">❌ 传统时长贝塞尔动画（每次打断速度强行清零重启，生硬顿挫！）</div>
        <div class="track" id="trBad"><div class="orb" id="orbBad" style="left:8px;background:var(--tax-red);"></div></div>
      </div>

      <div class="lane-box">
        <div style="font-size:12.5px;font-weight:700;color:var(--tax-green);">✅ 物理弹簧动量引擎（保留当前速度矢量，优雅拐出惯性圆弧！）</div>
        <div class="track" id="trGood"><div class="orb" id="orbGood" style="left:8px;background:var(--tax-green);"></div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>手感秘密：</strong>普通用户滑动 App 抽屉时经常滑到一半反悔。快连点 5 次上方按钮，亲眼看绿色弹簧球如何靠“保留惯性速度”碾压红色死板计时器！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const orbBad = document.getElementById('orbBad');
    const orbGood = document.getElementById('orbGood');
    const trGood = document.getElementById('trGood');
    const ahaBox = document.getElementById('ahaBox');

    let targetRight = false;
    let flips = 0, done = false;

    // Bad tween state (restarts from v=0 every click)
    let badX = 0, badStart = 0, badT0 = 0, badTarget = 0;
    // Good spring state (keeps continuous velocity v!)
    let goodX = 0, goodV = 0, goodTarget = 0;
    let last = performance.now();

    function loop(now) {
      const dt = Math.min(0.032, (now - last) / 1000);
      last = now;
      const maxX = Math.max(120, trGood.clientWidth - 46);

      // Update bad tween (fixed 800ms ease-in-out restarting at v=0)
      const p = Math.min(1, (now - badT0) / 800);
      const ease = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      badX = badStart + (badTarget - badStart) * ease;
      orbBad.style.left = (8 + badX * maxX).toFixed(1) + 'px';

      // Update good spring (stiffness=110, damping=14 -> preserves velocity!)
      const a = -110 * (goodX - goodTarget) - 14 * goodV;
      goodV += a * dt;
      goodX += goodV * dt;
      orbGood.style.left = (8 + Math.max(-0.04, Math.min(1.04, goodX)) * maxX).toFixed(1) + 'px';

      requestAnimationFrame(loop);
    }

    document.getElementById('flipBtn').onclick = () => {
      targetRight = !targetRight;
      flips++;
      document.getElementById('cntTxt').textContent = `中途打断次数：${flips}`;
      const tgt = targetRight ? 1 : 0;

      // Bad: hard reset velocity to 0!
      badStart = badX;
      badTarget = tgt;
      badT0 = performance.now();

      // Good: only change target, velocity remains continuous!
      goodTarget = tgt;

      if (flips >= 3) {
        if (!done) {
          done = true;
          if (window.ToySDK) window.ToySDK.markCompleted('实测了弹簧动画中途打断的动量连续性');
        }
        ahaBox.innerHTML = '<strong>为什么 iOS 让人觉得“玄学丝滑”？</strong>传统贝塞尔曲线写死了“耗时 0.8s”，中途改方向时速度瞬间断崖归零，眼睛立刻察觉卡顿；物理弹簧只追踪<strong>实时位置与速度</strong>，随时打断都能顺着惯性圆润掉头，100% 符合真实世界牛顿力学！';
      }
    };

    requestAnimationFrame(loop);
  </script>
</body>
</html>
