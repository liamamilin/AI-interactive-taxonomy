<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>入场用 Ease-Out，离场用 Ease-In</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .lane { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 10px; margin-bottom: 10px; }
    @media (max-width: 560px) { .lane { grid-template-columns: 1fr; } }
    .lane-track { position: relative; height: 38px; border-radius: 999px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); overflow: hidden; }
    .puck {
      position: absolute; top: 4px; left: 6px; width: 64px; height: 28px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; color: #fff;
    }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🚀 入场用 Ease-Out，离场用 Ease-In（三轨动效竞速）</h1>
      <p>同样耗时 <strong>650 毫秒</strong>抵达终点，为什么 <strong>Ease-Out（先猛冲后轻刹）</strong> 感觉比匀速快一倍？点击发射三轨竞速，亲自对比“入场”与“离场”该配哪条曲线！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="enterBtn">📥 播放入场竞速（弹出卡片）</button>
        <button class="toy-btn secondary" id="exitBtn">📤 播放离场竞速（滑走关闭）</button>
      </div>

      <div class="lane">
        <div style="font-size:13px;font-weight:700;color:var(--tax-muted);">🤖 Linear（匀速死板）</div>
        <div class="lane-track"><div class="puck" id="pLin" style="background:var(--tax-muted);">Linear</div></div>
      </div>
      <div class="lane">
        <div style="font-size:13px;font-weight:700;color:var(--tax-green);">⚡ Ease-Out（先快后慢）</div>
        <div class="lane-track"><div class="puck" id="pOut" style="background:var(--tax-green);">Ease-Out</div></div>
      </div>
      <div class="lane">
        <div style="font-size:13px;font-weight:700;color:var(--tax-amber);">🚀 Ease-In（先慢后快）</div>
        <div class="lane-track"><div class="puck" id="pIn" style="background:var(--tax-amber);">Ease-In</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>动效手感铁律：</strong>按下「📥 播放入场竞速」——3 个滑块精准在 0.65 秒同时撞线，但绿色 <strong>Ease-Out</strong> 一出发就瞬间冲出 70% 距离，大脑主观觉得它响应最快、最跟手！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const pLin = document.getElementById('pLin');
    const pOut = document.getElementById('pOut');
    const pIn  = document.getElementById('pIn');
    const ahaBox = document.getElementById('ahaBox');
    let raf = null, done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function runRace(isExit) {
      cancelAnimationFrame(raf);
      markDone(`播放了${isExit ? '离场' : '入场'}缓动曲线三轨竞速`);
      const maxX = Math.max(120, pLin.parentElement.clientWidth - 76);
      const dur = 680;
      const start = performance.now();

      function step(now) {
        const t = Math.min(1, (now - start) / dur);
        const fLin = t;
        const fOut = 1 - Math.pow(1 - t, 3.2);
        const fIn  = Math.pow(t, 3.2);

        const pos = v => isExit ? (maxX * (1 - v) + 6) : (6 + v * maxX);
        pLin.style.left = pos(fLin).toFixed(1) + 'px';
        pOut.style.left = pos(fOut).toFixed(1) + 'px';
        pIn.style.left  = pos(fIn).toFixed(1) + 'px';

        if (t < 1) raf = requestAnimationFrame(step);
      }
      raf = requestAnimationFrame(step);

      ahaBox.innerHTML = isExit
        ? '<strong>离场用 Ease-In（先轻启后加速冲出屏幕）：</strong>关闭弹窗或滑走卡片时，用户不再需要看清内容，黄色 Ease-In 像扔纸飞机一样顺势加速消失，干净利落绝不拖泥带水！'
        : '<strong>入场用 Ease-Out（先猛冲后优雅刹车）：</strong>菜单弹出时用户正急着看内容，绿色 Ease-Out 前 200ms 就冲完大半路程并温柔停稳；如果入场误用 Ease-In，前段磨磨蹭蹭会让 App 显得极其迟钝！';
    }

    document.getElementById('enterBtn').onclick = () => runRace(false);
    document.getElementById('exitBtn').onclick = () => runRace(true);
  </script>
</body>
</html>
