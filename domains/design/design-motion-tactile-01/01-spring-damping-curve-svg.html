<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>〰️ 弹簧物理阻尼曲线实验台（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>〰️ 弹簧物理阻尼曲线实验台（SVG）</h1><p>现实世界里没有物体会瞬间起步又瞬间刹停！iOS 与现代动效引擎全部采用真实弹簧微分方程，用刚度（k）和阻尼（c）控制手感。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>弹簧刚度 Stiffness（越大越迅猛）</span><span id="vK">180</span></label><input type="range" id="sK" min="40" max="360" step="10" value="180" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>阻尼系数 Damping（越小越 Q 弹回弹）</span><span id="vC">16</span></label><input type="range" id="sC" min="4" max="40" step="1" value="16" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 210"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">阻尼比 ζ（1.0=临界无过冲）</div><div class="k-val" id="kZ">—</div></div>
        <div class="kpi"><div class="k-lbl">动效物理手感</div><div class="k-val" id="kFeel">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const k=+document.getElementById('sK').value, c=+document.getElementById('sC').value;
  document.getElementById('vK').textContent=k;
  document.getElementById('vC').textContent=c;
  const z=c/(2*Math.sqrt(k));
  const feel=z<0.7?'🏀 活泼 Q 弹（明显过冲回弹）':(z<=1.05?'✨ 苹果级干脆优雅（微过冲/无抖动）':'🐢 过阻尼粘滞（略显沉重）');
  document.getElementById('kZ').textContent=z.toFixed(2);
  document.getElementById('kFeel').textContent=feel;
  let x=0, v=0, dt=0.02, pts=[];
  for(let i=0;i<=80;i++){
    const a=k*(1-x) - c*v;
    v+=a*dt; x+=v*dt;
    const px=45+i*6.3, py=172 - x*110;
    pts.push(`${px.toFixed(1)},${Math.max(26,Math.min(190,py)).toFixed(1)}`);
  }
  document.getElementById('svg').innerHTML=`
    <text x="45" y="24" font-size="13" font-weight="800" fill="var(--tax-text)">位移-时间响应曲线（绿虚线 = 目标终点 1.0，灰线 = 僵硬线性）</text>
    <line x1="45" y1="62" x2="555" y2="62" stroke="#059669" stroke-dasharray="5,4" stroke-width="1.5"/>
    <line x1="45" y1="172" x2="360" y2="62" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.5"/>
    <line x1="45" y1="172" x2="555" y2="172" stroke="var(--tax-border)" stroke-width="1.5"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <text x="45" y="194" font-size="11" fill="var(--tax-muted)">0s 起点</text>
    <text x="515" y="194" font-size="11" fill="var(--tax-muted)">1.6s</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>UI 动效的黄金阻尼比在 0.75~1.0 之间——既有自然惯性生命力，又不会像果冻一样晃个没完拖慢效率！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
