<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>迪士尼 12 法则：蓄力预备 → 主动作 → 过冲回正</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stage {
      position: relative; height: 150px; border-radius: 12px; background: var(--tax-surface-alt);
      border: 1px solid var(--tax-border); overflow: hidden;
    }
    .actor {
      position: absolute; bottom: 26px; left: 50%; width: 58px; height: 58px; border-radius: 14px;
      background: var(--tax-primary); transform: translateX(-50%);
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      transform-origin: bottom center;
    }
    .ground { position: absolute; bottom: 24px; left: 24px; right: 24px; height: 3px; background: var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🏹 迪士尼 12 法则：蓄力预备 → 主动作 → 过冲回正（构建器）</h1>
      <p>自然界里没有任何生物会凭空瞬移——人起跳前会先<strong>下蹲蓄力（Anticipation）</strong>，落地或到位时会略微<strong>过冲再回正（Overshoot）</strong>。亲手勾选这两项迪士尼动画法则，对比“死板电梯”与“皮克斯生命力”！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="playBtn">▶ 播放起跳动画</button>
        <button class="toy-btn secondary" id="antBtn">○ 启用蓄力预备（起跳前先下蹲）</button>
        <button class="toy-btn secondary" id="ovrBtn">○ 启用过冲回正（落地微弹缓冲）</button>
      </div>

      <div class="stage">
        <div class="ground"></div>
        <div class="actor" id="actor">🚀</div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>死板基准（0/2 法则）：</strong>现在方块像一台没有灵魂的直梯一样僵硬上下！点亮上方「蓄力预备」和「过冲回正」再点播放，看它瞬间活过来！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let useAnt = false, useOvr = false, done = false;
    const actor = document.getElementById('actor');
    const antBtn = document.getElementById('antBtn');
    const ovrBtn = document.getElementById('ovrBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function updateBtns() {
      antBtn.className = useAnt ? 'toy-btn' : 'toy-btn secondary';
      ovrBtn.className = useOvr ? 'toy-btn' : 'toy-btn secondary';
      antBtn.textContent = (useAnt ? '✓ ' : '○ ') + '蓄力预备（起跳前先下蹲）';
      ovrBtn.textContent = (useOvr ? '✓ ' : '○ ') + '过冲回正（到位微弹缓冲）';
    }

    function playAnim() {
      markDone('构建并播放了迪士尼蓄力预备与过冲动画');
      const frames = [];
      frames.push({ transform: 'translateX(-50%) translateY(0) scale(1, 1)', offset: 0 });
      if (useAnt) {
        frames.push({ transform: 'translateX(-50%) translateY(6px) scale(1.22, 0.78)', offset: 0.18 });
      }
      frames.push({ transform: 'translateX(-50%) translateY(-68px) scale(0.88, 1.15)', offset: useAnt ? 0.52 : 0.45 });
      if (useOvr) {
        frames.push({ transform: 'translateX(-50%) translateY(5px) scale(1.18, 0.84)', offset: 0.80 });
        frames.push({ transform: 'translateX(-50%) translateY(-6px) scale(0.96, 1.04)', offset: 0.91 });
      }
      frames.push({ transform: 'translateX(-50%) translateY(0) scale(1, 1)', offset: 1 });

      actor.animate(frames, { duration: 880, easing: 'ease-in-out' });

      if (useAnt && useOvr) {
        ahaBox.innerHTML = '<strong>迪士尼完整生命力（蓄力 + 过冲）：</strong>短短 0.15 秒的“反向蓄力”提前预告了即将发生的大动作，末尾的“微幅过冲回正”卸掉了机械急停感——这正是下拉刷新、图标弹出和游戏打击感让人上瘾的秘诀！';
      } else if (useAnt || useOvr) {
        ahaBox.innerHTML = '<strong>已经生动了不少！</strong>再把另一个法则也勾选上，感受“蓄力起势 → 爆发 → 缓冲回正”的三段式黄金节奏！';
      } else {
        ahaBox.innerHTML = '<strong>僵硬直梯感：</strong>没有任何预备动作和缓冲，直接生硬起停。试着把上面两个开关都打开再播放一次！';
      }
    }

    document.getElementById('playBtn').onclick = playAnim;
    antBtn.onclick = () => { useAnt = !useAnt; updateBtns(); playAnim(); };
    ovrBtn.onclick = () => { useOvr = !useOvr; updateBtns(); playAnim(); };
    updateBtns();
  </script>
</body>
</html>
