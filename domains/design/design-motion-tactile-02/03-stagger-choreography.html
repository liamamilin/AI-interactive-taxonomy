<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>交错编排（Stagger）：列表 30ms 级联波浪</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    @media (max-width: 560px) { .grid6 { grid-template-columns: repeat(2, 1fr); } }
    .card-tile {
      padding: 16px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border);
      text-align: center; font-weight: 800; font-size: 13.5px;
    }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🌊 交错编排（Stagger）：列表 35ms 级联波浪对决</h1>
      <p>6 张内容卡片依次进场时，把每张卡的启动时间错开短短 <strong>35 毫秒</strong>，就能把僵硬的“一整块砖砸进来”变成行云流水的波浪！对比下面 3 档交错间隔：</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn secondary" id="s0Btn">🧱 0ms 同步硬拍（一坨砸出）</button>
        <button class="toy-btn" id="s35Btn">🌊 35ms 黄金级联波浪</button>
        <button class="toy-btn secondary" id="s180Btn">🐢 180ms 过慢拖沓（急死人）</button>
      </div>

      <div class="grid6" id="grid6">
        <div class="card-tile">卡片 #1</div>
        <div class="card-tile">卡片 #2</div>
        <div class="card-tile">卡片 #3</div>
        <div class="card-tile">卡片 #4</div>
        <div class="card-tile">卡片 #5</div>
        <div class="card-tile">卡片 #6</div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>交错编排甜点区（20ms – 50ms）：</strong>点击上面 3 个按钮反复对比！35ms 既能让眼睛捕捉到优雅的先后韵律，又保证总时长控制在 0.45 秒以内，绝不拖慢操作节奏！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const tiles = [...document.querySelectorAll('.card-tile')];
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function play(delayMs) {
      [0, 35, 180].forEach(d => {
        document.getElementById(`s${d}Btn`).className = d === delayMs ? 'toy-btn' : 'toy-btn secondary';
      });

      tiles.forEach((el, i) => {
        el.animate([
          { opacity: 0, transform: 'translateY(18px) scale(0.95)' },
          { opacity: 1, transform: 'translateY(0) scale(1)' }
        ], {
          duration: 320,
          delay: i * delayMs,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
          fill: 'both'
        });
      });

      const total = 320 + 5 * delayMs;
      if (delayMs === 0) {
        ahaBox.innerHTML = `<strong>0ms 同步硬拍（总耗时 ${total}ms）：</strong>6 张卡片黏成一整块板砖同时弹出，缺少层次引导，显得生硬廉价。试试点「🌊 35ms 黄金级联波浪」！`;
      } else if (delayMs === 35) {
        ahaBox.innerHTML = `<strong>35ms 黄金级联（总耗时仅 ${total}ms）！</strong>像微风吹过麦浪一样引导视线从 #1 顺滑扫到 #6，既有精致呼吸感又完全不耽误交互！长列表记得给交错封顶（超过 8 项后不再叠加延迟）。`;
      } else {
        ahaBox.innerHTML = `<strong>180ms 过度表演（总耗时高达 ${(total / 1000).toFixed(2)} 秒！）：</strong>设计师觉得很酷炫，但每天看 50 遍的真实用户只想砸键盘！记住：<strong>好看的动效永远不能让用户等它播完</strong>！`;
      }
    }

    document.getElementById('s0Btn').onclick = () => { markDone('对比了0ms同步硬拍入场'); play(0); };
    document.getElementById('s35Btn').onclick = () => { markDone('体验了35ms黄金交错波浪'); play(35); };
    document.getElementById('s180Btn').onclick = () => { markDone('对比了180ms过慢拖沓交错'); play(180); };
  </script>
</body>
</html>
