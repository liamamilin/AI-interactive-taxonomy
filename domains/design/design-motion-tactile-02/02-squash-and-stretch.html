<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>挤压与拉伸：体积守恒赋予材质重量感</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stage {
      position: relative; height: 205px; border-radius: 12px; background: var(--tax-surface-alt);
      border: 1px solid var(--tax-border); overflow: hidden;
    }
    .floor { position: absolute; bottom: 20px; left: 24px; right: 24px; height: 3px; background: var(--tax-border); }
    .ball {
      position: absolute; left: 50%; width: 54px; height: 54px; border-radius: 50%;
      transform-origin: bottom center;
    }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚽ 挤压与拉伸（Squash &amp; Stretch）：体积守恒模拟器</h1>
      <p>不需要改任何贴图材质——只需控制撞地瞬间的<strong>压扁幅度（保持宽 × 高 = 1 体积守恒）</strong>，同一个圆球就能在“沉重铁保龄球”、“弹性篮球”和“Q 弹果冻球”三种物理材质间任意切换！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="mJelly">🍮 软果冻（55% 夸张体积守恒）</button>
        <button class="toy-btn secondary" id="mBasket">🏀 弹性篮球（22% 适度弹性）</button>
        <button class="toy-btn secondary" id="mSteel">🪨 铁保龄球（0% 零形变死硬）</button>
        <button class="toy-btn secondary" id="dropBtn">⬇️ 重新丢下弹跳</button>
      </div>

      <div class="stage">
        <div class="floor"></div>
        <div class="ball" id="ball" style="bottom:23px;background:var(--tax-primary);transform:translateX(-50%);"></div>
        <div id="matLabel" style="position:absolute;top:12px;left:16px;font-size:12.5px;font-weight:800;color:var(--tax-primary);">当前材质：软果冻 · 触地形变 scaleX=1.45, scaleY=0.69（面积 ≈ 1.00 守恒）</div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>体积守恒铁律（<code>scaleX × scaleY = 1</code>）：</strong>压扁多少高度，就必须往左右挤出多少宽度！如果只压扁高度却不加宽，物体看起来就像“凭空缩水漏气了”，材质质感瞬间穿帮！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const MATS = {
      jelly:  { name: '软果冻', col: '#10b981', sx: 1.48, sy: 0.68, stretchX: 0.80, stretchY: 1.25, dur: 920, aha: '<strong>软果冻（55% 形变，体积守恒）：</strong>下落加速时拉长成水滴、撞地瞬间扁成大饼（宽 1.48 × 高 0.68 ≈ 1.00），大脑瞬间感知到轻盈柔软的弹性！' },
      basket: { name: '弹性篮球', col: '#f97316', sx: 1.22, sy: 0.82, stretchX: 0.91, stretchY: 1.10, dur: 780, aha: '<strong>弹性篮球（22% 适度形变）：</strong>保留清晰的球体刚性，只在撞地一刹那微扁 18%，是 UI 按钮按压回弹最常用的舒适弹性区间！' },
      steel:  { name: '铁保龄球', col: '#64748b', sx: 1.00, sy: 1.00, stretchX: 1.00, stretchY: 1.00, dur: 580, aha: '<strong>铁保龄球（0% 形变）：</strong>完全不做挤压拉伸，落到地上“咚”一声死死砸住——你甚至没听到声音，光看运动规律就能感觉它重达 10 公斤！' }
    };

    let cur = 'jelly', done = false;
    const ball = document.getElementById('ball');
    const matLabel = document.getElementById('matLabel');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function drop() {
      const m = MATS[cur];
      ['jelly', 'basket', 'steel'].forEach(k => {
        const id = k === 'jelly' ? 'mJelly' : (k === 'basket' ? 'mBasket' : 'mSteel');
        document.getElementById(id).className = cur === k ? 'toy-btn' : 'toy-btn secondary';
      });
      ball.style.background = m.col;
      matLabel.textContent = `当前材质：${m.name} · 触地形变 scaleX=${m.sx.toFixed(2)}, scaleY=${m.sy.toFixed(2)}（积 = ${(m.sx * m.sy).toFixed(2)}）`;
      ahaBox.innerHTML = m.aha;

      const bounceH = cur === 'steel' ? 12 : (cur === 'basket' ? 76 : 96);
      ball.animate([
        { bottom: '132px', transform: 'translateX(-50%) scale(1, 1)', offset: 0 },
        { bottom: '36px',  transform: `translateX(-50%) scale(${m.stretchX}, ${m.stretchY})`, offset: 0.36 },
        { bottom: '23px',  transform: `translateX(-50%) scale(${m.sx}, ${m.sy})`, offset: 0.44 },
        { bottom: `${23 + bounceH}px`, transform: `translateX(-50%) scale(${m.stretchX}, ${m.stretchY})`, offset: 0.72 },
        { bottom: '23px',  transform: `translateX(-50%) scale(${1 + (m.sx - 1) * 0.4}, ${1 - (1 - m.sy) * 0.4})`, offset: 0.90 },
        { bottom: '23px',  transform: 'translateX(-50%) scale(1, 1)', offset: 1 }
      ], { duration: m.dur, easing: 'ease-in-out' });
    }

    document.getElementById('mJelly').onclick = () => { cur = 'jelly'; markDone('体验了果冻材质体积守恒挤压拉伸'); drop(); };
    document.getElementById('mBasket').onclick = () => { cur = 'basket'; markDone('体验了篮球适度挤压拉伸'); drop(); };
    document.getElementById('mSteel').onclick = () => { cur = 'steel'; markDone('对比了铁球零形变重量感'); drop(); };
    document.getElementById('dropBtn').onclick = () => { markDone('重播了挤压拉伸弹跳'); drop(); };
    drop();
  </script>
</body>
</html>
