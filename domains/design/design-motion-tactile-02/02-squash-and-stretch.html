<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ 挤压与拉伸：体积守恒赋予材质重量感</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚽ 挤压与拉伸：体积守恒赋予材质重量感</h1><p>迪士尼动画最核心法则：物体撞地被压扁时，横向必须同步变宽以保持面积/体积不变（W × H = 常数）！否则观众会觉得物体凭空缩水了！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>触地瞬间垂直压扁程度</span><span id="vSq">35%</span></label><input type="range" id="sSq" min="0" max="55" value="35" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>是否遵守体积守恒（横向同步鼓出）</span><span id="vVol">100% 守恒</span></label><input type="range" id="sVol" min="0" max="100" value="100" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">物理材质暗示</div><div class="k-val" id="kMat">—</div></div>
        <div class="kpi"><div class="k-lbl">体积真实感</div><div class="k-val" id="kTru">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const sq=+document.getElementById('sSq').value, vol=+document.getElementById('sVol').value;
  document.getElementById('vSq').textContent=sq+'%';
  document.getElementById('vVol').textContent=vol+'%';
  const r0=44;
  const ry=r0*(1 - sq/100);
  const rxIdeal=(r0*r0)/ry;
  const rx=r0 + (rxIdeal - r0)*(vol/100);
  const mat=sq<8?'🎳 坚硬保龄球/金属':(sq<30?'🏀 弹性篮球':'🍮 Q 弹果冻/水球');
  document.getElementById('kMat').textContent=mat;
  document.getElementById('kTru').textContent=vol>=80?'✅ 体积守恒极逼真':'⚠️ 像漏气缩水一样违和';
  document.getElementById('kTru').style.color=vol>=80?'#059669':'#ef4444';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">静态原球（左）vs 触地挤压瞬间（右，底边贴紧地面）</text>
    <line x1="40" y1="166" x2="560" y2="166" stroke="var(--tax-border)" stroke-width="2.5"/>
    <circle cx="165" cy="${166-r0}" r="${r0}" fill="#94a3b8" opacity="0.45"/>
    <text x="165" y="188" text-anchor="middle" font-size="11.5" fill="var(--tax-muted)">原始圆形 (rx=${r0}, ry=${r0})</text>
    <ellipse cx="420" cy="${(166-ry).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="#3b82f6"/>
    <text x="420" y="188" text-anchor="middle" font-size="11.5" font-weight="800" fill="#2563eb">触地变形 (rx=${rx.toFixed(0)}, ry=${ry.toFixed(0)})</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>挤压拉伸的铁律是“压矮多少，就得拉宽多少”——保持视觉质量守恒，哪怕是一个圆点也能活灵活现！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
