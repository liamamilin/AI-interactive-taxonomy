<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>字体气质情绪切换器：同一句话两种人格</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .stage-box {
      padding: 30px 20px; border-radius: 14px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border);
      text-align: center; transition: all .25s;
    }
    .quote-main { font-size: 32px; line-height: 1.35; color: var(--tax-ink); margin-bottom: 10px; }
    .quote-sub { font-size: 13px; color: var(--tax-muted); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🖋️ 字体气质情绪切换器：同一句话，四种人格（模拟器）</h1>
      <p>字体的笔画末端、粗细对比与几何结构，就像说话人的<strong>声线与穿着</strong>。同样一句“我永远会找到你”，一键切换 4 种字体家族，听听它在你脑中瞬间变成了浪漫情书还是系统告警！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row" id="fontRow"></div>

      <div class="stage-box">
        <div class="quote-main" id="quoteMain">我永远会找到你。</div>
        <div class="quote-sub" id="quoteSub"></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>字体即语气：</strong>依次点击上方 4 种字体人格，体会不改一个标点符号、仅靠字形就彻底改写品牌信任感与情绪氛围的魔力！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const VOICES = [
      {
        id: 'serif', name: '🏛️ 衬线体（宋体 / Georgia）',
        ff: 'Georgia, "Songti SC", "Noto Serif SC", STSong, serif',
        weight: 600, ls: '1.5px',
        vibe: '气质：典雅、文学、权威、历久弥新（像《纽约时报》或高奢珠宝）',
        aha: '<strong>衬线体（Serif）人格：</strong>笔画末端的小装饰“衬线”源自古罗马石碑雕刻与活字印刷，天生自带<strong>历史底蕴、文学感与高定奢华</strong>！'
      },
      {
        id: 'sans', name: '📱 无衬线体（黑体 / Inter）',
        ff: '-apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif',
        weight: 800, ls: '-0.5px',
        vibe: '气质：现代、客观、清爽、科技感（像苹果官网与现代 SaaS 界面）',
        aha: '<strong>无衬线体（Sans-Serif）人格：</strong>剃掉所有装饰脚、笔画粗细均匀，传递<strong>高效、克制、零废话</strong>的现代科技感，是数字界面的绝对主力！'
      },
      {
        id: 'mono', name: '💻 等宽代码体（Monospace）',
        ff: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
        weight: 700, ls: '0px',
        vibe: '气质：精密、冷峻、工程硬核、终端指令（瞬间像电影黑客追踪！）',
        aha: '<strong>等宽体（Monospace）人格：</strong>每个字符占据严格相等的宽度，天生散发<strong>机械精密感与极客硬核氛围</strong>——同一句表白换上等宽体，瞬间像终端系统发出的警告！'
      },
      {
        id: 'cursive', name: '✍️ 温润楷书 / 手写韵味',
        ff: '"Kaiti SC", "STKaiti", "BiauKai", KaiTi, cursive, serif',
        weight: 500, ls: '2px',
        vibe: '气质：亲切、手工温度、东方诗意、私密信笺',
        aha: '<strong>手写/楷体人格：</strong>保留毛笔或钢笔的起落顿挫，瞬间拉近人与人的心理距离，最适合茶饮、文创、情书与独立手作包装。'
      }
    ];

    let cur = VOICES[0], done = false;
    const fontRow = document.getElementById('fontRow');
    const quoteMain = document.getElementById('quoteMain');
    const quoteSub = document.getElementById('quoteSub');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      fontRow.innerHTML = '';
      VOICES.forEach(v => {
        const b = document.createElement('button');
        b.className = v.id === cur.id ? 'toy-btn' : 'toy-btn secondary';
        b.textContent = v.name;
        b.onclick = () => { cur = v; markDone(`体验了字体气质切换：${v.name}`); render(); };
        fontRow.appendChild(b);
      });

      quoteMain.style.fontFamily = cur.ff;
      quoteMain.style.fontWeight = cur.weight;
      quoteMain.style.letterSpacing = cur.ls;
      quoteSub.textContent = cur.vibe;
      ahaBox.innerHTML = cur.aha;
    }

    render();
  </script>
</body>
</html>
