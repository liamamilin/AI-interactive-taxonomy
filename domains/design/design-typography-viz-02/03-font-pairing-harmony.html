<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>字体混搭黄金律：对比而非撞衫</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .pair-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    @media (max-width: 640px) { .pair-grid { grid-template-columns: 1fr; } }
    .p-card {
      text-align: left; padding: 14px; border-radius: 12px; border: 2px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .p-card:hover { border-color: var(--tax-primary); }
    .p-card.good { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .p-card.bad { border-color: var(--tax-red); background: var(--tax-red-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🤝 字体混搭黄金律：对比而非撞衫（情景评审）</h1>
      <p>杂志与官网需要混搭两种字体来制造层次感。面对下面 3 份由实习生提交的<strong>「标题 + 正文」混搭方案</strong>，请你作为设计总监挑出唯一符合<strong>“清晰对比原则”</strong>的过关稿！</p>
    </header>

    <section class="toy-card">
      <div class="pair-grid" id="pairGrid"></div>
      <div id="verdictTxt" style="font-size:13.5px;font-weight:700;color:var(--tax-muted);">点击上方 3 张方案卡进行总监评审</div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>混搭铁律（Contrast, Not Conflict）：</strong>要么只用<strong>同一个超级字体家族</strong>的不同字重，要么选<strong>气质截然相反</strong>的两种字体（衬线标题 + 无衬线正文）——最忌讳选两种长得 90% 相似的字体“尴尬撞衫”！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CARDS = [
      {
        id: 'c1', tag: '方案 A · 优雅衬线 + 清爽无衬线', ok: true,
        hStyle: 'font-family:Georgia,"Songti SC",serif;font-size:21px;font-weight:700;',
        bStyle: 'font-family:-apple-system,"PingFang SC",sans-serif;font-size:13px;line-height:1.6;color:var(--tax-muted);',
        title: '秋季建筑美学特展',
        body: '用经典衬线体撑起主标题的艺术气场，用干净的无衬线体保证正文信息在手机屏幕上极速可读。',
        fb: '✅ 满分过关（黄金对比）！标题的古典优雅与正文的现代清爽形成强烈互补，既拉开了层次又绝不打架！'
      },
      {
        id: 'c2', tag: '方案 B · 两种极相似无衬线混用', ok: false,
        hStyle: 'font-family:Arial,sans-serif;font-size:19px;font-weight:700;',
        bStyle: 'font-family:Verdana,"PingFang SC",sans-serif;font-size:13px;line-height:1.6;color:var(--tax-muted);',
        title: '秋季建筑美学特展',
        body: '标题用 Arial，正文换了个长得几乎一模一样的 Verdana——读者说不清哪不对，只觉得像忘统一字体的半成品。',
        fb: '❌ 尴尬撞衫（Conflict）！两种长得太像的字体混在一起，不仅没有层次对比，反而像不小心粘贴了不同来源的文字！'
      },
      {
        id: 'c3', tag: '方案 C · 楷体 + 等宽 + 粗黑大乱炖', ok: false,
        hStyle: 'font-family:"Kaiti SC",cursive;font-size:22px;font-weight:700;',
        bStyle: 'font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.6;color:var(--tax-muted);',
        title: '秋季建筑美学特展',
        body: '标题走古代书画风，正文突然切进冰冷代码终端体，再塞进三种不同风格——人格分裂！',
        fb: '❌ 情绪冲突（马戏团效应）！一个页面最多不超过 2 种字体家族，且情绪基调必须为同一个主题服务。'
      }
    ];

    let picked = null, done = false;
    const pairGrid = document.getElementById('pairGrid');
    const verdictTxt = document.getElementById('verdictTxt');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      pairGrid.innerHTML = '';
      CARDS.forEach(c => {
        const b = document.createElement('button');
        b.className = 'p-card' + (picked === c.id ? (c.ok ? ' good' : ' bad') : '');
        b.innerHTML = `
          <div style="font-size:11.5px;color:var(--tax-primary);font-weight:700;margin-bottom:8px;">${c.tag}</div>
          <div style="${c.hStyle}margin-bottom:8px;">${c.title}</div>
          <div style="${c.bStyle}">${c.body}</div>
        `;
        b.onclick = () => {
          picked = c.id;
          markDone(`评审了字体混搭方案：${c.tag}`);
          verdictTxt.textContent = c.fb;
          verdictTxt.style.color = c.ok ? 'var(--tax-green)' : 'var(--tax-red)';
          ahaBox.innerHTML = c.ok
            ? '<strong>总监级审美！</strong>“衬线标题 + 无衬线正文”（或反之）是历经百年考验的百搭公式；如果你拿不准怎么混搭，<strong>全站只用 1 种优质无衬线体 + 字号/字重拉差</strong>永远是最稳妥的高手方案！'
            : '<strong>避坑提醒：</strong>字体混搭不是“越多越高级”。记住“对比而非撞衫”——再点一下方案 A 感受古典标题与现代正文的黄金反差！';
          render();
        };
        pairGrid.appendChild(b);
      });
    }

    render();
  </script>
</body>
</html>
