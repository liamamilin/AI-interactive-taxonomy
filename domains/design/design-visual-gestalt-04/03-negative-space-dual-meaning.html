<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>图底反转：FedEx 隐藏箭头与负空间巧思</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>➡️ 图底反转：隐藏箭头与负空间盲测</h1>
      <p>顶级平面设计不只是在画“主体（图）”，而是把<strong>背景空隙（底）</strong>也雕刻成第二个隐藏图形！先在 5 秒内自己找找下面两张图里的隐藏彩蛋，再点按钮高亮揭晓！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="tab1Btn">彩蛋 1：字母空隙里的隐藏箭头</button>
        <button class="toy-btn secondary" id="tab2Btn">彩蛋 2：鲁宾花瓶图底反转</button>
        <button class="toy-btn secondary" id="revealBtn">🔦 高亮揭晓负空间彩蛋</button>
      </div>

      <svg id="negSvg" viewBox="0 0 680 230" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="负空间与图底反转演示"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>5 秒眼力盲测：</strong>盯住右边橙色字母 <strong>E</strong> 和 <strong>x</strong> 之间的空白缝隙——你看见一个向右飞驰的隐藏图形了吗？点击「🔦 高亮揭晓」验证！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let tab = 1;
    let revealed = false;
    let done = false;

    const svg = document.getElementById('negSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('tab1Btn').className = tab === 1 ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('tab2Btn').className = tab === 2 ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('revealBtn').textContent = revealed ? '🙈 还原原始画面' : '🔦 高亮揭晓负空间彩蛋';

      let html = '';
      if (tab === 1) {
        // Stylized geometric "EX" where negative space between E and x forms a crisp right-pointing arrow!
        // Draw E (x: 190..310, y: 46..184) and x (x: 310..445, y: 84..184) tightly kerned
        html += `<g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="900">`;
        // Custom vector "Fed" style blue text on left
        html += `<text x="115" y="164" font-size="96" fill="var(--tax-primary)" letter-spacing="-4">Fast</text>`;
        // Vector E
        html += `<path d="M330 62 H418 V90 H364 V114 H410 V140 H364 V164 H418 V192 H330 Z" fill="var(--tax-amber)"/>`;
        // Vector x carefully positioned so gap between E's middle/lower arms and x's left V forms a sharp arrow!
        html += `<path d="M418 114 L448 114 L468 140 L488 114 L518 114 L483 153 L520 192 L488 192 L468 166 L448 192 L418 192 L453 153 Z" fill="var(--tax-amber)"/>`;
        html += `</g>`;

        // The negative space arrow sits between E's lower-right gap (x=410..453, y=126..178)
        if (revealed) {
          html += `<polygon points="364,140 418,140 418,118 453,153 418,188 418,164 364,164" fill="var(--tax-green)" opacity="0.88"/>`;
          html += `<text x="340" y="34" text-anchor="middle" fill="var(--tax-green)" font-size="13" font-weight="800">🎯 看到了吗？E 与 x 之间的负空间精准雕出了一枚“极速向右箭头”！</text>`;
        } else {
          html += `<text x="340" y="34" text-anchor="middle" fill="var(--tax-muted)" font-size="12.5">仔细看橙色 E 和 x 紧贴处的缝隙，你能发现隐藏的符号吗？</text>`;
        }
      } else {
        // Rubin's Vase (Figure-Ground reversal)
        const bgCol = revealed ? 'var(--tax-primary)' : 'var(--tax-ink)';
        const vaseCol = revealed ? 'var(--tax-amber)' : 'var(--tax-surface-alt)';
        // Outer dark rectangle = two facing silhouettes
        html += `<rect x="200" y="34" width="280" height="172" rx="10" fill="${bgCol}" opacity="0.85"/>`;
        // Center vase silhouette
        html += `<path d="M275 34 Q312 68 292 92 Q272 108 308 124 Q314 136 296 150 Q276 168 290 206 L390 206 Q404 168 384 150 Q366 136 372 124 Q408 108 388 92 Q368 68 405 34 Z" fill="${vaseCol}"/>`;
        html += `<text x="340" y="222" text-anchor="middle" fill="var(--tax-ink)" font-size="12.5" font-weight="700">${revealed ? '🔄 橙色部分是中央高脚杯，两侧蓝色轮廓是两张深情对望的人脸！' : '👁️ 你第一眼看到的是中央的“高脚杯”，还是左右相对的“两张侧脸”？'}</text>`;
      }
      svg.innerHTML = html;

      if (revealed) {
        ahaBox.innerHTML = tab === 1
          ? '<strong>一见难忘的“Aha 效应”！</strong>著名的联邦快递（FedEx）标志设计师 Lindon Leader 通过微调字母 E 与 x 的间距，在空白处藏进一枚象征“极速精准”的箭头。一旦看见，你这辈子就再也无法忽视它！'
          : '<strong>图底反转（Figure-Ground Reversal）：</strong>大脑无法在同一毫秒把同一条边界既当成花瓶又当成人脸，只能在两种解释间来回翻转。善用负空间，就能在极简图形里塞进双倍巧思！';
      }
    }

    document.getElementById('tab1Btn').onclick = () => { tab = 1; revealed = false; markDone('探索了FedEx式负空间隐藏箭头'); render(); };
    document.getElementById('tab2Btn').onclick = () => { tab = 2; revealed = false; markDone('探索了鲁宾花瓶图底反转'); render(); };
    document.getElementById('revealBtn').onclick = () => { revealed = !revealed; markDone('揭晓了负空间双关图形彩蛋'); render(); };
    render();
  </script>
</body>
</html>
