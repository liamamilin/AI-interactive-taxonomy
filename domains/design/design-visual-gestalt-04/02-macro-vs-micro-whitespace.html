<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>宏观留白 vs 微观留白：双层节奏器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (max-width: 600px) { .btn-row { grid-template-columns: 1fr; } }
    .tog-btn {
      padding: 10px 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 13px; font-weight: 700; cursor: pointer; text-align: left;
    }
    .tog-btn.on { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .canvas-frame {
      border-radius: 12px; border: 1px solid var(--tax-border); background: var(--tax-surface-alt);
      transition: padding .25s;
    }
    .layout-grid { display: grid; grid-template-columns: 1fr 1fr; transition: gap .25s; }
    @media (max-width: 600px) { .layout-grid { grid-template-columns: 1fr; } }
    .mini-card {
      border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface);
      transition: padding .25s, line-height .25s;
    }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🌬️ 宏观留白 vs 微观留白：双层呼吸节奏构建器</h1>
      <p>很多页面看着别扭，是因为只调了其中一层：<strong>宏观留白</strong>管板块之间的“大骨架间距”，<strong>微观留白</strong>管卡片内部的行高与字距。分别开关下面两层，感受双层共振！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="tog-btn" id="macroBtn">○ 宏观留白（页面外边距 &amp; 卡片间距）：关</button>
        <button class="tog-btn" id="microBtn">○ 微观留白（卡片内边距 &amp; 舒适行高）：关</button>
      </div>

      <div class="canvas-frame" id="canvasFrame">
        <div class="layout-grid" id="layoutGrid">
          <div class="mini-card" id="card1">
            <div style="font-weight:800;font-size:15px;">设计系统原则</div>
            <div style="font-size:12.5px;color:var(--tax-muted);margin-top:4px;">宏观留白让读者一眼分清模块边界，不再被整页文字墙吓退。</div>
          </div>
          <div class="mini-card" id="card2">
            <div style="font-weight:800;font-size:15px;">舒适阅读体验</div>
            <div style="font-size:12.5px;color:var(--tax-muted);margin-top:4px;">微观留白给每行字留出换气缝隙，阅读速度和理解率可提升 20%。</div>
          </div>
        </div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>双层缺失（窒息态）：</strong>现在两张卡片死死贴在一起，里面的字也紧紧顶着边框！分别点亮「宏观留白」和「微观留白」感受差距。
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let macro = false, micro = false, done = false;
    const macroBtn = document.getElementById('macroBtn');
    const microBtn = document.getElementById('microBtn');
    const canvasFrame = document.getElementById('canvasFrame');
    const layoutGrid = document.getElementById('layoutGrid');
    const c1 = document.getElementById('card1');
    const c2 = document.getElementById('card2');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      macroBtn.classList.toggle('on', macro);
      microBtn.classList.toggle('on', micro);
      macroBtn.textContent = (macro ? '✓ ' : '○ ') + '宏观留白（页面外边距 & 卡片间距）：' + (macro ? '开' : '关');
      microBtn.textContent = (micro ? '✓ ' : '○ ') + '微观留白（卡片内边距 & 舒适行高）：' + (micro ? '开' : '关');

      canvasFrame.style.padding = macro ? '26px' : '4px';
      layoutGrid.style.gap = macro ? '22px' : '3px';

      [c1, c2].forEach(c => {
        c.style.padding = micro ? '18px 20px' : '5px 6px';
        c.style.lineHeight = micro ? '1.75' : '1.15';
      });

      if (macro && micro) {
        ahaBox.innerHTML = '<strong>双层呼吸共振（最佳态）！</strong>宏观留白（26px 外框 + 22px 栏距）确立大格局，微观留白（18px 内边距 + 1.75 行高）呵护双眼。记住铁律：<strong>外间距 ≥ 内边距</strong>，模块才不会散架！';
      } else if (macro && !micro) {
        ahaBox.innerHTML = '<strong>只有宏观没有微观：</strong>板块之间倒是分开了，但每个卡片里的文字依然死贴边框、行距挤成一团，读起来还是累眼！再把微观留白打开试试。';
      } else if (!macro && micro) {
        ahaBox.innerHTML = '<strong>只有微观没有宏观：</strong>单看每张卡片内部挺舒服，但两张卡片几乎无缝撞在一起，整体显得拥挤局促！再把宏观留白打开试试。';
      } else {
        ahaBox.innerHTML = '<strong>双层缺失（窒息态）：</strong>卡片死贴、文字顶边，典型的“填满主义”灾难。逐个点亮上方开关体验呼吸感！';
      }
    }

    macroBtn.onclick = () => { macro = !macro; markDone('切换了宏观留白开关'); render(); };
    microBtn.onclick = () => { micro = !micro; markDone('切换了微观留白开关'); render(); };
    render();
  </script>
</body>
</html>
