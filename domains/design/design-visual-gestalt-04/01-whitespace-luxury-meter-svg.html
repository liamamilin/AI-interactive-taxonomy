<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>留白即奢华：密度与高级感转换器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ctrl-box { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .showcase {
      border-radius: 14px; border: 1px solid var(--tax-border); background: var(--tax-surface-alt);
      text-align: center; transition: padding .25s;
    }
    .promo-strip { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .promo-tag { padding: 3px 8px; border-radius: 4px; background: var(--tax-red); color: #fff; font-size: 11px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>💎 留白即奢华：密度与品牌高级感模拟器</h1>
      <p>同样一块机械腕表，没有任何参数改变——仅仅把<strong>页面留白占比</strong>从 10% 拉到 75%，看看大脑自动给它估出的品牌档次和价格标签如何从 ¥199 暴涨到 ¥48,000！</p>
    </header>

    <section class="toy-card">
      <div class="ctrl-box">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span>⬜ 页面负空间（留白）占比</span>
          <strong id="wsVal" style="color:var(--tax-primary);">15%（低价大促风）</strong>
        </div>
        <input type="range" id="wsRange" min="10" max="75" value="15" style="width:100%;" />
      </div>

      <div class="showcase" id="showcase">
        <div class="promo-strip" id="promoStrip">
          <span class="promo-tag">🔥 限时秒杀</span>
          <span class="promo-tag">立减 50 元</span>
          <span class="promo-tag">买一送三</span>
          <span class="promo-tag">仅剩 3 件</span>
        </div>
        <div style="font-size:44px;line-height:1.1;" id="watchIcon">⌚</div>
        <div id="brandName" style="font-weight:800;margin-top:8px;">CHRONO NO. 09</div>
        <div id="subCopy" style="font-size:12px;color:var(--tax-muted);margin-top:4px;">全自动机械机芯 · 蓝宝石表镜 · 瑞士日内瓦制表</div>
        <div id="priceTag" style="font-weight:800;margin-top:10px;color:var(--tax-red);font-size:22px;">¥199 抢购价</div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>视觉经济学：</strong>信息塞得越满，大脑潜意识就把它归类为“菜市场 / 清仓大甩卖”；把留白滑块一路拉到 <strong>65%+</strong>，亲眼感受奢侈品官网的高级感密码！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const wsRange = document.getElementById('wsRange');
    const wsVal = document.getElementById('wsVal');
    const showcase = document.getElementById('showcase');
    const promoStrip = document.getElementById('promoStrip');
    const brandName = document.getElementById('brandName');
    const subCopy = document.getElementById('subCopy');
    const priceTag = document.getElementById('priceTag');
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const ws = Number(wsRange.value);
      const padV = Math.round(12 + (ws - 10) * 0.95);
      showcase.style.padding = `${padV}px 24px`;

      if (ws < 30) {
        wsVal.textContent = `${ws}%（集市大促密集风）`;
        promoStrip.style.display = 'flex';
        brandName.style.letterSpacing = '0px';
        brandName.style.fontSize = '18px';
        subCopy.textContent = '爆款直降！全自动机械防水夜光男士商务腕表送礼盒保修三年！';
        priceTag.textContent = '¥199 限时秒杀！';
        priceTag.style.color = 'var(--tax-red)';
        ahaBox.innerHTML = '<strong>低价密集区（留白 <30%）：</strong>红底促销贴纸+塞满的卖点文案传递“薄利多销、赶紧抢”的紧迫感，适合拼团大促，但会彻底摧毁高端溢价！';
      } else if (ws < 55) {
        wsVal.textContent = `${ws}%（现代消费品官网风）`;
        promoStrip.style.display = 'none';
        brandName.style.letterSpacing = '2px';
        brandName.style.fontSize = '20px';
        subCopy.textContent = '全自动机械机芯 · 蓝宝石表镜 · 50 米防水';
        priceTag.textContent = '¥3,680';
        priceTag.style.color = 'var(--tax-primary)';
        ahaBox.innerHTML = '<strong>品质消费区（留白 30%–55%）：</strong>删掉红底贴纸、拉大呼吸感，产品立刻进入“苹果 / 独立设计师品牌”的理性信赖区间！';
      } else {
        wsVal.textContent = `${ws}%（高奢旗舰画廊风）`;
        promoStrip.style.display = 'none';
        brandName.style.letterSpacing = '6px';
        brandName.style.fontSize = '22px';
        subCopy.textContent = 'GENÈVE · 1892';
        priceTag.textContent = '¥48,000 · 敬请预约品鉴';
        priceTag.style.color = 'var(--tax-ink)';
        ahaBox.innerHTML = '<strong>留白即权力（留白 ≥55%）：</strong>奢侈品愿意在昂贵的屏幕/展厅空间里留下大片空白，向大脑发出强烈信号：“我不需要拼命推销，你自然会来仰望。”留白不是浪费，而是最高级的聚光灯！';
      }
    }

    wsRange.oninput = () => { markDone('调节了留白占比观察品牌高级感跃迁'); render(); };
    render();
  </script>
</body>
</html>
