<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>段落呼吸节奏：文字墙 vs 短段切片</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .doc-box { padding: 16px 18px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); font-size: 14px; line-height: 1.7; margin-bottom: 12px; }
    .doc-box p { margin: 0 0 10px; }
    .doc-box ul { margin: 6px 0 0; padding-left: 18px; }
    .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .res-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🧱 段落呼吸节奏：文字墙 vs 短段切片（扫读竞速）</h1>
      <p>内容<strong>一字不差</strong>的两份版本发布公告：分别在「A：密不透风文字墙」和「B：短段 + 粗体锚点切片」里找出<strong>“数据库延迟降低了多少？”</strong>，实测排版节奏带来的扫读速度差！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="startBtn">▶ 第 1 轮：在“文字墙”里找数据</button>
        <button class="toy-btn secondary" id="foundBtn" style="display:none;">🎯 我找到了！（点击停表）</button>
        <span id="hintTxt" style="font-size:13px;color:var(--tax-muted);">目标问题：本次更新把核心查询延迟降低了多少？</span>
      </div>

      <div class="doc-box" id="docBox">点击上方按钮开始第 1 轮扫读计时。</div>

      <div class="res-grid">
        <div class="res-card"><div style="font-size:12px;color:var(--tax-muted);">🧱 第 1 轮 · 密不透风文字墙</div><div style="font-size:22px;font-weight:800;" id="t1Val">—</div></div>
        <div class="res-card"><div style="font-size:12px;color:var(--tax-muted);">✨ 第 2 轮 · 短段切片 + 粗体锚点</div><div style="font-size:22px;font-weight:800;" id="t2Val">—</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>尼尔森眼动研究：</strong>网页读者有 <strong>79%</strong> 根本不逐字阅读，而是用眼睛高速扫描锚点！测完两轮，看看同样一段文字换个呼吸节奏能提速多少。
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const WALL = `本次 v4.2 版本升级历时三个月完成，团队对底层存储引擎与前端渲染管线进行了全面重构。在兼容性方面，系统完整保留了旧版 API 接口规范，老用户无需修改任何配置文件即可平滑升级。在性能表现方面，通过引入全新的索引压缩算法与连接池复用机制，本次更新将核心查询延迟降低了 64%，同时将高峰期内存占用削减了约三分之一。此外，权限审计模块新增了多维度导出日志功能，方便企业安全团队按周核查异常访问记录，相关文档已同步更新至帮助中心。`;

    const SLICED = `
      <p><strong>v4.2 底层重构正式发布</strong>，完整兼容旧版 API，老用户零配置即可平滑升级。</p>
      <ul>
        <li><strong>核心性能飞跃：</strong>引入全新索引压缩与连接池复用，<strong>核心查询延迟降低 64%</strong>，高峰内存省下 1/3。</li>
        <li><strong>安全合规升级：</strong>权限审计新增多维度导出日志，支持按周核查异常访问。</li>
      </ul>`;

    let round = 1, startMs = 0, t1 = null, t2 = null, done = false;
    const startBtn = document.getElementById('startBtn');
    const foundBtn = document.getElementById('foundBtn');
    const docBox = document.getElementById('docBox');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    startBtn.onclick = () => {
      if (round === 3) {
        round = 1; t1 = null; t2 = null;
        document.getElementById('t1Val').textContent = '—';
        document.getElementById('t2Val').textContent = '—';
      }
      docBox.innerHTML = round === 1 ? WALL : SLICED;
      startMs = performance.now();
      startBtn.style.display = 'none';
      foundBtn.style.display = 'inline-block';
    };

    foundBtn.onclick = () => {
      const sec = (performance.now() - startMs) / 1000;
      foundBtn.style.display = 'none';
      startBtn.style.display = 'inline-block';

      if (round === 1) {
        t1 = sec;
        document.getElementById('t1Val').textContent = sec.toFixed(2) + ' 秒';
        round = 2;
        startBtn.textContent = '▶ 第 2 轮：在“短段切片”里找数据';
        docBox.textContent = '第 1 轮已记时（答案：降低 64%）。现在换同一份内容的短段切片版，再测一次扫读速度！';
      } else {
        t2 = sec;
        document.getElementById('t2Val').textContent = sec.toFixed(2) + ' 秒';
        round = 3;
        startBtn.textContent = '↺ 重新竞速';
        const gain = Math.max(1, (t1 / Math.max(0.05, t2))).toFixed(1);
        markDone(`完成段落呼吸节奏扫读竞速：${t1.toFixed(2)}s vs ${t2.toFixed(2)}s`);
        ahaBox.innerHTML = `<strong>扫读提速 ${gain} 倍（${t1.toFixed(2)}s → ${t2.toFixed(2)}s）！</strong>“文字墙”会让读者在第一眼就产生认知拒斥；把段落控制在 3–4 行以内，并用粗体前置核心关键词，相当于在长文里给眼睛装上了高速公路路标！`;
      }
    };
  </script>
</body>
</html>
