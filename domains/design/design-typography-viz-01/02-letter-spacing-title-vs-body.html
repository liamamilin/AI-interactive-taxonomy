<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>字距反直觉：大标题要收紧，小号全大写要放宽</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
    .spec-btn {
      padding: 20px 14px; border-radius: 12px; border: 2px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer; text-align: center;
      transition: border-color .15s;
    }
    .spec-btn:hover { border-color: var(--tax-primary); }
    .spec-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .spec-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔤 字距反直觉：两关排版师眼力盲测</h1>
      <p>同一套字距规则不能通吃所有字号！在下面两关盲测中，凭你的设计直觉选出<strong>看着更专业、更稳重</strong>的排版卡片，解锁大标题与小标签截然相反的字距密码！</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--tax-muted);margin-bottom:6px;">
        <span id="stageTag">第 1 / 2 关 · 40px 巨幅海报主标题</span>
        <span id="scoreTag" style="color:var(--tax-primary);font-weight:700;">眼力命中：0 / 2</span>
      </div>

      <div class="pair" id="pairBox"></div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="fbLine" style="font-size:13px;color:var(--tax-muted);">点击你觉得更专业协调的一张卡片</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">进入第 2 关 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>眼力盲测：</strong>先凭直觉挑出更顺眼的一张，再揭晓背后精确到 <code>em</code> 的光学字距定律！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const ROUNDS = [
      {
        stage: '第 1 / 2 关 · 巨幅主标题（Display Heading）',
        a: { html: '<div style="font-size:34px;font-weight:900;letter-spacing:0.12em;">Design Craft</div><div style="font-size:11px;color:var(--tax-muted);margin-top:8px;">方案 A</div>', ok: false },
        b: { html: '<div style="font-size:34px;font-weight:900;letter-spacing:-0.03em;">Design Craft</div><div style="font-size:11px;color:var(--tax-muted);margin-top:8px;">方案 B</div>', ok: true },
        aha: '<strong>大标题要收紧（<code>-0.02em ~ -0.04em</code>）：</strong>字体放大到 32px+ 时，原本按正文设计的默认字缝会被等比放大成难看的“豁口”！微微收紧负字距，标题立刻显得紧凑有力、像苹果发布会主视觉！'
      },
      {
        stage: '第 2 / 2 关 · 11px 小号全大写标签（ALL CAPS）',
        a: { html: '<div style="font-size:11px;font-weight:800;letter-spacing:0.14em;text-transform:uppercase;">NEW DESIGN SYSTEM</div><div style="font-size:11px;color:var(--tax-muted);margin-top:10px;">方案 A</div>', ok: true },
        b: { html: '<div style="font-size:11px;font-weight:800;letter-spacing:-0.02em;text-transform:uppercase;">NEW DESIGN SYSTEM</div><div style="font-size:11px;color:var(--tax-muted);margin-top:10px;">方案 B</div>', ok: false },
        aha: '<strong>小号全大写要放宽（<code>+0.08em ~ +0.15em</code>）：</strong>全大写字母全是方正竖杠，缺少小写字母高低错落的“词形轮廓”，缩到 11px 挤在一起极难辨认！大幅拉宽正字距后，瞬间高级又通透！'
      }
    ];

    let idx = 0, score = 0, locked = false, done = false;
    const pairBox = document.getElementById('pairBox');
    const fbLine = document.getElementById('fbLine');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const r = ROUNDS[idx];
      locked = false;
      nextBtn.style.display = 'none';
      document.getElementById('stageTag').textContent = r.stage;
      fbLine.textContent = '点击你觉得更专业协调的一张卡片';
      pairBox.innerHTML = '';

      [r.a, r.b].forEach(opt => {
        const b = document.createElement('button');
        b.className = 'spec-btn';
        b.innerHTML = opt.html;
        b.onclick = () => {
          if (locked) return;
          locked = true;
          b.classList.add(opt.ok ? 'ok' : 'bad');
          if (opt.ok) score++;
          document.getElementById('scoreTag').textContent = `眼力命中：${score} / 2`;
          fbLine.textContent = opt.ok ? '✓ 设计师级火眼金睛！' : '⚠️ 选反啦，对比一下字缝呼吸感';
          ahaBox.innerHTML = r.aha;
          if (idx === ROUNDS.length - 1) {
            markDone(`完成字距反直觉两关盲测（${score}/2）`);
            nextBtn.textContent = '↺ 重新盲测';
          } else {
            nextBtn.textContent = '进入第 2 关 →';
          }
          nextBtn.style.display = 'inline-block';
        };
        pairBox.appendChild(b);
      });
    }

    nextBtn.onclick = () => {
      if (idx === ROUNDS.length - 1) { idx = 0; score = 0; document.getElementById('scoreTag').textContent = '眼力命中：0 / 2'; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
