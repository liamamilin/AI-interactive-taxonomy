<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>塔夫特数据墨水比：砍掉 70% 装饰垃圾</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .clean-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 600px) { .clean-grid { grid-template-columns: 1fr; } }
    .c-btn {
      text-align: left; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .c-btn.cleaned { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🧹 塔夫特数据墨水比：砍掉 70% 图表垃圾（情景瘦身）</h1>
      <p>信息设计大师 Edward Tufte 提出<strong>数据墨水比（Data-Ink Ratio）</strong>：图表里用来呈现真实数据的墨水占比越高越好。下面这张典型“PPT 垃圾图表”塞满了厚重边框、粗网格和冗余图例，亲手一刀刀砍掉它们！</p>
    </header>

    <section class="toy-card">
      <div class="clean-grid" id="cleanGrid"></div>

      <svg id="chartSvg" viewBox="0 0 680 225" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="数据墨水比柱状图降噪对比"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>当前数据墨水比仅 26%：</strong>眼睛 74% 的算力都被粗网格、阴影外框和废话图例吸走了！点击上方 4 把剪刀把非数据墨水全砍掉！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const STEPS = [
      { id: 'box',    label: '✂️ 1. 删掉厚重外框与花哨斑马背景条', cut: false, gain: 18 },
      { id: 'grid',   label: '✂️ 2. 砍掉粗黑网格线与 Y 轴刻度垃圾', cut: false, gain: 18 },
      { id: 'legend', label: '✂️ 3. 删掉多余图例，改用柱顶直接标数值', cut: false, gain: 16 },
      { id: 'focus',  label: '✂️ 4. 取消彩虹花哨配色，只高亮核心增长柱', cut: false, gain: 16 }
    ];

    const DATA = [
      { label: 'Q1', val: 42, col: '#f59e0b' },
      { label: 'Q2', val: 58, col: '#ec4899' },
      { label: 'Q3', val: 65, col: '#8b5cf6' },
      { label: 'Q4', val: 94, col: '#10b981' }
    ];

    let done = false;
    const cleanGrid = document.getElementById('cleanGrid');
    const svg = document.getElementById('chartSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      cleanGrid.innerHTML = '';
      STEPS.forEach(s => {
        const b = document.createElement('button');
        b.className = 'c-btn' + (s.cut ? ' cleaned' : '');
        b.textContent = (s.cut ? '✓ 已砍掉：' : '') + s.label;
        b.onclick = () => { s.cut = !s.cut; markDone('优化了塔夫特数据墨水比'); render(); };
        cleanGrid.appendChild(b);
      });

      const noBox = STEPS[0].cut;
      const noGrid = STEPS[1].cut;
      const directVal = STEPS[2].cut;
      const focusCol = STEPS[3].cut;
      const ratio = 26 + STEPS.filter(s => s.cut).reduce((a, b) => a + b.gain, 0);

      let html = '';
      // Heavy box & zebra stripes
      if (!noBox) {
        html += `<rect x="46" y="34" width="588" height="156" fill="rgba(148,163,184,0.16)" stroke="var(--tax-ink)" stroke-width="3"/>`;
        for (let i = 0; i < 4; i += 2) {
          html += `<rect x="48" y="${36 + i * 38}" width="584" height="38" fill="rgba(148,163,184,0.14)"/>`;
        }
      }

      // Heavy gridlines
      if (!noGrid) {
        [20, 40, 60, 80, 100].forEach(v => {
          const y = 186 - (v / 100) * 140;
          html += `<line x1="56" y1="${y}" x2="624" y2="${y}" stroke="var(--tax-ink)" stroke-width="1.5" opacity="0.55"/>`;
          html += `<text x="40" y="${y + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="11">${v}万</text>`;
        });
      }

      // Baseline
      html += `<line x1="80" y1="186" x2="600" y2="186" stroke="var(--tax-border)" stroke-width="1.5"/>`;

      // Bars
      DATA.forEach((d, i) => {
        const x = 128 + i * 124;
        const h = (d.val / 100) * 136;
        const y = 186 - h;
        const fill = focusCol ? (i === 3 ? 'var(--tax-primary)' : 'rgba(148,163,184,0.35)') : d.col;
        html += `<rect x="${x}" y="${y}" width="66" height="${h}" rx="6" fill="${fill}"/>`;
        html += `<text x="${x + 33}" y="206" text-anchor="middle" fill="${focusCol && i === 3 ? 'var(--tax-primary)' : 'var(--tax-muted)'}" font-size="12.5" font-weight="${i === 3 ? '800' : '600'}">${d.label}</text>`;
        if (directVal) {
          html += `<text x="${x + 33}" y="${y - 8}" text-anchor="middle" fill="${focusCol && i === 3 ? 'var(--tax-primary)' : 'var(--tax-ink)'}" font-size="13" font-weight="800">${d.val}万</text>`;
        }
      });

      // Redundant legend box when not cleaned
      if (!directVal) {
        html += `<rect x="495" y="44" width="128" height="44" rx="6" fill="var(--tax-surface)" stroke="var(--tax-ink)" stroke-width="1.5"/>`;
        html += `<text x="559" y="63" text-anchor="middle" fill="var(--tax-ink)" font-size="11" font-weight="700">图例：季度营收</text>`;
        html += `<text x="559" y="79" text-anchor="middle" fill="var(--tax-muted)" font-size="10">■Q1 ■Q2 ■Q3 ■Q4</text>`;
      }

      html += `<text x="340" y="22" text-anchor="middle" fill="${ratio >= 90 ? 'var(--tax-green)' : 'var(--tax-ink)'}" font-size="13" font-weight="800">当前数据墨水比：${ratio}%（目标 ≥90%）</text>`;
      svg.innerHTML = html;

      if (ratio >= 90) {
        ahaBox.innerHTML = '<strong>极简专业级图表（数据墨水比 94%）！</strong>所有干扰线条全被清空，观众在 <strong>0.5 秒内</strong>就能一眼看到核心结论：“Q4 营收跃升至 94 万”！少即是多，每删掉一根无用线条，数据本身就更亮一分。';
      } else {
        ahaBox.innerHTML = `<strong>当前数据墨水比 ${ratio}%：</strong>还剩 ${STEPS.filter(s => !s.cut).length} 处图表垃圾待清理，继续点击上方按钮瘦身！`;
      }
    }

    render();
  </script>
</body>
</html>
