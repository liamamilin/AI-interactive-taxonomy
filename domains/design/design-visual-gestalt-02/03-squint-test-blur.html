<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>😑 眯眼测试（Squint Test）：3 秒检验主次</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>😑 眯眼测试（Squint Test）：3 秒检验主次</h1><p>设计师交稿前都会眯起眼睛看屏幕：当细节全部糊成色块时，如果最亮眼、最先跳出来的正好是核心标题和主按钮，视觉层级就及格了！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>模拟眯眼模糊程度</span><span id="vBlr">4 px</span></label><input type="range" id="sBlr" min="0" max="8" step="0.5" value="4" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>主视觉对比强调度</span><span id="vPop">80%</span></label><input type="range" id="sPop" min="20" max="100" value="80" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">模糊态主焦点辨识</div><div class="k-val" id="kFoc">—</div></div>
        <div class="kpi"><div class="k-lbl">眯眼测试结果</div><div class="k-val" id="kRes">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const blr=+document.getElementById('sBlr').value, pop=+document.getElementById('sPop').value;
  document.getElementById('vBlr').textContent=blr.toFixed(1)+' px';
  document.getElementById('vPop').textContent=pop+'%';
  const pass=pop>=65;
  document.getElementById('kFoc').textContent=pass?'主按钮与标题依然清晰跳出':'糊成一团均匀灰块';
  document.getElementById('kRes').textContent=pass?'✅ 通过眯眼测试':'❌ 缺乏视觉锚点';
  document.getElementById('kRes').style.color=pass?'#059669':'#ef4444';
  const btnCol=pop>=65?'#2563eb':'#94a3b8';
  const titleW=Math.round(140 + pop*1.6);
  document.getElementById('svg').innerHTML=`
    <defs><filter id="sq"><feGaussianBlur stdDeviation="${blr}"/></filter></defs>
    <g filter="url(#sq)">
      <rect x="45" y="25" width="510" height="150" rx="12" fill="var(--tax-surface)" stroke="var(--tax-border)"/>
      <rect x="75" y="48" width="${titleW}" height="${Math.round(14+pop*0.14)}" rx="5" fill="#0f172a" opacity="${(0.3+pop*0.007).toFixed(2)}"/>
      <rect x="75" y="88" width="380" height="10" rx="4" fill="#94a3b8" opacity="0.55"/>
      <rect x="75" y="106" width="320" height="10" rx="4" fill="#94a3b8" opacity="0.55"/>
      <rect x="75" y="130" width="135" height="30" rx="8" fill="${btnCol}"/>
    </g>
    <text x="545" y="192" text-anchor="end" font-size="11" fill="var(--tax-muted)">眯眼滤镜已开启：${blr.toFixed(1)}px</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>下一次做完简历、PPT 或网页，退后两步眯眼扫一眼——3 秒内看不出哪块最重要，就立刻调大主次反差！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
