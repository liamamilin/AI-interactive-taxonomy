<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>三级视觉层级拉差器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .levers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    @media (max-width: 640px) { .levers { grid-template-columns: 1fr; } }
    .lv-btn {
      padding: 10px; border-radius: 10px; border: 1px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; font-weight: 700; cursor: pointer; text-align: left;
    }
    .lv-btn.on { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .preview-card {
      padding: 20px; border-radius: 14px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border);
      max-width: 440px; margin: 0 auto; transition: all .25s;
    }
    .p-eyebrow { transition: all .25s; }
    .p-title { transition: all .25s; margin: 4px 0; }
    .p-meta { transition: all .25s; margin: 6px 0 12px; }
    .p-cta { display: inline-block; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--tax-border); transition: all .25s; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>📐 三级视觉层级拉差器（卡片重构构建器）</h1>
      <p>下面这张活动邀请卡片里的所有文字都挤在同一种字号、字重和颜色里，眼睛完全不知道先看哪。逐一拨动 <strong>3 个层级拉差开关</strong>，见证一团文字如何瞬间长出呼吸感与主次！</p>
    </header>

    <section class="toy-card">
      <div class="levers" id="leverGrid"></div>

      <div class="preview-card" id="previewCard">
        <div class="p-eyebrow" id="pEye">设计系统公开课 · 第 12 期</div>
        <div class="p-title" id="pTitle">2 小时重构你的组件库视觉层级</div>
        <div class="p-meta" id="pMeta">周四晚 20:00 · 线上直播 · 限额 200 人</div>
        <div class="p-cta" id="pCta">立即免费预约席位</div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>反面教材（0/3 拉差）：</strong>当所有信息都一样大、一样黑，等于<strong>没有任何重点</strong>！依次点亮上方 3 个层级拉差开关，把 3 秒扫读效率拉满！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const LEVERS = [
      { id: 'size',  label: '① 字号拉差（主标题放大 1.7×）', on: false },
      { id: 'tone',  label: '② 颜色降噪（辅助信息退居次灰）', on: false },
      { id: 'cta',   label: '③ 焦点按钮（行动号召高饱和高亮）', on: false }
    ];

    let done = false;
    const leverGrid = document.getElementById('leverGrid');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      leverGrid.innerHTML = '';
      LEVERS.forEach(lv => {
        const b = document.createElement('button');
        b.className = 'lv-btn' + (lv.on ? ' on' : '');
        b.textContent = (lv.on ? '✓ ' : '○ ') + lv.label;
        b.onclick = () => { lv.on = !lv.on; markDone('调整了三级视觉层级拉差开关'); render(); };
        leverGrid.appendChild(b);
      });

      const hasSize = LEVERS[0].on;
      const hasTone = LEVERS[1].on;
      const hasCta  = LEVERS[2].on;

      const pEye = document.getElementById('pEye');
      const pTitle = document.getElementById('pTitle');
      const pMeta = document.getElementById('pMeta');
      const pCta = document.getElementById('pCta');

      pEye.style.fontSize = hasSize ? '12px' : '15px';
      pEye.style.fontWeight = hasTone ? '700' : '500';
      pEye.style.color = hasTone ? 'var(--tax-primary)' : 'var(--tax-ink)';
      pEye.style.letterSpacing = hasSize ? '0.6px' : '0';

      pTitle.style.fontSize = hasSize ? '23px' : '15px';
      pTitle.style.fontWeight = hasSize ? '800' : '500';
      pTitle.style.lineHeight = hasSize ? '1.3' : '1.5';
      pTitle.style.color = 'var(--tax-ink)';

      pMeta.style.fontSize = hasSize ? '13px' : '15px';
      pMeta.style.color = hasTone ? 'var(--tax-muted)' : 'var(--tax-ink)';

      pCta.style.fontSize = '14px';
      pCta.style.fontWeight = hasCta ? '700' : '500';
      pCta.style.background = hasCta ? 'var(--tax-primary)' : 'transparent';
      pCta.style.color = hasCta ? '#fff' : 'var(--tax-ink)';
      pCta.style.borderColor = hasCta ? 'var(--tax-primary)' : 'var(--tax-border)';

      const cnt = LEVERS.filter(l => l.on).length;
      if (cnt === 3) {
        ahaBox.innerHTML = '<strong>完美三级层级（3/3）！</strong>扫读路径瞬间锁定：<strong>第 1 眼看粗大主标题 → 第 2 眼落到高亮蓝色 CTA → 需要时才看灰色时间元数据</strong>。好排版靠的不是堆元素，而是拉大一级与三级的对比差！';
      } else if (cnt > 0) {
        ahaBox.innerHTML = `<strong>层级已开启 ${cnt} / 3：</strong>再把剩下的开关也打开，感受“做减法降噪”与“做加法拉差”的双重威力！`;
      } else {
        ahaBox.innerHTML = '<strong>反面教材（0/3 拉差）：</strong>所有文字字号、字重、颜色全一样，眼睛只能从头到尾逐字读。依次点亮上方 3 个开关试试！';
      }
    }

    render();
  </script>
</body>
</html>
