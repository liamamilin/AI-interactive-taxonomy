<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📐 三级视觉层级拉差器（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📐 三级视觉层级拉差器（SVG）</h1><p>建立层级不需要花哨装饰，只需拉开三个维度：主标题（大号粗黑）、正文（中号常规）、元数据（小号浅灰）——读者眼球会自动按 1→2→3 顺序滑行。</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>主标题 / 正文字号倍率</span><span id="vSc">1.8x</span></label><input type="range" id="sSc" min="1.0" max="2.4" step="0.1" value="1.8" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>次要信息（时间/标签）视觉退让度</span><span id="vDim">60%</span></label><input type="range" id="sDim" min="0" max="80" value="60" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">1 秒抓重点清晰度</div><div class="k-val" id="kClr">—</div></div>
        <div class="kpi"><div class="k-lbl">层级诊断</div><div class="k-val" id="kDia">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const sc=+document.getElementById('sSc').value, dim=+document.getElementById('sDim').value;
  document.getElementById('vSc').textContent=sc.toFixed(1)+'x';
  document.getElementById('vDim').textContent=dim+'%';
  const hSz=Math.round(13*sc);
  const metaOp=(1 - dim*0.0085).toFixed(2);
  const clr=Math.min(98, Math.round(28 + (sc-1)*38 + dim*0.35));
  document.getElementById('kClr').textContent=clr+' 分';
  document.getElementById('kClr').style.color=clr>=75?'#059669':'#f59e0b';
  document.getElementById('kDia').textContent=clr>=75?'✅ 1→2→3 主次一眼分明':'⚠️ 全篇一样重，毫无焦点';
  document.getElementById('svg').innerHTML=`
    <rect x="40" y="24" width="520" height="152" rx="14" fill="var(--tax-surface)" stroke="var(--tax-border)"/>
    <text x="68" y="54" font-size="11.5" font-weight="700" fill="var(--tax-text)" opacity="${metaOp}">设计周刊 · 2026 年 11 月 · 预计阅读 3 分钟</text>
    <text x="68" y="${64+hSz}" font-size="${hSz}" font-weight="${sc>1.3?850:500}" fill="var(--tax-text)">视觉层级让信息自己开口说话</text>
    <text x="68" y="${96+hSz}" font-size="13" fill="var(--tax-text)" opacity="0.82">拉开标题、正文与辅助标签的尺寸和明度差，读者无需费力寻找重点。</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>如果页面上所有文字都加粗放大，结果就是没有一行字是重点。敢于把次要信息“变小变淡”，主标题才会真正立起来！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
