<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>克利夫兰视觉编码精度榜：柱图 vs 饼图</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>📊 克利夫兰视觉编码精度榜：饼图 vs 柱图盲测</h1>
      <p>统计学家 Cleveland &amp; McGill (1984) 证明：人眼比较<strong>同基线长度（柱图）</strong>的精度是<strong>角度/面积（饼图）</strong>的 3 倍以上！先不看数字，在下面饼图里盲猜哪一块<strong>份额最大</strong>！</p>
    </header>

    <section class="toy-card">
      <svg id="vizSvg" viewBox="0 0 680 230" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="饼图与柱状图视觉编码精度盲测"></svg>

      <div class="btn-row" id="btnRow"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>眼力挑战：</strong>下面 4 块扇形分别代表产品 A、B、C、D 的销量，数值相差极小。凭肉眼先选出你觉得<strong>最大的一块</strong>，再一键翻成柱状图看真相！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const DATA = [
      { id: 'A', val: 24, col: '#3b82f6' },
      { id: 'B', val: 27, col: '#10b981' },
      { id: 'C', val: 25, col: '#f59e0b' },
      { id: 'D', val: 24, col: '#8b5cf6' }
    ];

    let revealed = false, picked = null, done = false;
    const svg = document.getElementById('vizSvg');
    const btnRow = document.getElementById('btnRow');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function pieSlice(cx, cy, r, a0, a1) {
      const r0 = (a0 * Math.PI) / 180, r1 = (a1 * Math.PI) / 180;
      const x0 = cx + r * Math.cos(r0), y0 = cy + r * Math.sin(r0);
      const x1 = cx + r * Math.cos(r1), y1 = cy + r * Math.sin(r1);
      return `M ${cx} ${cy} L ${x0.toFixed(1)} ${y0.toFixed(1)} A ${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z`;
    }

    function render() {
      let html = '';
      // Left (or centered before reveal): Pie chart
      const cx = revealed ? 185 : 340, cy = 120, r = 82;
      let ang = -90;
      DATA.forEach(d => {
        const span = (d.val / 100) * 360;
        html += `<path d="${pieSlice(cx, cy, r, ang, ang + span)}" fill="${d.col}" stroke="var(--tax-surface-alt)" stroke-width="2.5"/>`;
        const mid = ((ang + span / 2) * Math.PI) / 180;
        const lx = cx + r * 0.62 * Math.cos(mid);
        const ly = cy + r * 0.62 * Math.sin(mid) + 4;
        html += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" fill="#fff" font-size="14" font-weight="900">${d.id}${revealed ? ' ' + d.val + '%' : ''}</text>`;
        ang += span;
      });
      html += `<text x="${cx}" y="220" text-anchor="middle" fill="var(--tax-muted)" font-size="12">🥧 饼图（靠角度面积猜，极难分辨 25% vs 27%）</text>`;

      if (revealed) {
        // Right: Bar chart with common baseline!
        const bx0 = 370, by0 = 186;
        html += `<line x1="${bx0}" y1="${by0}" x2="640" y2="${by0}" stroke="var(--tax-border)" stroke-width="2"/>`;
        DATA.forEach((d, i) => {
          const x = bx0 + 22 + i * 64;
          const h = (d.val / 30) * 136;
          html += `<rect x="${x}" y="${by0 - h}" width="42" height="${h}" rx="6" fill="${d.col}"/>`;
          html += `<text x="${x + 21}" y="${by0 - h - 7}" text-anchor="middle" fill="var(--tax-ink)" font-size="12.5" font-weight="800">${d.val}%</text>`;
          html += `<text x="${x + 21}" y="${by0 + 18}" text-anchor="middle" fill="var(--tax-muted)" font-size="12" font-weight="700">${d.id}</text>`;
        });
        html += `<text x="505" y="220" text-anchor="middle" fill="var(--tax-green)" font-size="12" font-weight="700">📊 柱状图（同基线高度，0.2 秒锁定 B 最大！）</text>`;
      }
      svg.innerHTML = html;

      btnRow.innerHTML = '';
      if (!revealed) {
        DATA.forEach(d => {
          const b = document.createElement('button');
          b.className = 'toy-btn secondary';
          b.textContent = `我猜 ${d.id} 最大`;
          b.onclick = () => {
            picked = d.id;
            revealed = true;
            markDone(`完成克利夫兰视觉编码盲测（初选 ${d.id}）`);
            ahaBox.innerHTML = d.id === 'B'
              ? '<strong>猜中了（B = 27%）！</strong>但看一眼右侧同步展开的柱状图：在同一起跑线上，B 高出 A/C/D 一截一目了然！克利夫兰视觉精度排行：<strong>同基线位置 > 长度 > 角度/面积 > 颜色深浅</strong>。'
              : `<strong>真相是 B（27%）最大，你猜了 ${d.id}（${DATA.find(x => x.id === d.id).val}%）！</strong>这完全不是你的错——人眼天生不擅长比较旋转角度。换成右侧柱状图后，0.2 秒就能看清高下！`;
            render();
          };
          btnRow.appendChild(b);
        });
      } else {
        const rb = document.createElement('button');
        rb.className = 'toy-btn secondary';
        rb.textContent = '↺ 回到饼图盲测状态';
        rb.onclick = () => { revealed = false; picked = null; render(); };
        btnRow.appendChild(rb);
      }
    }

    render();
  </script>
</body>
</html>
