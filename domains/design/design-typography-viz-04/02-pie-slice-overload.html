<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥧 饼图灾难阈值：超过 4 块就立刻换条形图！</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🥧 饼图灾难阈值：超过 4 块就立刻换条形图！</h1><p>饼图唯一胜任的场景是“2~3 个部分占整体的粗略比例”（如 75% vs 25%）；一旦切出 8~12 块，就会变成让人崩溃的彩虹披萨！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>分类项切片数量</span><span id="vN">7 块</span></label><input type="range" id="sN" min="2" max="12" value="7" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>是否开启 3D 倾斜特效（视觉毒药）</span><span id="v3d">40%</span></label><input type="range" id="s3d" min="0" max="100" value="40" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 195"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">饼图可读性评分</div><div class="k-val" id="kScr">—</div></div>
        <div class="kpi"><div class="k-lbl">图表选型建议</div><div class="k-val" id="kAdv">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const n=+document.getElementById('sN').value, d3=+document.getElementById('s3d').value;
  document.getElementById('vN').textContent=n+' 块';
  document.getElementById('v3d').textContent=d3+'%';
  const scr=Math.max(8, Math.min(95, Math.round(100 - Math.max(0, n-3)*9.5 - d3*0.35)));
  document.getElementById('kScr').textContent=scr+' 分';
  document.getElementById('kScr').style.color=scr>=65?'#059669':'#ef4444';
  document.getElementById('kAdv').textContent=n<=3 && d3===0?'✅ 勉强可用饼图':'📊 请立刻改用排序水平条形图!';
  const w=Math.max(15, scr*4.2);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">饼图信息传达效率（${n} 个分类 + ${d3}% 3D 透视畸变）</text>
    <rect x="30" y="68" width="440" height="38" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="68" width="${w.toFixed(0)}" height="38" rx="8" fill="${scr>=65?'#059669':'#ef4444'}"/>
    <text x="${Math.min(480,38+w).toFixed(0)}" y="93" font-size="14" font-weight="850" fill="${scr>=65?'#059669':'#ef4444'}">${scr} 分</text>
    <text x="30" y="150" font-size="12" fill="var(--tax-muted)">3D 饼图更致命：靠近前方的扇区因透视显得面积暴涨，哪怕它真实占比比后方更小！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>永远禁用 3D 饼图！只要分类超过 4 个，直接上“按数值从大到小排好序的水平条形图”，清晰度碾压十条街！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
