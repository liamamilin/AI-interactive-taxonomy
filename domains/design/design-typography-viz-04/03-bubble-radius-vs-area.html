<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>气泡图面积骗局：按半径映射把 2 倍夸大成 4 倍！</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ctrl-box { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🫧 气泡图面积骗局：半径映射 vs 面积映射对决</h1>
      <p>公司 B 的营收恰好是公司 A 的 <strong>K 倍</strong>。如果图省事直接把气泡的<strong>半径</strong>乘以 K，圆的面积会按 <strong>π(Kr)² = K² 倍</strong>爆炸膨胀！拖动倍数对比左右两种画法的视觉震撼差！</p>
    </header>

    <section class="toy-card">
      <div class="ctrl-box">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span>📈 真实数据倍数（公司 B ÷ 公司 A）</span>
          <strong id="kVal" style="color:var(--tax-primary);">2.0 倍</strong>
        </div>
        <input type="range" id="kRange" min="1.5" max="3.0" step="0.1" value="2.0" style="width:100%;" />
      </div>

      <svg id="bubSvg" viewBox="0 0 680 230" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="气泡图半径映射与面积映射对决"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>几何视觉骗局：</strong>人眼感知圆的大小看的是<strong>二维面积</strong>而不是一维半径！正确画法必须用 <code>r = r₀ × √K</code>（开平方根），否则 3 倍差距会被画成触目惊心的 9 倍巨无霸！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const kRange = document.getElementById('kRange');
    const kVal = document.getElementById('kVal');
    const svg = document.getElementById('bubSvg');
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const k = Number(kRange.value);
      const fakeArea = (k * k).toFixed(1);
      kVal.textContent = `${k.toFixed(1)} 倍（真实值：10 亿 vs ${(10 * k).toFixed(0)} 亿）`;

      const r0 = 24;
      const rBad = r0 * k;            // Wrong: linear radius -> k^2 area!
      const rGood = r0 * Math.sqrt(k); // Right: sqrt radius -> k area!

      let html = '';
      // Divider
      html += `<line x1="340" y1="18" x2="340" y2="215" stroke="var(--tax-border)" stroke-dasharray="5 4"/>`;

      // Left: Wrong Radius Mapping
      html += `<text x="170" y="26" text-anchor="middle" fill="var(--tax-red)" font-size="13" font-weight="800">❌ 错误：按半径 ×${k.toFixed(1)}（视觉夸大成 ${fakeArea} 倍！）</text>`;
      html += `<circle cx="72" cy="126" r="${r0}" fill="rgba(148,163,184,0.45)" stroke="var(--tax-muted)" stroke-width="2"/>`;
      html += `<text x="72" y="130" text-anchor="middle" fill="var(--tax-ink)" font-size="11" font-weight="700">A:10亿</text>`;
      html += `<circle cx="218" cy="126" r="${rBad.toFixed(1)}" fill="rgba(239,68,68,0.28)" stroke="var(--tax-red)" stroke-width="2.5"/>`;
      html += `<text x="218" y="130" text-anchor="middle" fill="var(--tax-red)" font-size="13" font-weight="900">B:${(10 * k).toFixed(0)}亿</text>`;
      html += `<text x="170" y="216" text-anchor="middle" fill="var(--tax-red)" font-size="11.5">面积比 = ${k.toFixed(1)}² = ${fakeArea} 倍（严重撒谎！）</text>`;

      // Right: Correct Area Mapping
      html += `<text x="510" y="26" text-anchor="middle" fill="var(--tax-green)" font-size="13" font-weight="800">✅ 正确：按面积 ×${k.toFixed(1)}（半径 ×√${k.toFixed(1)} = ×${Math.sqrt(k).toFixed(2)}）</text>`;
      html += `<circle cx="430" cy="126" r="${r0}" fill="rgba(148,163,184,0.45)" stroke="var(--tax-muted)" stroke-width="2"/>`;
      html += `<text x="430" y="130" text-anchor="middle" fill="var(--tax-ink)" font-size="11" font-weight="700">A:10亿</text>`;
      html += `<circle cx="556" cy="126" r="${rGood.toFixed(1)}" fill="rgba(16,185,129,0.28)" stroke="var(--tax-green)" stroke-width="2.5"/>`;
      html += `<text x="556" y="130" text-anchor="middle" fill="var(--tax-green)" font-size="13" font-weight="900">B:${(10 * k).toFixed(0)}亿</text>`;
      html += `<text x="510" y="216" text-anchor="middle" fill="var(--tax-green)" font-size="11.5">面积比 = 精确 ${k.toFixed(1)} 倍（诚实可视化）</text>`;

      svg.innerHTML = html;

      ahaBox.innerHTML = `<strong>数据比 ${k.toFixed(1)} 倍 → 视觉夸大成 ${fakeArea} 倍！</strong>大量商业发布会和信息图都曾掉进“把数值直接赋给圆半径/图标高度”的陷阱。写 D3 / ECharts / SVG 气泡图时，永远记得对数值<strong>先开平方根 <code>Math.sqrt(v)</code></strong> 再映射半径！`;
    }

    kRange.oninput = () => { markDone('对比了气泡图半径映射与面积映射的几何夸大'); render(); };
    render();
  </script>
</body>
</html>
