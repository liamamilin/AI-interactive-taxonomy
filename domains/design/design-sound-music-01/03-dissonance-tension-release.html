<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>不协和不是坏事：张力 → 解决才是音乐灵魂</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .opt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    @media (max-width: 640px) { .opt-grid { grid-template-columns: 1fr; } }
    .prog-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .prog-btn.active { border-color: var(--tax-primary); background: var(--tax-primary-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚡ 不协和不是坏事：张力 → 解决才是音乐灵魂（听觉情景）</h1>
      <p>如果一首歌从头到尾全是完美协和和弦，听 10 秒就会无聊到睡着！点击播放下面 3 段和弦进行，亲耳感受<strong>属七和弦（G7）的悬崖张力</strong>如何让最后一声 <strong>C 主和弦</strong>产生震撼的释放快感！</p>
    </header>

    <section class="toy-card">
      <div class="opt-grid" id="optGrid"></div>

      <svg id="arcSvg" viewBox="0 0 680 150" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="音乐张力与解决曲线"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>听觉实验：</strong>重点试试第 2 段「悬在半空不解决（C → F → G7 突然停住）」，感受大脑有多渴望听到最后那声回家的 C 和弦！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CHORDS = {
      C:  [261.63, 329.63, 392.00],
      F:  [349.23, 440.00, 523.25],
      G7: [246.94, 293.66, 349.23, 392.00] // Contains B-F tritone tension!
    };

    const PROGS = [
      {
        id: 'flat', name: '😴 1. 零张力白开水', seq: ['C', 'C', 'C', 'C'], tensions: [15, 15, 15, 15], col: 'var(--tax-muted)',
        sub: 'C → C → C → C（全程安稳但毫无波澜）',
        aha: '<strong>零张力 = 无聊：</strong>全是完美协和音程就像一部没有反派和冲突的电影，大脑听两拍就失去兴趣！'
      },
      {
        id: 'hang', name: '😰 2. 悬崖停顿（逼死强迫症！）', seq: ['C', 'F', 'G7'], tensions: [15, 48, 94], col: 'var(--tax-red)',
        sub: 'C → F → G7（突然截断不回家！）',
        aha: '<strong>未解决的三全音张力（G7 里藏着 B–F 增四度）：</strong>突然停在 G7 上是不是让你心里痒得像少打了一个喷嚏？你的大脑听觉皮层正在疯狂呼唤 C 和弦落地！'
      },
      {
        id: 'res',  name: '🌟 3. 黄金张力 → 释放（完整终止式）', seq: ['C', 'F', 'G7', 'C'], tensions: [15, 48, 94, 12], col: 'var(--tax-green)',
        sub: 'C → F → G7（张力巅峰）→ C（完美归宿！）',
        aha: '<strong>音乐多巴胺的秘密（Tension &amp; Release）：</strong>正是 G7 制造的不协和悬崖，把最后那声平平无奇的 C 和弦衬托得如释重负、热泪盈眶！好故事与好设计同样遵循“蓄势 → 冲突 → 释放”！'
      }
    ];

    let cur = PROGS[2], ctx = null, done = false;
    const optGrid = document.getElementById('optGrid');
    const svg = document.getElementById('arcSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function playSeq(prog) {
      try {
        if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        prog.seq.forEach((name, idx) => {
          const t0 = now + idx * 0.55;
          CHORDS[name].forEach(f => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, t0);
            g.gain.setValueAtTime(0.001, t0);
            g.gain.linearRampToValueAtTime(0.11, t0 + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.52);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(t0); osc.stop(t0 + 0.54);
          });
        });
      } catch (e) {}
    }

    function render() {
      optGrid.innerHTML = '';
      PROGS.forEach(p => {
        const b = document.createElement('button');
        b.className = 'prog-btn' + (p.id === cur.id ? ' active' : '');
        b.innerHTML = `<div style="font-weight:800;font-size:13.5px;">${p.name}</div><div style="font-size:11.5px;color:var(--tax-muted);margin-top:4px;">${p.sub}</div>`;
        b.onclick = () => { cur = p; markDone(`试听了和声张力解决情景：${p.name}`); render(); playSeq(p); };
        optGrid.appendChild(b);
      });

      const xs = [90, 260, 430, 590];
      const yOf = v => 126 - (v / 100) * 90;
      const pts = cur.tensions.map((v, i) => `${xs[i]},${yOf(v)}`).join(' ');

      let html = `<line x1="50" y1="126" x2="630" y2="126" stroke="var(--tax-border)"/>`;
      html += `<polyline points="${pts}" fill="none" stroke="${cur.col}" stroke-width="3.5" stroke-linecap="round"/>`;
      cur.seq.forEach((name, i) => {
        const x = xs[i], y = yOf(cur.tensions[i]);
        html += `<circle cx="${x}" cy="${y}" r="8" fill="${cur.col}" stroke="#fff" stroke-width="2"/>`;
        html += `<text x="${x}" y="${y - 13}" text-anchor="middle" fill="var(--tax-ink)" font-size="13" font-weight="800">${name}</text>`;
      });
      if (cur.id === 'hang') {
        html += `<text x="580" y="75" text-anchor="middle" fill="var(--tax-red)" font-size="13" font-weight="800">❓ 悬空未落地！</text>`;
      }
      svg.innerHTML = html;
      ahaBox.innerHTML = cur.aha;
    }

    render();
  </script>
</body>
</html>
