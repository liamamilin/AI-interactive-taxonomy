<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>单手拇指热区图：顶部按钮有多反人类？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .wrap { display: grid; grid-template-columns: 240px 1fr; gap: 14px; align-items: center; }
    @media (max-width: 600px) { .wrap { grid-template-columns: 1fr; } }
    .task-box { padding: 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .zone-btn {
      display: block; width: 100%; text-align: left; padding: 9px 11px; margin-top: 8px;
      border-radius: 8px; border: 1px solid var(--tax-border); background: var(--tax-surface);
      color: var(--tax-ink); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .zone-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .zone-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); color: var(--tax-red); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>📱 单手拇指热区图：移动端按钮布局评审（情景）</h1>
      <p>Steven Hoober 调研发现 <strong>49%–75%</strong> 的用户习惯单手握持大屏手机。右手拇指以右下角为圆心画弧：底部是绿色自然区，左上角是必须倒手的红色死区！为下面 3 个按钮安排最合理的拇指热区：</p>
    </header>

    <section class="toy-card">
      <div class="wrap">
        <svg id="phoneSvg" viewBox="0 0 220 380" width="100%" style="max-width:220px;margin:0 auto;display:block;border-radius:26px;border:3px solid var(--tax-border);background:var(--tax-surface-alt);" aria-label="手机单手拇指热区图">
          <!-- Red hard-to-reach zone (top-left) -->
          <rect x="0" y="0" width="220" height="380" fill="rgba(239,68,68,0.18)"/>
          <!-- Amber stretch zone -->
          <circle cx="205" cy="340" r="245" fill="rgba(245,158,11,0.22)"/>
          <!-- Green natural thumb arc -->
          <circle cx="205" cy="340" r="158" fill="rgba(16,185,129,0.28)"/>
          <text x="68" y="66" text-anchor="middle" fill="var(--tax-red)" font-size="13" font-weight="800">🔴 够不到区</text>
          <text x="68" y="84" text-anchor="middle" fill="var(--tax-red)" font-size="10.5">需双手/倒手</text>
          <text x="115" y="170" text-anchor="middle" fill="var(--tax-amber)" font-size="13" font-weight="800">🟡 拉伸区</text>
          <text x="132" y="290" text-anchor="middle" fill="var(--tax-green)" font-size="13.5" font-weight="800">🟢 拇指自然区</text>
          <text x="132" y="308" text-anchor="middle" fill="var(--tax-green)" font-size="10.5">高频核心操作</text>
        </svg>

        <div class="task-box">
          <div style="font-size:12px;color:var(--tax-muted);" id="stepTag">按钮排布 1 / 3 · 得分：0/3</div>
          <div style="font-size:15.5px;font-weight:800;margin:6px 0;" id="qTitle"></div>
          <div id="optsWrap"></div>
          <div id="fbTxt" style="font-size:12.5px;color:var(--tax-muted);margin-top:10px;line-height:1.5;"></div>
          <button class="toy-btn secondary" id="nextBtn" style="margin-top:10px;display:none;">下一个按钮 →</button>
        </div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>大屏时代铁律：</strong>Safari 与主流 App 纷纷把地址栏、标签栏和核心按钮从顶部搬到底部，就是为了顺应右手拇指的生理扇形热区！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const TASKS = [
      {
        q: '1. 聊天 App 每天要按 200 次的【底部 Tab 栏与核心“发送/新建”按钮】应该放哪？',
        best: 'green',
        fb: '必须放进绿色拇指自然区（底部 1/3）！高频主操作放到顶部左上角，等于逼单手握手机的用户每次都冒着手机摔碎的风险去够！'
      },
      {
        q: '2. 几乎一个月才点一次、且绝不能误触的【退出登录 / 注销账号】应该放哪？',
        best: 'red',
        fb: '反向利用费茨定律！危险或极低频操作正好应该放进左上角红色“高摩擦够不到区”，天然防误触！'
      },
      {
        q: '3. 信息流页面里偶尔浏览点击的【内容卡片列表与筛选标签】适合放哪？',
        best: 'amber',
        fb: '中频浏览内容最适合放在中部黄色拉伸区，配合上下滑动手势把目标顺手滑进绿色舒适区再点！'
      }
    ];

    const ZONES = [
      { id: 'green', label: '🟢 底部 · 拇指自然舒适区' },
      { id: 'amber', label: '🟡 中部 · 轻度拉伸区' },
      { id: 'red',   label: '🔴 顶部左上 · 需双手高摩擦区' }
    ];

    let idx = 0, score = 0, locked = false, done = false;
    const optsWrap = document.getElementById('optsWrap');
    const fbTxt = document.getElementById('fbTxt');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const t = TASKS[idx];
      locked = false;
      nextBtn.style.display = 'none';
      document.getElementById('stepTag').textContent = `按钮排布 ${idx + 1} / 3 · 得分：${score}/3`;
      document.getElementById('qTitle').textContent = t.q;
      fbTxt.textContent = '为该功能选择最符合人体工学的区域';
      optsWrap.innerHTML = '';

      ZONES.forEach(z => {
        const b = document.createElement('button');
        b.className = 'zone-btn';
        b.textContent = z.label;
        b.onclick = () => {
          if (locked) return;
          locked = true;
          const ok = z.id === t.best;
          b.classList.add(ok ? 'ok' : 'bad');
          if (ok) score++;
          document.getElementById('stepTag').textContent = `按钮排布 ${idx + 1} / 3 · 得分：${score}/3`;
          fbTxt.textContent = (ok ? '✓ 精准排布！' : '⚠️ 不够顺手！') + t.fb;
          ahaBox.innerHTML = `<strong>人体工学解析：</strong>${t.fb}`;
          if (idx === TASKS.length - 1) {
            markDone(`完成移动端单手拇指热区排布评审（${score}/3）`);
            nextBtn.textContent = '↺ 重新排布';
          } else {
            nextBtn.textContent = '下一个按钮 →';
          }
          nextBtn.style.display = 'inline-block';
        };
        optsWrap.appendChild(b);
      });
    }

    nextBtn.onclick = () => {
      if (idx === TASKS.length - 1) { idx = 0; score = 0; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
