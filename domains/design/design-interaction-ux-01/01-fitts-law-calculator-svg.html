<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>费茨定律公式实时模拟器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .arena {
      position: relative; height: 220px; border-radius: 12px; background: var(--tax-surface-alt);
      border: 1px solid var(--tax-border); overflow: hidden; margin: 12px 0;
    }
    .target-dot {
      position: absolute; border-radius: 50%; border: none; color: #fff; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transform: translate(-50%, -50%); transition: transform .08s;
    }
    .target-dot:active { transform: translate(-50%, -50%) scale(0.92); }
    .res-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .res-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎯 费茨定律实测盲测：目标越大越近，点击越快！</h1>
      <p>人机交互第一定律 <strong>MT = a + b · log₂(D/W + 1)</strong>：点击耗时取决于<strong>距离 D</strong> 与<strong>目标宽度 W</strong> 的对数比。亲手完成两轮各 5 次点击，用你的真实手速验证费茨定律！</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button class="toy-btn" id="startBtn">▶ 第 1 轮：小且远目标（W=26px, 高难度）</button>
        <button class="toy-btn secondary" id="resetBtn">↺ 重测</button>
        <span id="statusTxt" style="font-size:13px;color:var(--tax-muted);">点击开始，连续点中 5 次亮起的目标圆点</span>
      </div>

      <div class="arena" id="arena"></div>

      <div class="res-grid">
        <div class="res-card"><div style="font-size:12px;color:var(--tax-muted);">🔴 第 1 轮 · 小且远（26px · ID ≈ 4.3 bit）</div><div style="font-size:22px;font-weight:800;" id="r1Val">—</div></div>
        <div class="res-card"><div style="font-size:12px;color:var(--tax-muted);">🟢 第 2 轮 · 大且近（66px · ID ≈ 1.8 bit）</div><div style="font-size:22px;font-weight:800;" id="r2Val">—</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>实测原理：</strong>目标越小、离指针越远，手腕在末端减速微调的时间呈对数暴涨！完成两轮 5 连击，看看大按钮帮你省了多少毫秒！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let round = 1, hits = 0, startMs = 0, t1 = null, t2 = null, done = false;
    const arena = document.getElementById('arena');
    const startBtn = document.getElementById('startBtn');
    const statusTxt = document.getElementById('statusTxt');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function spawnTarget() {
      arena.innerHTML = '';
      const isHard = round === 1;
      const size = isHard ? 26 : 66;
      // Alternate far left/right for hard, close center-left/right for easy
      const leftPct = isHard ? (hits % 2 === 0 ? 12 : 88) : (hits % 2 === 0 ? 38 : 62);
      const topPct  = isHard ? (hits % 2 === 0 ? 25 : 75) : 50;

      const btn = document.createElement('button');
      btn.className = 'target-dot';
      btn.style.width = size + 'px';
      btn.style.height = size + 'px';
      btn.style.left = leftPct + '%';
      btn.style.top = topPct + '%';
      btn.style.background = isHard ? 'var(--tax-red)' : 'var(--tax-green)';
      btn.style.fontSize = isHard ? '11px' : '15px';
      btn.textContent = `${hits + 1}`;
      btn.onclick = () => {
        if (hits === 0) startMs = performance.now();
        hits++;
        if (hits >= 5) {
          const avgMs = Math.round((performance.now() - startMs) / 4);
          arena.innerHTML = '';
          if (round === 1) {
            t1 = avgMs;
            document.getElementById('r1Val').textContent = `${avgMs} ms / 次`;
            round = 2;
            startBtn.disabled = false;
            startBtn.textContent = '▶ 第 2 轮：大且近目标（W=66px, 低难度）';
            statusTxt.textContent = `第 1 轮平均 ${avgMs}ms！现在测大且近的按钮！`;
          } else {
            t2 = avgMs;
            document.getElementById('r2Val').textContent = `${avgMs} ms / 次`;
            round = 3;
            startBtn.textContent = '✓ 两轮费茨实测已完成';
            statusTxt.textContent = `实测对比：小远 ${t1}ms → 大近 ${t2}ms`;
            markDone(`完成费茨定律手速盲测：${t1}ms vs ${t2}ms`);
            const pct = Math.max(10, Math.round(((t1 - t2) / Math.max(1, t1)) * 100));
            ahaBox.innerHTML = `<strong>费茨定律实测生效（单次提速 ~${pct}%）！</strong>移动端规范要求按钮最小点击热区 <strong>≥ 44×44 px</strong>，高频操作必须尽量放大热区、拉近与上一动作的距离；而“删除/注销”等危险按钮则反其道而行，故意做小放远防误触！`;
          }
        } else {
          statusTxt.textContent = `进度：${hits} / 5`;
          spawnTarget();
        }
      };
      arena.appendChild(btn);
    }

    startBtn.onclick = () => {
      hits = 0;
      startBtn.disabled = true;
      statusTxt.textContent = '准备：点中第 1 个圆点即开始计时！';
      spawnTarget();
    };

    document.getElementById('resetBtn').onclick = () => {
      round = 1; hits = 0; t1 = null; t2 = null;
      arena.innerHTML = '';
      startBtn.disabled = false;
      startBtn.textContent = '▶ 第 1 轮：小且远目标（W=26px, 高难度）';
      document.getElementById('r1Val').textContent = '—';
      document.getElementById('r2Val').textContent = '—';
      statusTxt.textContent = '点击开始，连续点中 5 次亮起的目标圆点';
    };
  </script>
</body>
</html>
