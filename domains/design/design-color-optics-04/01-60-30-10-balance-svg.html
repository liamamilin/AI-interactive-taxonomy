<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚖️ 60-30-10 黄金配色配比实验台（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚖️ 60-30-10 黄金配色配比实验台（SVG）</h1><p>室内设计与 UI 界通行百年的黄金法则：60% 中性留白主色定基调，30% 辅助色划区域，仅留 10% 给最亮眼的强调色引爆焦点！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>主背景中性色占比（建议 ~60%）</span><span id="v60">60%</span></label><input type="range" id="s60" min="20" max="80" value="60" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>高饱和强调色占比（建议 ~10%）</span><span id="v10">10%</span></label><input type="range" id="s10" min="2" max="50" value="10" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 205"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当前三色配比</div><div class="k-val" id="kRat">—</div></div>
        <div class="kpi"><div class="k-lbl">视觉高级感评分</div><div class="k-val" id="kScr">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const p60=+document.getElementById('s60').value, raw10=+document.getElementById('s10').value;
  const p10=Math.min(raw10, 95-p60);
  const p30=Math.max(5, 100 - p60 - p10);
  document.getElementById('v60').textContent=p60+'%';
  document.getElementById('v10').textContent=p10+'%';
  const err=Math.abs(p60-60)*0.7 + Math.abs(p30-30)*0.6 + Math.abs(p10-10)*1.6;
  const scr=Math.max(20, Math.min(98, Math.round(98 - err)));
  document.getElementById('kRat').textContent=p60+' / '+p30+' / '+p10;
  document.getElementById('kScr').textContent=scr+' 分';
  document.getElementById('kScr').style.color=scr>=75?'#059669':'#ef4444';
  const w1=p60*5.2, w2=p30*5.2, w3=p10*5.2;
  document.getElementById('svg').innerHTML=`
    <text x="40" y="32" font-size="13" font-weight="800" fill="var(--tax-text)">画面色彩面积切分条（中性底 + 结构辅助色 + 点睛强调色）</text>
    <rect x="40" y="60" width="${w1.toFixed(0)}" height="62" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
    <rect x="${(40+w1).toFixed(0)}" y="60" width="${w2.toFixed(0)}" height="62" fill="#334155"/>
    <rect x="${(40+w1+w2).toFixed(0)}" y="60" width="${w3.toFixed(0)}" height="62" rx="4" fill="#f97316"/>
    <text x="40" y="150" font-size="12" font-weight="800" fill="var(--tax-muted)">主背景 ${p60}%</text>
    <text x="230" y="150" font-size="12" font-weight="800" fill="#334155">辅助色 ${p30}%</text>
    <text x="420" y="150" font-size="12" font-weight="800" fill="#ea580c">强调色 ${p10}%</text>
    <text x="40" y="182" font-size="11.5" fill="var(--tax-muted)">${p10>22?'⚠️ 强调色面积太大，视觉像打翻颜料盘一样刺眼喧宾夺主！':'✅ 主次分明，10% 的亮橙色瞬间锁住视线焦点！'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>配色的秘诀不在选出多惊艳的颜色，而在于克制——给 90% 的画面做减法，那 10% 的强调色才会发光！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
