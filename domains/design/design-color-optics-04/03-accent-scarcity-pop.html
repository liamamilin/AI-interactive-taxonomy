<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 强调色的稀缺定律：满屏高亮等于没有高亮</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎯 强调色的稀缺定律：满屏高亮等于没有高亮</h1><p>冯·雷斯托夫孤立效应：在一排灰色按钮里放 1 个亮橙色按钮，用户 0.2 秒就能点中；放 6 个亮橙色按钮，主按钮的点击率直接腰斩！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>页面中同时高亮的按钮数量</span><span id="vCnt">1 个（唯一焦点）</span></label><input type="range" id="sCnt" min="1" max="8" value="1" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>强调色与背景对比度</span><span id="vCon">85%</span></label><input type="range" id="sCon" min="30" max="100" value="85" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">主按钮首眼捕获率</div><div class="k-val" id="kPop">—</div></div>
        <div class="kpi"><div class="k-lbl">视觉噪音判定</div><div class="k-val" id="kSt">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const cnt=+document.getElementById('sCnt').value, con=+document.getElementById('sCon').value;
  document.getElementById('vCnt').textContent=cnt+' 个';
  document.getElementById('vCon').textContent=con+'%';
  const pop=Math.max(12, Math.min(98, Math.round((con*1.08)/Math.pow(cnt, 0.72))));
  document.getElementById('kPop').textContent=pop+'%';
  document.getElementById('kPop').style.color=pop>=70?'#059669':'#ef4444';
  document.getElementById('kSt').textContent=cnt===1?'🎯 孤立效应拉满':(cnt<=3?'⚠️ 焦点开始分散':'💥 全屏都在大喊大叫');
  let btns='';
  for(let i=0;i<8;i++){
    const col=i%4, row=Math.floor(i/4);
    const x=45+col*132, y=54+row*56;
    const hi=i<cnt;
    btns+=`<rect x="${x}" y="${y}" width="116" height="40" rx="8" fill="${hi?'#f97316':'#e2e8f0'}" opacity="${hi?(con/100).toFixed(2):'0.85'}"/>
      <text x="${x+58}" y="${y+25}" text-anchor="middle" font-size="12" font-weight="800" fill="${hi?'#fff':'#475569'}">${i===0?'主操作 CTA':('次操作 '+(i+1))}</text>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="45" y="30" font-size="13" font-weight="800" fill="var(--tax-text)">一屏 8 个操作按钮：当高亮数量从 1 增加到 ${cnt} 时</text>
    ${btns}
    <text x="45" y="182" font-size="11.5" fill="var(--tax-muted)">所有部门都想把自己的按钮标红加粗，最终结果就是谁都看不见！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>每一屏只留一个最高优先级的实心强调按钮，其余全部降级为描边或纯文字按钮——这是转化率提升最稳的设计原则。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
