<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>三分法构图 vs 死板居中：动态张力对比</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .m-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>📷 三分法构图 vs 死板居中：取景器空间探索</h1>
      <p>在下方海景取景器里<strong>任意点击放置帆船位置</strong>（或点击快捷预设），观察把主体挪到 3×3 <strong>三分交点（Power Points）</strong>后，画面如何瞬间产生方向感与呼吸张力！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn secondary" id="pCenter">😐 死板居中（50%, 50%）</button>
        <button class="toy-btn" id="pThird">✨ 黄金三分交点（33%, 67%）</button>
        <button class="toy-btn secondary" id="gridToggle">▦ 网格辅助线：开</button>
      </div>

      <svg id="camSvg" viewBox="0 0 680 260" width="100%" style="display:block;border-radius:12px;border:1px solid var(--tax-border);cursor:crosshair;" aria-label="三分法构图交互取景器"></svg>

      <div class="metrics">
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">当前主体坐标</div><strong id="posVal" style="font-size:16px;">X: 33% · Y: 67%</strong></div>
        <div class="m-card"><div style="font-size:12px;color:var(--tax-muted);">构图视觉张力评分</div><strong id="scoreVal" style="font-size:16px;color:var(--tax-green);">94 / 100（动态张力极佳）</strong></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>三分法密码：</strong>把帆船放在左侧 1/3 交点、船头朝向右侧大片留白（视线引导空间 Lead Room），观者会立刻感受到“船正在驶向远方”的动势！试试点回正中心对比一下！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let bx = 227, by = 173; // Left-bottom third intersection
    let showGrid = true;
    let done = false;

    const svg = document.getElementById('camSvg');
    const gridToggle = document.getElementById('gridToggle');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const px = Math.round((bx / 680) * 100);
      const py = Math.round((by / 260) * 100);
      document.getElementById('posVal').textContent = `X: ${px}% · Y: ${py}%`;

      // Distance to nearest of 4 power points
      const pts = [[227, 87], [453, 87], [227, 173], [453, 173]];
      const minD = Math.min(...pts.map(([tx, ty]) => Math.hypot(bx - tx, by - ty)));
      const isCenter = Math.hypot(bx - 340, by - 130) < 42;
      const isEdge = bx < 50 || bx > 630 || by < 45 || by > 225;

      let score = Math.max(45, Math.min(96, Math.round(96 - minD * 0.35)));
      if (isCenter) score = 58;
      if (isEdge) score = 40;

      const scoreEl = document.getElementById('scoreVal');
      if (score >= 85) {
        scoreEl.textContent = `${score} / 100（✨ 黄金三分张力！）`;
        scoreEl.style.color = 'var(--tax-green)';
        ahaBox.innerHTML = '<strong>命中三分兴趣点！</strong>主体偏离中心后，画面不再被一刀切死，一侧紧凑、一侧舒展，自然拉出纵深感与前进方向感。海平线也同步落在了下 1/3 线上！';
      } else if (isCenter) {
        scoreEl.textContent = `${score} / 100（😐 死板居中）`;
        scoreEl.style.color = 'var(--tax-amber)';
        ahaBox.innerHTML = '<strong>正中心陷阱：</strong>把船放在正中央（50%, 50%）会让左右留白完全对称，视线停死在中间无法流动，像一张呆板的证件照。点击任意三分交点激活张力！';
      } else if (isEdge) {
        scoreEl.textContent = `${score} / 100（⚠️ 挤出画框边缘）`;
        scoreEl.style.color = 'var(--tax-red)';
        ahaBox.innerHTML = '<strong>边缘压迫：</strong>主体贴边太近会产生“撞墙感”，仿佛马上要掉出画框。往内收到 1/3 交点附近最舒服！';
      } else {
        scoreEl.textContent = `${score} / 100（过渡区域）`;
        scoreEl.style.color = 'var(--tax-primary)';
        ahaBox.innerHTML = '<strong>继续微调：</strong>试着把帆船点到 4 个亮圈（三分交点）上，尤其是左下方交点，感受船头朝向右方大片海面的开阔感！';
      }

      const horizonY = isCenter ? 130 : 173;
      let html = `
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e3a5f"/>
            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.45"/>
          </linearGradient>
          <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0f172a"/>
            <stop offset="100%" stop-color="#1e293b"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="680" height="${horizonY}" fill="url(#skyGrad)"/>
        <rect x="0" y="${horizonY}" width="680" height="${260 - horizonY}" fill="url(#seaGrad)"/>
        <circle cx="520" cy="72" r="24" fill="rgba(251,191,36,0.85)"/>
      `;

      // Rule of thirds grid overlay
      if (showGrid) {
        html += `<line x1="227" y1="0" x2="227" y2="260" stroke="rgba(255,255,255,0.35)" stroke-dasharray="5 4"/>`;
        html += `<line x1="453" y1="0" x2="453" y2="260" stroke="rgba(255,255,255,0.35)" stroke-dasharray="5 4"/>`;
        html += `<line x1="0" y1="87" x2="680" y2="87" stroke="rgba(255,255,255,0.35)" stroke-dasharray="5 4"/>`;
        html += `<line x1="0" y1="173" x2="680" y2="173" stroke="rgba(255,255,255,0.35)" stroke-dasharray="5 4"/>`;
        pts.forEach(([tx, ty]) => {
          html += `<circle cx="${tx}" cy="${ty}" r="7" fill="none" stroke="rgba(251,191,36,0.8)" stroke-width="2"/>`;
        });
      }

      // Sailboat at (bx, by) facing right
      html += `<g transform="translate(${bx},${by})">`;
      html += `<polygon points="-24,0 28,0 18,12 -16,12" fill="#f8fafc"/>`;
      html += `<polygon points="0,-42 0,-3 24,-3" fill="#fbbf24"/>`;
      html += `<polygon points="-3,-34 -3,-3 -18,-3" fill="#e2e8f0"/>`;
      html += `</g>`;

      svg.innerHTML = html;
    }

    svg.addEventListener('click', e => {
      const r = svg.getBoundingClientRect();
      bx = Math.max(25, Math.min(655, ((e.clientX - r.left) / r.width) * 680));
      by = Math.max(45, Math.min(235, ((e.clientY - r.top) / r.height) * 260));
      markDone('在三分法取景器中自由摆放了主体位置');
      render();
    });

    document.getElementById('pCenter').onclick = () => { bx = 340; by = 130; markDone('对比了居中构图'); render(); };
    document.getElementById('pThird').onclick = () => { bx = 227; by = 173; markDone('应用了三分交点构图'); render(); };
    gridToggle.onclick = () => {
      showGrid = !showGrid;
      gridToggle.textContent = showGrid ? '▦ 网格辅助线：开' : '▦ 网格辅助线：关';
      render();
    };
    render();
  </script>
</body>
</html>
