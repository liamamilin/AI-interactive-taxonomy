<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐚 黄金比例 1.618 排版音阶生成器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🐚 黄金比例 1.618 排版音阶生成器</h1><p>乱填 15px、19px、23px 会让字号显得杂乱无章；用固定几何公比（如 1.25 大三度或 1.618 黄金比）逐级放大，字号像音乐音阶一样和谐！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>基础正文字号 Base</span><span id="vB">16 px</span></label><input type="range" id="sB" min="12" max="20" value="16" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>模块化字号公比 Ratio</span><span id="vR">1.41（增四度）</span></label><input type="range" id="sR" min="1.15" max="1.62" step="0.03" value="1.41" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 210"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">三级标题字号阶梯</div><div class="k-val" id="kStp">—</div></div>
        <div class="kpi"><div class="k-lbl">适用场景</div><div class="k-val" id="kUse">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const base=+document.getElementById('sB').value, rat=+document.getElementById('sR').value;
  document.getElementById('vB').textContent=base+' px';
  document.getElementById('vR').textContent=rat.toFixed(2);
  const h3=Math.round(base*rat), h2=Math.round(base*rat*rat), h1=Math.min(54, Math.round(base*rat*rat*rat));
  document.getElementById('kStp').textContent=`${base} → ${h3} → ${h2} → ${h1} px`;
  document.getElementById('kUse').textContent=rat>=1.45?'📰 杂志/落地页强冲击':'💻 后台工具/文档紧凑排版';
  document.getElementById('svg').innerHTML=`
    <text x="30" y="${Math.min(68, 22+h1)}" font-size="${Math.min(44,h1)}" font-weight="900" fill="var(--tax-text)">H1 主标题 (${h1}px)</text>
    <text x="30" y="114" font-size="${Math.min(30,h2)}" font-weight="800" fill="#3b82f6">H2 章节标题 (${h2}px)</text>
    <text x="30" y="152" font-size="${Math.min(22,h3)}" font-weight="750" fill="#059669">H3 小节标题 (${h3}px)</text>
    <text x="30" y="184" font-size="${base}" fill="var(--tax-muted)">Body 正文基准字号 (${base}px) · 公比 ${rat.toFixed(2)}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>网页和移动端常用 1.2~1.333（温和紧凑），海报和品牌官网常用 1.5~1.618（黄金比例强视觉反差）！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
