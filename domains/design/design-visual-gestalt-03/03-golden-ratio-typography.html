<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>黄金比例 1.618 排版音阶生成器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ratio-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .specimen { padding: 16px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
    .spec-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--tax-border); padding: 8px 0; }
    .spec-line:last-child { border-bottom: none; }
    .spec-meta { font-size: 12px; font-family: ui-monospace, monospace; color: var(--tax-muted); white-space: nowrap; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🐚 黄金比例 1.618 排版音阶（Modular Scale）模拟器</h1>
      <p>为什么大师排出来的标题和正文看着像音乐一样和谐，自己随便挑字号（14 / 17 / 21）却显得散乱？因为排版师用<strong>等比音阶（基准字号 × 比例系数ⁿ）</strong>生成整套字号体系！</p>
    </header>

    <section class="toy-card">
      <div class="ratio-row" id="ratioRow"></div>

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:13px;">
        <span>正文基准字号：</span>
        <input type="range" id="baseRange" min="13" max="18" value="16" style="flex:1;" />
        <strong id="baseVal" style="color:var(--tax-primary);">16 px</strong>
      </div>

      <div class="specimen" id="specimenBox"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>排版音阶法则：</strong>切换上方 4 种音乐音程比例——移动端仪表盘适合紧凑的 <code>1.200</code>，长文博客适合 <code>1.250–1.333</code>，而冲击力十足的落地页海报则最爱 <strong>1.618 黄金比例</strong>！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const RATIOS = [
      { id: '1.125', name: '1.125 大二度（极紧凑）', r: 1.125, use: '信息密集的金融终端 / 数据后台' },
      { id: '1.250', name: '1.250 大三度（经典博客）', r: 1.250, use: '技术文档、长文阅读与通用 Web App' },
      { id: '1.414', name: '1.414 增四度（A4 纸比例）', r: 1.414, use: '杂志排版与中等视觉张力官网' },
      { id: '1.618', name: '1.618 黄金比例（海报级）', r: 1.618, use: '品牌落地页、发布会主视觉大标题' }
    ];

    let cur = RATIOS[3];
    let done = false;

    const ratioRow = document.getElementById('ratioRow');
    const baseRange = document.getElementById('baseRange');
    const specimenBox = document.getElementById('specimenBox');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const base = Number(baseRange.value);
      document.getElementById('baseVal').textContent = base + ' px';

      ratioRow.innerHTML = '';
      RATIOS.forEach(item => {
        const b = document.createElement('button');
        b.className = item.id === cur.id ? 'toy-btn' : 'toy-btn secondary';
        b.textContent = item.name;
        b.onclick = () => { cur = item; markDone(`测试了排版音阶比例 ${item.name}`); render(); };
        ratioRow.appendChild(b);
      });

      const levels = [
        { tag: 'H1 主标题', pow: 2, text: '比例即视觉韵律' },
        { tag: 'H2 章节题', pow: 1, text: '等比数列让层级自动对齐' },
        { tag: 'Body 正文', pow: 0, text: '基准正文提供稳定的阅读锚点，所有标题都从它出发按固定倍率生长。' },
        { tag: 'Caption 注脚', pow: -1, text: '辅助说明文字按同一比例向下收敛' }
      ];

      specimenBox.innerHTML = levels.map(lv => {
        const px = Math.min(54, Math.max(11, Math.round(base * Math.pow(cur.r, lv.pow))));
        const fw = lv.pow >= 1 ? 800 : 400;
        const col = lv.pow < 0 ? 'var(--tax-muted)' : 'var(--tax-ink)';
        return `<div class="spec-line">
          <div style="font-size:${px}px;font-weight:${fw};line-height:1.25;color:${col};">${lv.text}</div>
          <div class="spec-meta">${lv.tag} · ${px}px</div>
        </div>`;
      }).join('');

      ahaBox.innerHTML = `<strong>当前音阶 ${cur.name}：</strong>最适合 <strong>${cur.use}</strong>。用固定等比数列（而非拍脑袋乱写字号）生成字号体系，能让页面像调好音的钢琴一样天然和谐！`;
    }

    baseRange.oninput = () => { markDone('调节了排版音阶基准字号'); render(); };
    render();
  </script>
</body>
</html>
