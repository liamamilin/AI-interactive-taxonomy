<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📏 12 列网格魔力：2/3/4/6 等分一网打尽（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📏 12 列网格魔力：2/3/4/6 等分一网打尽（SVG）</h1><p>为什么是 12 列而不是 10 列？因为 10 只能被 2 和 5 整除，而 12 可以同时被 2、3、4、6 完美整除，一套网格就能通吃全部页面布局！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="btn-row">
        <button class="btn active" onclick="setCols(2,this)">2 栏 (6+6)</button>
        <button class="btn" onclick="setCols(3,this)">3 栏 (4+4+4)</button>
        <button class="btn" onclick="setCols(4,this)">4 栏 (3+3+3+3)</button>
        <button class="btn" onclick="setCols(6,this)">6 栏 (2×6)</button>
      </div>
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>列间槽宽 Gutter（8px 倍数）</span><span id="vGut">16 px</span></label><input type="range" id="sGut" min="4" max="24" step="4" value="16" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">当前每栏占 12 列格数</div><div class="k-val" id="kSpan">—</div></div>
        <div class="kpi"><div class="k-lbl">对齐整洁度</div><div class="k-val">100% 严丝合缝</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
let nCols=2;
function setCols(n,btn){ nCols=n; document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); draw(); }
function draw(){
  const gut=+document.getElementById('sGut').value;
  document.getElementById('vGut').textContent=gut+' px';
  const span=12/nCols;
  document.getElementById('kSpan').textContent=span+' 列 / 栏';
  const totalW=540, x0=30;
  let bgCols='', cards='';
  const colW=(totalW - 11*6)/12;
  for(let i=0;i<12;i++){
    bgCols+=`<rect x="${(x0+i*(colW+6)).toFixed(1)}" y="40" width="${colW.toFixed(1)}" height="135" fill="#ef4444" opacity="0.1"/>`;
  }
  const cardW=(totalW - (nCols-1)*gut)/nCols;
  for(let i=0;i<nCols;i++){
    const x=x0+i*(cardW+gut);
    cards+=`<rect x="${x.toFixed(1)}" y="68" width="${Math.max(10,cardW).toFixed(1)}" height="80" rx="8" fill="#3b82f6" opacity="0.82"/>
      <text x="${(x+cardW/2).toFixed(1)}" y="113" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">Span ${span}</text>`;
  }
  document.getElementById('svg').innerHTML=`
    <text x="30" y="28" font-size="13" font-weight="800" fill="var(--tax-text)">底层 12 列辅助红柱 + 当前 ${nCols} 栏自适应卡片</text>
    ${bgCols}${cards}`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>网格不是束缚创意的牢笼，而是让不同模块的左右边界隐形对齐的骨架——对齐本身就能带来极强的专业秩序感！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
