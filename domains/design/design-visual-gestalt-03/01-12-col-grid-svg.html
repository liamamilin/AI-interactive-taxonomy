<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>12 列网格魔力：2/3/4/6 等分一网打尽</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .mode-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>📏 12 列网格魔力：为什么全世界的网页都爱用 12 列？</h1>
      <p>12 是极少数能同时被 <strong>2、3、4、6</strong> 整除的高合成数！点击下方等分布局按钮，再切到「10 列网格对照组」看看 10 列在 3 等分和 4 等分时如何瞬间崩成小数！</p>
    </header>

    <section class="toy-card">
      <div class="mode-bar">
        <button class="toy-btn" id="base12Btn">✅ 12 列标准网格</button>
        <button class="toy-btn secondary" id="base10Btn">⚠️ 对比：10 列网格</button>
      </div>

      <div class="btn-row" id="splitRow"></div>

      <svg id="gridSvg" viewBox="0 0 680 205" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="12列与10列网格等分演示"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>网格密码：</strong>点击上方「2/3/4/6 等分」和「4+8 侧栏」，再切到「10 列网格」对比——你立刻就懂 Bootstrap、Figma 和苹果官网为何全选 12 列！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const SPLITS = [
      { id: '2', label: '2 等分（双栏）', parts: 2 },
      { id: '3', label: '3 等分（三卡片）', parts: 3 },
      { id: '4', label: '4 等分（四宫格）', parts: 4 },
      { id: '6', label: '6 等分（图标栏）', parts: 6 },
      { id: 'aside', label: '不对称 1:2（侧栏+正文）', parts: -1 }
    ];

    let totalCols = 12;
    let curSplit = SPLITS[1]; // Default 3-col
    let done = false;

    const splitRow = document.getElementById('splitRow');
    const svg = document.getElementById('gridSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('base12Btn').className = totalCols === 12 ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('base10Btn').className = totalCols === 10 ? 'toy-btn' : 'toy-btn secondary';

      splitRow.innerHTML = '';
      SPLITS.forEach(s => {
        const b = document.createElement('button');
        b.className = s.id === curSplit.id ? 'toy-btn' : 'toy-btn secondary';
        b.textContent = s.label;
        b.onclick = () => { curSplit = s; markDone(`测试了${totalCols}列网格的${s.label}`); render(); };
        splitRow.appendChild(b);
      });

      const pad = 24, gap = 8;
      const usableW = 680 - pad * 2;
      const colW = (usableW - gap * (totalCols - 1)) / totalCols;

      let html = '';
      // Underlying guide columns
      for (let i = 0; i < totalCols; i++) {
        const x = pad + i * (colW + gap);
        html += `<rect x="${x.toFixed(1)}" y="34" width="${colW.toFixed(1)}" height="148" rx="4" fill="rgba(239,68,68,0.09)"/>`;
        html += `<text x="${(x + colW / 2).toFixed(1)}" y="24" text-anchor="middle" fill="var(--tax-muted)" font-size="10">${i + 1}</text>`;
      }

      // Compute cards
      let spans = [];
      let exact = true;
      if (curSplit.parts === -1) {
        if (totalCols === 12) spans = [4, 8];
        else { spans = [3.33, 6.67]; exact = false; }
      } else {
        const each = totalCols / curSplit.parts;
        exact = Number.isInteger(each);
        spans = Array(curSplit.parts).fill(each);
      }

      let cursor = 0;
      spans.forEach((sp, idx) => {
        const x = pad + cursor * (colW + gap);
        const w = sp * colW + (sp - 1) * gap;
        cursor += sp;
        const fill = exact ? 'rgba(59,130,246,0.22)' : 'rgba(239,68,68,0.22)';
        const stroke = exact ? 'var(--tax-primary)' : 'var(--tax-red)';
        html += `<rect x="${x.toFixed(1)}" y="56" width="${w.toFixed(1)}" height="104" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
        html += `<text x="${(x + w / 2).toFixed(1)}" y="106" text-anchor="middle" fill="var(--tax-ink)" font-size="13" font-weight="800">模块 ${idx + 1}</text>`;
        html += `<text x="${(x + w / 2).toFixed(1)}" y="126" text-anchor="middle" fill="${stroke}" font-size="11.5" font-weight="700">${exact ? `占 ${sp} 列 ✓` : `占 ${sp.toFixed(2)} 列 ✕`}</text>`;
      });

      html += `<text x="340" y="196" text-anchor="middle" fill="${exact ? 'var(--tax-green)' : 'var(--tax-red)'}" font-size="12" font-weight="700">${exact ? `✅ 完美对齐整数列！所有模块边缘严丝合缝贴合 ${totalCols} 列网格线` : `⚠️ 对齐崩溃！${totalCols} 无法整除，卡片边缘悬空在网格缝隙中间！`}</text>`;
      svg.innerHTML = html;

      ahaBox.innerHTML = exact
        ? `<strong>${totalCols} 列完美整除（${curSplit.label}）：</strong>每个模块正好占据整数列，既保证跨页视觉节奏统一，又能让不同屏幕尺寸优雅折叠。试试切到「10 列网格」看 3 等分怎么翻车！`
        : `<strong>10 列网格翻车（${curSplit.label}）：</strong>10 只能被 2 和 5 整除，一遇到网页最常用的 <strong>3 卡片</strong>、<strong>4 宫格</strong>或 <strong>1:2 侧栏</strong>，列数就变成 3.33 或 2.5，彻底破坏对齐感！这就是 12 列称霸设计界百年的数学原因。`;
    }

    document.getElementById('base12Btn').onclick = () => { totalCols = 12; markDone('切换回12列网格'); render(); };
    document.getElementById('base10Btn').onclick = () => { totalCols = 10; markDone('对比了10列网格的整除缺陷'); render(); };
    render();
  </script>
</body>
</html>
