<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>物理防呆约束：USB-A 永远插反 vs Type-C 正反盲插</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .s-card { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔌 物理防呆约束（Poka-Yoke）：USB-A 量子叠加态盲插实验</h1>
      <p>著名的“USB-A 量子悖论”：明明只有正反两面，为什么每次盲插都要<strong>插 3 次才进得去</strong>？亲自试着盲插下面两个接口，对比「不对称暗黑盲插 USB-A」与「对称防呆 USB Type-C」！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="modeABtn">❌ 老式 USB-A（非对称，正反难辨）</button>
        <button class="toy-btn secondary" id="modeCBtn">✅ 现代 USB Type-C（180° 对称防呆）</button>
        <button class="toy-btn secondary" id="plugBtn">🔌 盲插进电脑接口！</button>
        <button class="toy-btn secondary" id="flipBtn">🔄 翻转 180° 再试</button>
      </div>

      <svg id="usbSvg" viewBox="0 0 680 185" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="USB-A与Type-C物理防呆盲插实验"></svg>

      <div class="stats">
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">当前接口模式</div><strong id="curModeVal" style="font-size:16px;">USB-A（需对准内部舌片）</strong></div>
        <div class="s-card"><div style="font-size:12px;color:var(--tax-muted);">本次成功插入尝试次数</div><strong id="tryVal" style="font-size:18px;color:var(--tax-primary);">0 次</strong></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>盲插挑战：</strong>点击「🔌 盲插进电脑接口！」体验老式 USB-A 经典的“插不进 → 翻面还是插不进 → 再翻回去居然进了”三连击，然后切到 <strong>Type-C</strong> 感受物理对称防呆的优雅！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let isC = false;
    let tries = 0;
    let plugged = false;
    let flipped = false;
    let statusMsg = '请点击「🔌 盲插进电脑接口！」开始测试';
    let done = false;

    const svg = document.getElementById('usbSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('modeABtn').className = !isC ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('modeCBtn').className = isC ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('curModeVal').textContent = isC ? 'USB Type-C（上下完全对称）' : 'USB-A（内部不对称，盲插极易卡住）';
      document.getElementById('tryVal').textContent = `${tries} 次${plugged ? '（✅ 已插入）' : ''}`;

      const plugX = plugged ? 380 : 210;
      let html = '';

      // Right: Laptop Port
      html += `<rect x="425" y="45" width="190" height="94" rx="12" fill="rgba(148,163,184,0.16)" stroke="var(--tax-border)" stroke-width="2"/>`;
      html += `<text x="520" y="72" text-anchor="middle" fill="var(--tax-muted)" font-size="12" font-weight="700">💻 电脑机身接口</text>`;
      if (isC) {
        html += `<rect x="425" y="82" width="16" height="28" rx="8" fill="var(--tax-green)"/>`;
      } else {
        html += `<rect x="425" y="74" width="14" height="44" rx="3" fill="var(--tax-amber)"/>`;
        html += `<rect x="425" y="96" width="14" height="10" fill="var(--tax-ink)"/>`;
      }

      // Left: Plug head
      const col = plugged ? 'var(--tax-green)' : (isC ? 'var(--tax-primary)' : 'var(--tax-amber)');
      html += `<rect x="${plugX - 90}" y="68" width="90" height="52" rx="10" fill="rgba(59,130,246,0.18)" stroke="${col}" stroke-width="2.5"/>`;
      html += `<rect x="${plugX}" y="${isC ? 80 : 75}" width="45" height="${isC ? 28 : 38}" rx="${isC ? 12 : 3}" fill="${col}" opacity="0.85"/>`;
      html += `<text x="${plugX - 45}" y="98" text-anchor="middle" fill="var(--tax-ink)" font-size="12" font-weight="800">${isC ? 'Type-C' : (flipped ? 'USB-A 反' : 'USB-A 正')}</text>`;

      html += `<text x="340" y="166" text-anchor="middle" fill="${plugged ? 'var(--tax-green)' : 'var(--tax-ink)'}" font-size="12.5" font-weight="800">${statusMsg}</text>`;
      svg.innerHTML = html;
    }

    document.getElementById('plugBtn').onclick = () => {
      if (plugged) return;
      tries++;
      markDone(`测试了${isC ? 'Type-C' : 'USB-A'}物理防呆盲插`);
      if (isC) {
        plugged = true;
        statusMsg = '✅ Type-C 正反完全对称，第 1 次闭眼秒插成功！';
        ahaBox.innerHTML = '<strong>最高级的防错（Poka-Yoke = 消除出错的物理可能）：</strong>USB Type-C 不需要提醒用户“哪面朝上”，而是通过 180° 物理对称设计让“插反”这个错误在物理宇宙里直接消失！';
      } else {
        if (tries === 1) {
          statusMsg = '💥 第 1 次插不进去！方向好像反了，点「🔄 翻转 180°」再试！';
        } else if (tries === 2) {
          statusMsg = '💥 第 2 次还是卡住！（其实第 1 次是对的只是没对准角）再翻一次试试！';
        } else {
          plugged = true;
          statusMsg = '✅ 第 3 次终于插进去了！经典 USB-A 量子叠加态达成！';
          ahaBox.innerHTML = '<strong>USB-A 的教训（平均 3 次才成功）：</strong>对称的矩形外壳藏着不对称的内部舌片，从外观几乎分不出正反，是工业史最著名的反防呆教材！点「✅ 现代 USB Type-C」体验什么叫一次就进！';
        }
      }
      render();
    };

    document.getElementById('flipBtn').onclick = () => {
      if (plugged) return;
      flipped = !flipped;
      statusMsg = '已翻转 180°，现在再点「🔌 盲插进电脑接口！」';
      render();
    };

    document.getElementById('modeABtn').onclick = () => { isC = false; tries = 0; plugged = false; flipped = false; statusMsg = '已切回老式 USB-A，点击「盲插」试试！'; render(); };
    document.getElementById('modeCBtn').onclick = () => { isC = true; tries = 0; plugged = false; flipped = false; statusMsg = '已切换至 Type-C，随便怎么插试一次！'; render(); };
    render();
  </script>
</body>
</html>
