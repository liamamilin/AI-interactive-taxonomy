<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>防错设计：为什么“撤销键”吊打“你确定要删除吗？”</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .mail-item {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 8px;
    }
    .modal-box {
      padding: 14px; border-radius: 12px; background: var(--tax-red-soft); border: 2px solid var(--tax-red);
      margin: 10px 0; display: none;
    }
    .toast-box {
      padding: 10px 14px; border-radius: 10px; background: var(--tax-green-soft); border: 1px solid var(--tax-green);
      display: none; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>↩️ 防错设计：为什么“撤销键”吊打“你确定要删除吗？”（情景对比）</h1>
      <p>试着删掉下面几封测试邮件：对比<strong>A：弹窗反复拷问“你确定要删除吗？”</strong>（反而把人练出闭眼猛点确定的肌肉反射！）与<strong>B：直接删除 + 底部【↩️ 撤销】安全网</strong>的体验差距！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="modalModeBtn">❌ 传统防错：每次弹窗“你确定吗？”</button>
        <button class="toy-btn secondary" id="undoModeBtn">✅ 现代防错：直接删 + 顶部/底部【↩️ 撤销】</button>
        <button class="toy-btn secondary" id="restoreBtn">↺ 恢复 3 封邮件</button>
      </div>

      <div id="mailList"></div>

      <div class="modal-box" id="modalBox">
        <div style="font-weight:800;color:var(--tax-red);margin-bottom:6px;" id="modalTitle">⚠️ 警告：你确定要永久删除这封邮件吗？</div>
        <div style="font-size:12px;color:var(--tax-muted);margin-bottom:10px;">（连删 3 封都要停下来确认，你是不是已经烦得想闭眼猛点“确定”了？）</div>
        <button class="toy-btn" id="confirmDelBtn">确定删除</button>
        <button class="toy-btn secondary" id="cancelDelBtn">取消</button>
      </div>

      <div class="toast-box" id="toastBox">
        <span id="toastMsg">已删除邮件</span>
        <button class="toy-btn" id="undoBtn" style="padding:5px 12px;font-size:12.5px;">↩️ 立即撤销</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>防错心理学（Habituation 习惯化效应）：</strong>用户点击“删除”的那一刻，潜意识里就是觉得“我确定”——所以 99% 的“你确定吗？”弹窗根本拦不住误删，反而制造弹窗疲劳！真正高明的防错是<strong>允许随时反悔的【撤销】安全网</strong>！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const INIT_MAILS = [
      { id: 1, title: '📩 广告：双十一全场 1 折大促' },
      { id: 2, title: '📩 重要：2026 年度合同终稿（小心误删！）' },
      { id: 3, title: '📩 通知：周报提交提醒' }
    ];

    let mails = [...INIT_MAILS];
    let useUndo = false;
    let pendingId = null;
    let lastDeleted = null;
    let done = false;

    const mailList = document.getElementById('mailList');
    const modalBox = document.getElementById('modalBox');
    const toastBox = document.getElementById('toastBox');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('modalModeBtn').className = !useUndo ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('undoModeBtn').className = useUndo ? 'toy-btn' : 'toy-btn secondary';

      mailList.innerHTML = mails.length
        ? mails.map(m => `
            <div class="mail-item">
              <span style="font-size:13.5px;font-weight:600;">${m.title}</span>
              <button class="toy-btn secondary" data-del="${m.id}" style="padding:5px 11px;font-size:12px;">🗑️ 删除</button>
            </div>`).join('')
        : '<div style="padding:14px;text-align:center;color:var(--tax-muted);font-size:13px;">收件箱已清空，可点上方「恢复 3 封邮件」重玩</div>';

      mailList.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = () => onDeleteClick(Number(btn.dataset.del));
      });
    }

    function onDeleteClick(id) {
      markDone(`体验了${useUndo ? '撤销安全网' : '确认弹窗'}防错模式`);
      if (!useUndo) {
        pendingId = id;
        const m = mails.find(x => x.id === id);
        document.getElementById('modalTitle').textContent = `⚠️ 你确定要永久删除「${m.title}」吗？`;
        modalBox.style.display = 'block';
        toastBox.style.display = 'none';
      } else {
        const idx = mails.findIndex(x => x.id === id);
        lastDeleted = { item: mails[idx], idx };
        mails.splice(idx, 1);
        modalBox.style.display = 'none';
        toastBox.style.display = 'flex';
        document.getElementById('toastMsg').textContent = `已移入回收站：${lastDeleted.item.title}`;
        ahaBox.innerHTML = '<strong>丝滑又安心（Gmail 同款防错）：</strong>正常清理广告邮件时零打断、一气呵成；万一真的手滑误删了“年度合同”，立刻点绿色【↩️ 撤销】满血复活！';
        render();
      }
    }

    document.getElementById('confirmDelBtn').onclick = () => {
      mails = mails.filter(m => m.id !== pendingId);
      modalBox.style.display = 'none';
      ahaBox.innerHTML = '<strong>确认弹窗的悖论：</strong>点完“删除”又点“确定”，不仅多耗一倍操作，更糟糕的是删除后真的不可逆——万一刚才习惯性猛点把“重要合同”删了，神仙也救不回来！切到右侧【撤销模式】对比一下！';
      render();
    };
    document.getElementById('cancelDelBtn').onclick = () => { modalBox.style.display = 'none'; };

    document.getElementById('undoBtn').onclick = () => {
      if (lastDeleted) {
        mails.splice(lastDeleted.idx, 0, lastDeleted.item);
        lastDeleted = null;
        toastBox.style.display = 'none';
        markDone('使用撤销键成功挽回了误删邮件');
        ahaBox.innerHTML = '<strong>完美挽回！</strong>记住 UX 黄金原则：<strong>只在真正不可逆的核弹级操作（如永久注销账号、发全员邮件）上用二次确认；其余 95% 的删除操作，用“先执行 + 撤销安全网”体验吊打弹窗！</strong>';
        render();
      }
    };

    document.getElementById('modalModeBtn').onclick = () => { useUndo = false; toastBox.style.display = 'none'; render(); };
    document.getElementById('undoModeBtn').onclick = () => { useUndo = true; modalBox.style.display = 'none'; render(); };
    document.getElementById('restoreBtn').onclick = () => { mails = [...INIT_MAILS]; modalBox.style.display = 'none'; toastBox.style.display = 'none'; render(); };
    render();
  </script>
</body>
</html>
