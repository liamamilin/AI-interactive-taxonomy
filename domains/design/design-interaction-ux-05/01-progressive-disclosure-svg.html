<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪜 渐进披露分层器：首屏藏起 80% 低频设置（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🪜 渐进披露分层器：首屏藏起 80% 低频设置（SVG）</h1><p>渐进披露（Progressive Disclosure）：首屏只放 80% 用户每天必用的核心功能，把 20% 专家才调的参数优雅藏进“高级选项”折叠栏里！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>首屏直接平铺展示的功能比例</span><span id="vExp">25%（克制精简）</span></label><input type="range" id="sExp" min="10" max="100" value="25" oninput="draw()"></div>
        <div class="ctrl-box"><label><span>产品总功能复杂度（项）</span><span id="vTot">40 项</span></label><input type="range" id="sTot" min="10" max="80" step="5" value="40" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 200"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">首屏可见控件数</div><div class="k-val" id="kVis">—</div></div>
        <div class="kpi"><div class="k-lbl">新手首日上手成功率</div><div class="k-val" id="kOnb">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function draw(){
  const exp=+document.getElementById('sExp').value, tot=+document.getElementById('sTot').value;
  document.getElementById('vExp').textContent=exp+'%';
  document.getElementById('vTot').textContent=tot+' 项';
  const vis=Math.max(2, Math.round(tot*exp/100));
  const onb=Math.max(15, Math.min(97, Math.round(98 - Math.max(0, vis-7)*2.6)));
  document.getElementById('kVis').textContent=vis+' 项 (其余 '+(tot-vis)+' 项折叠)';
  document.getElementById('kOnb').textContent=onb+'%';
  document.getElementById('kOnb').style.color=onb>=75?'#059669':'#ef4444';
  const wV=Math.max(15, onb*4.2);
  document.getElementById('svg').innerHTML=`
    <text x="30" y="34" font-size="13" font-weight="800" fill="var(--tax-text)">新手首日零教程上手率（首屏暴露 ${vis} 项，隐藏 ${tot-vis} 项高级设置）</text>
    <rect x="30" y="68" width="440" height="38" rx="8" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="30" y="68" width="${wV.toFixed(0)}" height="38" rx="8" fill="${onb>=75?'#059669':'#ef4444'}"/>
    <text x="${Math.min(480,38+wV).toFixed(0)}" y="93" font-size="14" font-weight="850" fill="${onb>=75?'#059669':'#ef4444'}">${onb}%</text>
    <text x="30" y="150" font-size="12" fill="var(--tax-muted)">iPhone 相机打开只有“快门+切换”，长按或上滑才出现专业参数——这就是教科书级渐进披露！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>不要把“功能强大”做成“把 50 个按钮全堆在首页”！好的复杂度管理是：把简单留给默认，把强大留给展开。`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
