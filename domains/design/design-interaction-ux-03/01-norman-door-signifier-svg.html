<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>诺曼门改造器：可供性 × 意符对齐</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🚪 诺曼门改造器：可供性 × 意符对齐（构建器）</h1>
      <p>设计大师唐·诺曼说：<strong>“如果一扇门需要贴张纸条写着‘推’或‘拉’，那它就是糟糕的设计！”</strong>下面是一扇<strong>只能向外推</strong>的玻璃门，亲手为它更换 3 种门把手，看路人撞门率如何从 72% 跌到 0%！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="hBad">❌ 经典诺曼门：装双面竖拉手</button>
        <button class="toy-btn secondary" id="hSign">🩹 打补丁：竖拉手 + 贴纸“请推”</button>
        <button class="toy-btn secondary" id="hGood">✅ 完美改造：装平推金属板</button>
      </div>

      <svg id="doorSvg" viewBox="0 0 680 230" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="诺曼门把手可供性改造演示"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>诺曼门灾难（撞门率 72%）：</strong>竖长把手在人类大脑里自带强烈的<strong>“抓握并往回拉”意符（Signifier）</strong>！哪怕门只能推，手还是会比脑子更快地去猛拉！试试换上平推板！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const MODES = {
      bad:  { crash: 72, col: 'var(--tax-red)',   title: '❌ 意符与物理功能彻底冲突！', sub: '看到竖把手 → 本能伸手拉 → 哐当撞门尴尬！', aha: '<strong>经典诺曼门（72% 路人拉错）：</strong>用户拉错门从来不是因为“用户笨”，而是设计师给一扇只能推的门装了一个大喊着“来拉我呀”的竖把手！' },
      sign: { crash: 38, col: 'var(--tax-amber)', title: '🩹 靠贴纸补救依然有 38% 撞门！', sub: '手部肌肉反射（0.2s）远快于阅读文字贴纸（0.8s）', aha: '<strong>说明书贴纸不是好设计（仍有 38% 拉错）：</strong>匆忙进出时没人先停下来读贴纸！任何需要用文字提醒“请勿xxx”的界面，本质都是在掩盖糟糕的物理/视觉意符。' },
      good: { crash: 2,  col: 'var(--tax-green)', title: '✅ 完美物理可供性：无需一字说明，0% 误操作！', sub: '平板根本抓不住，手掌自然放上去一推就开！', aha: '<strong>设计大师级解法（误操作归零）：</strong>一块光秃秃的金属推板利用<strong>物理约束</strong>彻底屏蔽了“拉”的可能，只留下“推”的唯一意符——连 3 岁小孩和外国游客都不会推错！' }
    };

    let cur = 'bad', done = false;
    const svg = document.getElementById('doorSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      ['bad', 'sign', 'good'].forEach(k => {
        const id = k === 'bad' ? 'hBad' : (k === 'sign' ? 'hSign' : 'hGood');
        document.getElementById(id).className = cur === k ? 'toy-btn' : 'toy-btn secondary';
      });
      const m = MODES[cur];

      let html = '';
      // Left: Glass Door visual
      html += `<rect x="70" y="24" width="160" height="184" rx="8" fill="rgba(59,130,246,0.12)" stroke="var(--tax-border)" stroke-width="3"/>`;
      html += `<line x1="88" y1="42" x2="115" y2="68" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round"/>`;

      if (cur === 'bad' || cur === 'sign') {
        // Vertical pull handle
        html += `<rect x="192" y="84" width="12" height="66" rx="6" fill="var(--tax-ink)"/>`;
        html += `<circle cx="198" cy="92" r="3" fill="var(--tax-surface-alt)"/>`;
        html += `<circle cx="198" cy="142" r="3" fill="var(--tax-surface-alt)"/>`;
        if (cur === 'sign') {
          html += `<rect x="112" y="54" width="76" height="26" rx="5" fill="var(--tax-amber)"/>`;
          html += `<text x="150" y="72" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="900">请 推 PUSH</text>`;
        }
      } else {
        // Flat horizontal push plate!
        html += `<rect x="152" y="92" width="60" height="52" rx="4" fill="rgba(16,185,129,0.35)" stroke="var(--tax-green)" stroke-width="2.5"/>`;
        html += `<text x="182" y="122" text-anchor="middle" fill="var(--tax-green)" font-size="11" font-weight="800">平推板</text>`;
      }

      // Right: Collision meter & explanation
      html += `<text x="278" y="62" fill="${m.col}" font-size="15" font-weight="800">${m.title}</text>`;
      html += `<text x="278" y="88" fill="var(--tax-muted)" font-size="12.5">${m.sub}</text>`;

      html += `<text x="278" y="132" fill="var(--tax-ink)" font-size="13" font-weight="700">路人推错/拉错撞门率：${m.crash}%</text>`;
      html += `<rect x="278" y="144" width="360" height="22" rx="11" fill="rgba(148,163,184,0.16)"/>`;
      html += `<rect x="278" y="144" width="${(m.crash / 100) * 360}" height="22" rx="11" fill="${m.col}"/>`;

      svg.innerHTML = html;
      ahaBox.innerHTML = m.aha;
    }

    document.getElementById('hBad').onclick = () => { cur = 'bad'; markDone('查看了诺曼门反面设计'); render(); };
    document.getElementById('hSign').onclick = () => { cur = 'sign'; markDone('测试了诺曼门文字贴纸补丁'); render(); };
    document.getElementById('hGood').onclick = () => { cur = 'good'; markDone('完成了诺曼门平推板可供性改造'); render(); };
    render();
  </script>
</body>
</html>
