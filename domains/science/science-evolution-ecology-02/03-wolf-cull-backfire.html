<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：生态干预警示台</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🐺 生态干预警示台：杀光狼群真的能救鹿群吗？</h1><p>误区：狼吃鹿，杀光狼鹿就能永远幸福生活。真相：没有天敌控制数量，鹿群会疯狂吃光全山草皮，然后迎来惨烈的全群大饥荒崩溃！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <div style="margin-bottom:12px;">
        <button class="btn active" id="w0" onclick="pick(0)">🔫 政策 A：彻底消灭森林里的狼</button>
        <button class="btn" id="w1" onclick="pick(1)">🐺 政策 B：引入并保护适量狼群</button>
      </div>
      <div id="box" style="padding:16px;border:1px solid var(--tax-border);border-radius:12px;line-height:1.7;"></div>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>狼群不是森林的破坏者，而是防止食草动物啃光植被的“生态调节阀”（黄石公园重引狼群真实案例）！</div>
    
  </div>
  <script>
    const seen=new Set([0]);
    function pick(i){
      seen.add(i); [0,1].forEach(k=>document.getElementById("w"+k).classList.toggle("active",k===i));
      document.getElementById("box").innerHTML=i===0
        ? "❌ 第 1~3 年鹿群暴涨，但第 5 年草皮被啃秃、水土流失，冬季大饥荒导致 80% 的鹿活活饿死，整座森林退化成荒地！"
        : "✅ 狼群淘汰老弱病残并控制鹿群规模，河岸柳树重新长高、河狸回归筑坝，整片森林生物多样性全面复苏！";
      if(seen.size>=2 && window.ToySDK) window.ToySDK.markCompleted();
    }
    pick(0);
    </script>
</body>
</html>
