<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：狐狸与兔子生态波浪</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🐇 狐狸与兔子生态波浪：为什么总是此消彼长、循环震荡？</h1><p>误区：只要食物充足，动物数量就会停在某个固定数字不动。真相：由于繁殖与饥饿存在时间滞后，两条曲线永远像追逐的波浪一样交替起伏！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">🌿 兔子繁殖率 α：<span id="aOut">1.1</span>
        <input id="aS" type="range" min="0.6" max="1.6" step="0.1" value="1.1" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 540 200" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>注意看红色狐狸波峰总是比绿色兔子波峰慢半拍——这就是延迟负反馈制造周期震荡的经典范例！</div>
    
  </div>
  <script>
    let m=0;
    function render(){
      const alpha=parseFloat(document.getElementById("aS").value);
      document.getElementById("aOut").textContent=alpha.toFixed(1);
      let x=10, y=5, px=[], py=[];
      for(let i=0;i<=120;i++){
        px.push(`${i===0?'M':'L'}${(30+i*4).toFixed(1)},${(180-Math.min(32,x)*4.8).toFixed(1)}`);
        py.push(`${i===0?'M':'L'}${(30+i*4).toFixed(1)},${(180-Math.min(32,y)*4.8).toFixed(1)}`);
        const dx=(alpha*x - 0.14*x*y)*0.12, dy=(0.06*x*y - 0.7*y)*0.12;
        x=Math.max(1,x+dx); y=Math.max(1,y+dy);
      }
      document.getElementById("svg").innerHTML=`<line x1="30" y1="180" x2="510" y2="180" stroke="var(--tax-border)"/><path d="${px.join(' ')}" fill="none" stroke="#10b981" stroke-width="2.5"/><path d="${py.join(' ')}" fill="none" stroke="#ef4444" stroke-width="2.5"/>`;
      document.getElementById("ahaBox").innerHTML=alpha>=1.3?`💡 <strong>高繁殖率（α=${alpha.toFixed(1)}）引发剧烈过山车：</strong>兔子暴涨养肥狐狸，狐狸暴涨又把兔子吃光，生态波动幅度显著加大！`:alpha<=0.8?`💡 <strong>低繁殖率（α=${alpha.toFixed(1)}）：</strong>生态循环周期拉长、波幅趋缓，但红色狐狸波峰依然永远滞后于绿色兔子半拍！`:`💡 <strong>经典洛特卡-沃尔泰拉周期（α=${alpha.toFixed(1)}）：</strong>捕食者波峰永远慢猎物半拍，这就是延迟负反馈制造的永动生态波浪！`;
      m++; if(m>=3 && window.ToySDK) window.ToySDK.markCompleted();
    }
    render();
    </script>
</body>
</html>
