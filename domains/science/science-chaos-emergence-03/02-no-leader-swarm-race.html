<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：去中心化抗打击测试</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
    .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    @media (max-width: 740px) { .lanes { grid-template-columns: 1fr; } }
    .lane { padding: 14px; border: 1px solid var(--tax-border); border-radius: 12px; background: var(--tax-surface-alt); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🎯 去中心化抗打击测试：干掉“领头鸟”，谁会瞬间瘫痪？</h1>
        <p>误区：有领导的团队一定比没领导的更稳。真相：在强对抗环境里，中心首领反而是最致命的单点故障（SPOF）！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div>
        <button class="btn primary" onclick="strike()">💥 模拟“首领节点失效”打击</button>
        <button class="btn" onclick="resetSim()">🔄 恢复初始编队</button>
      </div>
      <div class="lanes">
        <div class="lane">
          <strong>👑 中心化领航编队</strong>
          <svg id="svgA" viewBox="0 0 260 150" style="width:100%;height:auto;margin-top:8px;border-radius:10px;background:var(--tax-surface);"></svg>
          <div id="rA" style="margin-top:8px;font-size:13.5px;">正常巡航中（全部跟随领头鸟）</div>
        </div>
        <div class="lane">
          <strong>🕊️ 去中心化 Boids 群</strong>
          <svg id="svgB" viewBox="0 0 260 150" style="width:100%;height:auto;margin-top:8px;border-radius:10px;background:var(--tax-surface);"></svg>
          <div id="rB" style="margin-top:8px;font-size:13.5px;">正常巡航中（局部邻居协同）</div>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻（Aha! Moment）：</strong>点击“模拟打击”，在实时动画里对比失去首领后的两种架构生存率！
    </div>
  </div>

  <script>
    let hit = false, t = 0;
    function resetSim() {
      hit = false;
      document.getElementById("rA").innerHTML = "正常巡航中（全部跟随领头鸟）";
      document.getElementById("rB").innerHTML = "正常巡航中（局部邻居协同）";
    }
    function strike() {
      hit = true;
      document.getElementById("rA").innerHTML = "<span style='color:#ef4444;font-weight:800;'>❌ 指挥链路断裂，全队迷航原地打转！</span>";
      document.getElementById("rB").innerHTML = "<span style='color:#10b981;font-weight:800;'>✅ 毫无察觉，0.1 秒自愈继续按编队前进！</span>";
      document.getElementById("ahaBox").innerHTML = "💡 <strong>顿悟时刻（Aha! Moment）：</strong>中心化编队一旦失去领航者，所有节点立刻变成无头苍蝇；而去中心化 Boids 群没有单点故障，损毁任何个体都不影响整体编队！";
      if (window.ToySDK) window.ToySDK.markCompleted();
    }
    function tick() {
      t += 0.06;
      const baseAx = ((t * 28) % 210) + 25;
      let htmlA = "";
      if (!hit) {
        const lx = baseAx + 28, ly = 75;
        for (let i = 0; i < 4; i++) {
          const bx = baseAx - (i % 2) * 20 - 10, by = 45 + i * 20;
          htmlA += `<line x1="${bx}" y1="${by}" x2="${lx}" y2="${ly}" stroke="var(--tax-border)" stroke-dasharray="3,3"/>`;
          htmlA += `<polygon points="7,0 -4,-4 -4,4" fill="#3b82f6" transform="translate(${bx.toFixed(1)},${by})"/>`;
        }
        htmlA += `<circle cx="${lx.toFixed(1)}" cy="${ly}" r="7" fill="#f59e0b"/><text x="${lx.toFixed(1)}" y="${ly-10}" text-anchor="middle" font-size="11">👑</text>`;
      } else {
        htmlA += `<text x="130" y="30" text-anchor="middle" font-size="13" fill="#ef4444" font-weight="800">💥 领航节点已失联</text>`;
        for (let i = 0; i < 4; i++) {
          const ang = t * (2 + i * 0.5) + i * 1.5;
          const bx = 130 + Math.cos(ang) * (25 + i * 12), by = 85 + Math.sin(ang * 1.3) * 28;
          htmlA += `<polygon points="7,0 -4,-4 -4,4" fill="#ef4444" transform="translate(${bx.toFixed(1)},${by.toFixed(1)}) rotate(${(ang*57).toFixed(0)})"/>`;
        }
      }
      document.getElementById("svgA").innerHTML = htmlA;

      const baseBx = ((t * 28) % 210) + 25;
      let htmlB = "";
      const ptsB = [];
      const countB = hit ? 4 : 5;
      for (let i = 0; i < countB; i++) {
        ptsB.push([baseBx + (i % 2) * 22 - 10, 42 + i * 20]);
      }
      for (let i = 0; i < ptsB.length - 1; i++) {
        htmlB += `<line x1="${ptsB[i][0].toFixed(1)}" y1="${ptsB[i][1]}" x2="${ptsB[i+1][0].toFixed(1)}" y2="${ptsB[i+1][1]}" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>`;
      }
      ptsB.forEach(p => {
        htmlB += `<polygon points="7,0 -4,-4 -4,4" fill="#10b981" transform="translate(${p[0].toFixed(1)},${p[1]})"/>`;
      });
      document.getElementById("svgB").innerHTML = htmlB;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
