<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：相变 S 型突变曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🫧 相变 S 型突变曲线：量变怎么在临界点引爆质变？</h1><p>误区：世界是线性的，多 1% 投入只有 1% 回报。真相：从水结冰、病毒爆发到社群爆火，全都是平时纹丝不动、一过阈值瞬间爆发的 S 型相变！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">🌡️ 控制参数（密度/温度）：<span id="xOut">50%</span>
        <input id="xS" type="range" min="0" max="100" value="50" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 540 190" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>滑动游标跨过 59% 陡峭悬崖，体会“压死骆驼的最后一根稻草”背后的数学曲线！</div>
    
  </div>
  <script>
    let m=0;
    function sig(x){ return 1/(1+Math.exp(-(x-59)/4)); }
    function render(){
      const x=+document.getElementById("xS").value;
      document.getElementById("xOut").textContent=x+"%";
      let pts=[];
      for(let i=0;i<=100;i+=2) pts.push(`${i===0?'M':'L'}${(40+i*4.6).toFixed(1)},${(165-sig(i)*135).toFixed(1)}`);
      document.getElementById("svg").innerHTML=`<line x1="40" y1="165" x2="500" y2="165" stroke="var(--tax-border)"/><path d="${pts.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3"/><circle cx="${40+x*4.6}" cy="${165-sig(x)*135}" r="6" fill="#ef4444" stroke="#fff" stroke-width="2"/>`;
      document.getElementById("ahaBox").innerHTML=x<55?`💡 <strong>安全亚临界区（密度 ${x}%）：</strong>火势被空地天然截断，几乎烧不到对岸（贯通概率 ${(sig(x)*100).toFixed(0)}%）。`:x<=64?`💡 <strong>⚡ 正处 59.3% 渗流相变悬崖（密度 ${x}%）！</strong>树木仅增加几个百分点，贯通概率就从 15% 垂直跳升至 ${(sig(x)*100).toFixed(0)}%！`:`💡 <strong>🔥 超临界全林失守（密度 ${x}%）：</strong>贯通概率高达 ${(sig(x)*100).toFixed(0)}%，一点火星就会瞬间烧穿整片森林！`;
      m++; if(m>=3 && window.ToySDK) window.ToySDK.markCompleted();
    }
    render();
    </script>
</body>
</html>
