<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：微观状态数透视镜</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🎲 微观状态数透视镜：为什么整齐只有一种，混乱却有亿万种？</h1><p>误区：物理定律禁止屋子自己变整齐。真相：不是禁止，而是“乱”的排列方式比“整齐”多出天文数字倍！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">⚛️ 房间粒子数量 N：<span id="nOut">6</span> 个
        <input id="nS" type="range" min="2" max="30" value="6" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 540 160" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>拉大粒子数 N，看全部缩回左半边的概率是如何瞬间跌到千万分之一的！</div>
    
  </div>
  <script>
    let m=0;
    function render(){
      const N=+document.getElementById("nS").value;
      document.getElementById("nOut").textContent=N;
      const tot=Math.pow(2,N);
      document.getElementById("svg").innerHTML=`
        <text x="270" y="55" text-anchor="middle" font-size="16" font-weight="850" fill="currentColor">总微观组合数 Ω = 2^${N} = ${tot.toLocaleString()} 种</text>
        <text x="270" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#ef4444">全部乖乖缩在左半边的概率 = 1 / ${tot.toLocaleString()}</text>
      `;
      m++; if(N>=20 && m>1){
        document.getElementById("ahaBox").innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>才区区 ${N} 个粒子，全回左边的概率就跌到了 <strong>1 / ${tot.toLocaleString()}</strong>！熵增定律其实就是宇宙中最冷酷的大数概率碾压。`;
        if(window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
    </script>
</body>
</html>
