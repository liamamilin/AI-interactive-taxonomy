<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：高频舍弃压缩实验室</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    .card { padding: 14px; border: 1px solid var(--tax-border); border-radius: 12px; background: var(--tax-surface-alt); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🖼️ 高频舍弃压缩实验室：丢掉 70% 数据为什么还看得清？</h1><p>误区：压缩必须每个像素一模一样。真相：人类感官对高频毛刺极不敏感，砍掉高频分量就能把体积缩小 10 倍！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">🗜️ 保留频率比例：<span id="pOut">100%</span>
        <input id="pS" type="range" min="10" max="100" step="10" value="100" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 560 200" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>把保留频率拉低到 30%，看看主轮廓是否依然清晰可辨！</div>
    
  </div>
  <script>
    
    let m=0;
    function render(){
      const p=+document.getElementById("pS").value;
      document.getElementById("pOut").textContent=p+"%";
      const maxK=Math.max(1, Math.round((p/100)*10));
      let orig=[], comp=[];
      for(let i=0;i<=180;i++){
        const x=(i/180)*Math.PI*2;
        let yo=0, yc=0;
        for(let k=1;k<=10;k++){
          const term=Math.sin(k*x)/(k*0.8);
          yo+=term; if(k<=maxK) yc+=term;
        }
        orig.push(`${i===0?'M':'L'}${(25+i*2.8).toFixed(1)},${(100-yo*42).toFixed(1)}`);
        comp.push(`${i===0?'M':'L'}${(25+i*2.8).toFixed(1)},${(100-yc*42).toFixed(1)}`);
      }
      document.getElementById("svg").innerHTML=`<path d="${orig.join(' ')}" fill="none" stroke="var(--tax-border)" stroke-width="2" stroke-dasharray="4,4"/><path d="${comp.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="3"/>`;
      m++; if(p<=40 && m>1){
        document.getElementById("ahaBox").innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>只保留 <strong>${p}%</strong> 的低频分量，信号大轮廓依然完美还原！JPEG 图片和 MP3 音乐正是靠“保留低频骨架、丢弃高频冗余”省下海量流量的。`;
        if(window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
    
  </script>
</body>
</html>
