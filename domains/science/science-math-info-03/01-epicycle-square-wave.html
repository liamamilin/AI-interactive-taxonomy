<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：圆周画方波魔法</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    .card { padding: 14px; border: 1px solid var(--tax-border); border-radius: 12px; background: var(--tax-surface-alt); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⭕ 圆周画方波魔法：柔和的圆圈竟能拼出直角方波？</h1><p>误区：圆滑的正弦波拼不出尖锐的直角。真相：只要把基频和 3 倍、5 倍、7 倍奇次谐波叠加起来，波形就会越来越方！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">🌀 叠加谐波圆圈数 N：<span id="nOut">1</span> 个
        <input id="nS" type="range" min="1" max="15" value="1" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 560 220" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>把 N 从 1 拉到 12，看看圆滑的正弦波是如何一点点变成直角方波的！</div>
    
  </div>
  <script>
    
    let m=0;
    function render(){
      const N=+document.getElementById("nS").value;
      document.getElementById("nOut").textContent=N;
      let pts=[];
      for(let i=0;i<=200;i++){
        const x=(i/200)*Math.PI*2;
        let y=0;
        for(let k=0;k<N;k++){ const n=2*k+1; y+=Math.sin(n*x)/n; }
        pts.push(`${i===0?'M':'L'}${(30+i*2.5).toFixed(1)},${(110-y*78).toFixed(1)}`);
      }
      document.getElementById("svg").innerHTML=`
        <line x1="30" y1="110" x2="530" y2="110" stroke="var(--tax-border)"/>
        <path d="${pts.join(' ')}" fill="none" stroke="var(--tax-primary)" stroke-width="2.5"/>
      `;
      m++; if(N>=8 && m>1){
        document.getElementById("ahaBox").innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>仅叠加了 ${N} 个不同转速的圆圈，方波就已经清晰成形！这就是傅里叶的伟大发现：<strong>世间万物皆可表示为频率的合唱</strong>。`;
        if(window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
    
  </script>
</body>
</html>
