<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：激光全反射临界角沙盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔦 激光全反射临界角沙盘：玻璃里面比镜子还亮</h1><p>误区：光纤内壁涂了银色反光漆。真相：光纤里面全是透明玻璃，靠纤芯与包层的折射率差实现 100% 无损耗全反射！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">📐 入射角（相对法线）：<span id="aOut">70°</span>（临界角 ≈ 60°）
        <input id="aS" type="range" min="30" max="85" value="70" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 560 200" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>把入射角降到 60° 以下，看激光瞬间穿透管壁漏光！</div>
    
  </div>
  <script>
    let m=0;
    function render(){
      const ang=+document.getElementById("aS").value;
      document.getElementById("aOut").textContent=ang+"°";
      const tir=ang>=60; document.getElementById("ahaBox").innerHTML=tir?`💡 <strong>✅ 全反射锁光成功（入射角 ${ang}° ≥ 60° 临界角）：</strong>激光 100% 反射回玻璃纤维内芯，几乎零损耗跨越太平洋！`:`💡 <strong>🚨 光纤漏光警报（入射角 ${ang}° < 60°）：</strong>角度太陡穿透包层射出管外，这正是光纤弯曲半径过小会导致断网丢包的物理原因！`;
      const stepX=Math.tan(ang*Math.PI/180)*70;
      let ray="";
      if(tir){
        let x=40, y=100, dir=-1, pts=[`${x},${y}`];
        for(let i=0;i<8 && x<520;i++){
          x+=stepX/2; y=dir<0?65:135; dir*=-1;
          pts.push(`${x.toFixed(1)},${y}`);
        }
        ray=`<polyline points="${pts.join(' ')}" fill="none" stroke="#10b981" stroke-width="3"/>`;
      } else {
        ray=`<polyline points="40,100 ${40+stepX/2},65 ${40+stepX},20" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="5,3"/>`;
      }
      document.getElementById("svg").innerHTML=`
        <rect x="30" y="65" width="500" height="70" fill="var(--tax-primary)" fill-opacity="0.12" stroke="var(--tax-primary)"/>
        ${ray}
        <text x="280" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="${tir?'#10b981':'#ef4444'}">${tir?'✅ 触发全反射：激光无损弹射直达终点！':'❌ 小于临界角：激光直接射穿管壁漏光！'}</text>
      `;
      m++; if(m>=2 && window.ToySDK) window.ToySDK.markCompleted();
    }
    render();
    </script>
</body>
</html>
