<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：宇宙红移观测站</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌌 宇宙红移观测站：光谱线怎么泄露了星系正在逃离？</h1><p>误区：星系发红是因为它们本来就是红色的。真相：远方星系的光在飞向地球时，空间膨胀把光波拉长了，所以特征黑线全体向红端平移！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">🌌 星系退行速度：<span id="vOut">0</span> 万 km/s
        <input id="vS" type="range" min="0" max="15" value="0" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 540 140" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>向右拉动星系退行速度，看光谱上的特征黑线齐刷刷往右边红色区域移动！</div>
    
  </div>
  <script>
    let m=0;
    function render(){
      const v=+document.getElementById("vS").value;
      document.getElementById("vOut").textContent=v;
      const shift=v*5.5;
      document.getElementById("svg").innerHTML=`
        <defs><linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6366f1"/><stop offset="45%" stop-color="#10b981"/><stop offset="100%" stop-color="#ef4444"/></linearGradient></defs>
        <rect x="30" y="30" width="480" height="55" rx="8" fill="url(#spec)"/>
        <line x1="${120+shift}" y1="30" x2="${120+shift}" y2="85" stroke="#000" stroke-width="4"/>
        <line x1="${230+shift}" y1="30" x2="${230+shift}" y2="85" stroke="#000" stroke-width="4"/>
        <line x1="${340+shift}" y1="30" x2="${340+shift}" y2="85" stroke="#000" stroke-width="4"/>
        <text x="270" y="116" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor">${v===0?'静止实验室标准光谱':'光谱线向右（红端）平移了 +'+Math.round(shift)+' 纳米！'}</text>
      `;
      m++; if(v>=8 && m>1){
        document.getElementById("ahaBox").innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>哈勃发现越远的星系红移量越大，证明所有星系都在加速远离我们——这就是宇宙正在膨胀的最直接铁证！`;
        if(window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
    </script>
</body>
</html>
