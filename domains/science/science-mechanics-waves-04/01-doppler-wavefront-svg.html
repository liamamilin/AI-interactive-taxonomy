<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：多普勒波前压缩动画</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔊 多普勒波前压缩动画：声源追着自己的声音跑！</h1><p>误区：车上喇叭自己变调了。真相：车上司机听到的音调完全没变，变调只是因为车把前方的声波挤扁、把后方的声波拉长！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">🚑 声源速度（马赫数 v/c）：<span id="vOut">0.40</span> 倍音速
        <input id="vS" type="range" min="0" max="1.2" step="0.1" value="0.4" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 540 220" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>把速度拉到 1.0 以上（超音速），看所有波前在机头堆成一道锥形激波——那就是音爆！</div>
    
  </div>
  <script>
    let m=0;
    function render(){
      const mach=parseFloat(document.getElementById("vS").value);
      document.getElementById("vOut").textContent=mach.toFixed(2);
      const srcX=320;
      let circles="";
      for(let i=1;i<=7;i++){
        const r=i*18;
        const cx=srcX-i*18*mach;
        circles+=`<circle cx="${cx.toFixed(1)}" cy="110" r="${r}" fill="none" stroke="var(--tax-primary)" stroke-width="1.5" opacity="${(1-i*0.1).toFixed(2)}"/>`;
      }
      document.getElementById("svg").innerHTML=`
        ${circles}
        <circle cx="${srcX}" cy="110" r="7" fill="#ef4444"/>
        <text x="${srcX+14}" y="114" font-size="12" font-weight="800" fill="#ef4444">🚑 →</text>
        <text x="70" y="200" font-size="12" fill="var(--tax-muted)">后方波长拉长（音调变低）</text>
        <text x="410" y="200" text-anchor="middle" font-size="12" fill="var(--tax-primary)">${mach>=1?'💥 超音速音爆激波！':'前方波前挤密（音调变尖）'}</text>
      `;
      m++; if(mach>=0.8 && m>1){
        document.getElementById("ahaBox").innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>${mach>=1?'声源已经跑得比声音还快，所有波前在前方叠成高能激波（音爆）！':'前方波前被压缩变密、每秒撞进耳朵的波峰变多，所以声音瞬间变尖！'}`;
        if(window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
    </script>
</body>
</html>
