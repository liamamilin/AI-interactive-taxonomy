<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：积分切片压缩机</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    .card { padding: 14px; border: 1px solid var(--tax-border); border-radius: 12px; background: var(--tax-surface-alt); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🍰 积分切片压缩机：把曲线下面积切成 N 块薄片</h1><p>误区：不规则曲线的面积没法算。真相：切成无数个窄长方形再相加，锯齿误差就会彻底归零！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <label style="font-weight:800;font-size:14px;">🔪 切片数量 N：<span id="nOut">6</span> 片 · 估算面积：<span id="aOut" style="color:var(--tax-primary);">0</span>（真实积分 = 8.00）
        <input id="nS" type="range" min="2" max="60" value="6" style="width:100%;margin-top:8px;" oninput="render()" />
      </label>
      <svg id="svg" viewBox="0 0 560 240" style="width:100%;height:auto;margin-top:12px;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>把切片数拉到 40 以上，看着锯齿边缘消失，面积稳稳逼近 8.00！</div>
    
  </div>
  <script>
    
    let m=0;
    function f(x){ return 3*x*x/4; } // integral 0..2 of 3x^2/4 = x^3/4 -> 2, wait scale to 8: 3x^2 -> x^3 from 0..2 = 8
    function render(){
      const N=+document.getElementById("nS").value;
      document.getElementById("nOut").textContent=N;
      const sx=x=>50+(x/2)*460, sy=y=>210-(y/12)*180;
      const dx=2/N; let sum=0, rects="";
      for(let i=0;i<N;i++){
        const xm=(i+0.5)*dx, h=3*xm*xm;
        sum+=h*dx;
        rects+=`<rect x="${sx(i*dx).toFixed(1)}" y="${sy(h).toFixed(1)}" width="${(sx(dx)-50).toFixed(1)}" height="${(210-sy(h)).toFixed(1)}" fill="var(--tax-primary)" fill-opacity="0.28" stroke="var(--tax-primary)" stroke-width="1"/>`;
      }
      let curve=[];
      for(let x=0;x<=2.01;x+=0.05) curve.push(`${x===0?'M':'L'}${sx(x).toFixed(1)},${sy(3*x*x).toFixed(1)}`);
      document.getElementById("aOut").textContent=sum.toFixed(3);
      document.getElementById("svg").innerHTML=`<line x1="50" y1="210" x2="510" y2="210" stroke="var(--tax-border)"/>${rects}<path d="${curve.join(' ')}" fill="none" stroke="#ef4444" stroke-width="3"/>`;
      m++; if(N>=30 && m>1){
        document.getElementById("ahaBox").innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>切成 ${N} 片后，矩形总面积已达 <strong>${sum.toFixed(3)}</strong>（误差仅 ${Math.abs(8-sum).toFixed(3)}）！微积分的积分符号 ∫ 本质上就是一个拉长的 S（Sum，求和）。`;
        if(window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    render();
    
  </script>
</body>
</html>
