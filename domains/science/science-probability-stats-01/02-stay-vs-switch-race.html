<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：千局蒙特卡洛竞速</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 10px 18px; border-radius: 10px; border: none; background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; font-size: 14px; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    .mcard { padding: 12px; border: 1px solid var(--tax-border); border-radius: 12px; text-align: center; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📈 千局蒙特卡洛竞速：坚持派 vs 换门派谁先收敛到真相？</h1>
        <p>单局有运气成分，但只要跑上 500 局，大数定律会立刻撕掉直觉伪装！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <button class="btn" onclick="runSim()">🚀 运行 500 局同步大数竞速</button>
      <div class="metrics">
        <div class="mcard"><div style="font-size:12px;color:var(--tax-muted);">🟧 坚持不换派胜率</div><div id="rStay" style="font-size:24px;font-weight:900;color:#f59e0b;">0%</div></div>
        <div class="mcard"><div style="font-size:12px;color:var(--tax-muted);">🟦 果断换门派胜率</div><div id="rSw" style="font-size:24px;font-weight:900;color:var(--tax-primary);">0%</div></div>
      </div>
      <svg id="convSvg" viewBox="0 0 560 220" style="width:100%;height:auto;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻（Aha! Moment）：</strong>点击运行 500 局模拟，看两条胜率曲线如何在波动后分别锁定在 33.3% 与 66.7%！
    </div>
  </div>

  <script>
    let timer = null;
    function runSim() {
      if (timer) clearInterval(timer);
      let n = 0, sw = 0, st = 0;
      const hSt = [], hSw = [];
      timer = setInterval(() => {
        for (let k = 0; k < 10; k++) {
          n++;
          const car = Math.floor(Math.random() * 3);
          const pick = Math.floor(Math.random() * 3);
          if (pick === car) st++; else sw++;
          if (n % 5 === 0) {
            hSt.push([n, st / n]);
            hSw.push([n, sw / n]);
          }
        }
        document.getElementById("rStay").textContent = (st / n * 100).toFixed(1) + "%";
        document.getElementById("rSw").textContent = (sw / n * 100).toFixed(1) + "%";
        draw(hSt, hSw);
        if (n >= 500) {
          clearInterval(timer);
          document.getElementById("ahaBox").innerHTML = `💡 <strong>顿悟时刻（Aha! Moment）：</strong>500 局统计完毕！坚持派稳稳落在 <strong>${(st/n*100).toFixed(1)}%</strong>（理论 33.3%），换门派稳稳落在 <strong>${(sw/n*100).toFixed(1)}%</strong>（理论 66.7%）。换门不是玄学，而是实打实赢两倍！`;
          if (window.ToySDK) window.ToySDK.markCompleted();
        }
      }, 30);
    }

    function draw(hSt, hSw) {
      const sx = n => 45 + (n / 500) * 495;
      const sy = p => 195 - p * 170;
      const path = arr => arr.map((p,i)=>`${i===0?'M':'L'}${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ");
      document.getElementById("convSvg").innerHTML = `
        <line x1="45" y1="195" x2="540" y2="195" stroke="var(--tax-border)"/>
        <line x1="45" y1="${sy(2/3)}" x2="540" y2="${sy(2/3)}" stroke="var(--tax-primary)" stroke-dasharray="4,4" opacity="0.5"/>
        <line x1="45" y1="${sy(1/3)}" x2="540" y2="${sy(1/3)}" stroke="#f59e0b" stroke-dasharray="4,4" opacity="0.5"/>
        <text x="10" y="${sy(2/3)+4}" font-size="11" fill="var(--tax-primary)">66.7%</text>
        <text x="10" y="${sy(1/3)+4}" font-size="11" fill="#f59e0b">33.3%</text>
        ${hSt.length ? `<path d="${path(hSt)}" fill="none" stroke="#f59e0b" stroke-width="2.5"/>` : ""}
        ${hSw.length ? `<path d="${path(hSw)}" fill="none" stroke="var(--tax-primary)" stroke-width="2.5"/>` : ""}
      `;
    }
    draw([], []);
  </script>
</body>
</html>
