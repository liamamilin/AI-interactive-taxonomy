<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：信息熵与热力学熵桥梁</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>💻 芯片散热墙：为什么逻辑运算删信息就会发烫？</h1><p>误区：CPU 发热纯属电线有电阻。真相：哪怕做成零电阻，只要传统 AND/OR 门把两个输入压成一个输出（丢弃 1 比特信息），就必然发热！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <div style="margin-bottom:12px;">
        <button class="btn active" id="g0" onclick="pick(0)">🔥 传统 AND 门 (2进1出 · 丢信息)</button>
        <button class="btn" id="g1" onclick="pick(1)">❄️ 可逆量子/Fredkin 门 (2进2出 · 保信息)</button>
      </div>
      <svg id="svg" viewBox="0 0 540 160" style="width:100%;height:auto;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>切换两种逻辑门，看为什么想突破算力功耗墙必须走向“可逆计算”！</div>
    
  </div>
  <script>
    const seen=new Set([0]);
    function pick(m){
      seen.add(m);
      [0,1].forEach(i=>document.getElementById("g"+i).classList.toggle("active",i===m));
      document.getElementById("svg").innerHTML=m===0
        ? `<rect x="200" y="45" width="140" height="70" rx="12" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2"/><text x="270" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#ef4444">2 bits → 1 bit (丢 1 bit 必发热)</text>`
        : `<rect x="200" y="45" width="140" height="70" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/><text x="270" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#10b981">2 bits → 2 bits (零擦除理论上零发热)</text>`;
      document.getElementById("ahaBox").innerHTML=m===0?"💡 <strong>不可逆逻辑门（AND/OR）的物理税：</strong>2 比特输入合并成 1 比特输出，丢失的 1 比特信息无法凭空消失，必须以 kT ln2 废热散出！":"💡 <strong>可逆计算的极限梦想：</strong>保留完整输入输出映射不擦除任何比特，理论上就能绕过兰道尔热力学功耗底线！";
      if(seen.size>=2 && window.ToySDK) window.ToySDK.markCompleted();
    }
    pick(0);
    </script>
</body>
</html>
