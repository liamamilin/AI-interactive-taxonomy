<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：霍夫曼压缩编码台</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 9px 15px; border-radius: 10px; border: 1px solid var(--tax-border); background: var(--tax-surface); color: inherit; font-weight: 800; cursor: pointer; margin-right: 8px; }
    .btn.primary, .btn.active { background: var(--tax-primary); color: #fff; border-color: var(--tax-primary); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
    .card { padding: 14px; border: 1px solid var(--tax-border); border-radius: 12px; background: var(--tax-surface-alt); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔠 霍夫曼压缩编码台：高频词短一点，体积立刻减半！</h1><p>误区：每个字符都要占固定 8 比特才公平。真相：像摩斯电码把高频字母 E 设为最短的“·”，按频率分配不等长编码就能逼近理论压缩极限！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    
    <div class="tax-panel">
      <div style="margin-bottom:12px;">
        <button class="btn active" id="m0" onclick="pick(0)">📊 均匀文本（A/B/C/D 各 25%）</button>
        <button class="btn" id="m1" onclick="pick(1)">⚡ 偏斜文本（A 占 70%，B 15%，C 10%，D 5%）</button>
      </div>
      <svg id="svg" viewBox="0 0 560 190" style="width:100%;height:auto;border:1px solid var(--tax-border);border-radius:12px;background:var(--tax-surface);"></svg>
    </div>
    <div class="tax-aha" id="ahaBox">💡 <strong>顿悟时刻（Aha! Moment）：</strong>切换到“偏斜文本”，看看霍夫曼编码是如何把平均每个字符的比特数从 2.00 压到 1.45 的！</div>
    
  </div>
  <script>
    
    const seen=new Set([0]);
    function pick(m){
      seen.add(m);
      [0,1].forEach(i=>document.getElementById("m"+i).classList.toggle("active",i===m));
      const fixed=2.0;
      const huff=m===0?2.0:(0.7*1+0.15*2+0.1*3+0.05*3);
      const ent=m===0?2.0:-(0.7*Math.log2(0.7)+0.15*Math.log2(0.15)+0.1*Math.log2(0.1)+0.05*Math.log2(0.05));
      document.getElementById("svg").innerHTML=`
        <text x="40" y="45" font-size="14" font-weight="800" fill="currentColor">等长编码 (2 bits/字)</text>
        <rect x="220" y="28" width="240" height="24" rx="5" fill="#f59e0b"/>
        <text x="470" y="45" font-size="13" font-weight="800" fill="#f59e0b">${fixed.toFixed(2)}</text>
        <text x="40" y="95" font-size="14" font-weight="800" fill="currentColor">霍夫曼变长编码</text>
        <rect x="220" y="78" width="${huff*120}" height="24" rx="5" fill="var(--tax-primary)"/>
        <text x="${230+huff*120}" y="95" font-size="13" font-weight="800" fill="var(--tax-primary)">${huff.toFixed(2)}</text>
        <text x="40" y="145" font-size="14" font-weight="800" fill="currentColor">香农熵理论下限</text>
        <rect x="220" y="128" width="${ent*120}" height="24" rx="5" fill="#10b981"/>
        <text x="${230+ent*120}" y="145" font-size="13" font-weight="800" fill="#10b981">${ent.toFixed(2)}</text>
      `;
      if(seen.size>=2){
        document.getElementById("ahaBox").innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>在偏斜分布下，给占 70% 的 A 分配 1 位短码“0”，平均码长瞬间降到 <strong>1.45 bits</strong>，紧紧贴近香农熵下限 1.36 bits！`;
        if(window.ToySDK) window.ToySDK.markCompleted();
      }
    }
    pick(0);
    
  </script>
</body>
</html>
