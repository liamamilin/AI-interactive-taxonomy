<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：神经元积木工坊 · 万能近似定理</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 14px; }
    .svg-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: 14px; padding: 12px; }
    svg { width: 100%; height: 300px; display: block; }
    .stat-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 10px; font-size: 13.5px; font-weight: 700; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧱 神经元积木工坊：几根直拐杖 ReLU，怎么拼出光滑波浪？</h1>
        <p>向右拖动隐藏层 ReLU 神经元数量滑块，亲眼看一条条简单的“折线积木”叠加在一起，如何把弯曲的正弦波严丝合缝地拼出来。</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="ctrl-row">
        <div style="flex:1;min-width:220px;">
          <label style="font-size:14px;font-weight:800;">🧩 隐藏层 ReLU 神经元数量：<span id="nVal" style="color:var(--tax-primary)">2</span> 个</label>
          <input id="nSlider" type="range" min="1" max="16" value="2" style="width:100%;margin-top:6px;" />
        </div>
        <label style="font-size:13px;font-weight:750;cursor:pointer;">
          <input type="checkbox" id="showPieces" checked /> 显示单根 ReLU 折线积木
        </label>
      </div>

      <div class="svg-box">
        <svg id="approxSvg" viewBox="0 0 600 300"></svg>
        <div class="stat-row">
          <span>🔴 红虚线：目标正弦函数 · 🔵 蓝实线：ReLU 神经网络叠加输出</span>
          <span>拟合误差（RMSE）：<strong id="errVal" style="color:var(--tax-primary);font-family:monospace;">0.000</strong></span>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻：</strong>每一颗 ReLU 神经元其实只负责在某个位置制造<strong>一个折弯拐点</strong>！把 10 颗、100 颗 ReLU 叠在一起，就能拼出任意复杂的连续曲线——这就是深度学习最著名的基石：<strong>万能近似定理（Universal Approximation Theorem）</strong>。
    </div>
  </div>

  <script>
    const targetFn = x => Math.sin(x * Math.PI * 1.4) * 0.85;
    let moved = 0;

    // Build exact piecewise-linear ReLU superposition interpolating targetFn at N+1 knots
    function buildReluNet(N) {
      const knots = [];
      for (let i = 0; i <= N; i++) {
        const x = -1 + (2 * i) / N;
        knots.push({ x, y: targetFn(x) });
      }
      // Represent piecewise linear function as: y0 + sum_{i=0..N-1} deltaSlope_i * ReLU(x - x_i)
      const slopes = [];
      for (let i = 0; i < N; i++) {
        slopes.push((knots[i + 1].y - knots[i].y) / (knots[i + 1].x - knots[i].x));
      }
      const units = [];
      let prevSlope = 0;
      for (let i = 0; i < N; i++) {
        const w = slopes[i] - prevSlope;
        units.push({ knot: knots[i].x, w });
        prevSlope = slopes[i];
      }
      const y0 = knots[0].y;
      const evalNet = x => {
        let sum = y0;
        for (const u of units) sum += u.w * Math.max(0, x - u.knot);
        return sum;
      };
      return { y0, units, evalNet, knots };
    }

    function render() {
      const N = parseInt(document.getElementById("nSlider").value, 10);
      const showPieces = document.getElementById("showPieces").checked;
      document.getElementById("nVal").textContent = N;

      const { units, evalNet, knots } = buildReluNet(N);
      const toX = x => 40 + ((x + 1) / 2) * 520;
      const toY = y => 150 - y * 125;

      let targetPath = "", netPath = "";
      let sqErr = 0, samples = 120;
      for (let i = 0; i <= samples; i++) {
        const x = -1 + (2 * i) / samples;
        const ty = targetFn(x);
        const ny = evalNet(x);
        sqErr += (ty - ny) ** 2;
        const sx = toX(x);
        targetPath += (i === 0 ? "M" : "L") + `${sx.toFixed(1)},${toY(ty).toFixed(1)} `;
        netPath += (i === 0 ? "M" : "L") + `${sx.toFixed(1)},${toY(ny).toFixed(1)} `;
      }
      const rmse = Math.sqrt(sqErr / (samples + 1));

      const svg = document.getElementById("approxSvg");
      let html = `<line x1="30" y1="150" x2="570" y2="150" stroke="var(--tax-border)" stroke-width="1.5"/>`;

      if (showPieces) {
        units.forEach((u) => {
          // Draw scaled individual ReLU hinge around baseline for intuition
          const kx = toX(u.knot);
          const endY = Math.max(-1.05, Math.min(1.05, u.w * (1 - u.knot) * 0.28));
          html += `<polyline points="${toX(-1)},150 ${kx.toFixed(1)},150 ${toX(1)},${toY(endY).toFixed(1)}" fill="none" stroke="var(--tax-amber)" stroke-width="1.3" opacity="0.45"/>`;
        });
      }

      html += `<path d="${targetPath}" fill="none" stroke="var(--tax-red)" stroke-width="2.5" stroke-dasharray="7,5"/>`;
      html += `<path d="${netPath}" fill="none" stroke="var(--tax-primary)" stroke-width="3.2"/>`;
      for (const k of knots) {
        html += `<circle cx="${toX(k.x).toFixed(1)}" cy="${toY(k.y).toFixed(1)}" r="4" fill="var(--tax-primary)" stroke="#fff" stroke-width="1.4"/>`;
      }
      svg.innerHTML = html;

      document.getElementById("errVal").textContent = rmse.toFixed(4);
      if (N >= 10) {
        document.getElementById("ahaBox").innerHTML = `💡 <strong>顿悟时刻（万能近似达成！）：</strong>仅用 <strong>${N}</strong> 颗简单的 ReLU 折线神经元，拟合误差就骤降到 <strong>${rmse.toFixed(4)}</strong>，肉眼几乎与光滑正弦波重合！大模型数千亿参数本质就是把这套“折线拼接魔术”搬到了高维语义空间。`;
        if (window.ToySDK) window.ToySDK.markCompleted();
      }
    }

    document.getElementById("nSlider").addEventListener("input", () => { moved++; render(); if (moved >= 3 && window.ToySDK) window.ToySDK.markCompleted(); });
    document.getElementById("showPieces").addEventListener("change", render);
    render();
  </script>
</body>
</html>
