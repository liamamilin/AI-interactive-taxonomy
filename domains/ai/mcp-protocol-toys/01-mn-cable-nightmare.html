<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：M×N 插头灾难 · 悟懂 MCP 统一接口价值</title>
  <style>
    :root { --bg:#f6f8fc; --card:#fff; --ink:#0f172a; --muted:#64748b; --border:#e2e8f0; --blue:#2563eb; --blue-soft:#eff6ff; --red:#dc2626; --red-soft:#fef2f2; --green:#059669; --green-soft:#ecfdf5; --radius:18px; --shadow:0 10px 28px rgba(15,23,42,.06); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding:24px 18px 60px; line-height:1.55; }
    .wrap { max-width:1000px; margin:0 auto; }
    .topbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
    .back-link { text-decoration:none; color:var(--muted); font-size:14px; font-weight:600; padding:7px 12px; border-radius:10px; background:var(--card); border:1px solid var(--border); }
    .title-block h1 { font-size:24px; font-weight:850; }
    .title-block p { font-size:14px; color:var(--muted); }

    .ctrl { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 22px; box-shadow:var(--shadow); display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; align-items:center; margin-bottom:18px; }
    @media (max-width:740px) { .ctrl { grid-template-columns:1fr; } }
    input[type="range"] { width:100%; accent-color:var(--blue); }
    .toggle-btn { border:none; border-radius:12px; padding:12px 16px; font-size:14px; font-weight:750; cursor:pointer; color:#fff; background:var(--blue); }
    .toggle-btn.off { background:var(--red); }

    .panel { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); }
    svg#wireSvg { width:100%; height:310px; display:block; background:#f8fafc; border-radius:14px; border:1px solid #e2e8f0; margin-bottom:14px; }
    .aha { border-radius:12px; padding:14px 16px; font-size:13.5px; }
    .aha.bad { background:var(--red-soft); border:1px solid #fecaca; color:#991b1b; }
    .aha.good { background:var(--green-soft); border:1px solid #a7f3d0; color:#065f46; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-block">
        <h1>🔌 M×N 插头灾难：为什么说 MCP 是 AI 世界的 USB-C？</h1>
        <p>拉动 AI 应用数量（M）与工具数量（N），再一键切换「无协议 vs 开启 MCP」，亲眼看对接代码量如何从 M×N 骤降到 M+N！</p>
      </div>
      <a class="back-link" href="./index.html">← 返回目录</a>
    </div>

    <div class="ctrl">
      <div>
        <div style="font-size:13px;font-weight:750;">🤖 AI 应用数 (M)：<span id="mVal" style="color:var(--blue);">4</span></div>
        <input type="range" id="slM" min="2" max="6" value="4" oninput="render()" />
      </div>
      <div>
        <div style="font-size:13px;font-weight:750;">🛠️ 外部工具数 (N)：<span id="nVal" style="color:var(--blue);">5</span></div>
        <input type="range" id="slN" min="2" max="6" value="5" oninput="render()" />
      </div>
      <button class="toggle-btn off" id="mcpBtn" onclick="useMcp=!useMcp;render()">⚡ 点击开启 MCP 统一协议</button>
    </div>

    <div class="panel">
      <svg id="wireSvg" viewBox="0 0 720 310"></svg>
      <div class="aha" id="ahaBox"></div>
    </div>
  </div>

  <script>
    const APPS = ["Claude", "Cursor", "Gemini", "VS Code", "ChatGPT", "本地助手"];
    const TOOLS = ["GitHub", "Slack", "Postgres", "Google Drive", "Notion", "浏览器"];
    let useMcp = false;

    function render() {
      const m = parseInt(document.getElementById("slM").value, 10);
      const n = parseInt(document.getElementById("slN").value, 10);
      document.getElementById("mVal").textContent = m;
      document.getElementById("nVal").textContent = n;
      const btn = document.getElementById("mcpBtn");
      btn.className = "toggle-btn" + (useMcp ? "" : " off");
      btn.textContent = useMcp ? "✅ 已开启 MCP（点我切回杂乱模式）" : "⚡ 点击开启 MCP 统一协议";

      const mPts = Array.from({length:m}, (_, i) => ({ x: 110, y: 40 + (i * (230 / Math.max(1, m-1))), label: APPS[i] }));
      const nPts = Array.from({length:n}, (_, i) => ({ x: 610, y: 40 + (i * (230 / Math.max(1, n-1))), label: TOOLS[i] }));

      let svg = "";
      if (!useMcp) {
        mPts.forEach(a => nPts.forEach(b => {
          svg += `<line x1="${a.x+56}" y1="${a.y}" x2="${b.x-56}" y2="${b.y}" stroke="#ef4444" stroke-width="1.6" stroke-opacity="0.48"/>`;
        }));
      } else {
        mPts.forEach(a => {
          svg += `<line x1="${a.x+56}" y1="${a.y}" x2="310" y2="155" stroke="#2563eb" stroke-width="2.4"/>`;
        });
        nPts.forEach(b => {
          svg += `<line x1="410" y1="155" x2="${b.x-56}" y2="${b.y}" stroke="#059669" stroke-width="2.4"/>`;
        });
        svg += `<rect x="305" y="125" width="110" height="60" rx="16" fill="#0f172a"/><text x="360" y="152" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="800">🔌 MCP</text><text x="360" y="170" text-anchor="middle" fill="#cbd5e1" font-size="11">统一 USB-C</text>`;
      }

      mPts.forEach(a => {
        svg += `<rect x="${a.x-56}" y="${a.y-16}" width="112" height="32" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="${a.x}" y="${a.y+4}" text-anchor="middle" fill="#1e3a8a" font-size="12" font-weight="700">${a.label}</text>`;
      });
      nPts.forEach(b => {
        svg += `<rect x="${b.x-56}" y="${b.y-16}" width="112" height="32" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="${b.x}" y="${b.y+4}" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">${b.label}</text>`;
      });

      document.getElementById("wireSvg").innerHTML = svg;
      const aha = document.getElementById("ahaBox");
      if (!useMcp) {
        aha.className = "aha bad";
        aha.innerHTML = `🕸️ <strong>传统 M×N 噩梦：</strong>${m} 个 AI 应用对接 ${n} 个工具，全行业要重复写 <strong>${m * n} 套</strong>互不兼容的适配器！每新增一个工具，所有 AI 应用都要重新写代码！`;
      } else {
        aha.className = "aha good";
        aha.innerHTML = `🎉 <strong>MCP 统一协议（M+N）：</strong>只需写 <strong>${m + n} 次</strong>（减少 ${m*n - (m+n)} 套重复胶水代码）！工具方只要按 MCP 标准写一次 Server，全世界的 AI 应用立刻即插即用！`;
      }
    }
    render();
  </script>
</body>
</html>
