<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：确定性 vs 自主性决策光谱仪 · Workflow vs Agent</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    @media (max-width: 720px) { .ctrl { grid-template-columns: 1fr; } }
    .spectrum { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    @media (max-width: 720px) { .spectrum { grid-template-columns: 1fr; } }
    .tier { padding: 12px; border-radius: 12px; border: 1.5px solid var(--tax-border); background: var(--tax-surface-alt); text-align: center; opacity: 0.55; transition: all 0.2s ease; }
    .tier.active { opacity: 1; border-color: var(--tax-primary); transform: translateY(-2px); box-shadow: var(--tax-shadow); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🎛️ 确定性 vs 自主性：别用大炮打蚊子，也别用死代码接需求</h1>
        <p>拨动下面两个业务约束滑块，看系统架构应该落在 5 档光谱的哪一格（参考 Anthropic《Building Effective Agents》工程共识）。</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="ctrl">
        <div>
          <label style="font-weight:800;font-size:14px;">🌀 任务步骤不确定性：<span id="uVal" style="color:var(--tax-primary)">30</span>%</label>
          <input id="uSlider" type="range" min="0" max="100" value="30" style="width:100%;margin-top:8px;" />
        </div>
        <div>
          <label style="font-weight:800;font-size:14px;">🛡️ 单次出错业务代价：<span id="rVal" style="color:var(--tax-amber)">70</span>%</label>
          <input id="rSlider" type="range" min="0" max="100" value="70" style="width:100%;margin-top:8px;" />
        </div>
      </div>

      <div class="spectrum" id="specRow"></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    const TIERS = [
      { id: 0, name: "1. 确定性代码", sub: "if/else + SQL", desc: "规则完全固定、零容错需求，根本不需要 LLM。" },
      { id: 1, name: "2. 链式 Workflow", sub: "Prompt Chaining", desc: "固定 1→2→3 步流水线，每步只让 LLM 做局部解析或润色。" },
      { id: 2, name: "3. 路由 + 分支", sub: "Routing / Parallel", desc: "先用轻模型分类意图，再走不同的确定性分支。" },
      { id: 3, name: "4. 编排者-执行者", sub: "Orchestrator-Workers", desc: "主控动态拆解子任务，子步骤仍受结构化契约约束。" },
      { id: 4, name: "5. 自主 Agent", sub: "ReAct 开放循环", desc: "模型自主决定查什么、何时重试、何时交付，适合高探索任务。" }
    ];
    let changes = 0;

    function render() {
      const u = parseInt(document.getElementById("uSlider").value, 10);
      const r = parseInt(document.getElementById("rSlider").value, 10);
      document.getElementById("uVal").textContent = u;
      document.getElementById("rVal").textContent = r;

      const score = u - r * 0.45;
      let idx = 1;
      if (u < 15) idx = 0;
      else if (score < 15) idx = 1;
      else if (score < 35) idx = 2;
      else if (score < 58) idx = 3;
      else idx = 4;

      document.getElementById("specRow").innerHTML = TIERS.map((t, i) => `
        <div class="tier ${i === idx ? "active" : ""}">
          <div style="font-weight:850;font-size:13.5px;">${t.name}</div>
          <div style="font-size:11.5px;color:var(--tax-primary);margin:4px 0;">${t.sub}</div>
          <div style="font-size:12px;color:var(--tax-muted);line-height:1.45;">${t.desc}</div>
        </div>
      `).join("");

      const t = TIERS[idx];
      document.getElementById("ahaBox").innerHTML = `💡 <strong>推荐落点：${t.name}（${t.sub}）</strong> — ${
        idx <= 2
          ? "当步骤可预见或出错代价高时，<strong>Workflow 的可观测性与成本远胜于自主 Agent</strong>；能用固定流水线解决的，绝不把控制权交给随机循环！"
          : "当任务路径无法预先穷举、且单次试错成本可控时，才值得引入 <strong>自主 Agent</strong> 来换取灵活性。"
      }`;
    }

    ["uSlider", "rSlider"].forEach(id => document.getElementById(id).addEventListener("input", () => {
      changes++;
      render();
      if (changes >= 3 && window.ToySDK) window.ToySDK.markCompleted();
    }));
    render();
  </script>
</body>
</html>
