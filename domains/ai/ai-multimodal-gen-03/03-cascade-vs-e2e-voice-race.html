<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：全双工延迟竞速 · 级联流水线 vs 原生端到端</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .btn { padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--tax-primary); background: var(--tax-primary); color: #fff; font-weight: 800; cursor: pointer; margin-bottom: 14px; }
    .lane { background: var(--tax-surface-alt); border: 1.5px solid var(--tax-border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .track { height: 16px; background: var(--tax-surface); border-radius: 999px; overflow: hidden; border: 1px solid var(--tax-border); margin: 8px 0; }
    .fill { height: 100%; width: 0%; transition: width 0.14s linear; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>⚡ 全双工延迟竞速：为什么旧语音助手总像“对讲机”，新模型却能秒回？</h1>
        <p>人类日常对话的平均回应间隔约 <strong>300 毫秒</strong>。点击发车，对比传统三段接力与原生语音大模型（Speech-to-Speech）的响应速度！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <button class="btn" onclick="go()">🎤 说完“帮我查下明天气温” → 开始计时</button>

      <div class="lane">
        <div style="font-weight:850;font-size:14px;">🚀 原生端到端语音大模型（Audio Token → Audio Token）</div>
        <div class="track"><div class="fill" id="f1" style="background:var(--tax-green);"></div></div>
        <div id="s1" style="font-size:12.5px;font-family:monospace;color:var(--tax-muted);">待命…</div>
      </div>

      <div class="lane">
        <div style="font-weight:850;font-size:14px;">🐢 传统级联流水线（ASR 语音转字 → LLM 思考 → TTS 字转语音）</div>
        <div class="track"><div class="fill" id="f2" style="background:var(--tax-amber);"></div></div>
        <div id="s2" style="font-size:12.5px;font-family:monospace;color:var(--tax-muted);">待命…</div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻：</strong>点击上方按钮开始竞速，看看“省掉中间转文字”如何同时拯救延迟和情感细节！
    </div>
  </div>

  <script>
    let timer = null;
    function go() {
      if (timer) clearInterval(timer);
      let p1 = 0, p2 = 0;
      timer = setInterval(() => {
        p1 = Math.min(100, p1 + 35);
        p2 = Math.min(100, p2 + 8);
        document.getElementById("f1").style.width = p1 + "%";
        document.getElementById("f2").style.width = p2 + "%";
        document.getElementById("s1").textContent = p1 >= 100 ? "✅ 首音延迟 ~320 ms（保留语气、支持随时打断！）" : `原生理解并直出音频 Token ${p1}%`;
        let stage = p2 < 35 ? "1/3 ASR 等你说完再转文字…" : p2 < 70 ? "2/3 LLM 生成文字回复…" : p2 < 100 ? "3/3 TTS 合成语音中…" : "😵 首音延迟 ~2,800 ms（且情绪叹气全在转文字时丢光了）";
        document.getElementById("s2").textContent = stage;
        if (p2 >= 100) {
          clearInterval(timer);
          document.getElementById("ahaBox").innerHTML = "💡 <strong>级联瓶颈的破局：</strong>传统三段接力不仅要叠加三份等待时间（2~3 秒），还会把用户的<strong>反讽、哭腔、急促呼吸</strong>在“语音转纯文字”那一刻彻底丢光！原生语音大模型直接听声出声，实现了真正的全双工自然对话！";
          if (window.ToySDK) window.ToySDK.markCompleted();
        }
      }, 120);
    }
  </script>
</body>
</html>
