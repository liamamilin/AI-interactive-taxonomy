<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 02：反向传播追责链 · 链式法则</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: center; margin-bottom: 16px; }
    @media (max-width: 740px) { .ctrl-grid { grid-template-columns: 1fr; } }
    .svg-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: 14px; padding: 14px; overflow-x: auto; }
    svg { width: 100%; min-width: 640px; height: 220px; display: block; }
    .grad-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    @media (max-width: 640px) { .grad-cards { grid-template-columns: 1fr; } }
    .g-card { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: 12px; padding: 14px; font-size: 13px; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🔗 反向传播追责链：结果错了，每个旋钮该往哪边拧？</h1>
        <p>目标输出固定为 <strong>10.0</strong>（输入 x = 2.0）。拧动权重 <code>w1</code>、<code>w2</code>，观察蓝色正向计算与红色反向“梯度追责”如何瞬间算出每个参数的责任！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="ctrl-grid">
        <div>
          <label style="font-size:13.5px;font-weight:800;">🎚️ 第一层旋钮 w1：<span id="w1Val" style="color:var(--tax-primary)">1.5</span></label>
          <input id="w1Slider" type="range" min="-30" max="40" value="15" style="width:100%;margin-top:5px;" />
        </div>
        <div>
          <label style="font-size:13.5px;font-weight:800;">🎚️ 第二层旋钮 w2：<span id="w2Val" style="color:var(--tax-primary)">2.0</span></label>
          <input id="w2Slider" type="range" min="-30" max="40" value="20" style="width:100%;margin-top:5px;" />
        </div>
        <button class="tax-btn" id="optStepBtn">⚡ 按反向梯度自动更新 1 步</button>
      </div>

      <div class="svg-box">
        <svg id="bpSvg" viewBox="0 0 760 215"></svg>
      </div>

      <div class="grad-cards">
        <div class="g-card" id="g1Card"></div>
        <div class="g-card" id="g2Card"></div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻：</strong>反向传播（Backpropagation）就是微积分里的<strong>链式法则</strong>：从最右边的误差出发，一层层往左乘上局部灵敏度，一次扫描就能同时算出全网所有参数的“背锅比例”与调整方向！
    </div>
  </div>

  <script>
    const X = 2.0, TARGET = 10.0;
    let steps = 0;

    function render() {
      const w1 = parseInt(document.getElementById("w1Slider").value, 10) / 10;
      const w2 = parseInt(document.getElementById("w2Slider").value, 10) / 10;
      document.getElementById("w1Val").textContent = w1.toFixed(1);
      document.getElementById("w2Val").textContent = w2.toFixed(1);

      // Forward: h = x * w1, y = h * w2, L = 0.5 * (y - TARGET)^2
      const h = X * w1;
      const y = h * w2;
      const err = y - TARGET;
      const loss = 0.5 * err * err;

      // Backward (Chain Rule)
      const dL_dy = err;
      const dL_dw2 = dL_dy * h;
      const dL_dh = dL_dy * w2;
      const dL_dw1 = dL_dh * X;

      const svg = document.getElementById("bpSvg");
      let html = `
        <defs>
          <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="var(--tax-primary)"/></marker>
          <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="var(--tax-red)"/></marker>
        </defs>
        <!-- Forward arrows (top) -->
        <line x1="110" y1="72" x2="215" y2="72" stroke="var(--tax-primary)" stroke-width="2.5" marker-end="url(#arrB)"/>
        <line x1="335" y1="72" x2="440" y2="72" stroke="var(--tax-primary)" stroke-width="2.5" marker-end="url(#arrB)"/>
        <line x1="560" y1="72" x2="640" y2="72" stroke="var(--tax-primary)" stroke-width="2.5" marker-end="url(#arrB)"/>
        <text x="162" y="60" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-primary)">× w1 (${w1.toFixed(1)})</text>
        <text x="387" y="60" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-primary)">× w2 (${w2.toFixed(1)})</text>
        <text x="600" y="60" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-primary)">比对 10</text>

        <!-- Backward arrows (bottom) -->
        <line x1="640" y1="138" x2="560" y2="138" stroke="var(--tax-red)" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
        <line x1="440" y1="138" x2="335" y2="138" stroke="var(--tax-red)" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
        <line x1="215" y1="138" x2="110" y2="138" stroke="var(--tax-red)" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrR)"/>
        <text x="600" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-red)">∂L/∂y = ${dL_dy.toFixed(2)}</text>
        <text x="387" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-red)">∂L/∂h = ${dL_dh.toFixed(2)}</text>
        <text x="162" y="160" text-anchor="middle" font-size="11" font-weight="800" fill="var(--tax-red)">传给 w1: ${dL_dw1.toFixed(2)}</text>

        <!-- Nodes -->
        <rect x="20" y="75" width="90" height="60" rx="12" fill="var(--tax-surface)" stroke="var(--tax-border)" stroke-width="2"/>
        <text x="65" y="100" text-anchor="middle" font-size="12" fill="var(--tax-muted)" font-weight="700">输入 x</text>
        <text x="65" y="122" text-anchor="middle" font-size="16" fill="var(--tax-ink)" font-weight="900">${X.toFixed(1)}</text>

        <rect x="220" y="75" width="115" height="60" rx="12" fill="var(--tax-surface)" stroke="var(--tax-primary)" stroke-width="2"/>
        <text x="277" y="100" text-anchor="middle" font-size="12" fill="var(--tax-muted)" font-weight="700">隐藏值 h</text>
        <text x="277" y="122" text-anchor="middle" font-size="16" fill="var(--tax-primary)" font-weight="900">${h.toFixed(2)}</text>

        <rect x="445" y="75" width="115" height="60" rx="12" fill="var(--tax-surface)" stroke="var(--tax-primary)" stroke-width="2"/>
        <text x="502" y="100" text-anchor="middle" font-size="12" fill="var(--tax-muted)" font-weight="700">预测值 y</text>
        <text x="502" y="122" text-anchor="middle" font-size="16" fill="var(--tax-primary)" font-weight="900">${y.toFixed(2)}</text>

        <rect x="645" y="75" width="100" height="60" rx="12" fill="${loss < 0.05 ? "var(--tax-green-soft)" : "var(--tax-red-soft)"}" stroke="${loss < 0.05 ? "var(--tax-green)" : "var(--tax-red)"}" stroke-width="2"/>
        <text x="695" y="100" text-anchor="middle" font-size="12" fill="var(--tax-muted)" font-weight="700">误差 Loss</text>
        <text x="695" y="122" text-anchor="middle" font-size="16" fill="${loss < 0.05 ? "var(--tax-green)" : "var(--tax-red)"}" font-weight="900">${loss.toFixed(2)}</text>
      `;
      svg.innerHTML = html;

      const dir = g => Math.abs(g) < 0.05 ? "✅ 已精准达标，无需调整" : g > 0 ? "⬅️ 梯度为正，应调小参数" : "➡️ 梯度为负，应调大参数";
      document.getElementById("g1Card").innerHTML = `<strong>旋钮 w1 的追责结果：</strong><br/>链式法则：<code>∂L/∂w1 = ∂L/∂y × w2 × x = <strong>${dL_dw1.toFixed(2)}</strong></code><br/><span style="color:var(--tax-primary);font-weight:750;">${dir(dL_dw1)}</span>`;
      document.getElementById("g2Card").innerHTML = `<strong>旋钮 w2 的追责结果：</strong><br/>链式法则：<code>∂L/∂w2 = ∂L/∂y × h = <strong>${dL_dw2.toFixed(2)}</strong></code><br/><span style="color:var(--tax-primary);font-weight:750;">${dir(dL_dw2)}</span>`;

      if (loss < 0.05) {
        document.getElementById("ahaBox").innerHTML = `💡 <strong>顿悟时刻（完美归零！）：</strong>预测值 <strong>${y.toFixed(2)}</strong> 命中目标 10.0，反向传播的梯度瞬间全部归零，所有旋钮自动停止微调！`;
      }
    }

    document.getElementById("optStepBtn").addEventListener("click", () => {
      let w1 = parseInt(document.getElementById("w1Slider").value, 10) / 10;
      let w2 = parseInt(document.getElementById("w2Slider").value, 10) / 10;
      const h = X * w1, y = h * w2, err = y - TARGET;
      const lr = 0.04;
      w1 = Math.max(-3, Math.min(4, w1 - lr * (err * w2 * X)));
      w2 = Math.max(-3, Math.min(4, w2 - lr * (err * h)));
      document.getElementById("w1Slider").value = Math.round(w1 * 10);
      document.getElementById("w2Slider").value = Math.round(w2 * 10);
      steps++;
      render();
      if (steps >= 2 && window.ToySDK) window.ToySDK.markCompleted();
    });

    document.getElementById("w1Slider").addEventListener("input", render);
    document.getElementById("w2Slider").addEventListener("input", render);
    render();
  </script>
</body>
</html>
