<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：时空补丁（Spacetime Patches）切片机 · DiT</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn { padding: 10px 16px; border-radius: 12px; border: 1.5px solid var(--tax-border); background: var(--tax-surface-alt); color: var(--tax-ink); font-weight: 800; cursor: pointer; }
    .btn.active { background: var(--tax-primary); border-color: var(--tax-primary); color: #fff; }
    .frames { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 720px) { .frames { grid-template-columns: 1fr; } }
    .frame { background: var(--tax-surface-alt); border: 1.5px solid var(--tax-border); border-radius: 14px; padding: 12px; }
    .patches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
    .p { padding: 12px 6px; border-radius: 8px; text-align: center; font-size: 12px; font-weight: 800; background: var(--tax-surface); border: 1px solid var(--tax-border); }
    .p.hi { border-color: var(--tax-primary); background: rgba(99,102,241,0.14); }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>🧊 时空补丁（Spacetime Patches）：DiT 如何把视频变成 Transformer 能读懂的“句子”？</h1>
        <p>过去视频模型用僵硬的 2D+1D 卷积硬拼时间帧，经常前后闪屏。点击切换 <strong>DiT 时空统一视图</strong>，看它如何把视频切成 3D 积木排成一队！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div class="tabs">
        <button class="btn active" id="mOld" onclick="setM('old')">🎞️ 传统逐帧拼接（容易闪烁）</button>
        <button class="btn" id="mDit" onclick="setM('dit')">🧊 DiT 时空补丁（全时空注意力联动）</button>
      </div>
      <div class="frames" id="frameBox"></div>
    </div>

    <div class="tax-aha" id="ahaBox"></div>
  </div>

  <script>
    const seen = new Set(["old"]);
    function setM(m) {
      seen.add(m);
      document.getElementById("mOld").classList.toggle("active", m === "old");
      document.getElementById("mDit").classList.toggle("active", m === "dit");
      const hi = m === "dit";
      document.getElementById("frameBox").innerHTML = [1, 2, 3].map(t => `
        <div class="frame">
          <div style="font-weight:850;font-size:13.5px;">第 ${t} 秒潜空间切片（t=${t}）</div>
          <div class="patches">
            <div class="p ${hi ? "hi" : ""}">Patch(${t},0,0)<br>🌤️ 天空</div>
            <div class="p ${hi ? "hi" : ""}">Patch(${t},0,1)<br>🏢 建筑</div>
            <div class="p ${hi ? "hi" : ""}">Patch(${t},1,0)<br>🚗 跑车</div>
            <div class="p ${hi ? "hi" : ""}">Patch(${t},1,1)<br>🛣️ 路面</div>
          </div>
        </div>
      `).join("");

      document.getElementById("ahaBox").innerHTML = hi
        ? "💡 <strong>DiT（Diffusion Transformer）的伟大统一：</strong>把第 1~3 秒的所有时空小方块展平成一条长序列（就像文字 Token 一样），让 <strong>3D 自注意力</strong>直接把第 1 秒的跑车和第 3 秒的跑车连起来——无论横屏、竖屏、长短都能原生统一训练，直接解锁视频界的 Scaling Law！"
        : "💡 <strong>传统 U-Net 逐帧生成的局限：</strong>每一帧各自画完再弱弱地对齐时间轴，结果第 1 秒车是红的，第 3 秒转个弯可能就变成了蓝车！点击切换到 <strong>DiT 时空补丁</strong> 看看解法。";
      if (seen.size >= 2 && window.ToySDK) window.ToySDK.markCompleted();
    }
    setM("old");
  </script>
</body>
</html>
