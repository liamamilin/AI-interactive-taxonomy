<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 01：切词显微镜 · 为什么 AI 数不清 Strawberry 有几个 r？</title>
  <style>
    :root {
      --bg: #f6f8fc; --card: #ffffff; --ink: #0f172a; --muted: #64748b; --border: #e2e8f0;
      --sky: #0284c7; --sky-soft: #f0f9ff; --amber: #d97706; --amber-soft: #fffbeb;
      --radius: 18px; --shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh; padding: 24px 18px 60px; line-height: 1.55;
    }
    .wrap { max-width: 1020px; margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
    .back-link { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); }
    .title-block h1 { font-size: 24px; font-weight: 850; }
    .title-block p { font-size: 14px; color: var(--muted); }

    .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .p-btn {
      border: 1px solid var(--border); background: var(--card); color: #334155;
      padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 650; cursor: pointer;
    }
    .p-btn:hover, .p-btn.active { border-color: var(--sky); background: var(--sky-soft); color: var(--sky); }

    .panel {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 22px; box-shadow: var(--shadow); margin-bottom: 18px;
    }
    .panel h2 { font-size: 16px; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

    textarea#inputText {
      width: 100%; min-height: 76px; padding: 14px 16px; border-radius: 14px;
      border: 2px solid var(--border); font-size: 17px; font-family: inherit; outline: none; resize: vertical;
    }
    textarea#inputText:focus { border-color: var(--sky); }

    .view-switch {
      display: inline-flex; background: #f1f5f9; padding: 4px; border-radius: 12px; gap: 4px;
    }
    .v-btn {
      border: none; background: transparent; padding: 7px 14px; border-radius: 9px;
      font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer;
    }
    .v-btn.active { background: #fff; color: var(--sky); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .token-canvas {
      min-height: 112px; padding: 18px; border-radius: 14px; background: #f8fafc;
      border: 1px solid #e2e8f0; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 10px;
      margin-bottom: 16px;
    }

    .tok-box {
      display: flex; flex-direction: column; align-items: center; padding: 8px 12px;
      border-radius: 12px; border: 1.5px solid transparent; transition: transform 0.15s;
    }
    .tok-box:hover { transform: translateY(-2px); }
    .tok-str { font-size: 18px; font-weight: 800; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .tok-id { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; opacity: 0.8; margin-top: 3px; }
    .tok-box.ai-blind { background: #0f172a !important; color: #38bdf8 !important; border-color: #334155 !important; }
    .tok-box.ai-blind .tok-str { font-size: 16px; letter-spacing: 0.04em; }

    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    @media (max-width: 640px) { .kpi-grid { grid-template-columns: 1fr; } }
    .kpi { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 13px 16px; }
    .kpi-l { font-size: 12px; color: var(--muted); font-weight: 650; }
    .kpi-v { font-size: 24px; font-weight: 850; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 2px; }

    .aha {
      border-radius: 14px; padding: 15px 18px; font-size: 13.5px;
      background: var(--amber-soft); border: 1px solid #fde68a; color: #92400e;
    }
    .aha.sky { background: var(--sky-soft); border-color: #bae6fd; color: #0c4a6e; }
  </style>
  <script src="../../../shared/toy-sdk.js"></script>
  <style data-tax-compat="1">
    body.in-iframe .back-link { display: none !important; }
    html[data-theme="dark"] {
      --bg: #0b1120;
      --surface: #111827;
      --card: #111827;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
    }
    html[data-theme="dark"] body {
      background: #0b1120 !important;
      color: #f1f5f9 !important;
    }
  </style>
  <script>
    (function () {
      let acts = 0, reported = false;
      function onInteract(e) {
        if (reported) return;
        const el = e.target && e.target.closest ? e.target.closest("button, input, select, textarea, [onclick], [role='button']") : null;
        if (!el) return;
        acts++;
        if (acts >= 2 && window.ToySDK) {
          reported = true;
          window.ToySDK.markCompleted();
        }
      }
      document.addEventListener("click", onInteract, true);
      document.addEventListener("input", onInteract, true);
      document.addEventListener("change", onInteract, true);
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-block">
        <h1>🔬 切词显微镜：为什么 AI 经常数不清 strawberry 有几个 r？</h1>
        <p>点一下「切换到 AI 盲盒视角」，亲自用大模型的眼睛看一次文字！</p>
      </div>
      <a class="back-link" href="./index.html">← 返回目录</a>
    </div>

    <div class="preset-row" id="presetRow"></div>

    <div class="panel">
      <h2>
        <span>1. 输入任意中英文文本</span>
        <span style="font-size:12px;color:var(--muted);font-weight:500;">支持实时编辑，观察不同语言切分差异</span>
      </h2>
      <textarea id="inputText" oninput="render()">strawberry</textarea>
    </div>

    <div class="panel">
      <h2>
        <span>2. 分词器（Tokenizer）透视结果</span>
        <div class="view-switch">
          <button class="v-btn active" id="vHuman" onclick="setAiView(false)">👁️ 人类视角（看字+编号）</button>
          <button class="v-btn" id="vAi" onclick="setAiView(true)">🤖 AI 真实视角（只见编号！）</button>
        </div>
      </h2>

      <div class="token-canvas" id="tokenCanvas"></div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-l">人类看到的字符数</div>
          <div class="kpi-v" id="kChars">0</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">AI 实际收到的 Token 数</div>
          <div class="kpi-v" id="kTokens" style="color:var(--sky);">0</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">平均每个 Token 压缩字符</div>
          <div class="kpi-v" id="kRatio" style="color:#059669;">0.0</div>
        </div>
      </div>

      <div class="aha" id="ahaBox"></div>
    </div>
  </div>

  <script>
    const COLORS = [
      { bg: "#dbeafe", bd: "#93c5fd", fg: "#1e3a8a" },
      { bg: "#fce7f3", bd: "#f9a8d4", fg: "#831843" },
      { bg: "#d1fae5", bd: "#6ee7b7", fg: "#064e3b" },
      { bg: "#fef3c7", bd: "#fcd34d", fg: "#78350f" },
      { bg: "#ede9fe", bd: "#c4b5fd", fg: "#4c1d95" }
    ];

    const PRESETS = [
      { label: "🍓 经典陷阱：strawberry", text: "strawberry" },
      { label: "🔢 小数陷阱：9.11 和 9.9 谁大？", text: "9.11 和 9.9 哪个数字更大？" },
      { label: "🇨🇳 中文 vs 英文效率对比", text: "Artificial intelligence 人工智能正在改变世界！" },
      { label: "💻 代码 Token 切分", text: "function helloAI(user) { return user + '!'; }" }
    ];

    // 真实感 BPE 子词词典（重点精确还原经典案例）
    const SPECIAL_SPLITS = {
      "strawberry": ["str", "aw", "berry"],
      "artificial": ["Art", "ificial"],
      "intelligence": [" intelligence"],
      "function": ["function"],
      "return": [" return"],
      "人工智能": ["人工", "智能"],
      "正在": ["正在"],
      "改变": ["改变"],
      "世界": ["世界"],
      "数字": ["数字"],
      "哪个": ["哪个"],
      "更大": ["更大"],
      "9.11": ["9", ".", "11"],
      "9.9": ["9", ".", "9"]
    };

    let aiBlindView = false;

    function stableId(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return (Math.abs(h) % 98000) + 200;
    }

    function tokenize(text) {
      const tokens = [];
      let i = 0;
      while (i < text.length) {
        let matched = false;
        // 优先匹配常见子词示例
        const lowerSlice = text.slice(i).toLowerCase();
        for (const [k, parts] of Object.entries(SPECIAL_SPLITS)) {
          if (lowerSlice.startsWith(k)) {
            let offset = 0;
            parts.forEach(p => {
              const raw = text.slice(i + offset, i + offset + p.trim().length) || p;
              tokens.push({ text: raw, id: stableId(p) });
              offset += p.trim().length;
            });
            i += k.length;
            matched = true;
            break;
          }
        }
        if (matched) continue;

        const ch = text[i];
        // 英文单词按 3-5 字母模拟 BPE 子词切分
        if (/[A-Za-z]/.test(ch)) {
          let j = i;
          while (j < text.length && /[A-Za-z]/.test(text[j])) j++;
          const word = text.slice(i, j);
          if (word.length <= 5) {
            tokens.push({ text: word, id: stableId(word) });
          } else {
            for (let k = 0; k < word.length; k += 4) {
              const chunk = word.slice(k, k + 4);
              tokens.push({ text: chunk, id: stableId(chunk) });
            }
          }
          i = j;
        } else if (/[0-9]/.test(ch)) {
          let j = i;
          while (j < text.length && /[0-9]/.test(text[j]) && j - i < 3) j++;
          const num = text.slice(i, j);
          tokens.push({ text: num, id: stableId(num) });
          i = j;
        } else if (/[\u4e00-\u9fa5]/.test(ch)) {
          // 模拟中文常见 1-2 字切分
          const take = (i + 1 < text.length && /[\u4e00-\u9fa5]/.test(text[i + 1]) && (i % 3 !== 0)) ? 2 : 1;
          const chunk = text.slice(i, i + take);
          tokens.push({ text: chunk, id: stableId(chunk) });
          i += take;
        } else {
          tokens.push({ text: ch, id: stableId(ch) });
          i++;
        }
      }
      return tokens;
    }

    function setAiView(on) {
      aiBlindView = on;
      document.getElementById("vHuman").classList.toggle("active", !on);
      document.getElementById("vAi").classList.toggle("active", on);
      render();
    }

    function renderPresets() {
      const box = document.getElementById("presetRow");
      box.innerHTML = "";
      PRESETS.forEach(p => {
        const b = document.createElement("button");
        b.className = "p-btn";
        b.textContent = p.label;
        b.onclick = () => {
          document.getElementById("inputText").value = p.text;
          render();
        };
        box.appendChild(b);
      });
    }

    function render() {
      const text = document.getElementById("inputText").value;
      const tokens = tokenize(text);
      const canvas = document.getElementById("tokenCanvas");
      canvas.innerHTML = "";

      if (tokens.length === 0) {
        canvas.innerHTML = `<span style="color:var(--muted);">在上方输入任意文字查看切分结果…</span>`;
      } else {
        tokens.forEach((t, idx) => {
          const c = COLORS[idx % COLORS.length];
          const div = document.createElement("div");
          div.className = "tok-box" + (aiBlindView ? " ai-blind" : "");
          div.style.background = c.bg;
          div.style.borderColor = c.bd;
          div.style.color = c.fg;
          const disp = t.text === " " ? "␣" : t.text;
          div.innerHTML = aiBlindView
            ? `<span class="tok-str">[#${t.id}]</span><span class="tok-id">Token ${idx + 1}</span>`
            : `<span class="tok-str">${disp}</span><span class="tok-id">ID: ${t.id}</span>`;
          canvas.appendChild(div);
        });
      }

      document.getElementById("kChars").textContent = text.length;
      document.getElementById("kTokens").textContent = tokens.length;
      document.getElementById("kRatio").textContent = tokens.length ? (text.length / tokens.length).toFixed(2) : "0.0";

      const aha = document.getElementById("ahaBox");
      if (aiBlindView) {
        aha.className = "aha";
        aha.innerHTML = "🤯 <strong>这就是大模型的真实视野！</strong>你现在只能看到一排数字条形码 <code>[#...]</code>，根本看不到里面的字母 <code>r</code>！让大模型数 <code>strawberry</code> 里有几个 <code>r</code>，就像给你 3 个条形码让你猜里面藏了几个笔画——不靠推理拆解，它当然容易数错！";
      } else if (text.toLowerCase().includes("strawberry")) {
        aha.className = "aha sky";
        aha.innerHTML = "💡 <strong>关键发现：</strong>英文单词 <code>strawberry</code> 被 BPE 分词器切成了 <code>str</code> + <code>aw</code> + <code>berry</code> 三个整块编号！现在点右上角 <strong>「🤖 AI 真实视角」</strong>，感受一下什么叫“看不见单个字母”！";
      } else if (text.includes("9.11")) {
        aha.className = "aha sky";
        aha.innerHTML = "💡 <strong>为什么 AI 常觉得 9.11 &gt; 9.9？</strong>因为 <code>9.11</code> 被切成了 <code>9</code>、<code>.</code>、<code>11</code>，在版本号语料（如 v9.11）里 11 确实排在 9 后面！";
      } else {
        aha.className = "aha sky";
        aha.innerHTML = "💡 <strong>Token 计费秘密：</strong>API 收费和上下文长度都不是按“字数”算，而是按这里的 <strong>Token 块数</strong> 算！英文高频词往往整个词只占 1 个 Token，而中文生僻字有时会被拆成多个字节 Token。";
      }
    }

    renderPresets();
    render();
  </script>
</body>
</html>
