<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玩具 03：无标签抓内鬼 · 异常检测雷达</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .layout { display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; align-items: start; }
    @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }
    .svg-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: 14px; padding: 12px; }
    svg { width: 100%; height: 310px; display: block; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .m-card { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: 12px; padding: 12px; text-align: center; }
    .m-lbl { font-size: 12px; color: var(--tax-muted); font-weight: 700; }
    .m-val { font-size: 24px; font-weight: 850; font-family: ui-monospace, monospace; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div>
        <h1>📡 无标签抓内鬼：怎么在不认识骗子的情况下抓盗刷？</h1>
        <p>拖动“正常安全圈半径”：落在高密度正常消费团之外的孤立点会被标为异常警报。试试找一个既不漏放盗刷、又不误冻好人卡的平衡点！</p>
      </div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>

    <div class="tax-panel">
      <div style="margin-bottom:14px;">
        <label style="font-size:14px;font-weight:800;">🎚️ 安全圈半径阈值：<span id="radVal" style="color:var(--tax-primary)">105</span>（越小越严格 / 越大越宽松）</label>
        <input id="radSlider" type="range" min="45" max="175" value="105" style="width:100%;margin-top:6px;" />
      </div>

      <div class="layout">
        <div class="svg-box">
          <svg id="anomSvg" viewBox="0 0 460 310"></svg>
          <div style="font-size:12px;color:var(--tax-muted);margin-top:6px;">
            🔵 正常消费（30 笔） · 🔴 真实盗刷（6 笔，圈外即拦截成功）
          </div>
        </div>
        <div>
          <div class="metrics">
            <div class="m-card">
              <div class="m-lbl">🚨 成功拦截盗刷</div>
              <div class="m-val" id="tpVal" style="color:var(--tax-green)">0 / 6</div>
            </div>
            <div class="m-card">
              <div class="m-lbl">😱 漏放盗刷（资金损失）</div>
              <div class="m-val" id="fnVal" style="color:var(--tax-red)">0</div>
            </div>
            <div class="m-card">
              <div class="m-lbl">😡 误冻正常卡（客诉）</div>
              <div class="m-val" id="fpVal" style="color:var(--tax-amber)">0</div>
            </div>
            <div class="m-card">
              <div class="m-lbl">💰 综合风控损失估算</div>
              <div class="m-val" id="costVal" style="color:var(--tax-primary)">¥0</div>
            </div>
          </div>
          <div style="background:var(--tax-surface-alt);border:1px solid var(--tax-border);border-radius:12px;padding:13px;font-size:13px;color:var(--tax-muted);" id="adviceBox"></div>
        </div>
      </div>
    </div>

    <div class="tax-aha" id="ahaBox">
      💡 <strong>顿悟时刻：</strong>新型欺诈手法每天都在变，根本来不及提前标好标签！无监督异常检测换了个思路：<strong>“我不需要认识所有坏人，只要先摸清好人抱团的规律，离群体太远的怪点就立刻拉响警报！”</strong>
    </div>
  </div>

  <script>
    const CX = 215, CY = 160;
    const NORMALS = [
      [-18,-12],[14,10],[-32,18],[26,-24],[5,-36],[-42,-15],[38,28],[-10,44],
      [48,-10],[-52,22],[20,48],[-28,-48],[56,16],[-60,-28],[12,-62],[-15,64],
      [68,-26],[-46,56],[36,66],[-72,8],[76,22],[-22,-76],[44,-68],[-66,-54],
      [84,-8],[-82,34],[26,82],[-54,74],[94,26],[-96,-20]
    ].map(([dx, dy]) => ({ x: CX + dx, y: CY + dy, fraud: false }));

    const FRAUDS = [
      [138, -88], [156, 72], [-145, -82], [118, 92], [-128, 95], [105, -62]
    ].map(([dx, dy]) => ({ x: CX + dx, y: CY + dy, fraud: true }));

    const ALL = [...NORMALS, ...FRAUDS];
    let moves = 0;

    function render() {
      const R = parseInt(document.getElementById("radSlider").value, 10);
      document.getElementById("radVal").textContent = R;

      let tp = 0, fn = 0, fp = 0;
      const svg = document.getElementById("anomSvg");
      let html = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="var(--tax-green-soft)" stroke="var(--tax-green)" stroke-width="2.5" stroke-dasharray="6,4"/>`;
      html += `<circle cx="${CX}" cy="${CY}" r="4" fill="var(--tax-green)"/>`;
      html += `<text x="${CX}" y="${CY - R - 8}" text-anchor="middle" font-size="11.5" font-weight="800" fill="var(--tax-green)">正常消费密度边界 (R=${R})</text>`;

      for (const p of ALL) {
        const d = Math.hypot(p.x - CX, p.y - CY);
        const flagged = d > R;
        if (p.fraud && flagged) tp++;
        if (p.fraud && !flagged) fn++;
        if (!p.fraud && flagged) fp++;
        if (flagged) {
          html += `<circle cx="${p.x}" cy="${p.y}" r="11" fill="none" stroke="var(--tax-amber)" stroke-width="2"/>`;
        }
        html += `<circle cx="${p.x}" cy="${p.y}" r="5.5" fill="${p.fraud ? "var(--tax-red)" : "var(--tax-primary)"}" stroke="#fff" stroke-width="1.4"/>`;
      }
      svg.innerHTML = html;

      const cost = fn * 5000 + fp * 200; // 漏放1笔盗刷亏5000，误杀1笔客诉成本200
      document.getElementById("tpVal").textContent = `${tp} / ${FRAUDS.length}`;
      document.getElementById("fnVal").textContent = fn;
      document.getElementById("fpVal").textContent = fp;
      document.getElementById("costVal").textContent = "¥" + cost.toLocaleString();

      const adv = document.getElementById("adviceBox");
      if (R < 85) {
        adv.innerHTML = `⚠️ <strong>风控过严：</strong>盗刷全拦住了，但把 <strong>${fp} 笔</strong> 正常用户消费误冻了，客服电话要被打爆！`;
      } else if (R > 125) {
        adv.innerHTML = `🚨 <strong>风控过松：</strong>虽然零误杀，但漏放了 <strong>${fn} 笔</strong> 高额盗刷，直接造成 ¥${(fn * 5000).toLocaleString()} 资金损失！`;
      } else {
        adv.innerHTML = `🎯 <strong>黄金权衡区间：</strong>成功拦截 <strong>${tp}/6</strong> 笔盗刷，仅误报 ${fp} 笔边界正常交易（可触发短信二次验证，低成本解决）。`;
      }
    }

    document.getElementById("radSlider").addEventListener("input", () => {
      moves++;
      render();
      if (moves >= 4 && window.ToySDK) window.ToySDK.markCompleted();
    });
    render();
  </script>
</body>
</html>
