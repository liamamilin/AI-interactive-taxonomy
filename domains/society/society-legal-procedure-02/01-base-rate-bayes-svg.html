<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔬 贝叶斯 DNA 匹配面积透视镜（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔬 贝叶斯 DNA 匹配面积透视镜（SVG）</h1><p>误区：“DNA 随机匹配概率是百万分之一”等价于“嫌疑人是无辜的概率只有百万分之一”。真相：这是把条件概率 P(匹配|无辜) 和 P(无辜|匹配) 搞反了！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>数据库检索城市人口</span><span id="vPop">1000 万人</span></label><input type="range" id="sPop" min="1" max="20" value="10" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>随机撞脸/DNA 误配率 (每百万人)</span><span id="vErr">1 人</span></label><input type="range" id="sErr" min="1" max="5" value="1" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">匹配总人数</div><div class="k-val" id="kTot">—</div></div>
        <div class="kpi"><div class="k-lbl">真凶在其中概率</div><div class="k-val" id="kGuilt" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">无辜却被匹配概率</div><div class="k-val" id="kInn" style="color:#ef4444;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const pop=+document.getElementById('sPop').value, err=+document.getElementById('sErr').value;
  document.getElementById('vPop').textContent=pop+'00 万人'; document.getElementById('vErr').textContent=err+' 人';
  const falseMatches=pop*err, total=1+falseMatches;
  const pGuilt=(1/total*100), pInn=(falseMatches/total*100);
  document.getElementById('kTot').textContent=total+' 人';
  document.getElementById('kGuilt').textContent=pGuilt.toFixed(1)+'%';
  document.getElementById('kInn').textContent=pInn.toFixed(1)+'%';
  let dots='';
  for(let i=0;i<Math.min(50,total);i++){
    const col=i===0?'#10b981':'#ef4444';
    const x=38+(i%15)*36, y=38+Math.floor(i/15)*36;
    dots+=`<circle cx="${x}" cy="${y}" r="11" fill="${col}"/>
    <text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${i===0?'凶':'冤'}</text>`;
  }
  document.getElementById('svg').innerHTML=dots+`<text x="30" y="172" font-size="12.5" font-weight="800" fill="var(--tax-text)">库中共有 ${total} 个完全匹配者：1 个真凶 (绿) + ${falseMatches} 个纯属巧合的无辜者 (红)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>在 ${pop}00 万人的大库里盲搜，百万分之一的巧合会命中 <strong>${falseMatches} 个无辜路人</strong>！仅凭单一数据库匹配就定罪，嫌疑人无辜的概率高达 <strong>${pInn.toFixed(1)}%</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
