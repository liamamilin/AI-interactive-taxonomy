<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算法喂养与双峰极化直方图</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .viz-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 16px; }
    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .kpi { background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 10px; padding: 10px; text-align: center; }
    .kpi-l { font-size: 12px; color: var(--tax-muted); }
    .kpi-v { font-size: 20px; font-weight: 800; color: var(--tax-ink); margin-top: 2px; }
    svg text { fill: var(--tax-muted); font-family: inherit; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>📊 算法喂养与双峰极化直方图</h1>
      <p>初始时 200 位用户的观点呈温和的“中间大、两头小”钟形分布。拖动推荐算法同质化强度与情绪标题加权，看中间温和派如何被一步步吸干。</p>
    </header>

    <div class="toy-controls">
      <div class="control-group">
        <label>算法同质化喂养强度：<strong id="algoVal">65%</strong></label>
        <input id="algoSlider" type="range" min="0" max="100" step="5" value="65">
      </div>
      <div class="control-group">
        <label>情绪化标题放大权重：<strong id="rageVal">50%</strong></label>
        <input id="rageSlider" type="range" min="0" max="100" step="5" value="50">
      </div>
      <div class="control-group">
        <label>持续刷信息流天数：<strong id="dayVal">30 天</strong></label>
        <input id="daySlider" type="range" min="0" max="90" step="5" value="30">
      </div>
    </div>

    <div class="viz-box">
      <svg id="histSvg" viewBox="0 0 640 250" style="width:100%;height:auto;display:block;"></svg>
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-l">中间温和派占比</div>
          <div class="kpi-v" id="midVal">42%</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">极端阵营占比</div>
          <div class="kpi-v" id="extVal">28%</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">双峰极化指数</div>
          <div class="kpi-v" id="polVal">0.48</div>
        </div>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 观察指引：</strong>试着把「持续刷信息流天数」从 0 天拉到 90 天，看看温和的钟形曲线是如何裂成左右两座孤峰的。
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    // Deterministic seeded initial population (200 users, Gaussian around 0)
    const baseUsers = [];
    for (let i = 0; i < 200; i++) {
      // Box-Muller deterministic approximation
      const u1 = ((i * 73 + 17) % 199 + 1) / 200;
      const u2 = ((i * 131 + 43) % 199 + 1) / 200;
      const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
      baseUsers.push(Math.max(-9.5, Math.min(9.5, z * 3.1)));
    }

    const algoSlider = document.getElementById('algoSlider');
    const rageSlider = document.getElementById('rageSlider');
    const daySlider = document.getElementById('daySlider');
    const svg = document.getElementById('histSvg');
    let interacted = false;

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function simulate() {
      const algo = Number(algoSlider.value) / 100;
      const rage = Number(rageSlider.value) / 100;
      const days = Number(daySlider.value);

      document.getElementById('algoVal').textContent = Math.round(algo * 100) + '%';
      document.getElementById('rageVal').textContent = Math.round(rage * 100) + '%';
      document.getElementById('dayVal').textContent = days + ' 天';

      const steps = Math.round(days / 5);
      const pushRate = (algo * 0.11 + rage * 0.09) * (0.4 + algo * 0.8);
      const pullCenter = (1 - algo) * 0.05;

      const opinions = baseUsers.map(o => {
        let x = o;
        for (let s = 0; s < steps; s++) {
          const sign = x >= 0 ? 1 : -1;
          // Echo chamber pushes away from 0 toward +/- 8.5, while open feed pulls gently toward center
          const drift = sign * pushRate * (1.2 + Math.abs(x) * 0.18) - x * pullCenter;
          x = Math.max(-9.8, Math.min(9.8, x + drift));
        }
        return x;
      });

      // 10 bins from -10 to +10
      const bins = new Array(10).fill(0);
      let midCount = 0, extCount = 0;
      opinions.forEach(x => {
        const b = Math.min(9, Math.max(0, Math.floor((x + 10) / 2)));
        bins[b]++;
        if (Math.abs(x) <= 3.5) midCount++;
        if (Math.abs(x) >= 6.5) extCount++;
      });

      const maxBin = Math.max(35, ...bins);
      const W = 640, H = 250, padL = 42, padR = 20, padT = 20, padB = 38;
      const barW = (W - padL - padR) / 10;

      let barsHtml = '';
      bins.forEach((cnt, idx) => {
        const bh = (cnt / maxBin) * (H - padT - padB);
        const x = padL + idx * barW + 6;
        const y = H - padB - bh;
        const color = idx <= 1 ? 'rgba(59,130,246,0.85)' : idx >= 8 ? 'rgba(239,68,68,0.85)' : idx <= 3 ? 'rgba(96,165,250,0.65)' : idx >= 6 ? 'rgba(248,113,113,0.65)' : 'rgba(16,185,129,0.75)';
        barsHtml += `
          <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW - 12).toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="${color}"/>
          <text x="${(x + (barW - 12) / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700">${cnt}</text>
          <text x="${(x + (barW - 12) / 2).toFixed(1)}" y="${H - padB + 16}" text-anchor="middle" font-size="10">${-9 + idx * 2}</text>
        `;
      });

      svg.innerHTML = `
        <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--tax-muted)"/>
        ${barsHtml}
        <text x="${padL + 10}" y="${H - 4}" font-size="11" font-weight="700" fill="var(--tax-primary)">← 强烈立场 A</text>
        <text x="${W / 2}" y="${H - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tax-green)">中间温和区</text>
        <text x="${W - padR - 10}" y="${H - 4}" text-anchor="end" font-size="11" font-weight="700" fill="var(--tax-red)">强烈立场 B →</text>
      `;

      const midPct = Math.round((midCount / 200) * 100);
      const extPct = Math.round((extCount / 200) * 100);
      const polIndex = Math.min(1, (extCount / 200) * 1.15 + (1 - midCount / 200) * 0.25).toFixed(2);

      document.getElementById('midVal').textContent = midPct + '%';
      document.getElementById('extVal').textContent = extPct + '%';
      document.getElementById('polVal').textContent = polIndex;

      const aha = document.getElementById('ahaBox');
      if (days === 0) {
        aha.innerHTML = `<strong>🌱 初始温和态（第 0 天）：</strong>大众原本大多是中间派（<strong>${midPct}%</strong>），极端观点只是少数。拖动「天数」与「算法强度」开始喂养！`;
      } else if (extPct >= 55) {
        aha.innerHTML = `<strong>🌋 严重双峰极化！</strong>中间温和派已被吸干至 <strong>${midPct}%</strong>，高达 <strong>${extPct}%</strong> 的人被推向左右两极。算法并未“创造”新立场，它只是不断喂给你略微更激进的同类内容，把微小倾向滚成雪球。`;
      } else if (algo <= 0.25) {
        aha.innerHTML = `<strong>🌈 公共广场效应：</strong>当同质化喂养低于 25% 时，跨阵营内容提供了“向心拉力”，中间派维持在 <strong>${midPct}%</strong>，社会未发生撕裂。`;
      } else {
        aha.innerHTML = `<strong>🫧 茧房形成中（第 ${days} 天）：</strong>中间派已滑落至 <strong>${midPct}%</strong>，两极阵营升至 <strong>${extPct}%</strong>。试着把「情绪化标题权重」也拉高，看看极化速度如何倍增。`;
      }
    }

    [algoSlider, rageSlider, daySlider].forEach(el => {
      el.addEventListener('input', () => {
        markDone('模拟了算法喂养与双峰极化演化');
        simulate();
      });
    });

    simulate();
  </script>
</body>
</html>
