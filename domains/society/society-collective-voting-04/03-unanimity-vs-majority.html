<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚖️ 一致同意 vs 简单多数：定罪门槛的双刃剑</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>⚖️ 一致同意 vs 简单多数：定罪门槛的双刃剑</h1><p>误区：要求 12 名陪审员全票通过定罪，不仅能保护好人，也不会怎么放跑坏人。真相：把门槛拉到全票一致，只要有 1 个固执或被收买的陪审员，真凶就会被当场释放！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>定罪门槛 (12人中至少赞成数)</span><span id="vK">10 / 12</span></label><input type="range" id="sK" min="7" max="12" value="10" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>有罪证据清晰度</span><span id="vQ">78%</span></label><input type="range" id="sQ" min="55" max="95" value="78" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">错判无辜概率 (冤案)</div><div class="k-val" id="kFP" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">放走真凶概率 (漏网)</div><div class="k-val" id="kFN" style="color:#f59e0b;">—</div></div>
        <div class="kpi"><div class="k-lbl">制度偏向</div><div class="k-val" id="kBias">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function binomTail(n,kMin,p){
  let sum=0, comb=1;
  for(let k=0;k<=n;k++){ if(k>0) comb=comb*(n-k+1)/k; if(k>=kMin) sum+=comb*Math.pow(p,k)*Math.pow(1-p,n-k); }
  return sum;
}
function upd(){
  const k=+document.getElementById('sK').value, q=+document.getElementById('sQ').value/100;
  document.getElementById('vK').textContent=k+' / 12'; document.getElementById('vQ').textContent=(q*100).toFixed(0)+'%';
  const pInnocentErr=1-q;
  const fp=binomTail(12,k,pInnocentErr)*100;
  const fn=(1-binomTail(12,k,q))*100;
  document.getElementById('kFP').textContent=fp.toFixed(2)+'%';
  document.getElementById('kFN').textContent=fn.toFixed(1)+'%';
  document.getElementById('kBias').textContent=k>=11?'宁纵勿枉（极度护无辜）':'兼顾打击犯罪';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#ef4444">冤枉无辜者概率 (假阳性): ${fp.toFixed(2)}%</text>
    <rect x="20" y="44" width="540" height="24" rx="6" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="44" width="${Math.min(540,fp*18)}" height="24" rx="6" fill="#ef4444"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#f59e0b">放走真凶概率 (假阴性): ${fn.toFixed(1)}%</text>
    <rect x="20" y="112" width="540" height="24" rx="6" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="112" width="${Math.min(540,fn*5.4)}" height="24" rx="6" fill="#f59e0b"/>
    <text x="20" y="168" font-size="12.5" font-weight="750" fill="var(--tax-muted)">门槛 ${k}/12：每降 1 票，放走真凶风险骤降，但冤案风险指数上升</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>刑事法庭常要求 12/12 一致同意，正是制度主动选择了“哪怕放走 ${fn.toFixed(1)}% 的真凶，也要把冤枉无辜者的概率压低到 ${fp.toFixed(2)}%”！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
