<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚫 非法证据排除法则：威慑力模拟器（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🚫 非法证据排除法则：威慑力模拟器（SVG）</h1><p>误区：把非法搜来的铁证直接作废，只是在纵容坏人、浪费破案心血。真相：如果不把非法得来的果子扔掉，执法者就永远有动力先破门再补手续——长远来看每个普通人都不再安全！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>非法证据被法庭排除率</span><span id="vEx">85%</span></label><input type="range" id="sEx" min="0" max="100" value="85" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>破大案的额外晋升激励</span><span id="vBon">60 分</span></label><input type="range" id="sBon" min="10" max="100" value="60" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">违规取证净期望收益</div><div class="k-val" id="kNet">—</div></div>
        <div class="kpi"><div class="k-lbl">执法合规率</div><div class="k-val" id="kComp" style="color:#10b981;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const ex=+document.getElementById('sEx').value/100, bon=+document.getElementById('sBon').value;
  document.getElementById('vEx').textContent=(ex*100).toFixed(0)+'%'; document.getElementById('vBon').textContent=bon+' 分';
  const net=Math.round((1-ex)*bon - ex*25);
  const comp=Math.max(10, Math.min(98, Math.round(95 - Math.max(0, net)*1.2)));
  document.getElementById('kNet').textContent=(net>0?'+':'')+net+' 分';
  document.getElementById('kNet').style.color=net>0?'#ef4444':'#10b981';
  document.getElementById('kComp').textContent=comp+'%';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="${net>0?'#ef4444':'#10b981'}">违规取证期望净收益: ${net>0?'+':''}${net} 分</text>
    <rect x="20" y="44" width="540" height="24" rx="6" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="44" width="${Math.max(8,Math.min(540,(net+30)*6))}" height="24" rx="6" fill="${net>0?'#ef4444':'#10b981'}"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#0284c7">公民隐私受保护与执法合规率: ${comp}%</text>
    <rect x="20" y="112" width="540" height="24" rx="6" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="112" width="${comp*5.4}" height="24" rx="6" fill="#0284c7"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">一旦排除率降到无法抵消破案收益，违规取证就会成为常态</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>“毒树之果”规则不是为了救眼前的被告，而是为了彻底抽干违法取证的收益激励——当排除率达到 ${(ex*100).toFixed(0)}% 时，违规收益降至 ${net} 分，守法才成为唯一理性选择！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
