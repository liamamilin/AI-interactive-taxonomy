<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>非法证据排除法则：威慑力模拟器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .viz-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 14px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .kpi { background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 10px; padding: 10px; text-align: center; }
    .kpi-l { font-size: 12px; color: var(--tax-muted); }
    .kpi-v { font-size: 20px; font-weight: 800; color: var(--tax-ink); margin-top: 2px; }
    svg text { fill: var(--tax-muted); font-family: inherit; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🚫 非法证据排除法则：威慑力模拟器</h1>
      <p>如果法官允许把“无证破门搜查”得来的赃物当作定罪铁证，眼前确实多判了一个罪犯——但<strong>5 年后</strong>整个社会的无证搜查会变成什么样？拖动排除法则执行严格度，观察长期激励如何重塑执法生态！</p>
    </header>

    <div class="toy-controls">
      <div class="control-group">
        <label>非法证据排除严格度：<strong id="exVal">80%</strong></label>
        <input id="exSlider" type="range" min="0" max="100" step="5" value="80">
      </div>
      <div class="control-group">
        <label>合法侦查技术与经费投入：<strong id="invVal">60%</strong></label>
        <input id="invSlider" type="range" min="20" max="100" step="10" value="60">
      </div>
    </div>

    <div class="viz-box">
      <svg id="simSvg" viewBox="0 0 640 235" style="width:100%;height:auto;display:block;"></svg>
      <div class="kpi-grid">
        <div class="kpi">
          <div class="kpi-l">第 5 年非法搜查占比</div>
          <div class="kpi-v" id="illVal">12%</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">第 5 年合规破案率</div>
          <div class="kpi-v" id="solVal">78%</div>
        </div>
        <div class="kpi">
          <div class="kpi-l">公民宪法安全感</div>
          <div class="kpi-v" id="secVal">86 分</div>
        </div>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 博弈激励视角：</strong>把「非法证据排除严格度」拖到 <strong>0%</strong>（只要结果对，过程随便），观察红线如何在 5 年内失控飙升！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const exSlider = document.getElementById('exSlider');
    const invSlider = document.getElementById('invSlider');
    const svg = document.getElementById('simSvg');
    let interacted = false;

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const ex = Number(exSlider.value) / 100;
      const inv = Number(invSlider.value) / 100;
      document.getElementById('exVal').textContent = Math.round(ex * 100) + '%';
      document.getElementById('invVal').textContent = Math.round(inv * 100) + '%';

      // Simulate Years 0..5
      const illegal = [35];
      const legalSolve = [55];
      for (let y = 1; y <= 5; y++) {
        // When exclusion is strict, shortcutting loses payoff -> illegal rate drops exponentially
        const targetIll = 68 * (1 - ex) + 4;
        const nextIll = illegal[y - 1] + (targetIll - illegal[y - 1]) * 0.45;
        illegal.push(nextIll);

        // Strict exclusion forces investment into professional forensic/warrant workflows
        const shortPain = (y === 1 && ex > 0.7) ? -5 * ex : 0;
        const targetSolve = 46 + 38 * inv + 10 * ex;
        const nextSolve = Math.min(95, Math.max(30, legalSolve[y - 1] + (targetSolve - legalSolve[y - 1]) * 0.42 + shortPain));
        legalSolve.push(nextSolve);
      }

      const endIll = Math.round(illegal[5]);
      const endSolve = Math.round(legalSolve[5]);
      const secScore = Math.max(15, Math.min(98, Math.round(96 - endIll * 1.15)));

      document.getElementById('illVal').textContent = endIll + '%';
      document.getElementById('illVal').style.color = endIll > 30 ? 'var(--tax-red)' : 'var(--tax-green)';
      document.getElementById('solVal').textContent = endSolve + '%';
      document.getElementById('secVal').textContent = secScore + ' 分';

      const W = 640, H = 235, padL = 46, padR = 24, padT = 22, padB = 34;
      const sx = y => padL + (y / 5) * (W - padL - padR);
      const sy = v => H - padB - (v / 100) * (H - padT - padB);
      const toPath = arr => arr.map((v, i) => `${i === 0 ? 'M' : 'L'}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(' ');

      svg.innerHTML = `
        <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--tax-muted)"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--tax-muted)"/>
        ${[25, 50, 75].map(g => `<line x1="${padL}" y1="${sy(g)}" x2="${W - padR}" y2="${sy(g)}" stroke="var(--tax-border)" stroke-dasharray="3,4"/>`).join('')}
        <path d="${toPath(illegal)}" fill="none" stroke="var(--tax-red)" stroke-width="3"/>
        <path d="${toPath(legalSolve)}" fill="none" stroke="var(--tax-green)" stroke-width="3"/>
        ${[0,1,2,3,4,5].map(y => `
          <circle cx="${sx(y).toFixed(1)}" cy="${sy(illegal[y]).toFixed(1)}" r="4" fill="var(--tax-red)"/>
          <circle cx="${sx(y).toFixed(1)}" cy="${sy(legalSolve[y]).toFixed(1)}" r="4" fill="var(--tax-green)"/>
          <text x="${sx(y).toFixed(1)}" y="${H - padB + 17}" text-anchor="middle" font-size="11">第 ${y} 年</text>
        `).join('')}
        <text x="${W - padR - 6}" y="${padT + 14}" text-anchor="end" font-size="11" font-weight="700" fill="var(--tax-red)">━━ 非法搜查/越权占比</text>
        <text x="${W - padR - 6}" y="${padT + 30}" text-anchor="end" font-size="11" font-weight="700" fill="var(--tax-green)">━━ 合法专业破案率</text>
      `;

      const aha = document.getElementById('ahaBox');
      if (ex <= 0.2) {
        aha.innerHTML = `<strong>🚨 捷径泛滥，人人自危！</strong>当排除严格度仅为 ${Math.round(ex * 100)}% 时，违法取证省时省力且依然能定罪，5 年后非法搜查飙升至 <strong>${endIll}%</strong>，公民隐私安全感暴跌至 <strong>${secScore} 分</strong>。`;
      } else if (ex >= 0.75) {
        aha.innerHTML = `<strong>🛡️ 斩断违法收益，倒逼专业升级！</strong>虽然第 1 年因排除瑕疵证据出现短暂阵痛，但从第 2 年起，办案人员知道“违法搜来的全作废”，非法搜查锐减至 <strong>${endIll}%</strong>，合法专业破案率反而稳步升至 <strong>${endSolve}%</strong>！`;
      } else {
        aha.innerHTML = `<strong>⚖️ 半松半紧的灰色地带：</strong>排除严格度在 ${Math.round(ex * 100)}% 时仍有 <strong>${endIll}%</strong> 的越权侥幸心理。只有把规则执行到足够刚性，才能彻底改变一线激励结构。`;
      }
    }

    exSlider.addEventListener('input', () => { markDone('模拟了非法证据排除法则威慑力'); render(); });
    invSlider.addEventListener('input', () => { markDone('调整了合法侦查投入参数'); render(); });
    render();
  </script>
</body>
</html>
