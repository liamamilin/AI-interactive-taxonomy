<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毒树之果证据链条追溯树</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .tree-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 14px; }
    .node-info { margin-top: 12px; background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 10px; padding: 12px; font-size: 13px; color: var(--tax-ink); line-height: 1.55; }
    svg text { font-family: inherit; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🌿 毒树之果证据链条追溯树</h1>
      <p>如果树根（源头取证）是违法的，顺藤摸瓜衍生出的证据（果实）原则上也会一起被污染排除——但法律也留了<strong>「独立来源」</strong>与<strong>「必然发现」</strong>两道豁免出口！<strong>点击下方任意节点</strong>检查它的法庭效力。</p>
    </header>

    <div class="toy-controls">
      <div class="toy-btn-row">
        <button class="toy-btn primary" id="poisonRootBtn">☠️ 树根状态：无证非法监听</button>
        <button class="toy-btn" id="cleanRootBtn">📜 树根状态：持法院合法监听令</button>
      </div>
    </div>

    <div class="tree-box">
      <svg id="treeSvg" viewBox="0 0 640 270" style="width:100%;height:auto;display:block;"></svg>
      <div class="node-info" id="nodeInfo">👆 点击树上的任意证据节点，查看法官是否采纳它以及背后的法理依据。</div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 毒树之果核心：</strong>对比左侧被污染的“顺藤摸瓜果实”与右侧两枚“豁免绿果”——为什么即使树根有毒，右下角那两份证据依然可以在法庭上合法使用？点击它们一探究竟！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let rootPoisoned = true;
    let selectedId = 'root';
    let interacted = false;

    const nodes = [
      { id: 'root', x: 320, y: 36, label: '源头：监听电话录音', parent: null, exception: false,
        poisonDesc: '☠️【毒树之根 — 排除】未经法院批准私自监听，直接侵犯公民通信秘密，该录音本身绝对不可采纳。',
        cleanDesc: '✅【合法之根 — 采纳】经法院依法签发监听令获取，程序合法，整棵证据树全部有效。' },
      { id: 'n1', x: 140, y: 125, label: '顺藤搜出：密室账本', parent: 'root', exception: false,
        poisonDesc: '☠️【毒树之果 — 排除】完全依赖非法监听里听到的地址才找到密室账本，属于直接衍生污染证据，必须一并排除！',
        cleanDesc: '✅【合法衍生 — 采纳】源头监听合法，据此申请搜查令查获的账本完全有效。' },
      { id: 'n2', x: 140, y: 218, label: '账本牵出：共犯口供', parent: 'n1', exception: false,
        poisonDesc: '☠️【二级毒果 — 排除】拿着被污染的账本逼问出的下游线索，因果链条未中断，依然沾染源头之毒！',
        cleanDesc: '✅【合法证据 — 采纳】基于合法账本依法讯问取得的证言，具备完全证明力。' },
      { id: 'n3', x: 350, y: 125, label: '必然发现：路边弃车', parent: 'root', exception: true,
        poisonDesc: '🌿【豁免：必然发现例外 — 采纳】虽然通过非法线索提前找到了弃车，但交警例行拖车巡逻 2 小时内也必然会发现它，因此依法豁免排除！',
        cleanDesc: '✅【合法证据 — 采纳】程序合法，正常采纳。' },
      { id: 'n4', x: 525, y: 125, label: '独立来源：银行报案', parent: null, exception: true,
        poisonDesc: '🛡️【豁免：独立来源例外 — 采纳】银行风控系统完全独立地发现洗钱流水并主动报案，与非法监听毫无因果关系，完全不受污染！',
        cleanDesc: '✅【独立铁证 — 采纳】独立第三方主动移交的金融证据，合法有效。' }
    ];

    const svg = document.getElementById('treeSvg');

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function isNodePoisoned(n) {
      if (!rootPoisoned) return false;
      return !n.exception;
    }

    function render() {
      let edges = '';
      nodes.forEach(n => {
        if (n.parent) {
          const p = nodes.find(x => x.id === n.parent);
          const bad = isNodePoisoned(n);
          edges += `<line x1="${p.x}" y1="${p.y + 20}" x2="${n.x}" y2="${n.y - 20}" stroke="${bad ? 'var(--tax-red)' : 'var(--tax-green)'}" stroke-width="2.6" stroke-dasharray="${n.exception ? '5,4' : 'none'}"/>`;
        }
      });

      let boxes = '';
      nodes.forEach(n => {
        const bad = isNodePoisoned(n);
        const sel = selectedId === n.id;
        const fill = bad ? 'rgba(239,68,68,0.16)' : 'rgba(16,185,129,0.16)';
        const stroke = bad ? 'var(--tax-red)' : 'var(--tax-green)';
        const icon = bad ? '☠️' : '✅';
        boxes += `
          <g class="t-node" data-id="${n.id}" style="cursor:pointer;">
            <rect x="${n.x - 86}" y="${n.y - 22}" width="172" height="44" rx="10" fill="${fill}" stroke="${stroke}" stroke-width="${sel ? 3.2 : 1.8}"/>
            <text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--tax-ink)">${icon} ${n.label}</text>
          </g>
        `;
      });

      svg.innerHTML = edges + boxes;
      svg.querySelectorAll('.t-node').forEach(g => {
        g.addEventListener('click', () => {
          selectedId = g.dataset.id;
          markDone('交互排查了毒树之果证据链节点');
          render();
        });
      });

      const cur = nodes.find(x => x.id === selectedId);
      document.getElementById('nodeInfo').innerHTML = rootPoisoned ? cur.poisonDesc : cur.cleanDesc;

      const excludedCount = nodes.filter(isNodePoisoned).length;
      const aha = document.getElementById('ahaBox');
      if (!rootPoisoned) {
        aha.innerHTML = `<strong>📜 程序合法，全链有效（5/5 采纳）：</strong>事前多花两小时申请合法监听令，就能让所有衍生铁证在法庭上稳如磐石——遵守程序反而是效率最高的捷径！`;
      } else if (cur.exception) {
        aha.innerHTML = `<strong>⚖️ 精妙的例外防线：</strong>毒树之果并非盲目放纵罪犯！对于「独立来源」与「必然发现」的证据，排除它起不到威慑警察的作用，反而白白放跑真凶，因此法律精准予以豁免。`;
      } else {
        aha.innerHTML = `<strong>🌳 一根染毒，连坐三果（${excludedCount} 项被排除）：</strong>源头非法监听不仅让自身作废，还连带报废了顺藤摸瓜查到的账本与下游口供！点击右侧两枚绿色节点看看什么情况可以豁免。`;
      }
    }

    document.getElementById('poisonRootBtn').addEventListener('click', () => {
      rootPoisoned = true;
      document.getElementById('poisonRootBtn').classList.add('primary');
      document.getElementById('cleanRootBtn').classList.remove('primary');
      markDone('切换了非法取证树根');
      render();
    });
    document.getElementById('cleanRootBtn').addEventListener('click', () => {
      rootPoisoned = false;
      document.getElementById('cleanRootBtn').classList.add('primary');
      document.getElementById('poisonRootBtn').classList.remove('primary');
      markDone('切换了合法监听令树根');
      render();
    });

    render();
  </script>
</body>
</html>
