<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌿 毒树之果证据链条追溯树</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌿 毒树之果证据链条追溯树</h1><p>误区：只要最初的线索违法，后面找到的所有证据就绝对永远不能用。真相：如果检方能证明“即便没有那次违法，警方按正常巡逻也必然会发现它”，果实就可以被豁免！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="btn-row">
        <button class="btn active" onclick="setRoot(false,this)">源头违法：无证破门窃听</button>
        <button class="btn" onclick="setRoot(true,this)">源头合法：持有法官搜查令</button>
      </div>
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>独立合法线索存在概率 (必然发现例外)</span><span id="vInd">20%</span></label><input type="range" id="sInd" min="0" max="100" value="20" oninput="draw()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">毒树本体 (直接供词)</div><div class="k-val" id="kT1">—</div></div>
        <div class="kpi"><div class="k-lbl">衍生果实 (凶器/账本)</div><div class="k-val" id="kT2">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
let legal=false;
function setRoot(ok,btn){ legal=ok; document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); draw(); }
function draw(){
  const ind=+document.getElementById('sInd').value; document.getElementById('vInd').textContent=ind+'%';
  const treeOk=legal, fruitOk=legal||(ind>=65);
  document.getElementById('kT1').textContent=treeOk?'合法采信':'全部排除';
  document.getElementById('kT2').textContent=fruitOk?(legal?'合法采信':'触发例外豁免'):'连带排除';
  const cT=treeOk?'#10b981':'#ef4444', cF=fruitOk?'#10b981':'#ef4444';
  document.getElementById('svg').innerHTML=`
    <rect x="40" y="65" width="150" height="55" rx="10" fill="${cT}" opacity="0.2" stroke="${cT}" stroke-width="2.5"/>
    <text x="115" y="90" text-anchor="middle" font-size="13" font-weight="800" fill="${cT}">源头取证手段</text>
    <text x="115" y="109" text-anchor="middle" font-size="12" fill="var(--tax-text)">${legal?'有搜查令':'无证窃听(毒树)'}</text>
    <line x1="190" y1="92" x2="265" y2="50" stroke="${cT}" stroke-width="2.5"/>
    <line x1="190" y1="92" x2="265" y2="135" stroke="${cF}" stroke-width="2.5"/>
    <rect x="265" y="22" width="290" height="52" rx="10" fill="${cT}" opacity="0.18" stroke="${cT}" stroke-width="2"/>
    <text x="410" y="52" text-anchor="middle" font-size="13.5" font-weight="800" fill="${cT}">直接证据 (供词/录音): ${treeOk?'✅ 可用':'❌ 排除'}</text>
    <rect x="265" y="110" width="290" height="52" rx="10" fill="${cF}" opacity="0.18" stroke="${cF}" stroke-width="2"/>
    <text x="410" y="140" text-anchor="middle" font-size="13.5" font-weight="800" fill="${cF}">衍生证据 (凶器/账本): ${fruitOk?'✅ 可用':'❌ 毒果排除'}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>“毒树之果”原则既防止了程序滥权，又通过“独立来源 / 必然发现”例外（当前独立度 ${ind}%）避免社会陷入机械教条！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
draw();
  </script>
</body>
</html>
