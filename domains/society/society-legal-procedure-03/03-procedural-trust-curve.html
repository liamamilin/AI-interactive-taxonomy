<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏛️ 程序正义 vs 实体结果：司法公信力双驱动</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏛️ 程序正义 vs 实体结果：司法公信力双驱动</h1><p>误区：老百姓只在乎最后判得重不重、赔得多不多，走过场快点判完就行。真相：心理学与法学实验反复证明，即使输了官司，只要程序公正公开、充分听证，民众对法律的服从度依然极高！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>程序公开透明与听证尊重度</span><span id="vProc">80%</span></label><input type="range" id="sProc" min="10" max="100" value="80" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>实体结果符合个人预期度</span><span id="vOut">35%</span></label><input type="range" id="sOut" min="10" max="100" value="35" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">司法公信力指数</div><div class="k-val" id="kTr" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">长期自觉守法意愿</div><div class="k-val" id="kOb">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const proc=+document.getElementById('sProc').value, out=+document.getElementById('sOut').value;
  document.getElementById('vProc').textContent=proc+'%'; document.getElementById('vOut').textContent=out+'%';
  const trust=Math.round(proc*0.68 + out*0.32);
  const obey=Math.round(proc*0.75 + out*0.25);
  document.getElementById('kTr').textContent=trust+' 分';
  document.getElementById('kOb').textContent=obey+'%';
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#0284c7">程序正义贡献权重 (68%): ${Math.round(proc*0.68)} 分</text>
    <rect x="20" y="44" width="540" height="24" rx="6" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="44" width="${proc*0.68*5.4}" height="24" rx="6" fill="#0284c7"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#10b981">总公信力与自觉守法率: ${trust} 分 / ${obey}%</text>
    <rect x="20" y="112" width="540" height="24" rx="6" fill="var(--tax-border)" opacity="0.3"/>
    <rect x="20" y="112" width="${trust*5.4}" height="24" rx="6" fill="#10b981"/>
    <text x="20" y="166" font-size="12.5" font-weight="750" fill="var(--tax-muted)">看得见的正义才能让败诉方也承认裁决合法性</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>哪怕实体结果只有 ${out}% 符合某一方的利益，只要程序正义达到 ${proc}%，社会整体对法律的信任度依然高达 <strong>${trust} 分</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
