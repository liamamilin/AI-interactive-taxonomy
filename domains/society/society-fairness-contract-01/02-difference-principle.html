<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>差异原则：什么样的贫富差距是正义的？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .viz-card { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 16px; }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .m-card { background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 10px; padding: 10px; text-align: center; }
    .m-l { font-size: 12px; color: var(--tax-muted); }
    .m-v { font-size: 20px; font-weight: 800; color: var(--tax-ink); margin-top: 2px; }
    svg text { fill: var(--tax-muted); font-family: inherit; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>📈 差异原则：什么样的贫富差距是正义的？</h1>
      <p>罗尔斯并不反对贫富差距，他提出一条冷峻的检验标准（差异原则）：<strong>只有当不平等能把“最弱势群体”的绝对收入也抬高时，这种差距才是正义的。</strong>拖动「激励差距指数」，寻找最弱势者的收入巅峰！</p>
    </header>

    <div class="toy-controls">
      <div class="control-group">
        <label>社会激励差距指数（0 = 绝对平均，100 = 赢家通吃）：<strong id="gapVal">45</strong></label>
        <input id="gapSlider" type="range" min="0" max="100" step="5" value="45">
      </div>
      <div class="toy-btn-row">
        <button class="toy-btn" data-g="0">绝对平均 (0)</button>
        <button class="toy-btn primary" data-g="45">罗尔斯最优点 (45)</button>
        <button class="toy-btn" data-g="75">功利总和最大 (75)</button>
        <button class="toy-btn" data-g="100">赢家通吃 (100)</button>
      </div>
    </div>

    <div class="viz-card">
      <svg id="diffSvg" viewBox="0 0 640 250" style="width:100%;height:auto;display:block;"></svg>
      <div class="metrics">
        <div class="m-card">
          <div class="m-l">最弱势群体绝对收入</div>
          <div class="m-v" id="poorVal">54.0</div>
        </div>
        <div class="m-card">
          <div class="m-l">精英群体收入</div>
          <div class="m-v" id="richVal">132.0</div>
        </div>
        <div class="m-card">
          <div class="m-l">社会总蛋糕（功利值）</div>
          <div class="m-v" id="totalVal">186.0</div>
        </div>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 差异原则判据：</strong>观察绿色曲线（最弱势群体收入）的最高点——在 0→45 区间，允许一定差距让大家都变富了；一旦超过 45，总蛋糕还在涨，但底层开始受损，这就越过了正义红线！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const slider = document.getElementById('gapSlider');
    const svg = document.getElementById('diffSvg');
    let interacted = false;

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function model(g) {
      // Total pie rises with incentive up to g=75, then declines slightly from social friction
      const total = 80 + 2.9 * g - 0.019 * g * g;
      // Bottom share drops from 0.50 at g=0 down to 0.10 at g=100
      const poorShare = 0.50 - 0.0040 * g;
      const poor = total * poorShare;
      const rich = total - poor;
      return { total, poor, rich };
    }

    function render() {
      const g = Number(slider.value);
      document.getElementById('gapVal').textContent = g;
      const cur = model(g);

      document.getElementById('poorVal').textContent = cur.poor.toFixed(1) + ' 万';
      document.getElementById('richVal').textContent = cur.rich.toFixed(1) + ' 万';
      document.getElementById('totalVal').textContent = cur.total.toFixed(1) + ' 万';

      const W = 640, H = 250, padL = 50, padR = 24, padT = 22, padB = 36;
      const xScale = v => padL + (v / 100) * (W - padL - padR);
      const yScale = v => H - padB - (v / 220) * (H - padT - padB);

      let pPoor = '', pTotal = '', pRich = '';
      for (let x = 0; x <= 100; x += 2) {
        const m = model(x);
        const cmd = x === 0 ? 'M' : 'L';
        pPoor += `${cmd}${xScale(x).toFixed(1)},${yScale(m.poor).toFixed(1)} `;
        pTotal += `${cmd}${xScale(x).toFixed(1)},${yScale(m.total).toFixed(1)} `;
        pRich += `${cmd}${xScale(x).toFixed(1)},${yScale(m.rich).toFixed(1)} `;
      }

      const cx = xScale(g);
      const optX = xScale(45);

      svg.innerHTML = `
        <rect x="${padL}" y="${padT}" width="${optX - padL}" height="${H - padT - padB}" fill="rgba(16,185,129,0.08)"/>
        <rect x="${optX}" y="${padT}" width="${W - padR - optX}" height="${H - padT - padB}" fill="rgba(239,68,68,0.07)"/>
        <text x="${(padL + optX) / 2}" y="${padT + 14}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tax-green)">正义激励区（拉动底层共富）</text>
        <text x="${(optX + W - padR) / 2}" y="${padT + 14}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tax-red)">越界极化区（以牺牲底层换总量）</text>

        <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--tax-muted)"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--tax-muted)"/>

        <path d="${pTotal}" fill="none" stroke="var(--tax-primary)" stroke-width="2.4" stroke-dasharray="6,4"/>
        <path d="${pRich}" fill="none" stroke="var(--tax-amber)" stroke-width="2.2"/>
        <path d="${pPoor}" fill="none" stroke="var(--tax-green)" stroke-width="3.5"/>

        <line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${H - padB}" stroke="var(--tax-ink)" stroke-dasharray="3,3" opacity="0.6"/>
        <circle cx="${cx.toFixed(1)}" cy="${yScale(cur.poor).toFixed(1)}" r="6" fill="var(--tax-green)" stroke="var(--tax-surface)" stroke-width="2"/>
        <circle cx="${cx.toFixed(1)}" cy="${yScale(cur.total).toFixed(1)}" r="5" fill="var(--tax-primary)" stroke="var(--tax-surface)" stroke-width="2"/>

        <text x="${W - padR - 6}" y="${yScale(model(96).total) - 8}" text-anchor="end" font-size="11" fill="var(--tax-primary)">社会总蛋糕</text>
        <text x="${W - padR - 6}" y="${yScale(model(96).rich) - 8}" text-anchor="end" font-size="11" fill="var(--tax-amber)">精英群体</text>
        <text x="${W - padR - 6}" y="${yScale(model(96).poor) - 8}" text-anchor="end" font-size="11" font-weight="700" fill="var(--tax-green)">最弱势群体</text>

        ${[0, 25, 45, 75, 100].map(v => `<text x="${xScale(v).toFixed(1)}" y="${H - padB + 17}" text-anchor="middle" font-size="11">${v}</text>`).join('')}
      `;

      const aha = document.getElementById('ahaBox');
      if (g <= 15) {
        aha.innerHTML = `<strong>📏 过度均贫区（差距=${g}）：</strong>虽然人人平等，但缺少激励导致总蛋糕萎缩，最弱势群体反而只能拿到 <strong>${cur.poor.toFixed(1)} 万</strong>——低于适度激励时的 55.6 万！`;
      } else if (g >= 35 && g <= 55) {
        aha.innerHTML = `<strong>⚖️ 命中罗尔斯差异原则最优带（差距=${g}）！</strong>此时最弱势群体收入达到全局峰值附近（<strong>${cur.poor.toFixed(1)} 万</strong>）。精英拿得更多，但他们的创新红利通过税收与就业让底层处境达到历史最佳。`;
      } else if (g <= 80) {
        aha.innerHTML = `<strong>⚠️ 功利主义 vs 罗尔斯的决裂点（差距=${g}）：</strong>社会总蛋糕继续冲高到 <strong>${cur.total.toFixed(1)} 万</strong>，但底层绝对收入已跌至 <strong>${cur.poor.toFixed(1)} 万</strong>。功利主义会为总量欢呼，而罗尔斯会果断喊停！`;
      } else {
        aha.innerHTML = `<strong>🔥 极端马太效应（差距=${g}）：</strong>过度垄断与社会摩擦连总蛋糕都开始拖垮，底层收入跌至 <strong>${cur.poor.toFixed(1)} 万</strong>，彻底丧失契约正当性。`;
      }
    }

    slider.addEventListener('input', () => { markDone('探索了罗尔斯差异原则曲线'); render(); });
    document.querySelectorAll('[data-g]').forEach(b => {
      b.addEventListener('click', () => {
        slider.value = b.dataset.g;
        markDone('切换了差异原则典型制度对比');
        render();
      });
    });

    render();
  </script>
</body>
</html>
