<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天赋彩票与起跑线重置实验</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 720px) { .mode-grid { grid-template-columns: 1fr; } }
    .stadium { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 14px; }
    .st-title { font-weight: 800; font-size: 14.5px; color: var(--tax-ink); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .runner-row { margin-bottom: 12px; }
    .r-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--tax-muted); margin-bottom: 4px; }
    .lane-track { height: 22px; background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 99px; position: relative; overflow: hidden; }
    .lane-fill { height: 100%; border-radius: 99px; transition: width .3s linear; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 12px; font-weight: 700; color: #fff; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🎟️ 天赋彩票与起跑线重置实验</h1>
      <p>三位努力程度<strong>完全相同</strong>的年轻人（同样勤奋、同样坚持），唯一的区别是「出生家庭彩票」。按下开跑，对比“放任起跑线”与“公共教育医疗重置起跑线”两条赛道的终点差距！</p>
    </header>

    <div class="toy-controls">
      <div class="toy-btn-row">
        <button class="toy-btn primary" id="startBtn">🏁 鸣枪开跑（30 年人生赛程）</button>
        <button class="toy-btn" id="resetBtn">回到起点</button>
      </div>
      <span style="font-size:13px;color:var(--tax-muted);">赛程进度：<strong id="yrVal" style="color:var(--tax-ink);">0 / 30 年</strong></span>
    </div>

    <div class="mode-grid">
      <div class="stadium">
        <div class="st-title"><span>🚧 赛道 A：放任原生起跑线</span><span style="font-size:12px;color:var(--tax-red);">无公共兜底</span></div>
        <div id="trackA"></div>
      </div>
      <div class="stadium">
        <div class="st-title"><span>🌱 赛道 B：公共投入重置起跑线</span><span style="font-size:12px;color:var(--tax-green);">优质公办+助学+医保</span></div>
        <div id="trackB"></div>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 罗尔斯“自然彩票”洞察：</strong>我们常以为成功全靠个人努力，但你的家庭背景、基因健康甚至出生年代，本质上都是一场你未曾付出努力就抽中的彩票。点击开跑看看制度如何缩小运气霸权！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const runners = [
      { name: '👑 精英家庭（含金钥匙）', color: '#f59e0b', startA: 34, speedA: 2.15, startB: 26, speedB: 2.10 },
      { name: '🏠 普通中产（稳步成长）', color: '#3b82f6', startA: 18, speedA: 1.95, startB: 22, speedB: 2.05 },
      { name: '🎒 偏远低收入（同样勤奋）', color: '#10b981', startA: 4, speedA: 1.55, startB: 18, speedB: 2.02 }
    ];

    let year = 0;
    let timer = null;
    let interacted = false;

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function renderTrack(containerId, mode) {
      const el = document.getElementById(containerId);
      el.innerHTML = runners.map(r => {
        const start = mode === 'A' ? r.startA : r.startB;
        const spd = mode === 'A' ? r.speedA : r.speedB;
        const pos = Math.min(100, start + year * spd);
        return `
          <div class="runner-row">
            <div class="r-meta"><span>${r.name}</span><strong>${pos.toFixed(0)} 分</strong></div>
            <div class="lane-track">
              <div class="lane-fill" style="width:${pos.toFixed(1)}%;background:${r.color};">${pos >= 16 ? Math.round(pos) : ''}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {
      document.getElementById('yrVal').textContent = `${year} / 30 年`;
      renderTrack('trackA', 'A');
      renderTrack('trackB', 'B');

      const aha = document.getElementById('ahaBox');
      if (year === 0) {
        aha.innerHTML = `<strong>💡 起跑前对比：</strong>在赛道 A 中，三位同等勤奋的选手起跑线就差了 <strong>30 分</strong>；而在赛道 B 中，免费优质基础教育与儿童医疗将起跑线差距压缩到 <strong>8 分</strong>。点击开跑！`;
      } else if (year < 30) {
        aha.innerHTML = `<strong>🏃 第 ${year} 年赛程中：</strong>注意看赛道 A 里，起跑落后的人因为缺乏抗风险医疗和资源杠杆，连奔跑速度都被拖慢，差距越拉越大。`;
      } else {
        const gapA = Math.round(Math.min(100, runners[0].startA + 30 * runners[0].speedA) - Math.min(100, runners[2].startA + 30 * runners[2].speedA));
        const gapB = Math.round(Math.min(100, runners[0].startB + 30 * runners[0].speedB) - Math.min(100, runners[2].startB + 30 * runners[2].speedB));
        aha.innerHTML = `<strong>🏁 30 年终点揭晓！</strong>同样付出 100% 努力，赛道 A 最终拉开了 <strong>${gapA} 分</strong>的阶层鸿沟；而赛道 B 通过公共教育与医疗重置起跑线，将结果差距压缩至 <strong>${gapB} 分</strong>——公平的真谛不是拖慢跑得快的人，而是不让出身决定终点。`;
      }
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      markDone('运行了天赋彩票与起跑线重置竞赛');
      if (year >= 30) year = 0;
      if (timer) clearInterval(timer);
      timer = setInterval(() => {
        year += 2;
        if (year >= 30) {
          year = 30;
          clearInterval(timer);
          timer = null;
        }
        render();
      }, 150);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (timer) { clearInterval(timer); timer = null; }
      year = 0;
      markDone('重置了起跑线竞赛');
      render();
    });

    render();
  </script>
</body>
</html>
