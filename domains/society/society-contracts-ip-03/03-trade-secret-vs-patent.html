<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商业秘密 vs 申请专利：可口可乐配方怎么选？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .case-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 16px; }
    .inv-card { background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 10px; padding: 14px; margin: 10px 0 14px; }
    .inv-title { font-weight: 800; font-size: 16px; color: var(--tax-ink); margin-bottom: 6px; }
    .tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .pill { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); color: var(--tax-muted); font-weight: 700; }
    .choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ch-btn { padding: 12px; border-radius: 10px; border: 2px solid var(--tax-border); background: var(--tax-surface); cursor: pointer; font-weight: 800; color: var(--tax-ink); font-size: 14px; }
    .ch-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .ch-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); color: var(--tax-red); }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🔐 商业秘密 vs 申请专利：可口可乐配方怎么选？</h1>
      <p>申请专利必须<strong>向全世界公开技术细节</strong>，换取 20 年法定垄断（到期人人可免费抄）；商业秘密则<strong>只要不泄密就能永久独占</strong>，但防不住别人自己研发或拆解逆向！作为首席知识产权官，为以下 4 项重磅发明做出战略抉择。</p>
    </header>

    <div class="toy-controls">
      <div class="toy-btn-row" id="tabsRow"></div>
      <span style="font-size:13px;color:var(--tax-muted);">已完成决策：<strong id="progVal" style="color:var(--tax-ink);">0 / 4</strong></span>
    </div>

    <div class="case-box">
      <div class="inv-card">
        <div class="inv-title" id="iTitle"></div>
        <div class="tag-row" id="iTags"></div>
        <p id="iDesc" style="margin:6px 0 0;font-size:13.5px;color:var(--tax-muted);line-height:1.55;"></p>
      </div>

      <div class="choice-row">
        <button class="ch-btn" data-c="patent">📜 申请发明专利<br><span style="font-size:11px;font-weight:400;color:var(--tax-muted);">公开细节，换 20 年强力排他保护</span></button>
        <button class="ch-btn" data-c="secret">🔒 死守商业秘密<br><span style="font-size:11px;font-weight:400;color:var(--tax-muted);">绝不公开，只要不泄密永久独享</span></button>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 战略权衡尺子：</strong>核心只看一个问题——<strong>“产品卖出去后，对手拆开能不能轻松看懂原理？”</strong>能轻松逆向的一定要申专利，藏在黑盒里拆不出来的才配守商业秘密！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const inventions = [
      {
        tab: '可乐配方',
        title: '发明 1：百年风味糖浆秘方（可口可乐 7X 配方）',
        tags: ['逆向工程难度：极高（微量香料工艺难还原）', '技术寿命：100 年+', '对手独立撞车概率：极低'],
        desc: '哪怕对手拿质谱仪化验成品饮料，也很难精准还原几十种天然提取物的配比与发酵顺序，且该口味预计畅销上百年。',
        ans: 'secret',
        explain: '必选「商业秘密」！如果 1886 年申请专利，1906 年专利一到期全世界就能照着公开配方合法量产“原味可口可乐”！靠商业秘密，它已经独家守护了 130 多年。'
      },
      {
        tab: '折叠屏铰链',
        title: '发明 2：零折痕水滴型折叠屏机械铰链',
        tags: ['逆向工程难度：极低（买台手机拆开就看见）', '技术寿命：5~10 年', '市场刚需度：极高'],
        desc: '手机一上市，竞争对手当天就能买一台拆机，用游标卡尺和 3D 扫描 48 小时内把整个机械结构看得一清二楚！',
        ans: 'patent',
        explain: '必选「申请发明专利」！物理结构类产品藏不住，商业秘密挡不住合法的拆机逆向工程——唯有提前用专利布局卡死结构要点，对手敢抄就能直接发禁令告倒他！'
      },
      {
        tab: '云端排序算法',
        title: '发明 3：运行在自家服务器黑盒里的推荐排序参数',
        tags: ['逆向工程难度：极高（代码永不下发给用户）', '技术寿命：持续迭代', '侵权取证难度：极高'],
        desc: '算法只运行在公司自有云端机房里，外部只能看到推荐结果。就算你申请了专利把原理公之于众，对手在自己机房里偷偷照抄你也很难取证证明！',
        ans: 'secret',
        explain: '必选「商业秘密」！对于纯云端黑盒工艺（如谷歌搜索排序权重、高频交易策略、AI 训练配方），申请专利等于“白白把秘籍教给对手，还抓不到对方侵权证据”！'
      },
      {
        tab: '创新抗癌药',
        title: '发明 4：全新小分子靶向抗癌药物分子式',
        tags: ['逆向工程难度：极低（化验药片即可知分子结构）', '研发投入：10 年 10 亿美元', '审批要求：上市必须公开成分'],
        desc: '药品上市审批依法必须公开化学结构式，且仿制药企几天内就能用化学分析合成出完全一样的分子。',
        ans: 'patent',
        explain: '必选「申请发明专利」！化学药片一卖出去分子式就彻底透明，没有任何商业秘密可言——20 年专利独占期是创新药企收回十亿美元临床研发成本的唯一生命线！'
      }
    ];

    let cur = 0;
    const answers = {};
    let interacted = false;

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const tabs = document.getElementById('tabsRow');
      tabs.innerHTML = '';
      inventions.forEach((inv, i) => {
        const b = document.createElement('button');
        b.className = 'toy-btn' + (i === cur ? ' primary' : '');
        const mark = answers[i] ? (answers[i] === inv.ans ? '✅ ' : '❌ ') : '';
        b.textContent = mark + inv.tab;
        b.addEventListener('click', () => { cur = i; render(); });
        tabs.appendChild(b);
      });

      const inv = inventions[cur];
      document.getElementById('iTitle').textContent = inv.title;
      document.getElementById('iTags').innerHTML = inv.tags.map(t => `<span class="pill">${t}</span>`).join('');
      document.getElementById('iDesc').textContent = inv.desc;

      const picked = answers[cur];
      document.querySelectorAll('.ch-btn').forEach(btn => {
        btn.classList.remove('ok', 'bad');
        if (picked) {
          if (btn.dataset.c === inv.ans) btn.classList.add('ok');
          else if (btn.dataset.c === picked) btn.classList.add('bad');
        }
      });

      document.getElementById('progVal').textContent = `${Object.keys(answers).length} / ${inventions.length}`;
      const aha = document.getElementById('ahaBox');
      if (!picked) {
        aha.innerHTML = `<strong>💡 战略提示：</strong>看看【${inv.tab}】的逆向工程难度和侵权取证难度，再决定是“公开换 20 年独占”还是“死守商业秘密”！`;
      } else {
        const ok = picked === inv.ans;
        aha.innerHTML = `<strong>${ok ? '🏆 首席知产官决策满分！' : '⚠️ 踩中了知产战略暗礁：'}</strong>${inv.explain}`;
      }
    }

    document.querySelectorAll('.ch-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        answers[cur] = btn.dataset.c;
        markDone('完成了商业秘密与专利路径战略决策');
        render();
      });
    });

    render();
  </script>
</body>
</html>
