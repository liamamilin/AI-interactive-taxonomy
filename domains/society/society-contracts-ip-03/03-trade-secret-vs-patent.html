<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 商业秘密 vs 申请专利：可口可乐配方怎么选？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔐 商业秘密 vs 申请专利：可口可乐配方怎么选？</h1><p>误区：凡是发明出了厉害配方或算法，第一件事都应该去申请专利保护起来。真相：申请专利必须把核心细节公开给全世界；如果别人根本逆向破解不了（比如可口可乐配方），锁成商业秘密可以保护一百年！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>对手逆向工程破解所需年数</span><span id="vRev">12 年</span></label><input type="range" id="sRev" min="1" max="30" value="12" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>员工跳槽泄密风险</span><span id="vLeak">25%</span></label><input type="range" id="sLeak" min="5" max="80" value="25" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">申请专利预期护城河</div><div class="k-val" id="kPat" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">商业秘密预期护城河</div><div class="k-val" id="kSec" style="color:#8b5cf6;">—</div></div>
        <div class="kpi"><div class="k-lbl">最佳策略</div><div class="k-val" id="kBest">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const rev=+document.getElementById('sRev').value, leak=+document.getElementById('sLeak').value/100;
  document.getElementById('vRev').textContent=rev+' 年'; document.getElementById('vLeak').textContent=(leak*100).toFixed(0)+'%';
  const patVal=20*0.85;
  const secVal=Math.round(rev*(1-leak*0.65)*1.4);
  const best=secVal>patVal?'锁成商业秘密 (不公开)':'申请发明专利 (20年独占)';
  document.getElementById('kPat').textContent=patVal.toFixed(1)+' 年效价';
  document.getElementById('kSec').textContent=secVal+' 年效价';
  document.getElementById('kBest').textContent=best;
  document.getElementById('svg').innerHTML=`
    <text x="20" y="34" font-size="13" font-weight="800" fill="#0284c7">发明专利 (公开细节换 20 年保护): ${patVal.toFixed(1)}</text>
    <rect x="20" y="44" width="${patVal*14}" height="24" rx="6" fill="#0284c7"/>
    <text x="20" y="102" font-size="13" font-weight="800" fill="#8b5cf6">商业秘密 (永不公开 · 靠难破解维持): ${secVal}</text>
    <rect x="20" y="112" width="${Math.min(540,secVal*14)}" height="24" rx="6" fill="#8b5cf6"/>
    <text x="20" y="166" font-size="13" font-weight="800" fill="#10b981">最优策略: ${best}</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>一拆开就能看懂的机械结构，不申专利马上被抄，必须申专利；而像可口可乐配方或芯片工艺参数那样极难逆向（${rev} 年）的秘密，守口如瓶比 20 年专利更值钱！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
