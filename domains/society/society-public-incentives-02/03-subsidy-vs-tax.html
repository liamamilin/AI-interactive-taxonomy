<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>正外部性补贴：为什么疫苗和基础科研要补贴？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .case-box { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .opt-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    @media (max-width: 600px) { .opt-row { grid-template-columns: 1fr; } }
    .opt-btn {
      padding: 10px; border-radius: 9px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .opt-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .opt-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); color: var(--tax-red); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>💉 正外部性补贴：经济部长政策处方台（情景）</h1>
      <p>市场失灵不仅发生在“污染太多（负外部性）”，还发生在<strong>“好事太少（正外部性）”</strong>——因为个人只算自己得到的好处，不算惠及全社会的溢出收益！为下面 3 项经济活动开出精准政策处方：</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--tax-muted);">
        <span id="idxTag">政策案卷 1 / 3</span>
        <span id="scoreTag" style="color:var(--tax-primary);font-weight:700;">精准开方：0 / 3</span>
      </div>

      <div class="case-box">
        <div style="font-size:16px;font-weight:800;" id="caseTitle"></div>
        <div style="font-size:12.5px;color:var(--tax-muted);margin-top:6px;" id="caseDesc"></div>
        <div class="opt-row" id="optRow"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="fbLine" style="font-size:13px;color:var(--tax-muted);">选择最能纠正市场失灵的工具</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一份案卷 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>外部性对称法则：</strong>负外部性导致<strong>过度生产</strong> → 用庇古税拉高成本；正外部性导致<strong>供给严重不足</strong> → 用庇古补贴降低门槛，把社会总红利补回个人账本！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const TOOLS = ['💰 庇古补贴（扩大供给）', '💸 庇古税（抑制过度）', '🆓 市场自由竞争（无需干预）'];
    const CASES = [
      {
        title: '💉 案卷 1：传染病疫苗接种',
        desc: '打一针不仅保护你自己，还切断了传染链保护了周围 20 位邻居（群体免疫）——但个人掏钱时只考虑自身风险。',
        ans: 0,
        fb: '必须用庇古补贴（甚至免费接种）！疫苗具有极强正外部性，纯靠自费会导致接种率远低于群体免疫门槛！'
      },
      {
        title: '🔬 案卷 2：前沿基础数学与物理研究',
        desc: '发现麦克斯韦方程组或量子力学能催生万亿产业，但发现者本人几乎无法垄断变现。',
        ans: 0,
        fb: '必须由国家基金大力补贴基础科研！纯商业企业只会投 3 年内能收回专利费的应用研发，基础科学的巨大正外部性必须靠公共资金托底！'
      },
      {
        title: '🚗 案卷 3：早高峰市中心单人开燃油车',
        desc: '多开进 1 辆车，不仅排放尾气，还会让整条主干道后面 500 辆车每人多堵 2 分钟。',
        ans: 1,
        fb: '应该征收庇古拥堵费 / 燃油税！个人只算自己的油费，不算让全城多堵的外部时间损失（如伦敦/新加坡拥堵费立竿见影）。'
      }
    ];

    let idx = 0, score = 0, locked = false, done = false;
    const optRow = document.getElementById('optRow');
    const fbLine = document.getElementById('fbLine');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const c = CASES[idx];
      locked = false;
      nextBtn.style.display = 'none';
      document.getElementById('idxTag').textContent = `政策案卷 ${idx + 1} / ${CASES.length}`;
      document.getElementById('caseTitle').textContent = c.title;
      document.getElementById('caseDesc').textContent = c.desc;
      fbLine.textContent = '为该外部性开出精准政策工具';
      optRow.innerHTML = '';

      TOOLS.forEach((t, i) => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = t;
        b.onclick = () => {
          if (locked) return;
          locked = true;
          const ok = i === c.ans;
          b.classList.add(ok ? 'ok' : 'bad');
          if (ok) score++;
          document.getElementById('scoreTag').textContent = `精准开方：${score} / ${CASES.length}`;
          fbLine.textContent = ok ? '✓ 处方精准！' : '⚠️ 政策工具错配，看下方经济学解析';
          ahaBox.innerHTML = `<strong>${ok ? '✓ 精准纠偏' : '📘 外部性解析'}：</strong>${c.fb}`;
          if (idx === CASES.length - 1) {
            markDone(`完成正负外部性政策处方情景（${score}/3）`);
            nextBtn.textContent = '↺ 重新审理';
          } else {
            nextBtn.textContent = '下一份案卷 →';
          }
          nextBtn.style.display = 'inline-block';
        };
        optRow.appendChild(b);
      });
    }

    nextBtn.onclick = () => {
      if (idx === CASES.length - 1) { idx = 0; score = 0; document.getElementById('scoreTag').textContent = '精准开方：0 / 3'; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
