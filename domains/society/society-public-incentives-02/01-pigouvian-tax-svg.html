<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 庇古税校准：消除负外部性无谓损失（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📉 庇古税校准：消除负外部性无谓损失（SVG）</h1><p>误区：收环保税只是政府为了多收钱，一定会降低整体经济效率。真相：当存在负外部性时，自由市场会过度生产；恰当的庇古税反而能消除社会无谓损失！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>单位污染社会危害 E</span><span id="vE">30 元</span></label><input type="range" id="sE" min="10" max="60" value="30" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>政府征收庇古税 t</span><span id="vT">15 元</span></label><input type="range" id="sT" min="0" max="60" value="15" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 190"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">实际产量 Q</div><div class="k-val" id="kQ">—</div></div>
        <div class="kpi"><div class="k-lbl">社会最优产量 Q*</div><div class="k-val" id="kOpt" style="color:#10b981;">—</div></div>
        <div class="kpi"><div class="k-lbl">社会无谓损失 DWL</div><div class="k-val" id="kDwl" style="color:#ef4444;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const E=+document.getElementById('sE').value, t=+document.getElementById('sT').value;
  document.getElementById('vE').textContent=E+' 元'; document.getElementById('vT').textContent=t+' 元';
  const qAct=Math.max(10, Math.round((100-t)/2)), qOpt=Math.max(10, Math.round((100-E)/2));
  const dwl=Math.round(0.5*Math.abs(qAct-qOpt)*Math.abs(E-t));
  document.getElementById('kQ').textContent=qAct+' 吨';
  document.getElementById('kOpt').textContent=qOpt+' 吨';
  document.getElementById('kDwl').textContent=dwl+' 元';
  const xQ=q=>60+q*9, yP=p=>165-p*1.4;
  document.getElementById('svg').innerHTML=`
    <line x1="60" y1="165" x2="550" y2="165" stroke="#94a3b8"/>
    <line x1="60" y1="20" x2="60" y2="165" stroke="#94a3b8"/>
    <line x1="${xQ(5)}" y1="${yP(95)}" x2="${xQ(50)}" y2="${yP(50)}" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="${xQ(5)}" y1="${yP(5+E)}" x2="${xQ(50)}" y2="${yP(50+E)}" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="${xQ(5)}" y1="${yP(5+t)}" x2="${xQ(50)}" y2="${yP(50+t)}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 3"/>
    <polygon points="${xQ(qOpt)},${yP(100-qOpt)} ${xQ(qAct)},${yP(100-qAct)} ${xQ(qAct)},${yP(qAct+E)}" fill="#ef4444" opacity="0.28"/>
    <circle cx="${xQ(qOpt)}" cy="${yP(100-qOpt)}" r="5" fill="#10b981"/>
    <circle cx="${xQ(qAct)}" cy="${yP(100-qAct)}" r="5" fill="#0284c7"/>
    <text x="430" y="34" font-size="11.5" font-weight="750" fill="#ef4444">红线: 真实社会成本 MSC</text>
    <text x="430" y="52" font-size="11.5" font-weight="750" fill="#f59e0b">虚线: 含税私人成本 MPC+t</text>`;
  document.getElementById('ahaBox').innerHTML=Math.abs(t-E)<=2
    ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>当庇古税 <code>t ≈ E</code>（${t} 元）时，外部伤害完美内化进企业账本，社会无谓损失归零！`
    : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>当前税率 ${t} 元与真实污染危害 ${E} 元存在缺口，产生了 <strong>${dwl} 元</strong> 的红色无谓损失三角——把滑块拉到 t = ${E} 试试！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
