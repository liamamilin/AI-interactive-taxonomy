<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 谣言传播 R0 与黄金辟谣窗口期</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔥 谣言传播 R0 与黄金辟谣窗口期</h1><p>误区：只要最终把真相发出来辟谣，什么时候发效果都差不多。真相：谣言传播呈指数级 SIR 爆发，在引爆点前介入能瞬间掐灭；过了拐点才发通告，辟谣声量会被淹没在指数洪流里！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>谣言传染再生数 R0</span><span id="vR0">2.6</span></label><input type="range" id="sR0" min="11" max="40" value="26" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>强力辟谣介入时刻</span><span id="vT">第 5 小时</span></label><input type="range" id="sT" min="1" max="11" value="5" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">累计误信谣言峰值</div><div class="k-val" id="kPeak" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">辟谣控制效果</div><div class="k-val" id="kEff">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const r0=+document.getElementById('sR0').value/10, tDeb=+document.getElementById('sT').value;
  document.getElementById('vR0').textContent=r0.toFixed(1); document.getElementById('vT').textContent='第 '+tDeb+' 小时';
  let inf=2, peak=2, pts='40,158 ';
  for(let t=1;t<=12;t++){
    const effR=t>=tDeb?r0*0.32:r0;
    inf=Math.min(100, Math.max(0.5, inf*(0.55+effR*0.32)));
    if(inf>peak) peak=inf;
    pts+=`${40+t*43},${158-inf*1.3} `;
  }
  document.getElementById('kPeak').textContent=Math.round(peak)+'% 网民';
  document.getElementById('kEff').textContent=peak<30?'黄金窗口期掐灭':(peak<65?'半程压制':'错失窗口 (全网刷屏)');
  document.getElementById('kEff').style.color=peak<30?'#10b981':(peak<65?'#f59e0b':'#ef4444');
  const dx=40+tDeb*43;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="158" x2="560" y2="158" stroke="#94a3b8"/>
    <line x1="${dx}" y1="20" x2="${dx}" y2="158" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="${dx+5}" y="32" font-size="11.5" font-weight="800" fill="#0284c7">辟谣介入 (${tDeb}h)</text>
    <polyline fill="none" stroke="#ef4444" stroke-width="3" points="${pts}"/>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>当 R0=${r0.toFixed(1)} 时，把辟谣从第 8 小时提前到第 3 小时，谣言峰值能从全网刷屏直降到 <strong>${Math.round(peak)}%</strong>——快半步胜过千言万语！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
