<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>紧致度 vs 比例代表性权衡仪</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .opt-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    @media (max-width: 640px) { .opt-grid { grid-template-columns: 1fr; } }
    .r-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .r-btn.active { border-color: var(--tax-primary); background: var(--tax-primary-soft); }
    .eval-box { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); font-size: 13.5px; line-height: 1.65; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🧭 紧致度 vs 比例代表性：如何彻底根除杰利蝾螈？（制度情景）</h1>
      <p>既然政党画线一定会作弊，那规定“所有选区必须画成方方正正的圆润方块（高紧致度）”就能彻底解决吗？对比下面 <strong>3 套制度改革方案</strong>，揭开意想不到的“天然地理打包”真相！</p>
    </header>

    <section class="toy-card">
      <div class="opt-grid" id="optGrid"></div>
      <div class="eval-box" id="evalBox"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>制度设计洞察：</strong>只要还保留“单席位小选区赢者通吃”，哪怕完全交给无私的几何算法画最规整的方块，依然逃不掉“地理自发打包”陷阱！点开第 3 个方案看治本良药！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const REMEDIES = [
      {
        id: 'compact', name: '📐 方案 1：纯几何“最紧凑方块”算法',
        sub: '只按周长面积比画最工整的方格，禁止奇形怪状的蝾螈线',
        detail: '⚠️ <strong>意外翻车（天然地理杰利蝾螈）！</strong>现实中进步派选民高度聚居在市中心公寓，保守派均匀分布在郊区。画最方正的格子，反而会自动把市中心选民打包成 90%:10% 的超高溢出区，导致即便没人作弊，席位依然严重偏向郊区政党！',
        aha: '<strong>几何规整 ≠ 政治公平：</strong>形状好看的选区只防止了“肉眼可见的丑陋作弊”，却无法解决人口地理聚居带来的天然选票浪费！'
      },
      {
        id: 'comm', name: '⚖️ 方案 2：独立无党派公民委员会',
        sub: '由两党+无党派普通公民抽签组成独立委员会，禁用政党数据划区',
        detail: '✅ <strong>显著改善（加州/密歇根州实证有效）：</strong>把画笔从在任政客手里夺走，极大压低了恶意效率差距，竞争性选区数量翻倍；但仍需反复在“社区完整性”与“党派平衡”间做微妙博弈。',
        aha: '<strong>程序分权止损：</strong>绝不能让“运动员兼任裁判”，把划区权交回独立公民委员会是单选区制度下最务实的改良！'
      },
      {
        id: 'pr', name: '🌐 方案 3：多席位比例代表制（PR / STV）',
        sub: '把 5 个小选区合并成 1 个产生 5 名代表的大选区，按得票比例分席位',
        detail: '🏆 <strong>终极降维打击（彻底消灭划区作弊！）：</strong>只要全区拿 60% 票就分 3 席、拿 40% 票就分 2 席——画线者无论怎么切分边界都改变不了总席位，“杰利蝾螈”从数学根源上直接绝迹！',
        aha: '<strong>从“修补漏洞”到“换掉游戏引擎”：</strong>北欧、德国与新西兰采用比例代表制后，彻底终结了绵延 200 年的选区划界恶斗！'
      }
    ];

    let cur = REMEDIES[0], done = false;
    const optGrid = document.getElementById('optGrid');
    const evalBox = document.getElementById('evalBox');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      optGrid.innerHTML = '';
      REMEDIES.forEach(r => {
        const b = document.createElement('button');
        b.className = 'r-btn' + (r.id === cur.id ? ' active' : '');
        b.innerHTML = `<div style="font-weight:800;font-size:13.5px;">${r.name}</div><div style="font-size:11.5px;color:var(--tax-muted);margin-top:4px;">${r.sub}</div>`;
        b.onclick = () => { cur = r; markDone(`评估了反杰利蝾螈改革方案：${r.name}`); render(); };
        optGrid.appendChild(b);
      });
      evalBox.innerHTML = cur.detail;
      ahaBox.innerHTML = cur.aha;
    }

    render();
  </script>
</body>
</html>
