<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>眼镜蛇赏金实验：12 期反噬演化</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .s-card { padding: 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); text-align: center; }
    .s-val { font-size: 20px; font-weight: 800; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🐍 眼镜蛇赏金实验：12 期反噬演化模拟器</h1>
      <p>殖民时期德里政府为了消灭毒蛇，宣布<strong>“每上交一条死眼镜蛇就重奖现金”</strong>。点击播放 12 个月的政策演化，看聪明市民如何把环保赏金玩成“家庭养蛇产业链”，并在赏金取消瞬间引爆 3 倍蛇灾！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="playBtn">▶ 播放 12 个月政策反噬演化</button>
        <button class="toy-btn secondary" id="jumpBtn">⏩ 直接看第 12 月灾难结局</button>
        <button class="toy-btn secondary" id="resetBtn">↺ 重置回第 1 月</button>
      </div>

      <svg id="cobraSvg" viewBox="0 0 680 215" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="眼镜蛇效应12个月数量演化图"></svg>

      <div class="stats">
        <div class="s-card"><div style="font-size:11.5px;color:var(--tax-muted);">当前政策阶段</div><div class="s-val" id="phaseVal" style="font-size:15px;">第 1 月 · 颁布赏金</div></div>
        <div class="s-card"><div style="font-size:11.5px;color:var(--tax-muted);">🐍 野外真实毒蛇数</div><div class="s-val" id="wildVal" style="color:var(--tax-green);">100 条</div></div>
        <div class="s-card"><div style="font-size:11.5px;color:var(--tax-muted);">🏠 市民私养肉蛇数</div><div class="s-val" id="farmVal" style="color:var(--tax-amber);">0 条</div></div>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>眼镜蛇效应（Perverse Incentive）：</strong>当一项激励政策只考核表面产出（“死蛇数量”）而忽视系统反馈时，理性人会直接<strong>制造问题再去领奖</strong>！点击播放看 12 个月惊人反转！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    // Month 1..12: M1-3 wild drops (100->55), M4-7 locals start breeding (farm surges 0->220), M8 govt cancels bounty -> breeders release all snakes -> wild spikes to 260!
    const WILD = [100, 80, 62, 55, 52, 50, 50, 195, 255, 270, 280, 285];
    const FARM = [0, 0, 12, 48, 105, 168, 220, 60, 0, 0, 0, 0];

    let m = 0, playing = false, timer = null, done = false;
    const svg = document.getElementById('cobraSvg');
    const playBtn = document.getElementById('playBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function draw() {
      const w = WILD[m], f = FARM[m];
      const phase = m < 3 ? `第 ${m + 1} 月 · 赏金初见成效` : (m < 7 ? `第 ${m + 1} 月 · 地下养蛇场暴利爆发！` : `第 ${m + 1} 月 · 取消赏金，全城放蛇！`);
      document.getElementById('phaseVal').textContent = phase;
      document.getElementById('wildVal').textContent = `${w} 条`;
      document.getElementById('wildVal').style.color = w > 120 ? 'var(--tax-red)' : 'var(--tax-green)';
      document.getElementById('farmVal').textContent = `${f} 条`;

      const xOf = i => 52 + (i / 11) * 588;
      const yOf = v => 182 - (v / 310) * 142;

      let wPts = [], fPts = [];
      for (let i = 0; i <= m; i++) {
        wPts.push(`${xOf(i).toFixed(1)},${yOf(WILD[i]).toFixed(1)}`);
        fPts.push(`${xOf(i).toFixed(1)},${yOf(FARM[i]).toFixed(1)}`);
      }

      let html = '';
      // Baseline 100
      html += `<line x1="52" y1="${yOf(100)}" x2="640" y2="${yOf(100)}" stroke="var(--tax-border)" stroke-dasharray="4 4"/>`;
      html += `<text x="46" y="${yOf(100) + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="10.5">100</text>`;
      html += `<text x="46" y="${yOf(285) + 4}" text-anchor="end" fill="var(--tax-red)" font-size="10.5">285</text>`;

      // Cancel event marker at M8 (idx 7)
      html += `<line x1="${xOf(7)}" y1="28" x2="${xOf(7)}" y2="182" stroke="var(--tax-red)" stroke-dasharray="4 3" opacity="0.6"/>`;
      html += `<text x="${xOf(7)}" y="22" text-anchor="middle" fill="var(--tax-red)" font-size="11" font-weight="800">🚨 第 8 月：政府发觉被薅羊毛，取消赏金！</text>`;

      for (let i = 0; i < 12; i++) {
        html += `<text x="${xOf(i)}" y="200" text-anchor="middle" fill="var(--tax-muted)" font-size="10.5">M${i + 1}</text>`;
      }

      if (wPts.length > 1) {
        html += `<polyline points="${wPts.join(' ')}" fill="none" stroke="var(--tax-red)" stroke-width="3.5"/>`;
        html += `<polyline points="${fPts.join(' ')}" fill="none" stroke="var(--tax-amber)" stroke-width="3" stroke-dasharray="6 3"/>`;
      }
      html += `<circle cx="${xOf(m)}" cy="${yOf(w)}" r="6" fill="var(--tax-red)"/>`;
      html += `<circle cx="${xOf(m)}" cy="${yOf(f)}" r="5.5" fill="var(--tax-amber)"/>`;
      svg.innerHTML = html;

      if (m >= 8) {
        ahaBox.innerHTML = '<strong>反噬终局（野外毒蛇 100 → 285 条，暴增近 3 倍！）：</strong>赏金一取消，养殖户把一文不值的 220 条毒蛇全部扔回大街！花了大笔财政预算，结果把原本的问题恶化了 3 倍——这就是著名的<strong>眼镜蛇效应</strong>！';
      } else if (m >= 4) {
        ahaBox.innerHTML = `<strong>第 ${m + 1} 月（套利产业成形）：</strong>大家算清了账：野外抓蛇又险又累，不如在后院批量孵小蛇领赏金！上交的死蛇数节节攀升，官员还在庆功呢！`;
      }
    }

    function stop() { playing = false; clearInterval(timer); playBtn.textContent = '▶ 播放 12 个月政策反噬演化'; }

    playBtn.onclick = () => {
      markDone('播放了眼镜蛇效应12个月反噬演化');
      if (playing) { stop(); return; }
      if (m >= 11) m = 0;
      playing = true;
      playBtn.textContent = '⏸ 暂停';
      timer = setInterval(() => {
        m++;
        draw();
        if (m >= 11) stop();
      }, 360);
    };
    document.getElementById('jumpBtn').onclick = () => { stop(); m = 11; markDone('查看了眼镜蛇效应第12月结局'); draw(); };
    document.getElementById('resetBtn').onclick = () => { stop(); m = 0; draw(); };
    draw();
  </script>
</body>
</html>
