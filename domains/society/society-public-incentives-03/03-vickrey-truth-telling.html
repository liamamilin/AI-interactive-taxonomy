<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏷️ 维克里机制：为什么“报实价”才是唯一最优解？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏷️ 维克里机制：为什么“报实价”才是唯一最优解？</h1><p>误区：无论什么拍卖，买家想多赚钱就一定要故意把报价压得比心里价低。真相：在“最高价中标、只付第二高价”的维克里机制下，虚报任何价格都只能让你亏钱或错失宝贝！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>你心里真实估值 V</span><span id="vV">70 元</span></label><input type="range" id="sV" min="30" max="95" value="70" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>你提交的报价 B</span><span id="vB">55 元</span></label><input type="range" id="sB" min="10" max="100" value="55" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">真实估值期望净赚</div><div class="k-val" id="kTrue" style="color:#10b981;">—</div></div>
        <div class="kpi"><div class="k-lbl">当前报价期望净赚</div><div class="k-val" id="kCur">—</div></div>
        <div class="kpi"><div class="k-lbl">策略损益</div><div class="k-val" id="kDiff">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function expPay(V,B){
  let sum=0;
  for(let r=1;r<=100;r++){ if(B>=r) sum+=(V-r); }
  return sum/100;
}
function upd(){
  const V=+document.getElementById('sV').value, B=+document.getElementById('sB').value;
  document.getElementById('vV').textContent=V+' 元'; document.getElementById('vB').textContent=B+' 元';
  const eTrue=expPay(V,V), eCur=expPay(V,B), diff=eCur-eTrue;
  document.getElementById('kTrue').textContent=eTrue.toFixed(2)+' 元';
  document.getElementById('kCur').textContent=eCur.toFixed(2)+' 元';
  document.getElementById('kDiff').textContent=(diff>=0?'+':'')+diff.toFixed(2)+' 元';
  let pts='';
  for(let b=10;b<=100;b+=2){
    const x=40+(b-10)/90*520, y=155-Math.max(-2,expPay(V,b))/45*120;
    pts+=`${x.toFixed(1)},${y.toFixed(1)} `;
  }
  const tx=40+(V-10)/90*520, ty=155-eTrue/45*120;
  const cx=40+(B-10)/90*520, cy=155-Math.max(-2,eCur)/45*120;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="155" x2="560" y2="155" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pts}"/>
    <circle cx="${tx}" cy="${ty}" r="5.5" fill="#10b981"/>
    <text x="${tx}" y="${ty-10}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#10b981">诚实点 B=V=${V}</text>
    <circle cx="${cx}" cy="${cy}" r="6" fill="${Math.abs(B-V)<=1?'#10b981':'#ef4444'}"/>`;
  document.getElementById('ahaBox').innerHTML=Math.abs(B-V)<=1
    ? `💡 <strong>顿悟时刻（Aha! Moment）：</strong>刚好踩在曲线最高点！因为中标付的是别人出的价，你唯一决定的是“在哪些价位上愿意买”，把报价直接设成心里价 <strong>${V} 元</strong> 就永远不会买贵也不错过便宜！`
    : `💡 <strong>顿悟时刻（Aha! Moment）：</strong>无论往左压价还是往右抬价，期望净收益都低于“说真话”（损失 ${Math.abs(diff).toFixed(2)} 元）——这就是制度设计的皇冠：<strong>激励相容</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
