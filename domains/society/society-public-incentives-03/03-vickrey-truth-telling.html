<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>维克里机制：为什么“报实价”才是唯一最优解？</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ctrl-box { padding: 10px 12px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    .tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--tax-border); text-align: center; }
    .tbl th { color: var(--tax-muted); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🏷️ 维克里二价密封拍卖：为什么“老实报底价”绝对最赚？（盲测）</h1>
      <p>谷歌广告竞价与诺奖得主维克里设计的机制：<strong>出价最高者中标，但只需支付“第二高价（对手的出价）”</strong>！假设一件藏品对你真实值 <strong>¥100</strong>，拖动你的密封出价，测试所有可能的对手出价！</p>
    </header>

    <section class="toy-card">
      <div class="ctrl-box">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
          <span>✍️ 你的秘密出价（你心里真实估值 = ¥100）</span>
          <strong id="bidVal" style="color:var(--tax-primary);">¥100（如实报价）</strong>
        </div>
        <input type="range" id="bidRange" min="60" max="140" step="10" value="100" style="width:100%;" />
      </div>

      <table class="tbl">
        <thead>
          <tr><th>假设对手最高出价</th><th>结果（二价规则）</th><th>你的净赚收益（100 − 实付）</th><th>相比报实价 ¥100</th></tr>
        </thead>
        <tbody id="tblBody"></tbody>
      </table>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>激励相容巅峰（说真话即占优策略）：</strong>试着把出价往左拉（故意压价想捡漏）或往右拉（故意虚报想必赢）——你会发现无论对手出多少，<strong>报实价 ¥100 永远不吃亏，任何撒谎都只会让自己亏钱或错失好机会！</strong>
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const RIVALS = [70, 90, 110, 130];
    const bidRange = document.getElementById('bidRange');
    const bidVal = document.getElementById('bidVal');
    const tblBody = document.getElementById('tblBody');
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function payoff(bid, rival) {
      if (bid > rival) return 100 - rival; // Win and pay rival's bid!
      return 0;
    }

    function render() {
      const bid = Number(bidRange.value);
      bidVal.textContent = bid === 100 ? '¥100（✅ 如实报价）' : (bid < 100 ? `¥${bid}（🦊 故意压低想捡漏）` : `¥${bid}（🔥 虚高乱喊想强赢）`);
      bidVal.style.color = bid === 100 ? 'var(--tax-green)' : 'var(--tax-amber)';

      tblBody.innerHTML = RIVALS.map(r => {
        const win = bid > r;
        const p = payoff(bid, r);
        const truthP = payoff(100, r);
        const diff = p - truthP;
        const diffTxt = diff === 0 ? '打平' : (diff < 0 ? `<span style="color:var(--tax-red);font-weight:800;">亏了 ¥${Math.abs(diff)}！</span>` : `+¥${diff}`);
        const pCol = p > 0 ? 'var(--tax-green)' : (p < 0 ? 'var(--tax-red)' : 'var(--tax-muted)');
        return `<tr>
          <td><strong>¥${r}</strong></td>
          <td>${win ? `🏆 中标（只需付 ¥${r}）` : '落选（付 ¥0）'}</td>
          <td style="color:${pCol};font-weight:800;">${p >= 0 ? '+¥' + p : '−¥' + Math.abs(p)}</td>
          <td>${diffTxt}</td>
        </tr>`;
      }).join('');

      if (bid < 100) {
        ahaBox.innerHTML = `<strong>压价失算（出价 ¥${bid}）：</strong>在二价机制里，你付的是“对手的价”而不是自己的价，压价一分钱都省不了！反而当对手出 ¥90 时，你白白错过了原本能净赚 ¥10 的好交易！`;
      } else if (bid > 100) {
        ahaBox.innerHTML = `<strong>虚报中招（出价 ¥${bid} · 赢家诅咒）：</strong>当对手出 ¥110 时，你虚报 ¥${bid} 虽然抢赢了，却被迫掏 ¥110 买一件只值 ¥100 的东西，净亏 −¥10！`;
      } else {
        ahaBox.innerHTML = '<strong>完美占优策略（报实价 ¥100）：</strong>因为你的出价只决定“赢不赢”，不决定“付多少钱”，所以<strong>讲真话</strong>在所有可能世界里都拿到理论最高收益！这就是激励相容的数学魔法！';
      }
    }

    bidRange.oninput = () => { markDone('实测了维克里二价拍卖的报实价占优策略'); render(); };
    render();
  </script>
</body>
</html>
