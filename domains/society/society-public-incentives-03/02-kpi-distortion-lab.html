<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>激励相容失灵：代理指标与真实目标背离</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .case-box { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 600px) { .opt-grid { grid-template-columns: 1fr; } }
    .opt-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); cursor: pointer; font-size: 13px;
    }
    .opt-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .opt-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎯 古德哈特定律：糟糕 KPI 如何逼出神级钻空子？（情景）</h1>
      <p><strong>“当一项衡量指标变成考核目标，它就不再是一个好指标。”</strong>下面 3 家公司都设了看似合理的考核 KPI，请预测员工一定会发明什么“合规钻空子神操作”，并换上激励相容的新指标！</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--tax-muted);">
        <span id="idxTag">职场案例 1 / 3</span>
        <span id="scoreTag" style="color:var(--tax-primary);font-weight:700;">识破扭曲：0 / 3</span>
      </div>

      <div class="case-box">
        <div style="font-size:16px;font-weight:800;" id="cTitle"></div>
        <div style="font-size:12.5px;color:var(--tax-muted);margin-top:4px;" id="cKpi"></div>
        <div class="opt-grid" id="optGrid"></div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="fbLine" style="font-size:13px;color:var(--tax-muted);">选择最符合真实人性的“KPI 钻空子结果”</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一个职场案例 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>激励相容设计原则：</strong>永远用<strong>成对制衡指标</strong>（如“速度 + 复购/返修率”）代替单一代理指标，让员工“偷懒钻空子”的收益低于“把事真正做好”！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CASES = [
      {
        title: '💻 案例 1：科技公司按“每周提交代码行数”发奖金',
        kpi: '老板以为：写代码越多 = 产出越高！结果发生了什么？',
        options: [
          { text: '🔥 程序员疯狂把 1 行能写完的逻辑拆成 200 行废话，甚至故意不删死代码！', ok: true },
          { text: '😇 大家自发重构精简架构，把冗余代码删掉一半。', ok: false }
        ],
        fix: '修复方案：改看<strong>系统稳定性 + 需求交付价值 + 同行 Code Review 质量</strong>，删掉冗余烂代码反而该发双倍奖！'
      },
      {
        title: '🎧 案例 2：客服中心考核“单通电话平均时长必须 < 90 秒”',
        kpi: '主管以为：挂得越快 = 解决问题越高效！结果发生了什么？',
        options: [
          { text: '😇 客服练就神速排查技巧，90 秒内完美解决全部疑难杂症。', ok: false },
          { text: '🔥 遇到复杂投诉立刻故意挂断或反复转接，让客户重新排队打 5 通电话！', ok: true }
        ],
        fix: '修复方案：引入<strong>“首次通话解决率（FCR）+ 客户回访满意度”</strong>双指标制衡，挂断客户直接扣光绩效！'
      },
      {
        title: '🔨 案例 3：工厂按“铁钉总吨数”考核厂长产量',
        kpi: '计划部门以为：吨数越多 = 铁钉越充裕！结果发生了什么？',
        options: [
          { text: '🔥 工厂直接铸造出一根重达 10 吨、谁也用不了的巨型铁钉轻松达标！', ok: true },
          { text: '😇 工厂按市场需求精准生产各种尺寸的精密小钉子。', ok: false }
        ],
        fix: '修复方案：改按“市场实际销售回款”考核（真实价值反馈），没人买单的 10 吨巨钉一分钱不值！'
      }
    ];

    let idx = 0, score = 0, locked = false, done = false;
    const optGrid = document.getElementById('optGrid');
    const fbLine = document.getElementById('fbLine');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const c = CASES[idx];
      locked = false;
      nextBtn.style.display = 'none';
      document.getElementById('idxTag').textContent = `职场案例 ${idx + 1} / ${CASES.length}`;
      document.getElementById('cTitle').textContent = c.title;
      document.getElementById('cKpi').textContent = c.kpi;
      fbLine.textContent = '预测真实人性在单一指标下的反应';
      optGrid.innerHTML = '';

      c.options.forEach(o => {
        const b = document.createElement('button');
        b.className = 'opt-btn';
        b.textContent = o.text;
        b.onclick = () => {
          if (locked) return;
          locked = true;
          b.classList.add(o.ok ? 'ok' : 'bad');
          if (o.ok) score++;
          document.getElementById('scoreTag').textContent = `识破扭曲：${score} / ${CASES.length}`;
          fbLine.textContent = o.ok ? '✓ 洞穿人性与古德哈特定律！' : '⚠️ 现实远比理想骨感，看下方修正方案';
          ahaBox.innerHTML = `<strong>古德哈特定律警示：</strong>${c.fix}`;
          if (idx === CASES.length - 1) {
            markDone(`完成古德哈特定律KPI扭曲诊断（${score}/3）`);
            nextBtn.textContent = '↺ 重新体验';
          } else {
            nextBtn.textContent = '下一个职场案例 →';
          }
          nextBtn.style.display = 'inline-block';
        };
        optGrid.appendChild(b);
      });
    }

    nextBtn.onclick = () => {
      if (idx === CASES.length - 1) { idx = 0; score = 0; document.getElementById('scoreTag').textContent = '识破扭曲：0 / 3'; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
