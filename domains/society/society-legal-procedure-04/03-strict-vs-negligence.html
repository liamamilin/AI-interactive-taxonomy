<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚗 严格责任 vs 过失责任：社会总成本曲线</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🚗 严格责任 vs 过失责任：社会总成本曲线</h1><p>误区：只要企业做足了所有安全检查（无过失），出了事就不该让它赔钱。真相：对于高危行业，只有用严格责任，才能逼企业连“少开一点产能、别把厂建在闹市区”的危险活动总量也降下来！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>企业安全谨慎投入</span><span id="vCare">60 分</span></label><input type="range" id="sCare" min="10" max="100" value="60" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>高危行业固有危险系数</span><span id="vRisk">70%</span></label><input type="range" id="sRisk" min="20" max="100" value="70" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">预期事故损失</div><div class="k-val" id="kAcc" style="color:#ef4444;">—</div></div>
        <div class="kpi"><div class="k-lbl">社会总事故+防护成本</div><div class="k-val" id="kTot" style="color:#0284c7;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const care=+document.getElementById('sCare').value, risk=+document.getElementById('sRisk').value/100;
  document.getElementById('vCare').textContent=care+' 分'; document.getElementById('vRisk').textContent=(risk*100).toFixed(0)+'%';
  const acc=x=>Math.round(180*risk*Math.exp(-x/35));
  const tot=x=>x+acc(x);
  let pts='';
  for(let x=10;x<=100;x+=3){
    pts+=`${40+(x-10)/90*520},${160-Math.min(140,tot(x)*0.75)} `;
  }
  const cx=40+(care-10)/90*520, cy=160-Math.min(140,tot(care)*0.75);
  document.getElementById('kAcc').textContent=acc(care)+' 万';
  document.getElementById('kTot').textContent=tot(care)+' 万';
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#0284c7"/>
    <text x="50" y="32" font-size="12" font-weight="800" fill="#0284c7">U型社会总成本曲线 (防护投入 + 剩余事故损失)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>过失责任只管“操作够不够小心”，但高危行业就算小心翼翼仍有 ${acc(care)} 万残余风险！严格责任强迫企业把全部残余风险内化，从而自主把产能和选址调整到社会最安全水平！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
