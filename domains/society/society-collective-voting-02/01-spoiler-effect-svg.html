<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>剧透效应与分票陷阱</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🍌 剧透效应（Spoiler Effect）：小众候选人如何毁掉同阵营大哥？（盲测）</h1>
      <p>一座城市 55% 的选民支持建公园（绿营），45% 支持建停车场（红营）。原本绿营稳赢——点击下方按钮把一位<strong>同样主张建公园的激进环保新星 B</strong> 放进选票，看一场惊天大惨案如何发生！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="twoBtn">① 两强对决：温和公园派 A vs 停车场派 C</button>
        <button class="toy-btn secondary" id="threeBtn">🍌 ② 放入分票搅局者：极客公园派 B 参选！</button>
      </div>

      <svg id="voteSvg" viewBox="0 0 680 200" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="剧透效应分票惨案柱状图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>多数决的致命漏洞：</strong>现在 A 以 55% 轻松击败 C（45%）。点击「🍌 放入分票搅局者 B」，看看一个只拿 24% 的配角如何直接把冠军拱手让给 55% 人最讨厌的 C！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let hasSpoiler = false, done = false;
    const svg = document.getElementById('voteSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('twoBtn').className = !hasSpoiler ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('threeBtn').className = hasSpoiler ? 'toy-btn' : 'toy-btn secondary';

      const rows = hasSpoiler
        ? [
            { name: '🟢 温和公园派 A', pct: 31, col: 'var(--tax-green)', win: false },
            { name: '🍌 激进公园派 B（搅局）', pct: 24, col: 'var(--tax-amber)', win: false },
            { name: '🔴 停车场派 C', pct: 45, col: 'var(--tax-red)', win: true }
          ]
        : [
            { name: '🟢 温和公园派 A', pct: 55, col: 'var(--tax-green)', win: true },
            { name: '🔴 停车场派 C', pct: 45, col: 'var(--tax-red)', win: false }
          ];

      let html = '';
      html += `<text x="24" y="28" fill="var(--tax-ink)" font-size="13.5" font-weight="800">${hasSpoiler ? '💥 剧透分票惨案：绿营合计 55%，却被 45% 的红营渔翁得利！' : '✅ 正常两强对决：55% 公园民意顺利胜出！'}</text>`;

      rows.forEach((r, i) => {
        const y = 52 + i * 44;
        const w = (r.pct / 60) * 380;
        html += `<text x="180" y="${y + 18}" text-anchor="end" fill="var(--tax-ink)" font-size="12.5" font-weight="700">${r.name}</text>`;
        html += `<rect x="192" y="${y + 2}" width="380" height="24" rx="7" fill="rgba(148,163,184,0.14)"/>`;
        html += `<rect x="192" y="${y + 2}" width="${w.toFixed(1)}" height="24" rx="7" fill="${r.col}"/>`;
        html += `<text x="${(200 + w).toFixed(1)}" y="${y + 19}" fill="${r.col}" font-size="13" font-weight="900">${r.pct}% ${r.win ? '🏆 当选' : ''}</text>`;
      });

      svg.innerHTML = html;

      ahaBox.innerHTML = hasSpoiler
        ? '<strong>剧透效应爆发（Duverger 两党制铁律）：</strong>B 的加入丝毫没抢走 C 的票，却把原本 55% 的公园派撕成了 31% + 24%，让 55% 选民最反对的 C 仅凭 45% 相对多数当选！这就是“单票简单多数决”最终总会逼死第三党、固化为两极对立的数学根源！'
        : '<strong>基准局面（A 55% 胜 C 45%）：</strong>点击「🍌 放入分票搅局者 B」，亲眼看一名同阵营小众候选人如何引发灾难性分票！';
    }

    document.getElementById('twoBtn').onclick = () => { hasSpoiler = false; render(); };
    document.getElementById('threeBtn').onclick = () => { hasSpoiler = true; markDone('触发并验证了剧透效应分票惨案'); render(); };
    render();
  </script>
</body>
</html>
