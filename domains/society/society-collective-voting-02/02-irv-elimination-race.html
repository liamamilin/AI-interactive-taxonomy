<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>排序复选 (IRV) 选票转移流向图</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔁 排序复选制（IRV）：末位淘汰与选票转移竞速</h1>
      <p>同样是刚才“A 31% · B 24% · C 45%”的分票僵局，换成<strong>排序复选制（Instant-Runoff Voting，奥斯卡最佳影片与澳大利亚国会同款）</strong>：点击推进两轮计票，看 B 的选票如何自动流向第二志愿 A 完成大逆转！</p>
    </header>

    <section class="toy-card">
      <div class="btn-row">
        <button class="toy-btn" id="r1Btn">第 1 轮计票（无人过 50%）</button>
        <button class="toy-btn secondary" id="r2Btn">🔁 第 2 轮：淘汰末位 B，选票转移！</button>
      </div>

      <svg id="irvSvg" viewBox="0 0 680 205" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="排序复选制选票转移流向图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>第 1 轮僵局：</strong>C 拿到 45% 领先，但未突破 <strong>50% 绝对多数红线</strong>！点击「🔁 第 2 轮：淘汰末位 B」，看 B 的 24% 选民的“第二志愿”如何彻底改写结局！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let round = 1, done = false;
    const svg = document.getElementById('irvSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      document.getElementById('r1Btn').className = round === 1 ? 'toy-btn' : 'toy-btn secondary';
      document.getElementById('r2Btn').className = round === 2 ? 'toy-btn' : 'toy-btn secondary';

      const x0 = 175, maxW = 420;
      const x50 = x0 + (50 / 65) * maxW;

      let html = '';
      // 50% majority line
      html += `<line x1="${x50.toFixed(1)}" y1="26" x2="${x50.toFixed(1)}" y2="180" stroke="var(--tax-primary)" stroke-dasharray="5 4" stroke-width="2"/>`;
      html += `<text x="${x50.toFixed(1)}" y="20" text-anchor="middle" fill="var(--tax-primary)" font-size="11.5" font-weight="800">50% 过半当选线</text>`;

      const data = round === 1
        ? [
            { name: '🟢 温和公园派 A', base: 31, add: 0, col: 'var(--tax-green)', out: false },
            { name: '🟡 激进公园派 B', base: 24, add: 0, col: 'var(--tax-amber)', out: false },
            { name: '🔴 停车场派 C',   base: 45, add: 0, col: 'var(--tax-red)',   out: false }
          ]
        : [
            { name: '🟢 温和公园派 A', base: 31, add: 22, col: 'var(--tax-green)', out: false },
            { name: '🟡 激进公园派 B', base: 0,  add: 0,  col: 'var(--tax-muted)', out: true },
            { name: '🔴 停车场派 C',   base: 45, add: 2,  col: 'var(--tax-red)',   out: false }
          ];

      data.forEach((d, i) => {
        const y = 46 + i * 48;
        const wBase = (d.base / 65) * maxW;
        const wAdd  = (d.add / 65) * maxW;
        const total = d.base + d.add;
        html += `<text x="164" y="${y + 18}" text-anchor="end" fill="${d.out ? 'var(--tax-muted)' : 'var(--tax-ink)'}" font-size="12.5" font-weight="700" text-decoration="${d.out ? 'line-through' : 'none'}">${d.name}</text>`;
        html += `<rect x="${x0}" y="${y + 2}" width="${maxW}" height="24" rx="7" fill="rgba(148,163,184,0.14)"/>`;
        if (wBase > 0) html += `<rect x="${x0}" y="${y + 2}" width="${wBase.toFixed(1)}" height="24" rx="7" fill="${d.col}"/>`;
        if (wAdd > 0) html += `<rect x="${(x0 + wBase).toFixed(1)}" y="${y + 2}" width="${wAdd.toFixed(1)}" height="24" rx="5" fill="var(--tax-amber)"/>`;
        html += `<text x="${(x0 + wBase + wAdd + 8).toFixed(1)}" y="${y + 19}" fill="${d.out ? 'var(--tax-muted)' : (total >= 50 ? 'var(--tax-green)' : 'var(--tax-ink)')}" font-size="12.5" font-weight="900">${d.out ? '已淘汰（22%→A, 2%→C）' : total + '%' + (total >= 50 ? ' 🏆 逆转当选！' : '')}</text>`;
      });

      svg.innerHTML = html;

      ahaBox.innerHTML = round === 2
        ? '<strong>排序复选大逆转（A 31% + 22% = 53% 过半胜出）！</strong>支持 B 的选民不再害怕“投小众就是浪费选票”，因为万一 B 垫底出局，选票会自动流给他们的第二顺位 A——一举粉碎剧透分票陷阱！'
        : '<strong>第 1 轮（无人过半）：</strong>在简单多数决里 C 已经赢了；但在 IRV 里必须过 50%！点「🔁 第 2 轮：淘汰末位 B」看选票转移流向！';
    }

    document.getElementById('r1Btn').onclick = () => { round = 1; render(); };
    document.getElementById('r2Btn').onclick = () => { round = 2; markDone('演练了排序复选制IRV选票转移逆转'); render(); };
    render();
  </script>
</body>
</html>
