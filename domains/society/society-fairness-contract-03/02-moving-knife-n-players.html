<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多人分蛋糕：移动刀法 (Moving Knife)</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .stage { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 14px; }
    .players-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    @media (max-width: 720px) { .players-grid { grid-template-columns: repeat(2, 1fr); } }
    .pl-card { background: var(--tax-surface); border: 1.5px solid var(--tax-border); border-radius: 10px; padding: 10px; }
    .pl-card.done { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .pl-name { font-size: 13px; font-weight: 800; color: var(--tax-ink); }
    .pl-pref { font-size: 11.5px; color: var(--tax-muted); margin: 3px 0 6px; }
    .pl-val { font-size: 18px; font-weight: 900; color: var(--tax-primary); }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🔪 多人分蛋糕：移动刀法 (Moving Knife)</h1>
      <p>如果是 <strong>4 个人</strong>分一块口味不均的蛋糕，怎么保证每人至少拿到心目中的 1/4（25%）？杜宾斯-斯帕尼尔移动刀法：切刀从左到右缓缓滑过，<strong>谁先觉得刀左侧够自己心里的 25% 就大喊“停！”</strong>拿走并离场！</p>
    </header>

    <div class="toy-controls">
      <div class="toy-btn-row">
        <button class="toy-btn primary" id="startBtn">▶️ 启动移动切刀</button>
        <button class="toy-btn" id="resetBtn">重置蛋糕</button>
      </div>
      <span style="font-size:13px;color:var(--tax-muted);">切刀位置：<strong id="posVal" style="color:var(--tax-ink);">0%</strong></span>
    </div>

    <div class="stage">
      <svg id="knifeSvg" viewBox="0 0 640 120" style="width:100%;height:auto;display:block;"></svg>
      <div class="players-grid" id="playersGrid"></div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 移动刀法看点：</strong>点击「启动移动切刀」，看 4 位分别偏爱坚果、抹茶、草莓、奶油的玩家如何在不同位置精准喊停，最后一位留守玩家往往还能拿走远超 25% 的大礼！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    // 4 flavor zones across 0..100: [0-25 Nut], [25-50 Matcha], [50-75 Berry], [75-100 Cream]
    const zoneColors = ['rgba(180,83,9,0.75)', 'rgba(16,185,129,0.75)', 'rgba(244,63,94,0.75)', 'rgba(59,130,246,0.75)'];
    const zoneNames = ['🌰 坚果', '🍵 抹茶', '🍓 草莓', '🍦 奶油'];

    const basePlayers = [
      { id: 0, name: '玩家 A', prefText: '最爱坚果', w: [0.55, 0.15, 0.15, 0.15] },
      { id: 1, name: '玩家 B', prefText: '最爱抹茶', w: [0.15, 0.55, 0.15, 0.15] },
      { id: 2, name: '玩家 C', prefText: '最爱草莓', w: [0.15, 0.15, 0.55, 0.15] },
      { id: 3, name: '玩家 D', prefText: '最爱奶油', w: [0.10, 0.15, 0.20, 0.55] }
    ];

    let knifePos = 0;
    let lastCut = 0;
    let cuts = [];
    let claims = {}; // playerId -> { start, end, val }
    let timer = null;
    let interacted = false;

    const svg = document.getElementById('knifeSvg');

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function calcIntervalValue(p, startPct, endPct) {
      let total = 0;
      for (let z = 0; z < 4; z++) {
        const zStart = z * 25, zEnd = (z + 1) * 25;
        const overlap = Math.max(0, Math.min(endPct, zEnd) - Math.max(startPct, zStart));
        total += (overlap / 25) * p.w[z];
      }
      return total;
    }

    function resetSim() {
      if (timer) { clearInterval(timer); timer = null; }
      knifePos = 0;
      lastCut = 0;
      cuts = [];
      claims = {};
      render();
    }

    function tick() {
      knifePos += 1;
      const remaining = basePlayers.filter(p => !claims[p.id]);

      if (remaining.length === 1) {
        // Last player gets everything left!
        const lastP = remaining[0];
        const v = calcIntervalValue(lastP, lastCut, 100);
        claims[lastP.id] = { start: lastCut, end: 100, val: v };
        knifePos = 100;
        clearInterval(timer);
        timer = null;
        render();
        return;
      }

      // Check if any remaining player hits >= 25% on [lastCut, knifePos]
      for (const p of remaining) {
        const v = calcIntervalValue(p, lastCut, knifePos);
        if (v >= 0.25) {
          claims[p.id] = { start: lastCut, end: knifePos, val: v };
          cuts.push({ pos: knifePos, who: p.name });
          lastCut = knifePos;
          break;
        }
      }

      if (knifePos >= 100) {
        clearInterval(timer);
        timer = null;
      }
      render();
    }

    function render() {
      document.getElementById('posVal').textContent = knifePos + '%';
      const W = 640, padX = 20, y = 26, h = 58, cw = W - padX * 2;
      const sx = pct => padX + (pct / 100) * cw;

      let zonesHtml = '';
      for (let z = 0; z < 4; z++) {
        const x = sx(z * 25);
        zonesHtml += `
          <rect x="${x.toFixed(1)}" y="${y}" width="${(cw / 4).toFixed(1)}" height="${h}" fill="${zoneColors[z]}" stroke="var(--tax-surface)" stroke-width="1"/>
          <text x="${(x + cw / 8).toFixed(1)}" y="${y + 34}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${zoneNames[z]}</text>
        `;
      }

      let cutsHtml = cuts.map(c => `
        <line x1="${sx(c.pos).toFixed(1)}" y1="${y - 6}" x2="${sx(c.pos).toFixed(1)}" y2="${y + h + 8}" stroke="var(--tax-ink)" stroke-width="2.5"/>
        <text x="${sx(c.pos).toFixed(1)}" y="${y + h + 22}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--tax-ink)">${c.who}喊停(${c.pos}%)</text>
      `).join('');

      const kx = sx(knifePos);
      const knifeLine = knifePos < 100
        ? `<line x1="${kx.toFixed(1)}" y1="${y - 12}" x2="${kx.toFixed(1)}" y2="${y + h + 10}" stroke="var(--tax-amber)" stroke-width="3.2" stroke-dasharray="5,3"/>`
        : '';

      svg.innerHTML = zonesHtml + cutsHtml + knifeLine;

      const grid = document.getElementById('playersGrid');
      grid.innerHTML = basePlayers.map(p => {
        const c = claims[p.id];
        const liveVal = c ? c.val : calcIntervalValue(p, lastCut, knifePos);
        return `
          <div class="pl-card ${c ? 'done' : ''}">
            <div class="pl-name">${p.name} ${c ? '✅' : ''}</div>
            <div class="pl-pref">${p.prefText}</div>
            <div class="pl-val">${Math.round(liveVal * 100)}%</div>
            <div style="font-size:11px;color:var(--tax-muted);">${c ? `拿走 ${c.start}%~${c.end}% 区间` : '盯紧当前待切区...'}</div>
          </div>
        `;
      }).join('');

      const doneCount = Object.keys(claims).length;
      const aha = document.getElementById('ahaBox');
      if (knifePos === 0) {
        aha.innerHTML = `<strong>💡 移动刀法看点：</strong>点击「启动移动切刀」，看 4 位不同口味的玩家如何通过“谁先满意谁先喊停”完成比例公平分配。`;
      } else if (doneCount < 4) {
        aha.innerHTML = `<strong>🔪 切刀滑动中（${knifePos}%）：</strong>已有 <strong>${doneCount} 位玩家</strong>在恰好达到心目中 25% 估值时果断喊停离场！注意：其他人没喊停，说明在他们眼里剩下的部分依然大于 75%（或 50%）。`;
      } else {
        const lastVal = Math.round(claims[3].val * 100);
        aha.innerHTML = `<strong>🎉 4 人全部达成比例公平（均 ≥ 25%）！</strong>前三位玩家分别在最合口味的区域精准喊停拿走 25%，而最后一位留守玩家 D 竟然独享了自己最爱的奶油整块——主观满足度高达 <strong>${lastVal}%</strong>！`;
      }
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      markDone('启动了多人移动刀法分蛋糕竞速');
      if (knifePos >= 100) resetSim();
      if (timer) clearInterval(timer);
      timer = setInterval(tick, 45);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      markDone('重置了移动刀法蛋糕');
      resetSim();
    });

    render();
  </script>
</body>
</html>
