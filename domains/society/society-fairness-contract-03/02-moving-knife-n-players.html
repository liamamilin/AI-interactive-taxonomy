<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔪 多人分蛋糕：移动刀法 (Moving Knife)</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🔪 多人分蛋糕：移动刀法 (Moving Knife)</h1><p>误区：两个人可以“你切我选”，三个人分蛋糕就只能靠大家猜拳碰运气了。真相：让一把刀从左往右匀速移动，谁觉得左边刚好够 1/3 就立刻喊停拿走它——这能保证每个人绝对不嫉妒！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>移动切刀当前扫过进度</span><span id="vKnife">33%</span></label><input type="range" id="sKnife" min="5" max="90" value="33" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>最心急的甲对左端草莓的偏爱</span><span id="vA">55%</span></label><input type="range" id="sA" min="34" max="80" value="55" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">甲眼中左侧蛋糕价值</div><div class="k-val" id="kVal" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">是否触发喊“停”拿走</div><div class="k-val" id="kStop">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const k=+document.getElementById('sKnife').value, a=+document.getElementById('sA').value;
  document.getElementById('vKnife').textContent=k+'%'; document.getElementById('vA').textContent=a+'%';
  const valA=Math.min(100, Math.round(k*(a/35)));
  const stop=valA>=33;
  document.getElementById('kVal').textContent=valA+'%';
  document.getElementById('kStop').textContent=stop?'✋ 甲喊停！拿走左侧':'继续向右滑...';
  document.getElementById('kStop').style.color=stop?'#10b981':'#64748b';
  const kx=40+k*5.2;
  document.getElementById('svg').innerHTML=`
    <rect x="40" y="55" width="520" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="55" width="${k*5.2}" height="60" rx="8" fill="${stop?'#10b981':'#38bdf8'}" opacity="0.5"/>
    <line x1="${kx}" y1="35" x2="${kx}" y2="135" stroke="#ef4444" stroke-width="3.5"/>
    <text x="${kx}" y="26" text-anchor="middle" font-size="12.5" font-weight="850" fill="#ef4444">移动刀 ${k}%</text>
    <text x="40" y="162" font-size="12.5" font-weight="800" fill="var(--tax-text)">先喊停的人拿走自认为 ≥33.3% 的一块；剩下两人退回“你切我选”！</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>移动刀法把 N 人公平分蛋糕递归降维成 N-1 人：谁先觉得够 1/3 就先喊停拿走，没喊停的人心里依然觉得剩下的 ≥ 2/3，全员无怨言！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
