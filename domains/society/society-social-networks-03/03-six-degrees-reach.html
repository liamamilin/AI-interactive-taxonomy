<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📡 六度分隔指数覆盖半径计算器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📡 六度分隔指数覆盖半径计算器</h1><p>误区：地球有 80 亿人，哪怕每个人都认识 50 个人，随便找一个陌生人也要转几十次才能联系上。真相：指数级树状扩散下，只要人均 45 个跨圈好友，5~6 跳就足以触达全人类！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>人均有效社交好友数 d</span><span id="vD">45 人</span></label><input type="range" id="sD" min="10" max="100" value="45" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>每跳共同好友重复折损率</span><span id="vO">20%</span></label><input type="range" id="sO" min="0" max="60" value="20" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">3 跳触达人数</div><div class="k-val" id="k3">—</div></div>
        <div class="kpi"><div class="k-lbl">6 跳触达人数</div><div class="k-val" id="k6" style="color:#0284c7;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function fmt(n){ if(n>=1e8) return (n/1e8).toFixed(1)+' 亿'; if(n>=1e4) return (n/1e4).toFixed(1)+' 万'; return Math.round(n)+' 人'; }
function upd(){
  const d=+document.getElementById('sD').value, ov=+document.getElementById('sO').value/100;
  document.getElementById('vD').textContent=d+' 人'; document.getElementById('vO').textContent=(ov*100).toFixed(0)+'%';
  const eff=d*(1-ov);
  const hops=[1,2,3,4,5,6].map(h=>Math.min(8e9, Math.pow(eff,h)));
  document.getElementById('k3').textContent=fmt(hops[2]);
  document.getElementById('k6').textContent=fmt(hops[5]);
  let svg='';
  hops.forEach((v,i)=>{
    const logW=Math.log10(Math.max(10,v))/10*430, y=18+i*26;
    svg+=`<text x="16" y="${y+16}" font-size="12" font-weight="800" fill="var(--tax-text)">第 ${i+1} 跳</text>
    <rect x="75" y="${y}" width="${logW}" height="18" rx="5" fill="${i===5?'#10b981':'#0284c7'}"/>
    <text x="${82+logW}" y="${y+14}" font-size="11.5" font-weight="800" fill="var(--tax-muted)">${fmt(v)}</text>`;
  });
  document.getElementById('svg').innerHTML=svg;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>人类大脑最不擅长直觉感受指数增长！即使扣除 ${(ov*100).toFixed(0)}% 的圈内重复，每人平均 ${d} 个熟人只要经过 6 次扩散，覆盖半径就高达 <strong>${fmt(hops[5])}</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
