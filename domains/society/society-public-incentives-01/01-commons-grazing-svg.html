<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🌿 公共牧场放牧过度模拟器（SVG）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🌿 公共牧场放牧过度模拟器（SVG）</h1><p>误区：公共草地被啃光是因为牧民太愚蠢或道德败坏。真相：多养一头牛的好处全归自己，草地退化的代价却由全村人平摊，个体理性必然导致集体崩溃！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>总放牧牛数 C</span><span id="vC">18 头</span></label><input type="range" id="sC" min="2" max="40" value="18" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>单头牛饲养成本</span><span id="vK">12 元</span></label><input type="range" id="sK" min="4" max="24" value="12" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">草场总净利润</div><div class="k-val" id="kProf">—</div></div>
        <div class="kpi"><div class="k-lbl">社会最优牛数</div><div class="k-val" id="kOpt" style="color:#10b981;">—</div></div>
        <div class="kpi"><div class="k-lbl">自由放牧均衡牛数</div><div class="k-val" id="kNash" style="color:#ef4444;">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const c=+document.getElementById('sC').value, k=+document.getElementById('sK').value;
  document.getElementById('vC').textContent=c+' 头'; document.getElementById('vK').textContent=k+' 元';
  const prof=n=>Math.max(-200, n*(48-n) - n*k);
  const opt=Math.max(1, Math.round((48-k)/2));
  const nash=Math.max(1, 48-k);
  const cur=prof(c);
  document.getElementById('kProf').textContent=cur+' 元';
  document.getElementById('kOpt').textContent=opt+' 头';
  document.getElementById('kNash').textContent=nash+' 头';
  let pts='';
  const maxP=Math.max(50, prof(opt));
  for(let n=1;n<=40;n++){
    const x=35+(n-1)/39*530;
    const y=150 - Math.max(-0.2, prof(n)/maxP)*115;
    pts+=`${x.toFixed(1)},${y.toFixed(1)} `;
  }
  const cx=35+(c-1)/39*530, cy=150 - Math.max(-0.2, cur/maxP)*115;
  const ox=35+(opt-1)/39*530, oy=150 - 115;
  document.getElementById('svg').innerHTML=`
    <line x1="35" y1="150" x2="565" y2="150" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pts}"/>
    <circle cx="${ox}" cy="${oy}" r="5" fill="#10b981"/>
    <text x="${ox}" y="${oy-10}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#10b981">最优 ${opt}头</text>
    <circle cx="${cx}" cy="${cy}" r="6.5" fill="${c>opt?'#ef4444':'#0284c7'}"/>
    <text x="${Math.min(520,cx+8)}" y="${Math.max(22,cy+15)}" font-size="12" font-weight="800" fill="var(--tax-text)">当前 ${c}头 (${cur}元)</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>社会总收益最高在 <strong>${opt} 头</strong>，但只要单头牛还赚 1 块钱，就会一直有人往里塞牛直到 <strong>${nash} 头</strong>，把全部超额利润啃成 0！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
