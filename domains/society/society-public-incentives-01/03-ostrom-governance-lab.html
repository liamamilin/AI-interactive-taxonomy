<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏛️ 奥斯特罗姆自治制度 20 年演化沙盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>🏛️ 奥斯特罗姆自治制度 20 年演化沙盘</h1><p>误区：解决公地悲剧只有两条路——要么全部私有化，要么由中央政府强力接管。真相：奥斯特罗姆证明，只要社区建立透明监督与梯度惩罚机制，自治同样能保住公共资源！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>社区互相监督覆盖率</span><span id="vMon">60%</span></label><input type="range" id="sMon" min="0" max="100" value="60" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>偷采违规罚金倍数</span><span id="vPen">2.5x</span></label><input type="range" id="sPen" min="0" max="50" value="25" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">20年后资源存量</div><div class="k-val" id="kRes">—</div></div>
        <div class="kpi"><div class="k-lbl">偷采诱因</div><div class="k-val" id="kInc">—</div></div>
        <div class="kpi"><div class="k-lbl">治理结果</div><div class="k-val" id="kSt">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function upd(){
  const mon=+document.getElementById('sMon').value/100, pen=+document.getElementById('sPen').value/10;
  document.getElementById('vMon').textContent=(mon*100).toFixed(0)+'%'; document.getElementById('vPen').textContent=pen.toFixed(1)+'x';
  const deter=mon*pen;
  const overUse=Math.max(0, 1.4 - deter*1.1);
  let stock=100, pts='40,35 ';
  for(let y=1;y<=20;y++){
    const regen=stock*0.18*(1-stock/120);
    const harvest=stock*0.14*(1+overUse*0.9);
    stock=Math.max(0, Math.min(120, stock+regen-harvest));
    pts+=`${40+y*26},${160-stock*1.2} `;
  }
  const end=Math.round(stock);
  document.getElementById('kRes').textContent=end+'%';
  document.getElementById('kInc').textContent=deter>=1?'已压制':'强烈诱惑';
  document.getElementById('kSt').textContent=end>65?'可持续自治':(end>20?'缓慢退化':'资源枯竭');
  document.getElementById('kSt').style.color=end>65?'#10b981':(end>20?'#f59e0b':'#ef4444');
  const col=end>65?'#10b981':(end>20?'#f59e0b':'#ef4444');
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="${col}" stroke-width="3" points="${pts}"/>
    <text x="555" y="30" text-anchor="end" font-size="12.5" font-weight="800" fill="${col}">第20年存量: ${end}%</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>当 <code>监督率 × 罚金倍数 ≥ 1</code>（当前威慑力 ${deter.toFixed(2)}）时，社区自治无需外部接管就能实现资源的长期稳态再生！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
