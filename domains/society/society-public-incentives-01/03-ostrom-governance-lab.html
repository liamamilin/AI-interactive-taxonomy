<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>奥斯特罗姆自治制度 20 年演化沙盘</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .rule-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 640px) { .rule-grid { grid-template-columns: 1fr; } }
    .rule-btn {
      text-align: left; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 12.5px; cursor: pointer;
    }
    .rule-btn.on { border-color: var(--tax-green); background: var(--tax-green-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🏛️ 奥斯特罗姆自治制度 20 年演化沙盘（构建器）</h1>
      <p>人们曾以为破解公地悲剧只有两条路：“彻底私有化”或“政府强管”。首位女性诺贝尔经济学奖得主<strong>埃莉诺·奥斯特罗姆</strong>证明了第三条路——<strong>社区自主治理</strong>！为村里的公共渔场装配她的 3 条核心自治规则，看 20 年鱼群存量曲线如何逆转！</p>
    </header>

    <section class="toy-card">
      <div class="rule-grid" id="ruleGrid"></div>

      <svg id="simSvg" viewBox="0 0 680 195" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="奥斯特罗姆自治20年渔场存量演化曲线"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>无规则基准（0/3 规则）：</strong>完全放任捕捞时，鱼群在第 6 年就被捞空彻底崩溃！逐个点亮上方奥斯特罗姆 3 条自治设计原则，把渔场救回 20 年永续丰收！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const RULES = [
      { id: 'bound', name: '🗺️ 1. 清晰边界与配额', sub: '明确哪些村民有权捕鱼，拒绝对外无限开放', on: false },
      { id: 'mon',   name: '👀 2. 社区互相监督',   sub: '渔民日常作业顺手互查渔网，极低监督成本', on: false },
      { id: 'sanc',  name: '⚖️ 3. 分级递增处罚',   sub: '初犯口头警告，累犯停权罚款，既宽容又有威慑', on: false }
    ];

    let done = false;
    const ruleGrid = document.getElementById('ruleGrid');
    const svg = document.getElementById('simSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function simulate(cnt) {
      // 20-year stock trajectory (start 100)
      const pts = [];
      let stock = 100;
      for (let y = 0; y <= 20; y++) {
        pts.push({ y, s: Math.round(stock) });
        if (cnt === 0) stock = Math.max(0, stock * 0.68 - 6);
        else if (cnt === 1) stock = Math.max(8, stock * 0.86 - 3);
        else if (cnt === 2) stock = Math.max(42, stock * 0.94 + 2.5);
        else stock = Math.min(96, stock * 0.97 + 2.8); // Sustainable steady state ~92!
      }
      return pts;
    }

    function render() {
      ruleGrid.innerHTML = '';
      RULES.forEach(r => {
        const b = document.createElement('button');
        b.className = 'rule-btn' + (r.on ? ' on' : '');
        b.innerHTML = `<div style="font-weight:800;">${r.on ? '✓ ' : '○ '}${r.name}</div><div style="font-size:11.5px;color:var(--tax-muted);margin-top:3px;">${r.sub}</div>`;
        b.onclick = () => { r.on = !r.on; markDone('装配了奥斯特罗姆公共池塘自治制度'); render(); };
        ruleGrid.appendChild(b);
      });

      const cnt = RULES.filter(r => r.on).length;
      const data = simulate(cnt);
      const endS = data[20].s;
      const col = cnt === 3 ? 'var(--tax-green)' : (cnt === 2 ? 'var(--tax-primary)' : (cnt === 1 ? 'var(--tax-amber)' : 'var(--tax-red)'));

      const xOf = y => 48 + (y / 20) * 592;
      const yOf = s => 165 - (s / 100) * 125;

      let html = '';
      [0, 50, 100].forEach(v => {
        html += `<line x1="48" y1="${yOf(v)}" x2="640" y2="${yOf(v)}" stroke="var(--tax-border)" stroke-dasharray="3 3"/>`;
        html += `<text x="40" y="${yOf(v) + 4}" text-anchor="end" fill="var(--tax-muted)" font-size="11">${v}%</text>`;
      });
      [0, 5, 10, 15, 20].forEach(y => {
        html += `<text x="${xOf(y)}" y="185" text-anchor="middle" fill="var(--tax-muted)" font-size="11">第${y}年</text>`;
      });

      const poly = data.map(p => `${xOf(p.y).toFixed(1)},${yOf(p.s).toFixed(1)}`).join(' ');
      html += `<polyline points="${poly}" fill="none" stroke="${col}" stroke-width="3.5"/>`;
      html += `<circle cx="${xOf(20)}" cy="${yOf(endS)}" r="7" fill="${col}" stroke="#fff" stroke-width="2"/>`;
      html += `<text x="340" y="24" text-anchor="middle" fill="${col}" font-size="13" font-weight="800">已装配 ${cnt}/3 项自治原则 · 第 20 年鱼群存量：${endS}%</text>`;
      svg.innerHTML = html;

      if (cnt === 3) {
        ahaBox.innerHTML = `<strong>奥斯特罗姆永续自治达成（20 年稳态存量 ${endS}%）！</strong>从瑞士高山牧场、日本百年村落森林到现代 Wikipedia 与开源社区，只要具备<strong>清晰边界 + 互助监督 + 分级处罚</strong>，人类完全能自发打破公地悲剧！`;
      } else {
        ahaBox.innerHTML = `<strong>当前第 20 年存量 ${endS}%（已装 ${cnt}/3 项）：</strong>缺少监督或处罚的规则只是一纸空文！把剩下的 ${3 - cnt} 条原则全部点亮看看 20 年稳态曲线！`;
      }
    }

    render();
  </script>
</body>
</html>
