<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>公共品众筹与搭便车困境</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    @media (max-width: 600px) { .btn-row { grid-template-columns: 1fr; } }
    .choice-btn {
      padding: 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); font-size: 13px; font-weight: 700; cursor: pointer; text-align: left;
    }
    .choice-btn:hover { border-color: var(--tax-primary); }
    .res-box { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); font-size: 13.5px; line-height: 1.65; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🚌 公共品众筹与搭便车困境（4 人匿名博弈情景）</h1>
      <p>你和 3 位邻居每人手握 <strong>¥100</strong>，准备众筹给小区修路灯。公共池有政府 <strong>2 倍配捐</strong>（总池 ×2 后平均分给 4 人，无论谁没出钱都能享受路灯！）。你会出多少钱？</p>
    </header>

    <section class="toy-card">
      <div style="font-size:13px;color:var(--tax-muted);">规则：每捐出 ¥1，你个人只能分回 ¥0.50（因为要 4 人平分），但 4 人全捐每人都能拿回 ¥200！</div>

      <div class="btn-row">
        <button class="choice-btn" id="c0">🦊 捐 ¥0（坐等搭便车）<div style="font-size:11.5px;color:var(--tax-muted);margin-top:3px;">保住自己 ¥100，白嫖别人修的路灯</div></button>
        <button class="choice-btn" id="c50">⚖️ 捐 ¥50（折中观望）<div style="font-size:11.5px;color:var(--tax-muted);margin-top:3px;">出一半力，防自己当冤大头</div></button>
        <button class="choice-btn" id="c100">🤝 捐 ¥100（全心共建）<div style="font-size:11.5px;color:var(--tax-muted);margin-top:3px;">押注大家一起把蛋糕翻倍</div></button>
      </div>

      <div class="res-box" id="resBox">请选择你的匿名捐款额，对比“邻居都合作”和“邻居也想搭便车”两种开奖结果！</div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>搭便车悖论（Free-Rider Problem）：</strong>正因为公共品（国防、路灯、开源软件）具有<strong>非排他性</strong>（没付钱也赶不走），纯粹靠自愿众筹往往陷入纳什均衡——人人捐 ¥0，大家一起摸黑走路！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const resBox = document.getElementById('resBox');
    const ahaBox = document.getElementById('ahaBox');
    let done = false;

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function play(myPut) {
      markDone(`参与了公共品搭便车博弈（选择捐款 ¥${myPut}）`);
      // Scenario A: 3 neighbors all donate ¥100 (cooperate)
      const poolCoop = (300 + myPut) * 2;
      const myCoop = (100 - myPut) + poolCoop / 4;
      // Scenario B: 3 neighbors all free-ride (¥0)
      const poolFree = myPut * 2;
      const myFree = (100 - myPut) + poolFree / 4;

      resBox.innerHTML = `
        <div style="font-weight:800;color:var(--tax-primary);margin-bottom:8px;">你的选择：捐出 ¥${myPut}（自留 ¥${100 - myPut}）</div>
        <div>🌟 <strong>若 3 位邻居都慷慨捐 ¥100：</strong>你最终净得 <strong style="color:var(--tax-green);">¥${myCoop}</strong>（${myPut === 0 ? '搭便车赚翻了！比好心邻居多拿 ¥100！' : (myPut === 100 ? '全员共赢，每人 ¥200！' : '居中赚得 ¥225')}）</div>
        <div style="margin-top:6px;">❄️ <strong>若 3 位邻居也聪明地捐 ¥0：</strong>你最终净得 <strong style="color:${myFree < 100 ? 'var(--tax-red)' : 'var(--tax-amber)'};">¥${myFree}</strong>（${myPut === 0 ? '保住 ¥100，但全小区一片漆黑！' : '惨变冤大头，倒亏 ¥' + (100 - myFree) + '！'}）</div>
      `;

      ahaBox.innerHTML = myPut === 0
        ? '<strong>严格占优策略（搭便车 ¥0）：</strong>无论邻居捐不捐，捐 ¥0 永远比捐 ¥100 多拿 ¥50！当 4 个人都这么算精明账时，全员落入 <strong>¥100 摸黑均衡</strong>，白白丢掉了全员 ¥200 的超级红利！这就是为什么现代社会需要税收、物业费和强制分摊机制来供给公共品！'
        : `<strong>合作者的脆弱性（你捐了 ¥${myPut}）：</strong>如果别人也合作，大家一起把蛋糕翻倍；但只要有 1–2 个搭便车者，好心人就会变成冤大头并在下一轮被迫停止捐款！`;
    }

    document.getElementById('c0').onclick = () => play(0);
    document.getElementById('c50').onclick = () => play(50);
    document.getElementById('c100').onclick = () => play(100);
  </script>
</body>
</html>
