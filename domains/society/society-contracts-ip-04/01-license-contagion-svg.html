<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开源协议“传染性”依赖树检测器</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .tree-card { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 14px; }
    .dep-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    @media (max-width: 680px) { .dep-grid { grid-template-columns: 1fr; } }
    .dep-box { background: var(--tax-surface); border: 2px solid var(--tax-border); border-radius: 10px; padding: 10px; }
    .dep-box.danger { border-color: var(--tax-red); background: var(--tax-red-soft); }
    .dep-box.safe { border-color: var(--tax-green); }
    .dep-title { font-weight: 800; font-size: 13px; color: var(--tax-ink); margin-bottom: 6px; }
    select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--tax-border); background: var(--tax-surface-alt); color: var(--tax-ink); font-weight: 700; font-size: 12.5px; }
    svg text { font-family: inherit; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🧬 开源协议“传染性”依赖树检测器</h1>
      <p>你的商业产品（想保持<strong>闭源收费</strong>）引入了 3 个开源依赖库。切换部署形态（分发安装包 vs 云端 SaaS）并修改各依赖库的开源协议，实时检测你的核心闭源代码会不会被 Copyleft 协议“传染”迫使开源！</p>
    </header>

    <div class="toy-controls">
      <div class="toy-btn-row">
        <button class="toy-btn primary" id="distBtn">📦 分发形态：客户端/本地私有化安装包</button>
        <button class="toy-btn" id="saasBtn">☁️ 分发形态：纯云端 SaaS（仅提供网页 API）</button>
      </div>
    </div>

    <div class="tree-card">
      <svg id="depSvg" viewBox="0 0 640 190" style="width:100%;height:auto;display:block;"></svg>

      <div class="dep-grid">
        <div class="dep-box" id="box0">
          <div class="dep-title">🧩 依赖 A：UI 组件库</div>
          <select id="sel0">
            <option value="MIT">MIT（极度宽松）</option>
            <option value="Apache-2.0">Apache 2.0（宽松+专利保护）</option>
            <option value="LGPL">LGPL（动态链接隔离）</option>
            <option value="GPL-3.0">GPL-3.0（强传染 Copyleft）</option>
            <option value="AGPL-3.0">AGPL-3.0（云端也传染）</option>
          </select>
        </div>
        <div class="dep-box" id="box1">
          <div class="dep-title">⚙️ 依赖 B：核心引擎（静态编入）</div>
          <select id="sel1">
            <option value="MIT">MIT（极度宽松）</option>
            <option value="Apache-2.0" selected>Apache 2.0（宽松+专利保护）</option>
            <option value="LGPL">LGPL（动态链接隔离）</option>
            <option value="GPL-3.0">GPL-3.0（强传染 Copyleft）</option>
            <option value="AGPL-3.0">AGPL-3.0（云端也传染）</option>
          </select>
        </div>
        <div class="dep-box" id="box2">
          <div class="dep-title">🗄️ 依赖 C：数据库驱动</div>
          <select id="sel2">
            <option value="MIT">MIT（极度宽松）</option>
            <option value="Apache-2.0">Apache 2.0（宽松+专利保护）</option>
            <option value="LGPL">LGPL（动态链接隔离）</option>
            <option value="GPL-3.0" selected>GPL-3.0（强传染 Copyleft）</option>
            <option value="AGPL-3.0">AGPL-3.0（云端也传染）</option>
          </select>
        </div>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 依赖树检测提示：</strong>试着把「分发形态」从客户端切换成「云端 SaaS」，看看 <strong>GPL-3.0</strong> 与 <strong>AGPL-3.0</strong> 的惊人区别（为什么大厂法务对 AGPL 闻风丧胆）！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    let isSaas = false;
    let interacted = false;
    const svg = document.getElementById('depSvg');
    const sels = [document.getElementById('sel0'), document.getElementById('sel1'), document.getElementById('sel2')];
    const depNames = ['UI 组件库', '核心引擎', '数据库驱动'];

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function isInfectious(lic, saas) {
      if (lic === 'AGPL-3.0') return true;
      if (lic === 'GPL-3.0') return !saas; // GPL loophole on pure cloud SaaS
      return false; // MIT, Apache-2.0, LGPL (dynamic) safe for proprietary app
    }

    function render() {
      const lics = sels.map(s => s.value);
      const flags = lics.map(l => isInfectious(l, isSaas));
      const rootInfected = flags.some(Boolean);

      flags.forEach((bad, i) => {
        const b = document.getElementById('box' + i);
        b.className = 'dep-box ' + (bad ? 'danger' : 'safe');
      });

      const xs = [120, 320, 520];
      let edges = '', nodes = '';
      xs.forEach((x, i) => {
        const bad = flags[i];
        edges += `<line x1="320" y1="62" x2="${x}" y2="128" stroke="${bad ? 'var(--tax-red)' : 'var(--tax-green)'}" stroke-width="${bad ? 3.2 : 2}" stroke-dasharray="${bad ? 'none' : '5,4'}"/>`;
        nodes += `
          <rect x="${x - 76}" y="128" width="152" height="48" rx="10" fill="${bad ? 'rgba(239,68,68,0.16)' : 'rgba(16,185,129,0.14)'}" stroke="${bad ? 'var(--tax-red)' : 'var(--tax-green)'}" stroke-width="2"/>
          <text x="${x}" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="var(--tax-ink)">${depNames[i]}</text>
          <text x="${x}" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="${bad ? 'var(--tax-red)' : 'var(--tax-green)'}">${lics[i]} ${bad ? '🦠传染!' : '✅安全'}</text>
        `;
      });

      svg.innerHTML = `
        ${edges}
        <rect x="190" y="14" width="260" height="50" rx="12" fill="${rootInfected ? 'rgba(239,68,68,0.18)' : 'rgba(16,185,129,0.18)'}" stroke="${rootInfected ? 'var(--tax-red)' : 'var(--tax-green)'}" stroke-width="2.6"/>
        <text x="320" y="36" text-anchor="middle" font-size="13.5" font-weight="900" fill="var(--tax-ink)">🏢 你的商业主产品（${isSaas ? '云端 SaaS' : '分发安装包'}）</text>
        <text x="320" y="54" text-anchor="middle" font-size="11.5" font-weight="800" fill="${rootInfected ? 'var(--tax-red)' : 'var(--tax-green)'}">
          ${rootInfected ? '🚨 已被 Copyleft 传染！依法必须公开全部源码' : '🛡️ 闭源安全合规！可放心商业售卖'}
        </text>
        ${nodes}
      `;

      const aha = document.getElementById('ahaBox');
      if (lics.includes('AGPL-3.0')) {
        aha.innerHTML = `<strong>☣️ 触发最高级“AGPL 核弹”！</strong>哪怕你不分发安装包、只把软件部署在自家云端机房提供网页 SaaS 服务，<strong>AGPL-3.0</strong> 依然视同“网络分发”强制要求开源整个后端源码——这就是为什么大厂法务把 AGPL 列入头号禁令！`;
      } else if (lics.includes('GPL-3.0') && isSaas) {
        aha.innerHTML = `<strong>☁️ 著名的“GPL 云端漏洞”！</strong>由于 GPL-3.0 只在“向外部拷贝分发二进制软件”时触发传染，如果你只把它跑在自家云端服务器提供 SaaS 服务，并未触发强制开源义务！（但也正因如此，才诞生了堵死该漏洞的 AGPL。）`;
      } else if (rootInfected) {
        aha.innerHTML = `<strong>🚨 商业产品已被 GPL 传染！</strong>你在分发版软件中直接集成了 GPL-3.0 组件，哪怕只占 1% 的代码量，也必须把整个产品的商业源代码按 GPL 开源——否则将面临违约与侵权禁令！`;
      } else {
        aha.innerHTML = `<strong>✅ 商业闭源完全合规！</strong>MIT、Apache 2.0 只需保留版权声明即可自由闭源商用；LGPL 只要采用动态链接（不修改库本身）也不会传染主程序。`;
      }
    }

    sels.forEach(s => s.addEventListener('change', () => { markDone('检测了开源协议依赖树传染路径'); render(); }));
    document.getElementById('distBtn').addEventListener('click', () => {
      isSaas = false;
      document.getElementById('distBtn').classList.add('primary');
      document.getElementById('saasBtn').classList.remove('primary');
      markDone('切换至客户端分发形态');
      render();
    });
    document.getElementById('saasBtn').addEventListener('click', () => {
      isSaas = true;
      document.getElementById('saasBtn').classList.add('primary');
      document.getElementById('distBtn').classList.remove('primary');
      markDone('切换至云端 SaaS 形态');
      render();
    });

    render();
  </script>
</body>
</html>
