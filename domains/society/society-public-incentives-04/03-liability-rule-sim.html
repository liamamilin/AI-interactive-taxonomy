<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>产权规则 vs 责任规则：卡拉布雷西大教堂</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .case-box { padding: 14px; border-radius: 12px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); margin-bottom: 12px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
    .opt-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface); color: var(--tax-ink); cursor: pointer;
    }
    .opt-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .opt-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🏛️ 产权规则 vs 责任规则：大法官裁判台（情景）</h1>
      <p>法经济学名著《大教堂的一瞥》把法律保护分为两种武器：<strong>🔒 财产规则</strong>（未经我同意绝对不准碰，必须事前自愿谈判）；<strong>⚖️ 责任规则</strong>（允许你先行动，事后由法院核定公平赔偿）。为下面 3 起经典案卷选择最优规则！</p>
    </header>

    <section class="toy-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:var(--tax-muted);">
        <span id="idxTag">最高法判例 1 / 3</span>
        <span id="scoreTag" style="color:var(--tax-primary);font-weight:700;">精准裁判：0 / 3</span>
      </div>

      <div class="case-box">
        <div style="font-size:16px;font-weight:800;" id="cTitle"></div>
        <div style="font-size:12.5px;color:var(--tax-muted);margin-top:5px;" id="cDesc"></div>
        <div class="pair">
          <button class="opt-btn" id="btnProp">
            <div style="font-weight:800;font-size:14px;">🔒 适用【财产规则】</div>
            <div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">必须事前谈妥价格，否则法院下禁令禁止侵犯</div>
          </button>
          <button class="opt-btn" id="btnLiab">
            <div style="font-weight:800;font-size:14px;">⚖️ 适用【责任规则】</div>
            <div style="font-size:12px;color:var(--tax-muted);margin-top:3px;">允许先行动/发生侵权，事后按法院估价赔钱</div>
          </button>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="fbLine" style="font-size:13px;color:var(--tax-muted);">关键判准：事前双方有没有条件低成本谈妥？</span>
        <button class="toy-btn secondary" id="nextBtn" style="display:none;">下一个判例 →</button>
      </div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>大教堂黄金判准：</strong>交易成本<strong>低</strong>（买卖二手车/房屋）→ 用<strong>财产规则</strong>保护主观估值；交易成本<strong>极高</strong>（紧急避险/车祸/修高铁拆迁）→ 用<strong>责任规则</strong>防止敲竹杠与死锁！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const CASES = [
      {
        title: '⛵ 案卷 1：突遇 12 级台风，货船紧急强行拴在私人码头避险（经典 Vincent 案）',
        desc: '狂风大作来不及找码头老板谈判，强行靠岸虽撞坏 ¥5,000 木板，却救下了价值 ¥500 万的船和船员！',
        best: 'liab',
        fb: '必须适用【责任规则】！紧急避险时交易成本趋近无穷大（根本没时间讨价还价），法律允许船长先靠岸保命，事后照价赔偿 ¥5,000 修木板费！'
      },
      {
        title: '🏠 案卷 2：邻居看上了你家珍藏的一幅传家名画，想直接拿走再按市场价给你转账',
        desc: '双方天天见面、完全可以坐下来谈价，且这幅画对你有着极高的个人情感价值。',
        best: 'prop',
        fb: '必须适用【财产规则】！交易成本极低时绝不能允许“强买强卖事后赔钱”，否则市场秩序崩塌，法官也根本测不出你对传家宝的真实主观估值！'
      },
      {
        title: '🚗 案卷 3：每天马路上千万辆车行驶，万一发生剐蹭交通事故该如何定规矩？',
        desc: '司机出发前不可能和路上的 100 万个陌生路人挨个签合同约定“撞了赔多少”。',
        best: 'liab',
        fb: '必须适用【责任规则（侵权法+交强险）】！陌生人之间事前谈判成本无穷大，只能允许大家先合法上路，一旦出事故再由法律按统一标准定损赔偿！'
      }
    ];

    let idx = 0, score = 0, locked = false, done = false;
    const btnP = document.getElementById('btnProp');
    const btnL = document.getElementById('btnLiab');
    const fbLine = document.getElementById('fbLine');
    const nextBtn = document.getElementById('nextBtn');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const c = CASES[idx];
      locked = false;
      nextBtn.style.display = 'none';
      btnP.className = 'opt-btn';
      btnL.className = 'opt-btn';
      document.getElementById('idxTag').textContent = `最高法判例 ${idx + 1} / ${CASES.length}`;
      document.getElementById('cTitle').textContent = c.title;
      document.getElementById('cDesc').textContent = c.desc;
      fbLine.textContent = '根据事前交易成本高低选择法律保护规则';
    }

    function judge(choice) {
      if (locked) return;
      locked = true;
      const c = CASES[idx];
      const ok = choice === c.best;
      (choice === 'prop' ? btnP : btnL).classList.add(ok ? 'ok' : 'bad');
      if (ok) score++;
      document.getElementById('scoreTag').textContent = `精准裁判：${score} / ${CASES.length}`;
      fbLine.textContent = ok ? '✓ 大法官级精准裁判！' : '⚠️ 规则错配会引发效率灾难，看下方解析';
      ahaBox.innerHTML = `<strong>法经济学裁判理由：</strong>${c.fb}`;
      if (idx === CASES.length - 1) {
        markDone(`完成卡拉布雷西大教堂三案裁判（${score}/3）`);
        nextBtn.textContent = '↺ 重新审案';
      } else {
        nextBtn.textContent = '下一个判例 →';
      }
      nextBtn.style.display = 'inline-block';
    }

    btnP.onclick = () => judge('prop');
    btnL.onclick = () => judge('liab');
    nextBtn.onclick = () => {
      if (idx === CASES.length - 1) { idx = 0; score = 0; document.getElementById('scoreTag').textContent = '精准裁判：0 / 3'; }
      else idx++;
      render();
    };
    render();
  </script>
</body>
</html>
