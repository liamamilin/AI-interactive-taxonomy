<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>刺破公司面纱风险雷达（连带责任测试）</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .case-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 16px; }
    .dossier { background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 10px; padding: 14px; margin: 10px 0 14px; }
    .d-title { font-weight: 800; font-size: 15.5px; color: var(--tax-ink); margin-bottom: 6px; }
    .d-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--tax-muted); line-height: 1.65; }
    .btn-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .v-btn { padding: 12px; border-radius: 10px; border: 2px solid var(--tax-border); background: var(--tax-surface); font-weight: 800; font-size: 13.5px; cursor: pointer; color: var(--tax-ink); }
    .v-btn.ok { border-color: var(--tax-green); background: var(--tax-green-soft); color: var(--tax-green); }
    .v-btn.bad { border-color: var(--tax-red); background: var(--tax-red-soft); color: var(--tax-red); }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🗡️ 刺破公司面纱风险雷达（连带责任测试）</h1>
      <p>有限责任是保护诚实创业者的盾牌，绝不是老赖逃债的保护伞！如果老板滥用法人独立地位，法院将依法<strong>“刺破公司面纱（法人人格否认）”</strong>，判决老板用个人全部家产连带还债！请盲测审查以下 4 家欠债公司档案。</p>
    </header>

    <div class="toy-controls">
      <div class="toy-btn-row" id="tabsRow"></div>
      <span style="font-size:13px;color:var(--tax-muted);">已裁决：<strong id="progVal" style="color:var(--tax-ink);">0 / 4</strong></span>
    </div>

    <div class="case-box">
      <div class="dossier">
        <div class="d-title" id="dTitle"></div>
        <ul class="d-list" id="dList"></ul>
      </div>

      <div class="btn-pair">
        <button class="v-btn" data-v="pierce">🗡️ 刺破公司面纱（老板个人连带还债）</button>
        <button class="v-btn" data-v="shield">🛡️ 维持有限责任保护（仅以公司财产清偿）</button>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 商事法官提示：</strong>逐项查看公司财务独立性与经营记录，判断哪家公司只是正常商业失败，哪家已经踩穿了「人格混同 / 恶意逃债」红线！
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const dossiers = [
      {
        tab: '公司 A',
        title: '档案 A：星辰科技（欠供应商 300 万，账面清零）',
        bullets: [
          '公司收款长期直接打入老板个人微信与私人银行卡；',
          '老板用公司对公账户给自家买别墅、交孩子国际学校学费；',
          '未做规范财务记账，公司资金与家庭开支完全混为一谈。'
        ],
        ans: 'pierce',
        explain: '典型「财产混同」踩穿红线！老板自己都没把公司当独立法人看待，法律自然不会再给他提供有限责任护盾——依法刺破面纱，老板须以个人全部财产连带清偿！'
      },
      {
        tab: '公司 B',
        title: '档案 B：蓝鲸新能源（欠银行 800 万，研发失败破产）',
        bullets: [
          '实缴注册资本 500 万全部用于合规研发与员工发薪，有完整审计报告；',
          '对公账户与股东个人账户界限清晰，无任何私自挪用记录；',
          '因行业技术路线突然迭代导致产品滞销，最终依法申请破产清算。'
        ],
        ans: 'shield',
        explain: '必须坚决维持有限责任保护！这是典型的诚实商业失败——只要财务独立、无恶意逃债，老板最多亏光投入的 500 万股本，个人家庭房产受法律严格保护！'
      },
      {
        tab: '公司 C',
        title: '档案 C：金蝉脱壳贸易（欠货款 500 万，突击转移资产）',
        bullets: [
          '收到法院传票前一周，将公司名下 400 万核心设备以“1 万元”低价卖给老板小舅子新开的关联公司；',
          '原公司员工、仓库、客户名单全部原封不动搬进新公司继续营业；',
          '原公司只剩一个空壳和 500 万债务。'
        ],
        ans: 'pierce',
        explain: '典型「过度控制 + 恶意转移资产逃债（横向人格混同）」！法院不仅会刺破面纱追究老板个人连带责任，还会把新设的关联空壳公司一并拉下水连带赔偿！'
      },
      {
        tab: '公司 D',
        title: '档案 D：独行侠一人有限公司（欠房租 80 万）',
        bullets: [
          '该公司只有老板 1 名自然人股东（一人有限责任公司）；',
          '庭审中老板口头坚称“公私分明”，但拿不出近三年经会计师事务所出具的年度独立财务审计报告；',
          '账目残缺，无法证明公司财产独立于自己个人财产。'
        ],
        ans: 'pierce',
        explain: '《公司法》对「一人有限责任公司」实行严格的<strong>举证责任倒置</strong>：只要股东拿不出独立审计证明公私财产分离，法院直接推定财产混同、刺破面纱承担连带责任！'
      }
    ];

    let cur = 0;
    const answers = {};
    let interacted = false;

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const tabs = document.getElementById('tabsRow');
      tabs.innerHTML = '';
      dossiers.forEach((d, i) => {
        const b = document.createElement('button');
        b.className = 'toy-btn' + (i === cur ? ' primary' : '');
        const mark = answers[i] ? (answers[i] === d.ans ? '✅ ' : '❌ ') : '';
        b.textContent = mark + d.tab;
        b.addEventListener('click', () => { cur = i; render(); });
        tabs.appendChild(b);
      });

      const d = dossiers[cur];
      document.getElementById('dTitle').textContent = d.title;
      document.getElementById('dList').innerHTML = d.bullets.map(x => `<li>${x}</li>`).join('');

      const picked = answers[cur];
      document.querySelectorAll('.v-btn').forEach(btn => {
        btn.classList.remove('ok', 'bad');
        if (picked) {
          if (btn.dataset.v === d.ans) btn.classList.add('ok');
          else if (btn.dataset.v === picked) btn.classList.add('bad');
        }
      });

      document.getElementById('progVal').textContent = `${Object.keys(answers).length} / ${dossiers.length}`;
      const aha = document.getElementById('ahaBox');
      if (!picked) {
        aha.innerHTML = `<strong>💡 审查提示：</strong>判断【${d.tab}】的老板是否应当承担个人连带责任！`;
      } else {
        const ok = picked === d.ans;
        aha.innerHTML = `<strong>${ok ? '⚖️ 裁决精准！' : '⚠️ 法律红线判断偏差：'}</strong>${d.explain}`;
      }
    }

    document.querySelectorAll('.v-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        answers[cur] = btn.dataset.v;
        markDone('完成了刺破公司面纱连带责任盲测');
        render();
      });
    });

    render();
  </script>
</body>
</html>
