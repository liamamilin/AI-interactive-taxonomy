<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>阿罗不可能定理四公理权衡仪</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .ax-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    @media (max-width: 600px) { .ax-grid { grid-template-columns: 1fr; } }
    .ax-btn {
      text-align: left; padding: 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer;
    }
    .ax-btn.on { border-color: var(--tax-green); background: var(--tax-green-soft); }
    .ax-btn.popped { border-color: var(--tax-red); background: var(--tax-red-soft); }
    .verdict { padding: 12px 14px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); font-size: 13.5px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>⚖️ 阿罗不可能定理：4 项公平公理权衡仪（构建器）</h1>
      <p>诺奖得主肯尼斯·阿罗在 1951 年用数学证明：只要候选人 <strong>≥ 3 位</strong>，下面 4 条听起来天经地义的民主公理<strong>永远不可能同时满足</strong>！试着把 4 个开关同时打开，看看哪一条被迫弹飞！</p>
    </header>

    <section class="toy-card">
      <div class="ax-grid" id="axGrid"></div>
      <div class="verdict" id="verdictBox"></div>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>阿罗不可能定理：</strong>世界上不存在“绝对完美、毫无漏洞”的排序投票制度！试着去点亮第 4 个熄灭的开关，亲眼看数学矛盾如何强行弹掉另一条公理！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const AXIOMS = [
      { id: 'nodict', name: '👑 1. 非独裁（Non-dictatorship）', sub: '不能永远只听某一个独裁者说了算', on: true },
      { id: 'pareto', name: '🤝 2. 帕累托一致（Unanimity）',   sub: '如果所有人都觉得 A 比 B 好，结果必须 A 胜 B', on: true },
      { id: 'iia',    name: '🧱 3. 无关选项独立（IIA）',       sub: 'A 和 B 谁排前面，不能受退选酱油 C 的干扰', on: true },
      { id: 'trans',  name: '📏 4. 无死循环（严格传递性）',    sub: '必须给出确定排名，不能出现 A>B>C>A 悖论', on: false }
    ];

    const SYSTEMS = {
      trans:  { title: '当前退化为：两两多数决（放弃了【无死循环】）', desc: '满足非独裁、一致性和 IIA，但在孔多塞循环下会陷入 A>B>C>A 无解僵局！' },
      iia:    { title: '当前退化为：波达计数 / 排序复选（放弃了【无关选项独立】）', desc: '能稳定排出唯一名次，但多塞进一个毫无胜算的“分票酱油 C”就可能篡改 A 和 B 的胜负！' },
      nodict: { title: '当前退化为：独裁制（放弃了【非独裁】）', desc: '只要宣布“全场只按选民 #1 的清单排”，其余 3 条数学公理立刻 100% 完美成立！' },
      pareto: { title: '当前退化为：固定常值 / 随机抽签（放弃了【一致性】）', desc: '不管大家怎么投，永远硬性规定按字母顺序排——无循环、无独裁、满足 IIA，但完全无视民意！' }
    };

    let poppedId = 'trans', done = false;
    const axGrid = document.getElementById('axGrid');
    const verdictBox = document.getElementById('verdictBox');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      axGrid.innerHTML = '';
      AXIOMS.forEach(ax => {
        const b = document.createElement('button');
        b.className = 'ax-btn ' + (ax.on ? 'on' : 'popped');
        b.innerHTML = `<div style="font-weight:800;font-size:13.5px;">${ax.on ? '✅ ' : '💥 被迫牺牲：'}${ax.name}</div><div style="font-size:11.5px;color:var(--tax-muted);margin-top:4px;">${ax.sub}</div>`;
        b.onclick = () => {
          markDone('测试了阿罗不可能定理四公理冲突');
          if (!ax.on) {
            // Turn this one ON, mathematically force another one OFF!
            ax.on = true;
            const others = AXIOMS.filter(x => x.id !== ax.id && x.on);
            // Pop a predictable conflicting axiom
            const victim = others.find(x => x.id === 'iia') || others[0];
            victim.on = false;
            poppedId = victim.id;
            ahaBox.innerHTML = `<strong>数学警报！</strong>你刚把「${ax.name}」强行打开，阿罗定理立刻把「${victim.name}」弹飞了！这正是现实中各国设计投票制度只能在“允许分票效应”或“改用打分制（脱离纯排序框架）”之间妥协的根本原因。`;
          } else {
            ax.on = false;
            poppedId = ax.id;
          }
          render();
        };
        axGrid.appendChild(b);
      });

      const sys = SYSTEMS[poppedId] || SYSTEMS.trans;
      verdictBox.innerHTML = `<strong style="color:var(--tax-primary);">${sys.title}</strong><div style="margin-top:4px;color:var(--tax-muted);">${sys.desc}</div>`;
    }

    render();
  </script>
</body>
</html>
