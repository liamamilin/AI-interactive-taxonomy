<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>议程操纵者的隐形权力</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    @media (max-width: 600px) { .btn-grid { grid-template-columns: 1fr; } }
    .ag-btn {
      padding: 12px; border-radius: 10px; border: 1.5px solid var(--tax-border);
      background: var(--tax-surface-alt); color: var(--tax-ink); cursor: pointer; text-align: left;
    }
    .ag-btn.active { border-color: var(--tax-primary); background: var(--tax-primary-soft); }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🎯 议程操纵者的隐形权力（委员会主席情景）</h1>
      <p>同样是刚才那 3 位偏好纹丝不动的选民（<strong>A &gt; B &gt; C &gt; A</strong>）。现在你化身委员会主席，手里没有多一票，但你可以<strong>决定两轮淘汰赛的先后表决顺序</strong>！试试看你想让谁赢就能让谁赢！</p>
    </header>

    <section class="toy-card">
      <div class="btn-grid" id="agGrid"></div>

      <svg id="treeSvg" viewBox="0 0 680 185" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="两轮投票议程操纵对阵树"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>隐形权力法则：</strong>点击上方 3 种不同的表决顺序——选民意愿一票没变，但谁被安排到<strong>第二轮“守擂”</strong>，谁就 100% 夺冠！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const AGENDAS = [
      { id: 'c', name: '🎯 目标：暗中保送 C 赢', r1: 'A vs B', r1Win: 'A', r1Score: '2:1', r2: 'A vs C', champ: 'C', r2Score: '2:1', col: 'var(--tax-green)', aha: '<strong>保送 C 夺冠成功！</strong>先让 A 和 B 自相残杀（A 淘汰了唯一能赢 C 的 B），第二轮 C 轻松以 2:1 击败 A！' },
      { id: 'a', name: '🎯 目标：暗中保送 A 赢', r1: 'B vs C', r1Win: 'B', r1Score: '2:1', r2: 'B vs A', champ: 'A', r2Score: '2:1', col: 'var(--tax-primary)', aha: '<strong>保送 A 夺冠成功！</strong>先让 B 干掉 A 的天敌 C，第二轮 A 顺理成章 2:1 击败 B！' },
      { id: 'b', name: '🎯 目标：暗中保送 B 赢', r1: 'C vs A', r1Win: 'C', r1Score: '2:1', r2: 'C vs B', champ: 'B', r2Score: '2:1', col: 'var(--tax-amber)', aha: '<strong>保送 B 夺冠成功！</strong>先让 C 淘汰 B 的克星 A，第二轮 B 稳稳 2:1 拿下 C！' }
    ];

    let cur = AGENDAS[0], tried = new Set(['c']), done = false;
    const agGrid = document.getElementById('agGrid');
    const svg = document.getElementById('treeSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      agGrid.innerHTML = '';
      AGENDAS.forEach(a => {
        const b = document.createElement('button');
        b.className = 'ag-btn' + (a.id === cur.id ? ' active' : '');
        b.innerHTML = `<div style="font-weight:800;font-size:13.5px;">${a.name}</div><div style="font-size:11.5px;color:var(--tax-muted);margin-top:4px;">首轮先表决：${a.r1}</div>`;
        b.onclick = () => {
          cur = a;
          tried.add(a.id);
          if (tried.size >= 2) markDone('体验了委员会主席通过表决顺序操纵任意赢家');
          render();
        };
        agGrid.appendChild(b);
      });

      let html = '';
      // Round 1 box
      html += `<rect x="34" y="48" width="170" height="86" rx="12" fill="rgba(148,163,184,0.14)" stroke="var(--tax-border)" stroke-width="2"/>`;
      html += `<text x="119" y="76" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5">第一轮淘汰赛</text>`;
      html += `<text x="119" y="102" text-anchor="middle" fill="var(--tax-ink)" font-size="16" font-weight="900">${cur.r1}</text>`;
      html += `<text x="119" y="122" text-anchor="middle" fill="var(--tax-primary)" font-size="12" font-weight="700">胜者：${cur.r1Win}（${cur.r1Score}）</text>`;

      // Arrow 1 -> 2
      html += `<line x1="204" y1="91" x2="254" y2="91" stroke="var(--tax-primary)" stroke-width="3"/>`;

      // Round 2 box
      html += `<rect x="256" y="48" width="170" height="86" rx="12" fill="rgba(59,130,246,0.14)" stroke="var(--tax-primary)" stroke-width="2"/>`;
      html += `<text x="341" y="76" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5">第二轮终极对决</text>`;
      html += `<text x="341" y="102" text-anchor="middle" fill="var(--tax-ink)" font-size="16" font-weight="900">${cur.r2}</text>`;
      html += `<text x="341" y="122" text-anchor="middle" fill="${cur.col}" font-size="12" font-weight="700">守擂者 ${cur.champ} 胜（${cur.r2Score}）</text>`;

      // Arrow 2 -> Champ
      html += `<line x1="426" y1="91" x2="476" y2="91" stroke="${cur.col}" stroke-width="3"/>`;

      // Champion box
      html += `<rect x="478" y="48" width="168" height="86" rx="12" fill="rgba(16,185,129,0.18)" stroke="${cur.col}" stroke-width="2.5"/>`;
      html += `<text x="562" y="78" text-anchor="middle" fill="${cur.col}" font-size="12" font-weight="800">🏆 最终合法通过</text>`;
      html += `<text x="562" y="114" text-anchor="middle" fill="var(--tax-ink)" font-size="24" font-weight="900">方案 ${cur.champ}</text>`;

      html += `<text x="340" y="166" text-anchor="middle" fill="var(--tax-muted)" font-size="12">秘诀：让你的目标方案躲开第一轮，专等对手互杀后再出来收割！</text>`;
      svg.innerHTML = html;
      ahaBox.innerHTML = cur.aha;
    }

    render();
  </script>
</body>
</html>
