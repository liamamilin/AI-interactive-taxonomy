<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>孔多塞循环透视镜</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <style>
    .voter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .v-card { padding: 10px; border-radius: 10px; background: var(--tax-surface-alt); border: 1px solid var(--tax-border); text-align: center; font-size: 13px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="toy-shell">
    <header class="toy-header">
      <h1>🔄 孔多塞循环透视镜：理性个体为何投出“石头剪刀布”？</h1>
      <p>下面 3 位选民每个人都极其理性（偏好严格排序、绝不自相矛盾）。点击下方三场<strong>一对一单挑投票</strong>，亲眼见证集体偏好如何闭合成荒诞的死循环：<strong>A &gt; B &gt; C &gt; A</strong>！</p>
    </header>

    <section class="toy-card">
      <div class="voter-grid">
        <div class="v-card"><strong>选民 1</strong><div style="color:var(--tax-primary);font-weight:800;margin-top:4px;">A &gt; B &gt; C</div></div>
        <div class="v-card"><strong>选民 2</strong><div style="color:var(--tax-amber);font-weight:800;margin-top:4px;">B &gt; C &gt; A</div></div>
        <div class="v-card"><strong>选民 3</strong><div style="color:var(--tax-green);font-weight:800;margin-top:4px;">C &gt; A &gt; B</div></div>
      </div>

      <div class="btn-row">
        <button class="toy-btn secondary" id="abBtn">⚔️ 单挑 1：A vs B</button>
        <button class="toy-btn secondary" id="bcBtn">⚔️ 单挑 2：B vs C</button>
        <button class="toy-btn secondary" id="caBtn">⚔️ 单挑 3：C vs A</button>
        <button class="toy-btn" id="allBtn">🔄 一键展开三场循环</button>
      </div>

      <svg id="cycSvg" viewBox="0 0 680 215" width="100%" style="display:block;border-radius:12px;background:var(--tax-surface-alt);border:1px solid var(--tax-border);" aria-label="孔多塞投票循环三角图"></svg>
    </section>

    <div class="toy-aha" id="ahaBox">
      <strong>动手验证：</strong>依次点击三场一对一单挑，看看为什么 3 个完全理性的选民凑在一起，居然选不出任何一个“众望所归”的冠军！
    </div>
  </main>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const tested = new Set();
    let done = false;
    const svg = document.getElementById('cycSvg');
    const ahaBox = document.getElementById('ahaBox');

    function markDone(note) {
      if (!done) {
        done = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function render() {
      const A = { x: 340, y: 44 }, B = { x: 185, y: 174 }, C = { x: 495, y: 174 };
      let html = `
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--tax-red)"/>
          </marker>
        </defs>`;

      // Edges
      if (tested.has('ab')) {
        html += `<line x1="316" y1="64" x2="212" y2="152" stroke="var(--tax-red)" stroke-width="3.5" marker-end="url(#arr)"/>`;
        html += `<text x="234" y="96" fill="var(--tax-red)" font-size="12" font-weight="800">A 胜 B (2:1)</text>`;
      }
      if (tested.has('bc')) {
        html += `<line x1="220" y1="174" x2="458" y2="174" stroke="var(--tax-red)" stroke-width="3.5" marker-end="url(#arr)"/>`;
        html += `<text x="340" y="198" text-anchor="middle" fill="var(--tax-red)" font-size="12" font-weight="800">B 胜 C (2:1)</text>`;
      }
      if (tested.has('ca')) {
        html += `<line x1="472" y1="152" x2="366" y2="64" stroke="var(--tax-red)" stroke-width="3.5" marker-end="url(#arr)"/>`;
        html += `<text x="456" y="96" fill="var(--tax-red)" font-size="12" font-weight="800">C 胜 A (2:1)</text>`;
      }

      // Nodes
      [
        { k: 'A', p: A, col: 'var(--tax-primary)' },
        { k: 'B', p: B, col: 'var(--tax-amber)' },
        { k: 'C', p: C, col: 'var(--tax-green)' }
      ].forEach(n => {
        html += `<circle cx="${n.p.x}" cy="${n.p.y}" r="26" fill="${n.col}" opacity="0.2" stroke="${n.col}" stroke-width="2.5"/>`;
        html += `<text x="${n.p.x}" y="${n.p.y + 6}" text-anchor="middle" fill="var(--tax-ink)" font-size="17" font-weight="900">${n.k}</text>`;
      });

      if (tested.size === 3) {
        html += `<text x="340" y="128" text-anchor="middle" fill="var(--tax-red)" font-size="14" font-weight="900">🔄 孔多塞死循环！</text>`;
        html += `<text x="340" y="148" text-anchor="middle" fill="var(--tax-muted)" font-size="11.5">无论选谁，都有 2/3 的人不服！</text>`;
      } else {
        html += `<text x="340" y="128" text-anchor="middle" fill="var(--tax-muted)" font-size="12">已测 ${tested.size} / 3 场单挑</text>`;
      }
      svg.innerHTML = html;

      if (tested.size === 3) {
        markDone('验证了孔多塞三方投票循环悖论');
        ahaBox.innerHTML = '<strong>孔多塞悖论（1785 年）：</strong>即使每个选民的偏好都完全理性传递，但多数决加总后却出现了 <strong>A &gt; B &gt; C &gt; A</strong> 的非传递死循环！这意味着“所谓的唯一民意”有时在数学上根本不存在！';
      } else if (tested.size > 0) {
        ahaBox.innerHTML = `<strong>已解锁 ${tested.size} / 3 场单挑：</strong>继续把剩下的单挑也点完，亲眼看箭头如何首尾相咬形成死循环！`;
      }
    }

    document.getElementById('abBtn').onclick = () => { tested.add('ab'); render(); };
    document.getElementById('bcBtn').onclick = () => { tested.add('bc'); render(); };
    document.getElementById('caBtn').onclick = () => { tested.add('ca'); render(); };
    document.getElementById('allBtn').onclick = () => { tested.add('ab'); tested.add('bc'); tested.add('ca'); render(); };
    render();
  </script>
</body>
</html>
