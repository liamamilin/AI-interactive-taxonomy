<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谢林隔离棋盘实时演化</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .board-wrap { display: grid; grid-template-columns: 1fr 220px; gap: 16px; align-items: start; }
    @media (max-width: 720px) { .board-wrap { grid-template-columns: 1fr; } }
    .grid-box { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 14px; }
    .schelling-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; aspect-ratio: 1 / 1; max-width: 380px; margin: 0 auto; }
    .cell { border-radius: 6px; border: 1.5px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; transition: transform .15s, background .2s, border-color .2s; user-select: none; }
    .cell:hover { transform: scale(1.07); }
    .cell.empty { background: var(--tax-surface); border-color: var(--tax-border); color: var(--tax-muted); }
    .cell.type-a { background: rgba(59, 130, 246, 0.82); color: #fff; }
    .cell.type-b { background: rgba(245, 158, 11, 0.85); color: #fff; }
    .cell.unhappy { border-color: var(--tax-red); box-shadow: inset 0 0 0 2px rgba(239, 68, 68, 0.45); animation: pulse 1.1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .65; } }
    .side-panel { display: flex; flex-direction: column; gap: 10px; }
    .stat-card { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: 10px; padding: 10px 12px; }
    .stat-label { font-size: 12px; color: var(--tax-muted); }
    .stat-val { font-size: 22px; font-weight: 800; color: var(--tax-ink); margin-top: 2px; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; font-size: 12px; color: var(--tax-muted); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>🧩 谢林隔离棋盘实时演化</h1>
      <p>点击任意格子可手动切换住户（蓝 / 橙 / 空地）。当周围同类邻居比例低于你设定的「温和偏好」时，住户会闪烁红框并在下一轮搬去空地。</p>
    </header>

    <div class="toy-controls">
      <div class="control-group">
        <label>温和同类偏好阈值：<strong id="threshVal">35%</strong></label>
        <input id="threshSlider" type="range" min="20" max="75" step="5" value="35">
      </div>
      <div class="toy-btn-row">
        <button class="toy-btn primary" id="stepBtn">演化 1 轮</button>
        <button class="toy-btn" id="autoBtn">自动演化</button>
        <button class="toy-btn" id="resetBtn">随机重排社区</button>
      </div>
    </div>

    <div class="board-wrap">
      <div class="grid-box">
        <div class="schelling-grid" id="grid"></div>
        <div class="legend">
          <span><i class="dot" style="background:rgba(59,130,246,0.85)"></i>蓝户</span>
          <span><i class="dot" style="background:rgba(245,158,11,0.88)"></i>橙户</span>
          <span><i class="dot" style="background:var(--tax-surface);border:1px solid var(--tax-border)"></i>空房</span>
          <span><i class="dot" style="border:2px solid var(--tax-red)"></i>不满意（欲搬家）</span>
        </div>
      </div>

      <div class="side-panel">
        <div class="stat-card">
          <div class="stat-label">当前演化轮次</div>
          <div class="stat-val" id="roundVal">0 轮</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">社区同类聚集度</div>
          <div class="stat-val" id="segVal">50%</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">不满意住户</div>
          <div class="stat-val" id="unhappyVal">0 户</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累计搬迁次数</div>
          <div class="stat-val" id="movesVal">0 次</div>
        </div>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 空间直觉提示：</strong>试试把同类偏好只设在 <strong>35%</strong>（意味着你完全接受 65% 的邻居都是异类），然后点击「自动演化」，看看最终社区会变成什么样子。
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const N = 10;
    let cells = [];
    let round = 0;
    let totalMoves = 0;
    let timer = null;
    let interacted = false;

    const gridEl = document.getElementById('grid');
    const threshSlider = document.getElementById('threshSlider');
    const threshVal = document.getElementById('threshVal');
    const autoBtn = document.getElementById('autoBtn');

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    function initGrid() {
      stopAuto();
      cells = [];
      for (let i = 0; i < N * N; i++) {
        const r = Math.random();
        if (r < 0.42) cells.push(1);
        else if (r < 0.84) cells.push(2);
        else cells.push(0);
      }
      round = 0;
      totalMoves = 0;
      render();
    }

    function getNeighborStats(idx) {
      const type = cells[idx];
      if (type === 0) return { sameRatio: 1, happy: true, neighbors: 0 };
      const r = Math.floor(idx / N), c = idx % N;
      let same = 0, total = 0;
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          const nr = r + dr, nc = c + dc;
          if (nr >= 0 && nr < N && nc >= 0 && nc < N) {
            const nt = cells[nr * N + nc];
            if (nt !== 0) {
              total++;
              if (nt === type) same++;
            }
          }
        }
      }
      const ratio = total === 0 ? 1 : same / total;
      const thresh = Number(threshSlider.value) / 100;
      return { sameRatio: ratio, happy: ratio >= thresh, neighbors: total };
    }

    function stepOnce() {
      const unhappyIdx = [];
      const emptyIdx = [];
      for (let i = 0; i < cells.length; i++) {
        if (cells[i] === 0) emptyIdx.push(i);
        else if (!getNeighborStats(i).happy) unhappyIdx.push(i);
      }
      if (unhappyIdx.length === 0) {
        stopAuto();
        render();
        return false;
      }
      // Shuffle unhappy and empty
      unhappyIdx.sort(() => Math.random() - 0.5);
      emptyIdx.sort(() => Math.random() - 0.5);
      const count = Math.min(unhappyIdx.length, emptyIdx.length);
      for (let k = 0; k < count; k++) {
        const from = unhappyIdx[k];
        const to = emptyIdx[k];
        cells[to] = cells[from];
        cells[from] = 0;
        totalMoves++;
      }
      round++;
      render();
      return true;
    }

    function stopAuto() {
      if (timer) {
        clearInterval(timer);
        timer = null;
        autoBtn.textContent = '自动演化';
      }
    }

    function render() {
      const thresh = Number(threshSlider.value);
      threshVal.textContent = thresh + '%';
      gridEl.innerHTML = '';
      let sumRatio = 0, occ = 0, unhappy = 0;

      for (let i = 0; i < cells.length; i++) {
        const t = cells[i];
        const st = getNeighborStats(i);
        if (t !== 0) {
          occ++;
          sumRatio += st.sameRatio;
          if (!st.happy) unhappy++;
        }
        const div = document.createElement('div');
        div.className = 'cell ' + (t === 0 ? 'empty' : t === 1 ? 'type-a' : 'type-b') + (t !== 0 && !st.happy ? ' unhappy' : '');
        div.textContent = t === 0 ? '' : (st.happy ? '' : '!');
        div.title = t === 0 ? '空房（点击变为蓝户）' : `同类邻居占比 ${Math.round(st.sameRatio * 100)}%（点击切换）`;
        div.addEventListener('click', () => {
          cells[i] = (cells[i] + 1) % 3;
          markDone('手动调整了谢林社区格局');
          render();
        });
        gridEl.appendChild(div);
      }

      const avgSeg = occ ? Math.round((sumRatio / occ) * 100) : 0;
      document.getElementById('roundVal').textContent = round + ' 轮';
      document.getElementById('segVal').textContent = avgSeg + '%';
      document.getElementById('unhappyVal').textContent = unhappy + ' 户';
      document.getElementById('movesVal').textContent = totalMoves + ' 次';

      const aha = document.getElementById('ahaBox');
      if (round === 0) {
        aha.innerHTML = `<strong>💡 空间直觉提示：</strong>当前处于随机混合态，同类聚集度约 <strong>${avgSeg}%</strong>，有 <strong>${unhappy} 户</strong>不满意。点击「演化 1 轮」或「自动演化」观察连锁反应。`;
      } else if (unhappy === 0 && avgSeg >= 75) {
        aha.innerHTML = `<strong>🤯 涌现隔离达成！</strong>每个人只要求 <strong>${thresh}%</strong> 同类邻居，但经过 ${round} 轮、${totalMoves} 次搬迁后，整个社区自发锁死在 <strong>${avgSeg}% 高度隔离</strong>。微观温和偏好，足以制造宏观彻底分裂。`;
      } else if (thresh >= 65 && round >= 6 && unhappy > 5) {
        aha.innerHTML = `<strong>🌪️ 永久动荡态：</strong>当阈值高达 <strong>${thresh}%</strong> 时，社区几乎无法达到稳定均衡，搬迁不断破坏他人的安全感，引发永无止境的「洗牌」。`;
      } else if (avgSeg < 62 && unhappy === 0) {
        aha.innerHTML = `<strong>🌿 保持混合态：</strong>阈值设在 <strong>${thresh}%</strong> 时，极少有人需要搬家，社区顺利稳定在 <strong>${avgSeg}%</strong> 的多元混合状态。`;
      } else {
        aha.innerHTML = `<strong>🔄 连锁搬迁中（第 ${round} 轮）：</strong>一户搬走会让留下的同色邻居比例骤降，把原本满意的人变成新的「不满意者」。当前聚集度已升至 <strong>${avgSeg}%</strong>。`;
      }
    }

    document.getElementById('stepBtn').addEventListener('click', () => {
      markDone('执行了谢林棋盘单步演化');
      stepOnce();
    });

    autoBtn.addEventListener('click', () => {
      markDone('运行了谢林棋盘自动演化');
      if (timer) {
        stopAuto();
      } else {
        autoBtn.textContent = '暂停演化';
        timer = setInterval(() => {
          if (!stepOnce() || round >= 40) stopAuto();
        }, 280);
      }
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      markDone('重排了谢林社区棋盘');
      initGrid();
    });

    threshSlider.addEventListener('input', () => {
      markDone('调节了谢林同类偏好阈值');
      render();
    });

    initGrid();
  </script>
</body>
</html>
