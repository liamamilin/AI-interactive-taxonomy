<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📉 谢林相变曲线：30% 容忍度临界跳变</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css" />
  <script src="../../../shared/toy-sdk.js"></script>
  <style>
    .ctrl-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px; }
    .ctrl-box { padding:10px 12px; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); }
    .ctrl-box label { display:flex; justify-content:space-between; font-size:13px; font-weight:750; margin-bottom:6px; }
    .ctrl-box input[type=range] { width:100%; accent-color:var(--tax-primary); }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
    .btn { padding:8px 14px; border-radius:10px; border:1px solid var(--tax-border); background:var(--tax-surface); color:inherit; font-weight:750; font-size:13px; cursor:pointer; }
    .btn.active, .btn.primary { background:var(--tax-primary); color:#fff; border-color:var(--tax-primary); }
    .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:10px; margin-top:12px; }
    .kpi { padding:10px 12px; border-radius:12px; border:1px solid var(--tax-border); background:var(--tax-surface); }
    .kpi .k-lbl { font-size:12px; color:var(--tax-muted); font-weight:650; }
    .kpi .k-val { font-size:19px; font-weight:850; margin-top:2px; }
    .svg-box { width:100%; height:auto; border:1px solid var(--tax-border); border-radius:12px; background:var(--tax-surface); display:block; }
  </style>
</head>
<body class="tax-toy">
  <div class="tax-wrap">
    <div class="tax-topbar">
      <div><h1>📉 谢林相变曲线：30% 容忍度临界跳变</h1><p>误区：居民偏见加深 10%，社会隔离度也只会平滑地上升 10%。真相：隔离模型存在剧烈的相变阈值，跨过 33% 那道线，整个社会会突然坍缩进完全隔离！</p></div>
      <a class="tax-back" href="./index.html">← 返回主题目录</a>
    </div>
    <div class="tax-panel">
      <div class="ctrl-grid">
        <div class="ctrl-box"><label><span>当前个人同类偏好门槛</span><span id="vT">38%</span></label><input type="range" id="sT" min="10" max="70" value="38" oninput="upd()"></div>
        <div class="ctrl-box"><label><span>搬家摩擦阻力 (阻碍迁徙)</span><span id="vF">15%</span></label><input type="range" id="sF" min="0" max="60" value="15" oninput="upd()"></div>
      </div>
      <svg id="svg" class="svg-box" viewBox="0 0 600 185"></svg>
      <div class="kpi-row">
        <div class="kpi"><div class="k-lbl">稳态城市隔离指数</div><div class="k-val" id="kSeg" style="color:#0284c7;">—</div></div>
        <div class="kpi"><div class="k-lbl">所处相态</div><div class="k-val" id="kPh">—</div></div>
      </div>
    </div>
    <div class="tax-aha" id="ahaBox"></div>
  </div>
  <script>
function segFn(t,f){
  const s=1/(1+Math.exp(-(t-33)/4.5));
  return Math.round(50 + s*44*(1-f/110));
}
function upd(){
  const t=+document.getElementById('sT').value, f=+document.getElementById('sF').value;
  document.getElementById('vT').textContent=t+'%'; document.getElementById('vF').textContent=f+'%';
  const seg=segFn(t,f);
  document.getElementById('kSeg').textContent=seg+'%';
  document.getElementById('kPh').textContent=seg>72?'高度隔离相':'混居稳态相';
  document.getElementById('kPh').style.color=seg>72?'#ef4444':'#10b981';
  let pts='';
  for(let x=10;x<=70;x+=2){
    pts+=`${40+(x-10)/60*520},${160-segFn(x,f)*1.3} `;
  }
  const cx=40+(t-10)/60*520, cy=160-seg*1.3;
  document.getElementById('svg').innerHTML=`
    <line x1="40" y1="160" x2="560" y2="160" stroke="#94a3b8"/>
    <polyline fill="none" stroke="#0284c7" stroke-width="3" points="${pts}"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#ef4444"/>
    <text x="50" y="30" font-size="12" font-weight="800" fill="#0284c7">S 型相变曲线：33% 附近微小偏移引发隔离暴涨</text>`;
  document.getElementById('ahaBox').innerHTML=`💡 <strong>顿悟时刻（Aha! Moment）：</strong>社会系统从来不是线性变化的！在 33% 临界点附近，哪怕多出一丁点排他偏好，整个系统就会像水结冰一样瞬间相变为 <strong>${seg}% 隔离</strong>！`;
  if(window.ToySDK) window.ToySDK.markCompleted();
}
upd();
  </script>
</body>
</html>
