<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>谢林相变曲线：30% 容忍度临界跳变</title>
  <link rel="stylesheet" href="../../../shared/toy-base.css">
  <style>
    .chart-card { background: var(--tax-surface-alt); border: 1px solid var(--tax-border); border-radius: var(--tax-radius); padding: 16px; }
    .metrics-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .m-box { background: var(--tax-surface); border: 1px solid var(--tax-border); border-radius: 10px; padding: 10px 12px; text-align: center; }
    .m-label { font-size: 12px; color: var(--tax-muted); }
    .m-val { font-size: 20px; font-weight: 800; color: var(--tax-ink); margin-top: 2px; }
    .preset-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    svg text { fill: var(--tax-muted); font-family: inherit; }
  </style>
</head>
<body>
  <div class="toy-shell">
    <header class="toy-header">
      <h1>📉 谢林相变曲线：30% 容忍度临界跳变</h1>
      <p>隔离并不是随偏见“线性上升”的——它在 30%~40% 之间存在一道陡峭的「相变悬崖」。拖动容忍度阈值与空置率，观察曲线上的相变跳跃。</p>
    </header>

    <div class="toy-controls">
      <div class="control-group">
        <label>当前探针：同类偏好阈值 <strong id="tVal">35%</strong></label>
        <input id="tSlider" type="range" min="15" max="75" step="1" value="35">
      </div>
      <div class="control-group">
        <label>社区空房率（流动性）：<strong id="vVal">15%</strong></label>
        <input id="vSlider" type="range" min="5" max="35" step="5" value="15">
      </div>
      <div class="preset-row">
        <button class="toy-btn" data-t="25">25% 混合稳态</button>
        <button class="toy-btn" data-t="38">38% 相变临界悬崖</button>
        <button class="toy-btn" data-t="55">55% 高度隔离</button>
        <button class="toy-btn" data-t="72">72% 动荡不收敛</button>
      </div>
    </div>

    <div class="chart-card">
      <svg id="curveSvg" viewBox="0 0 640 280" style="width:100%;height:auto;display:block;"></svg>
      <div class="metrics-row">
        <div class="m-box">
          <div class="m-label">个人温和要求</div>
          <div class="m-val" id="reqMetric">35%</div>
        </div>
        <div class="m-box">
          <div class="m-label">宏观实际隔离度</div>
          <div class="m-val" id="segMetric">76%</div>
        </div>
        <div class="m-box">
          <div class="m-label">放大倍数（隔离/偏好）</div>
          <div class="m-val" id="ampMetric">2.17×</div>
        </div>
      </div>
    </div>

    <div class="aha-box" id="ahaBox">
      <strong>💡 相变洞察：</strong>拖动上方滑块或点击预设按钮，跨过 <strong>33% ~ 42%</strong> 的狭窄区间，观察个人偏好仅上升 10%，为何宏观隔离度却暴涨超过 30%。
    </div>
  </div>

  <script src="../../../shared/toy-sdk.js"></script>
  <script>
    const tSlider = document.getElementById('tSlider');
    const vSlider = document.getElementById('vSlider');
    const svg = document.getElementById('curveSvg');
    let interacted = false;

    function markDone(note) {
      if (!interacted) {
        interacted = true;
        if (window.ToySDK) window.ToySDK.markCompleted(note);
      }
    }

    // Smooth phase-transition model calibrated to Schelling 2D grid dynamics
    function calcSegregation(threshPct, vacPct) {
      const t = threshPct;
      const vacShift = (15 - vacPct) * 0.22; // Lower vacancy slightly delays mobility, higher vacancy sharpens sorting
      const center = 36 + vacShift;
      const steepness = 0.24 + (vacPct / 100) * 0.18;
      if (t >= 68) {
        // Above ~68%, system fails to freeze cleanly and drops into churning chaos
        const peak = 94 - (t - 68) * 1.9;
        return Math.max(58, Math.round(peak));
      }
      const sig = 1 / (1 + Math.exp(-steepness * (t - center)));
      const base = 50 + 45 * sig;
      return Math.min(97, Math.max(50, Math.round(base)));
    }

    function render() {
      const t = Number(tSlider.value);
      const v = Number(vSlider.value);
      document.getElementById('tVal').textContent = t + '%';
      document.getElementById('vVal').textContent = v + '%';

      const seg = calcSegregation(t, v);
      const amp = (seg / t).toFixed(2);
      document.getElementById('reqMetric').textContent = t + '%';
      document.getElementById('segMetric').textContent = seg + '%';
      document.getElementById('ampMetric').textContent = amp + '×';

      const W = 640, H = 280, padL = 56, padR = 24, padT = 22, padB = 42;
      const xScale = val => padL + ((val - 15) / 60) * (W - padL - padR);
      const yScale = val => H - padB - ((val - 40) / 60) * (H - padT - padB);

      let pathD = '';
      for (let x = 15; x <= 75; x += 1) {
        const y = calcSegregation(x, v);
        pathD += (x === 15 ? 'M' : 'L') + xScale(x).toFixed(1) + ',' + yScale(y).toFixed(1) + ' ';
      }

      const cx = xScale(t), cy = yScale(seg);
      const cliffX1 = xScale(30), cliffX2 = xScale(44);
      const chaosX = xScale(68);

      svg.innerHTML = `
        <rect x="${cliffX1}" y="${padT}" width="${cliffX2 - cliffX1}" height="${H - padT - padB}" fill="rgba(245,158,11,0.12)" />
        <rect x="${chaosX}" y="${padT}" width="${W - padR - chaosX}" height="${H - padT - padB}" fill="rgba(239,68,68,0.10)" />
        <text x="${(cliffX1 + cliffX2) / 2}" y="${padT + 14}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tax-amber)">相变悬崖区</text>
        <text x="${(chaosX + W - padR) / 2}" y="${padT + 14}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--tax-red)">动荡区</text>

        ${[50, 60, 70, 80, 90, 100].map(g => `
          <line x1="${padL}" y1="${yScale(g)}" x2="${W - padR}" y2="${yScale(g)}" stroke="var(--tax-border)" stroke-dasharray="3,4"/>
          <text x="${padL - 8}" y="${yScale(g) + 4}" text-anchor="end" font-size="11">${g}%</text>
        `).join('')}

        ${[20, 30, 40, 50, 60, 70].map(g => `
          <text x="${xScale(g)}" y="${H - padB + 18}" text-anchor="middle" font-size="11">${g}%</text>
        `).join('')}

        <line x1="${padL}" y1="${H - padB}" x2="${W - padR}" y2="${H - padB}" stroke="var(--tax-muted)"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${H - padB}" stroke="var(--tax-muted)"/>

        <!-- Diagonal reference y = x -->
        <line x1="${xScale(40)}" y1="${yScale(40)}" x2="${xScale(75)}" y2="${yScale(75)}" stroke="var(--tax-muted)" stroke-dasharray="5,5" opacity="0.5"/>
        <text x="${xScale(62)}" y="${yScale(60)}" font-size="10" opacity="0.7">若无放大效应 (y=x)</text>

        <path d="${pathD}" fill="none" stroke="var(--tax-primary)" stroke-width="3.2" stroke-linecap="round"/>

        <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${H - padB}" stroke="var(--tax-amber)" stroke-dasharray="4,3"/>
        <line x1="${padL}" y1="${cy}" x2="${cx}" y2="${cy}" stroke="var(--tax-amber)" stroke-dasharray="4,3"/>
        <circle cx="${cx}" cy="${cy}" r="7" fill="var(--tax-amber)" stroke="var(--tax-surface)" stroke-width="2.5"/>

        <text x="${W / 2}" y="${H - 6}" text-anchor="middle" font-size="12" font-weight="600">个人同类邻居最低偏好阈值 →</text>
        <text x="14" y="${H / 2}" text-anchor="middle" font-size="12" font-weight="600" transform="rotate(-90 14 ${H / 2})">最终社区隔离度</text>
      `;

      const aha = document.getElementById('ahaBox');
      if (t < 30) {
        aha.innerHTML = `<strong>🌿 临界点之前（${t}%）：</strong>个人偏好低于相变阈值，社区几乎不发生连锁迁移，隔离度停留在随机水平（<strong>${seg}%</strong>）。`;
      } else if (t <= 44) {
        aha.innerHTML = `<strong>⚡ 正处相变悬崖（${t}%）：</strong>这是谢林模型最反直觉的区域——个人仅要求 ${t}% 同类，系统却把隔离度放大 <strong>${amp} 倍</strong>至 <strong>${seg}%</strong>！空房率越高，搬家越容易，悬崖越陡峭。`;
      } else if (t < 68) {
        aha.innerHTML = `<strong>🧱 彻底锁定隔离（${t}%）：</strong>超过 45% 后，社区已进入完全分区状态（<strong>${seg}%</strong>），继续提高偏见几乎不再增加隔离，因为已经「无处可隔」。`;
      } else {
        aha.innerHTML = `<strong>🌪️ 过度挑剔导致永动崩溃（${t}%）：</strong>当要求高到 ${t}% 以上，没人能找到永久满意的格子，社区陷入持续洗牌，反而不如 55% 时边界清晰（隔离度回落至 ${seg}%）。`;
      }
    }

    tSlider.addEventListener('input', () => { markDone('探索了谢林相变曲线临界点'); render(); });
    vSlider.addEventListener('input', () => { markDone('调整了社区空房流动性参数'); render(); });
    document.querySelectorAll('[data-t]').forEach(btn => {
      btn.addEventListener('click', () => {
        tSlider.value = btn.dataset.t;
        markDone('切换了谢林相变典型状态预设');
        render();
      });
    });

    render();
  </script>
</body>
</html>
